<meta charset="utf-8">
<title>VESTRA hero film</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden}
  #stage{position:relative;width:1600px;height:900px;overflow:hidden;
    background:
      radial-gradient(58% 52% at 50% 30%, #26221e 0%, #17161a 52%, #0d0d10 100%),
      linear-gradient(#0d0d10,#0d0d10);}
  /* warm key from upper right, cool fill lower left — the same lighting the site's
     veil uses, but baked in so the video needs only a light scrim on top. */
  #key{position:absolute;inset:0;
    background:
      radial-gradient(40% 46% at 82% 6%, rgba(201,168,106,.30), transparent 72%),
      radial-gradient(46% 42% at 12% 100%, rgba(92,112,152,.18), transparent 74%);}
  /* the horizon the rail stands on */
  #horizon{position:absolute;left:0;right:0;bottom:0;height:52%;
    background:linear-gradient(to top, rgba(201,168,106,.075), transparent 68%);}
  #cam{position:absolute;inset:0;will-change:transform}
  .rail{position:absolute;left:0;top:0;width:100%;height:100%}
  .plate{position:absolute;border-radius:16px;overflow:hidden;
    background:linear-gradient(165deg,#fbfaf8,#eeebe5);
    border:1px solid rgba(201,168,106,.30);
    box-shadow:0 30px 64px -26px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.55);}
  /* The far layer is deliberately NOT a plate. A blurred white card reads as a pale
     rectangle behind the headline — the same grey-box failure that stopped the stills
     being bled full width. Stripped of its card it becomes what it should be: a wash
     of colour off the garments, giving the rail depth without putting a lit shape
     under the type. */
  .bokeh{position:absolute;background-size:contain;background-position:center bottom;
    background-repeat:no-repeat;pointer-events:none}
  .plate .img{position:absolute;inset:0;background-size:contain;background-position:center;
    background-repeat:no-repeat;will-change:transform}
  /* sheen so a row of identical cards doesn't read as a spreadsheet */
  .plate .sheen{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(150deg,rgba(255,255,255,.28),transparent 46%),
               radial-gradient(80% 58% at 50% 108%,rgba(60,52,40,.14),transparent 70%)}
  #sweep{position:absolute;top:-30%;height:160%;width:420px;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(201,168,106,.13),rgba(255,246,225,.20),rgba(201,168,106,.13),transparent);
    transform:rotate(9deg);filter:blur(28px)}
  /* Vignette, weighted to the TOP. The obvious grade -- dark at both ends -- was the
     first cut, and it buried the rail: the garments sit in the bottom eighth, the
     page's own scrim darkens that same eighth again, and a bordeaux polo under two
     stacked scrims is a brown smudge. Keep the load where the type is. */
  #vig{position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(86% 76% at 50% 44%, transparent 54%, rgba(10,10,13,.44) 100%),
      linear-gradient(to bottom, rgba(13,13,16,.46) 0%, transparent 24%,
                      transparent 76%, rgba(13,13,16,.26) 100%)}
  #grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
</style>
<div id="stage">
  <div id="key"></div>
  <div id="horizon"></div>
  <div id="cam">
    <div class="rail" id="back"></div>
    <div class="rail" id="front"></div>
  </div>
  <div id="sweep"></div>
  <div id="vig"></div>
  <div id="grain"></div>
</div>
<script>
const W = 1600, H = 900;
const IMGS = window.__IMGS__ || [];

/* Two rails at different depths. Every visual property below is a function of the
   plate's SCREEN position, never of raw time — that is what makes the loop seamless:
   at t=1 the rail has advanced by exactly one period, so plate i sits where plate
   i-1 sat at t=0 and carries identical scale, opacity and tilt. */
/* y is where the rail sits in the frame. The front rail is deliberately low: the
   headline, both calls to action and the trust line all live in this band, and the
   first cut put the plates straight through the buttons. Everything above 0.62 is
   reserved for type -- the rail owns the bottom third and nothing else. */
const LAYERS = [
  { el: document.getElementById('back'),  kind: 'bokeh', h: 300, gap: 300, y: 0.82,
    op: 0.24, blur: 30, kb: 0.05, off: 137 },
  { el: document.getElementById('front'), kind: 'plate', h: 300, gap: 340, y: 0.93,
    op: 1.00, blur: 0,  kb: 0.075, off: 0 },
];

for (const L of LAYERS) {
  L.period = IMGS.length * L.gap;
  L.plates = [];
  // three copies of the rail so the strip never runs out at either edge
  for (let k = 0; k < 3; k++) {
    for (let i = 0; i < IMGS.length; i++) {
      let p, im;
      if (L.kind === 'plate') {
        p = document.createElement('div');
        p.className = 'plate';
        im = document.createElement('div');
        im.className = 'img';
        im.style.backgroundImage = `url("${IMGS[i]}")`;
        const sh = document.createElement('div');
        sh.className = 'sheen';
        p.appendChild(im); p.appendChild(sh);
      } else {
        // offset the far rail's running order so a garment is never directly
        // behind itself — that would read as a ghost, not as depth
        p = document.createElement('div');
        p.className = 'bokeh';
        p.style.backgroundImage = `url("${IMGS[(i + 7) % IMGS.length]}")`;
        im = p;
      }
      p.style.width  = (L.h * 0.75) + 'px';
      p.style.height = L.h + 'px';
      if (L.blur) p.style.filter = `blur(${L.blur}px)`;
      L.el.appendChild(p);
      L.plates.push({ p, im, base: k * L.period + i * L.gap + L.off });
    }
  }
}

function smooth(x){ x = Math.min(1, Math.max(0, x)); return x*x*(3-2*x); }

window.setT = function (t) {
  // camera: one slow breath per loop, returns exactly to start
  const push = 1 + 0.016 * (1 - Math.cos(2*Math.PI*t)) / 2;
  document.getElementById('cam').style.transform = `scale(${push})`;

  for (const L of LAYERS) {
    const shift = -L.period * t;
    for (const q of L.plates) {
      const x = q.base + shift;
      const w = L.h * 0.75;
      if (x < -w - 40 || x > W + 40) { q.p.style.display = 'none'; continue; }
      q.p.style.display = '';
      q.p.style.left = x + 'px';
      q.p.style.top  = (H * L.y - L.h / 2) + 'px';

      // position-driven, so it repeats exactly
      const u = (x + w) / (W + 2 * w);          // 0..1 across the screen
      const kb = 1 + L.kb * (1 - Math.cos(2*Math.PI*u)) / 2;
      q.im.style.transform = `scale(${kb})`;
      // fade in/out at the frame edges instead of popping
      const edge = Math.min(smooth((x + w) / 220), smooth((W - x) / 220));
      q.p.style.opacity = (L.op * edge).toFixed(4);
    }
  }

  // two light sweeps per loop
  const s = (t * 2) % 1;
  const sw = document.getElementById('sweep');
  sw.style.left = (s * (W + 900) - 450) + 'px';
  sw.style.opacity = (Math.sin(Math.PI * s) * 0.9).toFixed(3);

  // drift the grain so it does not look like a stuck screen door
  document.getElementById('grain').style.backgroundPosition =
      `${(t*160*3)%160}px ${(t*160*2)%160}px`;
};
window.setT(0);
</script>
