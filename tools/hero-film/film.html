<meta charset="utf-8">
<title>VESTRA hero film</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden}
  #stage{position:relative;width:1600px;height:900px;overflow:hidden;
    background:
      radial-gradient(58% 52% at 50% 28%, #26221e 0%, #17161a 52%, #0d0d10 100%),
      linear-gradient(#0d0d10,#0d0d10);}
  #key{position:absolute;inset:0;
    background:
      radial-gradient(40% 46% at 84% 4%, rgba(201,168,106,.26), transparent 72%),
      radial-gradient(46% 40% at 10% 100%, rgba(92,112,152,.16), transparent 74%);}

  /* The glow belongs to whichever piece is under the spotlight, and is tinted with
     that piece's OWN colour, sampled from the packshot. It sits low and stays weak:
     the headline lives in the upper half and a bright wash behind it would move the
     type's contrast every few seconds -- the fault the still hero was built to avoid. */
  #glow{position:absolute;left:0;right:0;bottom:-14%;height:74%;pointer-events:none;
    filter:blur(58px);opacity:0;transition:none}

  #cam{position:absolute;inset:0;will-change:transform}
  /* The plate stays. Every shot in this catalogue is a garment on a white studio
     sweep, and a sweep cannot be dropped onto a dark stage bare -- it arrives as a
     white rectangle and reads as a mistake. Presented as a lit card it reads as
     deliberate. What changed from the first cut is the HIERARCHY, not the treatment:
     one large card under the spotlight instead of five identical small ones. */
  .pc{position:absolute;left:0;top:0;border-radius:16px;overflow:hidden;
    background:linear-gradient(165deg,#fbfaf8,#eeebe5);
    border:1px solid rgba(201,168,106,.32);
    box-shadow:0 34px 70px -26px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.55);
    will-change:transform,opacity}
  .pc .im{position:absolute;inset:0;background-size:contain;background-position:center;
    background-repeat:no-repeat}
  /* a soft sheen so a row of identical cards does not read as a spreadsheet */
  .pc .sh{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(150deg,rgba(255,255,255,.26),transparent 46%),
               radial-gradient(80% 58% at 50% 108%,rgba(60,52,40,.13),transparent 70%)}

  #sweep{position:absolute;top:-30%;height:160%;width:400px;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(201,168,106,.10),rgba(255,246,225,.17),rgba(201,168,106,.10),transparent);
    transform:rotate(9deg);filter:blur(30px)}
  /* Weighted to the top, where the type is. The rail sits in the bottom eighth and a
     heavy bottom stop lands on the garments a second time -- the page adds its own. */
  #vig{position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(88% 78% at 50% 42%, transparent 56%, rgba(10,10,13,.42) 100%),
      linear-gradient(to bottom, rgba(13,13,16,.48) 0%, transparent 26%,
                      transparent 78%, rgba(13,13,16,.22) 100%)}
  #grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
</style>
<div id="stage">
  <div id="key"></div>
  <div id="glow"></div>
  <div id="cam"><div id="rail"></div></div>
  <div id="sweep"></div>
  <div id="vig"></div>
  <div id="grain"></div>
</div>
<script>
const W = 1600, H = 900;
const ITEMS = window.__ITEMS__ || [];     // [{src, color}]
const N = ITEMS.length;

/* A lookbook, not a conveyor. The first cut ran every piece past the camera at a
   constant speed and at an identical size: nothing was ever the subject, so the eye
   had nowhere to rest. Here exactly one piece holds the centre at a time, large and
   lit, while its neighbours fall back -- smaller, dimmer, defocused. The rail then
   advances by ONE position, holds again, and the next piece takes the spot. */
const SPACING = 372;     // distance between neighbouring pieces
/* Height of the spotlit card. Deliberately modest: the headline, both calls to action
   and the trust line occupy the upper 60% of this band, and a card tall enough to feel
   grand reaches straight into them -- the collision the first cut already had to fix.
   The hierarchy here comes from the SIZE GAP to its neighbours and from the light, not
   from absolute size. */
const BASE_H   = 232;
/* Every card stands on the same floor. Centring them at a shared midline made the
   short ones look like they were hovering; sharing a baseline reads as a shelf. */
const BASELINE = 902;

const rail = document.getElementById('rail');
const nodes = ITEMS.map(it => {
  const p = document.createElement('div');
  p.className = 'pc';
  const sh = document.createElement('div'); sh.className = 'sh';
  const im = document.createElement('div'); im.className = 'im';
  im.style.backgroundImage = `url("${it.src}")`;
  p.appendChild(sh); p.appendChild(im);
  rail.appendChild(p);
  return { p, im, color: it.color };
});

function smooth(x){ x = Math.min(1, Math.max(0, x)); return x*x*(3-2*x); }
/* Hold, glide, hold. A linear playhead would be the conveyor again; this keeps each
   piece still for most of its turn and moves briskly between turns. */
function step(u){
  const GLIDE = 0.42;                       // share of a turn spent moving
  if (u < (1-GLIDE)/2) return 0;
  if (u > 1-(1-GLIDE)/2) return 1;
  return smooth((u - (1-GLIDE)/2) / GLIDE);
}
function hexToRgb(h){
  const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(h||'') ;
  return m ? [parseInt(m[1],16),parseInt(m[2],16),parseInt(m[3],16)] : [140,140,150];
}

window.setT = function (t) {
  const raw = t * N;
  const play = Math.floor(raw) + step(raw - Math.floor(raw));

  // camera: one slow breath per loop, returning exactly to where it began
  document.getElementById('cam').style.transform =
      `scale(${1 + 0.014 * (1 - Math.cos(2*Math.PI*t)) / 2})`;

  let lead = null, leadW = -1;
  nodes.forEach((n, i) => {
    // signed slot distance from the spotlight, wrapped to the shortest way round
    let s = i - play;
    s = ((s % N) + N) % N;
    if (s > N/2) s -= N;

    const a = Math.abs(s);
    if (a > 2.6) { n.p.style.display = 'none'; return; }
    n.p.style.display = '';

    // the spotlit piece is largest, brightest and sharpest; neighbours fall back
    const near  = Math.max(0, 1 - a);          // 1 at centre, 0 one slot away
    const scale = 0.58 + 0.42 * smooth(near);
    const h     = BASE_H * scale, w = h * 0.75;
    const lift  = 20 * smooth(near);           // the subject rises as it takes the spot
    const op    = (0.20 + 0.80 * smooth(near)) * smooth((2.6 - a) / 0.7);

    n.p.style.width  = w + 'px';
    n.p.style.height = h + 'px';
    n.p.style.left   = (W/2 - w/2 + s * SPACING) + 'px';
    n.p.style.top    = (BASELINE - h - lift) + 'px';
    n.p.style.opacity = op.toFixed(4);
    n.p.style.filter  = a > 0.06 ? `blur(${(a * 2.6).toFixed(2)}px)` : 'none';
    n.p.style.zIndex  = String(100 - Math.round(a * 10));

    if (near > leadW) { leadW = near; lead = n; }
  });

  // the glow takes the colour of whichever piece currently holds the spotlight
  if (lead) {
    const [r,g,b] = hexToRgb(lead.color);
    const gl = document.getElementById('glow');
    gl.style.background =
      `radial-gradient(46% 62% at 50% 78%, rgba(${r},${g},${b},.62), rgba(${r},${g},${b},.16) 46%, transparent 72%)`;
    gl.style.opacity = (0.46 * smooth(leadW)).toFixed(3);
  }

  const s2 = (t * 2) % 1;
  const sw = document.getElementById('sweep');
  sw.style.left = (s2 * (W + 900) - 450) + 'px';
  sw.style.opacity = (Math.sin(Math.PI * s2) * 0.85).toFixed(3);

  document.getElementById('grain').style.backgroundPosition =
      `${(t*160*3)%160}px ${(t*160*2)%160}px`;
};
window.setT(0);
</script>
