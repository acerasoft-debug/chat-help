<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><title>ChatHelp hero animation</title>
<style>html,body{margin:0;background:#fbfbfd;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1600" height="900"></canvas>
<script>
/* Deterministik animasyon: window.seek(t) → t saniyesindeki kareyi çizer (0 ≤ t < DUR). Tarayıcıda açılırsa kendi kendine oynar. */
const W=1600,H=900,DUR=12,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const C={ink:'#0f1222',ink2:'#3b4055',mute:'#6b7083',line:'#e6e8ef',gold:'#b8862b',gold2:'#d4a84a',indigo:'#4f46e5',teal:'#0f9f9c',rose:'#d9336b',ok:'#1a9e5a'};
const CX=800,CY=460,RX=430,RY=175;
const NODES=[
 {l:'Telefon',       a:-2.00, c:C.indigo, icon:'phone'},
 {l:'Website-Chat',  a:-1.10, c:C.teal,   icon:'chat'},
 {l:'E-Mail',        a: 0.00, c:C.rose,   icon:'mail'},
 {l:'Kanzlei & Recht',a: 1.10, c:C.gold,   icon:'para'},
 {l:'Buchhaltung',   a: 2.00, c:C.indigo, icon:'chart'},
 {l:'Inkasso',       a: Math.PI, c:C.teal, icon:'euro'}];
const ease=x=>1-Math.pow(1-x,3), clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
function fade(t,s,e,f=.5){ if(t<s||t>e) return 0; return Math.min(1, clamp((t-s)/f), clamp((e-t)/f)); }
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function pos(n){return {x:CX+Math.cos(n.a)*RX, y:CY+Math.sin(n.a)*RY};}
function bez(p0,p1,t){ // quadratic curve towards a control point bent outward
  const cx=(p0.x+p1.x)/2+(p1.y-p0.y)*0.18, cy=(p0.y+p1.y)/2-(p1.x-p0.x)*0.18;
  return {x:(1-t)*(1-t)*p0.x+2*(1-t)*t*cx+t*t*p1.x, y:(1-t)*(1-t)*p0.y+2*(1-t)*t*cy+t*t*p1.y, cx, cy};
}
function icon(kind,x,y,s,col){
  ctx.save();ctx.translate(x,y);ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=s*0.09;ctx.lineCap='round';ctx.lineJoin='round';
  if(kind==='phone'){ctx.beginPath();ctx.moveTo(-s*.32,-s*.38);ctx.quadraticCurveTo(-s*.36,-s*.1,-s*.1,s*.2);ctx.quadraticCurveTo(s*.12,s*.4,s*.38,s*.3);ctx.lineTo(s*.26,s*.08);ctx.lineTo(s*.06,s*.14);ctx.quadraticCurveTo(-s*.14,s*.02,-s*.16,-s*.18);ctx.lineTo(-s*.1,-s*.3);ctx.closePath();ctx.fill();}
  else if(kind==='chat'){rr(-s*.42,-s*.34,s*.84,s*.6,s*.18);ctx.fill();ctx.beginPath();ctx.moveTo(-s*.2,s*.24);ctx.lineTo(-s*.28,s*.44);ctx.lineTo(-s*.02,s*.26);ctx.fill();ctx.fillStyle='#fff';[-.2,0,.2].forEach(d=>{ctx.beginPath();ctx.arc(d*s,-s*.04,s*.055,0,7);ctx.fill();});}
  else if(kind==='mail'){rr(-s*.44,-s*.3,s*.88,s*.6,s*.12);ctx.stroke();ctx.beginPath();ctx.moveTo(-s*.42,-s*.26);ctx.lineTo(0,s*.06);ctx.lineTo(s*.42,-s*.26);ctx.stroke();}
  else if(kind==='para'){ctx.font=`700 ${s*.95}px Inter, "DejaVu Sans", sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('§',0,s*.04);}
  else if(kind==='chart'){[[-.3,.1],[-.1,-.1],[.1,.05],[.3,-.3]].forEach(([dx,dy])=>{rr(dx*s-s*.07,dy*s,s*.14,s*.4-dy*s,s*.04);ctx.fill();});}
  else if(kind==='euro'){ctx.font=`700 ${s*.9}px Inter, "DejaVu Sans", sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('€',0,s*.03);}
  ctx.restore();
}
function card(x,y,w,h,alpha,accent){
  if(alpha<=0)return false; ctx.save();ctx.globalAlpha=alpha;
  ctx.shadowColor='rgba(15,18,34,.14)';ctx.shadowBlur=40;ctx.shadowOffsetY=16;ctx.fillStyle='#fff';rr(x,y,w,h,22);ctx.fill();
  ctx.shadowColor='transparent';ctx.strokeStyle=C.line;ctx.lineWidth=1;rr(x,y,w,h,22);ctx.stroke();
  if(accent){ctx.fillStyle=accent;rr(x,y,w,5,3);ctx.fill();}
  return true;
}
function text(s,x,y,font,col,align='left'){ctx.font=font;ctx.fillStyle=col;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(s,x,y);}
function typed(s,p){return s.slice(0,Math.floor(clamp(p)*s.length));}
function bubble(x,y,w,txt,me,alpha,p=1){ if(alpha<=0)return; ctx.save();ctx.globalAlpha=alpha;ctx.font='500 17px Inter, "DejaVu Sans", sans-serif';
  const s=typed(txt,p); const tw=Math.min(w-30,ctx.measureText(txt).width)+30; const lines=wrap(txt,w-30); const h=22*lines.length+20;
  ctx.fillStyle=me?C.ink:'#f4f5f9'; rr(me?x+w-tw:x,y,tw,h,14); ctx.fill();
  ctx.fillStyle=me?'#fff':C.ink; let yy=y+27; const shown=wrap(s,w-30); shown.forEach(l=>{ctx.textAlign='left';ctx.fillText(l,(me?x+w-tw:x)+15,yy);yy+=22;}); ctx.restore(); return h;}
function wrap(s,w){const words=s.split(' '),out=[];let cur='';for(const wd of words){const tst=cur?cur+' '+wd:wd;if(ctx.measureText(tst).width>w&&cur){out.push(cur);cur=wd;}else cur=tst;}if(cur)out.push(cur);return out;}
function wave(x,y,w,h,t,alpha,col){ if(alpha<=0)return; ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=col;const n=34,bw=w/n*0.55;for(let i=0;i<n;i++){const a=(Math.sin(t*9+i*0.9)+Math.sin(t*13+i*0.37))*0.5;const bh=h*(0.18+0.82*Math.abs(a)*(0.5+0.5*Math.sin(i/n*Math.PI)));rr(x+i*(w/n),y+(h-bh)/2,bw,bh,bw/2);ctx.fill();}ctx.restore();}

function draw(t){
  t=((t%DUR)+DUR)%DUR;
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);
  /* background */
  ctx.fillStyle='#fbfbfd';ctx.fillRect(0,0,W,H);
  const g1=ctx.createRadialGradient(260+Math.sin(t*.5)*40,120,0,260,120,620);g1.addColorStop(0,'rgba(212,168,74,.22)');g1.addColorStop(1,'rgba(212,168,74,0)');ctx.fillStyle=g1;ctx.fillRect(0,0,W,H);
  const g2=ctx.createRadialGradient(1380+Math.cos(t*.4)*40,180,0,1380,180,620);g2.addColorStop(0,'rgba(79,70,229,.14)');g2.addColorStop(1,'rgba(79,70,229,0)');ctx.fillStyle=g2;ctx.fillRect(0,0,W,H);
  const g3=ctx.createRadialGradient(820,820,0,820,820,520);g3.addColorStop(0,'rgba(15,159,156,.10)');g3.addColorStop(1,'rgba(15,159,156,0)');ctx.fillStyle=g3;ctx.fillRect(0,0,W,H);
  /* dotted grid */
  ctx.fillStyle='rgba(15,18,34,.045)';for(let x=40;x<W;x+=48)for(let y=40;y<H;y+=48){ctx.beginPath();ctx.arc(x,y,1.3,0,7);ctx.fill();}

  /* connections */
  NODES.forEach((n,i)=>{const p=pos(n);const b=bez(p,{x:CX,y:CY},0.5);
    ctx.strokeStyle='rgba(15,18,34,.10)';ctx.lineWidth=2;ctx.setLineDash([6,8]);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.quadraticCurveTo(b.cx,b.cy,CX,CY);ctx.stroke();ctx.setLineDash([]);
    /* pulses: inbound (node→core) then outbound (core→node) */
    const t0=(i*2.0)%DUR; const loc=((t-t0)%DUR+DUR)%DUR;
    const drawPulse=(u,col,dir)=>{const q=bez(p,{x:CX,y:CY},dir>0?u:1-u);ctx.save();ctx.shadowColor=col;ctx.shadowBlur=18;ctx.fillStyle=col;ctx.beginPath();ctx.arc(q.x,q.y,7,0,7);ctx.fill();ctx.restore();
      for(let k=1;k<=4;k++){const q2=bez(p,{x:CX,y:CY},dir>0?clamp(u-k*0.03):clamp(1-u+k*0.03));ctx.globalAlpha=0.35-k*0.07;ctx.fillStyle=col;ctx.beginPath();ctx.arc(q2.x,q2.y,6-k,0,7);ctx.fill();ctx.globalAlpha=1;}};
    if(loc<1.1) drawPulse(ease(loc/1.1),n.c,1);
    if(loc>1.5&&loc<2.6) drawPulse(ease((loc-1.5)/1.1),C.gold2,-1);
    /* node */
    const pop=loc>2.55&&loc<3.5?1:0; const sc=1+(pop?Math.sin(clamp((loc-2.55)/0.95)*Math.PI)*0.08:0);
    ctx.save();ctx.translate(p.x,p.y);ctx.scale(sc,sc);
    ctx.shadowColor='rgba(15,18,34,.12)';ctx.shadowBlur=30;ctx.shadowOffsetY=10;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,46,0,7);ctx.fill();
    ctx.shadowColor='transparent';ctx.strokeStyle=C.line;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,46,0,7);ctx.stroke();
    icon(n.icon,0,0,44,n.c);
    if(pop){const a=Math.sin(clamp((loc-2.55)/0.95)*Math.PI);ctx.globalAlpha=a;ctx.fillStyle=C.ok;ctx.beginPath();ctx.arc(34,-34,15,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3.2;ctx.beginPath();ctx.moveTo(27,-34);ctx.lineTo(32.5,-28.5);ctx.lineTo(41,-40);ctx.stroke();ctx.globalAlpha=1;}
    ctx.restore();
    text(n.l,p.x,p.y+78,'600 17px Inter, "DejaVu Sans", sans-serif',C.ink2,'center');
  });

  /* core */
  const pulse=1+Math.sin(t*2.1)*0.03;
  ctx.save();ctx.translate(CX,CY);
  for(let k=3;k>=1;k--){ctx.globalAlpha=0.09*k*(0.8+0.2*Math.sin(t*2.1+k));ctx.fillStyle=C.gold2;ctx.beginPath();ctx.arc(0,0,86*pulse+k*22,0,7);ctx.fill();}
  ctx.globalAlpha=1;ctx.scale(pulse,pulse);
  const cg=ctx.createLinearGradient(-80,-80,80,80);cg.addColorStop(0,'#f3dfa6');cg.addColorStop(1,'#c9972f');
  ctx.shadowColor='rgba(184,134,43,.45)';ctx.shadowBlur=50;ctx.shadowOffsetY=14;ctx.fillStyle=cg;rr(-80,-80,160,160,46);ctx.fill();ctx.shadowColor='transparent';
  /* mark: stylised "C" orbit + spark */
  ctx.strokeStyle='#1a1407';ctx.lineWidth=11;ctx.lineCap='round';ctx.beginPath();ctx.arc(0,0,40,0.65,5.65);ctx.stroke();
  ctx.fillStyle='#1a1407';ctx.beginPath();ctx.arc(0,0,11,0,7);ctx.fill();
  const sp=0.6+0.4*Math.sin(t*4);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(34,-34,6*sp,0,7);ctx.fill();
  ctx.restore();
  text('ChatHelp Agent',CX,CY+128,'700 22px Inter, "DejaVu Sans", sans-serif',C.ink,'center');
  text('arbeitet 24/7 · nur deine Fakten',CX,CY+154,'500 15px Inter, "DejaVu Sans", sans-serif',C.mute,'center');

  /* ---- floating cards ---- */
  /* 1) phone call (top-left) */
  { const a=fade(t,0.6,4.9); if(card(70,90,470,230,a,C.indigo)){ ctx.save();ctx.globalAlpha=a;
      icon('phone',108,134,34,C.indigo); text('Eingehender Anruf · Zahnarztpraxis Dr. Weber',140,131,'700 17px Inter, "DejaVu Sans", sans-serif',C.ink);
      text('Telefon-Agent „Lea“ · '+(t<4?('00:'+String(Math.floor(12+(t-0.6)*7)).padStart(2,'0')):'00:36'),140,154,'500 13.5px Inter, "DejaVu Sans", sans-serif',C.mute);
      wave(100,170,420,36,t,a*(t<3.4?1:0.35),C.indigo);
      ctx.restore();
      bubble(100,218,420,'Ich hätte gern einen Termin zur Zahnreinigung.',true,a*fade(t,1.2,4.9,.3),clamp((t-1.2)/1.1));
      bubble(100,262,420,'Gern – Dienstag 9:30 oder Donnerstag 15:00 Uhr?',false,a*fade(t,2.7,4.9,.3),clamp((t-2.7)/1.1)); } }
  /* 2) website chat (right) */
  { const a=fade(t,3.4,7.9); if(card(1090,60,440,240,a,C.teal)){ ctx.save();ctx.globalAlpha=a;
      icon('chat',1128,98,32,C.teal); text('Website-Chat · Nordlicht Outdoor',1158,96,'700 17px Inter, "DejaVu Sans", sans-serif',C.ink);
      text('Support-Agent · antwortet in 1,2 s',1158,118,'500 13.5px Inter, "DejaVu Sans", sans-serif',C.mute); ctx.restore();
      bubble(1120,140,390,'Wo ist meine Bestellung 4711?',true,a*fade(t,3.9,7.9,.3),clamp((t-3.9)/0.9));
      bubble(1120,186,390,'Unterwegs mit DHL – Zustellung morgen bis 18 Uhr. Sendungsnummer kommt per E-Mail. ✓',false,a*fade(t,5.0,7.9,.3),clamp((t-5.0)/1.4)); } }
  /* 3) law firm intake (bottom-left) */
  { const a=fade(t,6.4,10.9); if(card(70,600,520,230,a,C.gold)){ ctx.save();ctx.globalAlpha=a;
      icon('para',106,642,34,C.gold); text('Mandantenaufnahme · Kanzlei Berger & Partner',134,640,'700 17px Inter, "DejaVu Sans", sans-serif',C.ink);
      text('Kanzlei-Agent · Fristen-Vorprüfung',134,662,'500 13.5px Inter, "DejaVu Sans", sans-serif',C.mute);
      const rows=[['Anliegen','Kündigung erhalten (Zugang 14.10.)'],['Frist','3 Wochen · § 4 KSchG → 04.11.'],['Status','DRINGEND · Rückruf heute 16:00 ✓']];
      rows.forEach((r,i)=>{const p=clamp((t-7.0-i*0.9)/0.7); if(p<=0)return; ctx.globalAlpha=a*p; text(r[0],100,706+i*38,'600 14px Inter, "DejaVu Sans", sans-serif',C.mute); text(typed(r[1],p),200,706+i*38,'600 16px Inter, "DejaVu Sans", sans-serif',i===2?C.rose:C.ink);});
      ctx.restore(); } }
  /* 4) stats (bottom-right) */
  { const a=fade(t,8.3,11.9); if(card(1100,630,430,200,a,C.ok)){ ctx.save();ctx.globalAlpha=a; const p=ease(clamp((t-8.5)/1.8));
      text('Diese Woche',1132,670,'600 13px Inter, "DejaVu Sans", sans-serif',C.mute);
      const st=[[Math.round(1248*p).toLocaleString('de-DE'),'Gespräche'],[Math.round(94*p)+' %','gelöst'],['0 s','Wartezeit']];
      st.forEach((s,i)=>{text(s[0],1132+i*135,716,'800 30px Inter, "DejaVu Sans", sans-serif',C.ink);text(s[1],1132+i*135,739,'500 13px Inter, "DejaVu Sans", sans-serif',C.mute);});
      /* mini bars */
      for(let i=0;i<13;i++){const h=16+((i*37)%41)*p;ctx.fillStyle=i>=11?C.gold2:'rgba(79,70,229,.35)';rr(1132+i*28,804-h,17,h,5);ctx.fill();}
      ctx.restore(); } }
}
window.seek=draw;
if(!location.search.includes('still')){let s=performance.now();(function f(){draw((performance.now()-s)/1000);requestAnimationFrame(f);})();} else draw(0);
</script></body></html>
