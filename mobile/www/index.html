<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChatHelp</title>
<style>
  :root{ --bg:#15151b; --s1:#1c1c22; --s2:#26262c; --gold:#d4a84a; --t:#e7e7ef; --t3:#b4b4c0; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(120% 80% at 50% 0%, #1d1d28 0%, var(--bg) 60%);
    color:var(--t); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; min-height:100dvh; padding:28px; text-align:center;
  }
  .wrap{max-width:360px}
  .logo{
    width:84px;height:84px;margin:0 auto 22px;border-radius:22px;
    background:linear-gradient(145deg,var(--s2),var(--s1));
    border:1.5px solid rgba(212,168,74,.4);
    display:flex;align-items:center;justify-content:center;font-size:40px;
    box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);
  }
  h1{font-size:22px;margin:0 0 8px;font-weight:800}
  h1 b{color:var(--gold)}
  p{color:var(--t3);font-size:14.5px;line-height:1.55;margin:0 0 24px}
  button{
    width:100%;padding:14px 18px;border:none;border-radius:14px;cursor:pointer;
    font-size:15px;font-weight:800;font-family:inherit;color:#1b1b1e;
    background:linear-gradient(135deg,var(--gold),#f0c860);
    box-shadow:0 8px 22px rgba(212,168,74,.25);transition:transform .15s,filter .15s;
  }
  button:active{transform:scale(.97)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e5575a;margin-right:7px;vertical-align:middle}
  .muted{margin-top:18px;font-size:12px;color:#6f6f80}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">⚖️</div>
    <h1>Chat<b>Help</b></h1>
    <p><span class="dot"></span>Keine Internetverbindung.<br>Bitte prüfen Sie Ihre Verbindung und versuchen Sie es erneut.</p>
    <button onclick="retry()">Erneut versuchen</button>
    <div class="muted">chat-help.com · DSGVO · EU-Server</div>
  </div>
<script>
  function retry(){ location.href = 'https://chat-help.com/chat/'; }
  // Otomatik yeniden bağlanma denemesi
  window.addEventListener('online', retry);
  setInterval(function(){ if(navigator.onLine) retry(); }, 4000);
</script>
</body>
</html>
