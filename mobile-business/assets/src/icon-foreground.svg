<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Android Adaptive Icon – Vordergrund (transparent). Glyphe liegt komplett in der
       Safe-Zone (Kreis mit 66/108 des Durchmessers), damit keine Maske sie abschneidet. -->
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="330" y1="320" x2="710" y2="710">
      <stop offset="0" stop-color="#F6E3AE"/>
      <stop offset="0.5" stop-color="#D4A84A"/>
      <stop offset="1" stop-color="#A9781C"/>
    </linearGradient>
  </defs>
  <g transform="translate(512 512) scale(19) translate(-12 -12)">
    <path d="M18.5 7.5A8 8 0 1 0 19 15" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="12" cy="12" r="2.4" fill="url(#gold)"/>
  </g>
</svg>
