<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- ChatHelp Business – App-Icon (iOS + Android legacy). Vollflächig, ohne Transparenz
       (Apple lehnt Icons mit Alpha ab). Stil abgeleitet von brand/icon-app.svg
       (dunkler Grund + Goldverlauf), Glyphe = Studio-Emblem aus chat/studio.php. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232a52"/>
      <stop offset="0.55" stop-color="#141831"/>
      <stop offset="1" stop-color="#0b0d1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4a84a" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#d4a84a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="300" y1="290" x2="740" y2="740">
      <stop offset="0" stop-color="#F6E3AE"/>
      <stop offset="0.5" stop-color="#D4A84A"/>
      <stop offset="1" stop-color="#A9781C"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="360" fill="url(#halo)"/>
  <g transform="translate(512 512) scale(23) translate(-12 -12)">
    <path d="M18.5 7.5A8 8 0 1 0 19 15" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="12" cy="12" r="2.4" fill="url(#gold)"/>
  </g>
</svg>
