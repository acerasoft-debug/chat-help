<svg xmlns="http://www.w3.org/2000/svg" width="2732" height="2732" viewBox="0 0 2732 2732">
  <!-- ChatHelp Business – Splash (hell). 2732x2732, Inhalt bleibt im mittleren Bereich
       (~1100 px breit), damit Hoch- und Querformat-Zuschnitte nichts abschneiden. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3DFA6"/>
      <stop offset="1" stop-color="#C9972F"/>
    </linearGradient>
    <radialGradient id="soft" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#d4a84a" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#d4a84a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="2732" height="2732" fill="#f6f7fb"/>
  <circle cx="1366" cy="1300" r="900" fill="url(#soft)"/>
  <g transform="translate(1366 1250)">
    <rect x="-150" y="-150" width="300" height="300" rx="96" fill="url(#tile)"/>
    <g transform="scale(7.4) translate(-12 -12)">
      <path d="M18.5 7.5A8 8 0 1 0 19 15" fill="none" stroke="#1a1407" stroke-width="3" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="2.4" fill="#1a1407"/>
    </g>
  </g>
  <text x="1366" y="1560" text-anchor="middle" font-family="Fraunces, Georgia, 'DejaVu Serif', serif" font-weight="600" font-size="112" letter-spacing="-1" fill="#0f1222">ChatHelp <tspan fill="#b8862b">Business</tspan></text>
</svg>
