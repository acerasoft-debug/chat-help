name: Avatar-Kandidaten laden (KI-generierte Gesichter)
# Läuft nur, wenn site/media/avatars/_fetch.txt auf diesem Branch geändert wird.
# Lädt synthetische Porträts (keine realen Personen), verkleinert sie auf 512 px WebP und committet sie als Kandidaten.
on:
  push:
    branches: [ "claude/chat-help-system-video-x0nofb" ]
    paths: [ "site/media/avatars/_fetch.txt" ]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/chat-help-system-video-x0nofb
      - name: Kandidaten laden (ohne Wasserzeichen) und als Studio-Porträt aufbereiten
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq webp imagemagick jq > /dev/null
          rm -rf site/media/avatars/_cand && mkdir -p site/media/avatars/_cand site/media/avatars/_diag /tmp/raw
          N=$(grep -oE '^count=[0-9]+' site/media/avatars/_fetch.txt | cut -d= -f2); N=${N:-30}
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          curl -sSL -m 30 -A "$UA" -o site/media/avatars/_diag/tpdne.html "https://thispersondoesnotexist.com/" || true
          head -c 1500 site/media/avatars/_diag/tpdne.html; echo
          for i in $(seq 1 $N); do
            for u in "https://thispersondoesnotexist.com/random-person.jpeg" "https://thispersondoesnotexist.com/image"; do
              code=$(curl -sSL -m 30 -A "$UA" -H "Accept: image/avif,image/webp,image/jpeg,*/*" -H "Referer: https://thispersondoesnotexist.com/" -o /tmp/raw/a$i.jpg -w "%{http_code} %{content_type} %{size_download}" "$u?r=$i$RANDOM" || echo fail)
              echo "tpdne $i $u: $code"
              if file /tmp/raw/a$i.jpg | grep -qi jpeg; then break; fi
            done
            sleep 1.3
          done
          python3 -m pip install -q "rembg[cpu]" pillow > /dev/null 2>&1 || python3 -m pip install -q rembg onnxruntime pillow > /dev/null 2>&1 || true
          python3 scripts/avatar_studio.py '/tmp/raw/a*.jpg' site/media/avatars/_cand || echo "Aufbereitung fehlgeschlagen"
          ls -la site/media/avatars/_cand | head -80; du -sh site/media/avatars/_cand
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/media/avatars/_cand site/media/avatars/_diag
          git commit -m "Avatar-Kandidaten (synthetische KI-Gesichter, 512 px WebP)" || echo "nichts zu committen"
          git pull --rebase origin claude/chat-help-system-video-x0nofb || true
          git push origin HEAD:claude/chat-help-system-video-x0nofb
