name: Avatar-Kandidaten laden (KI-generierte Gesichter)
# Läuft nur, wenn site/media/avatars/_fetch.txt auf diesem Branch geändert wird.
# Lädt synthetische Porträts (keine realen Personen), verkleinert sie auf 512 px WebP und committet sie als Kandidaten.
on:
  push:
    branches: [ "claude/chat-help-system-video-x0nofb" ]
    paths: [ "site/media/avatars/_fetch.txt" ]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/chat-help-system-video-x0nofb
      - name: Kandidaten laden und verkleinern
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq webp imagemagick jq > /dev/null
          mkdir -p site/media/avatars/_cand /tmp/raw
          N=$(grep -oE '^count=[0-9]+' site/media/avatars/_fetch.txt | cut -d= -f2); N=${N:-36}
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          # Quelle 1: thispersondoesnotexist.com (StyleGAN, synthetisch)
          for i in $(seq 1 $N); do
            code=$(curl -sSL -m 30 -A "$UA" -H "Accept: image/avif,image/webp,image/jpeg,*/*" -o /tmp/raw/a$i.jpg -w "%{http_code} %{content_type} %{size_download}" "https://thispersondoesnotexist.com/" || echo "curl-fail")
            echo "tpdne $i: $code"; sleep 1.2
          done
          # Quelle 2: this-person-does-not-exist.com (synthetisch, Filter Geschlecht/Alter)
          for g in female male; do for a in 19-25 26-35 35-50 50; do for k in 1 2 3; do
            j=$(curl -sS -m 30 -A "$UA" "https://this-person-does-not-exist.com/new?time=$RANDOM$k&gender=$g&age=$a&etnic=all" || true)
            src=$(echo "$j" | jq -r '.src // empty' 2>/dev/null)
            echo "tpdne2 $g $a $k: ${src:-none} $(echo "$j" | head -c 120)"
            if [ -n "$src" ]; then curl -sSL -m 30 -A "$UA" -o "/tmp/raw/b-$g-$a-$k.jpg" "https://this-person-does-not-exist.com$src" || true; fi
            sleep 1
          done; done; done
          ls -la /tmp/raw | head -80
          for f in /tmp/raw/*.jpg; do
            b=$(basename "$f" .jpg)
            if file "$f" | grep -qiE 'JPEG|PNG|WebP|image data'; then
              convert "$f" -resize 512x512^ -gravity center -extent 512x512 -strip /tmp/raw/$b-512.png && cwebp -quiet -q 84 /tmp/raw/$b-512.png -o site/media/avatars/_cand/$b.webp
            else echo "kein Bild: $b ($(file -b "$f" | head -c 80))"; fi
          done
          ls -la site/media/avatars/_cand | head -90
          du -sh site/media/avatars/_cand
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/media/avatars/_cand
          git commit -m "Avatar-Kandidaten (synthetische KI-Gesichter, 512 px WebP)" || echo "nichts zu committen"
          git pull --rebase origin claude/chat-help-system-video-x0nofb || true
          git push origin HEAD:claude/chat-help-system-video-x0nofb
