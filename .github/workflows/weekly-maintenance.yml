name: Weekly Maintenance

# Her Pazartesi 03:00 UTC + elle tetikleme
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Güvenlik & bağımlılık taraması
        id: audit
        run: |
          echo "## 🔧 Wartungsbericht $(date +%F)" >> "$GITHUB_STEP_SUMMARY"
          PROBLEM=0
          if [ -f package.json ]; then
            echo "### npm audit" >> "$GITHUB_STEP_SUMMARY"
            npm audit --omit=dev >> "$GITHUB_STEP_SUMMARY" 2>&1 || PROBLEM=1
          else
            echo "Kein package.json — npm audit übersprungen." >> "$GITHUB_STEP_SUMMARY"
          fi
          # PHP dosyalarında açık API anahtarı / şifre sızıntısı taraması
          echo "### Secret-Scan (PHP)" >> "$GITHUB_STEP_SUMMARY"
          if grep -rnoE "(sk-ant-[A-Za-z0-9_-]{10,}|sk-[A-Za-z0-9]{20,}|password\s*=\s*['\"][^'\"]{6,})" --include='*.php' . >> "$GITHUB_STEP_SUMMARY" 2>/dev/null; then
            echo "::warning::Mögliche Secrets im Code gefunden — bitte prüfen/rotieren."
            PROBLEM=1
          else
            echo "Keine offensichtlichen Secrets gefunden. ✅" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "problem=$PROBLEM" >> "$GITHUB_OUTPUT"

      - name: Bulgu varsa issue aç
        if: steps.audit.outputs.problem == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🔧 Wartung: Befunde (${new Date().toISOString().slice(0,10)})`;
            const body = 'Wöchentliche Wartung hat Befunde (Audit/Secrets). Details im Job-Summary:\n' +
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'maintenance'
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['maintenance']
              });
            }
