name: (Teşhis) maxsales.de için sunucuyu incele

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "İncelenecek alan adı"
        required: true
        default: "maxsales.de"

permissions:
  contents: read

# SALT OKUNUR. Hiçbir şey oluşturmuyor, silmiyor, taşımıyor.
#
# İki soru:
#   1) maxsales.de'yi ek alan olarak bağlamak için hangi yol açık?
#   2) Perakende uygulaması sunucuda TAM OLARAK nerede duruyor?
#
# (2) neden: bağlama işi "public_html/shop yok" dedi, oysa site o adresten
# yayında. Bu çelişkiyi tahminle kapatmak yanlış — dosyayı arıyoruz.
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: DNS — alan nereye bakıyor
        env:
          D: ${{ github.event.inputs.domain }}
        run: |
          echo "== $D =="
          dig +short A "$D"    | sed 's/^/  A     /' || true
          dig +short AAAA "$D" | sed 's/^/  AAAA  /' || true
          dig +short NS "$D"   | sed 's/^/  NS    /' || true

      - name: Sunucu — uygulama nerede
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 4m
          script: |
            echo "HOME=$HOME"
            echo
            echo "== public_html TAM liste (dizinler) =="
            find "$HOME/public_html" -maxdepth 1 -type d -printf '  %f\n' | sort
            echo
            echo "== public_html TAM liste (sembolik baglar) =="
            find "$HOME/public_html" -maxdepth 1 -type l -printf '  %f -> %l\n' | sort || echo "  yok"
            echo
            echo "== ev dizininde tilde ile olusmus dizin var mi =="
            ls -la "$HOME" | grep -E '^[dl].* [~]' || echo "  yok"
            echo
            echo "== perakende index.php nerede (inc/view.php komsulugu) =="
            find "$HOME" -maxdepth 4 -name 'view.php' -path '*/inc/*' -printf '  %h\n' 2>/dev/null | head -10
            echo
            echo "== 'MAXSALES' gecen index.php'ler =="
            for f in $(find "$HOME" -maxdepth 3 -name 'index.php' 2>/dev/null | head -20); do
              if grep -q "vr_layout_start\|MAXSALES" "$f" 2>/dev/null; then echo "  $f"; fi
            done
            echo
            echo "== shop dizini stat =="
            stat -c '  %n  %F  %s' "$HOME/public_html/shop" 2>&1 | head -3
            echo
            echo "== uploads / data nerede =="
            for d in "$HOME/public_html/uploads" "$HOME/public_html/data" "$HOME/public_html/shop/uploads" "$HOME/public_html/shop/data"; do
              if [ -e "$d" ]; then echo "  VAR: $d  ($(find "$d" -maxdepth 1 | wc -l) girdi)"; else echo "  yok: $d"; fi
            done
