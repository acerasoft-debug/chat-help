name: (Teşhis) /shop nereden sunuluyor

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Not (kayıt için)"
        required: false
        default: "golge klasorler ve /shop yonlendirmesi"

permissions:
  contents: read

# SALT OKUNUR. Hiçbir şey silmiyor, taşımıyor, oluşturmuyor.
#
# Üç soru:
#   1) public_html/shop yok ama /shop 200 dönüyor — hangi kural yapıyor bunu?
#   2) _golge-shop-* klasörleri ne kadar yer tutuyor, içlerinde ne var?
#   3) Hangisi (varsa) canlı siteyi besliyor?
#
# (3) kritik: kullanıcı "sil" dedi ama biri canlı mağazayı besliyorsa silmek
# dükkânı kapatır. Silmeden önce kanıt.
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Sunucu
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          script: |
            echo "===== 1) public_html/.htaccess icinde shop gecen satirlar ====="
            grep -n -i 'shop' "$HOME/public_html/.htaccess" 2>/dev/null | head -40 || echo "  eslesme yok"
            echo
            echo "===== 2) .htaccess TAM (ilk 80 satir) ====="
            sed -n '1,80p' "$HOME/public_html/.htaccess" 2>/dev/null || echo "  okunamadi"
            echo
            echo "===== 3) public_html icinde adinda shop gecen her sey ====="
            ls -ld "$HOME"/public_html/*shop* 2>/dev/null | sed 's/^/  /' || echo "  yok"
            echo
            echo "===== 4) golge klasorler ====="
            for d in "$HOME"/_golge-shop-*; do
              [ -d "$d" ] || continue
              printf '  %s  %s  dosya=%s\n' "$(du -sh "$d" | cut -f1)" "$d" "$(find "$d" -type f | wc -l)"
            done
            echo
            echo "===== 5) golge klasorlerde index.php surumu (ilk satirlarda ipucu) ====="
            for d in "$HOME"/_golge-shop-*; do
              [ -f "$d/index.php" ] || continue
              printf '  %s : %s bayt, %s\n' "$(basename "$d")" "$(stat -c %s "$d/index.php")" "$(stat -c %y "$d/index.php" | cut -d. -f1)"
            done
            echo
            echo "===== 6) golge klasorler web'den erisilebiliyor mu (public_html icinde mi) ====="
            case "$(readlink -f "$HOME"/_golge-shop-* 2>/dev/null | head -1)" in
              "$(readlink -f "$HOME/public_html")"*) echo "  EVET - public_html altinda" ;;
              *) echo "  HAYIR - public_html disinda (web'den dogrudan istenemez)" ;;
            esac
            echo
            echo "===== 7) cPanel: alanlarin kok dizinleri ====="
            uapi --output=jsonpretty DomainInfo list_domains 2>&1 | head -20
            echo
            echo "===== 8) docroot listesi (varsa) ====="
            uapi --output=jsonpretty DomainInfo single_domain_data domain=vestrasales.com 2>&1 | grep -iE 'documentroot|homedir|domain' | head -10

      - name: Web tarafi
        run: |
          B="https://vestrasales.com"
          for p in "/shop/" "/shop/index.php" "/shop/shop.php" "/shop/assets/css/maxsales.css" "/shop/nonexistent-xyz.php"; do
            code=$(curl -sS -o /tmp/b -w '%{http_code}' --max-time 20 "$B$p" || echo 000)
            size=$(wc -c < /tmp/b 2>/dev/null || echo 0)
            printf '  %-40s %s  %s bayt\n' "$p" "$code" "$size"
          done
          echo
          echo "-- /shop/ ilk satirlar"
          curl -sS --max-time 20 "$B/shop/" | head -12
