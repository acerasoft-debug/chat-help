name: (Teşhis) Alan adı yetkileri ve DNS

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "İncelenecek alan adı"
        required: true
        default: "maxsales.de"

permissions:
  contents: read

# SALT OKUNUR. Hiçbir şey yazmıyor, silmiyor, açmıyor.
#
# NİYE VAR
# ========
# maxsales.de'yi sunucuya bağlamak iki kez reddedildi:
#   uapi Domains    add_domain      -> Can't locate Cpanel/API/Domains.pm
#   uapi AddonDomain addaddondomain -> Can't locate Cpanel/API/AddonDomain.pm
# Yani bu cPanel kurulumunda ek alan modülleri hiç yüklü değil. SubDomain
# modülü ise çalışıyor (maxsales-test.vestrasales.com açıldı).
#
# Ayrı bir sorun daha ölçüldü: cPanel'de açılan alt ad dışarıdan
# çözülmüyor. Çünkü vestrasales.com'un yetkili sunucuları bu makine değil,
# GoDaddy'nin ns71/ns72.domaincontrol.com sunucuları — cPanel'in yazdığı
# bölge dosyasını kimse sormuyor.
#
# Bu iş, "paket ek alana izin veriyor mu, yoksa modüller mi eksik" sorusunu
# tahminle değil ölçümle cevaplasın diye var: hesabın özellik listesi,
# alan sayısı sınırı ve mevcut alanlar okunuyor.
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Sunucudaki yetkiler
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 4m
          script: |
            echo "== cPanel surumu =="
            cat /usr/local/cpanel/version 2>/dev/null || echo "  okunamadi"
            echo
            echo "== yuklu UAPI modulleri (alan adiyla ilgili) =="
            ls /usr/local/cpanel/Cpanel/API/ 2>/dev/null | grep -iE 'domain|sub|park' | sed 's/^/  /' || echo "  liste okunamadi"
            echo
            echo "== hesap sinirlari =="
            # MAXADDON / MAXSUB paket sinirlari. "0" = hic izin yok,
            # "unlimited" = sinirsiz. Modul eksikligi ile paket yasagi ayri
            # seyler; ikisini birbirine karistirmamak icin ikisi de okunuyor.
            uapi --output=jsonpretty StatsBar get_stats display='addondomains|subdomains|parkeddomains' 2>&1 \
              | grep -E '"(name|count|max|item)"' | sed 's/^/  /' | head -40
            echo
            echo "== tanimli alanlar =="
            uapi --output=jsonpretty DomainInfo list_domains 2>&1 \
              | grep -oE '"[a-z0-9.-]+\.[a-z]{2,}"' | sort -u | sed 's/^/  /'
            echo
            echo "== belge kokleri =="
            uapi --output=jsonpretty DomainInfo domains_data 2>&1 \
              | grep -E '"(domain|documentroot)"' | sed 's/^/  /' | head -30

      - name: DNS gerçekte ne diyor
        if: always()
        env:
          D: ${{ github.event.inputs.domain }}
        run: |
          # Yetkili sunucuya DOĞRUDAN soruyoruz. Ara belleğe düşmüş eski bir
          # "yok" cevabı ölçümü yanıltmasın diye: alt ad cPanel'de açılmadan
          # önce sorulmuştu ve olumsuz cevap bir süre saklanıyor.
          for z in vestrasales.com "$D"; do
            echo "== $z"
            dig +short NS "$z" | sed 's/^/   NS  /'
            ns=$(dig +short NS "$z" | head -1)
            for name in "$z" "www.$z" "maxsales-test.vestrasales.com"; do
              case "$name" in *"$z"*|maxsales-test*) ;; *) continue ;; esac
              printf '   %-38s' "$name"
              if [ -n "$ns" ]; then
                a=$(dig +short A "$name" "@$ns" 2>/dev/null | tr '\n' ' ')
                echo "A(yetkili)= ${a:-YOK}"
              else
                echo "yetkili sunucu bulunamadi"
              fi
            done
            echo
          done
          IP=$(dig +short A vestrasales.com | head -1)
          echo "Sunucunun IP'si (vestrasales.com uzerinden): $IP"
          echo
          echo "== DNS'i ATLAYARAK site cevap veriyor mu =="
          # Alt adın DNS kaydı GoDaddy tarafında yok, o yüzden tarayıcı
          # sunucuya gelemiyor. Ama sunucudaki vhost hazır: adresi IP ile
          # verip Host başlığını elle yazarsak tam da tarayıcının yapacağı
          # istek oluşuyor. Böylece "DNS eksik" ile "site çalışmıyor"
          # birbirinden ayrılıyor — ikisi de aynı beyaz ekranı gösterir.
          # HTTP, HTTPS DEĞİL — bilerek.
          # HTTPS denendi, üç istek de bağlanamadan düştü. Sebep sertifika:
          # AutoSSL bir adı ancak dışarıdan doğrulayabilirse sertifika
          # veriyor, bu ad ise henüz çözülmüyor. Yani sertifika DNS'i,
          # DNS de bizi bekliyor. Şu an sorduğumuz soru "TLS hazır mı"
          # değil, "uygulama doğru kökten cevap veriyor mu" — onu 80'den
          # sormak yeterli. DNS geldiğinde AutoSSL sertifikayı kendi verir.
          : > /tmp/h.html
          for p in / /index.php /shop.php; do
            code=$(curl -sS -o /tmp/h.html -w '%{http_code}' --max-time 25 \
                   --resolve "maxsales-test.vestrasales.com:80:$IP" \
                   "http://maxsales-test.vestrasales.com$p" 2>&1 | tail -1 || echo 000)
            sig=$(grep -c 'MAXSALES' /tmp/h.html 2>/dev/null || echo 0)
            size=$(wc -c < /tmp/h.html 2>/dev/null || echo 0)
            printf '   %-14s %s  %s bayt  MAXSALES imzasi:%s\n' "$p" "$code" "$size" "$sig"
          done
          echo "   -- cevabin ilk basligi:"
          curl -sSI --max-time 20 --resolve "maxsales-test.vestrasales.com:80:$IP" \
               "http://maxsales-test.vestrasales.com/index.php" 2>&1 | head -6 | sed 's/^/      /'

          # FOTOGRAFLAR YENI KOKTEN GELIYOR MU
          # Kart saymak yetmez: kart var ama gorseli 404 ise sayfa bos
          # gorunur. Yeni kokte /uploads yolu bastan cozuluyor (belge koku
          # degisti), o yuzden asil risk burada. Ana sayfadan on adres cekip
          # tek tek soruyoruz.
          echo
          echo "== fotograflar =="
          curl -sS --max-time 25 --resolve "maxsales-test.vestrasales.com:80:$IP" \
               "http://maxsales-test.vestrasales.com/index.php" -o /tmp/home.html 2>/dev/null || true
          imgs=$(grep -oE 'src="[^"]*assets/img\.php\?[^"]*"' /tmp/home.html \
                 | sed -e 's/^src="//' -e 's/"$//' -e 's/&amp;/\&/g' -e 's#^/##' \
                 | sort -u | head -10)
          bad=0; n=0
          for q in $imgs; do
            n=$((n+1))
            c=$(curl -sS -o /tmp/i.bin -w '%{http_code}' --max-time 20 \
                --resolve "maxsales-test.vestrasales.com:80:$IP" \
                "http://maxsales-test.vestrasales.com/${q}" 2>/dev/null || echo 000)
            b=$(wc -c < /tmp/i.bin 2>/dev/null || echo 0)
            [ "$c" = "200" ] && [ "$b" -gt 500 ] || { bad=$((bad+1)); echo "   HATA $c ${b}b: ${q:0:64}"; }
          done
          echo "   $n gorsel denendi, $bad hatali"
          echo
          echo "   imza>0 ise site AYAKTA; geriye yalnizca DNS kaydi kaliyor."
