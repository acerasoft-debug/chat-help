name: (Salt-okunur) Fotoğraf kopyaları ne durumda

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Bitmemişse ve çalışan yoksa üretimi yeniden başlat (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

# Sunucuda uploads/_t altındaki hazır kopyaları sayar, üretim kayıtlarının
# sonunu gösterir, çalışan üretici var mı söyler. start=true ise ve çalışan
# yoksa iki payı yeniden başlatır (artımlı — hazırlara dokunmaz).
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Durum
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          SSHOPT="-i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p ${{ secrets.DEPLOY_PORT || 22 }}"
          ssh $SSHOPT "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" START="${{ github.event.inputs.start }}" 'bash -s' <<'SH'
          cd ~/maxsales_de || exit 1
          echo "== hazır kopya (webp) genişliğe göre =="
          for w in 180 300 420 600 900 1400; do printf '  %5s: %s\n' "$w" "$(find uploads/_t/$w -name '*.webp' 2>/dev/null | wc -l)"; done
          echo "  jpg: $(find uploads/_t -name '*.jpg' 2>/dev/null | wc -l)"
          echo "  boyut: $(du -sh uploads/_t 2>/dev/null | cut -f1) · eski önbellek .thumbs: $(du -sh uploads/.thumbs 2>/dev/null | cut -f1)"
          echo "== çalışan üretici =="
          n=$(pgrep -fc 'tools/warm-thumbs.php' || true); echo "  $n süreç"
          for f in ../data/warm-thumbs-*.log; do [ -f "$f" ] && { echo "== $f"; tail -5 "$f"; }; done
          if [ "$START" = "true" ] && [ "${n:-0}" = "0" ]; then
            for s in 0 1; do
              setsid nohup nice -n 10 php -d memory_limit=512M tools/warm-thumbs.php --budget=3300 --shard=$s/2 \
                > ../data/warm-thumbs-$s.log 2>&1 < /dev/null &
            done
            echo "== yeniden başlatıldı"
          fi
          SH
