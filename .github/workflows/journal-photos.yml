name: Journal — Wikimedia'dan moda fotoğrafı çek
on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Aranacak konular (satır satır). Boş = varsayılan moda listesi."
        required: false
        default: ""
      per_query:
        description: "Her konudan kaç fotoğraf indirilsin"
        required: false
        default: "6"
      min_width:
        description: "Bundan dar orijinaller elenir (piksel)"
        required: false
        default: "1400"
      dry_run:
        description: "true = hiçbir şey indirme, sadece bulunanları listele"
        required: false
        default: "true"

permissions:
  contents: read

# Journal editoryal bolumu icin moda fotografi indirir: uploads/journal/ altina
# kaydeder ve uploads/journal/credits.json'a kunye yazar.
#
# NEDEN WIKIMEDIA: API anahtari istemez. Karsiliginda lisans sarti var -- CC-BY ve
# CC-BY-SA gorsellerde fotografcinin adi sayfada GORUNMEK zorunda. inc/journal.php
# icindeki vestra_journal_credit() bunu okuyup her gorselin altina basar; kunye
# olmadan gorsel gosterilmez.
#
# TICARI KULLANIM FILTRESI: vestrasales.com ticari bir site, dolayisiyla NonCommercial
# (CC-BY-NC*) ve "Fair use" dosyalari ELENIR -- bunlar burada kullanilamaz. Sadece
# CC0 / Public domain / CC-BY / CC-BY-SA gecer.
#
# Sandbox'in agent-proxy'si dis siteleri engelledigi icin her sey SUNUCUDAN yapilir.
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Çek
        uses: appleboy/ssh-action@v1.0.3
        env:
          IN_QUERIES: ${{ github.event.inputs.queries }}
          IN_PER: ${{ github.event.inputs.per_query }}
          IN_MINW: ${{ github.event.inputs.min_width }}
          IN_DRY: ${{ github.event.inputs.dry_run }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 20m
          envs: IN_QUERIES,IN_PER,IN_MINW,IN_DRY
          script: |
            cat > /tmp/vestra_jphotos.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $home = getenv("HOME");
            $dir  = $home."/public_html/uploads/journal";
            $dry  = strtolower(trim((string)getenv("IN_DRY"))) !== 'false';
            $per  = max(1, (int)(getenv("IN_PER") ?: 6));
            $minw = max(400, (int)(getenv("IN_MINW") ?: 1400));

            $queries = array_values(array_filter(array_map('trim',
                preg_split('/[\r\n]+/', (string)getenv("IN_QUERIES")))));
            if (!$queries) $queries = [
                'fashion editorial photography',
                'fashion model studio portrait',
                'fashion boutique interior',
                'clothing rail retail store',
                'menswear lookbook',
                'textile fabric detail macro',
            ];

            /* Commercial site: NonCommercial and fair-use files are unusable here. */
            $licOk = function(string $l): bool {
                $l = strtolower($l);
                if ($l === '') return false;
                if (strpos($l, 'non-commercial') !== false || strpos($l, 'noncommercial') !== false
                    || strpos($l, '-nc') !== false || strpos($l, 'fair use') !== false
                    || strpos($l, 'no derivative') !== false || strpos($l, '-nd') !== false) return false;
                foreach (['cc0','public domain','cc by','cc-by','attribution'] as $ok)
                    if (strpos($l, $ok) !== false) return true;
                return false;
            };

            $get = function(string $url) {
                $ch = curl_init($url);
                curl_setopt_array($ch, [
                    CURLOPT_RETURNTRANSFER => true, CURLOPT_FOLLOWLOCATION => true,
                    CURLOPT_TIMEOUT => 60, CURLOPT_CONNECTTIMEOUT => 20,
                    /* Commons requires a real UA identifying the caller. */
                    CURLOPT_USERAGENT => 'VESTRA-Journal/1.0 (https://vestrasales.com; support@vestrasales.com)',
                ]);
                $b = curl_exec($ch); $code = curl_getinfo($ch, CURLINFO_HTTP_CODE); curl_close($ch);
                return $code === 200 ? $b : null;
            };

            if (!$dry && !is_dir($dir)) @mkdir($dir, 0755, true);
            $creditsFile = $dir.'/credits.json';
            $credits = [];
            if (is_readable($creditsFile)) {
                $j = json_decode((string)file_get_contents($creditsFile), true);
                if (is_array($j)) $credits = $j;
            }

            $strip = fn($s) => trim(preg_replace('/\s+/', ' ', html_entity_decode(strip_tags((string)$s), ENT_QUOTES, 'UTF-8')));
            $tot = 0; $kept = 0;

            foreach ($queries as $q) {
                echo "\n=== ", $q, " ===\n";
                $api = 'https://commons.wikimedia.org/w/api.php?action=query&format=json'
                     . '&generator=search&gsrnamespace=6&gsrlimit=40&gsrsearch=' . rawurlencode($q)
                     . '&prop=imageinfo&iiprop=url|size|extmetadata&iiurlwidth=1600';
                $raw = $get($api);
                if ($raw === null) { echo "  API cevap vermedi, atlandi\n"; continue; }
                $d = json_decode($raw, true);
                $pages = $d['query']['pages'] ?? [];
                if (!$pages) { echo "  sonuc yok\n"; continue; }

                $n = 0;
                foreach ($pages as $p) {
                    if ($n >= $per) break;
                    $ii = $p['imageinfo'][0] ?? null; if (!$ii) continue;
                    $title = (string)($p['title'] ?? '');
                    $w = (int)($ii['width'] ?? 0);
                    $mime = (string)($ii['mime'] ?? '');
                    if (strpos($mime, 'image/') !== 0) continue;
                    if (strpos($mime, 'svg') !== false) continue;
                    if ($w < $minw) continue;

                    $em      = $ii['extmetadata'] ?? [];
                    $license = $strip($em['LicenseShortName']['value'] ?? '');
                    $artist  = $strip($em['Artist']['value'] ?? '');
                    $desc    = $strip($em['ImageDescription']['value'] ?? '');
                    if (!$licOk($license)) { $tot++; continue; }
                    if ($artist === '') $artist = 'Wikimedia Commons';
                    if (mb_strlen($artist) > 70) $artist = mb_substr($artist, 0, 70).'…';
                    if (mb_strlen($desc) > 140)  $desc   = mb_substr($desc, 0, 140).'…';

                    $src = (string)($ii['thumburl'] ?? $ii['url'] ?? ''); if ($src === '') continue;
                    $ext = strtolower(pathinfo(parse_url($src, PHP_URL_PATH), PATHINFO_EXTENSION));
                    if (!in_array($ext, ['jpg','jpeg','png','webp'], true)) $ext = 'jpg';
                    $slug = strtolower(trim(preg_replace('/[^a-z0-9]+/i','-', preg_replace('/^File:/','',$title)), '-'));
                    $slug = substr($slug, 0, 60);
                    $name = $slug.'.'.$ext;

                    $tot++; $n++;
                    printf("  %-62s %5dpx  %s\n", substr($name,0,62), $w, $license);
                    printf("      %s\n", $artist);
                    if ($dry) continue;

                    $bin = $get($src);
                    if ($bin === null || strlen($bin) < 8000) { echo "      INDIRILEMEDI\n"; continue; }
                    file_put_contents($dir.'/'.$name, $bin);
                    $credits[$name] = [
                        'artist'  => $artist,
                        'license' => $license,
                        'source'  => 'https://commons.wikimedia.org/wiki/'.rawurlencode(str_replace(' ','_',$title)),
                        'desc'    => $desc,
                    ];
                    $kept++;
                }
            }

            if (!$dry) {
                file_put_contents($creditsFile, json_encode($credits, JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE));
                echo "\nkunye dosyasi: uploads/journal/credits.json (", count($credits), " kayit)\n";
            }
            echo "\nBITTI. incelenen: {$tot}  indirilen: {$kept}", ($dry ? "  (DRY-RUN, hicbir sey yazilmadi)" : ""), "\n";
            PHPEOF
            php /tmp/vestra_jphotos.php
            rm -f /tmp/vestra_jphotos.php
            if [ "$IN_DRY" = "false" ]; then
              echo "--- uploads/journal ---"
              ls -la "$HOME/public_html/uploads/journal" | head -40
            fi
