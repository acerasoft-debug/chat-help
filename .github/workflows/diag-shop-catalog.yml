name: (Salt-okunur) Mağaza kataloğunu dök
on:
  workflow_dispatch:

permissions:
  contents: read

# SALT OKUNUR. Mağazanın (~/maxsales_de) gördüğü kataloğu mağazanın kendi
# koduyla okur ve ÖZET basar:
#   1) B2B listings.json'da satıcı × marka dağılımı
#   2) vitrindeki ürünlerin marka / kategori / kaynak dağılımı
#   3) iç çamaşırı gibi görünen satırlar
#   4) fotoğrafı olmayan ya da dosyası diskte bulunmayan ürünler
#   5) renk: addan okunan renk + ilk düz zeminli karenin baskın rengi
# Hiçbir dosyaya yazmaz.
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Özetle
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 20m
          script: |
            cd ~/maxsales_de
            php -d memory_limit=1024M <<'PHP'
            <?php
            require 'inc/catalog.php';
            require_once 'inc/uploads.php';
            require_once 'tools/lib-photo-colour.php';
            $cat = vr_catalog();
            $raw = (array)vr_store_read('listings.json', []);
            $rawById = [];
            foreach ($raw as $r) if (is_array($r) && isset($r['id'])) $rawById[(string)$r['id']] = $r;

            echo "== 1) B2B listings.json: satici | marka (toplam " . count($raw) . ") ==\n";
            $sel = [];
            foreach ($raw as $r) if (is_array($r)) {
              $k = sprintf('%-30s | %-22s | st=%s', mb_substr((string)($r['seller'] ?? '?'),0,30), mb_substr((string)($r['brand'] ?? '?'),0,22), (string)($r['status'] ?? ''));
              $sel[$k] = ($sel[$k] ?? 0) + 1;
            }
            arsort($sel);
            $keys = []; foreach ($raw as $r) if (is_array($r)) foreach (array_keys($r) as $k) $keys[$k] = ($keys[$k] ?? 0) + 1;
            arsort($keys); echo "  alanlar: "; foreach ($keys as $k => $n) echo "$k:$n "; echo "\n\n";

            echo "== 2) vitrin: " . count($cat) . " urun — marka (kaynak) ==\n";
            $b = [];
            foreach ($cat as $id => $p) { $src = isset($rawById[$id]) ? 'b2b' : 'imp'; $k = $p['brand']; $b[$k][$src] = ($b[$k][$src] ?? 0) + 1; $b[$k]['t'] = ($b[$k]['t'] ?? 0) + 1; }
            uasort($b, fn($x, $y) => $y['t'] <=> $x['t']);
            foreach ($b as $k => $v) printf("  %4d  %-26s b2b=%d imp=%d\n", $v['t'], $k, $v['b2b'] ?? 0, $v['imp'] ?? 0);
            $c = []; foreach ($cat as $p) $c[$p['cat']] = ($c[$p['cat']] ?? 0) + 1; arsort($c);
            echo "  kategoriler: "; foreach ($c as $k => $n) echo "$k:$n | "; echo "\n\n";

            echo "== 3) ic camasiri / corap / mayo gibi gorunenler ==\n";
            $uw = '/underwear|boxer|brief|trunk|\bslip|unterw|unterhose|bra\b|bralette|sock|socken|lingerie|undershirt|tank top|vest\b|pyjama|pajama|nightwear|bodysuit|\bnbb\b/i';
            $nu = 0; $ub = [];
            foreach ($cat as $id => $p) {
              $hay = $p['brand'] . ' ' . $p['name'] . ' ' . $p['cat'] . ' ' . ($rawById[$id]['category'] ?? '') . ' ' . ($rawById[$id]['seller'] ?? '');
              if (preg_match($uw, $hay)) { $nu++; $ub[$p['brand'] . ' / ' . $p['cat']] = ($ub[$p['brand'] . ' / ' . $p['cat']] ?? 0) + 1; }
            }
            arsort($ub); foreach ($ub as $k => $n) printf("  %4d  %s\n", $n, $k);
            echo "  toplam: $nu\n\n";

            echo "== 4) fotografi eksik ==\n";
            $none = []; $broken = []; $one = 0;
            foreach ($cat as $id => $p) {
              $imgs = array_values(array_filter((array)($p['images'] ?? []), 'strlen'));
              $ok = 0; foreach ($imgs as $i) if (vr_upload_exists($i) || str_starts_with($i, 'http')) $ok++;
              if (!$imgs) $none[] = $id; elseif ($ok === 0) $broken[] = $id; elseif ($ok === 1) $one++;
            }
            printf("  hic yok: %d · dosyasi kayip: %d · tek kare: %d\n", count($none), count($broken), $one);
            $mb = []; foreach (array_merge($none, $broken) as $id) { $k = $cat[$id]['brand']; $mb[$k] = ($mb[$k] ?? 0) + 1; }
            arsort($mb); foreach ($mb as $k => $n) printf("  %4d  %s\n", $n, $k);
            echo "\n";

            echo "== 5) renk ==\n";
            $words = 'black|white|navy|blue|grey|gray|beige|cream|ivory|red|burgundy|bordeaux|green|khaki|olive|brown|camel|pink|yellow|orange|purple|lilac|multicolou?r|silver|gold|ecru|sand|stone|charcoal|anthracite|light blue|sky|turquoise|mint|coral|schwarz|weiss|weiß|blau|grau|rot|gruen|grün|braun|nero|bianco';
            $byName = 0; $grp = 0; $samples = [];
            $vix = vr_variant_index(); foreach ($vix as $ids) $grp++;
            $photoCols = [];
            foreach ($cat as $id => $p) {
              $nm = vr_variant_colour($p) ?: (preg_match('/\b(' . $words . ')\b/i', $p['name'] . ' ' . ($p['desc'] ?? ''), $m) ? $m[1] : '');
              if ($nm !== '') $byName++;
              $img = function_exists('vr_swatch_image') ? vr_swatch_image($p) : (($p['images'][0] ?? ''));
              $dom = null;
              if ($img !== '' && str_starts_with($img, '/uploads/')) {
                $abs = vr_doc_root() . $img;
                $r = cac_pixels($abs);
                if ($r && $r[1] >= 0.08) $dom = cac_dominant($r[0]);
              }
              $hex = $dom ? sprintf('#%02x%02x%02x', ...$dom) : '-';
              $photoCols[$hex === '-' ? 'olculemedi' : 'olculdu'] = ($photoCols[$hex === '-' ? 'olculemedi' : 'olculdu'] ?? 0) + 1;
              if (false) $samples[] = sprintf("  %-22s %-14s ad=%-12s foto=%s  %s", $id, mb_substr($p['brand'],0,14), $nm ?: '-', $hex, mb_substr($p['name'],0,46));
            }
            printf("  adinda renk gecen: %d / %d · renk grubu (ayni model birden cok renk): %d\n", $byName, count($cat), $grp);
            echo "  foto rengi: "; foreach ($photoCols as $k => $n) echo "$k=$n "; echo "\n  ornekler:\n" . implode("\n", $samples) . "\n";

            echo "\n== 6) colors alani ornekleri ==\n";
            $shown = 0;
            foreach ($raw as $r) {
              if (!is_array($r) || empty($r['colors'])) continue;
              if ($shown++ >= 14) break;
              printf("  %-20s %-14s %s\n     colors=%s\n", mb_substr((string)$r['id'],0,20), mb_substr((string)$r['brand'],0,14), mb_substr((string)$r['name'],0,50), mb_substr(json_encode($r['colors'], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES),0,260));
            }
            $cb = []; foreach ($raw as $r) if (is_array($r) && !empty($r['colors'])) $cb[(string)$r['brand']] = ($cb[(string)$r['brand']] ?? 0) + 1;
            arsort($cb); echo "  colors olan markalar: "; foreach ($cb as $k => $n) echo "$k:$n "; echo "\n";

            echo "\n== 7) D&G Tank Tops / Basics adlari ==\n";
            foreach ($cat as $id => $p) if (in_array($p['cat'], ['Tank Tops', 'Westen', 'Activewear'], true)) printf("  %-22s %-14s %-12s %s\n", $id, mb_substr($p['brand'],0,14), $p['cat'], mb_substr($p['name'],0,60));

            echo "\n== 8) kayip dosyalar Vestra klasorunde var mi ==\n";
            $vroot = getenv('HOME') . '/public_html';
            $inV = 0; $nowhere = 0; $nwBrand = [];
            foreach ($cat as $id => $p) {
              $imgs = array_values(array_filter((array)($p['images'] ?? []), 'strlen'));
              $okShop = 0; $okV = 0;
              foreach ($imgs as $i) { if (vr_upload_exists($i)) $okShop++; elseif (is_file($vroot . $i)) $okV++; }
              if ($okShop === 0 && $imgs) { if ($okV > 0) $inV++; else { $nowhere++; $nwBrand[$p['brand']] = ($nwBrand[$p['brand']] ?? 0) + 1; } }
            }
            printf("  magazada yok ama Vestra'da var: %d · hicbir yerde yok: %d\n", $inV, $nowhere);
            arsort($nwBrand); foreach ($nwBrand as $k => $n) printf("     %4d  %s\n", $n, $k);
            printf("  uploads boyutu: magaza %s · vestra %s\n", trim((string)shell_exec('du -sh ~/maxsales_de/uploads 2>/dev/null | cut -f1')), trim((string)shell_exec('du -sh ~/public_html/uploads 2>/dev/null | cut -f1')));
            printf("  disk: %s\n", trim((string)shell_exec('df -h ~ | tail -1')));

            echo "\n== 9) rengi bilinmeyen vitrin urunleri ==\n";
            $nc = 0; $ncb = [];
            foreach ($cat as $id => $p) {
              if (vr_product_colours($p)) continue;
              $nc++; $ncb[$p['brand']] = ($ncb[$p['brand']] ?? 0) + 1;
              printf("  %-26s %-14s %-38s %s\n", mb_substr($id,0,26), mb_substr($p['brand'],0,14), mb_substr(vr_card_name($p),0,38), vr_swatch_image($p));
            }
            echo "  toplam: $nc · "; foreach ($ncb as $k => $n) echo "$k:$n "; echo "\n";
            $multi = 0; foreach ($cat as $p) if (count(vr_product_colours($p)) > 1) $multi++;
            echo "  birden cok rengi olan urun: $multi\n";
            PHP
