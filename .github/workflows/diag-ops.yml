name: (Tanı) Sunucu zamanlayıcısı — GitHub anahtarı var mı, ops kayıtları
# Salt okuma. Anahtarın KENDİSİ basılmaz (yalnız var/yok ve uzunluk).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 2m
          script: |
            cd ~/public_html
            php -r 'require "inc/products.php"; require_once "inc/finder.php"; $t=vestra_finder_gh_token(); echo "gh_token: ".($t===""?"YOK":"var (".strlen($t)." karakter)")." · repo ".vestra_finder_repo()."\n"; echo "ops_tick.json: ".json_encode(vestra_read_json("ops_tick.json"))."\n"; echo "finder_runs via: ".json_encode(array_slice(array_map(fn($r)=>[$r["requested_at"]??"",$r["via"]??"",$r["status"]??""], vestra_finder_runs()),0,4))."\n";'
            echo "== cron satiri =="; crontab -l 2>/dev/null | grep -i "cron_mailbox" | sed 's/[A-Za-z0-9_]\{30,\}/***/g'
            for L in ~/vestra_sweep.log ~/public_html/data/vestra_sweep.log; do [ -f "$L" ] && { echo "== $L (ops/finder/hata, son 25) =="; grep -a "\[ops\|\[finder\|Fatal\|Warning" "$L" | tail -25; }; done
