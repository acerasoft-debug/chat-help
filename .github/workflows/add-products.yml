name: Kataloğa yeni ürünler ekle (doğrulamalı)
on:
  workflow_dispatch:
    inputs:
      file:
        description: "Ürün tanım dosyası (repo kökünden yol, örn: product-batches/batch1.json)"
        required: true
      stage_from:
        description: "Opsiyonel: fotoğrafları sunucudaki bir kaynak klasörden uploads/ altına TAŞI (ör. wt_incoming/abc37eb240b7 → $HOME altı, alt klasörler taranır). Yalnızca üründe geçen dosya adları kopyalanır; ad küçük harfe/aksansıza çevrilir. dry_run=true iken kopyalamaz, sadece kaynakta var mı diye bakar."
        required: false
        default: ""
      dry_run:
        description: "true = SADECE ne ekleneceğini yaz, KAYDETME"
        required: true
        default: "true"

permissions:
  contents: read

# listings.json'a yeni ürün satırları ekler. Ürün tanımları REPODAKI bir JSON
# dosyasından okunur — workflow_dispatch girdisinin ~64KB sınırı yok, ve eklenen
# her satır git geçmişinde denetlenebilir kalıyor.
#
# Katı doğrulama — HEPSİ ya da HİÇBİRİ:
#  - id/brand/name/cat/sku/list/moq zorunlu; fiyat>0, moq>=1
#  - her ürünün en az 1 görseli olmalı ve o dosya SUNUCUDA GERÇEKTEN VAR olmalı
#  - id ve marka+SKU mevcut katalogla ve kendi içinde çakışamaz
# Kaydetmeden önce zaman damgalı yedek alır, sonra geri okuyup sayıyı doğrular.
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dosyayı oku ve kodla
        env:
          RAW_FILE: ${{ github.event.inputs.file }}
        run: |
          set -e
          case "$RAW_FILE" in
            */../*|/*|*..*) echo "HATA: gecersiz yol"; exit 1 ;;
          esac
          [ -f "$RAW_FILE" ] || { echo "HATA: dosya yok: $RAW_FILE"; exit 1; }
          case "$RAW_FILE" in
            *.enc) python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert set(d)>={'key','iv','data'}, 'sifreli paket key/iv/data tasimali'; print('SIFRELI paket — sunucuda cozulecek')" "$RAW_FILE" ;;
            *)     python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert isinstance(d,list) and d, 'JSON dizi degil/bos'; print(f'urun sayisi: {len(d)}')" "$RAW_FILE" ;;
          esac
          echo "P_JSON=$(base64 -w0 < "$RAW_FILE")" >> "$GITHUB_ENV"

      - name: Ürünleri ekle
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 10m
          script: |
            echo "ADIM 1: baglanti tamam"
            export P_JSON='${{ env.P_JSON }}'
            export P_DRY='${{ github.event.inputs.dry_run }}'
            export P_STAGE='${{ github.event.inputs.stage_from }}'
            echo "ADIM 2: P_JSON uzunluk=${#P_JSON}"
            cat > /tmp/vestra_addproducts.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); ini_set('display_startup_errors','1'); error_reporting(E_ALL);
            register_shutdown_function(function(){
              $e = error_get_last();
              if ($e && in_array($e['type'],[E_ERROR,E_PARSE,E_CORE_ERROR,E_COMPILE_ERROR],true))
                fwrite(STDERR, "PHP OLUMCUL: {$e['message']} ({$e['file']}:{$e['line']})\n");
            });
            $home = getenv("HOME"); $doc = $home."/public_html";
            require $doc."/inc/auth.php";
            require $doc."/inc/products.php";
            foreach (['vestra_listings','vestra_save_listings','vestra_data_dir'] as $fn)
              if (!function_exists($fn)) { fwrite(STDERR,"HATA: {$fn}() yok\n"); exit(1); }

            $dry = strtolower(trim((string)getenv("P_DRY"))) !== 'false';
            $dec = base64_decode((string)getenv("P_JSON"), true);
            if ($dec === false) { fwrite(STDERR,"HATA: base64 cozulemedi\n"); exit(1); }
            $rows = json_decode($dec, true);
            /* SIFRELI paket (product-batches/*.enc): ucuncu tarafin tarifesi bu depoya ACIK
               giremez (bkz. product-batches/pili-perez-NOTLAR.md). Paket disarida, sunucunun
               diag-live 'wetransfer_probe |fetch' adiminin loga bastigi ACIK anahtarla
               sifrelendi: rastgele AES-256 anahtari RSA-OAEP ile, urun listesi AES-CBC ile.
               Ozel anahtar ~/.vestra_import/import_key.pem -- sunucudan hic cikmadi. */
            if (is_array($rows) && isset($rows['key'], $rows['iv'], $rows['data']) && !isset($rows[0])) {
              $kf = $home.'/.vestra_import/import_key.pem';
              if (!is_file($kf)) { fwrite(STDERR,"HATA: ice aktarma anahtari yok ({$kf}) -- once diag-live wetransfer_probe |fetch calistirin\n"); exit(1); }
              $pk = openssl_pkey_get_private((string)file_get_contents($kf));
              $aes = '';
              if (!$pk || !openssl_private_decrypt(base64_decode($rows['key']), $aes, $pk, OPENSSL_PKCS1_OAEP_PADDING)) { fwrite(STDERR,"HATA: AES anahtari cozulemedi (yanlis acik anahtarla mi sifrelendi?)\n"); exit(1); }
              $plain = openssl_decrypt(base64_decode($rows['data']), 'aes-256-cbc', $aes, OPENSSL_RAW_DATA, base64_decode($rows['iv']));
              if ($plain === false) { fwrite(STDERR,"HATA: paket cozulemedi\n"); exit(1); }
              $rows = json_decode($plain, true);
              echo "sifreli paket COZULDU: ".(is_array($rows) ? count($rows) : 0)." satir\n";
            }
            if (!is_array($rows) || !$rows) { fwrite(STDERR,"HATA: JSON dizi degil/bos\n"); exit(1); }

            /* Fotograf sahneleme: kaynak klasor (public_html DISI, ornegin WeTransfer'den
               inen ~/wt_incoming/<id>) taranir, urunlerde gecen dosya adlari kucuk harf +
               aksansiz adla uploads/ altina KOPYALANIR (kaynak silinmez). Yalnizca gecen
               adlar: 595 dosyanin tumunu dokup 40'ini bos birakmak yerine, eslesen kopyalanir,
               eslesmeyen raporlanir. dry_run'da kopya yok -- varlik kontrolu kaynaga bakar. */
            $stage = trim((string)getenv("P_STAGE"));
            $stageMap = [];
            $fold = function (string $s): string {
              $t = @iconv('UTF-8', 'ASCII//TRANSLIT//IGNORE', $s); if ($t === false || $t === '') $t = $s;
              $t = str_replace('?', '', $t);   // cevrilemeyen isaret ('✓' gibi) glibc'de '?' olur; iki tarafta da at, '-' artigi kalmasin
              return strtolower(preg_replace('/[^A-Za-z0-9.-]+/', '-', $t));   // '_' de '-' olur: gorsel yolu deseni alt cizgiye izin vermiyor
            };
            if ($stage !== '') {
              if (str_contains($stage, '..') || $stage[0] === '/') { fwrite(STDERR,"HATA: gecersiz stage_from\n"); exit(1); }
              $src = $home.'/'.$stage;
              if (!is_dir($src)) { fwrite(STDERR,"HATA: kaynak klasor yok: {$src}\n"); exit(1); }
              $it = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($src, FilesystemIterator::SKIP_DOTS));
              foreach ($it as $f) { if ($f->isFile()) $stageMap[$fold($f->getFilename())] = $f->getPathname(); }
              echo "sahneleme kaynagi: {$src} (".count($stageMap)." dosya)\n";
            }
            $staged = 0; $stageMiss = [];
            $stageImage = function (string $img) use (&$stageMap, &$staged, &$stageMiss, $doc, $dry, $fold): bool {
              if (is_file($doc.$img)) return true;
              if (!$stageMap) return false;
              $key = $fold(basename($img));
              if (!isset($stageMap[$key])) { $stageMiss[] = $img; return false; }
              if ($dry) return true;                       // kaynakta var: gercek kosuda kopyalanacak
              $dir = dirname($doc.$img);
              if (!is_dir($dir) && !@mkdir($dir, 0755, true)) return false;
              if (!@copy($stageMap[$key], $doc.$img)) return false;
              $staged++;
              return true;
            };

            $existing = vestra_listings();
            $seenId = []; $seenBS = [];
            foreach ($existing as $p) {
              $seenId[strtolower((string)($p['id']??''))] = true;
              $seenBS[strtolower(trim(($p['brand']??'').'|'.($p['sku']??'')))] = true;
            }
            $sellerIds = [];
            foreach (auth_accounts() as $acc) if (($acc['type'] ?? '') === 'seller') $sellerIds[(string)($acc['id'] ?? '')] = true;

            $errors = []; $clean = [];
            foreach ($rows as $i => $r) {
              $ctx = "satir ".($i+1);
              $id    = strtolower(trim((string)($r['id'] ?? '')));
              $brand = trim((string)($r['brand'] ?? ''));
              $name  = trim((string)($r['name'] ?? ''));
              $cat   = trim((string)($r['cat'] ?? ''));
              $sku   = trim((string)($r['sku'] ?? ''));
              $list  = $r['list'] ?? null;
              $moq   = $r['moq'] ?? null;
              if (!preg_match('/^[a-z0-9][a-z0-9-]{2,59}$/', $id)) { $errors[]="{$ctx}: gecersiz id '{$id}'"; continue; }
              if ($brand===''||$name===''||$cat===''||$sku==='') { $errors[]="{$ctx} ({$id}): brand/name/cat/sku bos"; continue; }
              if (!is_numeric($list) || (float)$list <= 0) { $errors[]="{$ctx} ({$id}): gecersiz fiyat"; continue; }
              if (!is_numeric($moq) || (int)$moq < 1) { $errors[]="{$ctx} ({$id}): gecersiz MOQ"; continue; }
              /* Coktan-az kademeli fiyatlandirma (ornek: 80 ad. 26.90, 160 ad. 25.00).
                 Verilmezse asagida tek kademeli varsayilana duser -- mevcut butun
                 batch dosyalari bunu vermiyor, davranislari degismez. */
              $tiers = null;
              if (isset($r['tiers'])) {
                if (!is_array($r['tiers']) || !$r['tiers']) { $errors[]="{$ctx} ({$id}): tiers bos olmayan dizi olmali"; continue; }
                $tiers = []; $prevMin = 0; $tiersOk = true;
                foreach ($r['tiers'] as $t) {
                  if (!is_array($t) || !isset($t['min'],$t['price']) || !is_numeric($t['min']) || (int)$t['min'] < 1
                      || !is_numeric($t['price']) || (float)$t['price'] <= 0 || (int)$t['min'] <= $prevMin) {
                    $tiersOk = false; break;
                  }
                  $prevMin = (int)$t['min'];
                  $tiers[] = ['min'=>(int)$t['min'], 'price'=>(float)$t['price']];
                }
                if (!$tiersOk) { $errors[]="{$ctx} ({$id}): gecersiz tiers (min kesin artan tam sayi >=1, price>0 olmali)"; continue; }
              }
              $imgs = $r['images'] ?? [];
              if (!is_array($imgs) || !count($imgs)) { $errors[]="{$ctx} ({$id}): gorsel yok — fotografsiz urun eklenemez"; continue; }
              foreach ($imgs as $img) {
                if (!is_string($img) || !preg_match('#^/uploads/[a-z0-9._/-]+$#', $img)) { $errors[]="{$ctx} ({$id}): gecersiz gorsel yolu '".(is_string($img)?$img:'?')."'"; continue 2; }
                if (!$stageImage($img)) { $errors[]="{$ctx} ({$id}): gorsel SUNUCUDA YOK: {$img}"; continue 2; }
              }
              $bs = strtolower(trim($brand.'|'.$sku));
              if (isset($seenId[$id])) { $errors[]="{$ctx} ({$id}): bu id zaten var"; continue; }
              if (isset($seenBS[$bs])) { $errors[]="{$ctx} ({$id}): {$brand}+{$sku} zaten var"; continue; }
              $seenId[$id]=true; $seenBS[$bs]=true;

              $row = [
                'id'=>$id, 'brand'=>$brand, 'name'=>$name, 'cat'=>$cat, 'sku'=>$sku,
                'moq'=>(int)$moq, 'unit'=>trim((string)($r['unit'] ?? 'pc')) ?: 'pc',
                'mode'=>trim((string)($r['mode'] ?? 'sale')) ?: 'sale',
                'list'=>(float)$list,
                'verified'=>true, 'status'=>'approved',
                'images'=>array_values($imgs),
                'tiers'=>$tiers ?? [['min'=>(int)$moq, 'price'=>(float)$list]],
                'added_at'=>date('c'),
              ];
              if (!empty($r['sizes']) && is_string($r['sizes'])) $row['sizes'] = trim($r['sizes']);
              if (!empty($r['desc'])  && is_string($r['desc']))  $row['desc']  = trim($r['desc']);
              if (!empty($r['colors']) && is_array($r['colors'])) $row['colors'] = array_values(array_filter($r['colors'],'is_string'));
              if (!empty($r['pinned'])) $row['pinned'] = true;
              if (isset($r['size_step']) && is_numeric($r['size_step']) && (int)$r['size_step'] > 1) $row['size_step'] = (int)$r['size_step'];
              if (isset($r['min_colors']) && is_numeric($r['min_colors']) && (int)$r['min_colors'] >= 1) $row['min_colors'] = (int)$r['min_colors'];
              /* seller_email: satici hesabini e-postadan coz (teshis ciktisi id'yi 8 karaktere
                 maskeliyor, tam uid disaridan bilinmiyor). Paket sifreli oldugu icin adres
                 depoya acik girmiyor; cozumleme sunucuda. */
              if (empty($r['seller_uid']) && !empty($r['seller_email'])) {
                $se = strtolower(trim((string)$r['seller_email']));
                foreach (auth_accounts() as $acc) if (($acc['type'] ?? '') === 'seller' && strtolower((string)($acc['email'] ?? '')) === $se) { $r['seller_uid'] = (string)$acc['id']; break; }
                if (empty($r['seller_uid'])) { $errors[]="{$ctx} ({$id}): seller_email ile eslesen satici hesabi yok"; continue; }
              }
              if (!empty($r['seller_uid'])) {
                $su = (string)$r['seller_uid'];
                if (!isset($sellerIds[$su])) { $errors[]="{$ctx} ({$id}): seller_uid '{$su}' gecerli bir seller hesabina ait degil"; continue; }
                $row['seller_uid'] = $su;
              }
              /* Vitrin bolmesi. Bu gecis olmadan bolme alani sessizce dusuyordu ve
                 urun varsayilan bolmede (Premium Brands) beliriyordu -- bir ayakkabi
                 katalogunu Ayakkabi sekmesine koydugunu sanip Premium'a dokmek, fark
                 edilmesi en zor turden bir hata: is basarili raporlar, urunler
                 gorunur, sadece YANLIS yerdedirler. Bilinmeyen bolme sessizce
                 yoksayilmiyor, hata veriyor. */
              if (!empty($r['section'])) {
                $sec = strtolower(trim((string)$r['section']));
                if (!isset(vestra_sections()[$sec])) { $errors[]="{$ctx} ({$id}): bilinmeyen bolme '{$sec}' (gecerli: ".implode(', ', array_keys(vestra_sections())).")"; continue; }
                $row['section'] = $sec;
              }
              $clean[] = $row;
            }

            if ($errors) {
              fwrite(STDERR, "DOGRULAMA HATALARI (hicbir sey eklenmedi):\n");
              foreach ($errors as $e) fwrite(STDERR, "  - {$e}\n");
              exit(1);
            }

            echo "dogrulama gecti: ".count($clean)." urun\n";
            if ($stage !== '') echo "sahnelenen foto: ".($dry ? '(dry_run: kopyalanmadi, kaynakta bulundu)' : $staged)."  kaynakta bulunamayan: ".count($stageMiss)."\n";
            echo "\n";
            foreach ($clean as $r) {
              printf("  + %-24s | %-16s | %-38s | %s | %.2f EUR | MOQ %d | foto %d\n",
                $r['id'], $r['brand'], mb_substr($r['name'],0,38), $r['cat'], $r['list'], $r['moq'], count($r['images']));
            }
            if ($dry) { echo "\nDRY RUN — hicbir sey kaydedilmedi. Eklemek icin dry_run=false.\n"; exit(0); }

            $dir = vestra_data_dir();
            $bak = $dir.'/listings.json.bak-'.gmdate('Ymd-His');
            if (!@copy($dir.'/listings.json', $bak)) { fwrite(STDERR,"HATA: yedek alinamadi\n"); exit(1); }
            echo "\nyedek: {$bak}\n";

            $before = count($existing);
            foreach ($clean as $r) $existing[] = $r;
            vestra_save_listings(array_values($existing));

            clearstatcache();
            $check = vestra_listings();
            if (count($check) !== $before + count($clean)) {
              fwrite(STDERR, "HATA: kayit sonrasi sayi tutmadi! yedek: {$bak}\n"); exit(1);
            }
            echo "KAYDEDILDI — ".count($clean)." yeni urun, katalog ".$before." -> ".count($check)."\n";
            PHPEOF
            echo "ADIM 3: dosya yazildi ($(wc -l < /tmp/vestra_addproducts.php) satir)"
            php -l /tmp/vestra_addproducts.php
            echo "ADIM 4: calistiriliyor"
            php /tmp/vestra_addproducts.php; RC=$?
            echo "ADIM 5: cikis kodu=$RC"
            rm -f /tmp/vestra_addproducts.php
            exit $RC
