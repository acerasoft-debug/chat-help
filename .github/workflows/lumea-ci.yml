name: LUMÉA — CI

on:
  push:
    paths: ['lumea/**', '.github/workflows/lumea-ci.yml']
  pull_request:
    paths: ['lumea/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: lumea } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: i18n parity
        run: node scripts/check-i18n.mjs
      - name: Build 5-locale static site
        run: node scripts/build.mjs
      - name: End-to-end API journeys
        run: node test/e2e.mjs
      - name: Container image builds
        run: docker build -t lumea:ci .
