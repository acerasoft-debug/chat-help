name: (Salt-okunur) VESTRA canlı ekran görüntüsü

on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Virgülle sayfalar (ör. /,/wholesale). Her biri masaüstü + telefon, tam sayfa."
        required: false
        default: "/"
      tag:
        description: "Klasör adı (diag/vestra/<tag>/)"
        required: false
        default: "now"

permissions:
  contents: write

# SALT OKUNUR (siteye karşı): yalnız sayfayı açar, ekran görüntüsü + HTML'den
# marka adlarının sayımını alır ve dala işler (diag/vestra/<tag>/). Sunucuya
# hiçbir şey yazmaz, kimseye bir şey göndermez.
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright@1.56.1
          npx playwright install --with-deps chromium > /dev/null
      - name: Çek
        env:
          P: ${{ github.event.inputs.paths }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          T=$(echo "$TAG" | tr -cd 'A-Za-z0-9_-'); [ -n "$T" ] || T=now
          OUT="$GITHUB_WORKSPACE/diag/vestra/$T"; rm -rf "$OUT"; mkdir -p "$OUT"
          cd /tmp/pw && cat > s.js <<'JSEOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const out = process.argv[2], paths = process.argv[3].split(',').map(s => s.trim()).filter(Boolean);
            const base = 'https://vestrasales.com';
            const b = await chromium.launch();
            for (const [tag, opt] of [['d', { viewport: { width: 1440, height: 900 } }], ['m', { viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true }]]) {
              const ctx = await b.newContext({ ...opt, locale: 'en-US' });
              const p = await ctx.newPage();
              for (const u of paths) {
                const slug = (u.replace(/[^a-z0-9]+/gi, '_').replace(/^_|_$/g, '') || 'home');
                await p.goto(base + u, { waitUntil: 'networkidle', timeout: 60000 }).catch(e => console.log('goto', u, e.message));
                await p.waitForTimeout(1500);
                await p.evaluate(async () => {
                  document.querySelectorAll('#cnotice,[class*=cookie]').forEach(e => e.remove());
                  for (let y = 0; y < document.body.scrollHeight; y += 700) { window.scrollTo(0, y); await new Promise(r => setTimeout(r, 120)); }
                  window.scrollTo(0, 0);
                  document.querySelectorAll('.reveal').forEach(e => e.classList.add('in', 'visible', 'shown'));
                }).catch(() => {});
                await p.waitForTimeout(800);
                await p.screenshot({ path: `${out}/${tag}-${slug}.png`, fullPage: true });
                if (tag === 'd') {
                  const html = await p.content();
                  fs.writeFileSync(`${out}/${slug}.html`, html);
                  const txt = await p.evaluate(() => document.body.innerText);
                  const cnt = {};
                  for (const w of ['Gucci', 'Balenciaga', 'Lacoste', 'Ralph Lauren', 'DSQUARED2', 'Dolce']) cnt[w] = (txt.match(new RegExp(w, 'gi')) || []).length + ' metin / ' + (html.match(new RegExp(w, 'gi')) || []).length + ' html';
                  console.log(u, JSON.stringify(cnt));
                }
              }
              await ctx.close();
            }
            await b.close();
          })();
          JSEOF
          node s.js "$OUT" "$P"
      - name: Dala işle
        if: always()
        run: |
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          git add -f diag/vestra 2>/dev/null; true
          git diff --cached --quiet && exit 0
          git commit -q -m "Teşhis: VESTRA canlı ekran görüntüleri"
          for i in 1 2 3 4; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 3))
          done
