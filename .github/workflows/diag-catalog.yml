name: (Salt-okunur) Yüklenen görselleri markaya göre listele
on:
  workflow_dispatch:

permissions:
  contents: read

# Salt-okunur. uploads/balmain, uploads/balenciaga-burberry, uploads/shorts-sweats
# altındaki TÜM dosyaları marka tahminiyle gruplayıp tam listeyi basar — ürün
# satırlarını gerçek kodlarla kurabilmek için. Hiçbir şeyi DEĞİŞTİRMEZ.
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Listele
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 10m
          script: |
            cat > /tmp/diag_imgs.php <<'PHPEOF'
            <?php
            $doc = getenv("HOME")."/public_html";
            $dirs = ['balmain','balenciaga-burberry','shorts-sweats'];
            $byBrand = [];
            $total = 0;
            foreach ($dirs as $d) {
              $p = "{$doc}/uploads/{$d}";
              if (!is_dir($p)) { echo "YOK: uploads/{$d}\n"; continue; }
              foreach (scandir($p) as $f) {
                if ($f === '.' || $f === '..') continue;
                if (!preg_match('/\.(jpe?g|png|webp)$/i', $f)) continue;
                $total++;
                $l = strtolower($f);
                // Marka tahmini: dosya adindaki markaya isaret eden parcalar.
                if (preg_match('/^(balmain|balma-n)/', $l))                 $b = 'BALMAIN';
                elseif (preg_match('/^(balenciaga|balenciag|balencaga|balncaga|blcg|blnc)/', $l)) $b = 'Balenciaga';
                elseif (preg_match('/^(burberry|burbeery)/', $l))           $b = 'Burberry';
                elseif (preg_match('/^d-g-/', $l))                          $b = 'Dolce & Gabbana';
                else                                                        $b = '(BELIRSIZ)';
                $byBrand[$b][] = "uploads/{$d}/{$f}";
              }
            }
            ksort($byBrand);
            echo "TOPLAM GORSEL: {$total}\n\n";
            foreach ($byBrand as $b => $files) {
              sort($files);
              echo "===== {$b} — ".count($files)." gorsel =====\n";
              foreach ($files as $f) echo "  {$f}\n";
              echo "\n";
            }
            PHPEOF
            php /tmp/diag_imgs.php
            rm -f /tmp/diag_imgs.php
