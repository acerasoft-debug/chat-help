name: (Tek seferlik) Katalog foto + marka teshis (salt-okunur)
on:
  workflow_dispatch:

permissions:
  contents: read

# Salt-okunur teshis: (1) deploy.sh uploads senkron mantigi, (2) sunucuda amiri
# gorselleri var mi, (3) her urunun gorselleri diskte mi, (4) kampanya indirme
# linkleri (top-8 marka) neler. Hicbir sey DEGISTIRMEZ.
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Teshis
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 3m
          script: |
            H="$HOME"
            echo "== deploy.sh (uploads ile ilgili satirlar) =="
            grep -niE "uploads|rsync|--delete|exclude|git " "$H/deploy.sh" 2>/dev/null | head -30 || echo "deploy.sh okunamadi"
            echo
            echo "== uploads/amiri =="
            ls -la "$H/public_html/uploads/amiri/" 2>&1
            echo
            cat > /tmp/vdiag.php <<'PHPEOF'
            <?php
            $home=getenv("HOME"); $pub=$home."/public_html";
            require $pub."/inc/notify.php";
            require $pub."/inc/products.php";
            echo "== her urunun gorselleri diskte mi ==\n";
            foreach(vestra_products() as $p){
              $imgs=(!empty($p["images"])&&is_array($p["images"]))?$p["images"]:(!empty($p["image"])?[$p["image"]]:[]);
              $on=0; foreach($imgs as $im){ if(is_string($im)&&$im!==""&&$im[0]==="/"&&is_file($pub.$im)) $on++; }
              $nv=!empty($p["variants"])&&is_array($p["variants"])?count($p["variants"]):0;
              echo "  ".($p["id"]??"?")." | ".($p["brand"]??"?")." | sku=".($p["sku"]??"-")." | varyant=$nv | gorsel_diskte=$on/".count($imgs)."\n";
            }
            echo "\n== kampanya indirme linkleri (top-8) ==\n";
            list($s,$b,$opts)=vestra_campaign_preview();
            foreach(($opts["downloads"]["items"]??[]) as $it){ echo "  ".($it["label"]??"?")." -> ".($it["url"]??"?")."\n"; }
            PHPEOF
            php /tmp/vdiag.php
            rm -f /tmp/vdiag.php
