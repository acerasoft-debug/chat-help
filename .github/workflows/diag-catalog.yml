name: (Salt-okunur) Teşhis — dg-101209 kaç kez var, farkli mi
on:
  workflow_dispatch:

permissions:
  contents: read

# Salt-okunur. dg-101209 listings.json'da birden fazla kez geçiyor mu, geçiyorsa
# satirlar birbirinin ayni mi yoksa farkli alanlari mi var, gosterir. Hicbir seyi
# DEGISTIRMEZ.
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Teşhis
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 10m
          script: |
            cat > /tmp/diag_dup.php <<'PHPEOF'
            <?php
            $home = getenv("HOME");
            require $home."/public_html/inc/products.php";
            $all = vestra_listings();

            $idx = [];
            foreach ($all as $i => $p) {
              $id = (string)($p['id'] ?? '');
              if ($id === '') continue;
              $idx[$id][] = $i;
            }
            $dupes = array_filter($idx, fn($v) => count($v) > 1);
            echo "toplam kayit: ".count($all)."\n";
            echo "tekrarlayan id sayisi: ".count($dupes)."\n\n";
            foreach ($dupes as $id => $rows) {
              echo "== {$id} ({$id}) — ".count($rows)." kez ==\n";
              $prev = null;
              foreach ($rows as $r) {
                $p = $all[$r];
                echo "  satir #{$r}:\n";
                foreach (['brand','name','cat','sku','list','moq','sizes','images','added_at'] as $k) {
                  $v = $p[$k] ?? null;
                  echo "    {$k} = ".(is_array($v) ? json_encode($v) : (string)$v)."\n";
                }
                if ($prev !== null) {
                  $diffKeys = [];
                  $allKeys = array_unique(array_merge(array_keys($prev), array_keys($p)));
                  foreach ($allKeys as $k) {
                    $a = $prev[$k] ?? null; $b = $p[$k] ?? null;
                    if (json_encode($a) !== json_encode($b)) $diffKeys[] = $k;
                  }
                  echo "  >> onceki satirdan farkli alanlar: ".($diffKeys ? implode(', ',$diffKeys) : '(YOK — tamamen ayni)')."\n";
                }
                $prev = $p;
              }
              echo "\n";
            }
            if (!$dupes) echo "tekrarlayan id yok.\n";
            PHPEOF
            php /tmp/diag_dup.php
            rm -f /tmp/diag_dup.php
