name: Dış siteden ürün görseli/koleksiyon çek
on:
  workflow_dispatch:
    inputs:
      collection_url:
        description: "MOD A: Shopify koleksiyon URL'si (örn: https://site.com/collections/lacoste) -- TUM urunleri JSON API ile listeler, hicbir sey indirmez"
        required: false
        default: ""
      urls:
        description: "MOD B: tek tek ürün sayfası URL'leri (satır satır/boşlukla) -- ilk fotoyu indirir"
        required: false
        default: ""
      prefix:
        description: "MOD B: kayıt yolu ön eki (uploads/ altında, örn: lacoste/paris-polo)"
        required: false
        default: "lacoste/paris-polo"
      dump_id:
        description: "MOD B: referans için önce bu ürün id'sinin tam kaydını yazdır (opsiyonel)"
        required: false
        default: ""
      image_map:
        description: "MOD C: satır satır 'uploads/altindaki/yol.ext|https://gorsel-url' -- bilinen CDN url'lerini dogrudan indirir"
        required: false
        default: ""
      search_stores:
        description: "MOD D: aranacak mağaza kök URL'leri (satır satır/virgülle) -- her birinin products.json'unda arar, hicbir sey indirmez"
        required: false
        default: ""
      search_term:
        description: "MOD D: aranan metin(ler), virgülle ayrık (baslik/handle/SKU icinde aranir, ör: M3600,Twin Tipped)"
        required: false
        default: ""

permissions:
  contents: read

# Sandbox oturumunun agent-proxy'si bazi dis siteleri (org politikasi) engelleyebiliyor,
# ama SUNUCUNUN kendi internet erisimi zaten Brevo/Overpass/Hunter cagirilarinda calisiyor
# -- o yuzden her seyi PRODUCTION SUNUCUDAN yapiyoruz, sandboxtan degil.
#
# MOD A (collection_url doldurulursa): Shopify'in herkese acik products.json
# API'sini kullanir (curl {collection_url}/products.json?limit=250&page=N) --
# HTML regex'e guvenmez, gercek baslik/tip/etiket/TUM varyant gorselleri doner.
# Salt-okunur, HICBIR SEY YAZMAZ -- sadece rapor basar.
#
# MOD B (urls doldurulursa): tek urun sayfalari icin once ayni Shopify JSON
# API'sini ({url}.json) dener (guvenilir), olmazsa HTML'den JSON-LD/og:image'a
# duser. Indirilen gorsel gercekten >=200x200 degilse (ikon/placeholder tespiti)
# KAYDETMEZ. Sadece uploads/ altina yeni dosya YAZAR; JSON kayitlarina dokunmaz.
#
# MOD D (search_stores doldurulursa): hangi magazanin aranan modeli tasidigini
# BULUR. MOD A tek magaza deniyor ve cogu magaza bot korumasi yuzunden 401/403
# donuyor -- her deneme ayri bir calisma demek. MOD D bir listedeki her magazayi
# tek calismada tarar ve sadece eslesen urunleri, MOD C'ye dogrudan verilebilecek
# sayfa URL'siyle birlikte yazar. Salt-okunur.
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Çek
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          script: |
            echo "ADIM 1: baglanti tamam"
            export COLL_URL='${{ github.event.inputs.collection_url }}'
            export URLS='${{ github.event.inputs.urls }}'
            export PREFIX='${{ github.event.inputs.prefix }}'
            export DUMP_ID='${{ github.event.inputs.dump_id }}'
            export IMAGE_MAP='${{ github.event.inputs.image_map }}'
            export SEARCH_STORES='${{ github.event.inputs.search_stores }}'
            export SEARCH_TERM='${{ github.event.inputs.search_term }}'
            cat > /tmp/vestra_fetchimg.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            register_shutdown_function(function(){
              $e = error_get_last();
              if ($e && in_array($e['type'],[E_ERROR,E_PARSE,E_CORE_ERROR,E_COMPILE_ERROR],true))
                fwrite(STDERR, "PHP OLUMCUL: {$e['message']} ({$e['file']}:{$e['line']})\n");
            });
            $home = getenv("HOME"); $doc = $home."/public_html";
            require $doc."/inc/products.php";

            $ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36';

            function vestra_fetch(string $url, string $ua, bool $binary = false) {
              $ch = curl_init($url);
              curl_setopt_array($ch, [
                CURLOPT_RETURNTRANSFER => true, CURLOPT_FOLLOWLOCATION => true, CURLOPT_MAXREDIRS => 5,
                CURLOPT_TIMEOUT => 25, CURLOPT_USERAGENT => $ua,
                CURLOPT_HTTPHEADER => $binary ? [] : ['Accept: application/json,text/html'],
              ]);
              $body = curl_exec($ch);
              $code = curl_getinfo($ch, CURLINFO_HTTP_CODE);
              $ctype = curl_getinfo($ch, CURLINFO_CONTENT_TYPE);
              $err = curl_error($ch);
              curl_close($ch);
              return [$code, $body, $ctype, $err];
            }

            /* products.json'da 'tags' bazi magazalarda dizi, bazilarinda virgullu tek
               string olarak geliyor. Dizi hali dogrudan birlestirilince PHP her urun
               icin bir "Array to string conversion" uyarisi basiyordu -- 16 magazalik
               bir taramada bu, sonucu goremeyecek kadar cok satir demek. */
            function tags_str($t): string { return is_array($t) ? implode(', ', $t) : (string)$t; }

            /* MOD D: bir modeli TASIYAN magazayi bulmak icin. Tek tek koleksiyon URL'si
               denemek pahali -- cogu magaza bot korumasi yuzunden 401/403 donuyor ve her
               deneme ayri bir workflow calismasi demek. Burada bir listedeki her magazanin
               products.json'u taranir ve SADECE arananla eslesen satirlar basilir, boylece
               tek calismada onlarca magaza elenir. Salt-okunur: hicbir sey indirilmez,
               bulunan urun sayfasi URL'si dogrudan MOD C'ye verilebilecek bicimde yazilir. */
            $searchStores = trim((string)getenv("SEARCH_STORES"));
            $searchTerm   = trim((string)getenv("SEARCH_TERM"));
            if ($searchStores !== '') {
              echo "===== MOD D: COKLU MAGAZA ARAMASI =====\n";
              $terms = array_values(array_filter(array_map('trim', explode(',', $searchTerm))));
              if (!$terms) { fwrite(STDERR, "HATA: search_term bos\n"); exit(1); }
              echo "aranan: ".implode(' | ', $terms)."\n\n";
              $stores = array_values(array_filter(array_map('trim', preg_split('/[\s,]+/', $searchStores))));
              $hits = 0;
              foreach ($stores as $store) {
                if (!preg_match('#^https://#i', $store)) { echo "--- {$store}: ATLANDI (https degil)\n"; continue; }
                $base = rtrim(preg_replace('#/products\.json.*$#','',$store), '/');
                $host = preg_replace('#^(https://[^/]+).*$#i', '$1', $base);
                $found = 0; $scanned = 0;
                for ($page = 1; $page <= 3; $page++) {
                  [$code, $body, , $err] = vestra_fetch($base.'/products.json?limit=250&page='.$page, $ua);
                  if ($code < 200 || $code >= 300 || $body === false) { echo "--- {$base}: kod={$code} {$err}\n"; break; }
                  $items = json_decode((string)$body, true)['products'] ?? null;
                  if (!is_array($items) || !$items) { if ($page === 1) echo "--- {$base}: urun donmedi (Shopify degil ya da JSON kapali)\n"; break; }
                  $scanned += count($items);
                  foreach ($items as $p) {
                    $hay = strtolower(($p['title'] ?? '').' '.($p['handle'] ?? '').' '.($p['product_type'] ?? '').' '.tags_str($p['tags'] ?? ''));
                    foreach (($p['variants'] ?? []) as $v) $hay .= ' '.strtolower((string)($v['sku'] ?? ''));
                    $match = false;
                    foreach ($terms as $t) if (strpos($hay, strtolower($t)) !== false) { $match = true; break; }
                    if (!$match) continue;
                    $found++; $hits++;
                    $imgs = array_map(fn($i)=>$i['src']??'', $p['images'] ?? []);
                    $vcolors = [];
                    foreach (($p['variants'] ?? []) as $v) {
                      foreach (['option1','option2','option3'] as $k)
                        if (!empty($v[$k]) && preg_match('/^[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ \-\/]{1,24}$/', $v[$k])) $vcolors[$v[$k]] = true;
                    }
                    echo "  * ".($p['title'] ?? '?')."\n";
                    echo "    sayfa   : {$host}/products/".($p['handle'] ?? '')."\n";
                    echo "    gorsel  : ".count($imgs)." adet | ilk: ".(reset($imgs) ?: '-')."\n";
                    if ($vcolors) echo "    secenek : ".implode(', ', array_keys($vcolors))."\n";
                  }
                  if (count($items) < 250) break;
                }
                if ($found) echo "--- {$base}: {$found} eslesme ({$scanned} urun tarandi)\n\n";
                elseif ($scanned) echo "--- {$base}: eslesme yok ({$scanned} urun tarandi)\n";
              }
              echo "\nTOPLAM: {$hits} eslesme\n";
              exit($hits > 0 ? 0 : 1);
            }

            $collUrl = trim((string)getenv("COLL_URL"));
            if ($collUrl !== '') {
              echo "===== MOD A: KOLEKSIYON KESFI =====\n";
              $base = rtrim(preg_replace('#/products\.json.*$#','',$collUrl), '/');
              $all = []; $page = 1;
              do {
                $u = $base.'/products.json?limit=250&page='.$page;
                [$code, $body, , $err] = vestra_fetch($u, $ua);
                if ($code < 200 || $code >= 300 || $body === false) { echo "  HATA (sayfa {$page}): kod={$code} {$err}\n"; break; }
                $d = json_decode((string)$body, true);
                $items = $d['products'] ?? null;
                if (!is_array($items) || !$items) break;
                foreach ($items as $it) $all[] = $it;
                echo "  sayfa {$page}: ".count($items)." urun\n";
                $page++;
              } while (count($items) >= 250 && $page <= 5);

              if (!$all) { echo "  *** hic urun bulunamadi -- bu site Shopify JSON API'sini acik tutmuyor olabilir ***\n"; exit(0); }
              echo "\nTOPLAM: ".count($all)." urun (varyant renkleri dahil degil, her satir 1 Shopify urunu)\n\n";
              foreach ($all as $p) {
                $imgs = array_map(fn($i)=>$i['src']??'', $p['images'] ?? []);
                $vcolors = [];
                foreach (($p['variants'] ?? []) as $v) {
                  foreach (['option1','option2','option3'] as $k) if (!empty($v[$k]) && preg_match('/^[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ \-\/]{1,24}$/', $v[$k])) $vcolors[$v[$k]] = true;
                }
                echo "--- ".($p['handle']??'?')." ---\n";
                echo "  baslik    : ".($p['title']??'?')."\n";
                echo "  tip/etiket: ".($p['product_type']??'?')." | ".tags_str($p['tags']??'')."\n";
                echo "  gorsel say: ".count($imgs)." | ilk gorsel: ".(reset($imgs) ?: '-')."\n";
                if ($vcolors) echo "  varyant secenekleri: ".implode(', ', array_keys($vcolors))."\n";
              }
              exit(0);
            }

            $imageMap = trim((string)getenv("IMAGE_MAP"));
            if ($imageMap !== '') {
              echo "===== MOD C: URUN SAYFASI -> DOSYA INDIRME (Shopify JSON, sunucu tarafinda cozulur) =====\n";
              // Girdi 'hedef|urun_sayfasi_url' -- gercek CDN gorsel URL'si BURADA,
              // sunucuda cozulur ve indirilir; asla disaridan tasinmaz (uzun sayisal
              // shop-id path parcalari harici gosterimlerde yanlislikla
              // maskelenebiliyor -- sayfa handle'lari duz metin oldugu icin guvenli).
              $ok = 0; $fail = 0;
              foreach (preg_split('/\r?\n/', $imageMap) as $line) {
                $line = trim($line);
                if ($line === '') continue;
                $parts = explode('|', $line, 2);
                if (count($parts) !== 2) { echo "  ATLANDI (format 'yol|urun-sayfasi-url' degil): {$line}\n"; $fail++; continue; }
                [$rel, $pageUrl] = [trim($parts[0]), trim($parts[1])];
                if (!preg_match('#^[a-z0-9][a-z0-9/_.-]*$#i', $rel) || strpos($rel, '..') !== false) { echo "  RED: gecersiz hedef yol '{$rel}'\n"; $fail++; continue; }
                if (!preg_match('#^https://#i', $pageUrl)) { echo "  RED: gecersiz sayfa URL '{$pageUrl}'\n"; $fail++; continue; }

                $src = null;
                $prod = shopify_product_json($pageUrl, $ua);
                if ($prod) {
                  $src = $prod['images'][0]['src'] ?? ($prod['image']['src'] ?? null);
                } else {
                  [$pcode, $phtml] = vestra_fetch($pageUrl, $ua);
                  if ($pcode >= 200 && $pcode < 300 && $phtml !== false) $src = first_image_url_html($phtml);
                }
                if (!$src) { echo "  HATA: '{$rel}' icin gorsel bulunamadi ({$pageUrl})\n"; $fail++; continue; }
                if (strpos($src, '//') === 0) $src = 'https:'.$src;
                elseif (strpos($src, 'http') !== 0) { echo "  HATA: '{$rel}' gorsel URL'si bagil, atlandi\n"; $fail++; continue; }

                $absDir = $doc.'/uploads/'.dirname($rel);
                if (!is_dir($absDir) && !@mkdir($absDir, 0755, true)) { echo "  HATA: klasor olusturulamadi {$absDir}\n"; $fail++; continue; }
                [$icode, $bin, , $ierr] = vestra_fetch($src, $ua, true);
                if ($icode < 200 || $icode >= 300 || $bin === false || strlen($bin) < 800) { echo "  HATA: indirilemedi '{$rel}' (kod={$icode} {$ierr})\n"; $fail++; continue; }
                $abs = $doc.'/uploads/'.$rel;
                if (@file_put_contents($abs, $bin) === false) { echo "  HATA: yazilamadi {$abs}\n"; $fail++; continue; }
                $dim = @getimagesize($abs);
                if ($dim !== false) {
                  if ($dim[0] < 150 || $dim[1] < 150) {
                    @unlink($abs);
                    echo "  RED: gorsel cok kucuk '{$rel}' (".$dim[0]."x".$dim[1].") -- SILINDI\n"; $fail++; continue;
                  }
                  echo "  OK -> /uploads/{$rel} (".$dim[0]."x".$dim[1].")\n";
                } else {
                  // getimagesize() may not decode AVIF on this PHP/GD build even for a
                  // genuinely valid file -- sniff the container magic bytes instead of
                  // rejecting outright, and lean on file size (placeholders run <3KB).
                  $isAvif = strpos(substr($bin,4,12), 'ftyp') !== false;
                  $isWebp = substr($bin,0,4) === 'RIFF' && substr($bin,8,4) === 'WEBP';
                  if (($isAvif || $isWebp) && strlen($bin) >= 4000) {
                    echo "  OK (boyut dogrulamasi -- ".($isAvif?'avif':'webp').", getimagesize bu formati cozemedi) -> /uploads/{$rel} (".strlen($bin)." bayt)\n";
                  } else {
                    @unlink($abs);
                    echo "  RED: gecersiz gorsel '{$rel}' -- SILINDI\n"; $fail++; continue;
                  }
                }
                $ok++;
              }
              echo "\nTOPLAM: {$ok} basarili, {$fail} basarisiz\n";
              exit($fail > 0 ? 1 : 0);
            }

            $dumpId = trim((string)getenv("DUMP_ID"));
            if ($dumpId !== '') {
              echo "===== MEVCUT KAYIT: {$dumpId} =====\n";
              $found = null;
              foreach (vestra_products() as $p) { if (($p['id']??'')===$dumpId) { $found=$p; break; } }
              echo $found ? json_encode($found, JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n\n" : "  *** bulunamadi ***\n\n";
            }

            $prefix = trim((string)getenv("PREFIX"));
            $raw = (string)getenv("URLS");
            $urls = array_values(array_filter(array_map('trim', preg_split('/[\s,]+/', $raw))));
            if (!$urls) { fwrite(STDERR, "HATA: ne collection_url ne de urls verildi\n"); exit(1); }
            if ($prefix === '' || !preg_match('#^[a-z0-9][a-z0-9/_-]*$#', $prefix)) { fwrite(STDERR, "HATA: gecersiz prefix\n"); exit(1); }
            $destDir = $doc.'/uploads/'.dirname($prefix);
            if (!is_dir($destDir) && !@mkdir($destDir, 0755, true)) { fwrite(STDERR, "HATA: klasor olusturulamadi: {$destDir}\n"); exit(1); }

            // Shopify'in herkese acik {product-url}.json API'si -- HTML/JS render'a
            // bagli kalmadan gercek baslik + TUM varyant gorsellerini dondurur.
            function shopify_product_json(string $pageUrl, string $ua): ?array {
              $clean = preg_replace('#\?.*$#', '', $pageUrl);
              if (!preg_match('#/products/([a-z0-9-]+)$#i', $clean, $m)) return null;
              $base = preg_replace('#/products/[a-z0-9-]+$#i', '', $clean);
              [$code, $body] = vestra_fetch($base.'/products/'.$m[1].'.json', $ua);
              if ($code < 200 || $code >= 300 || $body === false) return null;
              $d = json_decode((string)$body, true);
              return $d['product'] ?? null;
            }

            function first_image_url_html(string $html): ?string {
              if (preg_match_all('#<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>#is', $html, $m)) {
                foreach ($m[1] as $block) {
                  $d = json_decode(trim($block), true);
                  if (!is_array($d)) continue;
                  $cands = isset($d['@type']) ? [$d] : $d;
                  foreach ((array)$cands as $node) {
                    if (!is_array($node)) continue;
                    $img = $node['image'] ?? null;
                    if (is_array($img) && $img) return (string)reset($img);
                    if (is_string($img) && $img !== '') return $img;
                  }
                }
              }
              if (preg_match('#<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)["\']#i', $html, $m)) return $m[1];
              if (preg_match('#<img[^>]+src=["\']([^"\']*/cdn/shop/[^"\']+)["\']#i', $html, $m)) return $m[1];
              return null;
            }

            echo "===== MOD B: GORSEL CEKME (".count($urls)." URL) =====\n";
            $n = 0;
            foreach ($urls as $url) {
              $n++;
              echo "--- ".$url." ---\n";
              if (!preg_match('#^https://#i', $url)) { echo "  ATLANDI: https degil\n"; continue; }

              $img = null; $title = '';
              $prod = shopify_product_json($url, $ua);
              if ($prod) {
                $title = (string)($prod['title'] ?? '');
                $img = $prod['images'][0]['src'] ?? ($prod['image']['src'] ?? null);
                echo "  kaynak: Shopify JSON API | baslik: {$title}\n";
              } else {
                [$code, $html, , $err] = vestra_fetch($url, $ua);
                if ($code < 200 || $code >= 300 || $html === false) { echo "  HATA: sayfa cekilemedi (kod={$code} {$err})\n"; continue; }
                if (preg_match('#<title[^>]*>(.*?)</title>#is', $html, $tm)) $title = trim(html_entity_decode(strip_tags($tm[1]), ENT_QUOTES));
                echo "  kaynak: HTML fallback | baslik: {$title}\n";
                $img = first_image_url_html($html);
              }
              if (!$img) { echo "  HATA: gorsel bulunamadi\n"; continue; }
              if (strpos($img, '//') === 0) $img = 'https:'.$img;
              elseif (strpos($img, 'http') !== 0) { echo "  HATA: gorsel URL bagil, atlandi ({$img})\n"; continue; }

              [$icode, $bin, $ictype, $ierr] = vestra_fetch($img, $ua, true);
              if ($icode < 200 || $icode >= 300 || $bin === false || strlen($bin) < 800) {
                echo "  HATA: gorsel indirilemedi (kod={$icode} {$ierr})\n"; continue;
              }
              $ext = 'jpg';
              if (preg_match('#\.(jpe?g|png|webp)(\?|$)#i', $img, $em)) $ext = strtolower($em[1]);
              elseif (stripos((string)$ictype, 'png') !== false) $ext = 'png';
              elseif (stripos((string)$ictype, 'webp') !== false) $ext = 'webp';
              if ($ext === 'jpeg') $ext = 'jpg';

              if (preg_match('#-(\d+)(?:\?|$)#', preg_replace('#\?.*$#','',$url), $sm)) $slug = $sm[1]; else $slug = (string)$n;
              $fname = basename($prefix).'-'.$slug.'.'.$ext;
              $rel = '/uploads/'.dirname($prefix).'/'.$fname;
              $abs = $doc.$rel;
              if (@file_put_contents($abs, $bin) === false) { echo "  HATA: yazilamadi {$abs}\n"; continue; }
              $dim = @getimagesize($abs);
              if ($dim === false) {
                @unlink($abs);
                echo "  RED: gecerli bir gorsel degil -- SILINDI, kaydedilmedi\n";
                continue;
              }
              if ($dim[0] < 200 || $dim[1] < 200) {
                @unlink($abs);
                echo "  RED: gorsel cok kucuk (".$dim[0]."x".$dim[1].") -- ikon/placeholder, SILINDI\n";
                continue;
              }
              echo "  OK -> {$rel} (".$dim[0]."x".$dim[1].", ".strlen($bin)." bayt)\n";
            }
            PHPEOF
            php -l /tmp/vestra_fetchimg.php
            php /tmp/vestra_fetchimg.php
            rm -f /tmp/vestra_fetchimg.php
