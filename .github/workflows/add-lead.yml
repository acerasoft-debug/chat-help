name: (Lead) Listeye email/prospect ekle
on:
  workflow_dispatch:
    inputs:
      emails:
        description: "E-posta(lar) — virgül/boşluk/satır ile ayrılabilir (birden çok olabilir). 'file' verilirse yoksayılır."
        required: false
        default: ""
      file:
        description: "Toplu ekleme için repo içindeki JSON dosya yolu (ör. lead-batches/fr-boutiques.json). Her satır {email, company, country, notes?}. Verilirse 'emails' yoksayılır, site TARANMAZ (firma/ülke doğrudan dosyadan alınır) — büyük listelerde zaman aşımını önler."
        required: false
        default: ""
      company:
        description: "Firma adı (opsiyonel; SADECE tek e-posta eklerken uygulanır)"
        required: false
        default: ""
      country:
        description: "Ülke (opsiyonel; SADECE tek e-posta eklerken uygulanır)"
        required: false
        default: ""
      category:
        description: "Kategori / segment etiketi — TÜM eklenen e-postalara uygulanır (ör. 'Amazon Seller'). Admin > Prospects tablosunda Category sütununda görünür."
        required: false
        default: ""
      source:
        description: "Kaynak etiketi — TÜM eklenen e-postalara uygulanır (boşsa 'manual'). Admin'de Source sütununda görünür."
        required: false
        default: ""

permissions:
  contents: read

# Elle tetiklenir. Verilen e-posta(ları) data/leads.json'a prospect olarak ekler.
# Tek çalışmada birden çok e-posta işlenir (yarış/kayıp yazma olmaz, sonda tek kayıt).
# Tekrar önleme: zaten olan e-posta atlanır.
#
# İKİ MOD:
#  - emails (metin): iş adı site <title>'ından, ülke TLD'den türetilir, site premium marka
#    satıyorsa işaretlenir. Ücretsiz sağlayıcılar (gmx, gmail, hotmail…) için site taranmaz,
#    ad yerel-kısımdan alınır. company/country girilirse ve TEK e-posta ekleniyorsa, türetmeyi
#    ezerler. Az sayıda e-posta için uygundur — her satır bir HTTP taraması demektir.
#  - file (JSON dizi, repodan okunur): her satırda email + zaten bilinen company/country
#    olduğu için HİÇBİR site taranmaz — 100+ satırlık listeler saniyeler içinde işlenir ve
#    6 dakikalık SSH sınırına takılmaz. category/source yine tüm dosyaya uygulanır.
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dosyayı oku ve kodla (file verildiyse)
        env:
          RAW_FILE: ${{ github.event.inputs.file }}
        run: |
          set -e
          if [ -z "$RAW_FILE" ]; then
            echo "P_JSON=" >> "$GITHUB_ENV"
            exit 0
          fi
          case "$RAW_FILE" in
            */../*|/*|*..*) echo "HATA: gecersiz yol"; exit 1 ;;
          esac
          [ -f "$RAW_FILE" ] || { echo "HATA: dosya yok: $RAW_FILE"; exit 1; }
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert isinstance(d,list) and d, 'JSON dizi degil/bos'; print(f'satir sayisi: {len(d)}')" "$RAW_FILE"
          echo "P_JSON=$(base64 -w0 < "$RAW_FILE")" >> "$GITHUB_ENV"

      - name: Prospect(ler)i ekle
        uses: appleboy/ssh-action@v1.0.3
        env:
          LEAD_EMAILS: ${{ github.event.inputs.emails }}
          LEAD_FILE_B64: ${{ env.P_JSON }}
          LEAD_COMPANY: ${{ github.event.inputs.company }}
          LEAD_COUNTRY: ${{ github.event.inputs.country }}
          LEAD_CATEGORY: ${{ github.event.inputs.category }}
          LEAD_SOURCE: ${{ github.event.inputs.source }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 6m
          envs: LEAD_EMAILS,LEAD_FILE_B64,LEAD_COMPANY,LEAD_COUNTRY,LEAD_CATEGORY,LEAD_SOURCE
          script: |
            cat > /tmp/vestra_add_lead.php <<'PHPEOF'
            <?php
            $home = getenv("HOME");
            require $home."/public_html/inc/notify.php";
            require $home."/public_html/inc/products.php";
            require $home."/public_html/inc/leads.php";

            $ovCategory = trim((string)getenv("LEAD_CATEGORY"));
            $ovSource   = trim((string)getenv("LEAD_SOURCE"));

            $fileB64 = trim((string)getenv("LEAD_FILE_B64"));
            $rows = [];   // normalized: ['email'=>.., 'company'=>.., 'country'=>.., 'fromFile'=>bool]
            if ($fileB64 !== '') {
              $dec = base64_decode($fileB64, true);
              if ($dec === false) { fwrite(STDERR, "HATA: base64 cozulemedi\n"); exit(1); }
              $data = json_decode($dec, true);
              if (!is_array($data) || !$data) { fwrite(STDERR, "HATA: JSON dizi degil/bos\n"); exit(1); }
              foreach ($data as $i => $r) {
                if (!is_array($r) || empty($r['email'])) { echo "  ! satir ".($i+1).": email yok, atlandi\n"; continue; }
                $rows[] = ['email'=>(string)$r['email'], 'company'=>trim((string)($r['company']??'')), 'country'=>trim((string)($r['country']??'')), 'notes'=>trim((string)($r['notes']??'')), 'fromFile'=>true];
              }
              if (!$rows) { fwrite(STDERR, "HATA: dosyada gecerli satir yok\n"); exit(1); }
            } else {
              $raw = (string)getenv("LEAD_EMAILS");
              $emails = preg_split('/[\s,;]+/', trim($raw), -1, PREG_SPLIT_NO_EMPTY);
              if (!$emails) { fwrite(STDERR, "HATA: e-posta verilmedi (ne 'emails' ne 'file')\n"); exit(1); }
              $single = (count($emails) === 1);
              $ovCompany = $single ? trim((string)getenv("LEAD_COMPANY")) : '';
              $ovCountry = $single ? trim((string)getenv("LEAD_COUNTRY")) : '';
              foreach ($emails as $email) {
                $rows[] = ['email'=>$email, 'company'=>$ovCompany, 'country'=>$ovCountry, 'notes'=>'', 'fromFile'=>false];
              }
            }

            $leads = vestra_leads();
            $seen = [];
            foreach ($leads as $l) { $e = strtolower($l['email'] ?? ''); if ($e !== '') $seen[$e] = true; }

            $free = ['gmail.com','googlemail.com','gmx.net','gmx.de','gmx.com','gmx.at','web.de','hotmail.com','hotmail.de','hotmail.fr','hotmail.it','outlook.com','outlook.de','live.com','live.de','yahoo.com','yahoo.de','yahoo.fr','yahoo.it','yahoo.es','icloud.com','me.com','aol.com','t-online.de','freenet.de','mail.com','protonmail.com','proton.me','orange.fr','wanadoo.fr','libero.it','virgilio.it','alice.it','terra.es'];
            $cmap = ['gr'=>'Greece','de'=>'Germany','fr'=>'France','it'=>'Italy','es'=>'Spain','nl'=>'Netherlands','pl'=>'Poland','be'=>'Belgium','at'=>'Austria','pt'=>'Portugal','uk'=>'United Kingdom','ie'=>'Ireland','se'=>'Sweden','dk'=>'Denmark','fi'=>'Finland','cz'=>'Czechia','ro'=>'Romania','ch'=>'Switzerland'];

            $added = 0; $dup = 0; $invalid = 0;
            foreach ($rows as $row) {
              $email = strtolower(trim($row['email']));
              if (!filter_var($email, FILTER_VALIDATE_EMAIL)) { echo "  ! gecersiz: {$email}\n"; $invalid++; continue; }
              if (isset($seen[$email])) { echo "  = zaten var: {$email}\n"; $dup++; continue; }
              $seen[$email] = true;
              $domain = substr(strrchr($email, '@'), 1);
              $website=''; $country=$row['country']; $company=$row['company']; $pb=[];

              if ($row['fromFile']) {
                // Firma/ulke dosyadan geldi -- site TARANMAZ (100+ satirda her domaini
                // taramak 6 dakikalik SSH sinirina carpar). premium_brands de bu yuzden
                // bos kalir; istenirse ayrica taranabilir.
                if (!in_array($domain, $free, true)) $website = 'https://'.$domain;
                if ($company === '') $company = $domain;
                if ($country === '') { $tld = strtolower(substr(strrchr($domain, '.'), 1)); $country = $cmap[$tld] ?? ''; }
              } else {
                if (in_array($domain, $free, true)) {
                  $lp = substr($email, 0, strpos($email, '@'));
                  $company = ucfirst(preg_replace('/[._-]+/', ' ', $lp));
                } else {
                  $website = 'https://'.$domain;
                  $tld = strtolower(substr(strrchr($domain, '.'), 1));
                  $country = $cmap[$tld] ?? '';
                  $html = function_exists('vestra_http_get') ? vestra_http_get($website, 8) : '';
                  if ($html !== '' && preg_match('/<title[^>]*>(.*?)<\/title>/is', $html, $m)) {
                    // Basligin ILK parcasi cogu zaman sayfanin adidir, magazanin degil
                    // ("Αρχική | Factory Outlet"). Ayirma ve genel-ad elemesi tek yerde:
                    // vestra_company_from_title() (inc/notify.php), testi email_junk_test.
                    $company = html_entity_decode(strip_tags($m[1]), ENT_QUOTES, 'UTF-8');
                    $company = function_exists('vestra_company_from_title')
                             ? vestra_company_from_title($company, '')
                             : trim(preg_replace('/\s+/', ' ', $company));
                  }
                  if ($company === '') $company = $domain;
                  $pb = function_exists('vestra_premium_brands') ? vestra_premium_brands($website) : [];
                }
                // Tek e-posta + company/country override verildiyse, taramayi ezer.
                if ($row['company'] !== '') $company = $row['company'];
                if ($row['country'] !== '') $country = $row['country'];
              }

              $leads[] = [
                'id'=>'LD'.strtoupper(bin2hex(random_bytes(4))),'added_at'=>date('c'),'owner_uid'=>'',
                'company'=>$company,'contact_name'=>'',
                'email'=>$email,'country'=>$country,
                'website'=>$website,'source'=>($ovSource!==''?$ovSource:'manual'),'category'=>$ovCategory,
                'notes'=>$row['notes']??'','status'=>'new','last_contacted_at'=>'','unsub_token'=>bin2hex(random_bytes(16)),
                'premium'=>!empty($pb),'premium_brands'=>$pb,
              ];
              $added++;
              echo "  + EKLENDI: {$company} <{$email}> | ulke=".($country?:'-')." | segment=".($ovCategory?:'-')." | premium=".(!empty($pb)?('EVET ('.implode(', ', $pb).')'):'hayir')."\n";
            }
            if ($added > 0) vestra_save_leads($leads);
            echo "\n{$added} eklendi, {$dup} zaten vardi, {$invalid} gecersizdi. toplam lead: ".count($leads)."\n";
            PHPEOF
            php -l /tmp/vestra_add_lead.php
            php /tmp/vestra_add_lead.php; RC=$?
            rm -f /tmp/vestra_add_lead.php
            exit $RC
