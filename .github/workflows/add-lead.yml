name: (Lead) Listeye email/prospect ekle
on:
  workflow_dispatch:
    inputs:
      emails:
        description: "E-posta(lar) — virgül/boşluk/satır ile ayrılabilir (birden çok olabilir)"
        required: true
      company:
        description: "Firma adı (opsiyonel; SADECE tek e-posta eklerken uygulanır)"
        required: false
        default: ""
      country:
        description: "Ülke (opsiyonel; SADECE tek e-posta eklerken uygulanır)"
        required: false
        default: ""

permissions:
  contents: read

# Elle tetiklenir. Verilen e-posta(ları) data/leads.json'a prospect olarak ekler.
# Tek çalışmada birden çok e-posta işlenir (yarış/kayıp yazma olmaz, sonda tek kayıt).
# Tekrar önleme: zaten olan e-posta atlanır. İş alan adı için: firma adı site
# <title>'ından, ülke TLD'den türetilir, site premium marka satıyorsa işaretlenir.
# Ücretsiz sağlayıcılar (gmx, gmail, hotmail…) için site taranmaz, ad yerel-kısımdan alınır.
# company/country girilirse ve TEK e-posta ekleniyorsa, türetmeyi ezerler (bilinen firma için).
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Prospect(ler)i ekle
        uses: appleboy/ssh-action@v1.0.3
        env:
          LEAD_EMAILS: ${{ github.event.inputs.emails }}
          LEAD_COMPANY: ${{ github.event.inputs.company }}
          LEAD_COUNTRY: ${{ github.event.inputs.country }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 6m
          envs: LEAD_EMAILS,LEAD_COMPANY,LEAD_COUNTRY
          script: |
            cat > /tmp/vestra_add_lead.php <<'PHPEOF'
            <?php
            $home = getenv("HOME");
            require $home."/public_html/inc/notify.php";
            require $home."/public_html/inc/products.php";
            require $home."/public_html/inc/leads.php";

            $raw = (string)getenv("LEAD_EMAILS");
            $emails = preg_split('/[\s,;]+/', trim($raw), -1, PREG_SPLIT_NO_EMPTY);
            if (!$emails) { echo "HATA: e-posta verilmedi\n"; exit(1); }
            $single = (count($emails) === 1);
            $ovCompany = $single ? trim((string)getenv("LEAD_COMPANY")) : '';
            $ovCountry = $single ? trim((string)getenv("LEAD_COUNTRY")) : '';

            $leads = vestra_leads();
            $seen = [];
            foreach ($leads as $l) { $e = strtolower($l['email'] ?? ''); if ($e !== '') $seen[$e] = true; }

            $free = ['gmail.com','googlemail.com','gmx.net','gmx.de','gmx.com','gmx.at','web.de','hotmail.com','hotmail.de','hotmail.fr','hotmail.it','outlook.com','outlook.de','live.com','live.de','yahoo.com','yahoo.de','yahoo.fr','yahoo.it','yahoo.es','icloud.com','me.com','aol.com','t-online.de','freenet.de','mail.com','protonmail.com','proton.me','orange.fr','wanadoo.fr','libero.it','virgilio.it','alice.it','terra.es'];
            $cmap = ['gr'=>'Greece','de'=>'Germany','fr'=>'France','it'=>'Italy','es'=>'Spain','nl'=>'Netherlands','pl'=>'Poland','be'=>'Belgium','at'=>'Austria','pt'=>'Portugal','uk'=>'United Kingdom','ie'=>'Ireland','se'=>'Sweden','dk'=>'Denmark','fi'=>'Finland','cz'=>'Czechia','ro'=>'Romania','ch'=>'Switzerland'];

            $added = 0;
            foreach ($emails as $email) {
              $email = strtolower(trim($email));
              if (!filter_var($email, FILTER_VALIDATE_EMAIL)) { echo "  ! gecersiz: {$email}\n"; continue; }
              if (isset($seen[$email])) { echo "  = zaten var: {$email}\n"; continue; }
              $seen[$email] = true;
              $domain = substr(strrchr($email, '@'), 1);
              $website=''; $country=''; $company=''; $pb=[];
              if (in_array($domain, $free, true)) {
                $lp = substr($email, 0, strpos($email, '@'));
                $company = ucfirst(preg_replace('/[._-]+/', ' ', $lp));
              } else {
                $website = 'https://'.$domain;
                $tld = strtolower(substr(strrchr($domain, '.'), 1));
                $country = $cmap[$tld] ?? '';
                $html = function_exists('vestra_http_get') ? vestra_http_get($website, 8) : '';
                if ($html !== '' && preg_match('/<title[^>]*>(.*?)<\/title>/is', $html, $m)) {
                  $company = trim(preg_replace('/\s+/', ' ', html_entity_decode(strip_tags($m[1]), ENT_QUOTES, 'UTF-8')));
                  foreach ([' | ',' – ',' — ',' - ',' : ',' · '] as $sep) { $pos = mb_strpos($company, $sep); if ($pos !== false && $pos > 2) $company = mb_substr($company, 0, $pos); }
                  if (mb_strlen($company) > 60) $company = mb_substr($company, 0, 60);
                }
                if ($company === '') $company = $domain;
                $pb = function_exists('vestra_premium_brands') ? vestra_premium_brands($website) : [];
              }
              if ($ovCompany !== '') $company = $ovCompany;
              if ($ovCountry !== '') $country = $ovCountry;
              $leads[] = [
                'id'=>'LD'.strtoupper(bin2hex(random_bytes(4))),'added_at'=>date('c'),'owner_uid'=>'',
                'company'=>$company,'contact_name'=>'',
                'email'=>$email,'country'=>$country,
                'website'=>$website,'source'=>'manual','category'=>'',
                'notes'=>'','status'=>'new','last_contacted_at'=>'','unsub_token'=>bin2hex(random_bytes(16)),
                'premium'=>!empty($pb),'premium_brands'=>$pb,
              ];
              $added++;
              echo "  + EKLENDI: {$company} <{$email}> | ulke=".($country?:'-')." | premium=".(!empty($pb)?('EVET ('.implode(', ', $pb).')'):'hayir')."\n";
            }
            if ($added > 0) vestra_save_leads($leads);
            echo "\n{$added} eklendi. toplam lead: ".count($leads)."\n";
            PHPEOF
            php /tmp/vestra_add_lead.php
            rm -f /tmp/vestra_add_lead.php
