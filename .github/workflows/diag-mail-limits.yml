name: (Salt-okunur) Sunucunun e-posta gönderim sınırları
# 10 Eki 2026 (operatör: "kendi sunucumuzda kontrol et, tek seferde en fazla kaç e-mail gönderilir?").
# SALT-OKUNUR: hiçbir şey göndermez, hiçbir dosyaya yazmaz. cPanel'in hesap sınırlarını (saatlik e-posta,
# geri dönme oranı), bizim gönderim kodumuzun sınırlarını ve son 1 saat / bugün giden sayıyı basar.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Oku
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -u
            echo "== cPanel hesap sınırları (uapi Variables get_user_information) =="
            if command -v uapi >/dev/null 2>&1; then
              uapi --output=json Variables get_user_information 2>/dev/null | php -r '
                $d = json_decode(stream_get_contents(STDIN), true); $x = $d["result"]["data"] ?? [];
                foreach ($x as $k => $v) if (preg_match("/mail|email|defer|smtp|hour/i", $k)) echo "  $k = ".(is_scalar($v) ? var_export($v, true) : json_encode($v))."\n";
                if (!$x) echo "  (veri yok)\n";'
              echo "== cPanel istatistik çubuğu (e-posta) =="
              uapi --output=json StatsBar get_stats display='emailaccounts|mailinglists|emailforwarders' 2>/dev/null | php -r '
                $d = json_decode(stream_get_contents(STDIN), true);
                foreach (($d["result"]["data"] ?? []) as $r) echo "  ".($r["name"] ?? "?")." = ".($r["count"] ?? "?")." / ".($r["max"] ?? "?")."\n";'
            else
              echo "  uapi yok"
            fi
            echo
            echo "== PHP CLI ve posta servisi =="
            php -r 'echo "  mail(): ".(function_exists("mail")?"var":"YOK")."\n  sendmail_path: ".ini_get("sendmail_path")."\n  max_execution_time (CLI): ".ini_get("max_execution_time")."\n";'
            echo
            echo "== Bizim gönderim kodumuzun sınırları ve bugünkü durum =="
            cd ~/public_html && cat > ./vestra_limits_tmp.php <<'PHPEOF'
            <?php
            ini_set('display_errors', '1'); error_reporting(E_ALL);
            require_once __DIR__.'/inc/products.php'; require_once __DIR__.'/inc/leads.php'; require_once __DIR__.'/inc/mailbox.php';
            $leads = vestra_leads(); $hour = 0; $today = 0; $t = time();
            foreach ($leads as $l) { if (($l['contact_via'] ?? '') !== 'mailbox') continue; $c = strtotime((string)($l['last_contacted_at'] ?? '')) ?: 0;
              if ($c > $t - 3600) $hour++; if (date('Y-m-d', $c) === date('Y-m-d')) $today++; }
            echo "  günlük tavan (panel): ".vestra_mailbox_daily_cap()." · üst sınır: ".VESTRA_MAILBOX_MAX_CAP."\n";
            echo "  bugün gönderilen: {$today} · son 1 saatte: {$hour}\n";
            echo "  tek istekte en çok (vestra_mailbox_batch): 200 · mektuplar arası 25-55 sn (≈ saatte 65-145)\n";
            $open = array_values(array_filter(vestra_mailbox_runs(), 'vestra_mailbox_is_open'));
            echo "  şu an açık istek: ".count($open).($open ? ' ('.$open[0]['id'].' · '.$open[0]['mode'].' · '.$open[0]['limit'].' · '.$open[0]['status'].')' : '')."\n";
            PHPEOF
            php ./vestra_limits_tmp.php; rm -f ./vestra_limits_tmp.php
