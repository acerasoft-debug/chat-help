name: (Posta kutusu) ACİL — sunucu gönderimini durdur / aç
# 14 Eki 2026 (operatör: "RTL Zuschauerservice'e e-mail atmışsın, acil düzelt … Alman e-mailleri de şu an için yok").
# paused=true: otomatik gönderim KAPALI, gece takip turu KAPALI, sırada bekleyen (henüz başlamamış) istekler iptal.
# Süren bir gönderim kendi partisini bitirir (her mektup ayrı damgalanır). paused=false: otomatik + gece turu açık.
on:
  workflow_dispatch:
    inputs:
      paused:
        description: "true = durdur · false = aç"
        required: false
        default: "true"
permissions:
  contents: read
jobs:
  pause:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          PAUSED: ${{ github.event.inputs.paused }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: PAUSED
          command_timeout: 2m
          script: |
            cd ~/public_html
            cat > /tmp/vestra_pause.php <<'PHPEOF'
            <?php
            $home = getenv("HOME");
            require      $home."/public_html/inc/products.php";
            require_once $home."/public_html/inc/mailbox.php";
            $p = strtolower(trim((string)getenv('PAUSED'))) !== 'false';
            $cfg = vestra_mailbox_cfg(); $cfg['auto_send'] = !$p; $cfg['followup'] = !$p; $cfg['paused_at'] = $p ? date('c') : '';
            $f = vestra_mailbox_file('mailbox.json'); file_put_contents($f, json_encode($cfg, JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE), LOCK_EX); @chmod($f, 0600);
            $runs = vestra_mailbox_runs(); $c = 0;
            if ($p) foreach ($runs as $i => $r) if (($r['status'] ?? '') === 'requested') { $runs[$i]['status'] = 'cancelled'; $runs[$i]['note'] = 'operator durdurdu'; $c++; }
            vestra_mailbox_runs_save($runs);
            $a = vestra_mailbox_auto(); $cf = vestra_mailbox_cfg();
            echo ($p ? "DURDURULDU" : "ACILDI")." · otomatik ".($a['auto_send'] ? 'acik' : 'kapali')." · gece takip ".(!array_key_exists('followup', $cf) || $cf['followup'] ? 'acik' : 'kapali')." · iptal edilen bekleyen istek: $c\n";
            foreach (array_slice(vestra_mailbox_runs(), -3) as $r) echo "  ".($r['id'] ?? '')." ".($r['mode'] ?? '')." ".($r['status'] ?? '')." gond ".($r['sent'] ?? '-')."\n";
            echo "bugun gonderilen: ".vestra_mailbox_sent_today()."\n";
            PHPEOF
            php /tmp/vestra_pause.php 2>&1; rm -f /tmp/vestra_pause.php
