name: (Zamanlı) Brevo ikinci mektup — günde 150 (2 × 50 + 23:45 tamamlama)
# 13 Eki 2026 (operatör: "her gün … 100 adet de Brevo'dan gidebilir"). Günde iki parti: 07:12 ve 13:12 UTC
# (09:12 / 15:12 Avrupa). Her parti send-outreach.yml'i DAĞITIM dalından (claude/wizardly-planck-7ylnmk —
# tam sürüm orada) Winter 26/27 ikinci mektubu için başlatır: ilk mektubu en az 2 gün önce almış, abonelikten
# çıkmamış, en az 1 premium markalı Avrupa leadleri; ABD/Kanada dışarıda; zincir/marka/çocuk/ayakkabı adları
# skip_names ile elenir (13 Eki elle okunan liste). 14 Eki (operatör: "aksesuar, lüks marka satmayanlara da gönder,
# ayakkabı, iç çamaşırı vs. — distribütör, büyük zincir, kendi markasını satan olmasın"): min_brands=1 ve ayakkabı/deri
# adları listeden çıktı; G. Kore dışarıda (oradaki yasa reklam e-postasının konusunun "(광고)" ile başlamasını ister —
# sunucu yolu bunu ekliyor, Brevo şablonu eklemiyor). Brevo günlük hakkından 60 e-posta işlemsel postaya ayrılır;
# hak yetmezse parti kendiliğinden küçülür. Uygun lead kalmayınca 0 gönderir.
#
# 14 Eki 2026 (operatör: "Brevo'da her zaman 100 e-posta hakkı kalsın, 23.45'te kontrol edilsin ve hak kaldıysa devam
# gönderilsin"): her parti Brevo'nun günlük hakkından EN AZ 100'ü bırakır (quota_reserve=100); gece taraması 23:45 Avrupa.
# Asıl tetikleyici SUNUCU (vestra/inc/ops_tick.php, 09:12 / 15:12 / 23:45 Avrupa) — GitHub'ın kendi zamanlaması koşuları
# atlıyordu; aşağıdaki cron'lar yalnız yedek. "Çift koşu" adımı: son 100 dk içinde başka bir brevo-daily koşusu varsa atlar.
#
# 17 Eki 2026 (operatör: "Brevo'dan günde 150 e-mail gitmeli, hak kalırsa 23.45'te tamamlanmalı … hataları en aza
# indir"): GÜNLÜK SINIR 150 — her parti member_spec "daily=150" taşır; send-outreach bugün (sunucu günü) Brevo'dan
# gideni sayar ve partiyi kalanla kırpar. 09:12 ve 15:12'de 50'şer, 23:45 gece taraması günün kalanını (150'ye kadar)
# tamamlar; sınır dolunca parti "gonderildi: 0" yazar ve tarama durur. Kota partiden azsa parti artık küçülür (eskiden
# bütünüyle reddediliyordu). Seçim artık geri dönmüş adresleri, tahmin listelerini, hedef dışı ve durdurulan ülke
# kayıtlarını da eler; damgalar her gönderimden hemen sonra taze listeye yazılır (sunucunun eşzamanlı "geri döndü"
# işaretleri ve damgaları artık ezilmez).
#
# GECE TARAMASI (13 Eki, operatör: "her gün gece 11.45'te ne kadar açık varsa … Brevo'nun 300'ünden arta kalan …
# en az e-posta alan butiklere"): 20:45 UTC (22:45 Avrupa yaz / 21:45 kış) — Brevo'nun o günkü kotasından kalanla
# (rezerv 100) 50'lik partiler arka arkaya, bir parti 0 gönderene ya da kota bitene kadar
# (en çok 5 parti). Sunucunun kendi gece takip turu (inc/mailbox.php, 23:45 Avrupa) bundan SONRA koşar; Brevo'nun
# bu gece yazdığı dükkân orada 5 gün dinlenir, böylece aynı dükkâna aynı gece iki mektup gitmez.
on:
  schedule:
    - cron: '12 7 * * *'
    - cron: '12 13 * * *'
    - cron: '45 21 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: "Bu partide en çok kaç e-posta (50'ye kadar)"
        required: false
        default: "50"
      dry_run:
        description: "true = gönderme, yalnız listele"
        required: false
        default: "false"
      sweep:
        description: "true = gece taraması (kotadan kalanla 50'lik partiler, 0 gönderene kadar)"
        required: false
        default: "false"

permissions:
  actions: write
  contents: read

concurrency:
  group: brevo-daily
  cancel-in-progress: false

jobs:
  fire:
    if: github.event.schedule != '45 21 * * *' && github.event.inputs.sweep != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Çift koşu koruması (son 100 dk içinde başka koşu varsa atla)
        id: guard
        run: |
          since=$(date -u -d '-100 min' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list --repo "${{ github.repository }}" --workflow brevo-daily.yml --limit 10 --json databaseId,createdAt \
                --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.createdAt > \"$since\")] | length")
          echo "son 100 dk: $n başka koşu"
          if [ "${n:-0}" -gt 0 ] && [ "${{ github.event.inputs.dry_run || 'false' }}" != "true" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "atlandı: aynı slot zaten çalıştı"; fi
      - name: Partiyi başlat
        if: steps.guard.outputs.skip != 'true'
        run: |
          gh workflow run send-outreach.yml --repo "${{ github.repository }}" --ref claude/wizardly-planck-7ylnmk \
            -f count="${{ github.event.inputs.count || '50' }}" \
            -f dry_run="${{ github.event.inputs.dry_run || 'false' }}" \
            -f new_collection=true -f newcoll_letter=winter -f min_brands=1 -f newcoll_min_days=2 \
            -f exclude_countries="United States,Canada,South Korea,Germany,Deutschland" -f quota_reserve=100 -f member_spec="daily=150" \
            -f skip_names="Fielmann,BSTN,CNCPTS,Altermundi,Capel,Kaotiko,Oktshirt,Team Store,targetcenter,Racing Club,Strasbourg,Loretxiki,Fantasía Kids,Lola Jiménez,Mandarina,Black in Black,Piluka,Glamcult,Mackintosh,Joseph,Lyle & Scott,Kicks,Hatstore,Kids Brand Store,Limoneti,Lapin House,Klamöttchen,Petit Ilu,W&G,Shi Cashmere,Kindermode,kids,Scalpers,Pedro del Hierro,Claudia Sträter,Soccerfanshop,Lesage Bridal,Ashley Stewart,Bealls,Tuckernuck,260 Sample Sale,StofShop,Atlas Stoked,Milk,Golf Club"
          echo "Brevo partisi dağıtım dalında başlatıldı (send-outreach.yml, count=${{ github.event.inputs.count || '50' }})."

  sweep:
    if: github.event.schedule == '45 21 * * *' || github.event.inputs.sweep == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DRY: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - name: Çift koşu koruması (son 100 dk içinde başka koşu varsa atla)
        id: guard
        run: |
          since=$(date -u -d '-100 min' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list --repo "${{ github.repository }}" --workflow brevo-daily.yml --limit 10 --json databaseId,createdAt \
                --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.createdAt > \"$since\")] | length")
          echo "son 100 dk: $n başka koşu"
          if [ "${n:-0}" -gt 0 ] && [ "${{ github.event.inputs.dry_run || 'false' }}" != "true" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "atlandı: aynı slot zaten çalıştı"; fi
      - name: Günün kalanı (150'ye kadar) 50'lik partilerle (0 gönderene kadar, en çok 5)
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -u
          SKIP="Fielmann,BSTN,CNCPTS,Altermundi,Capel,Kaotiko,Oktshirt,Team Store,targetcenter,Racing Club,Strasbourg,Loretxiki,Fantasía Kids,Lola Jiménez,Mandarina,Black in Black,Piluka,Glamcult,Mackintosh,Joseph,Lyle & Scott,Kicks,Hatstore,Kids Brand Store,Limoneti,Lapin House,Klamöttchen,Petit Ilu,W&G,Shi Cashmere,Kindermode,kids,Scalpers,Pedro del Hierro,Claudia Sträter,Soccerfanshop,Lesage Bridal,Ashley Stewart,Bealls,Tuckernuck,260 Sample Sale,StofShop,Atlas Stoked,Milk,Golf Club"
          total=0
          for n in 1 2 3 4 5; do
            since=$(date -u +%Y-%m-%dT%H:%M:%SZ); sleep 2
            gh workflow run send-outreach.yml --repo "$REPO" --ref claude/wizardly-planck-7ylnmk \
              -f count=50 -f dry_run="$DRY" \
              -f new_collection=true -f newcoll_letter=winter -f min_brands=1 -f newcoll_min_days=2 \
              -f exclude_countries="United States,Canada,South Korea,Germany,Deutschland" -f quota_reserve=100 -f member_spec="daily=150" -f skip_names="$SKIP" || { echo "parti $n başlatılamadı"; break; }
            # başlattığımız koşuyu bul (bizden sonra yaratılan, bu dalda, workflow_dispatch)
            rid=""
            for i in $(seq 1 30); do
              sleep 10
              rid=$(gh run list --repo "$REPO" --workflow send-outreach.yml --branch claude/wizardly-planck-7ylnmk --event workflow_dispatch --limit 3 \
                      --json databaseId,createdAt --jq "[.[] | select(.createdAt > \"$since\")] | sort_by(.createdAt) | .[0].databaseId // empty")
              [ -n "$rid" ] && break
            done
            if [ -z "$rid" ]; then echo "parti $n: koşu bulunamadı"; break; fi
            echo "parti $n: koşu $rid"
            st=""
            for i in $(seq 1 150); do
              sleep 20
              st=$(gh run view "$rid" --repo "$REPO" --json status,conclusion --jq '.status + "/" + .conclusion')
              case "$st" in completed/*) break;; esac
            done
            echo "parti $n: $st"
            # kütük: `gh run view --log` çoğu zaman boş döner; iş kütüğü REST'ten (yönlendirmeyi gh api izler)
            jid=$(gh run view "$rid" --repo "$REPO" --json jobs --jq '.jobs[0].databaseId' 2>/dev/null || true)
            logtxt=$( { [ -n "$jid" ] && gh api "repos/$REPO/actions/jobs/$jid/logs" 2>/dev/null; } || gh run view "$rid" --repo "$REPO" --log 2>/dev/null || true)
            sent=$(printf '%s' "$logtxt" | grep -a -o 'BITTI\. gonderildi: [0-9]*' | tail -1 | grep -o '[0-9]*$' || true)
            if [ "$DRY" = "true" ]; then
              echo "parti $n: KURU KOŞU — $(printf '%s' "$logtxt" | grep -a -c 'out:   •' || true) aday listelendi, tarama tek partide durur"
              echo "GECE TARAMASI (kuru) BİTTİ"; echo "### Brevo gece taraması (kuru koşu): tek parti listelendi" >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            if [ -z "$sent" ]; then echo "parti $n: kütük okunamadı (sayı bilinmiyor)"; sent=0; known=0; else known=1; echo "parti $n: gönderildi $sent"; fi
            total=$((total + sent))
            case "$st" in completed/success) ;; *) echo "parti $n başarısız/kota bitti — tarama durdu"; break;; esac
            # sayı biliniyorsa ve parti dolmadıysa uygun lead ya da kota bitmiştir; bilinmiyorsa koşu başarılı olduğu sürece sürer (0 gönderen parti zararsız)
            [ "$known" = 1 ] && [ "$sent" -lt 50 ] && { echo "parti $n 50'den az gönderdi — uygun lead ya da kota bitti"; break; }
          done
          echo "GECE TARAMASI BİTTİ · toplam gönderildi: $total"
          echo "### Brevo gece taraması · toplam gönderildi: $total" >> "$GITHUB_STEP_SUMMARY"
