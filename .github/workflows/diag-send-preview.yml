name: (Tanı) Sıradaki alıcılar — gönderim açılmadan önce önizleme (salt okuma)
# 14 Eki 2026 (RTL olayı). Sunucunun yeni süzgeçleriyle sırada bekleyen ilk alıcılar + takip turu adayları.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 3m
          script: |
            cd ~/public_html
            cat > /tmp/vestra_sp.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $home = getenv("HOME");
            require      $home."/public_html/inc/products.php";
            require_once $home."/public_html/inc/leads.php";
            require_once $home."/public_html/inc/notify.php";
            require_once $home."/public_html/inc/finder.php";
            require_once $home."/public_html/inc/mailbox.php";
            echo "durdurulan ulkeler: ".json_encode(vestra_send_paused_countries())."\n";
            $t = vestra_finder_send_targets(5000, 'web'); $byC = [];
            foreach ($t as $l) { $c = (string)($l['country'] ?? ''); $byC[$c] = ($byC[$c] ?? 0) + 1; }
            arsort($byC); echo "SIRADA (web, ilk mektup): ".count($t)." · ".json_encode($byC, JSON_UNESCAPED_UNICODE)."\n";
            foreach ($t as $l) { $e = strtolower((string)$l['email']); printf("  %-34.34s %-32.32s %.3s %s\n", (string)($l['company'] ?? ''), substr((string)strrchr($e, '@'), 1), (string)($l['country'] ?? ''), implode(',', array_slice((array)($l['premium_brands'] ?? []), 0, 2))); }
            $nr = 0; $de = 0; foreach (vestra_leads() as $l) { if (trim((string)($l['last_contacted_at'] ?? '')) !== '') continue; if (vestra_lead_not_retail($l)) $nr++; if (vestra_lead_send_paused($l)) $de++; }
            echo "\nyazilmamis kayitlardan: moda-disi suzgece takilan $nr · durdurulan ulkede $de\n";
            echo "takip adayi: ".count(vestra_mailbox_followup_targets(5000))."\n";
            PHPEOF
            php /tmp/vestra_sp.php 2>&1; rm -f /tmp/vestra_sp.php
