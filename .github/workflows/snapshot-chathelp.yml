name: chat-help.com Recht uygulaması kaynak kopyası (server-snapshot dalı)

# Sunucudaki mevcut Recht uygulamasının (html/chat/) kaynak dosyalarını SALT OKUNUR alır ve
# `server-snapshot` dalına yazar → tasarım/iyileştirme için incelenir. db.php ve *.bak dosyaları ALINMAZ.
# Alınan dosyalarda anahtar/şifre benzeri değerler (sk_live, whsec, xkeysib, sk-ant, AIza, password=...) maskelenir.
# Sunucuda hiçbir şey değiştirilmez.

on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Alınacak yollar (docroot göreli, boşlukla ayrılmış)"
        required: true
        default: "chat/index.php chat/auth.php chat/geo.php chat/*.css chat/*.js chat/assets chat/css chat/js chat/img chat/includes chat/templates chat/lang chat/views"
      secrets_prefix:
        description: "Secret ön eki"
        required: true
        default: "CHATHELP"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      CH_HOST: ${{ secrets[format('{0}_HOST', github.event.inputs.secrets_prefix)] }}
      CH_USER: ${{ secrets[format('{0}_USER', github.event.inputs.secrets_prefix)] }}
      CH_PASS: ${{ secrets[format('{0}_PASSWORD', github.event.inputs.secrets_prefix)] }}
      CH_PORT: ${{ secrets[format('{0}_PORT', github.event.inputs.secrets_prefix)] }}
      PATHS_IN: ${{ github.event.inputs.paths }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bağlan ve dosyaları al (salt okunur)
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass > /dev/null
          trim(){ local v="$1"; v="${v//$'\r'/}"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          CH_USER=$(trim "$CH_USER"); CH_PASS=$(trim "$CH_PASS"); CH_HOST=$(trim "${CH_HOST:-145450.eu11.ssh.myftpupload.com}"); P=$(trim "${CH_PORT:-22}")
          [ -n "$CH_USER" ] && [ -n "$CH_PASS" ] || { echo "::error::CHATHELP_USER / CHATHELP_PASSWORD yok"; exit 1; }
          export SSHPASS="$CH_PASS"
          SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o ConnectTimeout=25 -p $P"
          SRV="$CH_USER@$CH_HOST"
          DEST=$($SSH "$SRV" 'for d in ~/html ~/public_html ~/www; do [ -f "$d/chat/auth.php" ] && { echo "$d"; break; }; done')
          [ -n "$DEST" ] || { echo "::error::docroot bulunamadı"; exit 1; }
          echo "DOCROOT: $DEST"
          echo "--- chat/ dizini ---"; $SSH "$SRV" "cd $DEST && ls -la chat | head -80 && echo '--- alt dizinler ---' && find chat -maxdepth 2 -type d | head -40 && echo '--- buyuk dosyalar ---' && find chat -maxdepth 2 -type f -size +20k ! -name '*.bak*' | head -40"
          # tar ile al: db.php, yedekler, tmp dışarıda
          rm -rf snap && mkdir -p snap
          $SSH "$SRV" "cd $DEST && tar czf - --ignore-failed-read --exclude='chat/db.php' --exclude='*.bak*' --exclude='*.bak-*' --exclude='chat/vendor' --exclude='chat/uploads' --exclude='chat/cache' --exclude='chat/tmp' --exclude='chat/logs' --exclude='*.zip' --exclude='*.sql' $PATHS_IN 2>/dev/null" > snap/snap.tgz || true
          mkdir -p snap/x && tar xzf snap/snap.tgz -C snap/x && rm snap/snap.tgz
          echo "--- alınan ---"; find snap/x -type f | head -200; du -sh snap/x

      - name: Gizli değerleri maskele
        run: |
          set -e
          cd snap/x
          # anahtar/şifre kalıpları → ***REDACTED***
          grep -rlE "sk_live_[A-Za-z0-9]{8,}|sk_test_[A-Za-z0-9]{8,}|whsec_[A-Za-z0-9]{8,}|xkeysib-[A-Za-z0-9-]{8,}|sk-ant-[A-Za-z0-9_-]{8,}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|IGAA[A-Za-z0-9]{20,}|EAA[A-Za-z0-9]{40,}" . 2>/dev/null | while read -r f; do
            sed -i -E "s/(sk_live_|sk_test_|whsec_|xkeysib-|sk-ant-)[A-Za-z0-9_-]{8,}/\1***REDACTED***/g; s/sk-[A-Za-z0-9]{20,}/sk-***REDACTED***/g; s/AIza[0-9A-Za-z_-]{20,}/AIza***REDACTED***/g; s/IGAA[A-Za-z0-9]{20,}/IGAA***REDACTED***/g; s/EAA[A-Za-z0-9]{40,}/EAA***REDACTED***/g" "$f"; echo "maskelendi: $f"; done
          grep -rlEi "(password|passwd|pwd|secret|api_key|apikey)['\"]?\s*(=>|=|:)\s*['\"][^'\"]{6,}['\"]" . 2>/dev/null | while read -r f; do
            sed -i -E "s/((password|passwd|pwd|secret|api_key|apikey)['\"]?\s*(=>|=|:)\s*['\"])[^'\"]{6,}(['\"])/\1***REDACTED***\4/Ig" "$f"; echo "sifre-maskelendi: $f"; done
          echo "kalan şüpheli:"; grep -rnoE "sk_live_[A-Za-z0-9]{4}|whsec_[A-Za-z0-9]{4}|xkeysib-[A-Za-z0-9]{4}" . | head -5 || true

      - name: server-snapshot dalına yaz
        run: |
          set -e
          git config user.name "chathelp-snapshot"; git config user.email "noreply@chat-help.com"
          git fetch origin server-snapshot:server-snapshot 2>/dev/null || true
          git checkout -B server-snapshot
          git rm -rq --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'snap' -exec rm -rf {} +
          cp -r snap/x/. . && rm -rf snap
          printf '# server-snapshot\n\nchat-help.com html/ altından alınan SALT OKUNUR kaynak kopyası (db.php ve yedekler hariç, anahtarlar maskelenmiş).\nAlındı: %s UTC\n' "$(date -u +'%Y-%m-%d %H:%M')" > README.md
          git add -A
          git commit -qm "server snapshot $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "değişiklik yok"
          git push -f origin server-snapshot
          echo "dal: server-snapshot"; git ls-files | head -100
