name: (Posta kutusu) İndirim partisi + 23:45 turu — aç / ACİL DURDUR

# 17 Eki 2026 (operatör: "noreply@g-star.com buna neden e-mail gönderiyorsun? distribütör ve büyük zincir butiklere ya
# da marketlere göndermemen gerektiğini söylemiştim"). Eski müşterilere giden indirim mektubu (inc/mailbox.php
# vestra_mailbox_deals_daily) ve 23:45 tamamlama turu için ayrı anahtar: yeni bulunan butiklere gönderim (otomatik) AÇIK
# kalır. Kapatırken SÜREN indirim / takip partisi de durdurulur (sunucudaki cron_mailbox.php süreci yalnız açık istek bir
# takip partisiyse sonlandırılır; istek 'cancelled' olur). Adres basmaz.
on:
  workflow_dispatch:
    inputs:
      enable:
        description: "true = aç · false = kapat ve süren partiyi durdur"
        required: true
        default: "false"
      start:
        description: "Açarken: tomorrow = bugün yeniden başlamaz, yarın 08:30'dan (23:45 turu da bu gece yok) · now = bugünden"
        required: false
        default: "tomorrow"
      quota:
        description: "Açarken (isteğe bağlı): BUGÜNKÜ indirim payı (ör. 490). Yalnız bugün geçerli, sunucu tavanını aşamaz; boş = varsayılan (300)"
        required: false
        default: ""
      daily_cap:
        description: "İsteğe bağlı: sunucunun KALICI günlük tavanı (en çok 600; boş = değişmez)"
        required: false
        default: ""
      unpause_today:
        description: "Açarken (isteğe bağlı): true = durdurulan ülkeler (Almanya) YALNIZ BUGÜN açık; yarın kendiliğinden yine durur"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          ON: ${{ github.event.inputs.enable }}
          START: ${{ github.event.inputs.start }}
          QUOTA: ${{ github.event.inputs.quota }}
          UNPAUSE: ${{ github.event.inputs.unpause_today }}
          DCAP: ${{ github.event.inputs.daily_cap }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: ON,START,QUOTA,UNPAUSE,DCAP
          command_timeout: 2m
          script: |
            cd ~/public_html
            cat > /tmp/vestra_deals_switch.php <<'PHPEOF'
            <?php
            chdir(getenv('HOME').'/public_html');
            require 'inc/products.php'; require_once 'inc/mailbox.php';
            $on = strtolower(trim((string)getenv('ON'))) === 'true';
            $cfg = vestra_mailbox_cfg(); $cfg['deals'] = $on; $cfg['followup'] = $on; $cfg['deals_switch_at'] = date('c');
            $q = (int)preg_replace('/\D/', '', (string)getenv('QUOTA'));
            if ($on && $q > 0) { $cfg['deals_quota'] = min($q, VESTRA_MAILBOX_MAX_CAP); $cfg['deals_quota_day'] = date('Y-m-d'); echo "bugunku indirim payi: ".$cfg['deals_quota']." (".date('Y-m-d').")\n"; }
            if ($on && strtolower(trim((string)getenv('UNPAUSE'))) === 'true') { $cfg['paused_off_day'] = date('Y-m-d'); echo "durdurulan ulkeler YALNIZ BUGUN acik (".date('Y-m-d').")\n"; }
            if ($on && strtolower(trim((string)getenv('START'))) === 'now' && (string)($cfg['deals_empty'] ?? '') === date('Y-m-d')) { unset($cfg['deals_empty']); echo "bugunku 'alici yok' isareti silindi (yeni kampanya icin yeniden aranir)\n"; }
            if ($on && strtolower(trim((string)getenv('START'))) !== 'now') {   // bugünün denemeleri ve 23:45 turu tükenmiş sayılır
              $cfg['deals_day'] = date('Y-m-d'); $cfg['deals_tries'] = defined('VESTRA_MAILBOX_DEALS_TRIES') ? VESTRA_MAILBOX_DEALS_TRIES : 3; $cfg['followup_day'] = date('Y-m-d');
            }
            $dc = (int)preg_replace('/\D/', '', (string)getenv('DCAP'));
            if ($dc > 0) { $cfg['daily_cap'] = max(1, min($dc, VESTRA_MAILBOX_MAX_CAP)); $cfg['daily_cap_set_at'] = date('c'); echo "gunluk tavan (kalici): ".$cfg['daily_cap']."\n"; }
            $f = vestra_mailbox_file('mailbox.json'); file_put_contents($f, json_encode($cfg, JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE), LOCK_EX); @chmod($f, 0600);
            $runs = vestra_mailbox_runs(); $kill = false; $c = 0;
            if (!$on) foreach ($runs as $i => $r) {
              if (($r['mode'] ?? '') !== 'followup' || !in_array((string)($r['status'] ?? ''), ['requested', 'running'], true)) continue;
              if (($r['status'] ?? '') === 'running') $kill = true;
              $runs[$i]['status'] = 'cancelled'; $runs[$i]['note'] = 'operator: indirim partisi durduruldu'; $runs[$i]['finished_at'] = date('c'); $c++;
            }
            vestra_mailbox_runs_save($runs);
            echo ($on ? "INDIRIM PARTISI + 23:45 TURU ACIK".(strtolower(trim((string)getenv('START'))) !== 'now' ? " (yarin 08:30'dan)" : " (bugunden)") : "INDIRIM PARTISI + 23:45 TURU KAPALI")." · iptal edilen takip istegi: {$c}\n";
            if ($on && function_exists('vestra_mailbox_followup_targets')) echo "uygun indirim alicisi (yeni kurallarla): ".count(vestra_mailbox_followup_targets(5000))."\n";
            echo "bugun indirim mektubu: ".vestra_mailbox_followups_today('deals')." · bugun toplam: ".vestra_mailbox_sent_today()."\n";
            echo "gecerli indirim payi (bugun): ".vestra_mailbox_deals_quota()." · sunucu tavani: ".vestra_mailbox_cap_today()."\n";
            exit($kill ? 3 : 0);
            PHPEOF
            php /tmp/vestra_deals_switch.php 2>&1; rc=$?; rm -f /tmp/vestra_deals_switch.php
            # Kapatırken: sunucuda süren 'php cron_mailbox.php' süreci (indirim partisi) sonlandırılır. Bu betiğin kendi kabuğu
            # da "cron_mailbox" metnini taşıdığı için yalnız GERÇEK php süreci seçilir (komut satırı php ile başlar, ikinci
            # argüman tam olarak cron_mailbox.php). Cron 10 dk sonra kendiliğinden yeniden başlar; indirim kapalıyken
            # yalnız yeni butiklere gönderir.
            if [ "${ON}" != "true" ]; then
              killed=0
              for p in $(pgrep -u "$(id -u)" php 2>/dev/null) $(pgrep -u "$(id -u)" -f 'lsphp|php-cli' 2>/dev/null); do
                set -- $(tr '\0' ' ' < /proc/$p/cmdline 2>/dev/null)
                case "$1" in *php*) [ "$2" = "cron_mailbox.php" ] && kill "$p" 2>/dev/null && { echo "durduruldu: cron_mailbox.php (pid $p)"; killed=1; } ;; esac
              done
              [ "$killed" = 1 ] || echo "suren cron_mailbox.php sureci yok"
            fi
            exit 0
