name: (Tani) Hesap kisitlamasi nerede — butun veri dosyalari
# 17 Eki 2026 (operator: "hayir gercekten kisitlanmisti"). Hesabin kendi alanlari temiz cikti; kisitlama baska bir
# yerde olabilir. Bu tani SALT OKUR: ayni e-postali/ayni vergi nolu baska hesap, accounts.json yedeklerinde bu hesabin
# durum gecmisi, IP / ulke engeli, guvenlik kutugu ve data/ altindaki HER dosyada e-posta / hesap id / IP gecis sayisi.
# Kisisel veri (ad, telefon, adres, tam IP) BASILMAZ — depo ve kutuk herkese acik.
on:
  workflow_dispatch:
    inputs:
      email_b64:
        description: "Hesabin e-postasi, base64"
        required: true
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Tani
        uses: appleboy/ssh-action@v1.0.3
        env:
          EMAIL_B64: ${{ github.event.inputs.email_b64 }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: EMAIL_B64
          command_timeout: 5m
          script: |
            cd ~/public_html
            cat > /tmp/vestra_acc_diag.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL); ini_set('memory_limit','512M');
            $home = getenv("HOME");
            require      $home."/public_html/inc/products.php";
            require_once $home."/public_html/inc/auth.php";
            require_once $home."/public_html/inc/security.php";
            $email = strtolower(trim((string)base64_decode((string)getenv('EMAIL_B64'), true)));
            $mIp = static fn(string $ip): string => $ip === '' ? '-' : implode('.', array_slice(explode('.', $ip), 0, 2)).'.x.x';
            $st = static function (array $a): string {
              $o = [];
              foreach (['type','status','suspend_reason','kyb_status','restricted_until','unsuspended_at','unsuspended_by','restricted_lifted_at','restricted_lifted_by'] as $k)
                if (array_key_exists($k, $a)) $o[] = $k.'='.(is_scalar($a[$k]) ? (string)$a[$k] : json_encode($a[$k]));
              if (!empty($a['suspend_note'])) $o[] = 'suspend_note='.mb_substr(preg_replace('/\S+@\S+/', '[adres]', (string)$a['suspend_note']), 0, 50);
              if (!empty($a['restricted_lift_refs'])) $o[] = 'lift_refs='.count((array)$a['restricted_lift_refs']);
              foreach ($a as $k => $v) if (preg_match('/block|ban|hold|lock|limit|restrict|freeze|risk|strike|deny|flag/i', (string)$k) && !in_array($k, ['restricted_until','restricted_lift_refs','restricted_lifted_at','restricted_lifted_by'], true))
                $o[] = $k.'='.(is_scalar($v) ? mb_substr((string)$v, 0, 40) : '[liste:'.count((array)$v).']');
              return implode(' · ', $o);
            };
            $all = auth_accounts();
            $acc = auth_find($email);
            if (!$acc) { echo "hesap yok\n"; exit(1); }
            $uid = (string)$acc['id'];
            echo "== 1. Ayni e-posta / ayni sirket ==\n";
            $same = array_values(array_filter($all, fn($a) => strtolower(trim((string)($a['email'] ?? ''))) === $email));
            echo "   ayni e-postali hesap: ".count($same)."\n";
            foreach ($same as $a) echo "   - id ".$a['id']." · ".$st($a)."\n";
            $vat = preg_replace('/\W/', '', strtolower((string)($acc['vat_id'] ?? ''))); $reg = preg_replace('/\W/', '', (string)($acc['reg_number'] ?? ''));
            $co = strtolower(trim((string)($acc['company'] ?? '')));
            foreach ($all as $a) {
              if ((string)($a['id'] ?? '') === $uid) continue;
              $why = [];
              if ($vat !== '' && preg_replace('/\W/', '', strtolower((string)($a['vat_id'] ?? ''))) === $vat) $why[] = 'vergi no';
              if ($reg !== '' && preg_replace('/\W/', '', (string)($a['reg_number'] ?? '')) === $reg) $why[] = 'sicil no';
              if ($co !== '' && strtolower(trim((string)($a['company'] ?? ''))) === $co) $why[] = 'sirket adi';
              if (($acc['last_ip'] ?? '') !== '' && (($a['last_ip'] ?? '') === $acc['last_ip'] || ($a['reg_ip'] ?? '') === $acc['last_ip'])) $why[] = 'ayni IP';
              if ($why) echo "   - BAGLI hesap id ".$a['id']." (".implode(', ', $why).") · e-posta ".substr((string)($a['email'] ?? ''), 0, 1)."***@".substr(strrchr((string)($a['email'] ?? ''), '@') ?: '', 1)." · ".$st($a)."\n";
            }
            echo "== 2. Yedeklerde bu hesabin durum gecmisi ==\n";
            $dir = vestra_data_dir();
            $files = array_merge(glob($dir.'/accounts.json*') ?: [], glob($dir.'/*/accounts*.json*') ?: [], glob($dir.'/deleted-accounts/*') ?: []);
            usort($files, fn($x, $y) => filemtime($x) <=> filemtime($y));
            $prev = null;
            foreach ($files as $f) {
              $d = json_decode((string)@file_get_contents($f), true); if (!is_array($d)) continue;
              $rows = isset($d['id']) ? [$d] : $d; $hit = null;
              foreach ($rows as $a) if (is_array($a) && ((string)($a['id'] ?? '') === $uid || strtolower(trim((string)($a['email'] ?? ''))) === $email)) { $hit = $a; break; }
              $line = $hit ? $st($hit) : '(bu hesap yok)';
              if ($line !== $prev) echo "   ".date('Y-m-d H:i', filemtime($f))." ".basename($f)." → ".$line."\n";
              $prev = $line;
            }
            echo "   (".count($files)." yedek dosyasi tarandi; yalniz degisen satirlar)\n";
            echo "== 3. IP / ulke engeli ==\n";
            $ips = array_values(array_unique(array_filter([(string)($acc['reg_ip'] ?? ''), (string)($acc['last_ip'] ?? '')])));
            $log = _vsec_read('security_log.json'); $logHits = [];
            foreach ($log as $e) if (is_array($e) && (strtolower((string)($e['email'] ?? '')) === $email || (string)($e['uid'] ?? '') === $uid)) { $logHits[] = $e; if (!empty($e['ip'])) $ips[] = (string)$e['ip']; }
            $ips = array_values(array_unique($ips));
            echo "   ip kurali sayisi: ".count(vestra_ip_blocks())."\n";
            foreach ($ips as $ip) { $b = vestra_ip_blocked($ip); echo "   ".$mIp($ip)." → ".($b ? 'ENGELLI (kural '.$mIp((string)($b['ip'] ?? '')).' · not: '.mb_substr((string)($b['note'] ?? ''), 0, 60).' · '.($b['added_at'] ?? '').')' : 'engel yok').(function_exists('vestra_country_blocked') && vestra_country_blocked($ip, '/') ? ' · ULKE ENGELI' : '')."\n"; }
            $cb = vestra_country_blocks(); echo "   engelli ulkeler: ".(implode(',', array_keys($cb['countries'])) ?: 'yok')."\n";
            echo "   guvenlik kutugu (son 15): \n";
            foreach (array_slice($logHits, -15) as $e) echo "     ".($e['ts'] ?? '')." ".($e['event'] ?? '')." cc=".($e['cc'] ?? '')." vpn=".json_encode($e['vpn'] ?? null)."\n";
            echo "== 4. data/ altinda gecisler (E=e-posta U=hesap id I=IP) ==\n";
            $needles = ['E' => $email, 'U' => $uid];
            foreach ($ips as $i => $ip) $needles['I'.$i] = $ip;
            $it = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($dir, FilesystemIterator::SKIP_DOTS));
            $n = 0;
            foreach ($it as $f) {
              if (!$f->isFile() || $f->getSize() > 80 * 1024 * 1024) continue;
              $p = substr($f->getPathname(), strlen($dir) + 1);
              if (preg_match('#^accounts\.json#', $p)) continue;
              $raw = strtolower((string)@file_get_contents($f->getPathname())); $n++;
              $c = [];
              foreach ($needles as $k => $v) if ($v !== '' && ($x = substr_count($raw, strtolower($v)))) $c[] = $k.':'.$x;
              if ($c) echo "   ".$p." (".date('Y-m-d H:i', $f->getMTime()).") → ".implode(' ', $c)."\n";
            }
            echo "   ($n dosya tarandi)\n";
            PHPEOF
            php /tmp/vestra_acc_diag.php 2>&1; rc=$?; rm -f /tmp/vestra_acc_diag.php; exit $rc
