name: (Hesap) Askıyı kaldır — normale döndür, sipariş verebilsin
# 14 Eki 2026 (operatör: "bu müşterinin hesabını aç, normale döndür, sipariş verebilsin"). Admin ▸ Kullanıcılar'daki
# "Open account" + "Activate account" düğmelerinin yazdığı alanların aynısı: status=active, suspend_reason/suspend_note
# boş, kyb_status=approved; ödenmemiş fatura kısıtlaması (restricted_until) da kalkar. Kampanya dışı işareti
# (no_campaigns) DEĞİŞMEZ, yalnız raporlanır. Adres girdide base64 (depo herkese açık), kütükte maskeli. Yedek alınır.
# 17 Eki 2026 (operatör: "kısıtlamayı kaldır ve müşteriye hesabının tekrar erişime açıldığını e-mail ile belirt"): notify=true
# ise hesap gerçekten açıldıktan sonra müşteriye kendi dilinde "hesabınız yeniden erişime açıldı" mektubu gider
# (inc/email_templates.php vestra_tpl_account_reopened; dil hesabın dili, yoksa ülkesi).
on:
  workflow_dispatch:
    inputs:
      email_b64:
        description: "Hesabın e-postası, base64"
        required: true
      dry_run:
        description: "true = yalnız göster"
        required: false
        default: "true"
      notify:
        description: "true = açıldıktan sonra müşteriye 'hesabınız yeniden açıldı' e-postası"
        required: false
        default: "false"
permissions:
  contents: read
jobs:
  reopen:
    runs-on: ubuntu-latest
    steps:
      - name: Hesap
        uses: appleboy/ssh-action@v1.0.3
        env:
          EMAIL_B64: ${{ github.event.inputs.email_b64 }}
          DRY: ${{ github.event.inputs.dry_run }}
          NOTIFY: ${{ github.event.inputs.notify }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: EMAIL_B64,DRY,NOTIFY
          command_timeout: 3m
          script: |
            cd ~/public_html
            cat > /tmp/vestra_reopen.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $home = getenv("HOME");
            require      $home."/public_html/inc/products.php";
            require_once $home."/public_html/inc/auth.php";
            $dry = strtolower(trim((string)getenv('DRY'))) !== 'false';
            $email = strtolower(trim((string)base64_decode((string)getenv('EMAIL_B64'), true)));
            $mask = static function (string $e): string { [$u, $d] = array_pad(explode('@', $e, 2), 2, ''); return substr($u, 0, 1).'***@'.$d; };
            $acc = auth_find($email);
            if (!$acc) { echo "hesap yok: ".$mask($email)."\n"; exit(1); }
            $show = function (array $a) { foreach (['type','company','status','suspend_reason','suspend_note','kyb_status','kyb_status_before_suspend','restricted_until','no_campaigns','unsuspended_at','unsuspended_by'] as $k) if (array_key_exists($k, $a)) echo "   $k = ".(is_scalar($a[$k]) ? var_export($a[$k], true) : json_encode($a[$k]))."\n"; };
            echo ($dry ? "KURU KOSU" : "GERCEK")." · ".$mask($email)." · id ".$acc['id']."\nONCE:\n"; $show($acc);
            /* 17 Eki 2026: bilinen alanlarda kısıtlama görünmeyebilir — hesabın BÜTÜN alanları (hassaslar hariç), giriş kilidi
               (login_throttle.json, 15 dk) ve mesaj engeli de gösterilir. */
            echo "   tum alanlar: ";
            $safe = [];
            foreach ($acc as $k => $v) { if (preg_match('/hash|pass|token|secret|api|iban|bic|bank|swift|account_no|card|session|otp|code/i', (string)$k)) { $safe[$k] = '[gizli]'; continue; }
              $safe[$k] = is_scalar($v) || $v === null ? (is_string($v) ? mb_substr(preg_replace('/\S+@\S+/', '[adres]', $v), 0, 60) : $v) : '['.gettype($v).(is_array($v) ? ':'.count($v) : '').']'; }
            echo json_encode($safe, JSON_UNESCAPED_UNICODE)."\n";
            $thr = function_exists('auth_throttle_load') ? auth_throttle_load() : []; $thrHits = [];
            foreach ($thr as $tk => $tv) if (str_contains(strtolower((string)$tk), $email)) $thrHits[] = (int)($tv['n'] ?? 0).' deneme, '.date('H:i', (int)($tv['first'] ?? 0));
            echo "   giris kilidi (son 1 saat): ".($thrHits ? implode(' | ', $thrHits) : 'yok')."\n";
            echo "   fiyat/siparis acik mi: ".(auth_prices_unlocked($acc) && ($acc['status'] ?? '') !== 'suspended' ? 'EVET' : 'HAYIR')." · kisitli: ".(auth_restricted_until($acc) ? date('Y-m-d', auth_restricted_until($acc)) : 'yok')."\n";
            if (is_file($home.'/public_html/inc/unpaid_hold.php')) { require_once $home.'/public_html/inc/unpaid_hold.php'; $st = vestra_unpaid_hold_state($acc);
              echo "   siparisler: acik/odenmemis ".count($st['open'])." (".implode(', ', array_keys($st['open'])).") · odenmis ".count($st['paid'])." · iptal ".$st['cancelled']."\n"; }
            if ($dry) exit(0);
            @copy(vestra_data_dir().'/accounts.json', vestra_data_dir().'/accounts.json.bak-reopen-'.date('Ymd_His'));
            auth_update((string)$acc['id'], ['status' => 'active', 'suspend_reason' => '', 'suspend_note' => '', 'kyb_status' => 'approved',
              'restricted_until' => '', 'restricted_lift_refs' => [], 'unsuspended_at' => date('c'), 'unsuspended_by' => 'operator ('.date('j M Y').', workflow)']);
            if ($thr) { foreach (array_keys($thr) as $tk) if (str_contains(strtolower((string)$tk), $email)) unset($thr[$tk]); auth_throttle_save($thr); }
            $back = auth_find($email);
            echo "SONRA:\n"; $show($back);
            $okNow = $back && ($back['status'] ?? '') === 'active' && auth_prices_unlocked($back) && !auth_restricted_until($back) && !auth_suspended_for_unpaid($back);
            echo "   fiyat/siparis acik mi: ".($okNow ? 'EVET' : 'HAYIR')."\n";
            if ($okNow && strtolower(trim((string)getenv('NOTIFY'))) === 'true') {
              require_once $home."/public_html/inc/notify.php"; require_once $home."/public_html/inc/email_templates.php"; require_once $home."/public_html/inc/i18n.php";
              $lang = strtolower(substr((string)($back['lang'] ?? ''), 0, 2));
              if (!in_array($lang, ['en','de','fr','it','es'], true)) {
                $c = strtolower(trim((string)($back['country'] ?? '')));
                $lang = in_array($c, ['france','fr','belgique','luxembourg','monaco'], true) || str_ends_with($email, '.fr') ? 'fr'
                      : (in_array($c, ['germany','deutschland','de','austria','österreich','at'], true) ? 'de'
                      : (in_array($c, ['italy','italia','it'], true) ? 'it' : (in_array($c, ['spain','españa','es'], true) ? 'es' : 'en')));
              }
              $who = trim((string)($back['name'] ?? '')) ?: (trim((string)($back['company'] ?? '')) ?: 'there');
              $panel = 'https://vestrasales.com'.((($back['type'] ?? '') === 'seller') ? '/seller' : '/buyer');
              [$ms, $mb, $mo] = vestra_tpl_account_reopened($lang, $who, $panel);
              $sent = vestra_send_mail((string)$back['email'], $ms, $mb, '', 'VESTRA', null, '', $mo);
              echo "   musteriye bildirim (dil {$lang}): ".($sent ? 'GONDERILDI' : 'GONDERILEMEDI'.(function_exists('vestra_mail_last_reason') ? ' — '.vestra_mail_last_reason() : ''))."\n";
              if (!$sent) exit(1);
            }
            exit($okNow ? 0 : 1);
            PHPEOF
            php /tmp/vestra_reopen.php 2>&1; rc=$?; rm -f /tmp/vestra_reopen.php; exit $rc
