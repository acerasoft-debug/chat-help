name: Daily Content (Rechtstipp)

# Her gün 04:00 UTC + elle tetikleme
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: İçerik üret (Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-content.mjs

      - name: Commit & push
        run: |
          git config user.name "chathelp-agent"
          git config user.email "chathelp-agent@users.noreply.github.com"
          git add content/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "content: täglicher Rechtstipp ($(date +%F))"
            git push
          fi
