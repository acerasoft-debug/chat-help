name: (Zamanlayıcı) Brevo partileri + saatlik geri dönme taraması
# 14 Eki 2026 (operatör: "Brevo'da her zaman 100 hak kalsın, 23.45'te kontrol edilsin ve hak kaldıysa devam gönderilsin
# … halen e-posta hataları geliyor"). GitHub cron'u brevo-daily'yi atlıyordu (14 Eki 09:12 hiç, 13 Eki gece 3 sa geç);
# sunucuda GitHub anahtarı yok (diag-ops), yani sunucu da başlatamıyor. pacemaker.yml'nin yöntemi: bu iş kendini
# zincirler — sıradaki işe kadar bekler (en çok ~1 sa), onu workflow_dispatch ile başlatır, kendini yeniden başlatır.
#   - brevo-daily.yml: 09:12 ve 15:12 Avrupa saati 50'lik parti; 23:45 gece taraması (kalan hakla, 100 rezerv)
#   - mailbox-send.yml bounces: her saat :05 UTC (teslim hatası bildirimlerini toplar, adresi "geri döndü" işaretler)
# brevo-daily kendi içinde "son 100 dk'da başka koşu varsa atla" korumasıyla çift gönderimi önler.
# Saatlik cron yalnız zincir koparsa yeniden kurar; aynı anda tek zincir.
on:
  workflow_dispatch:
  schedule:
    - cron: '50 * * * *'
permissions:
  actions: write
  contents: read
concurrency:
  group: ops-pacemaker
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Tek zincir — sırada başka koşu varsa çık
        id: guard
        run: |
          OTHERS=$(gh run list --workflow ops-pacemaker.yml --status queued --json databaseId --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length")
          echo "sirada bekleyen baska ops-pacemaker: $OTHERS"
          if [ "${OTHERS:-0}" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - name: Sıradaki işe kadar bekle ve başlat
        if: steps.guard.outputs.skip != 'true'
        run: |
          now=$(date -u +%s)
          best=""; what=""
          for d in 0 1; do
            day=$(TZ=Europe/Berlin date -d "+$d day" +%Y-%m-%d)
            for hm in 09:12 15:12 23:45; do
              t=$(TZ=Europe/Berlin date -d "$day $hm" +%s)
              if [ "$t" -gt $((now + 30)) ] && { [ -z "$best" ] || [ "$t" -lt "$best" ]; }; then best=$t; what="brevo-$hm"; fi
            done
          done
          nb=$(date -u -d "$(date -u +%Y-%m-%d) $(date -u +%H):05:00" +%s); [ "$nb" -le $((now + 30)) ] && nb=$((nb + 3600))
          if [ "$nb" -lt "$best" ]; then best=$nb; what="bounces"; fi
          echo "simdi $(date -u +%H:%M) UTC · sonraki: $what @ $(TZ=Europe/Berlin date -d @$best +%H:%M) Avrupa · bekleme $(((best - now) / 60)) dk"
          sleep $((best - now))
          case "$what" in
            brevo-23:45) gh workflow run brevo-daily.yml --ref "${{ github.ref_name }}" -f count=50 -f dry_run=false -f sweep=true ;;
            brevo-*)     gh workflow run brevo-daily.yml --ref "${{ github.ref_name }}" -f count=50 -f dry_run=false -f sweep=false ;;
            bounces)     gh workflow run mailbox-send.yml --ref "${{ github.ref_name }}" -f mode=bounces ;;
          esac
          echo "baslatildi: $what ($(date -u +%H:%M) UTC)"
      - name: Zinciri sürdür
        if: steps.guard.outputs.skip != 'true'
        run: gh workflow run ops-pacemaker.yml --ref "${{ github.ref_name }}"
