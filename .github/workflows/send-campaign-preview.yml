            if($wantAtts):
            $body.=
              '<h3>General information</h3>'
             .$g('Prices.','Per piece in EUR, excluding VAT and freight. Every row carries the '
                .'manufacturer\'s article number, our reference, sizes, stock, minimum order quantity, '
