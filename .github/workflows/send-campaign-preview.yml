name: Örnek kampanya önizleme gönder (test)

# Elle tetiklenir. Sunucudaki vestra_campaign_preview() builder'ını kullanarak
# premium kampanya e-postasını TEK bir alıcıya (varsayılan: operatörün kendi test
# kutusu acerasoft@gmail.com) gönderir. Gönderen görünen adı "Les Garage de Paris",
# gerçek gönderen adresi doğrulanmış support@vestrasales.com kalır.
# Kampanya içeriği/estetiği inc/notify.php içindeki builder'da yaşar; burada değişmez.
on:
  workflow_dispatch:
    inputs:
      to:
        description: "Alıcı e-posta (boş bırakılırsa acerasoft@gmail.com)"
        required: false
        default: "acerasoft@gmail.com"
      variant:
        description: "premium (genel) | pool (premium + açık havuzlar bölümü) | polos_promo (Lacoste polo, EN) | voucher (hoş geldin kuponu — TEK adrese önizleme)"
        required: false
        default: "premium"
      lang:
        description: "voucher önizlemesi hangi dilde: de | en | fr | it | es"
        required: false
        default: "de"
      render_only:
        description: "true = e-posta GÖNDERME, sadece nihai HTML'i (görseller gömülü) günlüğe yaz"
        required: false
        default: "false"
      wholesale_to:
        description: "TOPTAN TEKLİF: alıcı adres(ler)i — virgül/boşluk/satır ile ayrılabilir, en fazla 60. Doluysa yukarıdaki kampanya işi ÇALIŞMAZ"
        required: false
        default: ""
      wholesale_send:
        description: "TOPTAN TEKLİF: true = GERÇEKTEN gönder. false = sadece hazırla, ek boyutlarını yaz, GÖNDERME"
        required: false
        default: "false"
      ws_record_only:
        description: "true = e-posta GÖNDERME, adresleri sadece 'gönderilenler defteri'ne işle (geçmişi kayda geçirmek için)"
        required: false
        default: "false"
      ws_export_note:
        description: "TOPTAN TEKLİF: true = mektuba 'tedarik ihracat kontrolü ve yaptırım taramasına tabidir' cümlesi eklenir (kısıtlı pazarlar)"
        required: false
        default: "false"
      ws_letter:
        description: "TOPTAN TEKLİF: hangi mektup — petros (Yunanistan) | symax (Japonya, Excel ekli) | norway (kısa, eksiz) | outlets (soğuk tanıtım, eksiz, KR konusuna (광고) eklenir)"
        required: false
        default: "petros"
      # SIPARIS "eksik bilgi" mektubu. Ayri bir is akisi dosyasi olarak yazilmisti ama
      # API ile tetiklenemedi: yeni workflow dosyalari yalnizca varsayilan dalda
      # kayitli oluyor, ozellik dalindan dispatch 404 donuyor. Bu dosya zaten kayitli,
      # o yuzden buraya katildi -- ayni sebeple check-mail-quota da buraya katilmisti.
      order_ref:
        description: "SİPARİŞ MEKTUBU: teklif referansı (ör. O39419). Doluysa YALNIZCA bu iş çalışır, kampanya işi çalışmaz."
        required: false
        default: ""
      order_spec:
        description: "SİPARİŞ MEKTUBU: alan=değer, | ile ayrık. to/colours/missing/send/usd/ship_usd/lead_time/accept"
        required: false
        default: "missing=address,tax_id,incoterm,phone|send=false|usd=ecb|ship_usd=0|lead_time=two weeks|accept=false"
      # FATURA KESME. Ayri bir dosya olarak yazilamaz (yeni is akisi dosyalari ozellik
      # dalindan dispatch edilemiyor, 404), o yuzden buraya katildi -- order_letter ile
      # ayni sebep. Girdiler DAR tutuldu: alan basina bir girdi yazmak bu dosyayi
      # kullanilmaz hale getirirdi, hepsi tek bir 'inv_spec' icinde.
      inv_ref:
        description: "FATURA: teklif referansı (ör. O39419). Doluysa YALNIZCA fatura işi çalışır."
        required: false
        default: ""
      inv_spec:
        description: "FATURA: alan=değer, | ile ayrık. cur/unit/qty/ship/ship_label/colours(Ad:adet)/fx/fx_date/incoterms/export_reason/origin/lead_time"
        required: false
        default: "cur=USD|unit=105.17|qty=20|ship=50|ship_label=Shipping (flat rate)|colours=Black:10,White:10|fx=1.1699|fx_date=21 Aug 2026|lead_time=two weeks|incoterms=DAP Sparks, NV (Incoterms 2020) — import duties, taxes and customs clearance payable by the buyer as importer of record|export_reason=Sale of goods"
      inv_to:
        description: "FATURA: PDF'in gideceği adres. Boş = operatörün test kutusu."
        required: false
        default: ""
      inv_commit:
        description: "FATURA: false (varsayılan) = ÖNİZLEME, hiçbir şey kaydedilmez. true = KALICI numarayla kes, siparişi orders.csv'ye yaz"
        required: false
        default: "false"
      inv_redraft:
        description: "FATURA: true = KESİLMİŞ faturayı AYNI numarayla yeniden bas (henüz müşteriye gitmemiş bir belgeyi düzeltmek için). inv_commit=true ile birlikte."
        required: false
        default: "false"

      sel_to:
        description: "SATICI MEKTUBU: alıcı e-posta. Doluysa YALNIZCA bu iş çalışır."
        required: false
        default: ""
      sel_spec:
        description: "SATICI MEKTUBU: alan=değer, | ile ayrık. name/lang(es|en)/send(true|false)"
        required: false
        default: "lang=es|send=false"

      # Kayitli bir alicinin dogrudan sorusuna birebir cevap mektubu. Metin
      # sablonda (vestra_tpl_*_reply) yasar; kisisel veriler (hitap/VAT) spec ile
      # ya da HESAPTAN gelir, loglara MASKELI yazilir, govde LOGA HIC BASILMAZ
      # (depo ve loglar halka acik; operator mektubu test kutusunda gorur).
      reply_letter:
        description: "ALICI CEVABI: l1212 | l1212_docs | docs_short | docs_women | prospect_women (kayıtsız aday; spec: missing_brand, attach_pdf) | vat_doc_fr | verify_nudge (TOPLU) | resend_verify | approve_account (KYB onayı + 'hesabınız açıldı' maili; spec: waive_doc) | seller_setup (SATICIYA: gönderim yeri + belgeler + Stripe; spec: for=<satıcı>) | offer_preview (karşı teklif mektubunun ÖNİZLEMESİ — hiçbir kayıt değişmez; spec: offer_ref, price) | offer_nudge (AÇIK teklif hatırlatması: sıra alıcıdayken 'alıyor musunuz, yoksa reddedin de diğerleri faturalansın'; spec: offer_ref=&lt;ref&gt;) | brand_catalog (bir markanın TAM listesi: fiyatlar gövdede + PDF/Excel ekte; spec: brand=<marka TAM adı>, cat=<kategori, alt dize>, attach=both|pdf|xlsx|false) | account_open_l1212 (hesabı ZATEN açık olan alıcıya: 'kapı açık, giriş yapın' + ilanın CANLI kademe/renk/artikel verisi + ilk sipariş kuponu; spec: pid=<ilan id, vars. lac-pique-polo>, vat=<VAT ID>, save_vat=true, pct=5, months=6. Kapı KAPALIYSA iş DURUR) | tracking_soon (SİPARİŞ: 'takip numarası birkaç güne girilecek, sabrınız için teşekkürler' cevabı; to=order:<sipariş ref> ŞART, spec: inv=<müşterinin yazdığı fatura no — kayıtla uyuşmazsa DURUR>; signer boş = şirket imzası; sipariş zaten gönderilmişse DURUR) | payment_due (SİPARİŞ: faturası kesilmiş, havale bekleyen siparişe '5 iş günü içinde ödeme gelmezse otomatik iptal' uyarısı — GERÇEKTEN 5 iş günlük SAATİ BAŞLATIR/mektup gönderir aynı fonksiyonla, cron_order_payment.php ile PAYLAŞILAN; to=order:<ref> ŞART, spec: inv=<müşterinin yazdığı fatura no>; sipariş zaten ödenmiş/gönderilmiş/iptal ya da dekont yüklüyse DURUR, escrow siparişinde DURUR; spec: copy_only=true — müşteriye ZATEN giden/gidecek mektubun BİREBİR AYNISINI sadece operatöre yollar, saat DEĞİŞMEZ, müşteriye İKİNCİ mektup GİTMEZ) | escrow_info (hesabı AÇIK alıcıya: giriş + kart escrow tavanı/ücreti KODDAN + fatura yolu; to=account:<isim> ŞART, kapı KAPALIYSA DURUR) | msg_reply (E-POSTA DEĞİL — sitenin İÇ MESAJLAŞMASINA yazar, admin panelinin 'Message Moderation' sekmesindeki 'Reply' ile AYNI fonksiyonu çağırır: normal şartlarda İLANIN SATICISI adına görünür, yalnızca ilanın satıcı yuvası VESTRA Support ise VESTRA Support adına; to= burada KULLANILMAZ, hedef reply_spec içindeki listing=/buyer= ile bulunur)."
        required: false
        default: ""
      reply_spec:
        description: "ALICI CEVABI: alan=değer, | ile ayrık. to(adres YA DA account:<isim-parçası> YA DA order:<sipariş ref> — adres sunucudan, girdiye yazılmaz)/send(true|false)/salutation/vat/signer(varsayılan Marco Bellini)/for(seller_setup: mektubun VERİSİNİ veren satıcı — to farklıysa test demektir). to boş = operatör test kutusu. msg_reply KENDİ alanlarını kullanır (to= YOK): listing=<ilan id>/buyer=<alıcı adında geçen metin, thread'i bulmak için>/body=<mesaj metni>/send(true|false)"
        required: false
        default: "send=false"

permissions:
  contents: read

jobs:
  order_letter:
    if: github.event.inputs.order_ref != ''
    runs-on: ubuntu-latest
    steps:
      - name: Sipariş "eksik bilgi" mektubu
        uses: appleboy/ssh-action@v1.0.3
        env:
          O_REF: ${{ github.event.inputs.order_ref }}
          O_SPEC: ${{ github.event.inputs.order_spec }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: O_REF,O_SPEC
          script: |
            cat > /tmp/vestra_order_details.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/notify.php";
            require_once $doc."/inc/auth.php";

            $ref = trim((string)getenv('O_REF'));
            /* Sekiz ayri girdi yerine tek spec: workflow_dispatch 25 girdiyle sinirli
               ve o siniri bir mektup isi tek basina yiyordu. Ayni kalip inv_spec ve
               sel_spec'te de kullaniliyor -- uc mektup isi, tek okuma bicimi. */
            $spec = [];
            foreach (explode('|', (string)getenv('O_SPEC')) as $pair) {
              if (!str_contains($pair, '=')) continue;
              [$k, $v] = explode('=', $pair, 2);
              $spec[strtolower(trim($k))] = trim($v);
            }
            $E = fn(string $k) => (string)($spec[$k] ?? '');
            $row = null;
            foreach (vestra_read_csv('offers.csv') as $r) if (($r['ref'] ?? '') === $ref) { $row = $r; break; }
            if (!$row) { fwrite(STDERR, "teklif bulunamadi: {$ref}\n"); exit(1); }

            /* Alici hesabi varsa ondan, yoksa teklif satirindan: teklif her zaman bir is
               e-postasi topluyor, yani hesabi olmayan aliciya da yazabiliyoruz. */
            /* Istenirse teklifi KABUL olarak kaydet -- mektuptan ONCE, cunku mektup
               "kabul edildi" diyor. Ters sirada gonderim basarili olup kayit
               yazilamazsa musteri kabul edildigini bilir, sistem bilmez.
               $notify=false: aliciya standart "teklif kabul edildi" bildirimi
               GONDERILMIYOR. Bu mektup ayni haberi zaten veriyor ve ustune eksik
               bilgileri istiyor; ikisi birden gitseydi musteri dakikalar arayla ayni
               haberi iki kez alirdi. Sessiz olan BILDIRIM, kabulun kendisi degil. */
            if (strtolower($E('accept')) === 'true') {
              require_once $doc."/inc/offers.php";
              $resp = vestra_read_json('offer_responses.json');
              if (($resp[$ref]['status'] ?? '') !== '') {
                echo "kabul: zaten '".$resp[$ref]['status']."' (".substr((string)($resp[$ref]['responded_at'] ?? ''),0,19).") -- tekrar kaydedilmedi\n";
              } else {
                $r = vestra_offer_respond($ref, 'accept', 0.0, null, 'VESTRA', false);
                echo $r['ok'] ? "kabul: KAYDEDILDI (aliciya ayrica bildirim gonderilmedi)\n"
                              : "kabul: BASARISIZ -- ".$r['error']."\n";
                if (!$r['ok']) { fwrite(STDERR, "kabul kaydedilemedi, mektup gonderilmiyor\n"); exit(1); }
              }
            }

            $acc = auth_find($row['email'] ?? '');
            $buyerName = trim((string)($row['company'] ?? '')) ?: trim((string)($acc['name'] ?? '')) ?: 'there';
            $missing = array_values(array_filter(array_map('trim', explode(',', $E('missing')))));

            /* USD karsiligi. Kur SUNUCUDAN cekiliyor: ECB'nin gunluk referans kuru,
               ticari yazismada kabul goren ve dogrulanabilir kaynak. Cekilemezse USD
               satiri HIC basilmiyor -- yanlis ya da eski bir kur, hic olmamasindan
               kotudur, ve e-posta yine de gidiyor (kur, gonderimi bloke etmemeli).
               Operator elle bir kur de verebilir: kendi bankasinin uyguladigi kur,
               hesaba gercekte ne gececegini ECB'den daha iyi soyler. */
            $usdRate = 0.0; $rateNote = '';
            $usdIn = strtolower(trim($E('usd')));
            if ($usdIn !== '' && $usdIn !== 'no' && $usdIn !== 'false') {
              if (is_numeric($usdIn)) {
                $usdRate  = (float)$usdIn;
                $rateNote = 'at 1 EUR = '.number_format($usdRate, 4).' USD';
              } else {
                $ch = curl_init('https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml');
                curl_setopt_array($ch, [CURLOPT_RETURNTRANSFER=>true, CURLOPT_TIMEOUT=>15, CURLOPT_FOLLOWLOCATION=>true]);
                $xml = (string)curl_exec($ch);
                $err = curl_error($ch); curl_close($ch);
                if ($xml !== '' && preg_match("/currency=['\"]USD['\"]\s+rate=['\"]([0-9.]+)['\"]/", $xml, $m)) {
                  $usdRate = (float)$m[1];
                  $d = preg_match("/time=['\"]([0-9-]+)['\"]/", $xml, $dm) ? $dm[1] : date('Y-m-d');
                  $rateNote = 'ECB reference rate '.$d.', 1 EUR = '.number_format($usdRate, 4).' USD';
                  echo "kur: ECB {$d} -> 1 EUR = {$usdRate} USD\n";
                } else {
                  echo "UYARI: ECB kuru cekilemedi (".($err ?: 'yanit ayristirilamadi').") -- USD satiri YAZILMIYOR, e-posta yine gidiyor\n";
                }
              }
            }

            /* Urun adi offers.csv'de brand+name birlesik yaziliyor ve bazi katalog
               kayitlarinda marka ADIN icinde de var: ham alan "Balenciaga Balenciaga
               Print T-Shirt" veriyor. Listing'den okuyup ayni tekillestirme kuralini
               uyguluyoruz (faturayla ayni fonksiyon). Listing bulunamazsa ham alan
               kullaniliyor -- eksik ada sahip bir mektup, hic mektup yollamamaktan iyi. */
            $lst = vestra_listing_by_sku((string)($row['sku'] ?? ''));
            $prodLabel = $lst
              ? vestra_product_label((string)($lst['brand'] ?? ''), (string)($lst['name'] ?? ''))
              : (string)($row['product'] ?? '');

            [$subject, $body, $opts] = vestra_tpl_order_details_needed(
              $buyerName, $prodLabel, $ref,
              (int)($row['qty'] ?? 0), (float)($row['offer_unit'] ?? 0), (float)($row['offer_total'] ?? 0),
              trim($E('colours')), $missing, $usdRate, $rateNote,
              (float)$E('ship_usd'), trim($E('lead_time'))
            );

            $to = trim($E('to'));
            if ($to === '') $to = 'acerasoft@gmail.com';
            if (!filter_var($to, FILTER_VALIDATE_EMAIL)) { fwrite(STDERR, "gecersiz alici: {$to}\n"); exit(1); }

            echo "== KONU ==\n{$subject}\n\n== GOVDE ==\n{$body}\n\n";
            echo "alici: {$to}".(strcasecmp($to, (string)($row['email'] ?? '')) === 0 ? "   << GERCEK MUSTERI" : "   (test kutusu)")."\n";

            if (strtolower($E('send')) !== 'true') { echo "\norder_send=false -- GONDERILMEDI\n"; exit(0); }
            $ok = vestra_send_mail($to, $subject, $body, 'support@vestrasales.com', 'VESTRA', null, '', $opts);
            echo $ok ? "\nGONDERILDI -> {$to}\n" : "\nGONDERILEMEDI (vestra_send_mail false dondu)\n";
            exit($ok ? 0 : 1);
            PHPEOF
            cd ~/public_html
            cp /tmp/vestra_order_details.php ./vestra_order_details_tmp.php
            php ./vestra_order_details_tmp.php
            rc=$?
            rm -f ./vestra_order_details_tmp.php /tmp/vestra_order_details.php
            exit $rc

  # Kabul edilmis bir teklif icin faturayi kesip PDF'i e-postayla yollar.
  #
  # Iki kip var ve fark kasitli:
  #   inv_commit=false  -> ONIZLEME. Numara YAKILMAZ, diske hicbir sey yazilmaz,
  #                        PDF /tmp'de uretilip gonderilir ve silinir.
  #   inv_commit=true   -> KALICI. vestra_ensure_invoice($force=true) sirali numarayi
  #                        alir, data/invoices/ altina yazar, orders.csv satiri eklenir.
  #
  # Kalici kipte BANKA SARTI var ve bilerek sert: platform_seller.json'da hesap
  # numarasi (ya da IBAN) yoksa is DURUR. Sebep, numaranin geri alinamamasi --
  # odeme kutusu bos bir fatura kesilirse alici parayi nereye gonderecegini
  # belgeden ogrenemez ve duzeltmenin yolu "dosyayi degistirmek" degil, alacak
  # dekontu + yeni fatura olur. Onizleme bu sarttan muaf: belgeyi gormek icin
  # banka bilgisi gerekmiyor, sadece kesmek icin gerekiyor.
  issue_invoice:
    if: github.event.inputs.inv_ref != ''
    runs-on: ubuntu-latest
    steps:
      - name: Faturayı kes / önizle
        uses: appleboy/ssh-action@v1.0.3
        env:
          I_REF: ${{ github.event.inputs.inv_ref }}
          I_SPEC: ${{ github.event.inputs.inv_spec }}
          I_TO: ${{ github.event.inputs.inv_to }}
          I_COMMIT: ${{ github.event.inputs.inv_commit }}
          I_REDRAFT: ${{ github.event.inputs.inv_redraft }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: I_REF,I_SPEC,I_TO,I_COMMIT,I_REDRAFT
          script: |
            cat > /tmp/vestra_issue_invoice.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/invoice.php";
            require_once $doc."/inc/notify.php";
            require_once $doc."/inc/auth.php";

            $ref    = trim((string)getenv('I_REF'));
            $commit  = strtolower(trim((string)getenv('I_COMMIT'))) === 'true';
            /* Kesilmis bir belgeyi AYNI numarayla yeniden basar. Yalnizca musteriye
               HENUZ GITMEMIS bir belge icin mesru: numara alicinin eline gectikten
               sonra duzeltme, dosyayi sessizce degistirmek degil, alacak dekontu +
               yeni fatura olur. Kararin operatorun oldugu yer burasi. */
            $redraft = strtolower(trim((string)getenv('I_REDRAFT'))) === 'true';

            /* 'a=1|b=2' -> ['a'=>'1','b'=>'2']. Ayirac boru, virgul DEGIL: adres ve
               teslim sarti ("DAP Sparks, NV 89431, USA") virgul iceriyor ve virgulle
               ayirsaydik alan ortasindan bolunurdu. */
            $spec = [];
            foreach (explode('|', (string)getenv('I_SPEC')) as $pair) {
              if (!str_contains($pair, '=')) continue;
              [$k, $v] = explode('=', $pair, 2);
              $spec[strtolower(trim($k))] = trim($v);
            }

            $row = null;
            foreach (vestra_read_csv('offers.csv') as $r) if (($r['ref'] ?? '') === $ref) { $row = $r; break; }
            if (!$row) { fwrite(STDERR, "teklif bulunamadi: {$ref}\n"); exit(1); }

            /* Teklif KABUL edilmis olmali. Kabul edilmemis bir teklife fatura kesmek,
               musterinin onaylamadigi bir tutar icin numara yakmak demek. */
            $resp = vestra_read_json('offer_responses.json');
            $st   = (string)($resp[$ref]['status'] ?? '');
            if ($st !== 'accept') {
              fwrite(STDERR, "teklif KABUL EDILMEMIS (durum: ".($st ?: 'yanit yok').") -- fatura kesilmez\n");
              exit(1);
            }

            $seller = vestra_platform_seller();

            /* Alici bloku HESAPTAN geliyor: teklif satirinda yalnizca sirket adi ve
               e-posta var, faturaya adres ve vergi numarasi gerekiyor. Hesap yoksa
               teklif satirina duselim -- eksik adresli bir fatura, faturasizliktan iyi. */
            $acc = auth_find((string)($row['email'] ?? '')) ?: [];
            $buyer = [
              'company' => (string)($row['company'] ?? ($acc['company'] ?? '')),
              'vat'     => (string)($acc['vat_id'] ?? ''),
              'name'    => (string)($acc['name'] ?? ''),
              'email'   => (string)($row['email'] ?? ''),
              'country' => (string)($acc['country'] ?? ''),
              'address' => (string)($acc['address'] ?? ''),
            ];
            foreach (['company','address','country','vat'] as $k) {
              printf("  alici %-8s %s\n", $k, $buyer[$k] !== '' ? $buyer[$k] : '— EKSIK');
            }

            /* Yalnizca EUR ve USD. Renderer para birimi simgesini
               `$cur === 'USD' ? 'US$' : '€'` diye seciyor, yani "GBP" verilirse belge
               SESSIZCE euro isaretiyle cikardi -- rakamlar dogru, para birimi yanlis.
               Desteklenmeyeni burada durdurmak, yanlis simgeli bir fatura kesmekten iyi. */
            $cur  = strtoupper(trim($spec['cur'] ?? 'EUR'));
            if (!in_array($cur, ['EUR', 'USD'], true)) {
              fwrite(STDERR, "desteklenmeyen para birimi: {$cur} (yalnizca EUR/USD)\n"); exit(1);
            }

            /* Banka durağı PARA BIRIMINE gore. Once "hesap numarasi VAR MI" diye
               bakiyordu; ABD hesabi dolu, fatura EUR olsa "var" deyip gecerdi ve
               belge ABD routing'iyle Avrupa'ya giderdi -- o havale calismaz. Artik
               faturanin kendi para birimine uygun ray var mi diye bakiliyor, tipki
               belgenin bastigi kural gibi (vestra_payment_rails). Tek kural, iki yer. */
            $rails = vestra_payment_rails($seller, $cur);
            echo "satici: ".($seller['company'] ?? '?')."\n";
            echo "odeme rayi ({$cur}): ".($rails ? "VAR (".count($rails)." satir)" : "YOK")."\n";
            if ($commit && !$rails) {
              fwrite(STDERR,
                "\nDURDURULDU: {$cur} icin banka bilgisi yok, kalici fatura kesilmiyor.\n".
                "Fatura numarasi sirali ve geri alinamaz; odeme kutusu bos bir belge\n".
                "kesilirse duzeltmenin yolu alacak dekontu + yeni fatura olur.\n".
                ($cur === 'USD'
                  ? "USD icin gereken: bank_account + bank_routing (ABD hesabi).\n"
                  : "{$cur} icin gereken: bank_iban (+ bank_bic). ABD hesabi bu para biriminde KULLANILMAZ.\n").
                "Once: /admin?tab=orders -> Platform billing, ya da PLATFORM_BANK_JSON gizli anahtari.\n");
              exit(1);
            }

            $qty  = (int)($spec['qty']  ?? (int)($row['qty'] ?? 0));
            $unit = (float)($spec['unit'] ?? (float)($row['offer_unit'] ?? 0));
            $ship = (float)($spec['ship'] ?? 0);
            if ($qty <= 0 || $unit <= 0) { fwrite(STDERR, "adet/birim fiyat gecersiz (qty={$qty} unit={$unit})\n"); exit(1); }

            /* Kur dayanagi. Teklif EUR kabul edildi, fatura USD kesiliyor (odeme ABD
               hesabina gidiyor), o yuzden belge hangi kurla cevrildigini SOYLEMELI.
               Kur ELDEN veriliyor ve varsayilan bu: birim fiyat musteriye o kurla
               teklif edildi. Bugunun kurunu cekseydik belgede birim fiyati URETMEYEN
               bir kur yazardi -- alici 89,90 x kur hesabi yapip tutmayan bir rakam
               bulurdu. Kur verilmezse ECB'den cekiliyor; o da olmazsa satir hic
               yazilmiyor, cunku uydurulmus bir kur olmayan kurdan kotudur. */
            $fxNote = ''; $eurUnit = (float)($row['offer_unit'] ?? 0);
            if ($cur !== 'EUR') {
              $rate = (float)($spec['fx'] ?? 0);
              $rDate = trim((string)($spec['fx_date'] ?? ''));
              if ($rate <= 0) {
                $ch = curl_init('https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml');
                curl_setopt_array($ch, [CURLOPT_RETURNTRANSFER=>true, CURLOPT_TIMEOUT=>15, CURLOPT_FOLLOWLOCATION=>true]);
                $xml = (string)curl_exec($ch); $err = curl_error($ch); curl_close($ch);
                if ($xml !== '' && preg_match("/currency=['\"]".$cur."['\"]\s+rate=['\"]([0-9.]+)['\"]/", $xml, $m)) {
                  $rate  = (float)$m[1];
                  $rDate = preg_match("/time=['\"]([0-9-]+)['\"]/", $xml, $dm) ? $dm[1] : date('Y-m-d');
                  echo "kur: ECB {$rDate} -> 1 EUR = {$rate} {$cur}\n";
                } else {
                  echo "UYARI: ECB kuru cekilemedi (".($err ?: 'ayristirilamadi').") -- kur satiri YAZILMIYOR\n";
                }
              } else {
                echo "kur: elden verildi -> 1 EUR = {$rate} {$cur}".($rDate !== '' ? " ({$rDate})" : '')."\n";
              }
              if ($rate > 0) {
                /* Hesabin KENDISI yaziliyor, yalnizca kur degil: "EUR 89.90 x 1.1699 =
                   US$105.17 per piece". Okuyan carpmayi kendi yapmak zorunda kalmasin --
                   yaparsa ve yuvarlamadan birkac sent sapma cikarsa, faturayi degil
                   kendi hesabini dogru sanar ve soru sorar. */
                $fxNote = $eurUnit > 0
                  ? 'Unit price converted from the offer currency: EUR '.number_format($eurUnit, 2)
                    .' × '.number_format($rate, 4).' = '.($cur === 'USD' ? 'US$' : '€').number_format($unit, 2).' per piece'
                    .($rDate !== '' ? '  (ECB reference rate, '.$rDate.')' : '').'.'
                  : 'Converted from EUR at 1 EUR = '.number_format($rate, 4).' '.$cur
                    . ($rDate !== '' ? ' (ECB reference rate, '.$rDate.')' : '').'.';
                /* Kur birim fiyati GERCEKTEN uretiyor mu? Uretmiyorsa belge kendi
                   icinde celisir: alici 89,90 x 1,1699 yapar, faturadaki rakami
                   bulamaz ve hangisinin gecerli oldugunu sorar. Durdurmuyoruz --
                   operator bilerek baska bir birim yazmis olabilir -- ama sessiz de
                   gecmiyoruz. */
                if ($eurUnit > 0 && abs(round($eurUnit * $rate, 2) - $unit) >= 0.01) {
                  printf("UYARI: %.2f EUR x %.4f = %.2f, faturadaki birim %.2f -- kur notu birim fiyati URETMIYOR\n",
                    $eurUnit, $rate, round($eurUnit * $rate, 2), $unit);
                }
              }
            }

            $lst = vestra_listing_by_sku((string)($row['sku'] ?? ''));
            $order = [
              'ref' => $ref, 'date' => date('c'), 'buyer' => $buyer, 'currency' => $cur,
              'shipping' => $ship,
            ];
            if (($spec['ship_label'] ?? '') !== '')    $order['shipping_label'] = $spec['ship_label'];
            if (($spec['incoterms'] ?? '') !== '')     $order['incoterms']      = $spec['incoterms'];
            if (($spec['origin'] ?? '')    !== '')     $order['origin']         = $spec['origin'];
            if (($spec['export_reason'] ?? '') !== '') $order['export_reason']  = $spec['export_reason'];
            if ($fxNote !== '')                        $order['fx_note']        = $fxNote;

            /* Renk basina AYRI satir: "Black:10,White:10" -> iki kalem. Tek satirda 20
               adet yazip renkleri not olarak eklemek, alicinin hangi renkten kac adet
               aldigini faturadan gorememesi demek -- sevkiyatta dagilim tartisilir.
               Iki nokta yoksa tek kalem + renk notu (eski davranis). */
            $sku   = (string)($lst['sku']   ?? ($row['sku'] ?? ''));
            $brand = (string)($lst['brand'] ?? '');
            $pname = (string)($lst['name']  ?? ($row['product'] ?? ''));
            $colSpec = trim((string)($spec['colours'] ?? ''));
            $items = [];
            if ($colSpec !== '' && str_contains($colSpec, ':')) {
              $sum = 0;
              foreach (explode(',', $colSpec) as $part) {
                [$cName, $cQty] = array_pad(explode(':', $part, 2), 2, '');
                $cName = trim($cName); $cQty = (int)trim($cQty);
                if ($cName === '' || $cQty <= 0) continue;
                $sum += $cQty;
                $items[] = ['sku'=>$sku, 'brand'=>$brand, 'name'=>$pname, 'colors'=>[$cName],
                            'qty'=>$cQty, 'unit'=>$unit, 'line'=>round($cQty * $unit, 2)];
              }
              /* Renk dagilimi toplam adedi tutmali. Tutmazsa fatura ile teklif farkli
                 miktar soyler ve bu ancak alici sayarken ortaya cikar. */
              if ($sum !== $qty) {
                fwrite(STDERR, "renk dagilimi {$sum} adet, qty {$qty} -- tutmuyor\n"); exit(1);
              }
            } else {
              $items[] = ['sku'=>$sku, 'brand'=>$brand, 'name'=>$pname,
                          'colors'=>$colSpec !== '' ? array_map('trim', explode(',', $colSpec)) : [],
                          'qty'=>$qty, 'unit'=>$unit, 'line'=>round($qty * $unit, 2)];
            }
            $goods = round(array_sum(array_column($items, 'line')), 2);
            echo "kalem sayisi: ".count($items)."\n";
            printf("kalem: %d x %.2f = %.2f  + nakliye %.2f  = TOPLAM %.2f %s\n",
              $qty, $unit, $goods, $ship, $goods + $ship, $cur);

            if (!$commit) {
              /* Bu fatura kesilse hangi numarayi alirdi? Sirayi HARCAMADAN bakiyoruz:
                 dosya sadece okunuyor, vestra_next_invoice_no() cagrilmiyor (o artirir).
                 Gerekli, cunku onizleme disinda bu numarayi ogrenmenin yolu yok ve
                 kesmeden once belgenin numarasini bilmek gerekebiliyor. Kesin degil --
                 arada baska bir fatura kesilirse kayar. */
              $seqF = vestra_data_dir().'/invoice_seq.json';
              $seq  = is_readable($seqF) ? json_decode((string)file_get_contents($seqF), true) : [];
              /* Bicim ve kaydirma vestra_next_invoice_no() ile AYNI olmali
                 (%04d, sayac+1000): onizlemenin soyledigi numara, kesimin
                 verecegi numaradan sekilce bile sapmamali. */
              printf("kesilse alacagi numara: INV-%s-%04d  (sira harcanmadi)\n",
                date('Y'), (int)(is_array($seq) ? ($seq['vestra-'.date('Y')] ?? 0) : 0) + 1 + 1000);
              /* Numara YAKILMIYOR. Belgede "DRAFT" yaziyor ki onizleme kazara
                 musteriye gonderilirse fatura yerine gecmesin. */
              $bytes = vestra_render_invoice_pdf($order, $items, $seller, 'DRAFT');
              $path = '/tmp/Invoice-'.preg_replace('/[^A-Za-z0-9_-]/', '', $ref).'-DRAFT.pdf';
              file_put_contents($path, $bytes);
              echo "ONIZLEME: ".strlen($bytes)." bayt, diske KAYDEDILMEDI\n";
            } else {
              $inv = vestra_ensure_invoice($order, $items, $seller, true, $redraft);
              if (!empty($inv['redrafted'])) echo "YENIDEN BASILDI (ayni numara)\n";
              if (($inv['no'] ?? '') === '') { fwrite(STDERR, "fatura kesilemedi\n"); exit(1); }
              $path = $inv['path'];
              echo "KESILDI: {$inv['no']}  ->  {$path}\n";

              /* Siparis satiri. Teklif EUR kabul edildi, fatura USD kesildi: orders.csv'de
                 para birimi sutunu YOK ve alici paneli tutarlari eur() ile basiyor, o yuzden
                 satira teklifin KENDI para birimindeki rakamlari yaziyoruz. Faturadaki USD
                 tutarlar nota acikca yaziliyor -- iki rakam da dogru, hangisinin ne oldugu
                 belgede duruyor. Sutuna uydurma bir cevrim yazmak, panelde sessizce yanlis
                 bir toplam gostermek olurdu. */
              $exists = false;
              foreach (vestra_read_csv('orders.csv') as $o) if (($o['ref'] ?? '') === $ref) { $exists = true; break; }
              if ($exists) {
                echo "orders.csv: {$ref} zaten var -- ikinci satir YAZILMADI\n";
              } else {
                $H = ['timestamp','ref','company','vat','name','email','country','phone','items','subtotal',
                      'commission','payout','total','notes','consent','terms_version','voucher_code','discount'];
                vestra_csv_ensure_header('orders.csv', $H);
                $eurSub  = round($qty * $eurUnit, 2);
                /* vestra_order_notes_colors() "Colours — " ile BASLAYAN kismi ariyor,
                   o yuzden renk notu 'Ad:adet' degil 'Ad, Ad' bicimiyle yaziliyor. */
                $colNote = '';
                foreach ($items as $it) foreach ((array)$it['colors'] as $c) $colNote .= ($colNote === '' ? '' : ', ').$c;
                $notes = 'Payment: Bank transfer. '
                       . ($buyer['address'] !== '' ? 'Deliver to: '.$buyer['address'].'. ' : '')
                       . ($colNote !== '' ? 'Colours — '.$sku.': '.$colNote.'. ' : '')
                       . 'Accepted offer '.$ref.'. Invoiced '.$inv['no'].' in '.$cur.': '
                       . number_format($unit, 2).' x '.$qty.' = '.number_format($goods, 2)
                       . ($ship > 0 ? ' + '.number_format($ship, 2).' shipping' : '')
                       . ' = '.number_format($goods + $ship, 2).' '.$cur.'.'
                       /* $fxNote bazen noktayla biter, bazen bitmez ("...per piece." /
                          "...1.1699 USD"). Kosulsuz nokta eklemek "piece.." uretiyordu. */
                       . ($fxNote !== '' ? ' '.rtrim($fxNote, '.').'.' : '');
                $fh = fopen(vestra_data_dir().'/orders.csv', 'a');
                fputcsv($fh, [date('c'), $ref, $buyer['company'], $buyer['vat'], $buyer['name'], $buyer['email'],
                  $buyer['country'], (string)($acc['phone'] ?? ''),
                  $qty.'x '.$sku.' @'.$eurUnit,
                  $eurSub, 0, $eurSub, $eurSub, $notes, 'yes', VESTRA_TERMS_VERSION, '', ''], ',', '"', '\\');
                fclose($fh);
                echo "orders.csv: {$ref} yazildi (teklifin EUR tutarlari, fatura tutarlari notta)\n";
              }
            }

            $to = trim((string)getenv('I_TO'));
            if ($to === '') $to = 'acerasoft@gmail.com';
            if (!filter_var($to, FILTER_VALIDATE_EMAIL)) { fwrite(STDERR, "gecersiz alici: {$to}\n"); exit(1); }
            $real = strcasecmp($to, (string)($row['email'] ?? '')) === 0;
            echo "alici: {$to}".($real ? "   << GERCEK MUSTERI" : "   (test kutusu)")."\n";

            /* Mektup, aliciya gidecek GERCEK metin -- onizlemede de ayni sablon
               kullaniliyor, cunku test edilmeyen bir mektup test edilmemis demektir.
               Onizlemede basa bir uyari satiri ekleniyor ve konu isaretleniyor ki
               operatorun kutusundaki taslak, gercek bir faturayla karistirilmasin. */
            require_once $doc."/inc/email_templates.php";
            $invNo = $commit ? $inv['no'] : 'DRAFT';
            $colourNote = '';
            foreach ($items as $it) {
              foreach ((array)$it['colors'] as $c) {
                $colourNote .= ($colourNote === '' ? '' : ', ').(int)$it['qty'].' × '.$c;
              }
            }
            [$subject, $body, $mOpts] = vestra_tpl_invoice_issued(
              $buyer['name'] !== '' ? $buyer['name'] : ($buyer['company'] !== '' ? $buyer['company'] : 'there'),
              vestra_product_label($brand, $pname), $ref, $invNo,
              $qty, $colourNote, $goods, $ship, $goods + $ship,
              $cur === 'USD' ? 'US$' : '€',
              (string)($spec['incoterms'] ?? ''), (string)($spec['lead_time'] ?? ''), $fxNote
            );
            if (!$commit) {
              $subject = '[TASLAK] '.$subject;
              $body = "*** TASLAK -- fatura HENUZ KESILMEDI, bu belge gecerli bir fatura DEGILDIR. ***\n\n".$body;
            }
            /* Ek adi: diskteki ad "O39419__vestra.pdf" -- bu ic isleyisin adi, musterinin
               indirme klasorunde gorecegi ad degil. Alicinin panelinde indirdiginde ne
               yaziyorsa e-postada da o yazmali (vestra_invoice_download_name), yoksa ayni
               belge iki farkli isimle dolasir ve bir ihtilafta hangisinin hangisi oldugu
               sorulur. */
            $attName = $commit
              ? vestra_invoice_download_name($ref, (string)($inv['seller_key'] ?? 'vestra'))
              : basename($path);
            $mOpts['attachments'] = [['name' => $attName, 'path' => $path]];
            echo "ek adi: {$attName}\n";

            echo "\n== KONU ==\n{$subject}\n\n== GOVDE ==\n{$body}\n\n";
            $ok = vestra_send_mail($to, $subject, $body,
              'support@vestrasales.com', 'VESTRA', null, '', $mOpts);
            echo $ok ? "PDF GONDERILDI -> {$to}\n" : "GONDERILEMEDI (vestra_send_mail false dondu)\n";
            if (!$commit) @unlink($path);
            exit($ok ? 0 : 1);
            PHPEOF
            cd ~/public_html
            cp /tmp/vestra_issue_invoice.php ./vestra_issue_invoice_tmp.php
            php ./vestra_issue_invoice_tmp.php
            rc=$?
            rm -f ./vestra_issue_invoice_tmp.php /tmp/vestra_issue_invoice.php
            exit $rc

  # Yeni kayit olan bir saticiya gonderilen karsilama/yonlendirme mektubu.
  # Metin sablonda (vestra_tpl_seller_onboarding) yasiyor, burada degil: ayni
  # mektup her yeni saticiya gidecek ve iki yerde iki surum tutmak, birini
  # guncelleyip digerini unutmak demek.
  seller_letter:
    if: github.event.inputs.sel_to != ''
    runs-on: ubuntu-latest
    steps:
      - name: Satıcı karşılama mektubu
        uses: appleboy/ssh-action@v1.0.3
        env:
          S_TO: ${{ github.event.inputs.sel_to }}
          S_SPEC: ${{ github.event.inputs.sel_spec }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: S_TO,S_SPEC
          script: |
            cat > /tmp/vestra_seller_letter.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/notify.php";
            require_once $doc."/inc/auth.php";
            require_once $doc."/inc/email_templates.php";

            $to = trim((string)getenv('S_TO'));
            /* 'a=1|b=2' -> dizi. Ayirac boru: degerler virgul icerebiliyor. */
            $spec = [];
            foreach (explode('|', (string)getenv('S_SPEC')) as $pair) {
              if (!str_contains($pair, '=')) continue;
              [$k, $v] = explode('=', $pair, 2);
              $spec[strtolower(trim($k))] = trim($v);
            }
            $lang = strtolower((string)($spec['lang'] ?? 'es')) ?: 'es';
            if (!filter_var($to, FILTER_VALIDATE_EMAIL)) { fwrite(STDERR, "gecersiz alici\n"); exit(1); }

            /* Hitap: once elle verilen ad, yoksa HESAPTAN. Hesap varsa sirket adi
               zaten dogru yazilmis olur; elle yazmak yazim hatasi riski demek. */
            $acc  = auth_find($to) ?: [];
            $name = trim((string)($spec['name'] ?? ''));
            /* Sirket mi sahis mi: hitap kalibi buna bagli ve TAHMIN EDILMIYOR --
               hesapta company doluysa sirket, degilse sahis. Elle ad verildiginde
               de sirket varsayiliyor (bu platformda satici taraf isletmedir). */
            $isCompany = trim((string)($acc['company'] ?? '')) !== '' || $name !== '';
            if ($name === '') { $name = trim((string)($acc['company'] ?? '')); }
            if ($name === '') { $name = trim((string)($acc['name'] ?? '')); $isCompany = false; }
            if ($name === '') { $name = 'VESTRA'; $isCompany = true; }
            echo "hesap: ".($acc ? "VAR (tip: ".($acc['type'] ?? '?').", durum: ".($acc['status'] ?? '?').")" : "YOK -- kayitsiz adrese yaziliyor")."\n";
            echo "hitap: {$name}\n";
            echo "dil  : {$lang}\n";

            /* Komisyon orani SABIT DEGIL, kaynagindan okunuyor: oran degistiginde
               mektup kendiliginden dogru kalsin. */
            $rate = vestra_seller_commission_rate((string)($acc['membership_tier'] ?? ''));
            echo "hitap turu: ".($isCompany ? 'sirket' : 'sahis')."\n";
            [$subject, $body, $opts] = vestra_tpl_seller_onboarding($lang, $name, $rate, $isCompany);

            echo "\n== KONU ==\n{$subject}\n\n== GOVDE ==\n{$body}\n\n";
            if (strtolower((string)($spec['send'] ?? '')) !== 'true') { echo "send=false -- GONDERILMEDI\n"; exit(0); }
            $ok = vestra_send_mail($to, $subject, $body, 'support@vestrasales.com', 'VESTRA', null, '', $opts);
            echo $ok ? "GONDERILDI\n" : "GONDERILEMEDI (vestra_send_mail false dondu)\n";
            exit($ok ? 0 : 1);
            PHPEOF
            cd ~/public_html
            cp /tmp/vestra_seller_letter.php ./vestra_seller_letter_tmp.php
            php ./vestra_seller_letter_tmp.php
            rc=$?
            rm -f ./vestra_seller_letter_tmp.php /tmp/vestra_seller_letter.php
            exit $rc

  # Kayitli/bilinen bir alicinin sorusuna birebir cevap. Kampanyadan farki:
  # tek alici, kisiye ozel metin. Govde LOGA BASILMAZ ve kimlik alanlari
  # maskelenir — mektubun kendisi zaten once operatorun test kutusuna gidiyor,
  # inceleme orada yapilir. Alici "account:<isim-parcasi>" ile verilirse adres
  # SUNUCUDAKI hesaptan cozulur; musteri e-postasi GitHub'a hic girmez.
  buyer_reply:
    if: github.event.inputs.reply_letter != ''
    runs-on: ubuntu-latest
    steps:
      - name: Alıcı cevap mektubu
        uses: appleboy/ssh-action@v1.0.3
        env:
          R_LETTER: ${{ github.event.inputs.reply_letter }}
          R_SPEC: ${{ github.event.inputs.reply_spec }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: R_LETTER,R_SPEC
          script: |
            cat > /tmp/vestra_buyer_reply.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/notify.php";
            require_once $doc."/inc/auth.php";
            require_once $doc."/inc/stock.php";   /* brand_catalog stok satiri */
            require_once $doc."/inc/email_templates.php";
            require_once $doc."/inc/orders.php";  /* payment_due: grace/business-day helpers */

            $letter = strtolower(trim((string)getenv('R_LETTER')));
            $spec = [];
            foreach (explode('|', (string)getenv('R_SPEC')) as $pair) {
              if (!str_contains($pair, '=')) continue;
              [$k, $v] = explode('=', $pair, 2);
              $spec[strtolower(trim($k))] = trim($v);
            }
            $E = fn(string $k) => (string)($spec[$k] ?? '');
            $mask = fn(string $e) => preg_replace('/^(.).*(@.*)$/', '$1***$2', $e);

            /* ---- TOPLU DAL: letter=verify_nudge ----
               Belge HIC YUKLEMEMIS bekleyen hesaplara "tek eksik: belgen" mektubu.
               'uploaded' olan MEKTUP ALMAZ — o operatorun onayini bekliyor, ona
               "yukle" demek yanlis olur; listede ayrica raporlanir. KURAL 1
               eslesmeleri raporlanir ve gonderilmez (sessiz eleme degil).
               spec: send/test(ornek adresi)/signer(vars. Elena Romano)/redo_days(7). */
            if ($letter === 'verify_nudge') {
              require_once $doc."/inc/security.php"; /* vestra_cc_of_country */
              $signer   = trim($E('signer')) !== '' ? trim($E('signer')) : 'Elena Romano';
              $redoDays = max(1, (int)($E('redo_days') ?: 7));
              $testTo   = trim($E('test'));
              $doSend   = strtolower($E('send')) === 'true';

              $targets = []; $upWait = 0; $pendMail = 0; $noFlag = 0; $recent = 0; $blocked = []; $kybWait = 0; $otherSt = 0;
              foreach (auth_accounts() as $a) {
                $st = (string)($a['status'] ?? '');
                /* 'pending_email' HER ZAMAN engel degil: bu ayara bagli. Dogrulama
                   KAPALIYKEN auth_login boyle bir hesabi giriste 'pending'e cevirip
                   iceri aliyor (auth.php ~406) — yani mektubun tarif ettigi yol
                   (giris yap → Verification → yukle) onun icin de calisiyor.
                   Kosulsuz elemek, eski akista takilmis hesabi sonsuza dek sessiz
                   birakmak olurdu. Ayar ACIKSA gercekten giremez, o zaman elenir. */
                if ($st === 'pending_email') {
                  if (vestra_cfg('require_email_verify', false)) { $pendMail++; continue; }
                  echo "  ESKI AKISTA TAKILMIS (dogrulama artik kapali, giriste acilir): ".$mask((string)($a['email'] ?? ''))."\n";
                  $st = 'pending';
                }
                if ($st !== 'pending' || (string)($a['kyb_status'] ?? 'pending') !== 'pending') continue;
                if (empty($a['trade_doc_required'])) { $noFlag++; continue; }
                $docSt = '';
                foreach ((array)($a['doc_requests'] ?? []) as $r) {
                  if (($r['type'] ?? '') !== 'trade_licence') continue;
                  $s2 = (string)($r['status'] ?? 'requested');
                  if ($s2 === 'approved') { $docSt = 'approved'; break; }
                  if ($s2 === 'uploaded') { $docSt = 'uploaded'; continue; }
                  if ($docSt === '') $docSt = $s2;
                }
                if ($docSt === 'uploaded') { $upWait++; echo "  BELGE YUKLU — ONAY SENDE: ".$mask((string)($a['email'] ?? ''))."  (".($a['type'] ?? '?').")\n"; continue; }
                /* Belge ONAYLI ama hesap hala pending: eksik olan tek sey senin
                   '✓ Approve KYB' tiklaman. Bu satir olmadan boyle bir hesap
                   RAPORDAN SESSIZCE dusuyordu (31 Agu 2026: 1/1 approved bir
                   alici, ilk kuru kosuda hicbir sayida gorunmedi). Musteriye
                   yazacak bir sey yok — is operatorde, o yuzden isimle yaziliyor. */
                if ($docSt === 'approved') { $kybWait++; echo "  BELGE ONAYLI, KYB BEKLIYOR — panelden '✓ Approve KYB': ".$mask((string)($a['email'] ?? ''))."  (".($a['type'] ?? '?').")\n"; continue; }
                if ($docSt !== 'requested') { $otherSt++; echo "  DURUM '{$docSt}' — bu mektup uymaz: ".$mask((string)($a['email'] ?? ''))."\n"; continue; }
                if (vestra_lead_is_blocked(['company'=>(string)($a['company'] ?? ''), 'email'=>(string)($a['email'] ?? ''), 'website'=>(string)($a['website'] ?? '')])) {
                  $blocked[] = $mask((string)($a['email'] ?? '')); continue;
                }
                $ts = strtotime((string)($a['verify_nudge_at'] ?? ''));
                if ($ts && (time() - $ts) < $redoDays * 86400) { $recent++; continue; }
                /* skip=parca,parca — e-posta/isim/sirkette gecen hesabi disarida
                   birak (ör. ayni gun kisisel mektup almis biri). Atlanan MASKELI
                   raporlanir; sessiz eleme yok. */
                $skipHit = false;
                foreach (array_filter(array_map('trim', explode(',', strtolower($E('skip'))))) as $sk) {
                  if (str_contains(strtolower(($a['email'] ?? '').' '.($a['name'] ?? '').' '.($a['company'] ?? '')), $sk)) { $skipHit = true; break; }
                }
                if ($skipHit) { echo "  ATLANDI (skip): ".$mask((string)($a['email'] ?? ''))."\n"; continue; }
                $targets[] = $a;
              }

              $mkLetter = function(array $a) use ($signer) {
                $lang = strtolower(substr((string)($a['lang'] ?? ''), 0, 2));
                if (!in_array($lang, ['en','de','fr','it','es'], true)) $lang = 'en';
                $name = trim((string)($a['company'] ?? '')) ?: trim((string)($a['name'] ?? '')) ?: 'there';
                $localDoc = auth_trade_doc_local_name(vestra_cc_of_country((string)($a['country'] ?? '')));
                return [$lang, vestra_tpl_verify_nudge($lang, $name, ($a['type'] ?? '') === 'buyer' ? false : true, $localDoc, $signer)];
              };

              echo "\nhedef (belge yuklememis — mektup gidecek): ".count($targets)."\n";
              echo "belge yuklu, SENIN onayini bekleyen (haric): {$upWait}\n";
              echo "belge ONAYLI, KYB tiklamasi bekleyen (haric): {$kybWait}\n";
              echo "belgesi reddedilmis/baska durum (haric)    : {$otherSt}\n";
              echo "e-posta dogrulamasi bekleyen (haric)       : {$pendMail}\n";
              echo "eski kayit, bayraksiz — fiyat zaten acik   : {$noFlag}\n";
              echo "son {$redoDays} gunde zaten durtulmus (haric)   : {$recent}\n";
              if ($blocked) { echo "KURAL 1 eslesmesi — GONDERILMEDI, karar operatorde:\n"; foreach ($blocked as $b) echo "  ! {$b}\n"; }
              foreach ($targets as $a) {
                [$lang, ] = $mkLetter($a);
                printf("  -> %-26s %-6s dil=%s ulke=%s\n", $mask((string)($a['email'] ?? '')), (string)($a['type'] ?? '?'), $lang, (string)($a['country'] ?? '—'));
              }

              /* Ornekler: hedeflerdeki HER FARKLI DIL icin o dilin ilk hedefinin
                 mektubu operatorun kutusuna — alicilarin gorecegi metnin aynisi. */
              if ($testTo !== '' && filter_var($testTo, FILTER_VALIDATE_EMAIL)) {
                $seen = [];
                foreach ($targets as $a) {
                  [$lang, $t] = $mkLetter($a);
                  if (isset($seen[$lang])) continue; $seen[$lang] = 1;
                  [$sj, $bd, $op] = $t;
                  $ok = vestra_send_mail($testTo, $sj, $bd, 'support@vestrasales.com', $signer.' — VESTRA', null, '', $op);
                  echo ($ok ? "ORNEK GONDERILDI" : "ORNEK GONDERILEMEDI")." ({$lang}) -> ".$mask($testTo)."\n";
                }
              }

              if (!$doSend) { echo "\nsend=false — hedeflere GONDERILMEDI".($testTo !== '' ? ' (yalnizca ornekler)' : '')."\n"; exit(0); }
              [$qOk, $qMsg] = vestra_mail_bulk_allowed(count($targets), 60);
              echo "kota: {$qMsg}\n";
              if (!$qOk) { fwrite(STDERR, "kota engeli — gonderim iptal\n"); exit(1); }
              $sent = 0; $failN = 0;
              foreach ($targets as $a) {
                [, $t] = $mkLetter($a);
                [$sj, $bd, $op] = $t;
                $ok = vestra_send_mail((string)$a['email'], $sj, $bd, 'support@vestrasales.com', $signer.' — VESTRA', null, '', $op);
                if ($ok) { $sent++; auth_update((string)$a['id'], ['verify_nudge_at' => date('c')]); }
                else { $failN++; }
                echo ($ok ? 'GONDERILDI' : 'HATA')." -> ".$mask((string)$a['email'])."\n";
              }
              printf("\nbitti: %d gonderildi, %d hata\n", $sent, $failN);
              exit($failN > 0 ? 1 : 0);
            }

            /* Alici. "account:<parca>" = adres SUNUCUDAN, hesap adi/sirketiyle
               bulunur — musteri adresi GitHub girdisine yazilmasin diye. Birden
               fazla eslesme guvenli degil: MASKELI adaylar listelenir ve is durur. */
            /* Imzaci: govdedeki imza ile From gorunen adi AYNI kisiden turetilir.
               TUM mektup dallarindan ONCE tanimlanir — approve_account blogu bunu
               kullaniyordu ama tanim asagidaydi: bir hesap acilis mektubu From
               adi BOS ('— VESTRA') gitti ve log "Undefined variable" yazdi. */
            $signer = trim($E('signer')) !== '' ? trim($E('signer')) : 'Marco Bellini';
            /* From gorunen adi. Persona mektuplarinda "Ad — VESTRA"; sirket
               imzasiyla giden siparis mektubu (tracking_soon) bunu 'VESTRA' yapar. */
            $fromName = $signer.' — VESTRA';

            /* Sunucunun KENDI liste ureteclerini KENDI kapsaminda cagirir.
               Duz `require` cagiranin degisken kapsamina yazar ve iki uretec de
               $rows, $brand, $slug kullaniyor -- brand_catalog'un ilk kosusunda
               gorunur sekilde bozdu: urun sayisi 14 yerine 21 (xlsx'in satir
               sayisi) yazildi, dosya adina cift tire dustu. O sefer yalnizca
               sayaci bozdu; bir dahakine $brand ya da $atts olabilirdi.
               Fonksiyon kapsami includeu yalitiyor. */
            $genList = function (string $script, array $get) use ($doc): string {
              $_GET = $get;
              ob_start(); require $doc.'/'.$script; return (string)ob_get_clean();
            };

            $to = trim($E('to'));
            $acc = null;
            if (str_starts_with(strtolower($to), 'account:')) {
              $needle = strtolower(trim(substr($to, 8)));
              if ($needle === '') { fwrite(STDERR, "account: bos\n"); exit(1); }
              $hits = [];
              foreach (auth_accounts() as $a) {
                $hay = strtolower(($a['name'] ?? '').' '.($a['company'] ?? ''));
                if (str_contains($hay, $needle)) $hits[] = $a;
              }
              if (count($hits) !== 1) {
                fwrite(STDERR, "account:{$needle} -> ".count($hits)." eslesme:\n");
                foreach ($hits as $h) fwrite(STDERR, "  ".$mask((string)($h['email'] ?? ''))." (".($h['type'] ?? '?').", ".($h['status'] ?? '?').")\n");
                exit(1);
              }
              $acc = $hits[0];
              $to  = (string)($acc['email'] ?? '');
            }
            /* "order:<ref>" = adres SIPARIS satirindan (orders.csv). Musteri siparis
               ya da fatura numarasiyla yaziyor; adresini GitHub girdisine yazmak,
               onu herkese acik kosu basligina yazmak demek. Satir mektuba veri de
               verir (ref, fatura no, durum) -- tracking_soon bunu sart kosar. */
            $orderRow = null;
            if (str_starts_with(strtolower($to), 'order:')) {
              $oref = strtoupper(trim(substr($to, 6)));
              if ($oref === '') { fwrite(STDERR, "order: bos\n"); exit(1); }
              foreach (vestra_read_csv('orders.csv') as $r) {
                if (strtoupper(trim((string)($r['ref'] ?? ''))) === $oref) { $orderRow = $r; break; }
              }
              if (!$orderRow) { fwrite(STDERR, "siparis bulunamadi: {$oref}\n"); exit(1); }
              $to = trim((string)($orderRow['email'] ?? ''));
              echo "siparis: {$oref}  (".trim((string)($orderRow['company'] ?? ''))."; alici ".$mask($to).")\n";
            }
            if ($to === '') $to = 'acerasoft@gmail.com';
            if (!filter_var($to, FILTER_VALIDATE_EMAIL)) { fwrite(STDERR, "gecersiz alici\n"); exit(1); }
            if (!$acc) $acc = auth_find($to);

            /* Hitap ve VAT: spec > hesap > bos. Unvanli hitap ("Mr.") veriden
               turetilemez, o yuzden spec'ten gelmesi normaldir. */
            $salutation = trim($E('salutation'));
            if ($salutation === '' && $acc && trim((string)($acc['name'] ?? '')) !== '') $salutation = 'Dear '.trim((string)$acc['name']);
            if ($salutation === '') $salutation = 'Dear Sir or Madam';
            $vat = trim($E('vat'));
            if ($vat === '' && $acc) $vat = trim((string)($acc['vat_id'] ?? ''));

            /* HESABI AC: KYB onayi + "hesabiniz acildi" mektubu (+ push).
               Panelin '✓ Approve KYB' dugmesiyle AYNI isi yapar; burada olmasi
               operatorun tek komutla, kaydi kanitlanmis sekilde yapabilmesi icin.
               ONEMLI: yalnizca KYB'yi onaylamak fiyat kapisini ACMAYABILIR —
               auth_prices_unlocked ayrica trade_licence onayina bakiyor. Belge
               onayli degilse is DURUR; operator waive_doc=true ile zorunlulugu
               kaldirabilir ve bu karar hesaba damgalanir (belgeyi "inceledik"
               gibi isaretlemeyiz — olmayan bir incelemeyi kayda gecirmek yalan
               olurdu). Sonunda kapinin GERCEKTEN acildigi geri okunur. */
            /* TOPLU AC: bekleyen butun hesaplar. TEK kosuda yapilir — her hesap
               icin ayri is tetiklemek accounts.json'a paralel yazma demek ve
               biri digerini ezer (leads.json'da yasandi). 'pending_email' HARIC:
               adresini dogrulamamis birinin hesabini acmak, mektup kutusunun
               gercekten onun oldugunu kanitlamadan kapiyi acmak olurdu. */
            if ($letter === 'approve_all') {
              if (!function_exists('vestra_user_lang')) require_once $doc."/inc/i18n.php";
              $targets = []; $skipMail = 0;
              foreach (auth_accounts() as $a) {
                $st = (string)($a['status'] ?? '');
                if ($st === 'suspended' || $st === 'deleted') continue;
                if ($st === 'active' && (string)($a['kyb_status'] ?? '') === 'approved') continue;
                if ($st === 'pending_email') { $skipMail++; echo "  ATLANDI (e-posta dogrulanmamis): ".$mask((string)($a['email'] ?? ''))."\n"; continue; }
                if (trim((string)($a['email'] ?? '')) === '') continue;
                $targets[] = $a;
              }
              echo "acilacak hesap: ".count($targets)."  |  dogrulanmamis (haric): {$skipMail}\n";
              foreach ($targets as $a) {
                printf("  -> %-26s %-6s %s / kyb=%s\n", $mask((string)$a['email']), (string)($a['type'] ?? '?'),
                       (string)($a['status'] ?? '?'), (string)($a['kyb_status'] ?? '?'));
              }
              if (strtolower($E('send')) !== 'true') { echo "\nsend=false — HICBIR SEY degismedi\n"; exit(0); }
              $okN = 0; $failN = 0;
              foreach ($targets as $a) {
                $uid = (string)($a['id'] ?? '');
                $f = ['kyb_status' => 'approved', 'status' => 'active'];
                if (!empty($a['trade_doc_required'])) { $f['trade_doc_required'] = false; $f['trade_doc_waived_at'] = date('c'); }
                auth_update($uid, $f);
                $pnl = (($a['type'] ?? '') === 'seller') ? '/seller' : '/buyer';
                $af  = auth_find((string)$a['email']) ?: $a;
                [$s2, $b2, $o2] = vestra_tpl_kyb_approved(vestra_user_lang($af),
                    ($af['name'] ?? '') ?: (($af['company'] ?? '') ?: 'there'),
                    (string)($af['type'] ?? 'buyer'), 'https://vestrasales.com'.$pnl);
                $m = vestra_send_mail((string)$a['email'], $s2, $b2, 'support@vestrasales.com', $signer.' — VESTRA', null, '', $o2);
                $open = auth_prices_unlocked(auth_find((string)$a['email']));
                if ($m && $open) $okN++; else $failN++;
                echo ($m ? 'MEKTUP OK' : 'MEKTUP HATA')." | kapi: ".($open ? 'ACIK' : 'KAPALI')." -> ".$mask((string)$a['email'])."\n";
              }
              printf("\nbitti: %d acildi, %d sorunlu\n", $okN, $failN);
              exit($failN > 0 ? 1 : 0);
            }

            if ($letter === 'approve_account') {
              if (!$acc) { fwrite(STDERR, "hesap bulunamadi: ".$mask($to)."\n"); exit(1); }
              if (!function_exists('vestra_user_lang')) require_once $doc."/inc/i18n.php";
              $uid = (string)($acc['id'] ?? '');
              $docSt = '';
              foreach ((array)($acc['doc_requests'] ?? []) as $r) {
                if (($r['type'] ?? '') !== 'trade_licence') continue;
                $s2 = (string)($r['status'] ?? 'requested');
                if ($s2 === 'approved') { $docSt = 'approved'; break; }
                if ($s2 === 'uploaded') { $docSt = 'uploaded'; continue; }
                if ($docSt === '') $docSt = $s2;
              }
              $waive = strtolower($E('waive_doc')) === 'true';
              echo "hesap  : ".$mask($to)."  (".($acc['type'] ?? '?').", ".($acc['status'] ?? '?').", kyb=".($acc['kyb_status'] ?? '?').")\n";
              echo "belge  : ".($docSt !== '' ? strtoupper($docSt) : '(talep yok)')."\n";
              echo "belge zorunlulugu: ".(!empty($acc['trade_doc_required']) ? 'VAR' : 'yok')."\n";
              $needWaive = !empty($acc['trade_doc_required']) && $docSt !== 'approved';
              if ($needWaive && !$waive) {
                fwrite(STDERR, "DURDU: ticari belge onayli degil — yalnizca KYB onayi fiyatlari ACMAZ.\n"
                             . "Belgeyi bekleyin, ya da waive_doc=true ile belge zorunlulugunu KALDIRIN.\n");
                exit(1);
              }
              if (strtolower($E('send')) !== 'true') { echo "\nsend=false — HICBIR SEY degismedi\n"; exit(0); }
              $fields = ['kyb_status' => 'approved', 'status' => 'active'];
              if ($needWaive) { $fields['trade_doc_required'] = false; $fields['trade_doc_waived_at'] = date('c'); }
              auth_update($uid, $fields);
              echo "KYB onaylandi, hesap ACTIVE".($needWaive ? " (belge zorunlulugu operator karariyla KALDIRILDI, damgalandi)" : "")."\n";

              $panel = (($acc['type'] ?? '') === 'seller') ? '/seller' : '/buyer';
              $after = auth_find($to) ?: $acc;
              /* mail=open_doc: kisa "hesabiniz acildi + belgeyi yukleyin" metni.
                 Varsayilan, sistemin kendi cok dilli onay mektubu. */
              [$kS, $kB, $kO] = strtolower($E('mail')) === 'open_doc'
                ? vestra_tpl_account_open_doc(
                    trim($E('salutation')) !== '' ? $salutation : 'Hello',
                    $signer)
                : vestra_tpl_kyb_approved(vestra_user_lang($after),
                    ($after['name'] ?? '') ?: (($after['company'] ?? '') ?: 'there'),
                    (string)($after['type'] ?? 'buyer'), 'https://vestrasales.com'.$panel);
              $okMail = vestra_send_mail($to, $kS, $kB, 'support@vestrasales.com', $signer.' — VESTRA', null, '', $kO);
              echo $okMail ? "MEKTUP GONDERILDI ('hesabiniz acildi') -> ".$mask($to)."\n" : "MEKTUP GONDERILEMEDI\n";
              @require_once $doc."/inc/push.php";
              if (function_exists('vestra_push_send')) {
                vestra_push_send($uid, 'VESTRA — account verified ✓', 'Your business is verified. Full wholesale access is unlocked.', $panel);
              }
              /* Kapi GERCEKTEN acildi mi? "Onayladim" demek yetmez; musteri
                 girdiginde hala kilitliyse bunu ondan once biz bilmeliyiz. */
              $chk = auth_find($to);
              $open = auth_prices_unlocked($chk);
              echo "dogrulama: auth_prices_unlocked = ".($open ? 'ACIK' : 'HALA KAPALI')
                 . " | auth_user_approved = ".(auth_user_approved($chk) ? 'evet' : 'hayir')."\n";
              exit($open && $okMail ? 0 : 1);
            }

            /* Kayit dogrulama mektubunu YENIDEN gonder. Ayri mektup, cunku bu
               hesabin sorunu belge degil: dogrulama ACIKKEN (sunucuda oyle)
               auth_login 'unverified' donuyor, yani kullanici panele hic
               giremiyor — ona "belgeni yukle" yazmak giremedigi bir sayfayi
               tarif etmek olurdu. Metin/dil sistemin kendi dogrulama sablonundan
               gelir (auth_resend_verify), burada yeniden yazilmaz. */
            if ($letter === 'resend_verify') {
              echo "alici  : ".$mask($to)."  (durum: ".($acc['status'] ?? 'HESAP YOK').")\n";
              if (strtolower($E('send')) !== 'true') { echo "\nsend=false — GONDERILMEDI\n"; exit(0); }
              $elig = auth_resend_verify($to);
              /* auth_resend_verify UYGUNLUK icin true doner; postanin gercekten
                 gidip gitmedigi hesaba damgalanir. Ikisini ayirmadan "gonderildi"
                 demek, bu depoda iki kez yasanmis "yesil ama bos" tuzagi. */
              $after = auth_find($to);
              $reallySent = !empty($after['verify_sent_ok']);
              if (!$elig) { echo "GONDERILMEDI: hesap yok, zaten dogrulanmis ya da token yok\n"; exit(1); }
              echo $reallySent ? "DOGRULAMA MEKTUBU YENIDEN GONDERILDI -> ".$mask($to)."\n"
                               : "SAGLAYICI REDDETTI — posta gitmedi (verify_sent_ok=false)\n";
              exit($reallySent ? 0 : 1);
            }

            /* SIPARIS: "ne zaman gonderiyorsunuz?" diyen aliciya "takip numarasi
               birkac gune girilecek, sabriniz icin tesekkurler" (operator
               talimati, 2 Eyl 2026, O39419 / INV-2026-1009). Uc kapi:
               - to=order:<ref> SART: mektup siparis kaydindan beslenir, elle
                 yazilmis bir ref/fatura numarasi degil.
               - inv=<musterinin yazdigi fatura no> verilirse kayitla
                 karsilastirilir; tutmuyorsa DURUR -- yanlis siparise "hazirlaniyor"
                 demek hic yazmamaktan kotu.
               - Siparis zaten gonderilmis/tamamlanmis ya da takip numarasi
                 GIRILMISSE durur: "birkac gune" o gun yalan olur. Iptalde de durur.
               Imza: bu alicinin siparis yazismasi sirket blogu ile gitti;
               signer verilirse persona imzalar. */
            /* ODEME HATIRLATMA: faturasi kesilmis, havale bekleyen bir siparise
               (operator, 2 Eyl 2026, order INV-2026-1001 / Daymond vesilesiyle:
               "5 is gunu icinde odeme gelmezse otomatik kapanacagini soyle").
               STANDALONE, elseif zincirine SOKULMADI: zincirdeki mektuplar
               durumsuz -- metin uretip paylasilan kuyruga birakiyorlar, gonderimi
               PAYLASILAN kuyruk yapiyor. Bu mektup ise SAAT BASLATIYOR
               (payment_grace_start) ve saati baslatmakla göndermek AYNI ISLEMDE
               atomik olmali; ikiye bolunseydi (once metin uret, kuyruk gondersin,
               sonra ayri bir yerde damgala) cron_order_payment.php'nin kullandigi
               vestra_order_payment_reminder_send() ile IKI AYRI "saati baslat"
               kopyasi olurdu -- bu depoda ucu bes kez ayni sekilde ayrisan hata.
               Tek gonderici: inc/orders.php. to=order:<ref> SART. */
            if ($letter === 'payment_due') {
              if (!$orderRow) { fwrite(STDERR, "payment_due: to=order:<ref> gerekli (mektup siparis kaydindan beslenir)\n"); exit(1); }
              require_once $doc."/inc/invoice.php";
              $pdRef = trim((string)$orderRow['ref']);
              $pdStAll = vestra_read_json('order_statuses.json');
              $pdStatus = (string)($pdStAll[$pdRef]['status'] ?? 'pending');
              echo "durum  : {$pdStatus}\n";
              if ($pdStatus !== 'pending') { fwrite(STDERR, "siparis zaten '{$pdStatus}' -- odeme hatirlatma mektubu yazilmaz\n"); exit(1); }
              if (vestra_order_in_review($pdRef, $pdStatus)) { fwrite(STDERR, "fatura henuz kesilmemis (inceleme asamasinda) -- odeme hatirlatilamaz\n"); exit(1); }
              if (str_contains((string)($orderRow['notes'] ?? ''), 'Secure escrow')) { fwrite(STDERR, "bu bir escrow (kart) siparisi -- havale hatirlatmasi yazilmaz\n"); exit(1); }
              $pdInvs = vestra_invoices_for_ref($pdRef);
              if (!$pdInvs) { fwrite(STDERR, "fatura bulunamadi: {$pdRef}\n"); exit(1); }
              $pdClaim = strtoupper(trim($E('inv')));
              $pdInvNos = array_map(fn($i) => strtoupper(trim((string)($i['no'] ?? ''))), $pdInvs);
              if ($pdClaim !== '' && !in_array($pdClaim, $pdInvNos, true)) {
                fwrite(STDERR, "fatura uyusmuyor: musteri {$pdClaim} yazdi, kayitta ".implode(', ', $pdInvNos)."\n"); exit(1);
              }
              $pdIv = $pdInvs[0];
              echo "fatura : ".$pdIv['no']."  tutar: ".$pdIv['currency']." ".number_format((float)$pdIv['total'], 2)."\n";
              $pdEntry = $pdStAll[$pdRef] ?? ['status'=>'pending'];
              $pdG = vestra_order_payment_grace($pdEntry, time());
              echo "asama  : {$pdG['phase']}".($pdG['phase']==='has_receipt' ? " (dekont zaten yuklu -- otomatik iptal saati zaten durmus durumda)" : "")."\n";
              /* copy_only=true: musteriye ZATEN gitmis (ya da gitmis olmasi beklenen)
                 mektubun BIREBIR AYNISINI yalnizca operatore yollar -- KURAL 5f'nin
                 fatura kopyasi ilkesiyle ayni: "[KOPYA]" oneki yok, aciklama satiri
                 yok, musterinin gordugu ne ise o. Saat DEGISMEZ, musteriye IKINCI
                 bir mektup GITMEZ -- vestra_order_payment_reminder_send() CAGRILMAZ,
                 sadece ayni sablon ayni GUNCEL veriyle (mevcut son tarih) kurulup
                 operatorun kendi kutusuna gonderilir. */
              if (strtolower($E('copy_only')) === 'true') {
                if (!function_exists('vestra_business_days_after')) require_once $doc."/inc/escrow.php";
                $cpBuyerName = trim((string)($orderRow['name'] ?? '')) ?: trim((string)($orderRow['company'] ?? ''));
                $cpDeadline = $pdG['deadline'] ?? vestra_business_days_after(time(), VESTRA_ORDER_PAYMENT_GRACE_DAYS);
                $cpUploadUrl = 'https://vestrasales.com/buyer?tab=orders&view='.rawurlencode($pdRef);
                [$cpSubj, $cpBody, $cpOpts] = vestra_tpl_order_payment_due(
                  $cpBuyerName, $pdRef, (string)$pdIv['no'], (float)$pdIv['total'], (string)$pdIv['currency'],
                  gmdate('j F Y', (int)$cpDeadline), (bool)$acc, $cpUploadUrl);
                $cpOk = vestra_send_mail('acerasoft@gmail.com', $cpSubj, $cpBody, '', '', null, '', $cpOpts);
                echo $cpOk
                  ? "\nKOPYA operator kutusuna gonderildi -- musteriye TEKRAR gitmedi, saat DEGISMEDI\n"
                  : "\nKOPYA gonderilemedi\n";
                exit($cpOk ? 0 : 1);
              }
              if (strtolower($E('send')) !== 'true') {
                if (!function_exists('vestra_business_days_after')) require_once $doc."/inc/escrow.php";
                $pdPreview = $pdG['deadline'] ?? vestra_business_days_after(time(), VESTRA_ORDER_PAYMENT_GRACE_DAYS);
                echo "onizlenen son tarih: ".gmdate('Y-m-d', (int)$pdPreview)." (send=false, saat HENUZ baslatilmadi)\n";
                echo "\nsend=false — GONDERILMEDI\n"; exit(0);
              }
              $pdR = vestra_order_payment_reminder_send($pdRef, $orderRow, (string)$pdIv['no'], (float)$pdIv['total'], (string)$pdIv['currency']);
              if (!$pdR['ok']) { fwrite(STDERR, "gonderilmedi: ".$pdR['error']."\n"); exit(1); }
              echo "son tarih: ".gmdate('Y-m-d', (int)$pdR['deadline'])."\n";
              echo $pdR['mail_ok'] ? "\nGONDERILDI -> ".$mask($to)."\n" : "\nGONDERILEMEDI (vestra_send_mail false dondu)\n";
              exit($pdR['mail_ok'] ? 0 : 1);
            }

            /* URUN SORUSUNA site-ICI mesajdan cevap (operator, 3 Eyl 2026 -- LuxuryWellNess'in
               jcq-grosgrain-white icin "orijinal mi?" sorusu vesilesiyle): "urun bazinda urun
               yuzde yuz orjinaldir de" + "saticinin hesabindan cikmis gibi yap". BU MEKTUP
               E-POSTA DEGIL: vestra_send_mail'i hic cagirmiyor, admin.php'deki 'Message
               Moderation' sekmesinin 'Reply' dugmesiyle AYNI vestra_msg_send() cagrisini yapiyor
               -- iki yoldan gonderilen mesaj THREAD'de birbirinden ayrisamaz.
               STANDALONE, paylasilan elseif zincirine SOKULMADI: o zincir [$subject,$body,$opts]
               uretip PAYLASILAN kuyrukta vestra_send_mail ile bitiyor (e-posta), bu is farkli bir
               alici (vestra_msg_send, farkli imza) ve farkli bir "basarili" olcutu kullaniyor.

               Hedef elle thread_id ile verilmiyor (admin panelinde bile thread_id gizli, sadece
               formdaki gizli alanda duruyor) -- ilan id'si + alici adinda gecen metinle GERCEK
               thread'ler arasindan bulunuyor. Sifir ya da BIRDEN FAZLA eslesme varsa DURUR:
               yanlis alicinin thread'ine "urun orijinal" yazmak, hic yazmamaktan kotu.

               Imza kimin adina cikiyor: admin.php'deki admin_reply ile AYNI kural (satirlarca
               ayni mantigin ikinci kopyasi olmasin diye burada yeniden yazilmadi, sadece
               tekrarlandi) -- thread'in alici yuvasi VESTRA Support ise VESTRA Support adina,
               aksi halde HER ZAMAN ilanin SATICISI adina (buyer_reply'daki diger mektuplarin
               aksine burada persona/signer YOK -- bu ilanin kendi saticisi konusuyor). */
            if ($letter === 'msg_reply') {
              require_once $doc."/inc/messages.php";
              $mrListing = trim($E('listing'));
              $mrBuyerQ  = trim($E('buyer'));
              $mrBody    = trim($E('body'));
              if ($mrListing === '' || $mrBuyerQ === '' || $mrBody === '') {
                fwrite(STDERR, "msg_reply: listing= ve buyer= ve body= hepsi gerekli\n"); exit(1);
              }
              $mrAccById = [];
              foreach (auth_accounts() as $mrA) $mrAccById[(string)($mrA['id'] ?? '')] = $mrA;
              $mrLabel = function(string $uid) use ($mrAccById): string {
                if ($uid === VESTRA_SUPPORT_UID) return 'VESTRA Support';
                $a2 = $mrAccById[$uid] ?? null;
                return $a2 ? (($a2['company'] ?: ($a2['name'] ?: $uid))) : $uid;
              };
              $mrMatches = [];
              foreach (vestra_msg_threads() as $mrTh) {
                if ((string)($mrTh['listing_id'] ?? '') !== $mrListing) continue;
                if (stripos($mrLabel((string)($mrTh['buyer_uid'] ?? '')), $mrBuyerQ) === false) continue;
                $mrMatches[] = $mrTh;
              }
              if (!$mrMatches) { fwrite(STDERR, "eslesen thread yok: listing={$mrListing} buyer~{$mrBuyerQ}\n"); exit(1); }
              if (count($mrMatches) > 1) {
                fwrite(STDERR, "BIRDEN FAZLA thread eslesti (".count($mrMatches)."), buyer= metnini daraltin:\n");
                foreach ($mrMatches as $m2) fwrite(STDERR, "  - ".$mrLabel((string)($m2['buyer_uid']??'')).' <-> '.$mrLabel((string)($m2['seller_uid']??''))."\n");
                exit(1);
              }
              $mrTh = $mrMatches[0];
              $mrBuyerUid  = (string)($mrTh['buyer_uid'] ?? '');
              $mrSellerUid = (string)($mrTh['seller_uid'] ?? '');
              $mrFrom = ($mrBuyerUid === VESTRA_SUPPORT_UID) ? VESTRA_SUPPORT_UID : $mrSellerUid;
              echo "thread : ".$mrLabel($mrBuyerUid)." <-> ".$mrLabel($mrSellerUid)."  (".count($mrTh['messages']??[])." mesaj, ilan: {$mrListing})\n";
              echo "cevap  : ".$mrLabel($mrFrom)." adina\n";
              echo "metin  : {$mrBody}\n";
              if (strtolower($E('send')) !== 'true') { echo "\nsend=false — GONDERILMEDI\n"; exit(0); }
              $mrRes = vestra_msg_send($mrBuyerUid, $mrSellerUid, $mrFrom, $mrBody, $mrListing);
              if (empty($mrRes['ok'])) { fwrite(STDERR, "GONDERILEMEDI: ".($mrRes['error'] ?? '?')."\n"); exit(1); }
              echo "\nGONDERILDI -- thread'e eklendi.\n";
              exit(0);
            }

            /* HESABI ACIK aliciya: siparis ve odeme nasil isler, kart escrow tavani
               (operator, 2 Eyl 2026: "LESSVAT'a yaz", "escrow 3000'de kalsin").
               Rakamlar sepetin uyguladigi sabitlerden (VESTRA_ESCROW_MAX,
               VESTRA_ESCROW_FEE_BUYER) -- metne yazilmaz. Kapi KAPALIYSA durur:
               "hesabiniz acik" deyip kilitli sayfaya yollamak, hic yazmamaktan kotu
               (KURAL 2b). to=account:<isim> sart -- hesabi olmayan birine
               "hesabiniz acik" denmez. */
            if ($letter === 'escrow_info') {
              if (!$acc) { fwrite(STDERR, "escrow_info: hesap yok (to=account:<isim> verin)\n"); exit(1); }
              $open = auth_prices_unlocked($acc);
              echo "kapi   : auth_prices_unlocked = ".($open ? 'ACIK' : 'KAPALI')."  (".($acc['type'] ?? '?').", ".($acc['status'] ?? '?').", kyb=".($acc['kyb_status'] ?? '?').")\n";
              if (!$open) { fwrite(STDERR, "kapi KAPALI -- 'hesabiniz acik' mektubu gonderilmez. Once approve_account.\n"); exit(1); }
              if (!defined('VESTRA_ESCROW_MAX') || !defined('VESTRA_ESCROW_FEE_BUYER')) { fwrite(STDERR, "escrow sabitleri yuklu degil\n"); exit(1); }
              echo "escrow : tavan EUR ".number_format((float)VESTRA_ESCROW_MAX, 0, '.', ',')."  ucret %".rtrim(rtrim(number_format(VESTRA_ESCROW_FEE_BUYER * 100, 1), '0'), '.')."\n";
              [$subject, $body, $opts] = vestra_tpl_escrow_info($salutation, (float)VESTRA_ESCROW_MAX, (float)VESTRA_ESCROW_FEE_BUYER, $signer);
            } elseif ($letter === 'tracking_soon') {
              if (!$orderRow) { fwrite(STDERR, "tracking_soon: to=order:<ref> gerekli (mektup siparis kaydindan beslenir)\n"); exit(1); }
              require_once $doc."/inc/invoice.php";
              $oref  = trim((string)$orderRow['ref']);
              $stAll = vestra_read_json('order_statuses.json');
              $ost   = (string)($stAll[$oref]['status'] ?? 'pending');
              $otrk  = trim((string)($stAll[$oref]['tracking'] ?? ''));
              $invs  = vestra_invoices_for_ref($oref);
              $invNos = array_values(array_filter(array_map(fn($i) => strtoupper(trim((string)($i['no'] ?? ''))), $invs)));
              echo "durum  : {$ost}  takip: ".($otrk !== '' ? 'VAR' : 'yok')."\n";
              echo "fatura : ".($invNos ? implode(', ', $invNos) : 'YOK')."\n";
              $claim = strtoupper(trim($E('inv')));
              if ($claim !== '' && !in_array($claim, $invNos, true)) {
                fwrite(STDERR, "fatura uyusmuyor: musteri {$claim} yazdi, kayitta ".($invNos ? implode(', ', $invNos) : 'fatura yok')."\n"); exit(1);
              }
              if ($otrk !== '' || in_array($ost, ['shipped','completed'], true)) {
                fwrite(STDERR, "siparis zaten yolda (durum {$ost}".($otrk !== '' ? ', takip girilmis' : '').") -- 'birkac gune' mektubu yanlis olur\n"); exit(1);
              }
              if ($ost === 'cancelled') { fwrite(STDERR, "siparis iptal; mektup gonderilmiyor\n"); exit(1); }
              $buyerName = trim((string)($orderRow['name'] ?? '')) ?: trim((string)($orderRow['company'] ?? ''));
              if (trim($E('salutation')) !== '') $buyerName = preg_replace('/^dear\s+/i', '', trim($E('salutation')));
              $persona = trim($E('signer'));
              [$subject, $body, $opts] = vestra_tpl_order_tracking_soon($buyerName, $oref, $claim !== '' ? $claim : (string)($invNos[0] ?? ''), (bool)$acc, $persona);
              $fromName = $persona !== '' ? $persona.' — VESTRA' : 'VESTRA';
            } elseif ($letter === 'l1212') {
              [$subject, $body, $opts] = vestra_tpl_l1212_reply($salutation, $vat, $signer);
            } elseif ($letter === 'l1212_docs') {
              [$subject, $body, $opts] = vestra_tpl_l1212_docs_needed($salutation, $signer);
            } elseif ($letter === 'docs_short') {
              [$subject, $body, $opts] = vestra_tpl_docs_short($salutation, $signer);
            } elseif ($letter === 'docs_women' || $letter === 'prospect_women') {
              /* Urun listesi CANLI KATALOGDAN; mektup sablonu ad uydurmuyor.
                 Kategori suzgeci alt dize: "Women" uc kadin kategorisini birden
                 alir. Hicbir sey bulunmazsa is DURUR — "asagidaki urunler" deyip
                 bos liste gondermektense hic gondermemek dogru. */
              require_once $doc."/inc/products.php";
              $wItems = [];
              foreach (vestra_products() as $p) {
                if (stripos((string)($p['cat'] ?? ''), 'Women') === false) continue;
                if (vestra_export_price($p) <= 0) continue;
                $wItems[] = [
                  'id'    => (string)($p['id'] ?? ''),
                  'label' => vestra_product_label((string)($p['brand'] ?? ''), (string)($p['name'] ?? '')),
                  'moq'   => (int)($p['moq'] ?? 0),
                ];
              }
              usort($wItems, fn($a, $b) => strnatcasecmp($a['label'], $b['label']));
              if (!$wItems) { fwrite(STDERR, "katalogda kadin urunu bulunamadi — mektup gonderilmedi\n"); exit(1); }
              echo "kadin urunu : ".count($wItems)." adet\n";

              /* EK: yalnizca kadin urunlerini iceren PDF, sunucunun KENDI
                 uretecinden (wholesale-list.php) — mektup icin ayri bir kopya
                 yazmiyoruz, yoksa iki liste zamanla birbirinden ayrisir. */
              $pdfPath = ''; $attach = strtolower($E('attach_pdf')) === 'true';
              if ($attach) {
                $pdfBytes = $genList('wholesale-list.php', ['cat' => 'Women', 'brand' => '']);
                /* Uretilen sey GERCEKTEN PDF mi? Yonlendirme/bos cikti sessizce
                   0 baytlik bir ek olarak giderdi.
                   %PDF imzasi BASTA olmayabilir: dahil edilen betikten once bir
                   uyari/bosluk cikarsa dosya bozulur. Onu sessizce kabul etmek de
                   kirpmadan reddetmek de yanlis — ONCE ne oldugunu YAZIYORUZ,
                   sonra kirpiyoruz; boylece ek saglam gider ama sebep gorunur. */
                $pos = strpos($pdfBytes, '%PDF');
                if ($pos === false || strlen($pdfBytes) - (int)$pos < 2000) {
                  fwrite(STDERR, "PDF uretilemedi (".strlen($pdfBytes)." bayt, imza "
                       . ($pos === false ? 'YOK' : 'konum '.$pos) . ") — mektup gonderilmedi\n");
                  fwrite(STDERR, "ilk 200 bayt: ".addcslashes(substr($pdfBytes, 0, 200), "\0..\37")."\n");
                  exit(1);
                }
                if ($pos > 0) {
                  echo "UYARI: PDF oncesinde {$pos} bayt fazladan cikti vardi, kirpildi -> "
                     . addcslashes(substr($pdfBytes, 0, min($pos, 200)), "\0..\37") . "\n";
                  $pdfBytes = substr($pdfBytes, $pos);
                }
                $pdfPath = '/tmp/VESTRA-womenswear-'.date('Ymd').'.pdf';
                file_put_contents($pdfPath, $pdfBytes);
                echo "ek (PDF)    : ".strlen($pdfBytes)." bayt -> ".basename($pdfPath)."\n";
              }

              /* Ayni veri, iki farkli muhatap: kayitli aliciya BELGE talebi,
                 kayitsiz adaya KAYIT daveti gider. Olmayan bir panele
                 "belgeni yukle" demek adayi bosuna dolastirirdi. */
              [$subject, $body, $opts] = $letter === 'prospect_women'
                ? vestra_tpl_prospect_women($salutation, trim($E('missing_brand')), $wItems, $pdfPath !== '', $signer)
                : vestra_tpl_docs_women($salutation, trim($E('missing_brand')), $wItems, $pdfPath !== '', $signer);
              if ($pdfPath !== '') $opts['attachments'] = [['name' => basename($pdfPath), 'path' => $pdfPath]];
            } elseif ($letter === 'offer_nudge') {
              /* ACIK TEKLIF HATIRLATMASI. spec: offer_ref=O6404A
                 Fiyat, adet, urun ve KABUL BAGLANTISI teklifin GERCEK kaydindan
                 okunuyor -- hicbiri elle verilmiyor. Elle verilen bir fiyat,
                 musterinin hic gormedigi bir rakami ona "sizin teklifiniz" diye
                 geri okumak olurdu. */
              require_once $doc."/inc/offers.php";
              $oref = trim($E('offer_ref'));
              if ($oref === '') { fwrite(STDERR, "offer_nudge: spec'te offer_ref= yok\n"); exit(1); }

              $orow = vestra_offer_row($oref);
              if (!$orow) { fwrite(STDERR, "offer_nudge: {$oref} teklifi bulunamadi\n"); exit(1); }
              $allResp = (array)vestra_read_json('offer_responses.json');
              $resp    = $allResp[$oref] ?? null;

              /* SIRA ALICIDA OLMALI. Degilse hatirlatma yanlis adrese gider:
                 top bizdeyken musteriyi sikistirmis oluruz. */
              $turn = vestra_offer_turn($resp);
              $stat = (string)($resp['status'] ?? '');
              if ($stat !== 'counter' || $turn !== 'buyer') {
                fwrite(STDERR, "offer_nudge: {$oref} durum='{$stat}' sira='{$turn}' -- "
                     . "hatirlatma yalnizca durum=counter ve sira=buyer iken gonderilir.\n");
                exit(1);
              }

              $prodName = trim((string)($orow['product'] ?? ''));
              $qty      = (int)($orow['qty'] ?? 0);
              $cur      = strtoupper(trim((string)($orow['currency'] ?? 'EUR'))) ?: 'EUR';
              $ourP     = vestra_offer_last_price($resp, 'seller', $orow);
              $theirP   = vestra_offer_last_price($resp, 'buyer',  $orow);

              $listing  = null;
              foreach (vestra_products() as $cand) {
                if ((string)($cand['id'] ?? '') === (string)($orow['product_id'] ?? '')) { $listing = $cand; break; }
              }
              $prodUrl  = $listing ? vestra_offer_product_url($listing) : '';

              /* Kabul baglantisi yalnizca GERCEK token varsa yaziliyor. Token
                 her karsi teklifte yenileniyor; yoksa mektup panele yonlendiriyor
                 -- calismayan bir dugmeyi tarif etmektense hic tarif etmemek. */
              $tok = trim((string)($resp['accept_token'] ?? ''));
              $acceptUrl = $tok !== '' ? vestra_offer_accept_url($oref, $tok) : '';

              /* AYNI ALICININ uzlasilmis kalemleri: mektup "digerleri hazir"
                 derken hangileri oldugunu da yazsin. */
              $mail = strtolower(trim((string)($orow['email'] ?? '')));
              $agreed = [];
              foreach (vestra_read_csv('offers.csv') as $o2) {
                if (strtolower(trim((string)($o2['email'] ?? ''))) !== $mail) continue;
                $r2 = (string)($o2['ref'] ?? '');
                if ($r2 === $oref) continue;
                if ((string)(($allResp[$r2]['status'] ?? '')) !== 'accept') continue;
                $agreed[] = ($o2['qty'] ?? '?').' pcs — '.trim((string)($o2['product'] ?? $r2)).'  ('.$r2.')';
              }

              echo "teklif      : {$oref} | ".mb_substr($prodName,0,44)."\n";
              echo "durum/sira  : {$stat} / {$turn}\n";
              echo "adet        : {$qty} | bizim: ".($ourP !== null ? number_format($ourP,2) : '-')
                 . " | onun: ".($theirP !== null ? number_format($theirP,2) : '-')." {$cur}\n";
              echo "kabul linki : ".($acceptUrl !== '' ? 'VAR (token gecerli)' : '*** YOK -> panele yonlendiriliyor ***')."\n";
              echo "urun linki  : ".($prodUrl !== '' ? 'VAR' : '*** ILAN COZULEMEDI ***')."\n";
              echo "uzlasilan   : ".count($agreed)." kalem\n";
              foreach ($agreed as $a) echo "   · ".$a."\n";

              [$subject, $body, $opts] = vestra_tpl_offer_nudge($salutation, $prodName, $qty,
                  $ourP, $theirP, $cur, $agreed, $acceptUrl, $prodUrl, $oref, $signer);
            } elseif ($letter === 'invoice_draft') {
              /* KESILECEK/DUZELTILECEK FATURANIN TASLAGI, operatore.
                 Panelin 📧 Test dugmesiyle AYNI isi yapar (ayni payload, ayni
                 cizim yolu, draft=true) -- fark yalnizca tetikleyici: panel
                 POST'u disaridan cagrilamiyor.
                 spec: ref=<birincil ref> | refs=<virgullu uye listesi> | ship=<EUR>
                 HICBIR SEY KAYDEDILMEZ: numara yanmaz, diske yazilmaz,
                 musteriye gitmez. Belgenin ustunde DRAFT damgasi durur. */
              require_once $doc."/inc/offers.php";
              require_once $doc."/inc/invoice.php";
              $iref = preg_replace('/[^A-Za-z0-9_-]/','',trim($E('ref')));
              if ($iref === '') { fwrite(STDERR, "invoice_draft: spec'te ref= yok\n"); exit(1); }
              $mem = null;
              if (trim($E('refs')) !== '') {
                $mem = array_values(array_filter(array_map('trim', explode(',', $E('refs')))));
              }
              $shp = trim($E('ship')) !== '' ? round(max(0.0,(float)str_replace(',','.',$E('ship'))),2) : null;

              /* apply=true -> GERCEK KESIM: ayni numarayla yeniden yazar,
                 kayitlari gunceller, ALICIYA gonderir ve bu adrese kopya
                 birakir. Panelin '🔁 Redraft & email' dugmesiyle AYNI
                 fonksiyon. Varsayilan false: taslak. */
              if (strtolower(trim($E('apply'))) === 'true') {
                /* notify=false -> belge ve kayitlar duzeltilir, ALICIYA
                   mektup gitmez. Alici dogru PDF'i zaten almisken ikinci bir
                   "faturaniz hazir" mektubu gereksiz soru dogurur. */
                $notify = strtolower(trim($E('notify'))) !== 'false';
                $r = vestra_offer_invoice_redraft_apply($iref, $shp, $mem, $to, $notify);
                if (!empty($r['error'])) { fwrite(STDERR, "invoice_draft(apply): ".$r['error']."\n"); exit(1); }
                echo "KESILDI: fatura ".$r['no']." (ayni numara, yeniden yazildi)\n";
                echo "  uyeler : ".implode(', ', $r['refs'])."\n";
                echo "  satici : ".$r['seller']."\n";
                echo "  toplam : EUR ".number_format((float)$r['total'],2)."\n";
                echo "  aliciya gonderildi : ".(!empty($r['sent']) ? 'EVET' : (empty($r['notified']) ? 'hayir (notify=false, bilerek)' : '*** HAYIR ***'))."\n";
                echo "  operatore kopya    : ".(!empty($r['copied']) ? 'EVET' : 'hayir')."\n";
                /* Mektup ISTENDIGI halde gitmediyse is KIRMIZI biter: belge
                   degisti ama musteri bilmiyor -- sessizce gecilecek en pahali
                   durum. notify=false ise bu bir hata degil, karar. */
                if (!empty($r['notified']) && empty($r['sent'])) { fwrite(STDERR, "UYARI: belge kesildi ama alici mektubu GITMEDI\n"); exit(1); }
                exit(0);
              }

              $p = vestra_offer_invoice_redraft_payload($iref, $shp, $mem);
              if (!empty($p['error'])) { fwrite(STDERR, "invoice_draft: ".$p['error']."\n"); exit(1); }

              $bytes = vestra_render_invoice_pdf($p['meta'], $p['items'], $p['seller'], '', true);
              $tmp = sys_get_temp_dir().'/VESTRA-DRAFT-'.$iref.'.pdf';
              file_put_contents($tmp, $bytes);
              $goods = 0.0; $lines = '';
              foreach ($p['items'] as $it) {
                $goods += (float)$it['line'];
                $lines .= sprintf("  %-16s %4d x EUR %s = EUR %s\n", $it['sku'], (int)$it['qty'],
                          number_format((float)$it['unit'],2), number_format((float)$it['line'],2));
              }
              $sh2 = (float)($p['meta']['shipping'] ?? 0);
              echo "TASLAK: ".count($p['items'])." kalem, uyeler: ".implode(', ', $p['refs'])."\n";
              echo "  mal ".number_format($goods,2)." + kargo ".number_format($sh2,2)
                 ." = ".number_format($goods+$sh2,2)." EUR\n";
              echo "  satici: ".vestra_invoice_issuer_name($p['seller'],'Acerasoft LLC')."\n";
              echo "  pdf: ".strlen($bytes)." bayt\n";
              /* INGILIZCE (operator karari, 1 Eyl 2026): taslak ile kesilen
                 belge arasinda dil farki kalmasin. */
              $subject = "VESTRA — DRAFT invoice {$iref} (test, not sent to the buyer)";
              $body = "Draft of the document to be issued is attached.\n\n".$lines
                    ."\n  Goods total : EUR ".number_format($goods,2)."\n"
                    .($sh2 > 0 ? "  Shipping    : EUR ".number_format($sh2,2)."\n" : '')
                    ."  TOTAL DUE   : EUR ".number_format($goods+$sh2,2)."\n\n"
                    ."This is a DRAFT: no number was burned, nothing was written to disk, nothing went to the buyer.\n\n— VESTRA";
              $opts = ['attachments' => [['name'=>'DRAFT-'.$iref.'.pdf','path'=>$tmp]]];
            } elseif ($letter === 'brand_catalog') {
              /* "Su markanin tam listesini alabilir miyim" sorusuna cevap.
                 spec: brand=<marka, TAM ad> | attach=true|false

                 Marka suzgeci wholesale-list/xlsx ile AYNI kural: strcasecmp,
                 yani TAM eslesme. 'Ralph' yazmak 'Ralph Lauren'i getirmez ve
                 sessizce BOS bir liste uretirdi -- bu yuzden hic urun cikmazsa
                 is DURUYOR, bos mektup gitmiyor. */
              $brand = trim($E('brand'));
              if ($brand === '') { fwrite(STDERR, "brand_catalog: spec'te brand= yok\n"); exit(1); }
              /* Kategori suzgeci ALT DIZE (wholesale-list/xlsx ile ayni kural):
                 cat=Polo hem 'Polos' hem 'Polo Shirts' yakalar. Ayni deger
                 eklere de geciyor, yoksa mektup 'sadece polo' derken ek butun
                 markayi tasir. */
              $catF = trim($E('cat'));

              $rows = [];
              foreach (vestra_products() as $p) {
                if (strcasecmp(trim((string)($p['brand'] ?? '')), $brand) !== 0) continue;
                if (vestra_export_price($p) <= 0) continue;
                if ($catF !== '' && stripos((string)($p['cat'] ?? ''), $catF) === false) continue;
                $rows[] = $p;
              }
              if (!$rows) {
                fwrite(STDERR, "brand_catalog: \"{$brand}\"".($catF !== '' ? " + cat=\"{$catF}\"" : "")
                     . " ile eslesen urun yok. Marka adini TAM yaz (strcasecmp).\n");
                exit(1);
              }

              /* MODEL bazli gruplama. Ayni kategoride ayni fiyattan uc AYRI model
                 olabiliyor: RL polosunda 710548797, 710536856 ve 710782592 var,
                 ucu de 26.90. Yalnizca kategori+fiyata gore gruplayinca ucu tek
                 blokta eriyor ve alici kac model oldugunu goremiyor.

                 Model anahtari = parca numarasinin RENK KODU atilmis hali.
                 Bu bicim markaya gore degisir, o yuzden TAHMIN EDILMIYOR: kural
                 yalnizca kumedeki TUM sku'lar ayni uzunlukta ve tamamen rakamsa
                 uygulaniyor (RL: 12 hane = 9 model + 3 renk). Aksi halde urun
                 adinin renkten onceki parcasina dusuyor ve parca numarasi
                 basilmiyor -- yanlis bir model numarasi basmaktansa hic
                 basmamak dogru (KURAL 3 ile ayni mantik). */
              $skus = array_map(fn($p) => trim((string)($p['sku'] ?? '')), $rows);
              $uniformSku = $skus && count(array_unique(array_map('strlen', $skus))) === 1
                          && strlen($skus[0]) > 3
                          && count(array_filter($skus, fn($s) => ctype_digit($s))) === count($skus);
              $colourLen = 3;
              $styleOf = function (array $p) use ($uniformSku, $colourLen): string {
                $sku = trim((string)($p['sku'] ?? ''));
                return ($uniformSku && $sku !== '') ? substr($sku, 0, -$colourLen) : '';
              };
              /* Ad -> model adi + renk. Ayirici uzun tire; yoksa renk bos kalir
                 ve satirda tam ad yazilir. */
              $splitName = function (string $n): array {
                $parts = preg_split('/\s+\x{2014}\s+/u', $n, 2);
                return [trim($parts[0] ?? $n), trim($parts[1] ?? '')];
              };

              $groups = [];
              foreach ($rows as $p) {
                $price = vestra_export_price($p);
                $moq   = (int)($p['moq'] ?? 0);
                $cat   = (string)($p['cat'] ?? '');
                [$mName, $colour] = $splitName((string)($p['name'] ?? ''));
                $style = $styleOf($p);
                $k = ($style !== '' ? $style : $mName).'|'.number_format($price,2).'|'.$moq;
                if (!isset($groups[$k])) {
                  /* Kademeler SECENEK listesi olarak: MOQ kademesi de dahil.
                     vestra_export_tiers_label() yalnizca MOQ'un USTUNDEKILERI
                     veriyor -- mektupta iki fiyati yan yana gostermek icin ilki
                     de lazim. Kademe yoksa tek secenek: MOQ fiyati. */
                  $tl = [];
                  foreach ((array)($p['tiers'] ?? []) as $t) {
                    $mn = (int)($t['min'] ?? 0); $pr = (float)($t['price'] ?? 0);
                    if ($mn > 0 && $pr > 0) $tl[] = ['min'=>$mn, 'price'=>$pr];
                  }
                  if (!$tl) $tl = [['min'=>$moq, 'price'=>$price]];
                  usort($tl, fn($a,$b) => $a['min'] <=> $b['min']);
                  $groups[$k] = [
                    'cat'=>$cat, 'model'=>$mName, 'art'=>$style, 'scope'=>$catF,
                    'price'=>$price, 'moq'=>$moq,
                    'tiers_list'=>$tl,
                    'stock'=>(int)(vestra_stock_for($p)['total'] ?? 0),
                    'sizes'=>vestra_sizes_label(trim((string)($p['sizes'] ?? ''))),
                    'items'=>[],
                  ];
                }
                /* RENKLER ILANIN KENDI 'colors' ALANINDAN. Ilanlar model bazinda
                   birlestirildikten sonra bir model = BIR ilan; renk artik ayri
                   satir degil, o ilanin icinde bir liste. Eskisi gibi ilan basina
                   tek satir saymak "1 renk" yazdiriyordu -- oysa ilan dort renk
                   tasiyor. Birlestirilmemis ilanda colors (govde,pony) ciftidir,
                   o yuzden coklu renk yalnizca 2'den FAZLA deger varsa liste
                   sayiliyor; degilse addan cozulen renge dusuyor. */
                $cl = array_values(array_filter(array_map('strval', (array)($p['colors'] ?? [])), fn($c) => trim($c) !== ''));
                if (count($cl) > 2) {
                  foreach ($cl as $c) {
                    $groups[$k]['items'][] = [
                      'name'=>(string)($p['name'] ?? ''), 'id'=>(string)($p['id'] ?? ''),
                      'sku'=>'', 'colour'=>$c,
                    ];
                  }
                } else {
                  $groups[$k]['items'][] = [
                    'name'=>(string)($p['name'] ?? ''), 'id'=>(string)($p['id'] ?? ''),
                    'sku'=>trim((string)($p['sku'] ?? '')), 'colour'=>$colour !== '' ? $colour : ($cl[0] ?? ''),
                  ];
                }
              }
              $groups = array_values($groups);
              if (!$uniformSku) {
                echo "NOT: parca numaralari tek bicimde degil -> model numarasi BASILMIYOR, ad'a gore gruplandi\n";
              }

              /* KURAL 3: gonderim yeri TAHMIN EDILMEZ. Butun ilanlarda ayni ve
                 dolu ise yaziyoruz; biri bile bos ya da farkliysa mektupta HIC
                 gecmiyor ve operatore burada raporlaniyor. */
              $shipSet = [];
              foreach ($rows as $p) $shipSet[trim((string)($p['ships_from'] ?? ''))] = true;
              $shipsFrom = (count($shipSet) === 1 && !isset($shipSet[''])) ? array_key_first($shipSet) : '';
              if ($shipsFrom === '') {
                echo "UYARI (KURAL 3): gonderim yeri tekdüze degil/bos -> mektupta YAZILMIYOR. Degerler: "
                   . implode(' , ', array_map(fn($s) => $s === '' ? '(bos)' : $s, array_keys($shipSet))) . "\n";
              }

              /* Ekler: sunucunun KENDI ureteclerinden, mektup icin ayri bir kopya
                 yazmiyoruz (yoksa iki liste zamanla ayrisir). PDF imzasi ve XLSX
                 (PK) imzasi kontrol ediliyor -- bos/yonlendirilmis bir cikti
                 sessizce 0 baytlik ek olarak giderdi. */
              /* attach: both (varsayilan) | pdf | xlsx | false.
                 Hangi bicimlerin GERCEKTEN eklendigi mektuba da geciyor --
                 sablon eki tek tek sayiyor, yoksa yalnizca Excel gonderilen bir
                 mektup "ekte PDF de var" der ve musteri olmayan dosyayi arar. */
              $atts = [];
              $attachOpt = strtolower(trim($E('attach'))) ?: 'both';
              $want = match ($attachOpt) {
                'false', 'none', '0' => [],
                'pdf'                => ['pdf'],
                'xlsx', 'excel'      => ['xlsx'],
                default              => ['pdf', 'xlsx'],
              };
              if ($want) {
                $slug = strtolower(trim(preg_replace('/[^A-Za-z0-9]+/', '-', $brand.($catF !== '' ? '-'.$catF : '')), '-'));
                foreach ([
                  ['wholesale-list.php', '%PDF', 'pdf', 2000],
                  ['wholesale-xlsx.php', "PK\x03\x04", 'xlsx', 800],
                ] as [$script, $sig, $ext, $min]) {
                  if (!in_array($ext, $want, true)) continue;
                  $bytes = $genList($script, ['brand' => $brand] + ($catF !== '' ? ['cat' => $catF] : []));
                  $pos = strpos($bytes, $sig);
                  if ($pos === false || strlen($bytes) - (int)$pos < $min) {
                    fwrite(STDERR, "{$ext} uretilemedi (".strlen($bytes)." bayt, imza "
                         . ($pos === false ? 'YOK' : 'konum '.$pos) . ") -- mektup gonderilmedi\n");
                    fwrite(STDERR, "ilk 400 bayt: ".addcslashes(substr($bytes, 0, 400), "\0..\37")."\n");
                    exit(1);
                  }
                  /* Kirpilan sey NE idi, yaziliyor. Yalnizca bayt sayisini basmak
                     "864 bayt fazlalik vardi" der ama nedenini gizler -- ilk
                     kosuda tam olarak bu oldu. */
                  if ($pos > 0) {
                    echo "UYARI: {$ext} oncesinde {$pos} bayt fazladan cikti vardi, kirpildi:\n"
                       . "  >>> ".addcslashes(substr($bytes, 0, min($pos, 400)), "\0..\37")."\n";
                    $bytes = substr($bytes, $pos);
                  }
                  $name = 'VESTRA-'.$slug.'-wholesale-'.date('Y-m').'.'.$ext;
                  $path = '/tmp/'.$name;
                  file_put_contents($path, $bytes);
                  $atts[] = ['name'=>$name, 'path'=>$path];
                  /* PDF'e KAC FOTOGRAF gomuldugunu SAY. Dosya boyutuna bakip
                     "fotograflar var" demek tahmin olurdu: imageJpeg ayni
                     goruntuyu md5 ile tekillestiriyor ve kutu boyutuna gore
                     yeniden kodlamiyor, yani boyut fotograf sayisiyla dogru
                     orantili degil. XObject tanimlarini saymak dogrudan olcum. */
                  $extra = '';
                  if ($ext === 'pdf') {
                    $extra = '  |  gomulu fotograf: '.preg_match_all('#/Subtype\s*/Image#', $bytes);
                  }
                  echo "ek ({$ext})   : ".strlen($bytes)." bayt -> {$name}{$extra}\n";
                }
              }

              echo "marka       : {$brand}".($catF !== '' ? "  (cat={$catF})" : "")."\n";
              echo "urun        : ".count($rows)." adet, ".count($groups)." MODEL\n";
              foreach ($groups as $g) {
                $tstr = implode(' / ', array_map(fn($t) => $t['min'].'+ '.number_format($t['price'],2), $g['tiers_list']));
                echo "  ".($g['art'] !== '' ? $g['art'] : '(no art)')." | ".$g['model']
                   . " | ".$tstr." | MOQ ".$g['moq']." | stok ".$g['stock']
                   . " | ".count($g['items'])." renk\n";
              }

              /* Sablona BOOL degil, gerceklesen bicimlerin LISTESI gidiyor. */
              $done = array_map(fn($a) => pathinfo($a['name'], PATHINFO_EXTENSION), $atts);
              echo "ekler       : ".($done ? implode(', ', $done) : '(yok)')."\n";
              [$subject, $body, $opts] = vestra_tpl_brand_catalog($salutation, $brand, $groups, $shipsFrom, $done, $signer);
              if ($atts) $opts['attachments'] = $atts;
            } elseif ($letter === 'offer_preview') {
              /* Karsi teklif mektubunun ONIZLEMESI. HICBIR SEY YAZMAZ:
                 teklife yanit verilmez, token uretilmez, kayit degismez --
                 yalnizca gercek sablon + gercek sarmalayici + gercek posta
                 yolundan bir kopya operatore gider. Sebep: mektuptaki
                 ikincil "reddet" baglantisi (button_alt) YENI ve hicbir
                 posta istemcisinde gorulmedi. Operator canli bir musteriye
                 basmadan once nasil gorundugunu gormeli.
                 spec: offer_ref (gercek teklif; bos = ornek veri), price. */
              require_once $doc."/inc/offers.php";
              $oref = trim($E('offer_ref'));
              $row  = $oref !== '' ? vestra_offer_row($oref) : null;
              if ($oref !== '' && !$row) { fwrite(STDERR, "teklif bulunamadi: {$oref}\n"); exit(1); }
              $price = (float)($E('price') !== '' ? $E('price') : 12.00);
              if ($price <= 0) { fwrite(STDERR, "price > 0 olmali\n"); exit(1); }

              $lst = $row ? vestra_listing_by_sku($row['sku'] ?? '') : null;
              $pName = $lst ? trim(($lst['brand'] ?? '').' '.($lst['name'] ?? ''))
                            : trim((string)($row['product'] ?? 'Sample Product'));
              $pUrl  = vestra_offer_product_url($lst);
              $rref  = $row ? (string)$row['ref'] : 'OF-PREVIEW';
              /* Token SAHTE ve kasitli gecersiz: onizleme mektubundaki
                 dugmeye basmak gercek bir teklifi kabul ETMEMELI. */
              $fakeUrl = vestra_offer_accept_url($rref, 'preview-not-a-real-token');

              echo "onizleme  : karsi teklif mektubu (HICBIR KAYIT DEGISMEDI)\n";
              echo "teklif    : ".($row ? $rref : '(ornek veri)')."\n";
              echo "urun      : {$pName}\n";
              echo "urun linki: ".($pUrl !== '' ? 'VAR' : 'YOK (SKU katalogda cozulmedi)')."\n";
              echo "fiyat     : EUR ".number_format($price, 2)."/adet\n";
              [$subject, $body, $opts] = vestra_tpl_offer_response(
                  vestra_user_lang($acc), 'counter',
                  $row ? (($row['company'] ?? '') ?: 'there') : 'there',
                  $pName, $rref, $price, $fakeUrl, $pUrl
              );
              echo "dugme     : ".($opts['button']['label'] ?? '-')."\n";
              echo "alt link  : ".($opts['button_alt']['label'] ?? 'YOK — button_alt uretilmedi!')."\n";
            } elseif ($letter === 'seller_setup') {
              /* Saticiya: gonderim yeri + belgeler + Stripe odeme hesabi.
                 Uc bolumun tamami CANLI VERIDEN cikariliyor, elle yazilmiyor --
                 yuklenmis bir belgeyi ya da doldurulmus bir ilani tekrar
                 istemek, platformun kendi kaydini okumadigini gosterir ve
                 mektubun geri kalanina duyulan guveni de goturur. */
              /* 'for' = mektubun VERISININ geldigi satici; 'to' = mektubun
                 GIDECEGI adres. Ikisi ayri olmali, yoksa operatore test
                 gonderirken mektup operatorun kendi hesabindan uretilir ve
                 test edilen sey gercek mektup olmaz. Bos birakilirsa alicinin
                 kendi hesabi kullanilir (normal durum). */
              $forNeedle = strtolower(trim($E('for')));
              if (str_starts_with($forNeedle, 'account:')) $forNeedle = trim(substr($forNeedle, 8));
              if ($forNeedle !== '') {
                $fh = [];
                foreach (auth_accounts() as $a) {
                  $hay = strtolower(($a['name'] ?? '').' '.($a['company'] ?? '').' '.($a['email'] ?? ''));
                  if (str_contains($hay, $forNeedle)) $fh[] = $a;
                }
                if (count($fh) !== 1) {
                  fwrite(STDERR, "for={$forNeedle} -> ".count($fh)." eslesme\n");
                  foreach ($fh as $h) fwrite(STDERR, "  ".$mask((string)($h['email'] ?? ''))." (".($h['type'] ?? '?').")\n");
                  exit(1);
                }
                $acc = $fh[0];
                echo "NOT: mektup ".$mask((string)($acc['email'] ?? ''))." hesabinin verisinden uretiliyor, "
                   . "alici ".$mask($to)."\n";
              }
              if (!$acc) { fwrite(STDERR, "hesap bulunamadi: ".$mask($to)."\n"); exit(1); }
              if (($acc['type'] ?? '') !== 'seller') {
                fwrite(STDERR, "bu hesap satici degil (".($acc['type'] ?? '?').") — seller_setup yalnizca saticilara\n"); exit(1);
              }
              $uid = (string)($acc['id'] ?? '');
              /* Hitap da SATICIDAN gelmeli: 'to' operatorun test kutusu
                 oldugunda yukarida operatorun adiyla kurulmus olurdu. */
              if (trim($E('salutation')) === '' && trim((string)($acc['name'] ?? '')) !== '') {
                $salutation = 'Dear '.trim((string)$acc['name']);
              }

              /* 1) Gonderim yeri girilmemis ILANLAR. Yalnizca bu saticinin
                    ilanlari; silinmis/reddedilmis olanlar disarida. */
              $missShip = [];
              foreach (vestra_listings() as $p) {
                if ((string)($p['seller_uid'] ?? '') !== $uid) continue;
                if (in_array((string)($p['status'] ?? 'approved'), ['rejected','deleted'], true)) continue;
                if (trim((string)($p['ships_from'] ?? '')) !== '') continue;
                /* Marka adi urun adinin ICINDE geciyorsa tekrar yazma:
                   vestra_product_label yalnizca BASTA arar, o yuzden
                   "Levi's Vintage Levi's 501 Jeans" gibi bir baslik cikiyordu. */
                $pb = trim((string)($p['brand'] ?? '')); $pn = trim((string)($p['name'] ?? ''));
                $missShip[] = ($pb !== '' && stripos($pn, $pb) !== false) ? $pn : vestra_product_label($pb, $pn);
              }

              /* 2) Hala YUKLENMEMIS belgeler. Iki suzgec:
                    - 'uploaded' olan istenmez: o operatorun incelemesini
                      bekliyor, sahibinin yapacagi bir sey kalmadi.
                    - Yalnizca auth_required_doc_types() -- yani ticari kayit
                      ve kimlik. Eski hesaplarda o gunku listeden kalma
                      company_reg/vat_cert/auth_letter satirlari duruyor;
                      artik istenmeyen bir belgeyi mektupla istemek, musteriyi
                      bulamayacagi (ve bizim beklemedigimiz) bir kagidin
                      pesine dusurmek olurdu. */
              if (!function_exists('vestra_doc_type_label')) require_once $doc."/inc/email_templates.php";
              $needTypes = auth_required_doc_types('seller');
              $missDocs = []; $staleDocs = [];
              foreach ((array)($acc['doc_requests'] ?? []) as $r) {
                $ty  = (string)($r['type'] ?? '');
                $st2 = strtolower((string)($r['status'] ?? 'requested'));
                if (in_array($st2, ['uploaded','approved','waived'], true)) continue;
                if (!in_array($ty, $needTypes, true)) { $staleDocs[] = $ty; continue; }
                $missDocs[] = vestra_doc_type_label('en', $ty);
              }

              /* 3) Stripe: hem hesap baglanmis hem tahsilat acik olmali.
                    Yalnizca stripe_account_id'ye bakmak yetmez — yarim kalmis
                    bir onboarding'de o alan dolu ama odeme yine gelmiyor. */
              $needStripe = empty($acc['stripe_account_id']) || empty($acc['escrow_ready']);

              /* $to DEGIL $acc yazilir: 'for' ile test gonderirken bu satir
                 alicinin adresini "satici" diye etiketliyordu. */
              echo "satici : ".$mask((string)($acc['email'] ?? ''))."  (".($acc['status'] ?? '?').", kyb=".($acc['kyb_status'] ?? '?').")\n";
              echo "gonderim yeri eksik ilan : ".count($missShip)."\n";
              foreach ($missShip as $t) echo "   - ".$t."\n";
              echo "istenecek belge          : ".count($missDocs)." (".implode(', ', $missDocs).")\n";
              if ($staleDocs) {
                echo "hesapta duran ESKI istek : ".implode(', ', $staleDocs)
                   . "  — artik istenmiyor, mektuba GIRMEDI (panelden temizle)\n";
              }
              echo "stripe odeme hesabi      : ".($needStripe ? 'EKSIK' : 'hazir')."\n";
              if (!$missShip && !$missDocs && !$needStripe) {
                echo "\nEksik yok — yazilacak bir sey olmadigi icin mektup GONDERILMEDI.\n"; exit(0);
              }
              [$subject, $body, $opts] = vestra_tpl_seller_setup($salutation, $missShip, $missDocs, $needStripe, $signer);
            } elseif ($letter === 'account_open_l1212') {
              /* "Hesabim aktive edilmedi" diyen ama sunucuda ZATEN acik olan
                 aliciya cevap. Once durumu DOGRULA: kapi gercekten acik degilse
                 bu mektup yalan olur ve is DURUR -- musteriye "her sey acik"
                 yazip kilitli bir sayfaya yollamak, hic yazmamaktan kotu.
                 spec: pid(vars. lac-pique-polo)/vat/save_vat/pct(5)/months(6)/send */
              require_once $doc."/inc/vouchers.php";

              if (!$acc) { fwrite(STDERR, "HESAP YOK: {$to} -- bu mektup kayitli hesap gerektirir\n"); exit(1); }
              $uid  = (string)($acc['id'] ?? '');
              $open = auth_prices_unlocked($acc);
              echo "kapi   : auth_prices_unlocked = ".($open ? 'ACIK' : 'KAPALI')
                 . " | auth_user_approved = ".(auth_user_approved($acc) ? 'evet' : 'hayir')."\n";
              if (!$open) {
                fwrite(STDERR, "DURDU: fiyat kapisi KAPALI. Bu mektup 'hesabiniz zaten acik' diyor.\n"
                             . "Once approve_account ile onaylayin, ya da baska mektup secin.\n");
                exit(1);
              }

              $pid = trim($E('pid')) !== '' ? trim($E('pid')) : 'lac-pique-polo';
              $prod = null;
              foreach (vestra_products() as $pp) { if ((string)($pp['id'] ?? '') === $pid) { $prod = $pp; break; } }
              if (!$prod) { fwrite(STDERR, "ILAN BULUNAMADI: {$pid}\n"); exit(1); }
              echo "urun   : {$pid} | kademe=".count((array)($prod['tiers'] ?? []))
                 . " | renk/artikel=".count((array)($prod['variants'] ?? []))."\n";

              /* VAT. Mektup ya TEYIT ya OZUR yazar; hangisi oldugunu KAYIT belirler.
                 auth_update void donuyor, o yuzden yazdiktan sonra GERI OKUNUR --
                 KURAL 5c'nin ayni dersi: kaydetti sanip yazmayan bir islem,
                 musteriye "kaydettim" demeyi yalan yapar. */
              $vatId = ''; $vatNew = false;
              $vatWant = trim($E('vat'));
              $vatHave = trim((string)($acc['vat_id'] ?? ''));
              if ($vatWant !== '' && $vatHave === $vatWant) {
                $vatId = $vatHave; $vatNew = false;
                echo "vat    : ZATEN KAYITLI -> mektupta teyit cumlesi (ozur DEGIL)\n";
              } elseif ($vatWant !== '' && strtolower($E('save_vat')) === 'true') {
                if (strtolower($E('send')) !== 'true') {
                  $vatId = $vatWant; $vatNew = true;
                  echo "vat    : send=false -- YAZILMADI, mektupta onizleme olarak gorunuyor\n";
                } else {
                  auth_update($uid, ['vat_id' => $vatWant]);
                  $back = auth_find($to);
                  if (trim((string)($back['vat_id'] ?? '')) === $vatWant) {
                    $vatId = $vatWant; $vatNew = true;
                    echo "vat    : KAYDEDILDI ve geri okundu\n";
                  } else {
                    fwrite(STDERR, "VAT YAZILAMADI (geri okuma tutmadi) -- mektup gonderilmedi\n"); exit(1);
                  }
                }
              } elseif ($vatHave !== '') {
                $vatId = $vatHave; $vatNew = false;
                echo "vat    : hesapta kayitli -> teyit cumlesi\n";
              } else {
                echo "vat    : ne spec'te ne hesapta -> bolum basilmayacak\n";
              }

              /* Yalnizca 'requested' (hic yuklenmemis) icin belge bolumu yazilir.
                 'uploaded' olan onay bekliyor -- ona "yukleyin" demek, yaptigi isi
                 tekrar yaptirmak olurdu (auth_trade_doc_status'un varlik sebebi). */
              $docSt   = function_exists('auth_trade_doc_status') ? auth_trade_doc_status($acc) : '';
              $docOpen = ($docSt === 'requested');
              echo "belge  : ".($docSt !== '' ? $docSt : '(istek yok)')
                 . " -> bolum ".($docOpen ? 'BASILACAK' : 'basilmayacak')."\n";

              /* Kupon. voucher_welcome_run ile AYNI campaign adi kullaniliyor ki
                 sonraki toplu hos geldin kosusu bu hesaba IKINCI bir kod
                 gondermesin (o kosu campaign+email tutanlari atliyor). */
              $pct      = (float)($E('pct') !== '' ? $E('pct') : 5);
              $months   = max(1, (int)($E('months') !== '' ? $E('months') : 6));
              $campaign = 'welcome'.rtrim(rtrim(number_format($pct, 2, '.', ''), '0'), '.');
              $expiry   = date('Y-m-d', strtotime("+{$months} months"));
              $valueLbl = rtrim(rtrim(number_format($pct, 2, '.', ''), '0'), '.').'%';

              $code = ''; $reused = false;
              foreach (voucher_all() as $vc => $vv) {
                if ((string)($vv['campaign'] ?? '') !== $campaign) continue;
                if (strtolower(trim((string)($vv['email'] ?? ''))) !== strtolower($to)) continue;
                $code = (string)$vc; $reused = true;
                $expiry = (string)($vv['expiry'] ?? $expiry);
                break;
              }
              if ($code === '') {
                if (strtolower($E('send')) !== 'true') {
                  $code = '(kod gonderimde uretilecek)';
                } else {
                  /* Onizleme HICBIR SEY yazmaz (KURAL 5d'nin ayni mantigi): kod
                     yalnizca gercekten gonderirken yakilir. */
                  $code = (string)voucher_create([
                    'type' => 'percent', 'value' => $pct, 'email' => $to,
                    'first_order_only' => true, 'max_uses' => 1,
                    'expiry' => $expiry, 'campaign' => $campaign,
                  ])['code'];
                }
              }
              echo "kupon  : ".$valueLbl." | ".($reused ? 'MEVCUT kod yeniden kullanildi' : 'yeni')
                 . " | son gecerlilik ".$expiry."\n";

              [$subject, $body, $opts] = vestra_tpl_account_open_l1212(
                $salutation, $prod, $vatId, $vatNew, $docOpen,
                ['code' => $code, 'label' => $valueLbl, 'expiry' => date('d.m.Y', strtotime($expiry))],
                $signer);

              /* Kod uretildiyse gonderim BASARILI olunca damgala -- damgasiz kod
                 sonraki kosuda yeniden kullanilir, musteri iki kod almaz. */
              $stampCode = (!$reused && strtolower($E('send')) === 'true') ? $code : '';
              if ($stampCode !== '') {
                register_shutdown_function(function () use ($stampCode) {
                  $all = voucher_all();
                  if (isset($all[$stampCode]) && empty($all[$stampCode]['mailed_at'])) {
                    /* Yalnizca gonderim basariliysa: $GLOBALS bayragi asagida set edilir. */
                    if (!empty($GLOBALS['VESTRA_MAIL_OK'])) { $all[$stampCode]['mailed_at'] = date('c'); voucher_save($all); }
                  }
                });
              }
            } elseif ($letter === 'authenticity_sample') {
              /* "Yeni sirketsiniz, AB'de kayitli degilsiniz, sahte mal riski"
                 sorusuna cevap. Rakam ve link CANLI ilandan; satici ulkesi
                 ilanin seller_uid'inden HESAP kaydindan okunuyor. Ikisi de elle
                 yazilmiyor: bu mektup orijinallikten supheli birine gidiyor ve
                 icindeki her sayi kontrol edilecek.
                 spec: pid(vars. lac-l1212-musterstueck) */
              $pid = trim($E('pid')) !== '' ? trim($E('pid')) : 'lac-l1212-musterstueck';
              $prod = null;
              foreach (vestra_products() as $pp) { if ((string)($pp['id'] ?? '') === $pid) { $prod = $pp; break; } }
              if (!$prod) { fwrite(STDERR, "ILAN BULUNAMADI: {$pid}\n"); exit(1); }

              /* Satici ulkesi KAYITTAN. Bulunamazsa BOS gecilir ve sablon o
                 cumleyi hic yazmaz -- "Fransa" diye elle yazmak, dogrulamadigim
                 bir seyi supheli bir aliciya beyan etmek olurdu. */
              require_once $doc."/inc/security.php";   /* vestra_country_of_cc */
              $sellerCc = ''; $sellerVat = ''; $sellerAcc = null;
              $suid = (string)($prod['seller_uid'] ?? '');
              if ($suid !== '') {
                foreach (auth_accounts() as $sa) {
                  if ((string)($sa['id'] ?? '') !== $suid) continue;
                  $sellerAcc = $sa;
                  $sellerCc  = trim((string)($sa['country'] ?? ''));
                  $sellerVat = trim((string)($sa['vat_id'] ?? ''));
                  break;
                }
              }
              /* ESCROW GERCEKTEN ACIK MI. 'stripe_account_id var' ile
                 escrow_seller_ready() AYNI SEY DEGIL: ilki hesabin baglandigini,
                 ikincisi onboarding'in bitip tahsilatin acildigini soyluyor.
                 Bu depoda alti kez kontrol yanlis alana bakti; escrow'u
                 dogrulamadan vaat etmek, olmayan bir korumayi satmak olurdu.
                 Kapali cikarsa sablon o paragrafi HIC yazmiyor. */
              require_once $doc."/inc/escrow.php";
              $escrowOk = ($sellerAcc && function_exists('escrow_seller_ready'))
                        ? escrow_seller_ready($sellerAcc) : false;
              /* Hesapta ulke bazen ISO kodu olarak duruyor ('FR'). Mektupta
                 "registered in FR" yazmak kotu duruyor -- kodu tam ada cevir.
                 Cozulemezse kod oldugu gibi kalir; uydurmuyoruz. */
              if (function_exists('vestra_country_of_cc')) $sellerCc = vestra_country_of_cc($sellerCc);
              $unit = 0.0;
              foreach ((array)($prod['tiers'] ?? []) as $t) { $unit = (float)($t['price'] ?? 0); break; }
              echo "urun   : {$pid} | fiyat=".number_format($unit, 2)." EUR | MOQ=".(int)($prod['moq'] ?? 0)."\n";
              echo "satici : ".((string)($prod['seller'] ?? '?'))." | kayitli ulke="
                 . ($sellerCc !== '' ? $sellerCc : '(BOS -> o cumle yazilmayacak)')
                 . " | vat=".($sellerVat !== '' ? substr($sellerVat, 0, 4).'***' : '(BOS)')."\n";
              echo "escrow : ".($escrowOk ? 'HAZIR -> paragraf YAZILACAK'
                                          : 'HAZIR DEGIL -> paragraf YAZILMAYACAK')."\n";

              [$subject, $body, $opts] = vestra_tpl_authenticity_sample(
                $salutation, $prod, $sellerCc, $sellerVat, $escrowOk, $signer);
            } elseif ($letter === 'vat_doc_fr') {
              /* Varsayilan hitap 'Bonjour': hesaptaki ad ile e-postadaki ad
                 ayrisiyor ve yanlis soyadla hitap etmek, hitapsiz yazmaktan
                 kotudur. Operator isterse salutation ile ezer. */
              [$subject, $body, $opts] = vestra_tpl_vat_doc_fr(trim($E('salutation')) !== '' ? $salutation : 'Bonjour', $signer);
            } else {
              fwrite(STDERR, "bilinmeyen mektup: {$letter}\n"); exit(1);
            }

            /* Halka acik log: govde YOK, kimlik MASKELI. Inceleme test kutusunda. */
            echo "mektup : {$letter}\n";
            echo "alici  : ".$mask($to).($acc ? "  (hesap: ".($acc['type'] ?? '?').", ".($acc['status'] ?? '?').")" : "  (hesap yok)")."\n";
            echo "hitap  : ".mb_substr($salutation, 0, 9)."***\n";
            echo "vat    : ".($vat !== '' ? substr($vat, 0, 4).'***'.substr($vat, -2) : '— yok, cumle parantezsiz')."\n";
            echo "konu   : {$subject}\n";
            echo "govde  : ".mb_strlen($body)." karakter\n";

            echo "imza   : {$fromName}\n";
            if (strtolower($E('send')) !== 'true') { echo "\nsend=false — GONDERILMEDI\n"; exit(0); }
            $ok = vestra_send_mail($to, $subject, $body, 'support@vestrasales.com', $fromName, null, '', $opts);
            /* Kupon damgasi (account_open_l1212) bu bayragi okur: gonderim
               basarisizsa kod damgalanmaz ve sonraki kosu AYNI kodu yeniden
               kullanir -- musteri iki farkli kod almaz, kimse kodsuz kalmaz. */
            $GLOBALS['VESTRA_MAIL_OK'] = $ok;
            echo $ok ? "\nGONDERILDI -> ".$mask($to)."\n" : "\nGONDERILEMEDI (vestra_send_mail false dondu)\n";
            exit($ok ? 0 : 1);
            PHPEOF
            cd ~/public_html
            cp /tmp/vestra_buyer_reply.php ./vestra_buyer_reply_tmp.php
            php ./vestra_buyer_reply_tmp.php
            rc=$?
            rm -f ./vestra_buyer_reply_tmp.php /tmp/vestra_buyer_reply.php
            exit $rc

  send:
    # Kampanya isi VARSAYILAN dal: hicbir sey verilmezse o calisir. Yeni bir is
    # eklerken buraya da yazilmali, yoksa "sadece fatura kesecektim" derken
    # kampanya e-postasi da gider. set-mail-key'de tam bu hata yasandi.
    if: github.event.inputs.wholesale_to == '' && github.event.inputs.order_ref == '' && github.event.inputs.inv_ref == '' && github.event.inputs.sel_to == '' && github.event.inputs.reply_letter == ''
    runs-on: ubuntu-latest
    steps:
      - name: Kampanya önizlemesini gönder / render et
        uses: appleboy/ssh-action@v1.0.3
        env:
          CAMP_TO: ${{ github.event.inputs.to }}
          CAMP_VARIANT: ${{ github.event.inputs.variant }}
          CAMP_RENDER_ONLY: ${{ github.event.inputs.render_only }}
          CAMP_LANG: ${{ github.event.inputs.lang }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 4m
          envs: CAMP_TO,CAMP_VARIANT,CAMP_RENDER_ONLY,CAMP_LANG
          script: |
            TO="$CAMP_TO"
            case "$TO" in *@*) ;; *) TO="acerasoft@gmail.com" ;; esac
            VARIANT="$CAMP_VARIANT"
            # Beyaz liste: tanimadigi varyanti sessizce "premium"a cevirir. Guvenli
            # varsayilan ama YENI BIR VARYANT EKLERKEN BURASI DA GUNCELLENMELI --
            # 'pool' eklenip bu satir unutuldugunda onizleme havuz bolumu olmadan
            # gitti ve log "varyant: premium" yazdigi icin ancak log okunarak fark
            # edildi.
            case "$VARIANT" in polos_promo|voucher|pool) ;; *) VARIANT="premium" ;; esac
            LANG_IN="$CAMP_LANG"
            case "$LANG_IN" in de|en|fr|it|es) ;; *) LANG_IN="de" ;; esac
            RENDER_ONLY="$CAMP_RENDER_ONLY"
            cat > /tmp/vestra_camp_preview.php <<'PHPEOF'
            <?php
            $home = getenv("HOME");
            require $home."/public_html/inc/notify.php";
            require $home."/public_html/inc/products.php";
            $to = $argv[1] ?? 'acerasoft@gmail.com';
            $variant = $argv[2] ?? 'premium';
            $renderOnly = strtolower(trim((string)($argv[3] ?? ''))) === 'true';
            /* voucher: hos geldin kuponunun TEK adrese onizlemesi. Bu is sozlesmesi geregi
               tek alici -- toplu gonderim welcome-voucher.yml'in isi, o da varsayilan dalda
               olmadigi icin su an tetiklenemiyor. Buradaki kod ORNEKTIR, gercek bir kupon
               yazilmaz: amac gorunumu onaylamak, kullanilabilir kod uretmek degil. */
            if ($variant === 'voucher') {
              /* email_templates.php'yi BURADA cekmiyoruz: notify.php zaten require_once ile
                 aliyor. Duz `require` ile ikinci kez cekmek "Cannot redeclare" ile olumcul
                 hata veriyordu -- display_errors kapali oldugu icin de sessizce. */
              $lang = $argv[4] ?? 'de';
              list($subject, $body, $opts) = vestra_tpl_welcome_voucher(
                $lang, 'Boutique Meyer GmbH', 'VES-ORNEK-KOD', '5%', date('d.m.Y', strtotime('+6 months')));
            } else {
              /* 'pool' varyanti = normal premium kampanya + ACIK HAVUZLAR bolumu.
                 Ayri bir sablon degil, ayni mektubun havuz eklentili hali -- yani
                 onizlemede gordugunuz sey, gercekten gonderilecek olanin aynisi. */
              list($subject, $body, $opts) = $variant === 'polos_promo'
                ? vestra_campaign_promo_polos()
                : vestra_campaign_preview('', 'en', '', $variant === 'pool');
            }
            echo "varyant: {$variant}\n";

            if ($renderOnly) {
              /* Gorselleri (site ile ayni sunucuda oldugundan) diskten okuyup base64 data URI'ye
                 ceviriyoruz -- boylece cikan HTML disari hicbir istek atmadan, tek basina acilabilir.
                 GH Actions log capture has a practical size ceiling (~1MB total base64): the
                 catalog's uploaded product photos run well past that as-is, so anything over the
                 small-file budget gets GD-downscaled to a small JPEG instead of skipped outright --
                 the preview should still show a real photo, just not full-resolution. */
              $inlineBudget = 40 * 1024;
              $inline = function(string $src) use ($home, $inlineBudget): string {
                $rel = preg_replace('#^https?://[^/]+#', '', $src);
                $file = $home.'/public_html'.$rel;
                if (!is_file($file)) return $src;
                if (filesize($file) <= $inlineBudget) {
                  $bytes = @file_get_contents($file);
                  if ($bytes === false) return $src;
                  $ext = strtolower(pathinfo($file, PATHINFO_EXTENSION));
                  $mime = ['avif'=>'image/avif','png'=>'image/png','webp'=>'image/webp','jpg'=>'image/jpeg','jpeg'=>'image/jpeg'][$ext] ?? 'image/jpeg';
                  return 'data:'.$mime.';base64,'.base64_encode($bytes);
                }
                if (!function_exists('imagecreatefromstring')) return $src;
                $raw = @file_get_contents($file);
                if ($raw === false) return $src;
                $im = @imagecreatefromstring($raw);
                if (!$im) return $src;
                $w = imagesx($im); $h = imagesy($im);
                $newW = min(360, $w); $newH = max(1, (int)round($h * $newW / max(1,$w)));
                $small = imagecreatetruecolor($newW, $newH);
                imagecopyresampled($small, $im, 0,0,0,0, $newW,$newH, $w,$h);
                ob_start(); imagejpeg($small, null, 62); $jpg = ob_get_clean();
                imagedestroy($im); imagedestroy($small);
                return $jpg !== false ? 'data:image/jpeg;base64,'.base64_encode($jpg) : $src;
              };
              if (!empty($opts['shots']) && is_array($opts['shots'])) {
                foreach ($opts['shots'] as $i => $s) {
                  if (!empty($s['img'])) $opts['shots'][$i]['img'] = $inline((string)$s['img']);
                }
              }
              $html = vestra_html_email($body, '', $opts);
              $html = str_replace('https://vestrasales.com/icon-192.png', $inline('https://vestrasales.com/icon-192.png'), $html);
              echo "HTML_BYTES: ".strlen($html)."\n";
              echo "SUBJECT: {$subject}\n";
              echo "===B64_START===\n";
              echo chunk_split(base64_encode($html), 200, "\n");
              echo "===B64_END===\n";
              exit(0);
            }

            if (!filter_var($to, FILTER_VALIDATE_EMAIL)) { echo "GECERSIZ ALICI\n"; exit(1); }
            $ok = vestra_send_mail($to, $subject, $body, '', 'Les Garage de Paris', null, '', $opts);
            echo $ok ? "GONDERILDI -> {$to}\n" : "HATA: gonderim basarisiz\n";
            PHPEOF
            php -l /tmp/vestra_camp_preview.php
            # Cikis kodu ONCE yakalanip sonra donduruluyor. Eskiden `php ...; rm -f ...` idi:
            # rm'in kodu php'ninkini eziyordu, boylece bir PHP fatal'i adimi YESIL birakiyordu
            # -- bir onizleme "gonderildi" gorunup hic gitmedi.
            php /tmp/vestra_camp_preview.php "$TO" "$VARIANT" "$RENDER_ONLY" "$LANG_IN"; RC=$?
            rm -f /tmp/vestra_camp_preview.php
            exit $RC

  wholesale:
    if: github.event.inputs.wholesale_to != ''
    runs-on: ubuntu-latest
    steps:
      - name: Toptan teklifi hazırla ve gönder
        uses: appleboy/ssh-action@v1.0.3
        env:
          WS_TO: ${{ github.event.inputs.wholesale_to }}
          WS_SEND: ${{ github.event.inputs.wholesale_send }}
          WS_LETTER: ${{ github.event.inputs.ws_letter }}
          WS_EXPORT_NOTE: ${{ github.event.inputs.ws_export_note }}
          WS_RECORD_ONLY: ${{ github.event.inputs.ws_record_only }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 15m
          envs: WS_TO,WS_SEND,WS_LETTER,WS_EXPORT_NOTE,WS_RECORD_ONLY
          script: |
            cat > /tmp/vestra_ws.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            register_shutdown_function(function(){
              $e=error_get_last();
              if($e && in_array($e['type'],[E_ERROR,E_PARSE,E_CORE_ERROR,E_COMPILE_ERROR],true))
                fwrite(STDERR,"PHP OLUMCUL: {$e['message']} ({$e['file']}:{$e['line']})\n");
            });
            $home=getenv("HOME");
            require $home."/public_html/inc/products.php";

            /* Birden fazla alici: virgul, bosluk ya da satir sonu ile ayrilir. Tek adres
               yazmak eskisi gibi calisiyor. Ayni mektup 29 adrese gidecekse bunu 29 kez
               elle tetiklemek hem zaman kaybi hem de birinin atlanmasi demek. */
            $rawTo = (string)getenv("WS_TO");
            $recips = array_values(array_unique(array_filter(array_map(
              fn($s)=>strtolower(trim($s)),
              preg_split('~[\s,;]+~', $rawTo) ?: []
            ))));
            $send = strtolower(trim((string)getenv("WS_SEND"))) === 'true';
            /* Kisitli pazarlar. E-posta gondermek ihracat degildir -- yasak malin fiili
               sevkinde isler. Ama teklifi kayitsiz sartsiz birakmak, siparis geldiginde
               "siz teklif ettiniz" cumlesine zemin hazirlar. Bu cumle, kalem kalem bakma
               hakkini bastan sakli tutuyor; gercek ihracatcilarin standart ifadesidir. */
            $exportNote = strtolower(trim((string)getenv("WS_EXPORT_NOTE"))) === 'true';
            /* Hangi mektup. Bilinmeyen bir deger sessizce Petros'a dusmemeli: yanlis
               ulkeye yanlis odeme sartlarini yollamak, hic gondermemekten kotu. */
            $letter = strtolower(trim((string)getenv("WS_LETTER"))); if($letter==='') $letter='petros';
            if(!in_array($letter,['petros','symax','norway','outlets'],true)){
              fwrite(STDERR,"HATA: bilinmeyen mektup: {$letter} (petros | symax | norway | outlets)\n"); exit(1);
            }
            /* Gecersiz adresler once ayiklaniyor, gonderim sirasinda degil: yarim kalmis
               bir kampanya "kime gitti kime gitmedi" sorusunu cevapsiz birakir. */
            $bad = array_values(array_filter($recips, fn($e)=>!filter_var($e,FILTER_VALIDATE_EMAIL)));
            $recips = array_values(array_filter($recips, fn($e)=>filter_var($e,FILTER_VALIDATE_EMAIL)));
            foreach($bad as $b) fwrite(STDERR,"UYARI: gecersiz adres atlandi: {$b}\n");
            if(!$recips){ fwrite(STDERR,"HATA: gecerli alici yok.\n"); exit(1); }
            /* MARKA SAHIPLERI, ZINCIRLER VE DISTRIBUTORLER -- her zaman engelli.
               Grey-market kaynakli markali malin toptan teklifini, o markanin KENDISINE
               ya da yetkili distributorune yollamak en kotu tur temastir: cevap gelmez,
               marka hukuk birimine giden bir dosya acilir. Buyuk zincirler de markalarla
               secici dagitim sozlesmesi altindadir, ayni sonucu dogurur.

               Liste bilerek ALAN ADI PARCASI uzerinden calisiyor: 'ralphlauren' tek basina
               .com/.es/.co.uk hepsini yakalar. Yeni bir marka ya da distributor cikarsa
               buraya bir kelime eklemek yeterli.

               AVM isletmecileri (Simon, Vicinity, McArthurGlen, Mitsui, Value Retail)
               bu listede DEGIL: onlar kiraci yerlestiren ev sahibi, marka ya da zincir
               degil -- zaten hedef kitlenin kendisi. */
            $blockTokens = [
              /* katalogdaki evler */
              'balenciaga','balmain','burberry','casablancaparis','dolcegabbana','dsquared2',
              'fendi','fredperry','gcds','givenchy','gucci','jacquemus','lacoste',
              'marceloburlon','countyofmilan','ralphlauren','valentino','versace',
              /* diger marka sahipleri */
              'elisabettafranchi','stoneisland','armani','prada','moncler','hugoboss',
              'calvinklein','tommy.com','pvh.com','kering','lvmh','ferragamo','bottegaveneta',
              'saintlaurent','celine','loewe','maxmara','diesel','stellamccartney','offwhite',
              'debeers','cartier','tiffany','swarovski','rolex','swatchgroup',
              /* TEK MARKA satan magazalar. Kendi markasini satan bir magaza bizden
                 baska marka almaz -- ve teklifimiz onun icin rakip malin teklifidir.
                 Adresten otomatik anlasilmiyor; her liste elle bakilip buraya isleniyor,
                 boylece ayni isim bir daha karsimiza cikarsa kendiliginden dusuyor. */
              'migato','marasil','glou.gr','tsakirismallas','nak.gr','elisabettafranchi',
              'dale.no','norlender','sandnesgarn','brynje',
              'cortana.es','isla-ibiza','charoruiz','johnstonsofelgin',
              /* zincirler */
              /* ABD merkezli ve cok uluslu BUYUK isletmeciler. Operator kurali net:
                 ABD'ye hicbir kosulda, buyuklere hicbir yerde. McArthurGlen'in cogunlugu
                 Simon Property Group'a (ABD) ait, VIA Outlets pan-Avrupa bir fon ortakligi
                 -- ikisi de her iki olcute birden giriyor. Bolgesel ve bagimsiz merkezler
                 (FoxTown, Landquart, Aubonne) listede DEGIL: hedef kitle onlar. */
              'simon.com','tangeroutlets','mcarthurglen','viaoutlets',
              /* DISTRIBUTORLER ve marka temsilcileri -- kesinlikle gonderilmez. Bir
                 distributor bizim teklifimizi temsil ettigi markaya iletir; kazanc yok,
                 risk var. Asagidakiler bu kural netlesmeden once bir kez yazildi, bir
                 daha yazilmayacak. */
              'ali-bin-ali','brandsvision','bigbrands.ae','brands-international',
              'ros-management','gilbertluxurybrands','luxuryprgroup','bflgroup',
