               standarttir, tuhaf durmaz; koymamak para cezasi konusudur. Sadece Kore
               alan adlarina giden kopyalara ekleniyor. */
            $krDomains=['lotte.net','shinsegaesimon.com','hyundai.com','ehyundai.com',
                        'lotteshopping.com','shinsegae.com','ssg.com'];
            $subjFor=function(string $addr) use ($subject,$krDomains):string{
              $dom=strtolower(substr(strrchr($addr,'@') ?: '',1));
              return in_array($dom,$krDomains,true) ? '(광고) '.$subject : $subject;
            };

