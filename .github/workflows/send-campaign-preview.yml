              else   { $failed[]=$r; printf("  HATA        %s\n",$r); }
              /* Saglayiciyi bir anda 29 istekle dovmemek icin kucuk bir ara. */
              if(count($recips)>1) usleep(400000);
            }
            printf("\ntoplam %d adres: %d gonderildi, %d hata  (%d ek)\n",
                   count($recips),$sent,count($failed),count($atts));
            foreach($failed as $f) fwrite(STDERR,"gonderilemedi: {$f}\n");
            exit($sent>0 ? 0 : 1);
