             .'<p style="color:#8a8272;font-size:12px">If you would rather not hear from us again, '
             .'reply with the word <em>unsubscribe</em> and I will remove this address.</p>';

            $subject='VESTRA — European branded stock, wholesale from '.$nBrand.' houses';
