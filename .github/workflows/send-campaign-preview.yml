               Odeme AB ici / AB disi diye ikiye ayriliyor. Escrow AB icin; disarida tek
               yol pesin banka havalesi -- kart/PayPal yok, escrow yok. */
            $g=function(string $label,string $text) use ($B):string{
              return '<p>'.$B($label).' '.$text.'</p>';
            };
            /* Katalog mektuplarina. Kisa isleyis mektubuna DEGIL: on maddelik bir sartlar
               listesi onu bir kampanyaya cevirir ve sonundaki tek soruyu gomer -- ustelik
