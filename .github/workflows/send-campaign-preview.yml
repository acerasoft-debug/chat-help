name: Örnek kampanya önizleme gönder (test)

# Elle tetiklenir. Sunucudaki vestra_campaign_preview() builder'ını kullanarak
# premium kampanya e-postasını TEK bir alıcıya (varsayılan: operatörün kendi test
# kutusu acerasoft@gmail.com) gönderir. Gönderen görünen adı "Les Garage de Paris",
# gerçek gönderen adresi doğrulanmış support@vestrasales.com kalır.
# Kampanya içeriği/estetiği inc/notify.php içindeki builder'da yaşar; burada değişmez.
on:
  workflow_dispatch:
    inputs:
      to:
        description: "Alıcı e-posta (boş bırakılırsa acerasoft@gmail.com)"
        required: false
        default: "acerasoft@gmail.com"
      variant:
        description: "premium (genel) | pool (premium + açık havuzlar bölümü) | polos_promo (Lacoste polo, EN) | voucher (hoş geldin kuponu — TEK adrese önizleme)"
        required: false
        default: "premium"
      lang:
        description: "voucher önizlemesi hangi dilde: de | en | fr | it | es"
        required: false
        default: "de"
      render_only:
        description: "true = e-posta GÖNDERME, sadece nihai HTML'i (görseller gömülü) günlüğe yaz"
        required: false
        default: "false"
      wholesale_to:
        description: "TOPTAN TEKLİF: alıcı adres(ler)i — virgül/boşluk/satır ile ayrılabilir, en fazla 60. Doluysa yukarıdaki kampanya işi ÇALIŞMAZ"
        required: false
        default: ""
      wholesale_send:
        description: "TOPTAN TEKLİF: true = GERÇEKTEN gönder. false = sadece hazırla, ek boyutlarını yaz, GÖNDERME"
        required: false
        default: "false"
      ws_record_only:
        description: "true = e-posta GÖNDERME, adresleri sadece 'gönderilenler defteri'ne işle (geçmişi kayda geçirmek için)"
        required: false
        default: "false"
      ws_export_note:
        description: "TOPTAN TEKLİF: true = mektuba 'tedarik ihracat kontrolü ve yaptırım taramasına tabidir' cümlesi eklenir (kısıtlı pazarlar)"
        required: false
        default: "false"
      ws_letter:
        description: "TOPTAN TEKLİF: hangi mektup — petros (Yunanistan) | symax (Japonya, Excel ekli) | norway (kısa, eksiz) | outlets (soğuk tanıtım, eksiz, KR konusuna (광고) eklenir)"
        required: false
        default: "petros"
      # SIPARIS "eksik bilgi" mektubu. Ayri bir is akisi dosyasi olarak yazilmisti ama
      # API ile tetiklenemedi: yeni workflow dosyalari yalnizca varsayilan dalda
      # kayitli oluyor, ozellik dalindan dispatch 404 donuyor. Bu dosya zaten kayitli,
      # o yuzden buraya katildi -- ayni sebeple check-mail-quota da buraya katilmisti.
      order_ref:
        description: "SİPARİŞ MEKTUBU: teklif referansı (ör. O39419). Doluysa YALNIZCA bu iş çalışır, kampanya işi çalışmaz."
        required: false
        default: ""
      order_to:
        description: "SİPARİŞ MEKTUBU: alıcı. Boş = operatörün test kutusu. Gerçek müşteriye gitmesi için adresini AÇIKÇA yazın."
        required: false
        default: ""
      order_colours:
        description: "SİPARİŞ MEKTUBU: renk dağılımı notu (ör. '10 x Black, 10 x White')"
        required: false
        default: ""
      order_missing:
        description: "SİPARİŞ MEKTUBU: istenecek maddeler — address,tax_id,incoterm,phone"
        required: false
        default: "address,tax_id,incoterm,phone"
      order_send:
        description: "SİPARİŞ MEKTUBU: true = GERÇEKTEN gönder. false (varsayılan) = sadece konu+gövdeyi yaz, GÖNDERME"
        required: false
        default: "false"
      order_usd:
        description: "SİPARİŞ MEKTUBU: USD karşılığı yazılsın mı — 'ecb' (ECB günlük referans kuru, önerilen) | boş (yazma) | elle bir kur (ör. 1.0850)"
        required: false
        default: "ecb"
      order_ship_usd:
        description: "SİPARİŞ MEKTUBU: gönderim ücreti (USD). 0/boş = nakliye satırı yazılmaz."
        required: false
        default: "0"
      order_lead_time:
        description: "SİPARİŞ MEKTUBU: ortalama teslim süresi (ör. 'approximately two weeks'). Boş = sevkiyat paragrafı yazılmaz."
        required: false
        default: "approximately two weeks"

permissions:
  contents: read

jobs:
  order_letter:
    if: github.event.inputs.order_ref != ''
    runs-on: ubuntu-latest
    steps:
      - name: Sipariş "eksik bilgi" mektubu
        uses: appleboy/ssh-action@v1.0.3
        env:
          O_REF: ${{ github.event.inputs.order_ref }}
          O_TO: ${{ github.event.inputs.order_to }}
          O_COLOURS: ${{ github.event.inputs.order_colours }}
          O_MISSING: ${{ github.event.inputs.order_missing }}
          O_SEND: ${{ github.event.inputs.order_send }}
          O_USD: ${{ github.event.inputs.order_usd }}
          O_SHIP: ${{ github.event.inputs.order_ship_usd }}
          O_LEAD: ${{ github.event.inputs.order_lead_time }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: O_REF,O_TO,O_COLOURS,O_MISSING,O_SEND,O_USD,O_SHIP,O_LEAD
          script: |
            cat > /tmp/vestra_order_details.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/notify.php";
            require_once $doc."/inc/auth.php";

            $ref = trim((string)getenv('O_REF'));
            $row = null;
            foreach (vestra_read_csv('offers.csv') as $r) if (($r['ref'] ?? '') === $ref) { $row = $r; break; }
            if (!$row) { fwrite(STDERR, "teklif bulunamadi: {$ref}\n"); exit(1); }

            /* Alici hesabi varsa ondan, yoksa teklif satirindan: teklif her zaman bir is
               e-postasi topluyor, yani hesabi olmayan aliciya da yazabiliyoruz. */
            $acc = auth_find($row['email'] ?? '');
            $buyerName = trim((string)($row['company'] ?? '')) ?: trim((string)($acc['name'] ?? '')) ?: 'there';
            $missing = array_values(array_filter(array_map('trim', explode(',', (string)getenv('O_MISSING')))));

            /* USD karsiligi. Kur SUNUCUDAN cekiliyor: ECB'nin gunluk referans kuru,
               ticari yazismada kabul goren ve dogrulanabilir kaynak. Cekilemezse USD
               satiri HIC basilmiyor -- yanlis ya da eski bir kur, hic olmamasindan
               kotudur, ve e-posta yine de gidiyor (kur, gonderimi bloke etmemeli).
               Operator elle bir kur de verebilir: kendi bankasinin uyguladigi kur,
               hesaba gercekte ne gececegini ECB'den daha iyi soyler. */
            $usdRate = 0.0; $rateNote = '';
            $usdIn = strtolower(trim((string)getenv('O_USD')));
            if ($usdIn !== '' && $usdIn !== 'no' && $usdIn !== 'false') {
              if (is_numeric($usdIn)) {
                $usdRate  = (float)$usdIn;
                $rateNote = 'at 1 EUR = '.number_format($usdRate, 4).' USD';
              } else {
                $ch = curl_init('https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml');
                curl_setopt_array($ch, [CURLOPT_RETURNTRANSFER=>true, CURLOPT_TIMEOUT=>15, CURLOPT_FOLLOWLOCATION=>true]);
                $xml = (string)curl_exec($ch);
                $err = curl_error($ch); curl_close($ch);
                if ($xml !== '' && preg_match("/currency=['\"]USD['\"]\s+rate=['\"]([0-9.]+)['\"]/", $xml, $m)) {
                  $usdRate = (float)$m[1];
                  $d = preg_match("/time=['\"]([0-9-]+)['\"]/", $xml, $dm) ? $dm[1] : date('Y-m-d');
                  $rateNote = 'ECB reference rate '.$d.', 1 EUR = '.number_format($usdRate, 4).' USD';
                  echo "kur: ECB {$d} -> 1 EUR = {$usdRate} USD\n";
                } else {
                  echo "UYARI: ECB kuru cekilemedi (".($err ?: 'yanit ayristirilamadi').") -- USD satiri YAZILMIYOR, e-posta yine gidiyor\n";
                }
              }
            }

            [$subject, $body, $opts] = vestra_tpl_order_details_needed(
              $buyerName, (string)($row['product'] ?? ''), $ref,
              (int)($row['qty'] ?? 0), (float)($row['offer_unit'] ?? 0), (float)($row['offer_total'] ?? 0),
              trim((string)getenv('O_COLOURS')), $missing, $usdRate, $rateNote,
              (float)getenv('O_SHIP'), trim((string)getenv('O_LEAD'))
            );

            $to = trim((string)getenv('O_TO'));
            if ($to === '') $to = 'acerasoft@gmail.com';
            if (!filter_var($to, FILTER_VALIDATE_EMAIL)) { fwrite(STDERR, "gecersiz alici: {$to}\n"); exit(1); }

            echo "== KONU ==\n{$subject}\n\n== GOVDE ==\n{$body}\n\n";
            echo "alici: {$to}".(strcasecmp($to, (string)($row['email'] ?? '')) === 0 ? "   << GERCEK MUSTERI" : "   (test kutusu)")."\n";

            if (strtolower((string)getenv('O_SEND')) !== 'true') { echo "\norder_send=false -- GONDERILMEDI\n"; exit(0); }
            $ok = vestra_send_mail($to, $subject, $body, 'support@vestrasales.com', 'VESTRA', null, '', $opts);
            echo $ok ? "\nGONDERILDI -> {$to}\n" : "\nGONDERILEMEDI (vestra_send_mail false dondu)\n";
            exit($ok ? 0 : 1);
            PHPEOF
            cd ~/public_html
            cp /tmp/vestra_order_details.php ./vestra_order_details_tmp.php
            php ./vestra_order_details_tmp.php
            rc=$?
            rm -f ./vestra_order_details_tmp.php /tmp/vestra_order_details.php
            exit $rc

  send:
    if: github.event.inputs.wholesale_to == '' && github.event.inputs.order_ref == ''
    runs-on: ubuntu-latest
    steps:
      - name: Kampanya önizlemesini gönder / render et
        uses: appleboy/ssh-action@v1.0.3
        env:
          CAMP_TO: ${{ github.event.inputs.to }}
          CAMP_VARIANT: ${{ github.event.inputs.variant }}
          CAMP_RENDER_ONLY: ${{ github.event.inputs.render_only }}
          CAMP_LANG: ${{ github.event.inputs.lang }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 4m
          envs: CAMP_TO,CAMP_VARIANT,CAMP_RENDER_ONLY,CAMP_LANG
          script: |
            TO="$CAMP_TO"
            case "$TO" in *@*) ;; *) TO="acerasoft@gmail.com" ;; esac
            VARIANT="$CAMP_VARIANT"
            # Beyaz liste: tanimadigi varyanti sessizce "premium"a cevirir. Guvenli
            # varsayilan ama YENI BIR VARYANT EKLERKEN BURASI DA GUNCELLENMELI --
            # 'pool' eklenip bu satir unutuldugunda onizleme havuz bolumu olmadan
            # gitti ve log "varyant: premium" yazdigi icin ancak log okunarak fark
            # edildi.
            case "$VARIANT" in polos_promo|voucher|pool) ;; *) VARIANT="premium" ;; esac
            LANG_IN="$CAMP_LANG"
            case "$LANG_IN" in de|en|fr|it|es) ;; *) LANG_IN="de" ;; esac
            RENDER_ONLY="$CAMP_RENDER_ONLY"
            cat > /tmp/vestra_camp_preview.php <<'PHPEOF'
            <?php
            $home = getenv("HOME");
            require $home."/public_html/inc/notify.php";
            require $home."/public_html/inc/products.php";
            $to = $argv[1] ?? 'acerasoft@gmail.com';
            $variant = $argv[2] ?? 'premium';
            $renderOnly = strtolower(trim((string)($argv[3] ?? ''))) === 'true';
            /* voucher: hos geldin kuponunun TEK adrese onizlemesi. Bu is sozlesmesi geregi
               tek alici -- toplu gonderim welcome-voucher.yml'in isi, o da varsayilan dalda
               olmadigi icin su an tetiklenemiyor. Buradaki kod ORNEKTIR, gercek bir kupon
               yazilmaz: amac gorunumu onaylamak, kullanilabilir kod uretmek degil. */
            if ($variant === 'voucher') {
              /* email_templates.php'yi BURADA cekmiyoruz: notify.php zaten require_once ile
                 aliyor. Duz `require` ile ikinci kez cekmek "Cannot redeclare" ile olumcul
                 hata veriyordu -- display_errors kapali oldugu icin de sessizce. */
              $lang = $argv[4] ?? 'de';
              list($subject, $body, $opts) = vestra_tpl_welcome_voucher(
                $lang, 'Boutique Meyer GmbH', 'VES-ORNEK-KOD', '5%', date('d.m.Y', strtotime('+6 months')));
            } else {
              /* 'pool' varyanti = normal premium kampanya + ACIK HAVUZLAR bolumu.
                 Ayri bir sablon degil, ayni mektubun havuz eklentili hali -- yani
                 onizlemede gordugunuz sey, gercekten gonderilecek olanin aynisi. */
              list($subject, $body, $opts) = $variant === 'polos_promo'
                ? vestra_campaign_promo_polos()
                : vestra_campaign_preview('', 'en', '', $variant === 'pool');
            }
            echo "varyant: {$variant}\n";

            if ($renderOnly) {
              /* Gorselleri (site ile ayni sunucuda oldugundan) diskten okuyup base64 data URI'ye
                 ceviriyoruz -- boylece cikan HTML disari hicbir istek atmadan, tek basina acilabilir.
                 GH Actions log capture has a practical size ceiling (~1MB total base64): the
                 catalog's uploaded product photos run well past that as-is, so anything over the
                 small-file budget gets GD-downscaled to a small JPEG instead of skipped outright --
                 the preview should still show a real photo, just not full-resolution. */
              $inlineBudget = 40 * 1024;
              $inline = function(string $src) use ($home, $inlineBudget): string {
                $rel = preg_replace('#^https?://[^/]+#', '', $src);
                $file = $home.'/public_html'.$rel;
                if (!is_file($file)) return $src;
                if (filesize($file) <= $inlineBudget) {
                  $bytes = @file_get_contents($file);
                  if ($bytes === false) return $src;
                  $ext = strtolower(pathinfo($file, PATHINFO_EXTENSION));
                  $mime = ['avif'=>'image/avif','png'=>'image/png','webp'=>'image/webp','jpg'=>'image/jpeg','jpeg'=>'image/jpeg'][$ext] ?? 'image/jpeg';
                  return 'data:'.$mime.';base64,'.base64_encode($bytes);
                }
                if (!function_exists('imagecreatefromstring')) return $src;
                $raw = @file_get_contents($file);
                if ($raw === false) return $src;
                $im = @imagecreatefromstring($raw);
                if (!$im) return $src;
                $w = imagesx($im); $h = imagesy($im);
                $newW = min(360, $w); $newH = max(1, (int)round($h * $newW / max(1,$w)));
                $small = imagecreatetruecolor($newW, $newH);
                imagecopyresampled($small, $im, 0,0,0,0, $newW,$newH, $w,$h);
                ob_start(); imagejpeg($small, null, 62); $jpg = ob_get_clean();
                imagedestroy($im); imagedestroy($small);
                return $jpg !== false ? 'data:image/jpeg;base64,'.base64_encode($jpg) : $src;
              };
              if (!empty($opts['shots']) && is_array($opts['shots'])) {
                foreach ($opts['shots'] as $i => $s) {
                  if (!empty($s['img'])) $opts['shots'][$i]['img'] = $inline((string)$s['img']);
                }
              }
              $html = vestra_html_email($body, '', $opts);
              $html = str_replace('https://vestrasales.com/icon-192.png', $inline('https://vestrasales.com/icon-192.png'), $html);
              echo "HTML_BYTES: ".strlen($html)."\n";
              echo "SUBJECT: {$subject}\n";
              echo "===B64_START===\n";
              echo chunk_split(base64_encode($html), 200, "\n");
              echo "===B64_END===\n";
              exit(0);
            }

            if (!filter_var($to, FILTER_VALIDATE_EMAIL)) { echo "GECERSIZ ALICI\n"; exit(1); }
            $ok = vestra_send_mail($to, $subject, $body, '', 'Les Garage de Paris', null, '', $opts);
            echo $ok ? "GONDERILDI -> {$to}\n" : "HATA: gonderim basarisiz\n";
            PHPEOF
            php -l /tmp/vestra_camp_preview.php
            # Cikis kodu ONCE yakalanip sonra donduruluyor. Eskiden `php ...; rm -f ...` idi:
            # rm'in kodu php'ninkini eziyordu, boylece bir PHP fatal'i adimi YESIL birakiyordu
            # -- bir onizleme "gonderildi" gorunup hic gitmedi.
            php /tmp/vestra_camp_preview.php "$TO" "$VARIANT" "$RENDER_ONLY" "$LANG_IN"; RC=$?
            rm -f /tmp/vestra_camp_preview.php
            exit $RC

  wholesale:
    if: github.event.inputs.wholesale_to != ''
    runs-on: ubuntu-latest
    steps:
      - name: Toptan teklifi hazırla ve gönder
        uses: appleboy/ssh-action@v1.0.3
        env:
          WS_TO: ${{ github.event.inputs.wholesale_to }}
          WS_SEND: ${{ github.event.inputs.wholesale_send }}
          WS_LETTER: ${{ github.event.inputs.ws_letter }}
          WS_EXPORT_NOTE: ${{ github.event.inputs.ws_export_note }}
          WS_RECORD_ONLY: ${{ github.event.inputs.ws_record_only }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 15m
          envs: WS_TO,WS_SEND,WS_LETTER,WS_EXPORT_NOTE,WS_RECORD_ONLY
          script: |
            cat > /tmp/vestra_ws.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            register_shutdown_function(function(){
              $e=error_get_last();
              if($e && in_array($e['type'],[E_ERROR,E_PARSE,E_CORE_ERROR,E_COMPILE_ERROR],true))
                fwrite(STDERR,"PHP OLUMCUL: {$e['message']} ({$e['file']}:{$e['line']})\n");
            });
            $home=getenv("HOME");
            require $home."/public_html/inc/products.php";

            /* Birden fazla alici: virgul, bosluk ya da satir sonu ile ayrilir. Tek adres
               yazmak eskisi gibi calisiyor. Ayni mektup 29 adrese gidecekse bunu 29 kez
               elle tetiklemek hem zaman kaybi hem de birinin atlanmasi demek. */
            $rawTo = (string)getenv("WS_TO");
            $recips = array_values(array_unique(array_filter(array_map(
              fn($s)=>strtolower(trim($s)),
              preg_split('~[\s,;]+~', $rawTo) ?: []
            ))));
            $send = strtolower(trim((string)getenv("WS_SEND"))) === 'true';
            /* Kisitli pazarlar. E-posta gondermek ihracat degildir -- yasak malin fiili
               sevkinde isler. Ama teklifi kayitsiz sartsiz birakmak, siparis geldiginde
               "siz teklif ettiniz" cumlesine zemin hazirlar. Bu cumle, kalem kalem bakma
               hakkini bastan sakli tutuyor; gercek ihracatcilarin standart ifadesidir. */
            $exportNote = strtolower(trim((string)getenv("WS_EXPORT_NOTE"))) === 'true';
            /* Hangi mektup. Bilinmeyen bir deger sessizce Petros'a dusmemeli: yanlis
               ulkeye yanlis odeme sartlarini yollamak, hic gondermemekten kotu. */
            $letter = strtolower(trim((string)getenv("WS_LETTER"))); if($letter==='') $letter='petros';
            if(!in_array($letter,['petros','symax','norway','outlets'],true)){
              fwrite(STDERR,"HATA: bilinmeyen mektup: {$letter} (petros | symax | norway | outlets)\n"); exit(1);
            }
            /* Gecersiz adresler once ayiklaniyor, gonderim sirasinda degil: yarim kalmis
               bir kampanya "kime gitti kime gitmedi" sorusunu cevapsiz birakir. */
            $bad = array_values(array_filter($recips, fn($e)=>!filter_var($e,FILTER_VALIDATE_EMAIL)));
            $recips = array_values(array_filter($recips, fn($e)=>filter_var($e,FILTER_VALIDATE_EMAIL)));
            foreach($bad as $b) fwrite(STDERR,"UYARI: gecersiz adres atlandi: {$b}\n");
            if(!$recips){ fwrite(STDERR,"HATA: gecerli alici yok.\n"); exit(1); }
            /* MARKA SAHIPLERI, ZINCIRLER VE DISTRIBUTORLER -- her zaman engelli.
               Grey-market kaynakli markali malin toptan teklifini, o markanin KENDISINE
               ya da yetkili distributorune yollamak en kotu tur temastir: cevap gelmez,
               marka hukuk birimine giden bir dosya acilir. Buyuk zincirler de markalarla
               secici dagitim sozlesmesi altindadir, ayni sonucu dogurur.

               Liste bilerek ALAN ADI PARCASI uzerinden calisiyor: 'ralphlauren' tek basina
               .com/.es/.co.uk hepsini yakalar. Yeni bir marka ya da distributor cikarsa
               buraya bir kelime eklemek yeterli.

               AVM isletmecileri (Simon, Vicinity, McArthurGlen, Mitsui, Value Retail)
               bu listede DEGIL: onlar kiraci yerlestiren ev sahibi, marka ya da zincir
               degil -- zaten hedef kitlenin kendisi. */
            $blockTokens = [
              /* katalogdaki evler */
              'balenciaga','balmain','burberry','casablancaparis','dolcegabbana','dsquared2',
              'fendi','fredperry','gcds','givenchy','gucci','jacquemus','lacoste',
              'marceloburlon','countyofmilan','ralphlauren','valentino','versace',
              /* diger marka sahipleri */
              'elisabettafranchi','stoneisland','armani','prada','moncler','hugoboss',
              'calvinklein','tommy.com','pvh.com','kering','lvmh','ferragamo','bottegaveneta',
              'saintlaurent','celine','loewe','maxmara','diesel','stellamccartney','offwhite',
              'debeers','cartier','tiffany','swarovski','rolex','swatchgroup',
              /* TEK MARKA satan magazalar. Kendi markasini satan bir magaza bizden
                 baska marka almaz -- ve teklifimiz onun icin rakip malin teklifidir.
                 Adresten otomatik anlasilmiyor; her liste elle bakilip buraya isleniyor,
                 boylece ayni isim bir daha karsimiza cikarsa kendiliginden dusuyor. */
              'migato','marasil','glou.gr','tsakirismallas','nak.gr','elisabettafranchi',
              'dale.no','norlender','sandnesgarn','brynje',
              'cortana.es','isla-ibiza','charoruiz','johnstonsofelgin',
              /* zincirler */
              /* ABD merkezli ve cok uluslu BUYUK isletmeciler. Operator kurali net:
                 ABD'ye hicbir kosulda, buyuklere hicbir yerde. McArthurGlen'in cogunlugu
                 Simon Property Group'a (ABD) ait, VIA Outlets pan-Avrupa bir fon ortakligi
                 -- ikisi de her iki olcute birden giriyor. Bolgesel ve bagimsiz merkezler
                 (FoxTown, Landquart, Aubonne) listede DEGIL: hedef kitle onlar. */
              'simon.com','tangeroutlets','mcarthurglen','viaoutlets',
