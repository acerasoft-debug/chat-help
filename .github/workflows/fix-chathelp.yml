name: chat-help.com onarım (e-posta onayı · kayıt açma · ülke/hukuk) — CLI, web'e kapalı

# Bekleyen düzeltmeleri sunucuda PHP CLI ile çalıştırır. Scriptler geçici, rastgele adlı kopya olarak yüklenir,
# başına "yalnız CLI" bekçisi eklenir (web'den 403), çalıştırılır ve HEMEN silinir. Çıktı bu logda.
#   mode=preview : db.php tanım ADLARI (değer yok), dump-signup, open-signup (önizleme), diag-mail, diag-geo  → hiçbir şey yazmaz
#   mode=apply   : open-signup?apply=1 (DB: onay kolonu=1, DEFAULT 1, trigger) · mail-api (BREVO_KEY varsa) ya da fix-mail (SMTP) ·
#                  fix-geo (index.php'de tek-seferlik kilidi kaldırır, yedekli) · opcache reset (web bağlamında, geçici dosya)
# Değişen dosyalar yedeklenir (auth.php.bak-*, index.php.bak-fixgeo-*). Geri alma komutları çıktıda.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview | apply"
        required: true
        default: "preview"
      ref:
        description: "Scriptlerin alınacağı dal"
        required: true
        default: "claude/chat-help-system-video-x0nofb"
      test_mail_to:
        description: "Test e-postası alıcısı (apply)"
        required: false
        default: "acerasoft@gmail.com"
      secrets_prefix:
        description: "Secret ön eki"
        required: true
        default: "CHATHELP"

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      CH_HOST: ${{ secrets[format('{0}_HOST', github.event.inputs.secrets_prefix)] }}
      CH_USER: ${{ secrets[format('{0}_USER', github.event.inputs.secrets_prefix)] }}
      CH_PASS: ${{ secrets[format('{0}_PASSWORD', github.event.inputs.secrets_prefix)] }}
      CH_PORT: ${{ secrets[format('{0}_PORT', github.event.inputs.secrets_prefix)] }}
      MODE: ${{ github.event.inputs.mode }}
      MAIL_TO: ${{ github.event.inputs.test_mail_to }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Bağlan
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass php-cli > /dev/null
          for f in chat/dump-signup.php chat/open-signup.php chat/diag-mail.php chat/diag-geo.php chat/mail-final.php chat/fix-geo.php; do php -l "$f" >/dev/null || exit 1; done
          trim(){ local v="$1"; v="${v//$'\r'/}"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          CH_USER=$(trim "$CH_USER"); CH_PASS=$(trim "$CH_PASS"); CH_HOST=$(trim "${CH_HOST:-145450.eu11.ssh.myftpupload.com}"); P=$(trim "${CH_PORT:-22}")
          [ -n "$CH_USER" ] && [ -n "$CH_PASS" ] || { echo "::error::CHATHELP_USER / CHATHELP_PASSWORD yok"; exit 1; }
          echo "SSHPASS=$CH_PASS" >> $GITHUB_ENV
          echo "SSHCMD=sshpass -e ssh -o StrictHostKeyChecking=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o ConnectTimeout=25 -p $P" >> $GITHUB_ENV
          echo "SCPCMD=sshpass -e scp -o StrictHostKeyChecking=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -o ConnectTimeout=25 -P $P" >> $GITHUB_ENV
          echo "SRV=$CH_USER@$CH_HOST" >> $GITHUB_ENV
          export SSHPASS="$CH_PASS"
          DEST=$(sshpass -e ssh -o StrictHostKeyChecking=no -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no -p "$P" "$CH_USER@$CH_HOST" 'for d in ~/html ~/public_html ~/www; do [ -f "$d/chat/auth.php" ] && { echo "$d"; break; }; done')
          [ -n "$DEST" ] || { echo "::error::docroot bulunamadı"; exit 1; }
          echo "DEST=$DEST" >> $GITHUB_ENV; echo "DOCROOT: $DEST"

      - name: Scriptleri hazırla (yalnız-CLI bekçisi) ve yükle
        run: |
          set -e
          mkdir -p /tmp/t; R=$(openssl rand -hex 6); echo "RND=$R" >> $GITHUB_ENV
          for f in dump-signup open-signup diag-mail diag-geo mail-final fix-geo; do
            { printf '%s\n' "<?php if (PHP_SAPI !== 'cli') { http_response_code(403); exit('forbidden'); } ?>"; cat "chat/$f.php"; } > "/tmp/t/_fx_${R}_$f.php"
            php -l "/tmp/t/_fx_${R}_$f.php" >/dev/null
          done
          # opcache reset: web bağlamında çalışmalı → rastgele adlı geçici dosya, çağrıldıktan sonra silinir
          printf '%s\n' "<?php header('Content-Type: text/plain'); if(function_exists('opcache_reset')){ echo opcache_reset()?'opcache reset OK':'opcache reset FAILED'; } else echo 'opcache yok'; echo \"\\nphp \".PHP_VERSION;" > "/tmp/t/_opc_${R}.php"
          $SCPCMD -q /tmp/t/_fx_${R}_*.php "/tmp/t/_opc_${R}.php" "$SRV:$DEST/chat/" </dev/null
          echo "yuklendi: $(ls /tmp/t | tr '\n' ' ')"

      - name: db.php tanımları (yalnız adlar)
        run: |
          $SSHCMD -n "$SRV" "cd $DEST/chat && echo '--- define adlari ---' && grep -oE \"define\\('[A-Za-z0-9_]+'\" db.php | sed \"s/define('//;s/'//\" | sort -u | tr '\\n' ' '; echo; echo '--- beklenenler ---'; for k in CLAUDE_KEY CLAUDE_MODEL DEEPSEEK_KEY STRIPE_SK STRIPE_SECRET STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_TOKENS_WEBHOOK_SECRET STRIPE_TOKEN_PRICES BREVO_KEY SMTP_HOST SMTP_USER SMTP_PASS SMTP_FROM SMTP_NAME; do grep -q \"define('\$k'\" db.php && echo \"  \$k: VAR\" || echo \"  \$k: yok\"; done; echo '--- php ---'; php -v | head -1"

      - name: ÖNİZLEME (yazmaz) — kayıt/onay dökümü, e-posta ve geo teşhisi
        run: |
          set +e
          R="$RND"
          run(){ echo; echo "################ $1 ################"; $SSHCMD -n "$SRV" "cd $DEST/chat && php -d display_errors=1 -d error_reporting=E_ALL -r '\$_GET=$2; \$_SERVER[\"REMOTE_ADDR\"]=\"127.0.0.1\"; \$_SERVER[\"HTTP_HOST\"]=\"chat-help.com\"; include \"_fx_${R}_$1.php\";' 2>&1 | head -${3:-220}"; }
          run dump-signup '[]' 200
          run open-signup '[]' 160
          run diag-mail "[\"to\"=>\"$MAIL_TO\"]" 200
          run diag-geo '[]' 160
          run mail-final "[\"to\"=>\"$MAIL_TO\"]" 60

      - name: UYGULA — kayıt açma (DB), e-posta (API/SMTP), ülke/hukuk kilidi, opcache
        if: ${{ github.event.inputs.mode == 'apply' }}
        run: |
          set +e
          R="$RND"
          run(){ echo; echo "################ $1 ################"; $SSHCMD -n "$SRV" "cd $DEST/chat && php -d display_errors=1 -d error_reporting=E_ALL -r '\$_GET=$2; \$_SERVER[\"REMOTE_ADDR\"]=\"127.0.0.1\"; \$_SERVER[\"HTTP_HOST\"]=\"chat-help.com\"; include \"_fx_${R}_$1.php\";' 2>&1 | head -${3:-220}"; }
          echo "--- yedekler (oncesi) ---"; $SSHCMD -n "$SRV" "cd $DEST/chat && cp -n auth.php auth.php.bak-fix-$(date +%Y%m%d-%H%M%S) && ls -la auth.php* | tail -3"
          run open-signup '["apply"=>"1"]' 200
          run mail-final "[\"to\"=>\"$MAIL_TO\",\"apply\"=>\"1\"]" 120
          run fix-geo '[]' 200
          echo; echo "################ opcache reset (web) ################"
          curl -sS -m 20 "https://chat-help.com/chat/_opc_${R}.php?x=$(date +%s)"; echo
          echo; echo "--- php -l (degisen dosyalar) ---"; $SSHCMD -n "$SRV" "cd $DEST/chat && php -l auth.php && php -l index.php"

      - name: Geçici dosyaları SİL (her durumda)
        if: ${{ always() }}
        run: |
          $SSHCMD -n "$SRV" "cd $DEST/chat && rm -f _fx_${RND}_*.php _opc_${RND}.php && ls _fx_* _opc_* 2>/dev/null || echo 'gecici dosyalar silindi'"
          curl -sS -m 10 -o /dev/null -w "gecici opcache dosyasi web: %{http_code} (404 beklenir)\n" "https://chat-help.com/chat/_opc_${RND}.php"
