name: Build Android APK (ChatHelp)

on:
  workflow_dispatch: {}
  push:
    branches: [ "claude/charming-franklin-1ynmuj", "claude/diagnostics-catalog-work-5gmxqw" ]
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install deps + add Android platform + patch native (back button, signing)
        working-directory: mobile
        run: |
          npm install
          npm run setup:android

      - name: Generate app icon + splash
        working-directory: mobile
        run: npx capacitor-assets generate --android || echo "assets step skipped"

      - name: Verify Google Play compliance patches (targetSdk 35 + edge-to-edge opt-out)
        working-directory: mobile/android
        run: |
          grep -q "targetSdkVersion = 35" variables.gradle
          grep -q "compileSdkVersion = 35" variables.gradle
          grep -q "windowOptOutEdgeToEdgeEnforcement" app/src/main/res/values/styles.xml
          grep -q "suppressUnsupportedCompileSdk=35" gradle.properties
          echo "Play uyum yamalari dogrulandi: targetSdk 35, edge-to-edge opt-out, AGP uyari susturma"

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk ChatHelp.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatHelp-debug-apk
          path: ChatHelp.apk
          if-no-files-found: error

      - name: Publish APK to a Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: ChatHelp Android (Test-Build)
          body: |
            ChatHelp Android test sürümü (debug APK).
            Telefonda kur: bu sayfadaki **ChatHelp.apk**'ya dokun → Yükle.
            (Bilinmeyen kaynak uyarısı çıkarsa tarayıcıya izin ver.)
          prerelease: true
          make_latest: "false"
          files: ChatHelp.apk

  build-release:
    # Google Play icin .aab. Secrets VARSA imzali uretir; YOKSA imzasiz
    # (unsigned) uretip release'e yukler — imzalama sonra jarsigner ile
    # terminalde yapilir (Google'in resmi destekledigi yol).
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI: "true"
    steps:
      - name: Check signing secrets present
        id: sign
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "Secrets yok — IMZASIZ .aab uretilecek (jarsigner ile sonradan imzalanir)."
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install deps + add Android platform + patch native
        working-directory: mobile
        run: |
          npm install
          npm run setup:android

      - name: Generate app icon + splash
        working-directory: mobile
        run: npx capacitor-assets generate --android || echo "assets step skipped"

      - name: Restore keystore from secret
        if: steps.sign.outputs.has == 'true'
        working-directory: mobile/android
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Write key.properties from secrets
        if: steps.sign.outputs.has == 'true'
        working-directory: mobile/android
        run: |
          cat > key.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release AAB
        working-directory: mobile/android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Rename AAB (signed or unsigned)
        run: |
          if [ "${{ steps.sign.outputs.has }}" = "true" ]; then
            cp mobile/android/app/build/outputs/bundle/release/app-release.aab ChatHelp-release.aab
          else
            cp mobile/android/app/build/outputs/bundle/release/app-release.aab ChatHelp-unsigned.aab
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatHelp-release-aab
          path: ChatHelp-*.aab
          if-no-files-found: error

      - name: Publish unsigned AAB to release (terminalden indirilip imzalanacak)
        if: steps.sign.outputs.has == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          prerelease: true
          make_latest: "false"
          files: ChatHelp-unsigned.aab
