name: (Teşhis) Canlı sayfaları kontrol et
on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Kontrol edilecek yollar, boşlukla ayrık"
        required: false
        default: "/ /shop /seller /buyer /login /register /requests /journal /product?id=dsq-s74gl0064-900"
      grep_pairs:
        description: "Opsiyonel içerik kontrolü, satır satır 'yol::aranan-metin' (ör: /shop::lac-polo-paris)"
        required: false
        default: ""
      brand_probe:
        description: "Verilen yolda ızgaranın ilk 24 kartının markasını sırayla yazar (ör: /shop) — katalog sıralaması gerçekten istendiği gibi mi?"
        required: false
        default: ""
      full_audit:
        description: "true = ürün/lead/hesap/yapılandırma genelinde eksik taraması da çalıştır (salt-okunur)"
        required: false
        default: "false"
      fix_shop_shadow:
        description: "true = bir sayfayı gölgeleyen dizini public_html DIŞINA taşı (403 onarımı). Silmez, taşır."
        required: false
        default: "false"
      htaccess_report:
        description: "true = canlı .htaccess ile depodakini karşılaştır, deploy.sh'ın neyi kopyaladığını yaz (salt-okunur)"
        required: false
        default: "false"
      dropship_api_key:
        description: "Verilirse api/dropship.php'yi bu Bearer key ile uçtan uca test eder (log'a yazılmaz)"
        required: false
        default: ""
      order_sheet_ref:
        description: "Verilirse bu sipariş için tarafsız 'order sheet' PDF'i üretir (ör: VES-CF0B4185)"
        required: false
        default: ""
      order_doc:
        description: "order_sheet_ref ile: 'sheet' (varsayılan, tarafsız sipariş sayfası) veya 'invoice' (fatura ÖNİZLEMESİ — hiçbir şey kaydedilmez, e-posta gitmez)"
        required: false
        default: "sheet"
      order_sheet_pubkey:
        description: "Boş bırakılırsa sadece sipariş denetimi çalışır. Verilirse PDF de üretilip bu RSA public key (PEM, base64) ile şifrelenip döner — bu depo herkese açık, log da öyle, PDF şifresiz yazılmaz."
        required: false
        default: ""
      find_ref:
        description: "Bir referans/e-posta/SKU'yu TÜM kayıt dosyalarında ara (ör: O39419). 'E-posta geldi ama panelde yok' sorusunu tahminle değil kayıtla cevaplar."
        required: false
        default: ""
      ip_probe:
        description: "true = IP tespitini CANLI sunucuda sına: bilinen adreslerle ülke/VPN sorgusu, hangi sağlayıcının cevap verdiği, süre. 'IP tespiti kesinlikle çalışmalı' bunun kanıtı."
        required: false
        default: "false"
      accounts_report:
        description: "true = kayıtlı hesapları MASKELİ listele (ilk 2 harf + alan adı, tip, durum, KYB, belge durumu) + hata günlüğünün son satırları. 'Doğru e-postayla giremiyorum' şikâyetinin cevabı: hesap hangi hâliyle kayıtlı?"
        required: false
        default: "false"
      login_probe:
        description: "true = test hesabıyla CANLI siteye giriş yap, çerezle anasayfayı iste ve hangi düğmelerin göründüğünü yaz (Open my panel mi Register mı). www/non-www çerez kaybını da sınar."
        required: false
        default: "false"
      reset_probe:
        description: "Bir e-posta adresi verin: 'şifremi unuttum' akışının HER adımını sırayla dener ve nerede durduğunu yazar. GERÇEK bir sıfırlama e-postası gönderir — kendi adresinizi verin."
        required: false
        default: ""
      order_delete_check:
        description: "true = 'sipariş silinmiyor' teşhisi: canlı admin.php'de silme kodu var mı, data dizini yazılabilir mi, hangi ref'ler faturası olduğu için silinemiyor (salt-okunur)"
        required: false
        default: "false"
      finder_keyscan:
        description: "true = 'finder anahtarını bul ve ekle': sunucudaki tüm yedeklerde duran anahtarları toplar, HER İKİ sağlayıcıya (Hunter + Anymailfinder) sorar, çalışan varsa ayarlara yazar. Anahtar log'a YAZILMAZ — sadece parmak izi."
        required: false
        default: "false"
      finder_clear:
        description: "finder_keyscan ile: hiçbiri çalışmıyorsa geçersiz anahtarı ayarlardan sil (önce yedek alınır). Boş bırakılırsa hiçbir şey silinmez."
        required: false
        default: "false"
      visits_probe:
        description: "true = ziyaretçi sayacını CANLI sunucuda sına: gerçek sayfa istekleri sayılıyor mu, /admin sayılmıyor mu, canlı liste doluyor mu. Sınamadan önce sayaç dosyası yedeklenir, sonra geri konur — gerçek rakamlarınız bozulmaz."
        required: false
        default: "false"

permissions:
  contents: read

# Salt-okunur. Runner'dan canli siteye HTTP istegi atar ve her sayfa icin durum kodu,
# boyut, sure ve icerikte PHP hata izi olup olmadigini yazar. Ayrica sunucuda disk /
# PHP error log durumuna bakar.
#
# Neden: "sayfa calismiyor" tek basina 500 mu, bos sayfa mi, JS hatasi mi ayirt
# ettirmiyor. Bu is, tahmin etmeden once hangisi oldugunu soyler.
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: HTTP kontrolü
        env:
          PATHS: ${{ github.event.inputs.paths }}
        run: |
          set -e
          BASE="https://vestrasales.com"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          printf '%-46s %-6s %-9s %-7s %s\n' "YOL" "KOD" "BOYUT" "SURE" "NOT"
          # Yollar bosluk YA DA virgulle ayrilabilsin. Ikisi de dogal geliyor ve
          # virgulle yazildiginda tum dizge TEK yol sayilip 404 donuyordu -- yani
          # "sayfa yok" diyen bir rapor, aslinda sorulmamis bir soru icin.
          for p in $(echo "$PATHS" | tr ',' ' '); do
            out=$(curl -sS -A "$UA" -o /tmp/body.html -w '%{http_code} %{size_download} %{time_total}' \
                  --max-time 30 "${BASE}${p}" 2>/dev/null || echo "000 0 0")
            code=$(echo "$out" | awk '{print $1}')
            size=$(echo "$out" | awk '{print $2}')
            secs=$(echo "$out" | awk '{print $3}')
            note=""
            # Bir PHP fatal'i cogu zaman 200 ile doner (display_errors kapaliysa BOS 200),
            # bu yuzden sadece durum koduna bakmak yetmiyor -- govdeyi de tariyoruz.
            if grep -qiE 'fatal error|parse error|uncaught|call to undefined|allowed memory' /tmp/body.html 2>/dev/null; then
              note="PHP HATASI GOVDEDE"
            elif [ "$size" -lt 500 ] 2>/dev/null; then
              note="govde cok kucuk (bos sayfa / sessiz fatal olabilir)"
            elif ! grep -qi '</html>' /tmp/body.html 2>/dev/null; then
              note="</html> yok — cikti yarida kesilmis"
            fi
            printf '%-46s %-6s %-9s %-7s %s\n' "$p" "$code" "$size" "$secs" "$note"
            if [ -n "$note" ]; then
              echo "    --- govdenin son 400 baytı ---"
              tail -c 400 /tmp/body.html | tr -d '\0' | sed 's/^/    /'
              echo
            fi
          done

          GREP_PAIRS='${{ github.event.inputs.grep_pairs }}'
          if [ -n "$GREP_PAIRS" ]; then
            echo; echo "===== ICERIK KONTROLU ====="
            echo "$GREP_PAIRS" | sed 's/||/\n/g' | while IFS= read -r line; do
              [ -z "$line" ] && continue
              gp="${line%%::*}"; needle="${line#*::}"
              curl -sS -A "$UA" -o /tmp/gbody.html --max-time 30 "${BASE}${gp}" 2>/dev/null || true
              if grep -qF "$needle" /tmp/gbody.html 2>/dev/null; then
                n=$(grep -oF "$needle" /tmp/gbody.html | wc -l)
                echo "  BULUNDU  (${n}x)  ${gp} :: ${needle}"
              else
                echo "  YOK           ${gp} :: ${needle}"
              fi
            done
          fi

          # "Sayfada BALMAIN var mi" ile "izgara BALMAIN ile mi aciliyor" ayri sorular:
          # icerik kontrolu varligi sayar, sirayi gormez. Bu blok kartlarin markasini
          # DOM sirasiyla yazar, yani ziyaretcinin ilk ekranda gercekten ne gordugunu.
          BRAND_PROBE='${{ github.event.inputs.brand_probe }}'
          if [ -n "$BRAND_PROBE" ]; then
            echo; echo "===== IZGARA SIRASI ($BRAND_PROBE) ====="
            curl -sS -A "$UA" -o /tmp/pbody.html --max-time 30 "${BASE}${BRAND_PROBE}" 2>/dev/null || true
            # data-brand tek basina yetmiyor: ustteki marka filtresi tuslari da tasiyor ve
            # ilk 18 eslesmeyi onlar yiyor. Kart oldugunun kaniti data-ord -- sadece urun
            # kartlarinda var. Nitelikler ayri satirlarda durdugu icin once tek satira indir.
            tr -s '\n ' '  ' < /tmp/pbody.html \
              | grep -o 'data-ord="[0-9]*" data-cat="[^"]*" data-brand="[^"]*"' \
              | sed 's/.*data-brand="//; s/"$//' | head -24 | nl -w3 -s'. '
          fi

      - name: Dropship API uçtan uca test
        if: ${{ github.event.inputs.dropship_api_key != '' }}
        env:
          DKEY: ${{ github.event.inputs.dropship_api_key }}
        run: |
          BASE="https://vestrasales.com/api/dropship.php"

          echo "== key'siz istek (401 bekleniyor) =="
          curl -sS -L -o /tmp/d1.json -w 'KOD=%{http_code}\n' "${BASE}?a=stock"
          cat /tmp/d1.json; echo

          echo; echo "== stok sorgusu (200 bekleniyor) =="
          curl -sS -L -H "Authorization: Bearer ${DKEY}" -o /tmp/d2.json -w 'KOD=%{http_code}\n' "${BASE}?a=stock"
          cat /tmp/d2.json; echo

          echo; echo "== stokta olmayan beden (400/404/409 bekleniyor) =="
          curl -sS -H "Authorization: Bearer ${DKEY}" -H "Content-Type: application/json" \
            -o /tmp/d3.json -w 'KOD=%{http_code}\n' \
            -d '{"colour":"Black","size":"XXXL","qty":1}' "${BASE}?a=order"
          cat /tmp/d3.json; echo

          echo; echo "== gecerli siparis (200 + checkout_url bekleniyor) =="
          curl -sS -H "Authorization: Bearer ${DKEY}" -H "Content-Type: application/json" \
            -o /tmp/d4.json -w 'KOD=%{http_code}\n' \
            -d '{"colour":"Black","size":"S","qty":1,"reference":"smoketest-1","customer_email":"smoketest@example.com"}' "${BASE}?a=order"
          cat /tmp/d4.json; echo

      - name: Sunucu sağlığı (disk / PHP hata günlüğü)
        uses: appleboy/ssh-action@v1.0.3
        env:
          FIX_SHADOW: ${{ github.event.inputs.fix_shop_shadow }}
          DIAG_PATHS: ${{ github.event.inputs.paths }}
          DIAG_GREP: ${{ github.event.inputs.grep_pairs }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 4m
          envs: FIX_SHADOW,DIAG_PATHS,DIAG_GREP
          script: |
            echo "== DISK =="; df -h ~ 2>/dev/null | tail -2
            echo; echo "== public_html boyutu =="; du -sh ~/public_html 2>/dev/null

            # Platform fatura/banka yapilandirmasi. "Girdim mi, girmedim mi" sorusu
            # tahminle degil kayitla cevaplanmali: eksikse fatura ODEME KUTUSU OLMADAN
            # kesilir ve alici parayi nereye gonderecegini belgeden ogrenemez.
            # DEGERLER YAZDIRILMIYOR, yalnizca dolu/bos. Bu depo herkese acik, Actions
            # log'u da oyle; ABD'de routing + hesap ikilisi ACH borclandirma icin yeterli.
            echo; echo "== platform fatura/banka yapilandirmasi =="
            cat > /tmp/vestra_platbill.php <<'PHPEOF'
            <?php
            $f = getenv("HOME")."/public_html/data/platform_seller.json";
            if (!is_readable($f)) { echo "  platform_seller.json YOK -- fatura banka bilgisi olmadan kesilir\n"; exit(0); }
            $j = json_decode((string)file_get_contents($f), true);
            if (!is_array($j)) { echo "  !! dosya var ama JSON okunamiyor\n"; exit(0); }
            $need = ['company','address','country','bank_holder','bank_name','bank_address',
                     'bank_routing','bank_account','bank_acct_type','bank_iban','bank_bic'];
            foreach ($need as $k) {
              $v = trim((string)($j[$k] ?? ''));
              printf("  %-16s %s\n", $k, $v === '' ? '—' : 'DOLU ('.mb_strlen($v).' karakter)');
            }
            $payable = trim((string)($j['bank_iban'] ?? '')) !== '' || trim((string)($j['bank_account'] ?? '')) !== '';
            echo $payable ? "  SONUC: odeme kutusu basilabilir\n"
                          : "  SONUC: hesap numarasi YOK -- odeme kutusu BOS cikar\n";
            PHPEOF
            php /tmp/vestra_platbill.php; rm -f /tmp/vestra_platbill.php

            # Operator "panelden girdim, sistemde mevcut" dedi ama platform dosyasi yok.
            # Banka bilgisi YANLIS KUTUYA -- bir HESABIN kendi banka alanlarina --
            # girilmis olabilir: satici hesaplarinin fatura icin kendi bank_* alanlari
            # var. Bu tarama hangi hesapta hangi alanin dolu oldugunu soyler; DEGERLER
            # ASLA yazilmaz (log herkese acik), yalnizca alan adlari.
            # Giden postanin GORUNEN adresi. Anahtar DEGIL, gonderen adres ve
            # saglayici yaziliyor: adres zaten her alicinin gordugu sey, gizli
            # degil. Gerekli, cunku mail_from bu projede iki kez degisti
            # (once acerasoft@gmail.com, domain dogrulaninca support@...) ve
            # "bu e-posta hangi adresten gidiyor" sorusu ezberle cevaplanmamali.
            echo; echo "== giden posta kimligi =="
            cat > /tmp/vestra_mailid.php <<'PHPEOF'
            <?php
            $f = getenv("HOME")."/public_html/data/email_settings.json";
            $j = is_readable($f) ? json_decode((string)file_get_contents($f), true) : null;
            if (!is_array($j)) { echo "  email_settings.json yok -- kod varsayilani gecerli\n"; }
            $from = trim((string)($j['mail_from'] ?? ''));
            $name = trim((string)($j['smtp_name'] ?? ''));
            printf("  gonderen adres : %s\n", $from !== '' ? $from : 'support@vestrasales.com  (kod varsayilani)');
            printf("  gorunen ad     : %s\n", $name !== '' ? $name : 'VESTRA  (kod varsayilani)');
            printf("  tasima         : %s\n",
              trim((string)($j['mail_api_key'] ?? '')) !== '' ? 'API (Brevo/Resend)'
              : (trim((string)($j['smtp_host'] ?? '')) !== '' ? 'SMTP' : 'yapilandirilmamis'));
            printf("  gonderim acik  : %s\n", !empty($j['mail_enabled']) ? 'evet' : 'HAYIR');
            PHPEOF
            php /tmp/vestra_mailid.php; rm -f /tmp/vestra_mailid.php

            echo; echo "== hesaplarda dolu banka alanlari =="
            cat > /tmp/vestra_acctbank.php <<'PHPEOF'
            <?php
            $af = getenv("HOME")."/public_html/data/accounts.json";
            $accs = is_readable($af) ? json_decode((string)file_get_contents($af), true) : null;
            if (!is_array($accs)) { echo "  accounts.json okunamadi\n"; exit(0); }
            $bk = ['bank_holder','bank_name','bank_iban','bank_bic','bank_routing',
                   'bank_account','bank_acct_type','bank_address'];
            $hit = 0;
            foreach ($accs as $a) {
              $filled = array_values(array_filter($bk, fn($k) => trim((string)($a[$k] ?? '')) !== ''));
              if (!$filled) continue;
              $hit++;
              printf("  %s <%s>  ->  %s\n",
                (string)($a['company'] ?? ($a['name'] ?? '?')),
                (string)($a['email'] ?? '?'), implode(', ', $filled));
            }
            if (!$hit) echo "  hicbir hesabin banka alani dolu degil\n";
            PHPEOF
            php /tmp/vestra_acctbank.php; rm -f /tmp/vestra_acctbank.php

            # /shop 403 verdi (Apache'nin kendi 13 baytlik cevabi, PHP'den degil).
            # Kok .htaccess'teki temiz-URL kurali `RewriteCond %{REQUEST_FILENAME} !-d`
            # tasiyor: hedef bir DIZIN ise .php'ye yonlendirme atlanir, `Options -Indexes`
            # de listelemeyi yasakladigi icin sonuc 403 olur. Yani sayfa adiyla ayni ada
            # sahip bos bir dizin, o sayfayi tek basina eriselemez yapar.
            echo; echo "== sayfa adiyla CAKISAN dizinler (403 sebebi) =="
            found=0
            for f in ~/public_html/*.php; do
              b=$(basename "$f" .php)
              if [ -d ~/public_html/"$b" ]; then
                found=1
                echo "  CAKISMA: /$b  ->  dizin VAR, $b.php golgede kaliyor"
                ls -la ~/public_html/"$b" | head -8
              fi
            done
            [ "$found" = 0 ] && echo "  cakisan dizin yok"
            echo; echo "== shop.php dosya durumu =="
            ls -l ~/public_html/shop.php 2>/dev/null || echo "  shop.php YOK!"

            # public_html'den tasimak yetmiyor: /shop 12:44'te 200'e dondu, iki deploy
            # sonra 12:48'de yine 403 oldu. deploy.sh sunucudaki klondan public_html'e
            # rsync ediyor ve `git reset --hard` IZLENMEYEN dizinlere dokunmuyor, o
            # yuzden klonun icine konmus bir dizin her deploy'da geri geliyor. Kaynak
            # burasi; belirti oradaki kopya.
            echo; echo "== sunucudaki klonda izlenmeyen sayfa-adi dizinleri =="
            REPO="$HOME/vestra-repo/vestra"
            if [ -d "$REPO" ]; then
              rfound=0
              for f in ~/public_html/*.php; do
                b=$(basename "$f" .php)
                [ -d "$REPO/$b" ] || continue
                rfound=1
                tracked=$(cd "$HOME/vestra-repo" && git ls-files "vestra/$b" | wc -l)
                echo "  $REPO/$b  ->  git'te izlenen dosya: $tracked $([ "$tracked" = 0 ] && echo '(IZLENMIYOR -- her deploy geri koyar)')"
              done
              [ "$rfound" = 0 ] && echo "  klonda cakisan dizin yok"
            else
              echo "  $REPO yok"
            fi

            # Onarim. SILMIYOR, public_html DISINA tasiyor: 403 aninda kalkar ve
            # icinde beklenmedik bir sey cikarsa geri koymak tek komut. Canli bir
            # sunucuda rm -rf calistirmak icin ortada yeterli sebep yok.
            if [ "${FIX_SHADOW:-false}" = "true" ]; then
              echo; echo "== GOLGE DIZIN ONARIMI =="
              for f in ~/public_html/*.php; do
                b=$(basename "$f" .php)
                D=~/public_html/"$b"
                [ -d "$D" ] || continue
                # Her cakisma ariza degil. /membership altinda Stripe'in donus sayfalari
                # (success.php, cancel.php) duruyor ve kok .htaccess'te ona ozel bir
                # RewriteRule var, dolayisiyla sayfa sorunsuz aciliyor. Sadece "ayni adda
                # dizin var" diye tasimak odeme donuslerini kirardi. Olcut dizinin varligi
                # degil, sayfanin GERCEKTEN bozuk olmasi: once canliya bakiyoruz.
                pre=$(curl -s -o /dev/null -w '%{http_code}' -L "https://vestrasales.com/$b")
                echo "  '$b' icin: canli durum $pre"
                if [ "$pre" = "200" ]; then
                  echo "    sayfa zaten calisiyor -- dokunulmuyor"
                  continue
                fi
                echo "    boyut: $(du -sh "$D" | cut -f1), dosya: $(find "$D" -type f | wc -l)"
                # Once kanit: bu dizinde olup canli kokte olmayan dosya var mi?
                uniq=0
                for g in $(find "$D" -type f | head -400); do
                  rel="${g#$D/}"
                  [ -e ~/public_html/"$rel" ] || { echo "    BENZERSIZ: $rel"; uniq=$((uniq+1)); }
                done
                [ "$uniq" = 0 ] && echo "    (ilk 400 dosyanin hepsinin kokte karsiligi var -- saf kopya)"
                STAMP=$(date -u +%Y%m%d-%H%M%S)
                # ONCE kaynak: klondaki izlenmeyen kopya kalirsa bir sonraki deploy
                # her seyi geri koyar ve sayfa yeniden 403'e duser.
                SRC="$HOME/vestra-repo/vestra/$b"
                if [ -d "$SRC" ]; then
                  mv "$SRC" ~/"_golge-kaynak-${b}-${STAMP}" \
                    && echo "    KAYNAK TASINDI -> ~/_golge-kaynak-${b}-${STAMP}" \
                    || { echo "    HATA: kaynak tasinamadi"; exit 1; }
                fi
                DEST=~/"_golge-${b}-${STAMP}"
                mv "$D" "$DEST" && echo "    TASINDI -> $DEST" || { echo "    HATA: tasinamadi"; exit 1; }
                [ -d "$D" ] && { echo "    HATA: dizin hala duruyor"; exit 1; }
                code=$(curl -s -o /dev/null -w '%{http_code}' -L "https://vestrasales.com/$b")
                echo "    canli /$b -> HTTP $code"
                [ "$code" = "200" ] || { echo "    UYARI: hala 200 degil"; exit 1; }
              done
              echo "  onarim tamam."
            fi
            echo; echo "== son PHP hatalari =="
            for L in ~/public_html/error_log ~/error_log ~/logs/error_log /var/log/php-fpm/error.log; do
              [ -f "$L" ] && { echo "-- $L --"; tail -25 "$L"; }
            done
            echo; echo "== listings.json =="
            ls -la ~/public_html/data/listings.json 2>/dev/null
            php -r '$d=json_decode(file_get_contents(getenv("HOME")."/public_html/data/listings.json"),true);
                    echo is_array($d)?("gecerli JSON, ".count($d)." urun\n"):"BOZUK JSON!\n";'
            echo; echo "== yedek sayisi =="; ls -1 ~/public_html/data/listings.json.bak-* 2>/dev/null | wc -l

            # Ana sayfalarin durumu, ADIMIN SONUNDA. Ustteki HTTP tablosu isin en
            # basinda yaziliyor ve uzun bir log'da kuyruktan okurken ona ulasilamiyor;
            # asil merak edilen "ayakta mi" sorusunun cevabi da hep o tabloda kaliyordu.
            # Katalog Excel'i fotograflari kucultmek icin GD kullaniyor; GD yoksa sessizce
            # orijinal boyuta donuyor (127 MB'lik dosya). Sessiz olmasin.
            echo; echo "== GD (katalog fotograf kucultme) =="
            php -r 'echo function_exists("imagescale") ? "  GD var -- fotograflar kucultuluyor\n"
                                                       : "  GD YOK -- katalog tam boyutta gomuyor!\n";'

            echo; echo "== canli sayfa durumlari =="
            # Istenen yollar varsa ONLAR, yoksa varsayilan ana sayfalar. Ustteki HTTP
            # tablosu adimin basinda yaziliyor ve uzun bir kutukte kuyruktan okunamiyor;
            # bu yuzden "sordugum yol ne dondu" sorusu hep cevapsiz kaliyordu. Sorulan
            # yollarin SONDA tekrar edilmesi o bosluğu kapatiyor.
            LIST="$(echo "${DIAG_PATHS:-}" | tr ',' ' ')"
            [ -z "$LIST" ] && LIST="/ /shop /catalog /journal /product?id=lac-polo-paris /login /cart"
            for u in $LIST; do
              printf '  %-34s %s\n' "$u" \
                "$(curl -s -o /dev/null -w '%{http_code}  %{time_total}s  %{size_download}B' -L "https://vestrasales.com$u")"
            done

            # Icerik kontrolu SUNUCUDAN. Ayni kontrol runner'dan da yapiliyor ama
            # oradan bakildiginda site iki ayri sayfa icin de ~7 KB'lik ayni genel
            # cevabi veriyor (barindirmanin bot korumasi); sunucunun kendi istegine
            # ise 359 KB'lik gercek sayfa geliyor. Yani runner'dan yapilan arama
            # sayfada olan bir metni de "YOK" diye bildiriyordu -- yanlis negatif,
            # ve en kotu turden: bir seyi bozdugunuza inandiran.
            if [ -n "${DIAG_GREP:-}" ]; then
              echo; echo "== ICERIK KONTROLU (sunucudan) =="
              echo "$DIAG_GREP" | sed 's/||/\n/g' | while IFS= read -r line; do
                [ -z "$line" ] && continue
                gp="${line%%::*}"; needle="${line#*::}"
                curl -sS -o /tmp/vgbody.html --max-time 30 "https://vestrasales.com${gp}" 2>/dev/null || true
                if grep -qF "$needle" /tmp/vgbody.html 2>/dev/null; then
                  printf '  BULUNDU (%3sx)  %-14s :: %s\n' "$(grep -oF "$needle" /tmp/vgbody.html | wc -l | tr -d ' ')" "$gp" "$needle"
                else
                  printf '  YOK            %-14s :: %s\n' "$gp" "$needle"
                fi
              done
              rm -f /tmp/vgbody.html
            fi

      # /shop icin .htaccess'e acik bir yonlendirme kurali ekledim, deploy gecti, sayfa
      # yine 403 verdi. Iki ihtimal var ve ikisi cok farkli isler gerektiriyor: kural
      # sunucudaki dosyaya HIC ulasmadi (deploy.sh .htaccess'i kopyalamiyor), ya da
      # ulasti ama etkisiz (baska bir .htaccess veya AllowOverride araya giriyor).
      # deploy.sh depoda degil, sadece sunucuda -- o yuzden ne kopyaladigini buradan
      # okumak gerekiyor. Salt-okunur: hicbir sey yazmaz/tasimaz.
      - name: .htaccess ve deploy kapsamı raporu
        if: github.event.inputs.htaccess_report == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 3m
          script: |
            L="$HOME/public_html/.htaccess"; R="$HOME/vestra-repo/vestra/.htaccess"
            echo "== canli .htaccess =="
            ls -l "$L" 2>/dev/null || echo "  YOK: $L"
            echo "== depodaki .htaccess (sunucu klonu) =="
            ls -l "$R" 2>/dev/null || echo "  YOK: $R"
            echo; echo "== shop kurali hangisinde var =="
            for f in "$L" "$R"; do
              if [ -f "$f" ]; then
                if grep -q '\^shop/\?\$' "$f"; then echo "  VAR : $f"; else echo "  YOK : $f"; fi
              fi
            done
            echo; echo "== iki dosya ayni mi =="
            if [ -f "$L" ] && [ -f "$R" ]; then
              if cmp -s "$L" "$R"; then echo "  ayni"; else echo "  FARKLI -- deploy .htaccess'i tasimamis olabilir"; diff "$R" "$L" | head -20; fi
            fi
            echo; echo "== deploy.sh icinde .htaccess/rsync ile ilgili satirlar =="
            if [ -f "$HOME/deploy.sh" ]; then
              grep -n 'rsync\|exclude\|htaccess\|--delete' "$HOME/deploy.sh" | head -25
            else
              echo "  ~/deploy.sh yok"
            fi
            echo; echo "== golge dizin =="
            if [ -d "$HOME/public_html/shop" ]; then
              echo "  VAR: $(ls -ld "$HOME/public_html/shop")"
              echo "  ilk 10 girdi:"; ls -A "$HOME/public_html/shop" | head -10 | sed 's/^/    /'
              # Kural ust dizinde DOGRU duruyor ama /shop hala 403. Geriye tek destekli
              # aciklama olarak bunun icerigi kaliyor: Apache .htaccess'leri docroot'tan
              # asagi dogru BIRLESTIRIR, yani bu dosya da her /shop isteginde okunuyor.
              if [ -f "$HOME/public_html/shop/.htaccess" ]; then
                echo "  -- shop/.htaccess (ilk 40 satir) --"
                sed -n 1,40p "$HOME/public_html/shop/.htaccess" | sed 's/^/    /'
              else
                echo "  shop/.htaccess yok"
              fi
            else
              echo "  yok"
            fi
            # ---- KLASORU GERI GETIREN NE? --------------------------------------
            # /shop dordunc,u kez 403 verdi. Kural ust .htaccess'te DOGRU duruyor ama
            # o dizin kendi RewriteEngine'ini tasidigi icin Apache ust kurallari
            # oraya DEVRETMIYOR; yani bu .htaccess ile cozulemez. Tek cozum dizinin
            # orada OLMAMASI, dolayisiyla onu kimin yarattigini bulmak gerekiyor.
            echo; echo "== klasoru kim geri getiriyor =="
            echo "-- kac kez tasidik (her onarim bir kopya birakiyor) --"
            ls -1d "$HOME"/_golge-shop-* 2>/dev/null | sed 's/^/    /' || echo "    (kopya yok)"
            echo "-- shop/ bir git klonu mu (kimin deploy'u) --"
            if [ -d "$HOME/public_html/shop/.git" ]; then
              git --git-dir="$HOME/public_html/shop/.git" remote -v 2>/dev/null | sed 's/^/    /'
              git --git-dir="$HOME/public_html/shop/.git" log -1 --format='    son commit: %h %ci %s' 2>/dev/null
            else
              echo "    .git yok -- git ile gelmiyorlar"
            fi
            echo "-- dizindeki EN YENI 8 dosya (ne zaman yazildi) --"
            find "$HOME/public_html/shop" -type f -printf '%T@ %TY-%Tm-%Td %TH:%TM  %p\n' 2>/dev/null \
              | sort -rn | head -8 | cut -d' ' -f2- | sed 's/^/    /'
            echo "-- crontab --"
            crontab -l 2>/dev/null | grep -v '^#' | sed 's/^/    /' || echo "    (crontab yok / okunamadi)"
            echo "-- ~/ altinda 'public_html/shop' gecen betikler --"
            grep -rl 'public_html/shop' "$HOME" --include='*.sh' --include='*.php' --include='*.py' \
                 --exclude-dir=public_html --exclude-dir=vestra-repo 2>/dev/null | head -5 | sed 's/^/    /'

            # Bu adimin EN SONUNDA, cunku kutuk uzayinca API yalnizca sonu veriyor:
            # kararin dayandigi tek sayi burasi.
            echo; echo "== /shop simdi =="
            curl -s -o /tmp/s.html -w '  kod=%{http_code}  boyut=%{size_download}B\n' -L https://vestrasales.com/shop
            head -c 200 /tmp/s.html | sed 's/^/    /'; echo

      # Siparisin tarafsiz "order sheet" PDF'ini sunucuda uretir -- orders.csv de urun
      # fotograflari da sadece orada var -- ve cagirana geri verir.
      #
      # PDF log'a ACIK yazilmaz. Bu depo herkese acik, dolayisiyla Actions log'u da oyle;
      # sayfada alici kimligi ve fiyat olmasa bile bir musterinin siparis icerigini herkese
      # acik bir yere birakmak dogru degil. Onun yerine tek kullanimlik bir AES anahtariyla
      # sifrelenir, o anahtar da cagiranin RSA public key'i ile sarilir: log'da yalnizca
      # sifreli metin durur, acabilen tek taraf private key'i elinde tutan calisma olur.
      #
      # Ozet satirlari (satir sayisi, SKU, adet) bilerek yazilmaz; sadece boyut ve SHA-256
      # yazilir, cunku kirpilmis bir log sessizce bozuk PDF uretir ve bunu fark etmek gerekir.
      # "E-posta geldi ama panelde goremiyorum" sorusu, kaydin YOK oldugunu degil,
      # BAKILAN YERDE olmadigini gosterir. Teklif offers.csv'ye, siparis orders.csv'ye
      # yaziliyor ve panelde ayri sekmelerde duruyorlar; ayrica seller.php teklifleri
      # saticinin KENDI SKU'lariyla suzuyor, yani kurasyonlu katalog urunune gelen bir
      # teklifi hicbir satici gormuyor -- sadece admin goruyor. Bu adim dosyalarin
      # kendisine bakiyor, boylece "kayboldu mu" sorusu tahminle cevaplanmiyor.
      - name: Kayıt arama (hangi dosyada duruyor?)
        if: ${{ github.event.inputs.find_ref != '' }}
        env:
          FIND_REF: ${{ github.event.inputs.find_ref }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: FIND_REF
          script: |
            cat > /tmp/vestra_find.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/auth.php";   // hesap kaydi ayri dosyada: data/accounts.json
            $needle = strtolower(trim((string)getenv('FIND_REF')));
            if ($needle === '') { fwrite(STDERR, "arama terimi yok\n"); exit(1); }

            $csvFiles = ['orders.csv','offers.csv','requests.csv','request_offers.csv','signups.csv','groups.csv'];
            /* leads.json BURADA OLMALI. Yoklugunda bu is bir prospect adresi icin
               "hicbir kayit dosyasinda YOK -- kayit gercekten olusmamis" diye kesin
               bir cevap basiyordu; oysa kayit leads.json'da duruyordu ve add-lead
               ayni adres icin "zaten var" diyordu. Yanlis cevabi dogruymus gibi
               basan bir teshis, hic teshis olmamasindan daha kotu: arayan kisi
               aramayi birakip yanlis sonuca gore hareket ediyor. */
            $jsonFiles = ['order_statuses.json','offer_responses.json','listings.json','leads.json'];
            $hits = 0;

            foreach ($csvFiles as $f) {
              $rows = vestra_read_csv($f);
              foreach ($rows as $i => $r) {
                $hay = strtolower(implode(' | ', array_map('strval', $r)));
                if (!str_contains($hay, $needle)) continue;
                $hits++;
                echo "== {$f} (satir ".($i+1)."/".count($rows).") ==\n";
                foreach ($r as $k => $v) {
                  $v = trim((string)$v);
                  if ($v !== '') printf("   %-16s %s\n", $k, mb_substr($v, 0, 120));
                }
                echo "\n";
              }
            }
            foreach ($jsonFiles as $f) {
              $d = vestra_read_json($f);
              $raw = strtolower(json_encode($d, JSON_UNESCAPED_UNICODE));
              if (str_contains($raw, $needle)) { $hits++; echo "== {$f}: eslesme VAR (".count($d)." kayit) ==\n\n"; }
            }

            /* Hesap kaydi ayri dosyada (data/accounts.json) ve aramada YOKTU: "bu alici
               kim, nerede, belgesi var mi" sorusu bu yuzden cevaplanamiyordu.
               Butun kayit basilmiyor -- parola ozeti, oturum ve dogrulama token'lari
               log'a DUSMEMELI; bu depo da log da herkese acik. Sadece is bilgileri.

               Alan adlari KODDAKI adlarla birebir olmali. Ilk surumde 'reg_no'
               yazmistim, gercek ad 'reg_number' (auth.php:204, seller.php:9).
               Yanlis anahtar hata VERMIYOR, sessizce bos donuyor -- ve dolu bir
               alan "bos" diye raporlaniyor. Bir teshis aracinda en kotu hata turu
               budur: yanlis cevabi dogru gibi gosterir. Buraya alan eklerken adi
               kodda dogrulayin. */
            $safe = ['id','type','company','name','email','country','city','address','postcode',
                     'phone','vat_id','reg_number','website','status','kyb_status','membership_status',
                     'membership_tier','created_at','trade_doc_required'];
            foreach (auth_accounts() as $a) {
              $hay = strtolower(implode(' ', array_map(
                fn($k) => (string)($a[$k] ?? ''), $safe
              )));
              if (!str_contains($hay, $needle)) continue;
              $hits++;
              echo "== accounts.json ==\n";
              foreach ($safe as $k) {
                $v = trim((string)($a[$k] ?? ''));
                if ($v !== '') printf("   %-18s %s\n", $k, mb_substr($v, 0, 120));
              }
              /* Belgenin ADI ve boyutu yaziliyor, ICERIGI degil. "approved" isareti
                 neyin yuklendigini soylemiyor -- dosya adi ("gewerbeanmeldung.pdf")
                 cogu zaman soyluyor. Icerik log'a asla dokulmemeli: bu depo herkese
                 acik ve bunlar ucuncu bir sirketin resmi belgeleri. Dosya diskte
                 gercekten duruyor mu diye de bakiliyor: kayitta dosya adi olup
                 diskte olmamasi, "onayli" gorunup elde hicbir sey olmamasi demek. */
              foreach ((array)($a['doc_requests'] ?? []) as $r) {
                $fn = (string)($r['file'] ?? '');
                $note = '(DOSYA YOK)';
                if ($fn !== '') {
                  $p = auth_doc_file_path((string)($a['id'] ?? ''), $fn);
                  $note = is_file($p)
                    ? sprintf('dosya: %s  (%d KB)', $fn, (int)round(filesize($p) / 1024))
                    : sprintf('!! kayitta "%s" var ama DISKTE YOK', $fn);
                }
                printf("   %-18s %-16s -> %-10s %s\n", 'belge',
                  (string)($r['type'] ?? '?'), (string)($r['status'] ?? '?'), $note);
              }
              echo "\n";
            }

            echo $hits === 0
              ? "SONUC: \"{$needle}\" hicbir kayit dosyasinda YOK -- kayit gercekten olusmamis.\n"
              : "SONUC: {$hits} yerde bulundu (yukarida). Kayit DURUYOR; panelde gorunmuyorsa yanlis sekmeye ya da bir suzgece takiliyor.\n";
            PHPEOF
            cd ~/public_html
            cp /tmp/vestra_find.php ./vestra_find_tmp.php
            php ./vestra_find_tmp.php
            rm -f ./vestra_find_tmp.php /tmp/vestra_find.php

      - name: Sipariş denetimi (+ istenirse tarafsız PDF, şifreli)
        if: ${{ github.event.inputs.order_sheet_ref != '' }}
        env:
          SHEET_REF: ${{ github.event.inputs.order_sheet_ref }}
          SHEET_PUBKEY: ${{ github.event.inputs.order_sheet_pubkey }}
          SHEET_DOC: ${{ github.event.inputs.order_doc }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: SHEET_REF,SHEET_PUBKEY,SHEET_DOC
          script: |
            set -e
            cat > /tmp/vestra_sheet.php <<'PHPEOF'
            <?php
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/orders.php";
            require_once $doc."/inc/invoice.php";   // fatura var mi sorusu icin, lazy yuklenmesin
            require_once $doc."/inc/auth.php";       // satici hesabini cozmek icin

            $ref = preg_replace('/[^A-Za-z0-9_-]/', '', (string)getenv('SHEET_REF'));
            if ($ref === '') { fwrite(STDERR, "ref yok\n"); exit(1); }
            $pubRaw = trim((string)getenv('SHEET_PUBKEY'));
            $pub = $pubRaw === '' ? null : openssl_pkey_get_public((string)base64_decode($pubRaw, true));
            if ($pubRaw !== '' && !$pub) { fwrite(STDERR, "public key okunamadi\n"); exit(1); }

            $order = null;
            foreach (vestra_read_csv('orders.csv') as $r) if (($r['ref'] ?? '') === $ref) { $order = $r; break; }
            if (!$order) { fwrite(STDERR, "siparis bulunamadi\n"); exit(1); }

            /* ---- DENETIM ----------------------------------------------------------------
               orders.csv'deki ham "items" alaninda kac kalem var, bunlarin kaci ayristirilip
               panellere/faturaya ulasiyor? Bu ucu birbirini tutmuyorsa satir sessizce
               dusuyor demektir -- boslukli SKU hatasinin belirtisi tam olarak buydu.
               Log herkese acik oldugu icin SKU/adet/tutar DEGIL, sadece sayilar yazilir. */
            $raw    = (string)($order['items'] ?? '');
            $segs   = $raw === '' ? 0 : count(explode(' | ', $raw));
            $parsed = count(vestra_parse_order_items($raw));
            $lines  = vestra_order_lines($order)['lines'];
            $ok     = ($segs === $parsed && $parsed === count($lines));
            echo "items alanindaki kalem   : {$segs}\n";
            echo "ayristirilan satir       : {$parsed}\n";
            echo "vestra_order_lines()     : ".count($lines)."   <- admin/alici/satici paneli ve fatura bunu kullanir\n";
            echo "  => ".($ok ? "TAMAM, satir dusmuyor" : "UYUSMAZLIK -- satir dusuyor")."\n";

            /* Katalogda bulunamayan SKU faturaya "artik listelenmiyor" diye girer. */
            $unmatched = 0; $units = 0; $goods = 0.0; $missing = 0;
            foreach ($lines as $l) {
              if (!vestra_product_by_sku((string)($l['sku'] ?? ''))) $unmatched++;
              $units += (int)($l['qty'] ?? 0);
              $goods += (float)($l['line'] ?? 0);
              $img = (string)($l['image'] ?? '');
              if ($img === '' || !is_file($doc.$img)) $missing++;
            }
            echo "toplam adet              : {$units}\n";
            echo "katalogda bulunamayan SKU: {$unmatched}\n";
            echo "fotosuz satir            : {$missing}\n";

            /* Para kontrolu: mal toplami eksi indirim, orders.csv'deki toplami tutmali.
               Fark escrow'da alici koruma bedeli kadar olur, baska durumda 0 olmali.
               Tutari degil, sadece FARKI yaziyoruz -- 0.00 hicbir sey sizdirmaz. */
            $delta = round((float)($order['total'] ?? 0)
                   - ($goods - (float)($order['discount'] ?? 0) + (float)($order['shipping'] ?? 0)), 2);
            echo "toplam farki (kayitli - mal - navlun): ".number_format($delta, 2)."  "
               .(abs($delta) < 0.01 ? "(tutuyor)" : "(escrow koruma bedeli ya da UYUSMAZLIK)")."\n";

            $inv = function_exists('vestra_invoices_for_ref') ? vestra_invoices_for_ref($ref) : [];
            echo "kesilmis fatura          : ".(count($inv) ?: 'yok (siparis inceleniyor)')."\n";
            echo "GD                       : ".(function_exists('imagecreatefromstring') ? 'var' : 'YOK')."\n";

            if (!$pub) { echo "\n(public key verilmedi -- PDF uretilmedi, sadece denetim)\n"; exit($ok ? 0 : 1); }

            if (strtolower(trim((string)getenv('SHEET_DOC'))) === 'invoice') {
              /* FATURA ONIZLEMESI. vestra_issue_order_invoices() ile AYNI verileri kurar ama
                 hicbir sey yazmaz ve kimseye e-posta gitmez: numara DRAFT, dosya olusmaz,
                 siparis "inceleniyor" durumunda kalir. Amac, kesmeden once gorup onaylamak. */
              /* Alici blogunu gercek kesim ile AYNI fonksiyon kuruyor (vestra_invoice_buyer):
                 onaylanan belge ile kesilen belge birbirinden ayrilamasin. */
              $buyer = vestra_invoice_buyer($order);
              /* Log herkese acik: adresin KENDISI degil, dolu mu ve nereden geldigi yazilir. */
              printf("alici adresi     : %s (%d karakter)\n",
                     $buyer['address'] === '' ? 'YOK -- gumruk/UPS icin eksik'
                       : (str_contains((string)($order['notes'] ?? ''), 'Deliver to:') ? 'siparis notundan' : 'kayitli hesaptan'),
                     mb_strlen($buyer['address']));
              printf("alici ulkesi     : %s\n", $buyer['country'] !== '' ? $buyer['country'] : 'YOK');
              $meta = [
                'ref' => $ref, 'date' => $order['timestamp'] ?? date('c'),
                'discount' => round((float)($order['discount'] ?? 0), 2),
                'voucher_code' => trim((string)($order['voucher_code'] ?? '')),
                'shipping' => round((float)($order['shipping'] ?? 0), 2),
                'shipping_label' => trim((string)($order['shipping_label'] ?? '')),
                'partial_shipments' => !empty($order['partial_shipments']),
                'incoterms' => trim((string)($order['incoterms'] ?? '')),
                'origin' => trim((string)($order['origin'] ?? '')),
                'export_reason' => trim((string)($order['export_reason'] ?? '')),
                'vat_note' => trim((string)($order['vat_note'] ?? '')),
                'buyer' => $buyer,
              ];
              /* Faturayi KIM kesiyor: satirlarin sahibi. Bunu uydurmuyoruz -- urunun
                 seller_uid'i kimse fatura da onun. Birden fazla satici varsa gercek
                 kesimde her birine ayri fatura cikar; onizlemede hepsini gosteriyoruz. */
              $bySeller = [];
              foreach ($lines as $l) { $bySeller[($l['seller_uid'] ?: 'vestra')][] = $l; }
              echo "faturayi kesecek : ".count($bySeller)." taraf\n";
              $parts = [];
              foreach ($bySeller as $sid => $items) {
                $acc = null;
                if ($sid !== 'vestra') foreach (auth_accounts() as $a) if (($a['id'] ?? '') === $sid) { $acc = $a; break; }
                $who = $acc ? ($acc['company'] ?: ($acc['name'] ?: $sid)) : 'VESTRA (acerasoft LLC)';
                /* Banka alanlari faturanin odeme kutusunu olusturuyor. DEGERLERI yazmiyoruz
                   (log herkese acik), sadece dolu mu bos mu. */
                $bankSet = $acc ? array_filter([
                  'bank_name' => !empty($acc['bank_name']), 'bank_holder' => !empty($acc['bank_holder']),
                  'bank_iban' => !empty($acc['bank_iban']), 'bank_bic' => !empty($acc['bank_bic']),
                ]) : [];
                printf("  %-28s %2d satir | banka alanlari: %s\n", mb_substr($who,0,26), count($items),
                       $acc ? (count($bankSet)."/4 dolu".(count($bankSet)<4 ? ' -- ODEME KUTUSU EKSIK CIKAR' : '')) : 'satici hesabi yok');
                $parts[] = vestra_render_invoice_pdf($meta, $items, $acc, 'DRAFT-PREVIEW');
              }
              /* Birden fazla satici varsa ilkini gonderiyoruz; digerlerini ayri istersen
                 kesimde zaten ayri dosya olarak cikacaklar. */
              $pdf = $parts[0];
              echo "onizleme         : fatura (KESILMEDI, kaydedilmedi, e-posta gitmedi)\n";
            } else {
              $pdf = vestra_render_order_sheet_pdf($order, $lines);
            }
            echo "bayt       : ".strlen($pdf)."\n";
            echo "sha256     : ".hash('sha256', $pdf)."\n";
            /* Tarafsiz sayfada marka izi kalmamali -- isin amaci bu. Faturada TAM TERSI:
               VESTRA basligi olmasi gerekiyor, o yuzden kontrol sadece sheet icin. */
            if (strtolower(trim((string)getenv('SHEET_DOC'))) !== 'invoice')
              foreach (['VESTRA','vestrasales','acerasoft'] as $n)
                echo "  iz {$n}: ".(str_contains($pdf, $n) ? 'VAR (HATA)' : 'yok')."\n";

            $aes = random_bytes(32); $iv = random_bytes(16);
            $ct  = openssl_encrypt($pdf, 'aes-256-cbc', $aes, OPENSSL_RAW_DATA, $iv);
            if ($ct === false || !openssl_public_encrypt($aes, $ek, $pub, OPENSSL_PKCS1_OAEP_PADDING)) {
              fwrite(STDERR, "sifreleme basarisiz\n"); exit(1);
            }
            /* Actions log'u secret degerlerini *** ile maskeliyor, ve DEPLOY_PORT gibi iki
               karakterlik bir deger rastgele base64 icinde ortalama her ~4000 karakterde bir
               denk geliyor: ilk denemede govde 22 yerden sessizce bozuldu. Rakamlari, log
               satirinin zaman damgasinda gecmeyen noktalama ile degistirip alfabeden tamamen
               cikariyoruz -- boylece kisa sayisal bir secret hicbir yere denk gelemez. */
            $enc = fn(string $b) => strtr(base64_encode($b), '0123456789', '!$%&#,;?@~');
            echo "KEY ".$enc($ek)."\n";
            echo "IV  ".$enc($iv)."\n";
            echo "-----BEGIN SHEET ENC-----\n";
            foreach (str_split($enc($ct), 200) as $chunk) echo $chunk."\n";
            echo "-----END SHEET ENC-----\n";
            PHPEOF
            php -l /tmp/vestra_sheet.php
            php /tmp/vestra_sheet.php
            rm -f /tmp/vestra_sheet.php

      # "IP tespiti kesinlikle calissin" -- sart ancak olculebilirse tutulur.
      # Bu adim SUNUCUDAN, gercek kodu cagirarak bilinen adresleri sorar ve
      # beklenen ulkeyle karsilastirir. Onbellek atlanir: amac hattin su anda
      # calisip calismadigini gormek, daha once kaydedilmis cevabi degil.
      - name: IP tespiti sınaması (canlı)
        if: github.event.inputs.ip_probe == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 4m
          script: |
            cat > /tmp/vestra_ipprobe.php <<'PHPEOF'
            <?php
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/security.php";

            echo "===== 1. HAM BAGLANTI (saglayicilara ulasiliyor mu) =====\n";
            $tests = [
              'ip-api (HTTP)'  => 'http://ip-api.com/json/8.8.8.8?fields=status,countryCode,proxy,hosting',
              'ipwho.is (TLS)' => 'https://ipwho.is/8.8.8.8',
            ];
            foreach ($tests as $name => $u) {
              $t0 = microtime(true);
              $ch = curl_init($u);
              curl_setopt_array($ch, [CURLOPT_RETURNTRANSFER=>true, CURLOPT_TIMEOUT=>5, CURLOPT_CONNECTTIMEOUT=>5]);
              $r = curl_exec($ch); $c = curl_getinfo($ch, CURLINFO_HTTP_CODE); $e = curl_error($ch); curl_close($ch);
              printf("  %-16s HTTP %-3s %5d ms  %s\n", $name, $c ?: '---',
                     (int)((microtime(true)-$t0)*1000),
                     $c >= 200 && $c < 300 ? 'CEVAP VAR' : ('BASARISIZ '.$e));
            }

            echo "\n===== 2. GERCEK KOD: vestra_ip_intel() =====\n";
            /* Onbellegi atla: bu sinama "hat su anda calisiyor mu" diye soruyor. */
            @unlink(vestra_data_dir().'/ip_intel.json');
            $cases = [
              '8.8.8.8'        => ['US', 'Google DNS — hosting bayragi beklenir'],
              '1.1.1.1'        => ['',   'Cloudflare — ulke degisebilir, dolu gelmesi yeter'],
              '78.46.0.1'      => ['DE', 'Hetzner Almanya — hosting/VPN beklenir'],
              '212.58.244.20'  => ['GB', 'BBC Londra'],
            ];
            $pass = 0; $total = 0;
            foreach ($cases as $ip => [$want, $note]) {
              $total++;
              $t0 = microtime(true);
              $i = vestra_ip_intel($ip);
              $ms = (int)((microtime(true)-$t0)*1000);
              $got = (string)($i['cc'] ?? '');
              $good = $got !== '' && ($want === '' || $got === $want);
              if ($good) $pass++;
              printf("  %-15s -> %-3s %-22s vpn=%s  %4d ms  %s\n",
                     $ip, $got ?: '??', mb_substr((string)($i['country'] ?? ''), 0, 22),
                     (!empty($i['proxy']) || !empty($i['hosting'])) ? 'EVET' : 'hayir',
                     $ms, $good ? 'TAMAM' : '<-- BASARISIZ ('.$note.')');
            }
            printf("\n  sonuc: %d/%d\n", $pass, $total);

            echo "\n===== 3. ONBELLEK YAZILDI MI =====\n";
            $cf = vestra_data_dir().'/ip_intel.json';
            printf("  %s : %s\n", basename($cf), is_file($cf) ? count(_vsec_read('ip_intel.json')).' kayit' : 'YOK <-- yazilamiyor');
            printf("  data dizini yazilabilir : %s\n", is_writable(vestra_data_dir()) ? 'EVET' : 'HAYIR');

            echo "\n===== 4. ULKEYE GORE BELGE ADI =====\n";
            require_once $doc."/inc/auth.php";
            foreach (['DE','AT','FR','IT','ES','NL','GB','IE','TR','US',''] as $cc)
              printf("  %-3s -> %s\n", $cc ?: '(yok)', auth_trade_doc_phrase($cc));

            exit($pass === $total ? 0 : 1);
            PHPEOF
            php -l /tmp/vestra_ipprobe.php 2>&1
            php /tmp/vestra_ipprobe.php 2>&1
            rm -f /tmp/vestra_ipprobe.php

      # "Dogru e-postayla giremiyorum" -- giris auth_find ile TAM eslesme ister.
      # Hesap bir yazim farkiyla kayitliysa (bosluk, %20 artigi, farkli alan adi,
      # + eki) kullanici "dogru" adresi yazar, sistem "hesap yok" gorur ve ikisi de
      # hakli olur. Bu adim hesaplari MASKELI dokerek farki gorunur kilar: adresin
      # tamami degil, ilk 2 harf + alan adi yazilir -- log herkese acik.
      - name: Hesap raporu (maskeli) + hata günlüğü
        if: github.event.inputs.accounts_report == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 3m
          script: |
            cat > /tmp/vestra_accrep.php <<'PHPEOF'
            <?php
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/auth.php";

            echo "===== HESAPLAR (maskeli) =====\n";
            $accs = auth_accounts();
            printf("toplam hesap: %d\n\n", count($accs));
            printf("%-26s %-7s %-14s %-10s %-12s %s\n", "E-POSTA (maskeli)", "TIP", "DURUM", "KYB", "BELGE", "KAYIT");
            foreach ($accs as $a) {
              $e = (string)($a['email'] ?? '');
              $at = strrpos($e, '@');
              /* Maske: yerel kismin ilk 2 karakteri + uzunlugu + alan adi. Bosluk ve
                 gorunmez karakterler koseli parantezle GOSTERILIR -- aranan kusur tam bu. */
              $local = $at !== false ? substr($e, 0, $at) : $e;
              $dom   = $at !== false ? substr($e, $at) : '';
              $vis   = mb_substr($local, 0, 2);
              $vis   = preg_replace('/[^\x21-\x7E]/', '[?]', $vis);   // gorunmez karakteri isaretle
              $mask  = $vis.str_repeat('*', max(0, mb_strlen($local) - 2)).$dom;
              if ($e !== trim($e)) $mask = '[BOSLUKLU!] '.$mask;
              if (str_starts_with($e, '%')) $mask = '[KODLAMA-ARTIGI!] '.$mask;
              /* Belge durumu: trade_licence istegi var mi, durumu ne? */
              $docSt = '-';
              foreach ((array)($a['doc_requests'] ?? []) as $dr) {
                if (($dr['type'] ?? '') === 'trade_licence') { $docSt = (string)($dr['status'] ?? '?'); break; }
              }
              printf("%-26s %-7s %-14s %-10s %-12s %s\n",
                $mask, (string)($a['type'] ?? '?'), (string)($a['status'] ?? '?'),
                (string)($a['kyb_status'] ?? '-'), $docSt, substr((string)($a['created_at'] ?? ''), 0, 10));
            }

            echo "\n===== HATA GUNLUGU: SON 25 SATIR (posta harici her sey) =====\n";
            foreach ([$doc.'/error_log', getenv("HOME").'/logs/error_log'] as $lg) {
              if (!is_readable($lg)) continue;
              $tail = array_slice(file($lg, FILE_IGNORE_NEW_LINES|FILE_SKIP_EMPTY_LINES), -25);
              echo "-- ".$lg." --\n";
              foreach ($tail as $h) echo "  ".substr($h, 0, 220)."\n";
            }
            PHPEOF
            php -l /tmp/vestra_accrep.php 2>&1
            php /tmp/vestra_accrep.php 2>&1
            rm -f /tmp/vestra_accrep.php

      # "Giristen sonra yine kayit/giris goruyorum" -- oturum duzeltmesi yerelde
      # dogrulandi ama sikayet canlida surdu. Bu adim ayni akisi CANLI sitede,
      # runner'dan kosuyor: test hesabiyla giris, ayni cerez kavanozuyla anasayfa,
      # ve dugmelerin hangisi ciktigi. Tarayici/onbellek/etki alani degiskenlerini
      # tek tek gorunur kiliyor; SSH gerektirmiyor.
      - name: Canlı giriş sınaması (oturum kalıcı mı?)
        if: github.event.inputs.login_probe == 'true'
        run: |
          set -e
          BASE="https://vestrasales.com"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36"
          JAR=$(mktemp)
          echo "===== 1. GIRIS (POST /login) ====="
          # Test hesabi send-verify-test.yml'nin kurdugu kayit; parolasi zaten o
          # dosyada acikta duruyor, yeni bir sey sizdirmiyoruz.
          curl -sS -A "$UA" -c "$JAR" -b "$JAR" -D /tmp/h1.txt -o /tmp/b1.html \
            -d 'email=acerasoft%2Bverifytest%40gmail.com&password=Test12345!' \
            --max-time 30 "$BASE/login"
          grep -i '^HTTP\|^location' /tmp/h1.txt | head -4
          echo "-- Set-Cookie parametreleri (deger maskeli) --"
          grep -i '^set-cookie' /tmp/h1.txt | sed -E 's/=(.[^;]{6})[^;]*/=\1…/' || echo "  (giris cerez VERMEDI — parola tutmadi ya da akis degisti)"
          echo
          echo "===== 2. ANASAYFA (ayni cerezle) ====="
          curl -sS -A "$UA" -c "$JAR" -b "$JAR" -D /tmp/h2.txt -o /tmp/b2.html --max-time 30 "$BASE/"
          grep -i '^HTTP\|^cache-control\|^x-litespeed-cache\|^age:' /tmp/h2.txt | head -6
          if grep -q 'Open my' /tmp/b2.html; then echo "SONUC: GIRISLI goruyor — 'Open my panel' cikti. Oturum canlida da calisiyor."
          elif grep -q 'Register as Seller' /tmp/b2.html; then echo "SONUC: GIRISSIZ goruyor — hala kayit dugmeleri. Oturum anasayfada TANINMIYOR."
          else echo "SONUC: beklenmedik govde — dugme metinleri bulunamadi"; fi
          echo
          echo "===== 3. AYNI CEREZLE www ALT ALAN ====="
          # Cerez vestrasales.com'a yazildiysa ve ziyaretci bir sonraki gelisinde
          # www.vestrasales.com'a duserse oturum 'kaybolmus' gorunur — klasik tuzak.
          curl -sS -A "$UA" -c "$JAR" -b "$JAR" -D /tmp/h3.txt -o /tmp/b3.html --max-time 30 "https://www.vestrasales.com/" || true
          grep -i '^HTTP\|^location' /tmp/h3.txt | head -3
          if grep -qi '^location: https://vestrasales.com' /tmp/h3.txt; then echo "www -> ana alan adina YONLENIYOR (dogru: tek cerez alani)"
          elif grep -q 'Open my' /tmp/b3.html; then echo "www uzerinde de girisli gorunuyor"
          elif grep -q 'Register as Seller' /tmp/b3.html; then echo "UYARI: www uzerinde GIRISSIZ — cerez alan adi tuzagi BU. www ana alana yonlendirilmeli."
          fi
          echo
          echo "===== 4. /buyer (panel gercekten aciliyor mu) ====="
          code=$(curl -sS -A "$UA" -c "$JAR" -b "$JAR" -o /tmp/b4.html -w '%{http_code}' --max-time 30 "$BASE/buyer")
          echo "HTTP $code"
          grep -qi 'login\|sign in' /tmp/b4.html && grep -q 'authcard' /tmp/b4.html && echo "UYARI: panel yerine giris sayfasi geldi" || echo "panel govdesi geldi"
          rm -f "$JAR"

      # "Sifremi unuttum calismiyor" -- forgot.php TASARIM GEREGI hep ayni cevabi
      # veriyor ("link yolda"), cunku aksi halde hangi adresin kayitli oldugunu
      # sizdirirdi. Dogru bir karar, ama teshis icin sifir bilgi: hesap yok da olsa,
      # IP kotasi dolmus da olsa, posta ayari kapali da olsa ekranda ayni yesil
      # kutu cikiyor. Bu adim ayni yolu adim adim yurutup HANGISI oldugunu soyluyor.
      - name: Şifre sıfırlama teşhisi
        if: ${{ github.event.inputs.reset_probe != '' }}
        env:
          RESET_EMAIL: ${{ github.event.inputs.reset_probe }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 4m
          envs: RESET_EMAIL
          script: |
            cd ~/public_html
            cat > /tmp/vestra_reset_probe.php <<'PHPEOF'
            <?php
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/auth.php";
            require_once $doc."/inc/notify.php";
            require_once $doc."/inc/i18n.php";

            $email = strtolower(trim((string)getenv('RESET_EMAIL')));
            echo "===== 1. ADRES =====\n";
            printf("gecerli bicim          : %s\n", filter_var($email, FILTER_VALIDATE_EMAIL) ? "EVET" : "HAYIR <-- form burada durur");
            if (!filter_var($email, FILTER_VALIDATE_EMAIL)) exit(1);

            echo "\n===== 2. HESAP =====\n";
            $acc = auth_find($email);
            printf("hesap var mi           : %s\n", $acc ? "EVET" : "YOK  <-- forgot.php sessizce hicbir sey yapmaz, ekran yine 'link yolda' der");
            if ($acc) {
              printf("  durum                : %s\n", (string)($acc['status'] ?? '(bos)'));
              printf("  kayitli e-posta      : %s\n", (string)($acc['email'] ?? '') === $email ? "girilen ile ayni" : "FARKLI: ".(string)($acc['email'] ?? ''));
            }

            echo "\n===== 3. IP KOTASI =====\n";
            /* forgot.php IP basina 15 dakikada 8 istek sayiyor ve dolunca hicbir sey
               gondermeden ayni yesil kutuyu gosteriyor. Tekrar tekrar deneyen biri
               kendi kendini susturur -- ve bunu ekranda goremez. */
            /* Dosya adini tahmin etmiyoruz: auth.php'nin kendi sabiti okunuyor,
               boylece yol degisirse teshis sessizce "kayit yok" demiyor. */
            $tf = defined('VESTRA_THROTTLE') ? VESTRA_THROTTLE : (vestra_data_dir().'/login_throttle.json');
            $t  = is_readable($tf) ? (json_decode((string)file_get_contents($tf), true) ?: []) : [];
            printf("kota dosyasi           : %s\n", is_readable($tf) ? $tf : $tf." (okunamadi)");
            $n = 0;
            foreach ($t as $k => $e) {
              if (strpos((string)$k, 'reset|') !== 0) continue;
              $n++;
              $age = time() - (int)($e['first'] ?? 0);
              $ip  = substr((string)$k, 6);
              $ipm = preg_replace('/\.\d+$/', '.x', $ip);   // son sekizli maskeli: log herkese acik
              printf("  %-18s deneme=%d  yas=%ds  %s\n", $ipm, (int)($e['n'] ?? 0), $age,
                     ((int)($e['n'] ?? 0) >= 8 && $age < 900) ? "<-- SUSTURULMUS" : "");
            }
            if (!$n) echo "  reset kaydi yok (kimse kota sinirinda degil)\n";

            echo "\n===== 4. POSTA AYARI =====\n";
            printf("mail_enabled           : %s\n", vestra_cfg('mail_enabled', false) ? "acik" : "KAPALI <-- vestra_send_mail hicbir sey gondermeden false doner");
            printf("mail_from              : %s\n", (string)vestra_cfg('mail_from', '(bos)'));
            printf("API anahtari           : %s\n", ((string)vestra_cfg('mail_api_key','') !== '') ? "var" : "yok");
            printf("SMTP host              : %s\n", ((string)vestra_cfg('smtp_host','') !== '') ? "var" : "yok");
            printf("SMTP parola            : %s\n", ((string)vestra_cfg('smtp_pass','') !== '') ? "var" : "yok");

            echo "\n===== 5. GERCEK GONDERIM =====\n";
            /* Hesap yoksa gonderim atlanir ama betik DEVAM EDER: 6. bolumdeki gunluk
               izleri tam da bu durumda en degerli kanit -- erken exit onlari yutuyordu. */
            $fail = false;
            if (!$acc) { echo "hesap olmadigi icin gonderilmedi.\n"; $fail = true; }
            else {
              $a2 = auth_reset_begin($email);
              printf("token uretildi         : %s\n", ($a2 && !empty($a2['reset_token'])) ? "EVET" : "HAYIR");
              if (!$a2) { $fail = true; }
              else {
                $link = 'https://vestrasales.com/reset?token='.$a2['reset_token'];
                $name = ($a2['name'] ?: ($a2['company'] ?: 'there'));
                [$subj, $body, $o] = vestra_reset_text('en', $name, $link);
                printf("konu                   : %s\n", $subj);
                $ok = vestra_send_mail($a2['email'], $subj, $body, '', '', null, '', $o);
                printf("vestra_send_mail()     : %s\n", $ok ? "TRUE — posta saglayicisi kabul etti" : "FALSE <-- ISTE SORUN BURADA");
                echo "  (link log'a YAZILMADI: bu depo ve bu kutuk herkese acik, token tek basina hesabi acar)\n";
                if (!$ok) $fail = true;
              }
            }

            echo "\n===== 6. HATA GUNLUGU (son posta izleri) =====\n";
            foreach ([$doc.'/error_log', getenv("HOME").'/logs/error_log'] as $lg) {
              if (!is_readable($lg)) continue;
              $tail = array_slice(file($lg, FILE_IGNORE_NEW_LINES|FILE_SKIP_EMPTY_LINES), -800);
              /* 'VESTRA reset' satirlari forgot.php'nin yeni iziyle dusuyor: her deneme
                 "hesap yok" / "GONDERILEMEDI" / "kota dolu" olarak kayda geciyor. Adres
                 kaydedilmiyor ama HANGI durumun yasandigi kayitli -- "gelmiyor" sikayetinin
                 cevabi tam bu satirlarda. */
              $hits = array_values(array_filter($tail, fn($l) => stripos($l,'VESTRA reset') !== false || stripos($l,'mail') !== false || stripos($l,'smtp') !== false || stripos($l,'brevo') !== false));
              printf("%s: %d ilgili satir\n", $lg, count($hits));
              foreach (array_slice($hits, -20) as $h) echo "  ".substr($h, 0, 200)."\n";
            }
            exit($fail ? 1 : 0);
            PHPEOF
            php -l /tmp/vestra_reset_probe.php 2>&1
            php /tmp/vestra_reset_probe.php 2>&1
            rm -f /tmp/vestra_reset_probe.php

      # "Siparis silinmiyor" tek basina uc ayri seyi kastedebilir: kod canliya cikmamis,
      # dosya yazilamiyor, ya da silme kodu ISTEYEREK reddediyor (faturasi olan ref).
      # Ucu de ayni ekrani veriyor -- sayfa yenileniyor ve satir yerinde duruyor.
      # Bu adim hangisi oldugunu tahminle degil sunucudan okuyarak soyluyor.
      # Log herkese acik: alici adi/e-postasi/tutari YAZILMAZ, sadece ref ve sayilar.
      - name: Sipariş silme teşhisi
        if: github.event.inputs.order_delete_check == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 4m
          script: |
            cat > /tmp/vestra_orddel.php <<'PHPEOF'
            <?php
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/orders.php";
            require_once $doc."/inc/invoice.php";
            /* auth.php olmadan vestra_invoices_for_ref() icindeki auth_accounts()
               tanimsiz kaliyor ve betik, display_errors kapali oldugu icin hicbir
               sey yazmadan tam ortasinda susuyordu. */
            require_once $doc."/inc/auth.php";

            echo "===== 1. KOD CANLIDA MI =====\n";
            $adm = (string)@file_get_contents($doc."/admin.php");
            $ord = (string)@file_get_contents($doc."/inc/orders.php");
            printf("admin.php                 : %d bayt, %s\n", strlen($adm), date('Y-m-d H:i', (int)@filemtime($doc."/admin.php")));
            printf("inc/orders.php            : %d bayt, %s\n", strlen($ord), date('Y-m-d H:i', (int)@filemtime($doc."/inc/orders.php")));
            /* Her ihtiyaci KENDI dosyasinda ara. Iptal sabiti admin.php'de gecmiyor
               (panel onu vestra_order_settable_statuses() uzerinden goruyor), bu yuzden
               orada aramak "eski surum canlida" diyen yanlis bir alarm uretiyordu. */
            foreach ([
              "order_delete islemi"   => [$adm, "\$act==='order_delete'"],
              "silme dugmesi (form)"  => [$adm, 'value="order_delete"'],
              "yine de sil (force)"   => [$adm, "name=\"force\""],
              "vestra_order_delete()" => [$ord, 'function vestra_order_delete'],
              "iptal durumu"          => [$ord, 'VESTRA_ORDER_CANCELLED'],
            ] as $label => [$hay, $needle]) {
              printf("  %-24s : %s\n", $label, str_contains($hay, $needle) ? "VAR" : "YOK  <-- eski surum canlida");
            }

            echo "\n===== 2. DOSYA YAZILABILIR MI =====\n";
            $dir  = vestra_data_dir();
            $file = $dir.'/orders.csv';
            printf("data dizini               : %s\n", is_dir($dir) ? "var (".substr(sprintf('%o', @fileperms($dir)), -4).")" : "YOK");
            printf("  dizin yazilabilir       : %s   <- rename() bunu ister, dosyanin kendisini degil\n", is_writable($dir) ? "EVET" : "HAYIR  <-- silme buradan patlar");
            printf("orders.csv                : %s\n", is_file($file) ? number_format(filesize($file))." bayt (".substr(sprintf('%o', @fileperms($file)), -4).")" : "YOK");
            $probe = $dir.'/.deltest.'.getmypid();
            $wrote = @file_put_contents($probe, "x") !== false;
            $moved = $wrote && @rename($probe, $probe.'.2');
            @unlink($probe); @unlink($probe.'.2');
            printf("  deneme yazma            : %s\n", $wrote ? "TAMAM" : "BASARISIZ");
            printf("  deneme rename           : %s\n", $moved ? "TAMAM" : "BASARISIZ");

            echo "\n===== 3. DAHA ONCE SILME DENENMIS MI =====\n";
            $baks = glob($dir.'/orders.csv.bak-del-*') ?: [];
            if (!$baks) {
              echo "  yedek yok -> silme kodu HIC calismadi, ya da fatura/ref kontrolunden geri dondu\n";
            } else {
              /* Yedek varsa kod calismis demektir: o zaman soru "neden silmiyor" degil,
                 "neden geri geliyor". Yedek ile canli dosyanin satir sayisini kiyasla. */
              sort($baks);
              foreach (array_slice($baks, -5) as $b) {
                printf("  %s  %s satir\n", basename($b), max(0, count(file($b, FILE_IGNORE_NEW_LINES|FILE_SKIP_EMPTY_LINES)) - 1));
              }
              printf("  canli orders.csv        : %d satir\n", max(0, count(file($file, FILE_IGNORE_NEW_LINES|FILE_SKIP_EMPTY_LINES)) - 1));
            }

            echo "\n===== 4. HANGI SIPARISLER FATURASI YUZUNDEN SILINEMIYOR =====\n";
            $rows = vestra_read_csv('orders.csv');
            printf("siparis sayisi            : %d\n", count($rows));
            $blocked = []; $free = [];
            foreach ($rows as $r) {
              $ref = (string)($r['ref'] ?? ''); if ($ref === '') continue;
              if (vestra_invoices_for_ref($ref)) $blocked[] = $ref; else $free[] = $ref;
            }
            printf("faturasi VAR (silinemez)  : %d\n", count($blocked));
            printf("faturasi YOK (silinebilir): %d\n", count($free));
            if ($blocked) echo "  kilitli ref'ler: ".implode(', ', array_slice($blocked, 0, 25)).(count($blocked) > 25 ? ' …' : '')."\n";
            if ($free)    echo "  serbest ref'ler: ".implode(', ', array_slice($free, 0, 25)).(count($free) > 25 ? ' …' : '')."\n";

            echo "\n===== 5. PHP HATA GUNLUGU (admin) =====\n";
            $logs = [$doc.'/error_log', getenv("HOME").'/logs/error_log', $doc.'/php_errorlog'];
            $seen = false;
            foreach ($logs as $lg) {
              if (!is_readable($lg)) continue;
              $seen = true;
              $tail = array_slice(file($lg, FILE_IGNORE_NEW_LINES|FILE_SKIP_EMPTY_LINES), -400);
              $hits = array_values(array_filter($tail, fn($l) => stripos($l, 'admin.php') !== false || stripos($l, 'fputcsv') !== false || stripos($l, 'orders.csv') !== false));
              printf("%s: son 400 satirda %d ilgili kayit\n", $lg, count($hits));
              foreach (array_slice($hits, -8) as $h) echo "  ".substr($h, 0, 200)."\n";
            }
            if (!$seen) echo "  okunabilir hata gunlugu bulunamadi\n";
            PHPEOF
            # 2>&1: bir ayristirma hatasi stderr'e gidiyor ve log'da "Errors parsing"
            # disinda hicbir sey gorunmuyordu -- yani hatanin kendisi degil, sadece
            # oldugu bilgisi. Satir numarasi olmadan bu bir tur bilmece.
            php -l /tmp/vestra_orddel.php 2>&1
            php /tmp/vestra_orddel.php 2>&1
            rm -f /tmp/vestra_orddel.php

      # "Siteye kac kisi girmis" sorusunun cevabi ancak sayac GERCEKTEN yaziyorsa
      # dogru. Bu adim canli sunucuda gercek sayfa istekleri atip sayacin artip
      # artmadigina bakiyor -- ve olcum bittiginde dosyayi eski haline koyuyor.
      - name: Ziyaretçi sayacı sınaması (canlı)
        if: github.event.inputs.visits_probe == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 4m
          script: |
            cat > /tmp/vestra_visits.php <<'PHPEOF'
            <?php
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/security.php";

            $base = 'https://vestrasales.com';
            $UA   = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36';

            echo "===== 1. CANLI DOSYALARDA KOD VAR MI =====\n";
            $need = [
              'inc/security.php' => ['function vestra_track_visit', 'function vestra_visits_range', 'visits_live.json'],
              'inc/auth.php'     => ['vestra_track_visit()'],
              'admin.php'        => ["tab==='traffic'", 'vestra_visits_live()'],
            ];
            $missing = 0;
            foreach ($need as $rel => $needles) {
              $src = @file_get_contents($doc.'/'.$rel);
              if ($src === false) { printf("  %-18s OKUNAMADI <-- dosya yok\n", $rel); $missing++; continue; }
              foreach ($needles as $n) {
                $ok = str_contains($src, $n);
                if (!$ok) $missing++;
                printf("  %-18s %-28s %s\n", $rel, mb_substr($n, 0, 28), $ok ? 'var' : 'YOK <-- eski surum');
              }
            }

            echo "\n===== 2. DIZIN VE YAZILABILIRLIK =====\n";
            $vd = vestra_visits_dir();
            printf("  %-34s %s\n", $vd, is_dir($vd) ? 'var' : 'YOK');
            printf("  %-34s %s\n", 'yazilabilir mi', is_writable($vd) ? 'EVET' : 'HAYIR <-- sayac yazamaz');
            printf("  %-34s %s\n", 'web erisimine kapali mi (.htaccess)',
                   is_file(vestra_data_dir().'/.htaccess') ? 'EVET' : 'HAYIR <-- data/.htaccess eksik');

            /* Sinama gercek rakamlari kirletmesin: once yedek, sonunda geri. Bu adim bir
               ziyaretci uyduruyor; operatorun "bugun kac kisi geldi" sayisi bundan etkilenirse
               olcum aracinin kendisi olcumu bozmus olur. */
            $today    = date('Y-m-d');
            $dayFile  = $vd.'/'.$today.'.json';
            $liveFile = vestra_data_dir().'/visits_live.json';
            $snapDay  = is_file($dayFile)  ? file_get_contents($dayFile)  : null;
            $snapLive = is_file($liveFile) ? file_get_contents($liveFile) : null;

            $before = vestra_visits_day($today);
            printf("\n  yedek alindi: %s (%s), %s (%s)\n",
                   basename($dayFile),  $snapDay  === null ? 'dosya yoktu' : strlen($snapDay).' bayt',
                   basename($liveFile), $snapLive === null ? 'dosya yoktu' : strlen($snapLive).' bayt');

            echo "\n===== 3. GERCEK SAYFA ISTEKLERI =====\n";
            $jar = tempnam(sys_get_temp_dir(), 'vjar');
            $get = function (string $path) use ($base, $UA, $jar): array {
              $t0 = microtime(true);
              $ch = curl_init($base.$path);
              curl_setopt_array($ch, [
                CURLOPT_RETURNTRANSFER => true, CURLOPT_FOLLOWLOCATION => true,
                CURLOPT_TIMEOUT => 20, CURLOPT_CONNECTTIMEOUT => 10,
                CURLOPT_USERAGENT => $UA, CURLOPT_COOKIEJAR => $jar, CURLOPT_COOKIEFILE => $jar,
              ]);
              $body = curl_exec($ch);
              $code = (int)curl_getinfo($ch, CURLINFO_HTTP_CODE);
              $err  = curl_error($ch);
              curl_close($ch);
              return [$code, (int)((microtime(true) - $t0) * 1000), is_string($body) ? strlen($body) : 0, $err];
            };

            $plan = [['/', 'sayilmali'], ['/shop', 'sayilmali'], ['/', 'sayilmali (ayni oturum -> uniq artmamali)'], ['/admin', 'SAYILMAMALI']];
            $reached = 0;
            foreach ($plan as [$p, $note]) {
              [$code, $ms, $len, $err] = $get($p);
              if ($code >= 200 && $code < 400) $reached++;
              printf("  GET %-8s HTTP %-3d %5d ms %7d bayt   %s%s\n", $p, $code, $ms, $len, $note, $err ? '  hata: '.$err : '');
            }
            @unlink($jar);

            if ($reached === 0) {
              echo "\n  !! Sunucu kendi adresine hic ulasamadi (guvenlik duvari ya da DNS).\n";
              echo "     Sayac calisiyor mu sorusu bu adimla cevaplanamaz; asagidaki fark bos cikacak.\n";
            }

            echo "\n===== 4. SAYAC NE OLDU =====\n";
            clearstatcache();
            $after = vestra_visits_day($today);
            printf("  %-24s once %-6d sonra %-6d fark %+d\n", 'gorunum (hits)', (int)$before['hits'], (int)$after['hits'], (int)$after['hits'] - (int)$before['hits']);
            printf("  %-24s once %-6d sonra %-6d fark %+d\n", 'ziyaretci (uniq)', (int)$before['uniq'], (int)$after['uniq'], (int)$after['uniq'] - (int)$before['uniq']);
            $dh = (int)$after['hits'] - (int)$before['hits'];
            $du = (int)$after['uniq'] - (int)$before['uniq'];
            printf("\n  beklenen: hits +3 (/, /shop, / — /admin sayilmaz), uniq +1\n");
            printf("  sonuc   : %s\n", ($dh === 3 && $du === 1) ? 'TAMAM' : ($reached === 0 ? 'SINANAMADI (yukariya bakin)' : 'BEKLENENDEN FARKLI <-- incelenmeli'));

            $live = vestra_visits_live();
            printf("\n  canli listede %d kayit", count($live));
            if ($live) {
              $f = reset($live);
              printf(" (ornek: %s %s, sayfa %s, %d sn once)",
                     (string)($f['cc'] ?? '??'), (string)($f['city'] ?? ''), (string)($f['path'] ?? ''), time() - (int)($f['ts'] ?? 0));
            }
            echo "\n";

            echo "\n===== 5. SON 7 GUN (yedek geri konmadan ONCE) =====\n";
            $r7 = vestra_visits_range(7);
            foreach ($r7['series'] as $ymd => $s) printf("  %s  ziyaretci %-5d gorunum %-5d\n", $ymd, (int)$s['uniq'], (int)$s['hits']);
            printf("  toplam: %d ziyaretci / %d gorunum\n", (int)$r7['uniq'], (int)$r7['hits']);
            if ($r7['cc']) { echo "  ulkeler: "; $o = []; foreach (array_slice($r7['cc'], 0, 8, true) as $k => $v) $o[] = "$k=$v"; echo implode('  ', $o)."\n"; }

            echo "\n===== 6. YEDEK GERI KONUYOR =====\n";
            if ($snapDay === null) { @unlink($dayFile);  echo "  gunluk dosya sinamadan once yoktu -> silindi\n"; }
            else { file_put_contents($dayFile, $snapDay);  echo "  gunluk sayac eski haline dondu\n"; }
            if ($snapLive === null) { @unlink($liveFile); echo "  canli liste sinamadan once yoktu -> silindi\n"; }
            else { file_put_contents($liveFile, $snapLive); echo "  canli liste eski haline dondu\n"; }
            $chk = vestra_visits_day($today);
            printf("  dogrulama: hits %d, uniq %d (sinama oncesiyle ayni olmali: %d / %d)\n",
                   (int)$chk['hits'], (int)$chk['uniq'], (int)$before['hits'], (int)$before['uniq']);

            exit(($missing === 0 && $dh === 3 && $du === 1) ? 0 : 1);
            PHPEOF
            php -l /tmp/vestra_visits.php 2>&1
            php /tmp/vestra_visits.php 2>&1
            rm -f /tmp/vestra_visits.php

      # "Anahtari bul ve ekle": uretemeyiz, ama sunucuda duran her kopyayi deneyebiliriz.
      # Yanlis saglayiciya sorulan gecerli bir anahtar da 401 doner -- o yuzden her
      # aday iki uca da soruluyor. Anahtarin kendisi hicbir yere yazilmiyor.
      - name: Finder anahtarını bul ve ekle
        if: github.event.inputs.finder_keyscan == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: VESTRA_FINDER_CLEAR
          script: |
            cat > /tmp/vestra_finderscan.php <<'PHPEOF'
            <?php
            /**
             * "Finder anahtarini bul ve ekle."
             *
             * Anahtari sifirdan URETEMEYIZ -- o, operatorun kendi Hunter/Anymailfinder
             * hesabindan cikar. Ama iki ihtimal var ve ikisi de sunucuda cevaplanabilir:
             *   1) Eskiden CALISAN bir anahtar yedeklerde duruyor olabilir.
             *   2) Eldeki anahtar gecerli ama YANLIS saglayiciya sorulmus olabilir --
             *      Anymailfinder anahtarini Hunter'a sorunca cevap tam olarak
             *      "No user found for the API key supplied" (401) oluyor.
             *
             * Anahtarin kendisi hicbir zaman yazilmiyor: bu depo da Actions gunlugu de
             * herkese acik. Sadece uzunluk + sha256'nin ilk 8 hanesi (parmak izi) yaziliyor;
             * parmak izi ayni anahtari iki dosyada taniyabilmek icin yeterli, anahtari geri
             * vermek icin degil.
             */
            $doc  = getenv("HOME")."/public_html";
            $home = getenv("HOME");
            require $doc."/inc/products.php";
            require_once $doc."/inc/notify.php";

            $fp = fn(string $k): string => substr(hash('sha256', $k), 0, 8);

            echo "===== 1. ADAY ANAHTARLAR NEREDE =====\n";

            /* Aranacak yerler: guncel ayar dosyasi, onun yedekleri, config.php ve data/
               altindaki her turlu .bak kopyasi. */
            $files = [];
            $files[] = $doc.'/data/email_settings.json';
            $files[] = $doc.'/inc/config.php';
            foreach (glob($doc.'/data/email_settings.json*') ?: [] as $f) $files[] = $f;
            foreach (glob($doc.'/data/*.bak*') ?: [] as $f) $files[] = $f;
            foreach (glob($home.'/*email_settings*') ?: [] as $f) $files[] = $f;
            foreach (glob($home.'/backups/*') ?: [] as $f) $files[] = $f;
            $files = array_values(array_unique(array_filter($files, 'is_file')));

            $cands = [];   // key => ['sources'=>[], 'provider'=>hint]
            foreach ($files as $f) {
                $raw = @file_get_contents($f);
                if ($raw === false || $raw === '') continue;
                if (!str_contains($raw, 'finder_key')) continue;
                $hits = [];
                /* JSON ya da PHP dizisi olabilir; ikisini de yakalayan tek desen. */
                if (preg_match_all('/[\'"]finder_key[\'"]\s*(?::|=>)\s*[\'"]([^\'"]{8,})[\'"]/', $raw, $m)) {
                    foreach ($m[1] as $k) $hits[] = $k;
                }
                $provHint = '';
                if (preg_match('/[\'"]finder_provider[\'"]\s*(?::|=>)\s*[\'"]([^\'"]+)[\'"]/', $raw, $pm)) $provHint = $pm[1];
                foreach ($hits as $k) {
                    $k = trim($k);
                    if ($k === '') continue;
                    if (!isset($cands[$k])) $cands[$k] = ['sources' => [], 'provider' => $provHint];
                    $cands[$k]['sources'][] = str_replace([$doc, $home], ['<doc>', '<home>'], $f).' ('.date('Y-m-d H:i', (int)@filemtime($f)).')';
                }
            }

            if (!$cands) {
                echo "  Hicbir dosyada finder_key bulunamadi.\n";
            } else {
                foreach ($cands as $k => $info) {
                    printf("  anahtar %s  (%d karakter, kayitli saglayici: %s)\n", $fp($k), strlen($k), $info['provider'] ?: '-');
                    foreach (array_unique($info['sources']) as $s) echo "      <- ".$s."\n";
                }
            }
            printf("  taranan dosya: %d, farkli anahtar: %d\n", count($files), count($cands));

            echo "\n===== 2. HER ANAHTAR HER IKI SAGLAYICIYA SORULUYOR =====\n";
            echo "  (yanlis saglayiciya sorulan gecerli bir anahtar da 401 doner -- ikisini de deniyoruz)\n";

            $test = function (string $key, string $prov): array {
                $url = $prov === 'hunter'
                    ? 'https://api.hunter.io/v2/account?api_key='.rawurlencode($key)
                    : 'https://api.anymailfinder.com/v5.0/account.json';
                $ch = curl_init($url);
                curl_setopt_array($ch, [CURLOPT_RETURNTRANSFER => true, CURLOPT_TIMEOUT => 15, CURLOPT_CONNECTTIMEOUT => 8,
                    CURLOPT_HTTPHEADER => $prov === 'hunter' ? [] : ['Authorization: Bearer '.$key]]);
                $body = (string)curl_exec($ch);
                $code = (int)curl_getinfo($ch, CURLINFO_HTTP_CODE);
                curl_close($ch);
                return [$code, substr(preg_replace('/\s+/', ' ', $body), 0, 160)];
            };

            $winner = null;
            foreach ($cands as $k => $info) {
                foreach (['hunter', 'anymailfinder'] as $prov) {
                    [$code, $body] = $test($k, $prov);
                    $ok = $code >= 200 && $code < 300;
                    printf("  %s + %-14s HTTP %-3d %s\n", $fp($k), $prov, $code, $ok ? 'CALISIYOR' : 'olmadi');
                    if (!$ok) { echo "        yanit: ".$body."\n"; }
                    elseif ($winner === null) { $winner = ['key' => $k, 'provider' => $prov]; }
                }
            }

            echo "\n===== 3. SONUC =====\n";
            $cur  = $doc.'/data/email_settings.json';
            $curD = is_readable($cur) ? (json_decode((string)file_get_contents($cur), true) ?: []) : [];
            $curK = (string)($curD['finder_key'] ?? '');

            if ($winner === null) {
                echo "  Calisan anahtar YOK.\n";
                echo "  Sunucuda duran anahtarlarin hicbiri iki saglayicida da kabul edilmiyor;\n";
                echo "  yani anahtar iptal edilmis ya da hesap kapanmis. Yeni anahtar ancak\n";
                echo "  hunter.io / anymailfinder.com hesabindan alinabilir -- sunucudan uretilemez.\n";
                /* Gecersiz anahtari KENDILIGINDEN silmiyoruz: istenen "bul ve ekle" idi,
                   silmek ayri ve geri alinamaz bir karar. Ayri bir girdiyle, once yedek
                   alarak yapiliyor. */
                if ($curK !== '' && getenv('VESTRA_FINDER_CLEAR') === '1') {
                    $bak = $cur.'.bak-'.date('Ymd_His');
                    @copy($cur, $bak);
                    unset($curD['finder_key']);
                    file_put_contents($cur, json_encode($curD, JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE), LOCK_EX);
                    echo "\n  Gecersiz anahtar silindi (yedek: ".basename($bak).").\n";
                    echo "  Sistem ucretsiz yedege dusuyor -- sitenin iletisim sayfasindan e-posta\n";
                    echo "  okuma. Yani musteri bulma durmuyor, sadece isabet orani dusuyor.\n";
                } elseif ($curK !== '') {
                    echo "\n  Gecersiz anahtar dosyada DURUYOR (dokunmadim). Her istekte 401 aliniyor;\n";
                    echo "  gunlukteki 251 satirin sebebi bu. Silmemi isterseniz bu is'i\n";
                    echo "  finder_clear=true ile calistirin -- once yedek alinir.\n";
                }
            } else {
                printf("  CALISAN anahtar bulundu: %s + %s\n", $fp($winner['key']), $winner['provider']);
                $same = ($winner['key'] === $curK) && ((string)($curD['finder_provider'] ?? 'hunter') === $winner['provider']);
                if ($same) {
                    echo "  Zaten ayarli olan bu -- degisiklige gerek yok.\n";
                } else {
                    $curD['finder_key']      = $winner['key'];
                    $curD['finder_provider'] = $winner['provider'];
                    file_put_contents($cur, json_encode($curD, JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE), LOCK_EX);
                    printf("  data/email_settings.json guncellendi (saglayici: %s). Otomatik e-posta bulma acildi.\n", $winner['provider']);
                }
            }

            echo "\n===== 4. DOGRULAMA (ayar dosyasi yeniden okunuyor) =====\n";
            $chk = is_readable($cur) ? (json_decode((string)file_get_contents($cur), true) ?: []) : [];
            $ck  = (string)($chk['finder_key'] ?? '');
            printf("  finder_key      : %s\n", $ck !== '' ? $fp($ck).' ('.strlen($ck).' karakter)' : 'YOK (ucretsiz yedek kullanilacak)');
            printf("  finder_provider : %s\n", (string)($chk['finder_provider'] ?? '-'));
            if ($ck !== '') {
                [$code] = $test($ck, (string)($chk['finder_provider'] ?? 'hunter'));
                printf("  canli sinama    : HTTP %d %s\n", $code, ($code >= 200 && $code < 300) ? 'TAMAM' : '<-- HALA CALISMIYOR');
            }
            exit(0);
            PHPEOF
            php -l /tmp/vestra_finderscan.php 2>&1
            php /tmp/vestra_finderscan.php 2>&1
            rm -f /tmp/vestra_finderscan.php
        env:
          VESTRA_FINDER_CLEAR: ${{ github.event.inputs.finder_clear == 'true' && '1' || '0' }}

      - name: Site geneli eksik taraması
        if: github.event.inputs.full_audit == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 6m
          script: |
            cat > /tmp/vestra_audit.php <<'PHPEOF'
            <?php
            $home = getenv("HOME"); $doc = $home."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/notify.php";
            require_once $doc."/inc/leads.php";
            require_once $doc."/inc/auth.php";

            $issues = 0;
            function head($t){ echo "\n===== {$t} =====\n"; }
            function bad(&$n, $m){ echo "  ! {$m}\n"; $n++; }

            /* ---------- 1. URUNLER ---------- */
            head("1. URUN VERISI");
            $prods = vestra_products();
            echo "toplam urun: ".count($prods)."\n";

            /* vestra_all_cats() GRUPLU dondurur (grup => [altkategoriler]); duz liste degil.
               Duzlestirmeden karsilastirinca hicbir kategori eslesmiyor ve tarama her urunu
               "tanimsiz kategori" diye isaretliyordu -- veri degil, taramanin hatasiydi. */
            $ids = []; $skus = [];
            $knownCats = [];
            if (function_exists('vestra_all_cats')) {
              foreach (vestra_all_cats() as $grp => $subs) {
                if (is_array($subs)) { foreach ($subs as $s) $knownCats[] = (string)$s; }
                else $knownCats[] = (string)$subs;
              }
            }
            $noImg = []; $brokenImg = []; $zeroDisc = []; $noPrice = []; $noMoq = [];
            $saleNoDisc = 0;   // bilgi amacli sayac; eksik sayisina katilmaz
            $dupId = []; $dupSku = []; $badCat = []; $cqBad = [];

            foreach ($prods as $p) {
              $id = (string)($p['id'] ?? '');
              $nm = trim(($p['brand'] ?? '').' '.($p['name'] ?? ''));
              if ($id === '') { $noPrice[] = "(id YOK) {$nm}"; continue; }
              if (isset($ids[$id])) $dupId[] = $id; else $ids[$id] = true;
              $sku = trim((string)($p['sku'] ?? ''));
              if ($sku !== '') { if (isset($skus[$sku])) $dupSku[] = "{$sku} ({$id})"; else $skus[$sku] = true; }

              // gorseller: hem hic yok hem de dosyasi diskte yok durumu
              $imgs = (!empty($p['images']) && is_array($p['images'])) ? $p['images'] : (!empty($p['image']) ? [$p['image']] : []);
              if (!$imgs) $noImg[] = "{$id} | {$nm}";
              foreach ($imgs as $im) {
                if (!is_string($im) || $im === '') continue;
                if ($im[0] === '/' && !is_file($doc.$im)) $brokenImg[] = "{$id} -> {$im}";
              }

              /* Bu kontrol "musteriye -%0 rozeti gorunuyor" diyordu ve 346 urunun 304'unu
                 isaretliyordu -- ama rozet HIC cizilmiyor: /shop, /showroom ve urun
                 sayfasinin ucu de once vestra_display_mode() cagiriyor, o da gercek
                 indirimi olmayan 'sale'i 'fixed'e dusuruyor. Yani veriye bakip render
                 katmaninin zaten engelledigi bir belirti iddia ediyordu; toplam 340
                 isaretin 304'u buydu ve gercek bulgular bunun altinda kayboluyordu.
                 Olcut artik ekranda ne oldugu: display_mode 'sale' derken indirim 0 ise
                 sorun var. Bu bugun imkansiz, ve olmasi gereken de bu -- kontrol,
                 render mantigi bozulursa uyarsin diye duruyor. */
              if (vestra_display_mode($p) === 'sale' && vestra_discount($p) <= 0)
                $zeroDisc[] = "{$id} | {$nm} | list=".($p['list'] ?? '?')." from=".vestra_from_price($p);
              /* Indirimsiz 'sale' kaydi yine de bilgi olarak sayiliyor: zararsiz ama
                 çogu zaman iceri aktarimda indirimli fiyatin hic girilmedigini gosterir.
                 EKSIK SAYISINA KATILMIYOR -- gorunur bir kusur degil. */
              if (($p['mode'] ?? '') === 'sale' && vestra_discount($p) <= 0) $saleNoDisc++;

              if (empty($p['tiers']) || vestra_from_price($p) <= 0) $noPrice[] = "{$id} | {$nm}";
              if ((int)($p['moq'] ?? 0) <= 0) $noMoq[] = "{$id} | {$nm}";

              $cat = trim((string)($p['cat'] ?? ''));
              if ($cat === '') $badCat[] = "{$id} (kategori BOS)";
              elseif ($knownCats && !in_array($cat, $knownCats, true)) $badCat[] = "{$id} -> '{$cat}' (tanimli kategori degil)";

              // renk/adet (carton) listelemesi: colors ile images ayni uzunlukta olmali
              if (!empty($p['colors']) && !empty($p['min_colors'])) {
                $nc = count((array)$p['colors']); $ni = count($imgs);
                if ($ni > 1 && $ni !== $nc) $cqBad[] = "{$id} | {$nc} renk ama {$ni} gorsel (eslesmiyor)";
                if ((int)$p['min_colors'] > $nc) $cqBad[] = "{$id} | min_colors=".$p['min_colors']." ama sadece {$nc} renk var";
              }
            }

            $rep = function(string $label, array $list) use (&$issues) {
              if (!$list) { echo "  OK  {$label}: 0\n"; return; }
              echo "  !!  {$label}: ".count($list)."\n";
              foreach (array_slice($list, 0, 15) as $l) echo "        - {$l}\n";
              if (count($list) > 15) echo "        ... (+".(count($list)-15)." tane daha)\n";
              $issues += count($list);
            };
            $rep("fotografi HIC olmayan urun", $noImg);
            $rep("gorsel yolu var ama DOSYA DISKTE YOK", $brokenImg);
            $rep("ekranda 'sale' yaziyor ama indirim %0 (render mantigi bozulmus olur)", $zeroDisc);
            if ($saleNoDisc) printf("  --  bilgi: mode=sale ama indirimi olmayan urun: %d (rozet cizilmiyor, eksik sayilmiyor)\n", $saleNoDisc);
            $rep("fiyati/tier'i olmayan urun", $noPrice);
            $rep("MOQ'su 0/eksik urun", $noMoq);
            $rep("kategorisi bos ya da tanimsiz", $badCat);
            $rep("ayni id iki kez", $dupId);
            $rep("ayni SKU iki kez", $dupSku);
            $rep("renk/gorsel uyusmazligi (carton listeleme)", $cqBad);

            /* ---------- 2. LEADLER ---------- */
            head("2. LEAD VERISI");
            $leads = vestra_leads();
            echo "toplam lead: ".count($leads)."\n";
            $badMail = []; $dupMail = []; $seenMail = []; $bouncedNew = [];
            foreach ($leads as $l) {
              $e = strtolower(trim((string)($l['email'] ?? '')));
              if ($e === '' || !filter_var($e, FILTER_VALIDATE_EMAIL)) { $badMail[] = ($l['company'] ?? '?')." <".($e ?: 'BOS').">"; continue; }
              if (isset($seenMail[$e])) $dupMail[] = $e; else $seenMail[$e] = true;
              if (($l['status'] ?? '') === 'bounced' && ($l['last_contacted_at'] ?? '') === '') $bouncedNew[] = $e;
            }
            $rep("gecersiz/bos e-posta", $badMail);
            $rep("ayni e-posta iki kez", $dupMail);
            $st = [];
            foreach ($leads as $l) { $s = $l['status'] ?? '(yok)'; $st[$s] = ($st[$s] ?? 0) + 1; }
            echo "  durum dagilimi: "; foreach ($st as $s => $c) echo "{$s}={$c}  "; echo "\n";

            /* ---------- 3. HESAPLAR ---------- */
            head("3. HESAPLAR");
            $accs = auth_accounts();
            echo "toplam hesap: ".count($accs)."\n";
            $stuck = []; $noMail = [];
            foreach ($accs as $a) {
              if (($a['status'] ?? '') === 'pending_email') $stuck[] = "olusturulma ".($a['created'] ?? '?')." | tip ".($a['type'] ?? '?');
              if (trim((string)($a['email'] ?? '')) === '') $noMail[] = ($a['company'] ?? $a['id'] ?? '?');
            }
            $rep("e-posta dogrulamasinda TAKILI hesap (giris yapamaz)", $stuck);
            $rep("e-postasi olmayan hesap (bildirim gidemez)", $noMail);

            /* ---------- 4. YAPILANDIRMA ---------- */
            head("4. YAPILANDIRMA / ENTEGRASYON");
            $cfg = function($k, $d=null){ return vestra_cfg($k, $d); };
            $mk = (string)$cfg('mail_api_key','');
            echo "  mail_api_key      : ".($mk !== '' ? "tanimli (".strlen($mk)." karakter)" : "YOK")."\n";
            if ($mk === '') $issues++;
            echo "  mail_from         : ".($cfg('mail_from','') ?: 'YOK')."\n";
            echo "  require_email_verify: ".var_export($cfg('require_email_verify', false), true)."\n";
            $fk = (string)$cfg('finder_key','');
            echo "  finder_key        : ".($fk !== '' ? "tanimli (".$cfg('finder_provider','hunter').")" : "YOK")."\n";
            $sk = (string)$cfg('stripe_secret','');
            echo "  stripe_secret     : ".($sk !== '' ? "tanimli" : "YOK")."\n";

            /* Google ile musteri bulma: anahtarin VARLIGI yetmez. Bu ucta iki ayri
               kapi var -- proje faturalandirmasi ve "Places API (New)"in acik olmasi --
               ve ikisi de kapaliyken anahtar gayet gecerli gorunur. Tek gercek istek
               atip Google'in kendi cumlesini yaziyoruz; anahtar log'a YAZILMIYOR. */
            $gk = (string)$cfg('google_key','');
            $gx = (string)$cfg('google_cx','');
            echo "  google_key        : ".($gk !== '' ? "tanimli (".strlen($gk)." karakter)" : "YOK -- Google ile musteri arama KAPALI")."\n";
            echo "  google_cx         : ".($gx !== '' ? "tanimli (e-posta yedegi acik)" : "YOK -- e-posta yedegi kapali, sadece site/telefon gelir")."\n";
            if ($gk !== '') {
              require_once $doc."/inc/discover_google.php";
              $t0 = microtime(true);
              $d  = vestra_google_places_call('boutique Berlin', 'DE', 'de');
              $ms = (int)((microtime(true)-$t0)*1000);
              if (vestra_google_ok() && $d) {
                printf("  google Places     : OK (%d sonuc, %d ms) -- Google ile musteri arama CALISIYOR\n", count($d['places'] ?? []), $ms);
              } else {
                echo "  !! google Places CALISMIYOR: ".vestra_google_note()."\n";
                $issues++;
              }
            }

            /* Hunter/Anymailfinder anahtari gercekten calisiyor mu? error_log'da
               yuzlerce '401' satiri vardi -- anahtarin VARLIGI calistigi anlamina
               gelmiyor, o yuzden tek bir gercek istek atip dogruluyoruz. */
            if ($fk !== '') {
              $prov = strtolower((string)$cfg('finder_provider','hunter'));
              $url = $prov === 'hunter'
                ? "https://api.hunter.io/v2/account?api_key=".rawurlencode($fk)
                : "https://api.anymailfinder.com/v5.0/account.json";
              $ch = curl_init($url);
              curl_setopt_array($ch, [CURLOPT_RETURNTRANSFER=>true, CURLOPT_TIMEOUT=>12,
                CURLOPT_HTTPHEADER => $prov === 'hunter' ? [] : ['Authorization: Bearer '.$fk]]);
              $body = curl_exec($ch); $code = curl_getinfo($ch, CURLINFO_HTTP_CODE); curl_close($ch);
              if ($code >= 200 && $code < 300) {
                echo "  finder anahtari   : OK (HTTP {$code}) -- musteri bulma calisiyor\n";
              } else {
                echo "  !! finder anahtari GECERSIZ (HTTP {$code}) -- otomatik musteri bulma CALISMIYOR\n";
                echo "     yanit: ".substr(preg_replace('/\s+/',' ',(string)$body), 0, 180)."\n";
                $issues++;
              }
            }

            /* Brevo kotasi: gunluk limit dolduysa SADECE kampanya degil, siparis
               onayi ve e-posta dogrulama da gitmez -- asil risk orada. */
            if ($mk !== '') {
              $ch = curl_init("https://api.brevo.com/v3/account");
              curl_setopt_array($ch, [CURLOPT_RETURNTRANSFER=>true, CURLOPT_TIMEOUT=>12,
                CURLOPT_HTTPHEADER=>['api-key: '.$mk, 'Accept: application/json']]);
              $body = curl_exec($ch); $code = curl_getinfo($ch, CURLINFO_HTTP_CODE); curl_close($ch);
              if ($code >= 200 && $code < 300) {
                $d = json_decode((string)$body, true);
                $plan = $d['plan'][0] ?? [];
                $cred = $plan['credits'] ?? '?'; $type = $plan['type'] ?? '?';
                echo "  Brevo plani       : {$type} | kalan kredi: {$cred}\n";
                if (is_numeric($cred) && $cred < 50) {
                  echo "  !! Brevo kredisi AZ ({$cred}) -- bugun daha fazla e-posta gitmeyebilir\n";
                  $issues++;
                }
              } else {
                echo "  !! Brevo hesabi sorgulanamadi (HTTP {$code})\n"; $issues++;
              }
            }

            /* ---------- 5. DOSYA SISTEMI ---------- */
            head("5. DOSYA / DISK");
            foreach ([['data/listings.json','urun'], ['data/leads.json','lead'],
                      ['data/accounts.json','hesap'], ['data/messages.json','mesaj']] as [$rel,$lbl]) {
              $f = $doc.'/'.$rel;
              if (!is_file($f)) { echo "  ! {$rel} YOK\n"; $issues++; continue; }
              $j = json_decode((string)file_get_contents($f), true);
              printf("  %-22s %8s KB  %s\n", $rel, number_format(filesize($f)/1024, 0),
                     is_array($j) ? "gecerli JSON, ".count($j)." {$lbl}" : "!! BOZUK JSON");
              if (!is_array($j)) $issues++;
              if (!is_writable($f)) { echo "     ! yazilamaz (kayit islemleri basarisiz olur)\n"; $issues++; }
            }
            $bak = glob($doc.'/data/*.bak-*') ?: [];
            $bak2 = glob($doc.'/data/*.bak.*') ?: [];
            echo "  yedek dosya sayisi : ".(count($bak)+count($bak2))."\n";

            /* ---------- 6. HATA GUNLUGU ---------- */
            head("6. PHP HATA GUNLUGU (tekrarlar teke indirildi)");
            $seen = [];
            foreach ([$doc.'/error_log', $home.'/error_log'] as $lf) {
              if (!is_readable($lf)) continue;
              $lines = @file($lf, FILE_IGNORE_NEW_LINES|FILE_SKIP_EMPTY_LINES) ?: [];
              foreach (array_slice($lines, -400) as $ln) {
                // zaman damgasini at, ayni hatayi tek satirda say
                $sig = trim(preg_replace('/^\[[^\]]*\]\s*/', '', $ln));
                $sig = preg_replace('/\d+/', 'N', $sig);
                if ($sig === '') continue;
                $seen[$sig] = ($seen[$sig] ?? 0) + 1;
              }
            }
            arsort($seen);
            if (!$seen) echo "  OK  son 400 satirda hata yok\n";
            foreach (array_slice($seen, 0, 12, true) as $sig => $n)
              echo "  ".str_pad("x{$n}", 7)." ".substr($sig, 0, 150)."\n";

            head("OZET");
            echo ($issues === 0 ? "Hicbir eksik bulunamadi.\n" : "TOPLAM ISARETLENEN EKSIK: {$issues}\n");
            PHPEOF
            php -l /tmp/vestra_audit.php
            php /tmp/vestra_audit.php
            rm -f /tmp/vestra_audit.php
