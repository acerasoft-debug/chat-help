name: (Keşif) Yeni lead kaynaklarını yoklama testi
on:
  workflow_dispatch:
    inputs:
      url:
        description: "DOLU verilirse: sabit kaynak listesi yerine SADECE bu tek ürün sayfasını incele/indir (dış perakende sitesi photo/renk/fiyat çekimi için)"
        required: false
        default: ""
      mode:
        description: "url doluyken: inspect = HTML'den görsel/renk/fiyat sinyallerini döker | download = tek bir görseli indirip uploads/<label>/ altına kaydeder"
        required: false
        default: "inspect"
      image_url:
        description: "mode=download iken: indirilecek TAM görsel URL'si (inspect çıktısından seçilir)"
        required: false
        default: ""
      label:
        description: "mode=download iken: görsel etiketi — uploads/<etiket>/ altına gider (küçük harf/rakam/tire)"
        required: false
        default: ""

permissions:
  contents: read

# Asil amac: SALT-OKUNUR SONDA, hicbir sey eklemez/gondermez.
#
# Amac: OSM'nin verimi %4 cikti (418 dukkan -> 27 uygun). Marka BAYI LISTELERI
# teoride cok daha iyi olmali, cunku listelenen her magaza zaten tanimi geregi
# cok markali premium butik. Ama bu sayfalarin cogu JavaScript ile yukleniyor
# olabilir -- oyleyse sunucudan duz HTTP ile cekilemez ve fikir kagit ustunde kalir.
#
# Bu is, uzerine sistem kurmadan ONCE varsayimi test eder: her aday kaynagi ceker,
# HTML icinde gercekten magaza adi/alan adi var mi diye bakar ve sayar. Sonuca gore
# hangi kaynagin ise yaradigina veriye bakarak karar veririz.
#
# EK YETENEK (url input'u): bazi perakende urun sayfalari (tennisplanet.de,
# engelhorn.de gibi) WebFetch'i bot sayip 403 donuyor. Bu is zaten sunucudan
# disariya HTTP cekebildigini kanitliyordu (yukaridaki SONDA), ayni curl yolunu
# TEK bir urun sayfasi icin kullaniyoruz -- tarayici User-Agent'i ile. mode=inspect
# JSON-LD/gorsel/renk/fiyat sinyallerini basar (hicbir sey kaydetmez); mode=download
# SADECE bu durumda secilen tek image_url'i indirip uploads/<label>/ altina yazar.
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynakları yokla / tek sayfayı incele
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROBE_URL: ${{ github.event.inputs.url }}
          PROBE_MODE: ${{ github.event.inputs.mode }}
          PROBE_IMAGE_URL: ${{ github.event.inputs.image_url }}
          PROBE_LABEL: ${{ github.event.inputs.label }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 15m
          envs: PROBE_URL,PROBE_MODE,PROBE_IMAGE_URL,PROBE_LABEL
          script: |
            cd ~/public_html
            cat > /tmp/vestra_probe.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            @set_time_limit(0); @ini_set('implicit_flush','1');
            while (ob_get_level() > 0) { @ob_end_flush(); }
            $home = getenv("HOME");
            require       $home."/public_html/inc/products.php";
            require_once  $home."/public_html/inc/notify.php";

            /* Tarayici gibi davranan yerel curl -- vestra_http_get()'in dogru
               kimlikli "VestraBot" UA'sindan FARKLI: bazi perakende siteleri bot
               UA'sini reddediyor, bu SADECE tek-urun-sayfasi incelemesi icin. */
            function vestra_probe_fetch(string $u, int $timeout, array $extraHeaders = []): string {
              $ch = curl_init($u);
              curl_setopt_array($ch, [
                CURLOPT_RETURNTRANSFER=>true, CURLOPT_FOLLOWLOCATION=>true, CURLOPT_MAXREDIRS=>5,
                CURLOPT_TIMEOUT=>$timeout, CURLOPT_CONNECTTIMEOUT=>10, CURLOPT_ENCODING=>'',
                CURLOPT_USERAGENT=>'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36',
                CURLOPT_HTTPHEADER=>array_merge(['Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8','Accept-Language: de-DE,de;q=0.9,en;q=0.8'], $extraHeaders),
              ]);
              $r = curl_exec($ch); $code = curl_getinfo($ch, CURLINFO_HTTP_CODE); curl_close($ch);
              if ($r === false) { fwrite(STDERR, "curl hata: ".curl_error($ch)."\n"); return ''; }
              if ($code < 200 || $code >= 400) { fwrite(STDERR, "HTTP {$code}\n"); return ''; }
              return (string)$r;
            }

            $probeUrl = trim((string)getenv('PROBE_URL'));
            if ($probeUrl !== '') {
              $mode = trim((string)getenv('PROBE_MODE')) ?: 'inspect';
              if ($mode === 'download') {
                $imgUrl = trim((string)getenv('PROBE_IMAGE_URL'));
                $label  = preg_replace('/[^a-z0-9-]+/', '', strtolower(trim((string)getenv('PROBE_LABEL'))));
                if ($imgUrl === '' || $label === '') { fwrite(STDERR, "HATA: image_url veya label bos\n"); exit(1); }
                $bin = vestra_probe_fetch($imgUrl, 30, ['Referer: '.$probeUrl]);
                if ($bin === '' || strlen($bin) < 500) { fwrite(STDERR, "HATA: gorsel gelmedi (boyut=".strlen($bin).")\n"); exit(1); }
                $info = @getimagesizefromstring($bin);
                if ($info === false) { fwrite(STDERR, "HATA: gecerli gorsel degil\n"); exit(1); }
                $extMap = [IMAGETYPE_JPEG=>'jpg', IMAGETYPE_PNG=>'png', IMAGETYPE_WEBP=>'webp'];
                $ext = $extMap[$info[2]] ?? 'jpg';
                $dir = $home."/public_html/uploads/{$label}";
                if (!is_dir($dir)) mkdir($dir, 0755, true);
                $n = 1; $out = "{$dir}/{$label}-{$n}.{$ext}";
                while (is_file($out)) { $n++; $out = "{$dir}/{$label}-{$n}.{$ext}"; }
                file_put_contents($out, $bin);
                chmod($out, 0644);
                echo "KAYDEDILDI: /uploads/{$label}/".basename($out)." ({$info[0]}x{$info[1]}, ".strlen($bin)." B)\n";
                exit(0);
              }

              // mode=inspect: HTML'i cek, JSON-LD + og: + gorsel/renk/fiyat adaylarini bas.
              $html = vestra_probe_fetch($probeUrl, 20);
              if ($html === '') { fwrite(STDERR, "HATA: sayfa gelmedi\n"); exit(1); }
              echo "indirilen boyut: ".strlen($html)." B\n\n";

              echo "===== JSON-LD (application/ld+json) =====\n";
              if (preg_match_all('#<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>#is', $html, $m)) {
                foreach ($m[1] as $i => $b) { echo "--- block {$i} ---\n".mb_substr(trim($b), 0, 3000)."\n"; }
                echo "\ntoplam JSON-LD blok: ".count($m[1])."\n";
              } else { echo "(yok)\n"; }

              echo "\n===== og: meta etiketleri =====\n";
              if (preg_match_all('#<meta[^>]+property=["\']og:[^"\']+["\'][^>]*>#i', $html, $m)) {
                foreach (array_slice($m[0], 0, 30) as $t) echo "  {$t}\n";
              }

              echo "\n===== img adaylari (src/data-src/srcset, ikon/logo elenmis) =====\n";
              $urls = [];
              foreach (['src','data-src','data-zoom-image','data-large','data-original','srcset'] as $attr) {
                if (preg_match_all('#'.$attr.'=["\']([^"\']+)["\']#i', $html, $m)) {
                  foreach ($m[1] as $v) foreach (explode(',', $v) as $part) {
                    $u = trim(explode(' ', trim($part))[0] ?? ''); if ($u !== '') $urls[$u] = true;
                  }
                }
              }
              $skip = ['sprite','icon','logo','flag','payment','placeholder','.svg','blank.gif'];
              $cands = [];
              foreach (array_keys($urls) as $u) { $low = strtolower($u); $bad = false; foreach ($skip as $s) if (str_contains($low,$s)) { $bad = true; break; } if (!$bad) $cands[] = $u; }
              sort($cands);
              foreach (array_slice($cands, 0, 80) as $u) echo "  {$u}\n";
              echo "\ntoplam aday: ".count($cands)."\n";

              echo "\n===== 'farbe'/'color'/'renk' gecen kisa satirlar =====\n";
              if (preg_match_all('#.{0,40}(farbe|color-name|colour|swatch).{0,80}#i', $html, $m)) {
                foreach (array_slice($m[0], 0, 40) as $l) echo "  ".trim(preg_replace('/\s+/', ' ', $l))."\n";
              }

              echo "\n===== fiyat gecen kisa satirlar =====\n";
              if (preg_match_all('#.{0,20}(EUR|€ ?[0-9]|[0-9],[0-9]{2} ?€).{0,20}#', $html, $m)) {
                foreach (array_slice($m[0], 0, 20) as $l) echo "  ".trim(preg_replace('/\s+/', ' ', $l))."\n";
              }
              exit(0);
            }

            /* Aday kaynaklar. Iki tur:
               - "bayi/magaza bulucu": markanin kendi sitesinde nerede satiliyor listesi
               - "dizin": coklu perakendeci listeleyen acik sayfalar               */
            $targets = [
              ['Stone Island store locator', 'https://www.stoneisland.com/en/store-locator'],
              ['C.P. Company stockists',     'https://www.cpcompany.com/en/store-locator'],
              ['Save The Duck store locator','https://www.savetheduck.com/en/store-locator'],
              ['Autry dealer locator',       'https://www.autry.com/en/store-locator'],
              ['Golden Goose stores',        'https://www.goldengoose.com/en/store-locator'],
              ['K-Way stores',               'https://www.k-way.com/en/store-locator'],
              ['Herno store locator',        'https://www.herno.com/en/stores'],
              ['Pitti Uomo exhibitors',      'https://www.pittimmagine.com/en/corporate/fairs/uomo.html'],
              ['Premium Berlin exhibitors',  'https://www.premiumberlin.com/exhibitors'],
              ['Who is Next exhibitors',     'https://www.whosnext.com/en/exhibitors'],
            ];

            /* Bir sayfa "ise yarar" mi? Olcut: icinde DIS alan adlari (magaza siteleri)
               ya da e-posta gecmesi. Sadece 200 donmesi yetmez -- JS iskeleti de 200 doner. */
            $selfHosts = ['stoneisland','cpcompany','savetheduck','autry','goldengoose','k-way','herno',
                          'pittimmagine','premiumberlin','whosnext','google','facebook','instagram',
                          'twitter','youtube','linkedin','cloudflare','cookiebot','onetrust','gstatic',
                          'googletagmanager','doubleclick','shopify','akamai','w3.org','schema.org'];

            printf("%-30s %-6s %-9s %-7s %-7s %s\n", "KAYNAK", "KOD", "BOYUT", "DISALAN", "EPOSTA", "DEGERLENDIRME");
            echo str_repeat('-', 110)."\n";
            foreach ($targets as [$name, $url]) {
              $html = vestra_http_get($url, 15);
              $code = $html === '' ? 0 : 200;
              $size = strlen($html);

              // dis alan adlarini topla
              $hosts = [];
              if (preg_match_all('#https?://([a-z0-9.\-]+\.[a-z]{2,})#i', $html, $m)) {
                foreach ($m[1] as $h) {
                  $h = strtolower($h);
                  $skip = false;
                  foreach ($selfHosts as $s) if (str_contains($h, $s)) { $skip = true; break; }
                  if (!$skip) $hosts[$h] = true;
                }
              }
              $mails = [];
              if (preg_match_all('/[A-Z0-9._%%+\-]+@[A-Z0-9.\-]+\.[A-Z]{2,}/i', $html, $me)) {
                foreach ($me[0] as $e) $mails[strtolower($e)] = true;
              }

              $verdict = '';
              if ($size === 0)                       $verdict = 'CEKILEMEDI (engel / zaman asimi)';
              elseif ($size < 3000)                  $verdict = 'cok kucuk -- muhtemelen yonlendirme';
              elseif (count($hosts) < 5 && !$mails)  $verdict = 'JS iskeleti -- veri HTML icinde YOK';
              else                                   $verdict = 'KULLANILABILIR';

              printf("%-30s %-6s %-9s %-7d %-7d %s\n",
                     mb_substr($name,0,28), $code ?: '000', $size, count($hosts), count($mails), $verdict);
              if ($verdict === 'KULLANILABILIR') {
                $sample = array_slice(array_keys($hosts), 0, 6);
                echo "      ornek alan adlari: ".implode(', ', $sample)."\n";
              }
              flush();
            }
            PHPEOF
            cp /tmp/vestra_probe.php ./vestra_probe_tmp.php
            php ./vestra_probe_tmp.php
            rm -f ./vestra_probe_tmp.php /tmp/vestra_probe.php
