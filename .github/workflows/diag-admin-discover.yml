name: (Teşhis) Admin "müşteri bul" düğmesi neden çalışmıyor
on:
  workflow_dispatch:
    inputs:
      country:
        description: "Ülke (admin'de seçtiğin gibi)"
        required: false
        default: "Netherlands"
      city:
        description: "Şehir (boş bırakılabilir — admin'de de opsiyonel)"
        required: false
        default: ""
      site_probe:
        description: "GENEL amaçlı, bu dosyanın asıl konusundan bağımsız: herhangi bir URL verin (bu ortamdan çoğu dış alan adına çıkış engelli — proxy allowlist'te değil; sunucunun kendi ağından çeker, Overpass/OSM çağrısıyla aynı prensip). Başlığı, meta açıklamasını, sayfadaki TÜM linkleri (mutlak adrese çevrilmiş, metniyle birlikte) ve script/style ayıklanmış görünür metni (ilk ~4000 karakter) yazar. Salt okunur, hiçbir şey indirmez/kaydetmez. diag-live.yml zaten 25 girdi sınırındaydı (bkz. o dosyanın notu), o yüzden burada — girdi bütçesi boş olan başka bir dosyada."
        required: false
        default: ""
      kuloglu:
        description: "Pilot veri toplama — kuloglutekstil.com.tr 'Bayan Sütyen' kategorisini tarar, VESTRA'ya HİÇBİR ŞEY YAZMAZ, yalnızca sunucuda ~/kuloglu_import/*.json üretir (public_html DIŞI, repo'ya girmez). Format: 'MOD' ya da 'MOD|arg1' ya da 'MOD|arg1|arg2'. Modlar: fields|url1,url2,... (belirtilen ürün sayfalarını çek, alanları LOG'a yaz, dosyaya YAZMAZ — çıkarım deseni birkaç üründe doğrulamak için); paginate (kategori sayfasının gerçek sayfalama mekanizmasını teşhis eder, salt okunur); list_urls|maxPages (tüm sayfaları gezip essiz /urun/ linklerini product_urls.json'a yazar, varsayılan maxPages=40); crawl|start|count (product_urls.json'daki kuyruktan [start,start+count) dilimini çeker, bayan_sutyen.json'a ekler/birleştirir, hata verenleri failures.json'a yazar — zaten başarıyla çekilmiş URL'leri atlar, tekrar tekrar çağırmak güvenli); price (bayan_sutyen.json'daki TRY fiyatları EUR'a çevirir — sunucudan frankfurter.app/ECB günlük XML/açık piyasa sırasıyla güncel EUR/TRY kurunu çeker, %100 kâr uygular (satış=maliyet×2), bayan_sutyen_priced.json'a yazar; para birimi dönüşümü yalnızca bu tek seferlik alım hesaplaması için, sitenin canlı ziyaretçi para birimi sistemine (inc/money.php) dokunmaz); vocab (bayan_sutyen.json'daki tekrar eden, sonlu kelime dağarcığını döker — marka/kategori/renk/beden essiz listeleri + sayımı, başlıklarda marka/model dışı kelimeler — hiçbir şey yazmaz, yalnızca çeviri sözlüğü elle kurulurken referans için); images|start|count (fotoğrafları sunucuda indirir, GD ile yeniden kodlar — bu adım EXIF'i doğal olarak siler, kalite YÜKSEK tutulur [JPEG q=95] — ve ~/kuloglu_import/images_staged/ altına kaydeder; VESTRA'ya hiçbir şey YAZMAZ, yalnızca bir sonraki adımın [add-products.yml stage_from=] kullanacağı dosyaları hazırlar; varsayılan count=5, küçük bir denemeyle başlamak için); images_reset (yalnızca images_staged.json + o klasördeki dosyaları BOŞALTIR — çekim kalitesi/ayarı değiştiğinde 'zaten var' diye eski dosyaları korumaması için, 'reset'in fotoğraf karşılığı); reset (bayan_sutyen.json + failures.json'ı BOŞALTIR, product_urls.json'a dokunmaz — çıkarım mantığı değiştiğinde eskiden 'zaten var' diye atlanacak kayıtları yeniden çektirmek için); status (üç dosyanın sayaç/özetini yazar, hiçbir şey çekmez). Kibarca: istekler arası ~300-400ms gecikme, paralel yok, makul timeout. Tam yük asla log'a basılmaz — yalnızca sayaç ve birkaç örnek."
        required: false
        default: ""
      kuloglu_image:
        description: "Bir Kuloğlu ürün fotoğrafı URL'i verin — sunucudan çeker, base64 olarak günlüğe basar (WeTransfer fotoğraf inceleme adımıyla aynı ilke: gizli-değer maskeleme tabana bitişik karakterleri bozmasın diye |spaced eklenir). Salt okunur, sunucuya hiçbir şey kaydetmez."
        required: false
        default: ""

permissions:
  contents: read

# Salt-okunur. admin.php'deki discover_leads eyleminin YAPTIGI SEYIN AYNISINI
# calistirir ve her adimda ne dondugunu yazar.
#
# Neden gerekli: admin'deki dugme AJAX ile JSON doner; tarayicida sadece "0 bulundu"
# ya da bos bir sonuc gorunur, ASIL sebep gorunmez. Ayni cagriyi sunucuda calistirip
# Overpass'in gercekte ne dondurdugunu, fonksiyonlarin yuklu olup olmadigini ve
# PHP hatasi olup olmadigini acikca gosteriyoruz.
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Admin akışını birebir çalıştır
        if: ${{ github.event.inputs.site_probe == '' && github.event.inputs.kuloglu == '' && github.event.inputs.kuloglu_image == '' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          C: ${{ github.event.inputs.country }}
          CT: ${{ github.event.inputs.city }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 12m
          envs: C,CT
          script: |
            cd ~/public_html
            cat > /tmp/vestra_diag_admin.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            @set_time_limit(0); @ini_set('implicit_flush','1');
            while (ob_get_level() > 0) { @ob_end_flush(); }
            $home = getenv("HOME");

            echo "== 1) admin.php'nin yukledigi gibi yukle ==\n";
            require       $home."/public_html/inc/products.php";
            require_once  $home."/public_html/inc/leads.php";
            require_once  $home."/public_html/inc/notify.php";
            foreach (['vestra_discover_osm','vestra_leads_add','vestra_osm_ok','vestra_overpass','vestra_discover_blocklist'] as $f) {
              printf("  %-28s %s\n", $f, function_exists($f) ? 'VAR' : '*** YOK ***');
            }

            $country = trim((string)getenv('C'));
            $city    = trim((string)getenv('CT'));
            echo "\n== 2) admin ile ayni cagri: vestra_discover_osm('{$country}', '{$city}', 80) ==\n";
            $t0 = time();
            $rows = $country !== '' ? vestra_discover_osm($country, $city, 80) : [];
            $secs = time() - $t0;
            $osmOk = function_exists('vestra_osm_ok') ? vestra_osm_ok() : true;
            echo "  sure        : {$secs} sn\n";
            echo "  donen satir : ".count($rows)."\n";
            echo "  overpass ok : ".($osmOk ? 'EVET (mirror cevap verdi)' : 'HAYIR (tum mirrorlar dustu)')."\n";

            if (!$rows) {
              echo "\n  >> SIFIR SONUC. Sebep ayrimi:\n";
              echo ($osmOk
                ? "     Overpass CEVAP VERDI ama bu alan adiyla hic dukkan eslesmedi.\n".
                  "     Yani sorun baglanti degil, ALAN ADI COZUMLEMESI. Sorgu\n".
                  "     area[name=\"{$country}\"] ariyor; OSM'de ulke/sehir baska adla kayitli olabilir\n".
                  "     ya da ayni adda birden fazla buyuk alan var ve sorgu zaman asimina ugruyor.\n"
                : "     Overpass'in TUM aynalari cevap vermedi -- gecici kesinti ya da hiz limiti.\n".
                  "     Bu durumda admin'deki dugme de hep 0 gosterir. Birazdan tekrar denenmeli.\n");
            } else {
              echo "\n  ilk 5 sonuc:\n";
              foreach (array_slice($rows,0,5) as $r)
                printf("   %-34s %-28s %s\n",
                  mb_substr((string)($r['company']??''),0,32),
                  mb_substr((string)($r['website']??''),0,26),
                  (string)($r['email']??'(eposta yok)'));
              echo "\n  >> Bu ulke icin kesif CALISIYOR.\n";
            }

            echo "\n== 3) admin sadece E-POSTASI OLANI mi ekliyor? ==\n";
            $withMail = 0; foreach ($rows as $r) if (trim((string)($r['email']??'')) !== '') $withMail++;
            echo "  e-postasi OSM etiketinde hazir gelen: {$withMail} / ".count($rows)."\n";
            echo "  (admin discover_leads e-postasiz olanlari da ekler; e-posta ikinci adimda\n";
            echo "   'find_lead_email_one' ile tek tek aranir. O adim yavas oldugu icin\n";
            echo "   tarayicida is bitmemis gibi gorunebiliyor.)\n";

            echo "\n== 4) son PHP hatalari ==\n";
            foreach ([$home."/public_html/error_log", $home."/error_log"] as $L) {
              if (is_file($L)) { echo "-- ".basename($L)." --\n"; echo implode('', array_slice(file($L), -12)); }
            }
            PHPEOF
            cp /tmp/vestra_diag_admin.php ./vestra_diag_admin_tmp.php
            php ./vestra_diag_admin_tmp.php
            rm -f ./vestra_diag_admin_tmp.php /tmp/vestra_diag_admin.php

      # GENEL amacli tek sayfa on-izleme, bu dosyanin asil konusundan bagimsiz --
      # burada yalnizca girdi butcesi bos oldugu icin duruyor (diag-live.yml 25
      # girdi sinirindaydi). Bu ortamdan cogu dis siteye cikis proxy allowlist'i
      # yuzunden engelli (WebFetch "EGRESS_BLOCKED" donuyor); sunucunun kendi
      # agindan cekiyor, tipki yukaridaki Overpass cagrisi gibi. Salt okunur.
      - name: Genel site önizleme (sunucudan)
        if: ${{ github.event.inputs.site_probe != '' }}
        env:
          SITE_URL: ${{ github.event.inputs.site_probe }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: SITE_URL
          script: |
            cat > /tmp/vestra_siteprobe.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $url = trim((string)getenv('SITE_URL'));
            if ($url === '' || !preg_match('#^https?://#i', $url)) { fwrite(STDERR, "gecersiz url\n"); exit(1); }

            $UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36';
            $ch = curl_init($url);
            curl_setopt_array($ch, [CURLOPT_RETURNTRANSFER=>true, CURLOPT_FOLLOWLOCATION=>true, CURLOPT_MAXREDIRS=>6,
              CURLOPT_TIMEOUT=>30, CURLOPT_CONNECTTIMEOUT=>10, CURLOPT_USERAGENT=>$UA,
              CURLOPT_HTTPHEADER=>['Accept: text/html,application/xhtml+xml', 'Accept-Language: tr,en;q=0.8']]);
            $html = curl_exec($ch);
            $code = curl_getinfo($ch, CURLINFO_HTTP_CODE);
            $finalUrl = curl_getinfo($ch, CURLINFO_EFFECTIVE_URL);
            $err = curl_error($ch);
            curl_close($ch);
            printf("URL     : %s\n", $url);
            if ($finalUrl && $finalUrl !== $url) printf("YONLENDI: %s\n", $finalUrl);
            printf("HTTP    : %s   bayt: %d   %s\n\n", $code ?: '000', strlen((string)$html), $err);
            if (!$html) { fwrite(STDERR, "govde bos -- durduruluyor\n"); exit(1); }

            libxml_use_internal_errors(true);
            $doc = new DOMDocument();
            $doc->loadHTML('<?xml encoding="utf-8"?>' . $html);
            libxml_clear_errors();

            $xp = new DOMXPath($doc);
            $title = $xp->query('//title')->item(0);
            echo "BASLIK  : " . ($title ? trim($title->textContent) : '(yok)') . "\n";
            foreach ($xp->query('//meta[@name="description"]/@content') as $m) {
              echo "META    : " . trim($m->nodeValue) . "\n";
            }
            echo "\n";

            // Script/style govdeden cikar ki gorunur metin JS/CSS gurultusuyle dolmasin.
            foreach (['script', 'style', 'noscript'] as $tag) {
              $nodes = $doc->getElementsByTagName($tag);
              for ($i = $nodes->length - 1; $i >= 0; $i--) { $n = $nodes->item($i); $n->parentNode->removeChild($n); }
            }

            // Linkler: mutlak adrese cevrilir, metniyle birlikte, ayni URL tekrar yazilmaz.
            // Bir katalog/kategori sayfasinin YAPISI bundan cikar -- hangi yollar urun/kategori
            // gibi gorunuyor tahmin etmeden burada.
            $base = parse_url($finalUrl ?: $url);
            $resolve = function(string $href) use ($base): string {
              if ($href === '' || str_starts_with($href, '#') || str_starts_with($href, 'javascript:') || str_starts_with($href, 'mailto:') || str_starts_with($href, 'tel:')) return '';
              if (preg_match('#^https?://#i', $href)) return $href;
              $scheme = $base['scheme'] ?? 'https'; $host = $base['host'] ?? '';
              if (str_starts_with($href, '//')) return $scheme . ':' . $href;
              if (str_starts_with($href, '/')) return $scheme . '://' . $host . $href;
              $path = $base['path'] ?? '/'; $dir = substr($path, 0, strrpos($path, '/') ?: 0);
              return $scheme . '://' . $host . $dir . '/' . $href;
            };
            $seen = []; $links = [];
            foreach ($doc->getElementsByTagName('a') as $a) {
              $href = trim((string)$a->getAttribute('href'));
              $abs = $resolve($href);
              if ($abs === '' || isset($seen[$abs])) continue;
              $seen[$abs] = true;
              $text = trim(preg_replace('/\s+/', ' ', $a->textContent));
              $links[] = [$abs, $text];
            }
            printf("-- LINKLER (%d benzersiz) --\n", count($links));
            foreach (array_slice($links, 0, 150) as [$abs, $text]) {
              printf("  %-100s %s\n", mb_substr($abs, 0, 200), mb_substr($text, 0, 40));
            }
            if (count($links) > 150) echo "  ... (" . (count($links) - 150) . " tane daha, kirpildi)\n";

            // Gorseller: src (data-src/data-original lazy-load kaliplariyla birlikte)
            // mutlak adrese cevrilir, alt metniyle. Urun fotograflarinin nereden
            // geldigini gormek icin -- <a href> listesi bunu yakalamiyor.
            $imgSeen = []; $imgs = [];
            foreach ($doc->getElementsByTagName('img') as $im) {
              foreach (['src', 'data-src', 'data-original', 'data-lazy'] as $attr) {
                $src = trim((string)$im->getAttribute($attr));
                if ($src === '' || str_starts_with($src, 'data:')) continue;
                $abs = $resolve($src);
                if ($abs === '' || isset($imgSeen[$abs])) continue;
                $imgSeen[$abs] = true;
                $imgs[] = [$abs, trim((string)$im->getAttribute('alt'))];
                break;
              }
            }
            printf("-- GORSELLER (%d benzersiz) --\n", count($imgs));
            foreach (array_slice($imgs, 0, 60) as [$abs, $alt]) {
              printf("  %-100s %s\n", mb_substr($abs, 0, 200), mb_substr($alt, 0, 40));
            }
            if (count($imgs) > 60) echo "  ... (" . (count($imgs) - 60) . " tane daha, kirpildi)\n";

            // Govde metni: script/style temizlenmis agactan. Bos/whitespace-only
            // satirlar atiliyor -- her sayfada tekrar eden nev menusu tek basina
            // binlerce bos satir uretiyor ve asil icerigi (urun basligi/fiyati)
            // sabit karakter tavanindan disari itiyordu.
            $body = $doc->getElementsByTagName('body')->item(0);
            $raw = $body ? $body->textContent : '';
            $nonEmpty = array_values(array_filter(array_map('trim', explode("\n", $raw)), fn($l) => $l !== ''));
            $text = implode("\n", $nonEmpty);
            $LIM = 12000;
            echo "\n-- GORUNUR METIN (bos satirlar atildi, ilk {$LIM} karakter) --\n";
            echo mb_substr($text, 0, $LIM) . (mb_strlen($text) > $LIM ? "\n...(kirpildi)" : "") . "\n";
            PHPEOF
            php -l /tmp/vestra_siteprobe.php
            php /tmp/vestra_siteprobe.php; RC=$?
            rm -f /tmp/vestra_siteprobe.php
            exit $RC
      # Bu is akisinin ASIL konusundan bagimsiz, ayrica bir pilot veri-toplama
      # gorevi: kuloglutekstil.com.tr 'Bayan Sutyen' kategorisini tarar.
      # VESTRA'nin kendi urun/listing verisine DOKUNMAZ, hicbir sey import
      # ETMEZ -- yalniz sunucuda public_html DISINDA (~/kuloglu_import/)
      # bir JSON dosyasi biriktirir, sonraki bir incelemede kullanilmak
      # uzere. Salt okunur taraf: ucuncu tarafin canli sitesine kibar
      # istekler atar (istekler arasi gecikme, dusuk zaman asimi, paralel
      # yok), kendi sitesine hicbir yazma yapmaz.
      - name: "Kuloglu pilot veri toplama (sunucuda, salt okunur ucuncu-taraf tarama)"
        if: ${{ github.event.inputs.kuloglu != '' }}
        env:
          KULOGLU: ${{ github.event.inputs.kuloglu }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 25m
          envs: KULOGLU
          script: |
            cat > /tmp/vestra_kuloglu.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            @set_time_limit(0); @ini_set('implicit_flush','1');
            while (ob_get_level() > 0) { @ob_end_flush(); }

            $home = getenv('HOME') ?: getenv('HOME_OVERRIDE') ?: '.';
            $DIR = $home . '/kuloglu_import';
            if (!is_dir($DIR)) { @mkdir($DIR, 0700, true); }
            $URLS_FILE = $DIR . '/product_urls.json';
            $OUT_FILE  = $DIR . '/bayan_sutyen.json';
            $FAIL_FILE = $DIR . '/failures.json';
            $PAGES_FILE = $DIR . '/category_pages.json'; // diagnostic record of which category pages were fetched
            $PRICED_FILE = $DIR . '/bayan_sutyen_priced.json'; // TRY source + added EUR fields, from 'price' mode

            $BASE = 'https://www.kuloglutekstil.com.tr';
            $CATEGORY_PATH = '/kategori/bayan-sutyen';
            $CATEGORY_URL = $BASE . $CATEGORY_PATH;
            $UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36';

            $raw = trim((string)getenv('KULOGLU'));
            $parts = explode('|', $raw);
            $mode = strtolower(trim($parts[0] ?? ''));
            $arg1 = trim($parts[1] ?? '');
            $arg2 = trim($parts[2] ?? '');

            // ---------------------------------------------------------------------
            // low-level fetch — polite: caller is responsible for delay between calls
            // ---------------------------------------------------------------------
            function vfetch(string $url): array {
              global $UA;
              $ch = curl_init($url);
              curl_setopt_array($ch, [
                CURLOPT_RETURNTRANSFER=>true, CURLOPT_FOLLOWLOCATION=>true, CURLOPT_MAXREDIRS=>6,
                CURLOPT_TIMEOUT=>25, CURLOPT_CONNECTTIMEOUT=>10, CURLOPT_USERAGENT=>$UA,
                CURLOPT_HTTPHEADER=>['Accept: text/html,application/xhtml+xml','Accept-Language: tr,en;q=0.8'],
              ]);
              $html = curl_exec($ch);
              $code = (int)curl_getinfo($ch, CURLINFO_HTTP_CODE);
              $finalUrl = curl_getinfo($ch, CURLINFO_EFFECTIVE_URL);
              $err = curl_error($ch);
              curl_close($ch);
              return ['html'=>$html, 'code'=>$code, 'final'=>$finalUrl, 'err'=>$err];
            }

            function abs_url(string $href, string $baseUrl): string {
              if ($href === '' || str_starts_with($href,'#') || str_starts_with($href,'javascript:') || str_starts_with($href,'mailto:') || str_starts_with($href,'tel:')) return '';
              if (preg_match('#^https?://#i', $href)) return $href;
              $base = parse_url($baseUrl);
              $scheme = $base['scheme'] ?? 'https'; $host = $base['host'] ?? '';
              if (str_starts_with($href,'//')) return $scheme.':'.$href;
              if (str_starts_with($href,'/')) return $scheme.'://'.$host.$href;
              $path = $base['path'] ?? '/'; $dir = substr($path,0,strrpos($path,'/') ?: 0);
              return $scheme.'://'.$host.$dir.'/'.$href;
            }

            // Turkish decimal formatting: '.' thousands separator, ',' decimal separator.
            // A naive (float) cast on "1.234,56" would silently produce 1.234 — this
            // strips everything but digits/./, then removes thousands dots before
            // swapping the decimal comma, so it fails loudly (null) instead of
            // quietly mis-parsing.
            function tr_num($s): ?float {
              $s = trim((string)$s);
              if ($s === '') return null;
              $s = preg_replace('/[^0-9.,]/u', '', $s);
              if ($s === '') return null;
              if (str_contains($s, ',')) {
                $s = str_replace('.', '', $s);
                $s = str_replace(',', '.', $s);
              }
              return is_numeric($s) ? (float)$s : null;
            }

            function load_json(string $file, $default) {
              if (!is_file($file)) return $default;
              $txt = file_get_contents($file);
              if ($txt === '' || $txt === false) return $default;
              $j = json_decode($txt, true);
              return is_null($j) ? $default : $j;
            }
            function save_json_atomic(string $file, $data): void {
              $tmp = $file . '.tmp' . getmypid();
              file_put_contents($tmp, json_encode($data, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT));
              rename($tmp, $file);
            }

            function parse_dom(string $html): array {
              libxml_use_internal_errors(true);
              $doc = new DOMDocument();
              $doc->loadHTML('<?xml encoding="utf-8"?>' . $html);
              libxml_clear_errors();
              $xp = new DOMXPath($doc);
              return [$doc, $xp];
            }

            // Strips script/style/noscript in place, returns trimmed non-empty text lines
            // in document order — same normalization diag-admin-discover.yml's site_probe
            // uses, so behaviour already validated against this exact site.
            function visible_lines(DOMDocument $doc): array {
              foreach (['script','style','noscript'] as $tag) {
                $nodes = $doc->getElementsByTagName($tag);
                for ($i=$nodes->length-1; $i>=0; $i--) { $n=$nodes->item($i); if ($n->parentNode) $n->parentNode->removeChild($n); }
              }
              $body = $doc->getElementsByTagName('body')->item(0);
              $rawText = $body ? $body->textContent : '';
              return array_values(array_filter(array_map('trim', explode("\n",$rawText)), fn($l)=>$l!==''));
            }

            function find_line_index(array $lines, string $needle, int $from=0): int {
              for ($i=$from; $i<count($lines); $i++) if ($lines[$i] === $needle) return $i;
              return -1;
            }

            // A saved record is "stale" (needs re-crawling, not treated as done) when
            // it declared a variant count but didn't actually parse that many rows —
            // exactly the shape the pre-fix single-axis assortment-table bug produced
            // (declared 16, parsed 1, that one row being page-footer text). A record
            // with no table at all (declared === null, a genuine single-SKU product)
            // is never stale. Shared by 'crawl' (decides what to skip vs re-fetch) and
            // 'status' (reports the count) so the two can't drift out of sync.
            function kuloglu_record_is_stale(array $rec): bool {
              $declared = $rec['variant_count_declared'] ?? null;
              return $declared !== null && $declared !== ($rec['variant_count_parsed'] ?? null);
            }

            // Labels this page is known to render as their own line. Blank-line
            // stripping in visible_lines() means a genuinely EMPTY value (an empty
            // <dd></dd>, e.g. an unbranded accessory's "Marka") leaves no line behind
            // at all — so the naive "next line is the value" read would silently
            // swallow the following label's text as if it were this field's value.
            // value_after_label() treats "the next line is itself a known label" as
            // "value is empty" instead.
            const KULOGLU_KNOWN_LABELS = ['Kategori','Marka','Promosyon','Paket İçi Adet:','Fiyat','Seçenekler','RENK','BEDEN'];
            function value_after_label(array $lines, int $labelIdx): string {
              if ($labelIdx < 0 || !isset($lines[$labelIdx+1])) return '';
              $next = $lines[$labelIdx+1];
              if (in_array($next, KULOGLU_KNOWN_LABELS, true)) return '';
              if (preg_match('/^Asorti Tablo \(\d+\)$/u', $next)) return '';
              return $next;
            }

            // ---------------------------------------------------------------------
            // product-page extraction
            // ---------------------------------------------------------------------
            function extract_product(string $url): array {
              $r = vfetch($url);
              if (!$r['html'] || $r['code'] < 200 || $r['code'] >= 300) {
                return ['ok'=>false, 'url'=>$url, 'http_code'=>$r['code'], 'reason'=>'fetch_failed: '.($r['err'] ?: ('http '.$r['code']))];
              }
              return extract_product_from_html($r['html'], $url);
            }

            // Split out from extract_product() so the parsing logic can be unit-tested
            // against captured/synthetic HTML without a network call.
            function extract_product_from_html(string $html, string $url): array {
              [$doc, $xp] = parse_dom($html);

              $h1nodes = $xp->query('//h1');
              $h1 = $h1nodes->length ? trim(preg_replace('/\s+/u',' ', $h1nodes->item(0)->textContent)) : '';

              $lines = visible_lines($doc);

              $iKat = find_line_index($lines, 'Kategori');
              $category = value_after_label($lines, $iKat);
              $iMarka = find_line_index($lines, 'Marka');
              $brand = value_after_label($lines, $iMarka);
              $iPaket = find_line_index($lines, 'Paket İçi Adet:');
              $paketVal = value_after_label($lines, $iPaket);
              $packQty = $paketVal !== '' ? (int)preg_replace('/\D/u','', $paketVal) : null;
              $iFiyatLbl = find_line_index($lines, 'Fiyat');
              $fiyatVal = value_after_label($lines, $iFiyatLbl);
              $packPrice = $fiyatVal !== '' ? tr_num($fiyatVal) : null;

              // Base unit price: first "<n> TL + KDV"-shaped line, searched only in the
              // section before the "Kategori" label so a promo banner higher up ("10.000
              // TL ve Üzeri ...", no "+ KDV") can never match it.
              $unitPrice = null;
              $scanEnd = $iKat >= 0 ? $iKat : count($lines);
              for ($idx = 0; $idx < $scanEnd; $idx++) {
                if (preg_match('/TL\s*\+\s*KDV/u', $lines[$idx])) { $unitPrice = tr_num($lines[$idx]); break; }
              }

              $iAsorti = -1; $declaredCount = null;
              foreach ($lines as $idx=>$ln) {
                if (preg_match('/^Asorti Tablo \((\d+)\)$/u', $ln, $mm)) { $iAsorti = $idx; $declaredCount = (int)$mm[1]; break; }
              }
              $iRenk = find_line_index($lines, 'RENK');
              $iBeden = find_line_index($lines, 'BEDEN');
              $placeholderVals = ['Seçenek Seç', 'Seçiniz', 'Seçenek seçiniz'];

              $colors = [];
              if ($iRenk>=0) {
                $end = $iBeden>=0 ? $iBeden : ($iAsorti>=0?$iAsorti:count($lines));
                for ($i=$iRenk+1; $i<$end; $i++) if (!in_array($lines[$i], $placeholderVals, true)) $colors[] = $lines[$i];
              }
              $sizes = [];
              if ($iBeden>=0) {
                $end = $iAsorti>=0 ? $iAsorti : count($lines);
                for ($i=$iBeden+1; $i<$end; $i++) if (!in_array($lines[$i], $placeholderVals, true)) $sizes[] = $lines[$i];
              }
              $colors = array_values(array_unique($colors));
              $sizes  = array_values(array_unique($sizes));

              // Assortment table: two-axis products (colour AND size both offered)
              // label each row "<COLOR> - <SIZE>". A one-axis product (colour list
              // empty, or size list empty — e.g. a child's training bra sized only
              // "80050-112", "80050-113"...) has nothing to hyphenate, so its rows are
              // just the bare axis value with no " - " at all; a live test on 6 real
              // products (2 Sept 2026) found this is not rare — 2 of 6 hit it — and
              // without a fallback the scan kept walking past the whole page looking
              // for a hyphen and eventually matched a "Tüm hakları saklıdır. -"
              // fragment in the footer as if it were variant #1, reporting a wildly
              // wrong parsed count. The SAME bare-label shape also showed up on two
              // more real products (BELENG 1020/1021, found via a declared!=parsed
              // audit of the full 638-product crawl) that have exactly ONE colour
              // (e.g. just "TEN") and several sizes: with only one colour to choose,
              // the site drops the now-redundant "TEN - " prefix from every row too —
              // so a single-valued axis gets the same bare-label treatment as a
              // genuinely empty one, except the known single value is filled in on
              // every row (we DO know the colour, the row label just doesn't repeat
              // it) rather than left null. Bare-label rows are matched by exact
              // membership in whichever axis is empty-or-singleton; when BOTH axes
              // have 2+ values we require the hyphenated pair (matches every such
              // product seen so far) so a colour name that happens to equal a size
              // string can't false-positive. Either way the scan window is also
              // hard-bounded past declaredCount rows' worth of lines so a pattern miss
              // can never again wander into unrelated page content — declaredCount
              // comes from the table's own "Asorti Tablo (N)" heading, not a guess.
              $variants = [];
              if ($iAsorti >= 0) {
                $scanFrom = $iAsorti + 1;
                if (isset($lines[$scanFrom]) && stripos($lines[$scanFrom], 'Varyant') !== false) $scanFrom++;
                $scanCap = min(count($lines), $scanFrom + $declaredCount * 6 + 30);
                $singleAxis = null; $impliedColor = null; $impliedSize = null;
                if (empty($colors) && !empty($sizes)) { $singleAxis = ['sizes', $sizes]; }
                elseif (empty($sizes) && !empty($colors)) { $singleAxis = ['colors', $colors]; }
                elseif (count($colors) === 1 && count($sizes) > 1) { $singleAxis = ['sizes', $sizes]; $impliedColor = $colors[0]; }
                elseif (count($sizes) === 1 && count($colors) > 1) { $singleAxis = ['colors', $colors]; $impliedSize = $sizes[0]; }
                // Genuine multi x multi (colors AND sizes both have 2+ values) can
                // ALSO carry trailing bare rows — confirmed live 4 Sep 2026, KOTA 6438
                // BAYAN KAŞKORSE: 3 colours x 2 sizes gives 6 fully hyphenated rows
                // ("BEYAZ - L-XL", ...), then the table adds 2 MORE bare rows ("L-XL",
                // "S-M") after every hyphenated combo is already exhausted — a real
                // "no specific colour / mixed assortment" pair, same price/pack as the
                // rest. This is NOT the BELENG rowspan case (colour repeated-but-
                // omitted): here there IS no single colour to imply, so the bare row's
                // color is recorded as null — an honest "not specified", never a
                // guessed carry-forward of the last row's colour, which would fabricate
                // a fact the page doesn't actually state.
                $rowStarts = []; // each: [lineIdx, color|null, size|null]
                for ($i = $scanFrom; $i < $scanCap; $i++) {
                  $ln = $lines[$i];
                  if (preg_match('/^(.+?)\s-\s(.+)$/u', $ln, $vm)) {
                    $rowStarts[] = [$i, trim($vm[1]), trim($vm[2])];
                  } elseif ($singleAxis !== null && in_array($ln, $singleAxis[1], true)) {
                    $rowStarts[] = $singleAxis[0] === 'sizes' ? [$i, $impliedColor, $ln] : [$i, $ln, $impliedSize];
                  } elseif ($singleAxis === null && count($colors) > 1 && count($sizes) > 1 && in_array($ln, $sizes, true)) {
                    $rowStarts[] = [$i, null, $ln];
                  } elseif ($singleAxis === null && count($colors) > 1 && count($sizes) > 1 && in_array($ln, $colors, true)) {
                    $rowStarts[] = [$i, $ln, null];
                  } else {
                    continue;
                  }
                  if (count($rowStarts) >= $declaredCount) break;
                }
                foreach ($rowStarts as $k => $row) {
                  [$i, $vcolor, $vsize] = $row;
                  $windowEnd = $rowStarts[$k+1][0] ?? min(count($lines), $i + 8);
                  $vprice = null; $vqty = null; $inStock = null;
                  for ($j = $i+1; $j < $windowEnd; $j++) {
                    if ($vprice === null && preg_match('/TL/u', $lines[$j]) && tr_num($lines[$j]) !== null) $vprice = tr_num($lines[$j]);
                    if ($vqty === null && preg_match('/adet/iu', $lines[$j])) $vqty = (int)preg_replace('/\D/u','', $lines[$j]);
                  }
                  $inStock = ($vprice !== null || $vqty !== null) ? true : null; // null = couldn't tell, not a claim of out-of-stock
                  $variants[] = ['color'=>$vcolor, 'size'=>$vsize, 'price_try'=>$vprice, 'pack_qty'=>$vqty, 'in_stock'=>$inStock];
                }
              }

              // Images: the page also carries other unrelated products' photos in a
              // "recently viewed / related" rail — <img alt> is that OTHER product's
              // title, not this page's, so we can't just take "the first few images".
              // Match this product's own photo(s) by alt-text overlap with the title,
              // take its /myassets/products/<folder>/ id, then collect every image
              // sharing that folder (multi-photo products keep all of them under one
              // folder id) rather than only the single alt-matched file.
              $titleForMatch = $h1 !== '' ? $h1 : '';
              $allImgs = []; $imgSeen = [];
              foreach ($doc->getElementsByTagName('img') as $im) {
                foreach (['src','data-src','data-original','data-lazy'] as $attr) {
                  $src = trim((string)$im->getAttribute($attr));
                  if ($src==='' || str_starts_with($src,'data:')) continue;
                  $absImg = abs_url($src, $url);
                  if ($absImg==='' || isset($imgSeen[$absImg])) continue;
                  $imgSeen[$absImg]=true;
                  $allImgs[] = ['url'=>$absImg, 'alt'=>trim((string)$im->getAttribute('alt'))];
                  break;
                }
              }
              $ownFolder = null;
              foreach ($allImgs as $im) {
                if ($titleForMatch === '' || $im['alt'] === '') continue;
                $altNorm = mb_strtolower($im['alt']);
                $titleNorm = mb_strtolower($titleForMatch);
                if (str_contains($titleNorm, $altNorm) || str_contains($altNorm, mb_substr($titleNorm, 0, 15))) {
                  if (preg_match('#/myassets/products/([^/]+)/#', $im['url'], $fm)) { $ownFolder = $fm[1]; break; }
                }
              }
              $images = [];
              if ($ownFolder !== null) {
                foreach ($allImgs as $im) {
                  if (preg_match('#/myassets/products/'.preg_quote($ownFolder,'#').'/#', $im['url'])) {
                    $images[] = ['url'=>$im['url'], 'thumb'=>str_contains($im['url'],'_min.')];
                  }
                }
              }

              return [
                'ok' => true,
                'url' => $url,
                'brand' => $brand,
                'title' => $h1 !== '' ? $h1 : null,
                'category' => $category,
                'unit_price_try' => $unitPrice,
                'pack_qty' => $packQty,
                'pack_price_try' => $packPrice,
                'colors' => $colors,
                'sizes' => $sizes,
                'variant_count_declared' => $declaredCount,
                'variant_count_parsed' => count($variants),
                'variants' => $variants,
                'images' => $images,
                'image_match_note' => $ownFolder === null ? 'no alt-text match to title; images left empty rather than guessing' : null,
                'fetched_at' => gmdate('c'),
              ];
            }

            // ---------------------------------------------------------------------
            // modes
            // ---------------------------------------------------------------------
            if (defined('KULOGLU_NO_MAIN')) return;

            if ($mode === 'fields') {
              // Diagnostic only — does not touch any file. arg1 = comma-separated URLs.
              $urls = array_values(array_filter(array_map('trim', explode(',', $arg1))));
              if (!$urls) { fwrite(STDERR, "fields modu icin arg1'de virgullu URL listesi gerekli\n"); exit(1); }
              foreach ($urls as $n => $u) {
                if ($n > 0) usleep(300000);
                echo "==================================================================\n";
                echo "[".($n+1)."/".count($urls)."] $u\n";
                $t0 = microtime(true);
                $p = extract_product($u);
                $ms = round((microtime(true)-$t0)*1000);
                if (!$p['ok']) { echo "  FETCH BASARISIZ ({$ms} ms): {$p['reason']} (http {$p['http_code']})\n"; continue; }
                printf("  sure           : %d ms\n", $ms);
                printf("  brand          : %s\n", $p['brand']);
                printf("  title          : %s\n", $p['title']);
                printf("  category       : %s\n", $p['category']);
                printf("  unit_price_try : %s\n", var_export($p['unit_price_try'], true));
                printf("  pack_qty       : %s\n", var_export($p['pack_qty'], true));
                printf("  pack_price_try : %s  (unit*qty = %s)\n", var_export($p['pack_price_try'], true),
                  ($p['unit_price_try']!==null && $p['pack_qty']!==null) ? round($p['unit_price_try']*$p['pack_qty'],2) : 'n/a');
                printf("  colors (%d)    : %s\n", count($p['colors']), implode(' | ', $p['colors']));
                printf("  sizes (%d)     : %s\n", count($p['sizes']), implode(' | ', $p['sizes']));
                printf("  variants decl=%s parsed=%d\n", var_export($p['variant_count_declared'], true), $p['variant_count_parsed']);
                $priceset = array_unique(array_map(fn($v)=>$v['price_try'], $p['variants']));
                $qtyset   = array_unique(array_map(fn($v)=>$v['pack_qty'], $p['variants']));
                printf("  variant price set : %s\n", implode(', ', $priceset));
                printf("  variant qty set   : %s\n", implode(', ', $qtyset));
                printf("  UNIFORM PRICING?  : %s\n", (count($priceset)<=1 && count($qtyset)<=1) ? 'EVET (tek fiyat/adet)' : '*** HAYIR - varyant bazli farkli ***');
                foreach (array_slice($p['variants'],0,3) as $v) printf("    - %-16s %-8s %8s TL  x%s\n", $v['color'], $v['size'], $v['price_try'], $v['pack_qty']);
                if (count($p['variants'])>3) { echo "    ...\n"; foreach (array_slice($p['variants'],-2) as $v) printf("    - %-16s %-8s %8s TL  x%s\n", $v['color'], $v['size'], $v['price_try'], $v['pack_qty']); }
                printf("  images (%d)    : %s\n", count($p['images']), $p['image_match_note'] ?? '');
                foreach ($p['images'] as $im) echo "    - {$im['url']}".($im['thumb']?' [thumb]':' [full]')."\n";
              }
              exit(0);
            }

            if ($mode === 'paginate') {
              // Diagnostic only. Establish the real pagination mechanism for the
              // category page rather than assuming one.
              $r = vfetch($CATEGORY_URL);
              printf("HTTP %d, %d bytes: %s\n", $r['code'], strlen((string)$r['html']), $r['err']);
              if (!$r['html']) exit(1);
              $html = $r['html'];

              preg_match_all('#/urun/[a-z0-9\-]+#i', $html, $pm);
              $prodLinksRaw = array_values(array_unique($pm[0]));
              printf("\nHam HTML'de /urun/ linki (essiz): %d\n", count($prodLinksRaw));

              foreach (['sayfa=','page=','?p=','pagination','sayfala','per_page','perpage','limit=','pageindex','pagenumber','data-page','rel="next"','load-more','loadmore','infinite','pagesize','page_size','offset='] as $needle) {
                $pos = stripos($html, $needle);
                if ($pos !== false) {
                  $ctx = substr($html, max(0,$pos-60), 160);
                  $ctx = preg_replace('/\s+/', ' ', $ctx);
                  echo "  bulundu '{$needle}' @ {$pos}: ...".$ctx."...\n";
                }
              }

              [$doc, $xp] = parse_dom($html);
              echo "\n-- class adi 'pag' iceren elemanlar --\n";
              foreach ($xp->query('//*[contains(@class,"pag")]') as $node) {
                $cls = $node->getAttribute('class');
                $txt = trim(preg_replace('/\s+/', ' ', $node->textContent));
                printf("  <%s class=\"%s\"> text=%s\n", $node->nodeName, $cls, mb_substr($txt,0,150));
              }
              echo "\n-- kategori sayfasina geri donen linkler (kendi URL'i + query) --\n";
              foreach ($xp->query('//a[@href]') as $a) {
                $href = trim($a->getAttribute('href'));
                if (stripos($href, 'bayan-sutyen') !== false) {
                  $abs = abs_url($href, $r['final'] ?: $CATEGORY_URL);
                  echo "  {$abs}   [".trim(preg_replace('/\s+/',' ',$a->textContent))."]\n";
                }
              }

              echo "\n-- deneme: aday sayfalama URL'leri --\n";
              $candidates = [
                $CATEGORY_URL.'?page=2', $CATEGORY_URL.'?sayfa=2', $CATEGORY_URL.'/sayfa-2',
                $CATEGORY_URL.'?p=2', $CATEGORY_URL.'?pg=2', $CATEGORY_URL.'?sayfa=2&PageIndex=2',
              ];
              foreach ($candidates as $cand) {
                usleep(300000);
                $rc = vfetch($cand);
                if (!$rc['html']) { printf("  %-70s HTTP %s (govde yok)\n", $cand, $rc['code']); continue; }
                preg_match_all('#/urun/[a-z0-9\-]+#i', $rc['html'], $pm2);
                $set2 = array_values(array_unique($pm2[0]));
                $new = array_values(array_diff($set2, $prodLinksRaw));
                printf("  %-70s HTTP %-4s bayt=%-7d urun=%-4d yeni=%-4d\n", $cand, $rc['code'], strlen($rc['html']), count($set2), count($new));
              }
              exit(0);
            }

            if ($mode === 'list_urls') {
              // arg1 (optional): max pages safety cap, default 40.
              $maxPages = $arg1 !== '' ? (int)$arg1 : 40;
              $seen = [];
              $pageLog = [];
              $pageNum = 1;
              $consecutiveEmpty = 0;
              while ($pageNum <= $maxPages) {
                // Gercek sayfalama parametresi 'paginate' modunda dogrulandi:
                // <link rel="next" href="...?tp=2">; 'page='/'sayfa='/'p='/'pg=' hepsi
                // sessizce 1. sayfaya donuyordu (yeni=0), o yuzden ilk deneme "sayfalama
                // 60'ta bitti" sanmisti -- kategori gercekte 11 sayfa (paginate-wrapper: "1 2 3 4 .. 11").
                $pageUrl = $pageNum === 1 ? $CATEGORY_URL : ($CATEGORY_URL . '?tp=' . $pageNum);
                if ($pageNum > 1) usleep(300000);
                $r = vfetch($pageUrl);
                if (!$r['html'] || $r['code'] < 200 || $r['code'] >= 300) {
                  echo "sayfa {$pageNum}: FETCH BASARISIZ http={$r['code']} err={$r['err']} -- durduruluyor\n";
                  break;
                }
                preg_match_all('#/urun/[a-z0-9\-]+#i', $r['html'], $pm);
                $onPage = array_values(array_unique($pm[0]));
                $newCount = 0;
                foreach ($onPage as $p) { $abs = $BASE.$p; if (!isset($seen[$abs])) { $seen[$abs]=true; $newCount++; } }
                $pageLog[] = ['page'=>$pageNum, 'url'=>$pageUrl, 'http'=>$r['code'], 'bytes'=>strlen($r['html']), 'on_page'=>count($onPage), 'new'=>$newCount];
                printf("sayfa %-3d http=%s bayt=%-7d bu_sayfada=%-4d yeni=%-4d toplam=%-5d\n", $pageNum, $r['code'], strlen($r['html']), count($onPage), $newCount, count($seen));
                if ($newCount === 0) { $consecutiveEmpty++; } else { $consecutiveEmpty = 0; }
                if ($consecutiveEmpty >= 2) { echo "iki ardisik sayfada yeni urun yok -- sayfalama bitti kabul edildi\n"; break; }
                $pageNum++;
              }
              $urls = array_keys($seen);
              sort($urls);
              save_json_atomic($URLS_FILE, $urls);
              save_json_atomic($PAGES_FILE, $pageLog);
              printf("\nTOPLAM ESSIZ URUN URL: %d\n", count($urls));
              printf("yazildi: %s\n", $URLS_FILE);
              exit(0);
            }

            if ($mode === 'crawl') {
              $start = $arg1 !== '' ? (int)$arg1 : 0;
              $count = $arg2 !== '' ? (int)$arg2 : 100;
              $urls = load_json($URLS_FILE, null);
              if (!is_array($urls)) { fwrite(STDERR, "product_urls.json yok/okunamadi -- once list_urls calistir\n"); exit(1); }

              // A record saved by a pre-fix crawler (declaredCount != parsed variant
              // count — the exact shape of the single-axis assortment-table bug fixed
              // 4 Sep 2026) is NOT treated as "already done": it's left out of $byUrl
              // so the loop below re-fetches and overwrites it. Anything that parsed
              // cleanly (or genuinely has no variant table at all — declared === null)
              // is left alone, so a repeat run only re-touches the products that were
              // actually wrong instead of re-fetching all 638 out of politeness.
              $existing = load_json($OUT_FILE, []);
              $byUrl = []; $staleN = 0;
              foreach ($existing as $rec) {
                if (!isset($rec['url'])) continue;
                if (kuloglu_record_is_stale($rec)) { $staleN++; continue; }
                $byUrl[$rec['url']] = $rec;
              }
              $failures = load_json($FAIL_FILE, []);
              $failByUrl = [];
              foreach ($failures as $rec) if (isset($rec['url'])) $failByUrl[$rec['url']] = $rec;

              $slice = array_slice($urls, $start, $count);
              printf("kuyruk toplam=%d, bu parti [%d..%d) = %d url\n", count($urls), $start, $start+count($slice), count($slice));
              if ($staleN > 0) printf("eski (declared!=parsed) kayittan yeniden cekilecek: %d -- bunlar 'zaten vardi' sayilmiyor\n", $staleN);

              $okN=0; $failN=0; $skipN=0; $thisBatchFails = [];
              $t0 = microtime(true);
              foreach ($slice as $i => $u) {
                if (isset($byUrl[$u])) { $skipN++; continue; } // already crawled successfully in a prior run
                if ($i > 0) usleep(300000 + random_int(0,100000)); // 300-400ms politeness delay
                $p = extract_product($u);
                if ($p['ok']) {
                  $byUrl[$u] = $p; $okN++;
                  unset($failByUrl[$u]); // succeeded on retry -> drop any stale failure record
                } else {
                  $rec = ['url'=>$u, 'http_code'=>$p['http_code'], 'reason'=>$p['reason'], 'when'=>gmdate('c')];
                  $failByUrl[$u] = $rec; $thisBatchFails[] = $rec;
                  $failN++;
                }
                if (($okN+$failN) % 20 === 0) printf("  ... %d/%d islendi (ok=%d fail=%d)\n", $okN+$failN, count($slice), $okN, $failN);
              }
              save_json_atomic($OUT_FILE, array_values($byUrl));
              save_json_atomic($FAIL_FILE, array_values($failByUrl));
              $secs = round(microtime(true)-$t0,1);

              printf("\nBu parti bitti: ok=%d fail=%d atlandi(zaten vardi)=%d sure=%ss\n", $okN, $failN, $skipN, $secs);
              printf("Dosyadaki toplam basarili kayit: %d\n", count($byUrl));
              printf("Dosyadaki toplam hata kaydi    : %d\n", count($failByUrl));
              if ($thisBatchFails) {
                echo "\nBu partideki hatalar:\n";
                foreach ($thisBatchFails as $f) printf("  %-90s http=%-4s %s\n", $f['url'], $f['http_code'], $f['reason']);
              }
              echo "\n-- bu partiden 2 ornek kayit --\n";
              $sample = array_slice(array_filter($slice, fn($u)=>isset($byUrl[$u]) ), 0, 2);
              foreach ($sample as $u) echo json_encode($byUrl[$u], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT)."\n";
              exit(0);
            }

            // TRY -> EUR + %100 kar. Kur kaynagi VESTRA'nin kendi fatura-donusum
            // mekanizmasiyla (inc/money.php) AYNI aile: once frankfurter.app (ECB
            // referansini anahtarsiz servis eder), sonra ECB'nin kendi gunluk XML'i,
            // en sonda acik piyasa kuru -- ayni sira, ayni "hangi kaynak" etiketleme.
            // Ayri, tek-seferlik bir fetch: canli ziyaretci donusum yolu (vestra_fx,
            // yalnizca USD/AUD/CAD tasir) TRY icin hic dokunulmuyor -- ithalat
            // hesaplamasi buraya bagli olsun diye gercek alici gorunumune risk
            // eklemenin anlami yok.
            // KDV'siz taban fiyat kullanilir (Kuloglu'nin "Fiyat" alani zaten KDV
            // haric) -- Turk KDV'si sinir otesi bir toptan alimda alicidan tahsil
            // edilecek bir sey degil, maliyet tabanina karismamali.
            // %100 kar = satis fiyati maliyetin TAM IKI KATI ("yuzde yuz kar
            // koyarmisin" -- maliyete eklenen kar, maliyetin kendisi kadar).
            if ($mode === 'price') {
              function kuloglu_try_eur_sources(): array {
                return [
                  'ecb' => function (): ?array {
                    $raw = vfetch('https://api.frankfurter.app/latest?from=EUR&to=TRY')['html'] ?? null;
                    if (!$raw) return null;
                    $d = json_decode($raw, true);
                    $r = (float)($d['rates']['TRY'] ?? 0);
                    return $r > 0 ? ['rate' => $r, 'date' => (string)($d['date'] ?? '')] : null;
                  },
                  'ecb2' => function (): ?array {
                    $raw = vfetch('https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml')['html'] ?? null;
                    if (!$raw) return null;
                    $date = preg_match('/time=\'([\d-]+)\'/', $raw, $m) ? $m[1] : '';
                    if (!preg_match('/currency=\'TRY\'\s+rate=\'([\d.]+)\'/', $raw, $m)) return null;
                    return ['rate' => (float)$m[1], 'date' => $date];
                  },
                  'market' => function (): ?array {
                    $raw = vfetch('https://open.er-api.com/v6/latest/EUR')['html'] ?? null;
                    if (!$raw) return null;
                    $d = json_decode($raw, true);
                    $r = (float)($d['rates']['TRY'] ?? 0);
                    return $r > 0 ? ['rate' => $r, 'date' => substr((string)($d['time_last_update_utc'] ?? ''), 5, 11)] : null;
                  },
                ];
              }
              $rateInfo = null; $rateSource = '';
              foreach (kuloglu_try_eur_sources() as $name => $fetchFn) {
                $r = $fetchFn();
                if ($r !== null) { $rateInfo = $r; $rateSource = $name === 'market' ? 'market' : 'ecb'; break; }
              }
              if ($rateInfo === null) { fwrite(STDERR, "hicbir kur kaynagi acilamadi -- fiyatlandirma durduruldu\n"); exit(1); }
              $rate = $rateInfo['rate']; $rateDate = $rateInfo['date'];
              printf("kur: 1 EUR = %s TRY (kaynak=%s, tarih=%s)\n", $rate, $rateSource, $rateDate ?: '?');

              $existing = load_json($OUT_FILE, []);
              if (!$existing) { fwrite(STDERR, "bayan_sutyen.json bos/yok -- once crawl calistir\n"); exit(1); }

              $toEur = function (?float $try) use ($rate): ?float {
                if ($try === null || $try <= 0) return null;
                return round(($try / $rate) * 2, 2);   // maliyet=TRY/kur, satis=maliyet*2 (%100 kar)
              };
              $priced = []; $allEur = [];
              foreach ($existing as $rec) {
                $rec['unit_price_eur'] = $toEur($rec['unit_price_try'] ?? null);
                $rec['pack_price_eur'] = $toEur($rec['pack_price_try'] ?? null);
                foreach ($rec['variants'] as &$v) {
                  $v['price_eur'] = $toEur($v['price_try'] ?? null);
                  if ($v['price_eur'] !== null) $allEur[] = $v['price_eur'];
                }
                unset($v);
                $rec['eur_rate_used'] = $rate; $rec['eur_rate_date'] = $rateDate; $rec['eur_rate_source'] = $rateSource;
                $priced[] = $rec;
              }
              save_json_atomic($PRICED_FILE, $priced);
              printf("yazildi: %s (%d kayit)\n", $PRICED_FILE, count($priced));
              if ($allEur) {
                sort($allEur);
                $n = count($allEur);
                printf("varyant EUR fiyati -- min=%.2f orta=%.2f maks=%.2f (n=%d)\n", $allEur[0], $allEur[intdiv($n,2)], $allEur[$n-1], $n);
              }
              echo "\n-- 3 ornek kayit (TRY -> EUR) --\n";
              foreach (array_slice($priced, 0, 3) as $rec) {
                printf("  %s\n    TRY birim=%s -> EUR birim=%s   (varyant sayisi=%d)\n",
                  mb_substr($rec['title'] ?? $rec['url'], 0, 60),
                  var_export($rec['unit_price_try'] ?? null, true), var_export($rec['unit_price_eur'] ?? null, true),
                  count($rec['variants'] ?? []));
              }
              exit(0);
            }

            // Ceviri, 638 urunun her birini ayri ayri elle yazmak yerine TEKRAR EDEN,
            // SONLU kelime dagarcigina uygulanacak: marka+model disinda kalan baslik
            // kelimeleri (SÜTYEN, TOPARLAYICI, DESTEKSIZ...), kategori adlari, renkler,
            // bedenler. Bu mod hicbir sey yazmaz -- yalnizca o dagarcigi essiz/sayimli
            // dokup log'a basar, ceviri sozlugu ELLE (bu depodaki her ceviri gibi)
            // kurulsun diye.
            if ($mode === 'vocab') {
              $existing = load_json($OUT_FILE, []);
              if (!$existing) { fwrite(STDERR, "bayan_sutyen.json bos/yok -- once crawl calistir\n"); exit(1); }
              $brands = []; $cats = []; $colors = []; $sizes = []; $words = [];
              foreach ($existing as $rec) {
                if (!empty($rec['brand'])) $brands[$rec['brand']] = ($brands[$rec['brand']] ?? 0) + 1;
                if (!empty($rec['category'])) $cats[$rec['category']] = ($cats[$rec['category']] ?? 0) + 1;
                foreach ($rec['colors'] ?? [] as $c) $colors[$c] = ($colors[$c] ?? 0) + 1;
                foreach ($rec['sizes'] ?? [] as $s) $sizes[$s] = ($sizes[$s] ?? 0) + 1;
                $title = $rec['title'] ?? ''; $brand = $rec['brand'] ?? '';
                $rest = $brand !== '' ? trim(str_ireplace($brand, '', $title)) : $title;
                foreach (preg_split('/\s+/u', $rest) as $w) {
                  $w = trim($w);
                  if ($w === '' || preg_match('/^[0-9]+[A-Z0-9.\-]*$/u', $w)) continue; // model no, e.g. 0063, 6438-B
                  $words[$w] = ($words[$w] ?? 0) + 1;
                }
              }
              arsort($brands); arsort($cats); arsort($colors); arsort($sizes); arsort($words);
              printf("-- marka (essiz=%d) --\n", count($brands));
              foreach ($brands as $k=>$n) printf("  %-30s %d\n", $k, $n);
              printf("\n-- kategori (essiz=%d) --\n", count($cats));
              foreach ($cats as $k=>$n) printf("  %-40s %d\n", $k, $n);
              printf("\n-- renk (essiz=%d) --\n", count($colors));
              foreach ($colors as $k=>$n) printf("  %-20s %d\n", $k, $n);
              printf("\n-- beden (essiz=%d) --\n", count($sizes));
              foreach ($sizes as $k=>$n) printf("  %-20s %d\n", $k, $n);
              printf("\n-- baslikta marka/model disi kelimeler (essiz=%d, >=2 kez gecenler) --\n", count($words));
              foreach ($words as $k=>$n) { if ($n >= 2) printf("  %-25s %d\n", $k, $n); }
              exit(0);
            }

            // Fotograflari sunucuda indirip yeniden kodlar: GD'den gecirmek EXIF'i
            // dogal olarak siler (yeni bir goruntu kaynagi olusturup kaydetmek EXIF
            // tasimaz -- elle bir "sil" adimi degil, round-trip'in kendisi), kalite
            // YUKSEK TUTULUR (JPEG q=95 -- "kaliteler kesinlikle bozulmasin" talebi).
            // Format degistirmek ters-gorsel-arama zaten YENMEZ (icerik-hash tabanli,
            // bicimden bagimsiz calisir); asil kaldirac uploads/wholesale-underwear/
            // .htaccess'teki X-Robots-Tag -- Google'in bu klasoru PASIF taramayla
            // bulup indekslemesini durduran o. Bu mod yalnizca dosyalari indirip
            // ~/kuloglu_import/images_staged/ altina KAYDEDER (public_html DISI);
            // gercek uploads/wholesale-underwear/ klasorune kopyalanmasi
            // add-products.yml'nin stage_from= mekanizmasiyla, urun yazma adiminda.
            if ($mode === 'images') {
              if (!function_exists('imagecreatefromstring')) { fwrite(STDERR, "GD eklentisi yok -- goruntu isleme mumkun degil\n"); exit(1); }
              $start = $arg1 !== '' ? (int)$arg1 : 0;
              $count = $arg2 !== '' ? (int)$arg2 : 5;
              $existing = load_json($OUT_FILE, []);
              if (!$existing) { fwrite(STDERR, "bayan_sutyen.json bos/yok -- once crawl calistir\n"); exit(1); }
              $IMAGES_DIR = $DIR . '/images_staged';
              if (!is_dir($IMAGES_DIR)) @mkdir($IMAGES_DIR, 0700, true);
              $IMAGES_MAP_FILE = $DIR . '/images_staged.json';
              $map = load_json($IMAGES_MAP_FILE, []);

              $slice = array_slice($existing, $start, $count);
              printf("kuyruk toplam=%d, bu parti [%d..%d) = %d urun\n", count($existing), $start, $start+count($slice), count($slice));

              $fold = function (string $s): string {
                $s = @iconv('UTF-8', 'ASCII//TRANSLIT', $s) ?: $s;
                $s = mb_strtolower($s);
                $s = preg_replace('/[^a-z0-9]+/', '-', $s);
                return trim($s, '-');
              };

              $okN = 0; $failN = 0; $skipN = 0; $samples = [];
              foreach ($slice as $i => $rec) {
                $url = $rec['url'] ?? '';
                if ($url === '') continue;
                if (isset($map[$url]) && $map[$url]) { $skipN++; continue; } // already staged
                preg_match('#/urun/([a-z0-9\-]+)#i', $url, $sm);
                $slug = $sm[1] ?? $fold((string)($rec['title'] ?? $url));
                $imgs = array_values(array_filter($rec['images'] ?? [], fn($im) => empty($im['thumb'])));
                if (!$imgs) $imgs = $rec['images'] ?? []; // no full-size flagged -- fall back to whatever exists
                $staged = [];
                foreach ($imgs as $n => $im) {
                  $imgUrl = $im['url'] ?? '';
                  if ($imgUrl === '') continue;
                  if ($i > 0 || $n > 0) usleep(300000 + random_int(0, 100000));
                  $r = vfetch($imgUrl);
                  if (!$r['html'] || $r['code'] < 200 || $r['code'] >= 300) { $failN++; continue; }
                  $raw = $r['html'];
                  $srcBytes = strlen($raw);
                  $info = @getimagesizefromstring($raw);
                  $img = @imagecreatefromstring($raw);
                  if (!$img) { $failN++; continue; }
                  $ext = ($info['mime'] ?? '') === 'image/png' ? 'png' : 'jpg';
                  $filename = $slug . ($n > 0 ? '-' . ($n + 1) : '') . '.' . $ext;
                  $outPath = $IMAGES_DIR . '/' . $filename;
                  // q=100, not 95: operator wording was emphatic ("kesinlikle
                  // bozulmasin" -- quality must ABSOLUTELY not degrade), file
                  // size was never the constraint, and the first live test
                  // (q=95) already showed staged files land LARGER than the
                  // source (177KB->410KB, 78KB->171KB) -- re-encoding an
                  // already-compressed JPEG doesn't recover lost detail, it
                  // just spends more bits not re-losing any more of it, so
                  // there is no size upside to trading away for a lower
                  // setting here. PNG stays at compression level 1 (already
                  // the least lossy GD offers; PNG compression is lossless
                  // at every level, 1 just skips spending CPU re-compressing
                  // harder for the same pixels).
                  $ok = $ext === 'png' ? imagepng($img, $outPath, 1) : imagejpeg($img, $outPath, 100);
                  $w = imagesx($img); $h = imagesy($img);
                  imagedestroy($img);
                  if (!$ok) { $failN++; continue; }
                  $dstBytes = filesize($outPath);
                  $staged[] = $filename;
                  $okN++;
                  if (count($samples) < 5) $samples[] = ['slug'=>$slug, 'w'=>$w, 'h'=>$h, 'src_kb'=>round($srcBytes/1024,1), 'dst_kb'=>round($dstBytes/1024,1)];
                }
                if ($staged) $map[$url] = $staged;
              }
              save_json_atomic($IMAGES_MAP_FILE, $map);
              printf("\nBu parti bitti: indirilen=%d hata=%d atlandi(zaten vardi)=%d\n", $okN, $failN, $skipN);
              printf("Dosyadaki toplam eslesme: %d urun\n", count($map));
              printf("yazildi: %s\n", $IMAGES_MAP_FILE);
              if ($samples) {
                echo "\n-- ornek (boyut/kalite karsilastirma) --\n";
                foreach ($samples as $s) printf("  %-45s %dx%d  kaynak=%.1fKB -> kayitli=%.1fKB\n", $s['slug'], $s['w'], $s['h'], $s['src_kb'], $s['dst_kb']);
              }
              exit(0);
            }

            // 'reset' zaten var ama kapsami dar (bayan_sutyen.json + failures.json) --
            // ayni bilerek: veri cikarim mantigi degisirse eski, hatali kayitlarla
            // dolu bir dosyayi "zaten var" diye atlamamak icin. Bu, resmin AYNI
            // dersi: JPEG kalitesi 95->100 degisince (bu depoda tam olarak oldu)
            // 'images' modunun kendi "zaten var" atlama mantigi eski, dusuk kaliteli
            // dosyalari sessizce korurdu. Yalnizca images_staged.json + o klasordeki
            // dosyalari siler; product_urls.json ve bayan_sutyen*.json'a dokunmaz.
            if ($mode === 'images_reset') {
              $IMAGES_DIR = $DIR . '/images_staged';
              $IMAGES_MAP_FILE = $DIR . '/images_staged.json';
              $n = 0;
              if (is_dir($IMAGES_DIR)) {
                foreach (glob($IMAGES_DIR . '/*') ?: [] as $f) { if (is_file($f) && @unlink($f)) $n++; }
              }
              save_json_atomic($IMAGES_MAP_FILE, []);
              printf("sifirlandi: images_staged.json + %d dosya (images_staged/ altinda)\n", $n);
              exit(0);
            }

            // crawl'un "zaten basarili" atlama mantigi URL'in dosyada olup olmadigina
            // bakiyor, dogruluguna degil -- parser mantigi degistiginde (bu depoda tam
            // olarak oldu: tek-eksenli asorti tablosu duzeltmesi) eski, hatali kayitlarla
            // dolu bir dosyayi "zaten var" diye atlardi. reset bayan_sutyen.json ve
            // failures.json'i BOSALTIR, product_urls.json'a (essiz urun linkleri)
            // DOKUNMAZ -- yeniden sayfalamaya gerek yok, sadece yeniden CIKARIM gerekiyor.
            if ($mode === 'reset') {
              save_json_atomic($OUT_FILE, []);
              save_json_atomic($FAIL_FILE, []);
              echo "sifirlandi: bayan_sutyen.json, failures.json (product_urls.json korundu)\n";
              exit(0);
            }

            if ($mode === 'status') {
              $urls = load_json($URLS_FILE, []);
              $existing = load_json($OUT_FILE, []);
              $failures = load_json($FAIL_FILE, []);
              printf("kuyruk (product_urls.json)   : %d\n", count($urls));
              printf("basarili (bayan_sutyen.json) : %d\n", count($existing));
              printf("hatali (failures.json)       : %d\n", count($failures));
              $doneUrls = array_column($existing, 'url');
              $remaining = array_values(array_diff($urls, $doneUrls));
              printf("kalan (henuz denenmemis)     : %d\n", count(array_filter($remaining, fn($u)=>!in_array($u, array_column($failures,'url'), true))));
              if ($existing) {
                printf("dosya boyutu (bayan_sutyen.json): %d bayt\n", filesize($OUT_FILE));
                $priceUniform = 0; $priceVaries = 0; $staleN = 0; $staleUrls = []; $varyUrls = [];
                foreach ($existing as $rec) {
                  $ps = array_unique(array_map(fn($v)=>$v['price_try']??null, $rec['variants']??[]));
                  $qs = array_unique(array_map(fn($v)=>$v['pack_qty']??null, $rec['variants']??[]));
                  if (count($ps)<=1 && count($qs)<=1) $priceUniform++; else { $priceVaries++; $varyUrls[] = $rec['url']??'?'; }
                  if (kuloglu_record_is_stale($rec)) { $staleN++; $staleUrls[] = ($rec['url']??'?').' (decl='.($rec['variant_count_declared']??'?').' parsed='.($rec['variant_count_parsed']??'?').')'; }
                }
                printf("tek fiyat/adetli urun         : %d\n", $priceUniform);
                printf("varyant bazli farkli fiyatli  : %d\n", $priceVaries);
                if ($varyUrls) { echo "  (farkli fiyatli urunler:)\n"; foreach ($varyUrls as $u) echo "   - $u\n"; }
                if ($staleN > 0) {
                  printf("*** eski/hatali kayit (declared!=parsed, 'crawl' bunlari kendiliginden yeniden cekecek): %d ***\n", $staleN);
                  foreach ($staleUrls as $u) echo "   - $u\n";
                }
                // Every sample seen in log tails so far happened to be single-axis
                // (size-only). Pull real two-axis (renk+beden birlikte) records here
                // so extraction on the *other* branch of the parser is actually
                // checked, not assumed from the single-axis cases alone.
                $twoAxis = array_values(array_filter($existing, function($rec) {
                  foreach ($rec['variants'] ?? [] as $v) {
                    if (($v['color'] ?? null) !== null && ($v['size'] ?? null) !== null) return true;
                  }
                  return false;
                }));
                printf("iki eksenli (renk+beden) urun sayisi: %d\n", count($twoAxis));
                if ($twoAxis) {
                  echo "-- 2 ornek iki eksenli kayit --\n";
                  foreach (array_slice($twoAxis, 0, 2) as $rec) echo json_encode($rec, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT)."\n";
                }
              }
              if ($failures) {
                echo "\nhata nedenleri (gruplu):\n";
                $byReason = [];
                foreach ($failures as $f) { $key = preg_replace('/\d+/','#', $f['reason']??'?'); $byReason[$key] = ($byReason[$key]??0)+1; }
                arsort($byReason);
                foreach ($byReason as $k=>$n) printf("  %-60s %d\n", $k, $n);
              }
              exit(0);
            }
            fwrite(STDERR, "bilinmeyen mod: '{$mode}'. beklenen: fields|paginate|list_urls|crawl|price|vocab|images|images_reset|reset|status\n");
            exit(1);



            PHPEOF
            php -l /tmp/vestra_kuloglu.php
            php /tmp/vestra_kuloglu.php; RC=$?
            rm -f /tmp/vestra_kuloglu.php
            exit $RC

      # Tek bir urun fotografini gostermek icin: bu ortamdan kuloglutekstil.com.tr'a
      # dogrudan cikis yasak, o yuzden ayni "sunucudan cek, base64 olarak logla" kalibi
      # (wetransfer_probe'un fotograf sayfalari ile ayni ilke). |spaced: Actions gizli
      # deger maskelemesi (ör. DEPLOY_PORT="22") base64'un icinde bitisik gecen rakamlari
      # da bozuyor -- araya bosluk girince hicbir gizli deger bitisik gecmiyor.
      - name: "Kuloglu tek fotograf (base64, sunucudan)"
        if: ${{ github.event.inputs.kuloglu_image != '' }}
        env:
          IMG_URL: ${{ github.event.inputs.kuloglu_image }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 3m
          envs: IMG_URL
          script: |
            cat > /tmp/vestra_kuloglu_img.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $url = trim((string)getenv('IMG_URL'));
            if ($url === '' || !preg_match('#^https://www\.kuloglutekstil\.com\.tr/#', $url)) {
              fwrite(STDERR, "gecersiz url (yalnizca kuloglutekstil.com.tr)\n"); exit(1);
            }
            $UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36';
            $ch = curl_init($url);
            curl_setopt_array($ch, [CURLOPT_RETURNTRANSFER=>true, CURLOPT_FOLLOWLOCATION=>true, CURLOPT_MAXREDIRS=>5,
              CURLOPT_TIMEOUT=>25, CURLOPT_CONNECTTIMEOUT=>10, CURLOPT_USERAGENT=>$UA]);
            $bin = curl_exec($ch);
            $code = curl_getinfo($ch, CURLINFO_HTTP_CODE);
            $ctype = curl_getinfo($ch, CURLINFO_CONTENT_TYPE);
            $err = curl_error($ch);
            curl_close($ch);
            printf("HTTP %s   content-type=%s   bayt=%d   %s\n", $code ?: '000', $ctype ?: '?', strlen((string)$bin), $err);
            if (!$bin || $code < 200 || $code >= 300) { fwrite(STDERR, "indirilemedi\n"); exit(1); }
            echo "IMG_B64_BEGIN\n";
            foreach (str_split(base64_encode($bin), 4000) as $ln) echo implode(' ', str_split($ln))."\n";
            echo "IMG_B64_END\n";
            PHPEOF
            php -l /tmp/vestra_kuloglu_img.php
            php /tmp/vestra_kuloglu_img.php; RC=$?
            rm -f /tmp/vestra_kuloglu_img.php
            exit $RC
