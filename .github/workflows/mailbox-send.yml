name: (E-posta) support@ posta kutusundan gönder — kotasız

# Brevo kotasına girmeden, support@vestrasales.com'un KENDİ posta sunucusundan gönderir
# (sağlayıcı DKIM ile imzalar → itibarlı). Sunucumuz giden SMTP'yi kapattığı için mektubu
# bu GitHub makinesi gönderir; seçim, metin ve damgalama sunucuda
# (scripts/server/vestra-mailbox-queue.php) — aynı adrese asla ikinci kez gitmez.
#
# Kipler:
#   check  = yalnız herkese açık DNS (MX/SPF/DMARC/DKIM). Şifre KULLANILMAZ, mektup gitmez.
#   test   = gerçek kampanyadan TEK örnek, "[TEST]" önekiyle yalnız test_to adresine.
#   send   = 'limit' kadar müşteriye gönderir, sonuçları sunucuda damgalar.
# Şifre: secrets.MAILBOX_PASS. Sunucu adı: smtp_host girdisi ya da vars.MAILBOX_SMTP_HOST
# (tahmin YOK — tek sunucu). Depo herkese açık: kayıtta alıcı adresleri maskelidir.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "server (önerilen: sunucunun kendi posta servisi gönderir) | release (ids'deki lemlist damgasını geri al) | status | check | test | send (yedek: GitHub'dan GoDaddy SMTP) | bounces"
        required: true
        default: server
      limit:
        description: "send kipinde bu koşuda en çok kaç müşteri (ilk haftalar 20-30)"
        required: false
        default: "25"
      campaign:
        description: "lesgarage | polos | standard | ai:<id>"
        required: false
        default: lesgarage
      test_to:
        description: "test kipinde mektubun gideceği adres"
        required: false
        default: acerasoft@gmail.com
      check_domains:
        description: "check kipinde: bu alan adlarının e-posta sunucusunu doğrula (virgülle)"
        required: false
        default: ""
      ids:
        description: "isteğe bağlı: yalnız bu lead ID'leri (virgülle). Boş = sıradaki yazılmamışlar"
        required: false
        default: ""
      smtp_host:
        description: "SMTP sunucusu (boş = vars.MAILBOX_SMTP_HOST)"
        required: false
        default: ""
      smtp_port:
        description: "465 (SSL) ya da 587 (STARTTLS)"
        required: false
        default: "465"
      req_id:
        description: "(otomatik) admin panelindeki isteğin kimliği — mailbox-queue.yml doldurur"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: mailbox-send
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
      MODE: ${{ github.event.inputs.mode }}
      TERM: dumb
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Girdileri doğrula
        env:
          LIMIT: ${{ github.event.inputs.limit }}
          CAMPAIGN: ${{ github.event.inputs.campaign }}
          IDS: ${{ github.event.inputs.ids }}
          REQ_ID: ${{ github.event.inputs.req_id }}
        run: |
          case "$REQ_ID" in *[!A-Za-z0-9]*) echo "req_id gecersiz"; exit 1 ;; esac
          case "$IDS" in *[!A-Za-z0-9,]*) echo "ids yalniz harf/rakam/virgul"; exit 1 ;; esac
          case "$MODE" in server|release|status|check|test|send|bounces) ;; *) echo "gecersiz mode"; exit 1 ;; esac
          case "$LIMIT" in ''|*[!0-9]*) echo "limit sayi olmali"; exit 1 ;; esac
          case "$CAMPAIGN" in *[!A-Za-z0-9:_-]*) echo "gecersiz kampanya"; exit 1 ;; esac

      - name: DNS denetimi (MX / SPF / DMARC / DKIM) — şifresiz
        if: env.MODE == 'check'
        env:
          CHECK_DOMAINS: ${{ github.event.inputs.check_domains }}
        run: |
          case "$CHECK_DOMAINS" in *[!A-Za-z0-9.,-]*) echo "check_domains gecersiz"; exit 1 ;; esac
          python3 scripts/ci/mailbox_send.py --check --check-domains "$CHECK_DOMAINS"

      - name: SSH ayarı
        if: env.MODE != 'check'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          {
            echo "Host vestra"
            echo "  HostName ${DEPLOY_HOST}"
            echo "  User ${DEPLOY_USER}"
            echo "  Port ${DEPLOY_PORT}"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  StrictHostKeyChecking no"
            echo "  UserKnownHostsFile /dev/null"
            echo "  LogLevel ERROR"
            echo "  ConnectTimeout 25"
          } > ~/.ssh/config && chmod 600 ~/.ssh/config

      - name: Sunucu yolu — istek / damga geri alma / durum (sunucunun kendi posta servisi)
        if: env.MODE == 'server' || env.MODE == 'release' || env.MODE == 'status'
        env:
          LIMIT: ${{ github.event.inputs.limit }}
          CAMPAIGN: ${{ github.event.inputs.campaign }}
          IDS: ${{ github.event.inputs.ids }}
        run: |
          set -o pipefail
          ssh vestra 'mkdir -p ~/vestra_tmp' && ssh vestra 'cat > ~/vestra_tmp/mailbox-queue.php' < scripts/server/vestra-mailbox-queue.php
          Q='cd ~/public_html && php ~/vestra_tmp/mailbox-queue.php'
          if [ -n "$IDS" ] && [ "$MODE" != status ]; then ssh vestra "$Q release $IDS" | grep '^{' ; fi
          if [ "$MODE" = server ]; then ssh vestra "$Q request send $LIMIT $CAMPAIGN" | grep '^{' || true; fi
          ssh vestra "$Q status" | grep '^{' | python3 -c 'import json,sys; d=json.load(sys.stdin); print("bugun gonderilen", d.get("today"), "/ tavan", d.get("cap")); [print(" ", r.get("id"), r.get("mode"), r.get("limit"), r.get("status"), "gonderildi", r.get("sent","-"), "geri donen", r.get("bounced","-"), "hata", r.get("failed","-"), r.get("note","")) for r in d.get("runs",[])]'
          ssh vestra 'rm -f ~/vestra_tmp/mailbox-queue.php'
          [ "$MODE" = server ] && echo "istek sunucuya yazildi — cron_mailbox.php en gec 10 dk icinde gonderir; sonuc admin panelinde ve 'status' kipinde" || true

      - name: Sunucudan gönderim listesini al
        if: env.MODE == 'test' || env.MODE == 'send'
        env:
          LIMIT: ${{ github.event.inputs.limit }}
          CAMPAIGN: ${{ github.event.inputs.campaign }}
          IDS: ${{ github.event.inputs.ids }}
          TEST_TO: ${{ github.event.inputs.test_to }}
        run: |
          set -o pipefail
          ssh vestra 'mkdir -p ~/vestra_tmp' && ssh vestra 'cat > ~/vestra_tmp/mailbox-queue.php' < scripts/server/vestra-mailbox-queue.php
          if [ "$MODE" = test ]; then
            case "$TEST_TO" in *[!A-Za-z0-9@._+-]*|'') echo "test_to gecersiz"; exit 1 ;; esac
            ssh vestra "cd ~/public_html && php ~/vestra_tmp/mailbox-queue.php sample $CAMPAIGN $TEST_TO" > batch.raw
          else
            # bozuk kayitli adresleri once onar (8 Eki: "%20adres")
            ssh vestra "cd ~/public_html && php ~/vestra_tmp/mailbox-queue.php fixemails" | grep '^{' || true
            ssh vestra "cd ~/public_html && php ~/vestra_tmp/mailbox-queue.php list $LIMIT $CAMPAIGN $IDS" > batch.raw
          fi
          grep '^{' batch.raw | tail -n 1 > batch.json
          python3 -c 'import json;b=json.load(open("batch.json"));print("liste:",b.get("count"),"musteri · kampanya",b.get("campaign"),"· gonderen",b.get("from"))'

      - name: Gönder (support@ posta kutusu)
        if: env.MODE == 'test' || env.MODE == 'send'
        env:
          MAILBOX_PASS: ${{ secrets.MAILBOX_PASS }}
          MAILBOX_SMTP_HOST: ${{ github.event.inputs.smtp_host || vars.MAILBOX_SMTP_HOST || 'smtpout.secureserver.net' }}
          MAILBOX_SMTP_PORT: ${{ github.event.inputs.smtp_port || '465' }}
          TEST_TO: ${{ github.event.inputs.test_to }}
        run: |
          if [ "$MODE" = test ]; then
            python3 scripts/ci/mailbox_send.py --batch batch.json --out results.json --test-to "$TEST_TO"
          else
            python3 scripts/ci/mailbox_send.py --batch batch.json --out results.json
          fi

      - name: Sonuçları sunucuda damgala + sunucu adını kaydet
        if: (env.MODE == 'test' || env.MODE == 'send') && always()
        env:
          REQ_ID: ${{ github.event.inputs.req_id }}
        run: |
          if [ -n "$REQ_ID" ]; then
            # admin panelindeki istegi kapat (sonuc yoksa "hata" olarak)
            if [ -s results.json ]; then ssh vestra "cd ~/public_html && php ~/vestra_tmp/mailbox-queue.php finish $REQ_ID" < results.json || true
            else echo '' | ssh vestra "cd ~/public_html && php ~/vestra_tmp/mailbox-queue.php finish $REQ_ID" || true; fi
          fi
          [ -s results.json ] || { echo "sonuc dosyasi yok — damgalanacak bir sey yok"; exit 0; }
          HOST=$(python3 -c 'import json;print(json.load(open("results.json")).get("host",""))')
          PORT=$(python3 -c 'import json;print(json.load(open("results.json")).get("port",""))')
          case "$HOST" in ''|*[!A-Za-z0-9.-]*) ;; *) ssh vestra "cd ~/public_html && php ~/vestra_tmp/mailbox-queue.php sethost $HOST $PORT" ;; esac
          if [ "$MODE" = send ]; then
            ssh vestra 'cd ~/public_html && php ~/vestra_tmp/mailbox-queue.php stamp' < results.json
          fi
          ssh vestra 'rm -f ~/vestra_tmp/mailbox-queue.php'

      - name: Geri dönen bildirimlerini tara (support@ gelen kutusu) ve işaretle
        if: (env.MODE == 'send' || env.MODE == 'bounces') && always()
        env:
          MAILBOX_PASS: ${{ secrets.MAILBOX_PASS }}
          MAILBOX_SMTP_HOST: ${{ github.event.inputs.smtp_host || vars.MAILBOX_SMTP_HOST || 'smtpout.secureserver.net' }}
          MAILBOX_IMAP_HOST: ${{ vars.MAILBOX_IMAP_HOST || 'imap.secureserver.net' }}
        run: |
          # Kalici teslim hatasi bildirimleri: hatali alicilar 'bounced' isaretlenir (bir daha hicbir
          # yoldan yazilmaz), bildirimler gelen kutusundan "VESTRA-Bounces" klasorune tasinir.
          python3 scripts/ci/mailbox_send.py --scan-bounces --out bounces.json
          N=$(python3 -c 'import json;print(len(json.load(open("bounces.json")).get("results",[])))')
          [ "$N" -gt 0 ] || { echo "isaretlenecek geri donen adres yok"; exit 0; }
          ssh vestra 'mkdir -p ~/vestra_tmp' && ssh vestra 'cat > ~/vestra_tmp/mailbox-queue.php' < scripts/server/vestra-mailbox-queue.php
          ssh vestra 'cd ~/public_html && php ~/vestra_tmp/mailbox-queue.php stamp' < bounces.json
          ssh vestra 'rm -f ~/vestra_tmp/mailbox-queue.php'
