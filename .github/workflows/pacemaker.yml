name: (Zamanlayıcı) Müşteri bulma turlarını saatinde başlat
# 11 Eki 2026 (operatör: "çok az butik bulunuyor, daha verimli çalışması lazım; günde 500'e kadar bulsun").
# GitHub'ın cron zamanlayıcısı güvenilmez: 10 Eki'de 05:20 turu 11:12'de, 15:20 turu 19:18'de başladı; 11 Eki'de
# 13:20 ve 16:20 turları HİÇ başlamadı. Sunucuda Node.js yok (diag-node), GitHub anahtarı da kayıtlı değil.
#
# Bu iş kendini zincirler: bir sonraki tur saatine (UTC 01:20, 04:20 … 22:20) kadar bekler, find-customers.yml'i
# workflow_dispatch ile (auto=true) başlatır ve KENDİNİ yeniden başlatır. workflow_dispatch olayı GITHUB_TOKEN ile
# tetiklenebilen istisnadır; her koşu anında işlenir, cron'un gecikmesine bağlı kalmaz. Saatlik cron yalnız zincir
# koparsa (koşu iptal / hata) yeniden başlatmak için. Aynı anda tek zincir: concurrency + sırada başka koşu varsa çık.
on:
  workflow_dispatch:
  schedule:
    - cron: '35 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: pacemaker
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Tek zincir — sırada başka koşu varsa bu koşu çıkar
        id: guard
        run: |
          OTHERS=$(gh run list --workflow pacemaker.yml --status queued --json databaseId --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length")
          echo "sirada bekleyen baska pacemaker: $OTHERS"
          if [ "${OTHERS:-0}" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - name: Sonraki tur saatine kadar bekle (UTC :20 — 01,04,07,10,13,16,19,22)
        if: steps.guard.outputs.skip != 'true'
        run: |
          now=$(date -u +%s)
          best=""
          for h in 1 4 7 10 13 16 19 22; do
            for d in 0 1; do
              t=$(date -u -d "$(date -u -d "+$d day" +%Y-%m-%d) $(printf %02d $h):20:00" +%s)
              if [ "$t" -gt $((now + 60)) ] && { [ -z "$best" ] || [ "$t" -lt "$best" ]; }; then best=$t; fi
            done
          done
          wait=$((best - now))
          echo "simdi $(date -u +%H:%M) UTC · sonraki tur $(date -u -d @$best +%H:%M) UTC · bekleme $((wait / 60)) dk"
          sleep "$wait"

      - name: Müşteri bulma turunu başlat
        if: steps.guard.outputs.skip != 'true'
        run: |
          gh workflow run find-customers.yml --ref "${{ github.ref_name }}" -f auto=true
          echo "find-customers.yml baslatildi ($(date -u +%H:%M) UTC)"

      - name: Zinciri sürdür — kendini yeniden başlat
        if: steps.guard.outputs.skip != 'true'
        run: gh workflow run pacemaker.yml --ref "${{ github.ref_name }}"
