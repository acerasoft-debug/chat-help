name: (Salt-okunur) Fotoğraf kalitesi denetimi

on:
  workflow_dispatch:

permissions:
  contents: write

# Vitrinde görünen her ürünün fotoğraf durumunu ölçer (tools/audit-photo-quality.php):
# kare sayısı, kart karesinin boyutu, kolaj mı, internetten ek kare var mı.
# Araç sunucuda geçici bir klasörden (~/.sarvesto-audit) çalışır ve silinir;
# siteye ve data/ klasörüne hiçbir şey yazılmaz. Rapor + zayıf ürünlerin
# kolajları diag/photoq/ altına dala işlenir.
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: PHP + GD
        run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli php-gd > /dev/null
      - name: Sunucuda denetle
        run: |
          set -e
          mkdir -p ~/.ssh diag/photoq
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy; chmod 600 ~/.ssh/id_deploy
          SSHOPT="-i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -p ${{ secrets.DEPLOY_PORT || 22 }}"
          SRV="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          tar -cf - -C retail/tools audit-photo-quality.php | ssh $SSHOPT "$SRV" "rm -rf ~/.sarvesto-audit && mkdir -p ~/.sarvesto-audit && tar -xf - -C ~/.sarvesto-audit"
          ssh $SSHOPT "$SRV" "php -d memory_limit=1536M ~/.sarvesto-audit/audit-photo-quality.php --root=\$HOME/maxsales_de; rm -rf ~/.sarvesto-audit" > diag/photoq/audit.json
          php -r '$a=json_decode(file_get_contents("diag/photoq/audit.json"),true); print_r($a["summary"]);
            foreach(array_slice($a["products"],0,400) as $p) if($p["score"]>=30) printf("%3d %-30s %-16s n=%d %dx%d web=%d %s\n",$p["score"],$p["id"],$p["brand"],$p["n"],$p["w"],$p["h"],$p["web"],implode(", ",$p["why"]));'
          php -r '$a=json_decode(file_get_contents("diag/photoq/audit.json"),true);
            foreach($a["products"] as $p) if($p["score"]>=30) foreach(array_slice($p["images"],0,4) as $r) echo $r,"\n";' \
            | grep -E '^/uploads/[A-Za-z0-9._/-]+$' | sed 's#^/##' | sort -u > list.txt
          mkdir -p srv && ssh $SSHOPT "$SRV" "cd ~/maxsales_de && tar -cf - -T - 2>/dev/null" < list.txt | tar -xf - -C srv || true
      - name: Kolajlar
        run: |
          php -r '
          $a = json_decode(file_get_contents("diag/photoq/audit.json"), true);
          $weak = array_values(array_filter($a["products"], fn($p) => $p["score"] >= 30));
          $cw = 150; $ch = 188;
          foreach (array_chunk($weak, 12) as $pi => $chunk) {
            $s = imagecreatetruecolor(4 * ($cw + 4) + 330, count($chunk) * ($ch + 8) + 8);
            imagefill($s, 0, 0, imagecolorallocate($s, 255, 255, 255)); $ink = imagecolorallocate($s, 0, 0, 0); $g = imagecolorallocate($s, 110, 110, 110);
            foreach ($chunk as $ri => $p) {
              $y = 4 + $ri * ($ch + 8);
              imagestring($s, 3, 4, $y, substr($p["id"], 0, 40), $ink);
              imagestring($s, 2, 4, $y + 16, substr($p["brand"] . " | " . $p["name"], 0, 50), $g);
              imagestring($s, 2, 4, $y + 32, "kod: " . substr($p["sku"], 0, 30) . "  stok " . $p["stock"], $g);
              imagestring($s, 2, 4, $y + 48, substr("puan " . $p["score"] . ": " . implode(", ", $p["why"]), 0, 50), $g);
              foreach (array_slice($p["images"], 0, 4) as $i => $r) {
                $im = @imagecreatefromstring((string)@file_get_contents("srv" . $r)); $x = 330 + $i * ($cw + 4);
                if (!$im) continue; $sc = min($cw / imagesx($im), $ch / imagesy($im));
                imagecopyresampled($s, $im, $x, $y, 0, 0, (int)(imagesx($im) * $sc), (int)(imagesy($im) * $sc), imagesx($im), imagesy($im));
                imagestring($s, 1, $x, $y + $ch - 9, imagesx($im) . "x" . imagesy($im), $ink);
              }
            }
            imagejpeg($s, sprintf("diag/photoq/weak-%02d.jpg", $pi + 1), 80);
          }'
          ls diag/photoq | head
      - name: Dala işle
        run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add -f diag/photoq
          git diff --cached --quiet && exit 0
          git commit -q -m "Teşhis: fotoğraf kalitesi denetimi (rapor + kolajlar)"
          for i in 1 2 3 4; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i*3)); done
