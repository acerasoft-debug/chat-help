name: (Teşhis) SEO etiketlerini canlı sayfadan doğrula
on:
  workflow_dispatch:
    inputs:
      path:
        description: "Kontrol edilecek yol"
        required: false
        default: "/"

permissions:
  contents: read

# Salt-okunur. Ana sayfayi 5 dilde cekip <title>, meta description, meta keywords
# ve JSON-LD knowsAbout alanlarini OLDUGU GIBI yazar.
#
# Neden gerekli: "SEO guclendi" demek ile etiketin gercekten sunucudan o sekilde
# ciktigini GORMEK ayni sey degil. $_brandKw katalogdan uretiliyor -- katalog bos
# donerse veya vestra_products() cagrilamazsa marka anahtar kelimeleri sessizce
# kaybolur ve sayfa yine 200 doner. Tek kanit ham HTML'dir.
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - name: Meta etiketleri çek
        env:
          P: ${{ github.event.inputs.path }}
        run: |
          set -e
          BASE="https://vestrasales.com"
          # Iki ayri kimlikle bakiyoruz. Googlebot UA'si GitHub runner IP'sinden
          # geldigi icin ters-DNS dogrulamasindan gecmez; iyi yapilandirilmis bir
          # WAF bunu "sahte Googlebot" sayip challenge sayfasi dondurur. Yani
          # challenge gormek tek basina "site indekslenemiyor" demek DEGIL.
          # Ayrimi yapabilmek icin normal tarayici kimligiyle de cekiyoruz:
          #   Chrome OK  + Googlebot challenge  -> WAF bot dogrulamasi (beklenen)
          #   Chrome de challenge               -> gercek sorun, sayfa hic acilmiyor
          UA_BOT="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          UA_WEB="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          PATH_="${P:-/}"
          for L in en de fr it es; do
            if [ "$L" = "en" ]; then URL="${BASE}${PATH_}"
            else
              case "$PATH_" in *\?*) URL="${BASE}${PATH_}&lang=$L";; *) URL="${BASE}${PATH_}?lang=$L";; esac
            fi
            echo "================================================================"
            echo "  $L  ->  $URL"
            echo "================================================================"
            # Once bot kimligi: challenge yiyor mu?
            curl -sS -A "$UA_BOT" --max-time 30 -o /tmp/bot.html "$URL" || true
            if grep -qiE 'one moment|just a moment|checking your browser|challenge-platform|cf-browser-verification' /tmp/bot.html 2>/dev/null; then
              echo "  Googlebot UA  : CHALLENGE ($(wc -c < /tmp/bot.html) bayt) — bot dogrulama sayfasi"
            else
              echo "  Googlebot UA  : normal sayfa ($(wc -c < /tmp/bot.html) bayt)"
            fi
            # Asil olcum normal tarayici kimligiyle: uye olmayan ziyaretcinin gordugu HTML.
            curl -sS -A "$UA_WEB" --max-time 30 -o /tmp/p.html "$URL" || { echo "  CEKILEMEDI"; continue; }
            if grep -qiE 'one moment|just a moment|checking your browser|challenge-platform' /tmp/p.html 2>/dev/null; then
              echo "  Tarayici UA   : CHALLENGE ($(wc -c < /tmp/p.html) bayt) — CIDDI: sayfa kimseye acilmiyor"
            else
              echo "  Tarayici UA   : normal sayfa ($(wc -c < /tmp/p.html) bayt)"
            fi
            echo
            echo "  --- title ---"
            grep -oiE '<title>[^<]*</title>' /tmp/p.html | head -1 | sed 's/^/  /'
            echo "  --- meta description ---"
            grep -oiE '<meta name="description" content="[^"]*"' /tmp/p.html | head -1 | fold -w 150 -s | sed 's/^/  /'
            echo "  --- meta keywords ---"
            grep -oiE '<meta name="keywords" content="[^"]*"' /tmp/p.html | head -1 | fold -w 150 -s | sed 's/^/  /'
            echo "  --- hreflang ---"
            grep -c 'rel="alternate" hreflang' /tmp/p.html | sed 's/^/  adet: /'
            echo "  --- JSON-LD knowsAbout ---"
            grep -oE '"knowsAbout":\[[^]]*\]' /tmp/p.html | head -1 | fold -w 150 -s | sed 's/^/  /'
            echo
            # Marka anahtar kelimesi gercekten var mi? Dile gore "toptan" sozcugu degisiyor.
            case "$L" in
              de) W="Großhandel";; fr) W="en gros";; it) W="ingrosso";; es) W="al por mayor";; *) W="wholesale";;
            esac
            echo "  --- kontrol ---"
            for B in Balenciaga Burberry Gucci DSQUARED2 Valentino Fendi; do
              if grep -qiE "$B[^,\"]*$W" /tmp/p.html; then
                echo "  OK   \"$B $W\" sayfada var"
              else
                echo "  YOK  \"$B $W\" BULUNAMADI"
              fi
            done
            echo
          done

      - name: WAF kimliği (yanıt başlıkları)
        run: |
          # Challenge sayfasini kimin bastigini basliklar soyler: Cloudflare mi,
          # LiteSpeed/Hostinger mi, baska bir katman mi. Duzeltmeyi hangi panelde
          # yapacagimiz buna bagli.
          echo "############ YANIT BASLIKLARI ############"
          curl -sSI --max-time 20 https://vestrasales.com/ | sed 's/^/  /' || true
          echo "############ /sitemap.xml disaridan ############"
          curl -sS -o /tmp/sm.xml -w '  kod=%{http_code} boyut=%{size_download}\n' \
               --max-time 20 https://vestrasales.com/sitemap.xml || true
          head -c 200 /tmp/sm.xml | sed 's/^/  /'; echo
          echo "############ /robots.txt disaridan ############"
          curl -sS -o /tmp/rb.txt -w '  kod=%{http_code} boyut=%{size_download}\n' \
               --max-time 20 https://vestrasales.com/robots.txt || true
          head -c 200 /tmp/rb.txt | sed 's/^/  /'; echo

      - name: Sunucunun kendi ürettiği HTML (WAF'ı atlayarak)
        uses: appleboy/ssh-action@v1.0.3
        env:
          SEO_PATH: ${{ github.event.inputs.path }}
        with:
          envs: SEO_PATH
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 4m
          script: |
            # Disaridan gelen istek WAF challenge'ina takiliyor; bu adim sunucunun
            # KENDI icinden localhost'a istek atar, yani WAF devrede degil. Boylece
            # "etiketler uretiliyor mu" sorusu ile "disaridan gorunuyor mu" sorusu
            # birbirinden ayriliyor -- ikisi farkli sorun ve farkli cozum.
            cd ~/public_html
            # Once ISTENEN YOLU Apache uzerinden cek. Bu adim uzun sure `path` girdisini
            # yok sayip her zaman index.php'yi render etti: /wholesale/lacoste sorulup
            # ana sayfa dogrulandi ve rapor "kontrol edildi" dedi. Localhost'a curl,
            # .htaccess'i ve yeniden yazma kurallarini da gercekten calistirir --
            # `php -r include` bunlarin hicbirini test etmez.
            P="${SEO_PATH:-/}"
            echo "=================== $P (Apache, localhost) ==================="
            H=$(curl -s --max-time 25 -H "Host: vestrasales.com" "http://127.0.0.1${P}" \
                  -w '\n__CODE__%{http_code}')
            echo "  HTTP $(printf '%s' "$H" | sed -n 's/.*__CODE__//p')  |  $(printf '%s' "$H" | wc -c) bayt"
            for TAG in '<title>[^<]*' 'rel="canonical" href="[^"]*"' '<h1[^>]*>[^<]*'; do
              printf '%s' "$H" | grep -oiE "$TAG" | head -1 | sed 's/^/  /'
            done
            printf '%s' "$H" | grep -c 'application/ld+json' | sed 's/^/  JSON-LD blok: /'
            printf '%s' "$H" | grep -oE 'hreflang="[a-z-]+"' | sort -u | tr '\n' ' ' | sed 's/^/  hreflang: /'
            echo

            # 404 iki cok farkli sebepten gelir ve ikisinin cozumu ayridir: ya dosya
            # sunucuya hic gitmemistir (deploy sorunu), ya da .htaccess'teki yeniden
            # yazma kurali yoktur/eslesmiyordur (yonlendirme sorunu). Tahmin etmemek
            # icin ikisini de yaziyoruz.
            case "$(printf '%s' "$H" | sed -n 's/.*__CODE__//p')" in
              404|403|500)
                echo "  -- neden? --"
                F="$(printf '%s' "$P" | cut -d/ -f2)"
                ls -l "$HOME/public_html/${F}.php" 2>&1 | sed 's/^/  dosya: /'
                grep -n "RewriteRule.*${F}" "$HOME/public_html/.htaccess" 2>/dev/null \
                  | sed 's/^/  kural: /' || echo "  kural: .htaccess'te ${F} icin kural YOK"
                ls -l "$HOME/public_html/.htaccess" 2>&1 | sed 's/^/  htaccess: /'
                # Ayni yoldaki bir KLASOR kurali olduruyor mu? Bu barindirmada /shop
                # tam olarak boyle kirilmisti: public_html/shop/ ikinci bir sitenin
                # koku ve kendi RewriteEngine'ini tasiyor; Apache alt dizin kendi
                # rewrite yapilandirmasini tanimlayinca ustunu DEVRALMIYOR, dolayisiyla
                # ust .htaccess'teki kural o istek icin hic degerlendirilmiyor.
                ls -ld "$HOME/public_html/${F}" 2>&1 | sed 's/^/  ayni adli klasor: /'
                ls -l  "$HOME/public_html/${F}/.htaccess" 2>&1 | sed 's/^/  o klasorun htaccess: /'
                # PHP dosyasina DOGRUDAN istek: calisiyorsa sorun yalnizca yonlendirmede.
                D=$(curl -s --max-time 20 -H "Host: vestrasales.com" \
                      "http://127.0.0.1/${F}.php?brand=$(printf '%s' "$P" | cut -d/ -f3)" \
                      -w '\n__CODE__%{http_code}')
                echo "  dogrudan ${F}.php: HTTP $(printf '%s' "$D" | sed -n 's/.*__CODE__//p')  |  $(printf '%s' "$D" | wc -c) bayt"
                printf '%s' "$D" | grep -oiE '<title>[^<]*' | head -1 | sed 's/^/    /'
                ;;
            esac
            echo

            # DIKKAT: `QUERY_STRING=... php index.php` ile $_GET DOLMAZ -- PHP CLI
            # query string'i ayristirmaz. Ilk denemede tam bu yuzden en/de/it ayni
            # Ingilizce ciktiyi verdi ve sanki ceviri bozukmus gibi gorundu. $_GET'i
            # dogrudan kuruyoruz.
            for L in en de it es fr; do
              echo "=================== $L ==================="
              OUT=$(php -r '
                $l = $argv[1];
                $_GET = $l === "en" ? [] : ["lang" => $l];
                $_SERVER["REQUEST_URI"]  = $l === "en" ? "/" : "/?lang=$l";
                $_SERVER["HTTP_HOST"]    = "vestrasales.com";
                $_SERVER["REQUEST_METHOD"]="GET";
                $_SERVER["HTTPS"]        = "on";
                include "index.php";
              ' "$L" 2>/dev/null)
              echo "  uretilen HTML: $(printf '%s' "$OUT" | wc -c) bayt"
              printf '%s' "$OUT" | grep -oiE '<meta name="keywords" content="[^"]*"' | head -1 | fold -w 140 -s | sed 's/^/  /'
              echo
            done
            echo "== robots.txt =="; head -20 robots.txt 2>/dev/null || echo "  robots.txt YOK"
            echo
            echo "== sitemap (/sitemap.xml -> sitemap.php, diskte .xml OLMAMASI normal) =="
            SM=$(php -r '$_SERVER["HTTP_HOST"]="vestrasales.com"; include "sitemap.php";' 2>&1)
            echo "  cikti: $(printf '%s' "$SM" | wc -c) bayt, $(printf '%s' "$SM" | grep -c '<loc>') URL"
            printf '%s' "$SM" | grep -iE 'fatal|error|warning' | head -3 | sed 's/^/  HATA: /'
            printf '%s' "$SM" | head -4 | sed 's/^/  /'
