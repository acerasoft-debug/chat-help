name: (Teşhis) SEO etiketlerini canlı sayfadan doğrula
on:
  workflow_dispatch:
    inputs:
      path:
        description: "Kontrol edilecek yol"
        required: false
        default: "/"

permissions:
  contents: read

# Salt-okunur. Ana sayfayi 5 dilde cekip <title>, meta description, meta keywords
# ve JSON-LD knowsAbout alanlarini OLDUGU GIBI yazar.
#
# Neden gerekli: "SEO guclendi" demek ile etiketin gercekten sunucudan o sekilde
# ciktigini GORMEK ayni sey degil. $_brandKw katalogdan uretiliyor -- katalog bos
# donerse veya vestra_products() cagrilamazsa marka anahtar kelimeleri sessizce
# kaybolur ve sayfa yine 200 doner. Tek kanit ham HTML'dir.
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - name: Meta etiketleri çek
        env:
          P: ${{ github.event.inputs.path }}
        run: |
          set -e
          BASE="https://vestrasales.com"
          # Iki ayri kimlikle bakiyoruz. Googlebot UA'si GitHub runner IP'sinden
          # geldigi icin ters-DNS dogrulamasindan gecmez; iyi yapilandirilmis bir
          # WAF bunu "sahte Googlebot" sayip challenge sayfasi dondurur. Yani
          # challenge gormek tek basina "site indekslenemiyor" demek DEGIL.
          # Ayrimi yapabilmek icin normal tarayici kimligiyle de cekiyoruz:
          #   Chrome OK  + Googlebot challenge  -> WAF bot dogrulamasi (beklenen)
          #   Chrome de challenge               -> gercek sorun, sayfa hic acilmiyor
          UA_BOT="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          UA_WEB="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          PATH_="${P:-/}"
          for L in en de fr it es; do
            if [ "$L" = "en" ]; then URL="${BASE}${PATH_}"
            else
              case "$PATH_" in *\?*) URL="${BASE}${PATH_}&lang=$L";; *) URL="${BASE}${PATH_}?lang=$L";; esac
            fi
            echo "================================================================"
            echo "  $L  ->  $URL"
            echo "================================================================"
            # Once bot kimligi: challenge yiyor mu?
            curl -sS -A "$UA_BOT" --max-time 30 -o /tmp/bot.html "$URL" || true
            if grep -qiE 'one moment|just a moment|checking your browser|challenge-platform|cf-browser-verification' /tmp/bot.html 2>/dev/null; then
              echo "  Googlebot UA  : CHALLENGE ($(wc -c < /tmp/bot.html) bayt) — bot dogrulama sayfasi"
            else
              echo "  Googlebot UA  : normal sayfa ($(wc -c < /tmp/bot.html) bayt)"
            fi
            # Asil olcum normal tarayici kimligiyle: uye olmayan ziyaretcinin gordugu HTML.
            curl -sS -A "$UA_WEB" --max-time 30 -o /tmp/p.html "$URL" || { echo "  CEKILEMEDI"; continue; }
            if grep -qiE 'one moment|just a moment|checking your browser|challenge-platform' /tmp/p.html 2>/dev/null; then
              echo "  Tarayici UA   : CHALLENGE ($(wc -c < /tmp/p.html) bayt) — CIDDI: sayfa kimseye acilmiyor"
            else
              echo "  Tarayici UA   : normal sayfa ($(wc -c < /tmp/p.html) bayt)"
            fi
            echo
            echo "  --- title ---"
            grep -oiE '<title>[^<]*</title>' /tmp/p.html | head -1 | sed 's/^/  /'
            echo "  --- meta description ---"
            grep -oiE '<meta name="description" content="[^"]*"' /tmp/p.html | head -1 | fold -w 150 -s | sed 's/^/  /'
            echo "  --- meta keywords ---"
            grep -oiE '<meta name="keywords" content="[^"]*"' /tmp/p.html | head -1 | fold -w 150 -s | sed 's/^/  /'
            echo "  --- hreflang ---"
            grep -c 'rel="alternate" hreflang' /tmp/p.html | sed 's/^/  adet: /'
            echo "  --- JSON-LD knowsAbout ---"
            grep -oE '"knowsAbout":\[[^]]*\]' /tmp/p.html | head -1 | fold -w 150 -s | sed 's/^/  /'
            echo
            # Marka anahtar kelimesi gercekten var mi? Dile gore "toptan" sozcugu degisiyor.
            case "$L" in
              de) W="Großhandel";; fr) W="en gros";; it) W="ingrosso";; es) W="al por mayor";; *) W="wholesale";;
            esac
            echo "  --- kontrol ---"
            for B in Balenciaga Burberry Gucci DSQUARED2 Valentino Fendi; do
              if grep -qiE "$B[^,\"]*$W" /tmp/p.html; then
                echo "  OK   \"$B $W\" sayfada var"
              else
                echo "  YOK  \"$B $W\" BULUNAMADI"
              fi
            done
            echo
          done
