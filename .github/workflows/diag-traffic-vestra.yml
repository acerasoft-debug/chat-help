name: (Salt-okunur) VESTRA trafik ve e-posta gönderimi — günlük döküm
# 12 Eki 2026 (operatör: "trafik çok azaldı ne yapmak gerekiyor, e-mailler gidiyor mu?").
# SALT-OKUNUR: hiçbir şey göndermez, hiçbir dosyaya yazmaz (geçici betik çalışıp silinir).
# Basar: son 21 gün günlük ziyaretçi / kaynak / en çok açılan sayfalar, gönderilen / geri dönen e-posta,
# bulunan butik; posta kutusu isteklerinin son 15'i; tavan, ısınma, fren, DKIM; cron'un kaydı; arama turları.
# Depo herkese açık: e-posta adresi, IP, hesap adı BASILMAZ — yalnız sayılar.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Oku
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 6m
          script: |
            set -u
            cd ~/public_html && cat > ./vestra_traffic_tmp.php <<'PHPEOF'
            <?php
            ini_set('display_errors', '1'); error_reporting(E_ALL & ~E_DEPRECATED);
            require_once __DIR__.'/inc/products.php'; require_once __DIR__.'/inc/leads.php';
            require_once __DIR__.'/inc/security.php'; require_once __DIR__.'/inc/mailbox.php';
            if (is_readable(__DIR__.'/inc/finder.php')) require_once __DIR__.'/inc/finder.php';
            $leads = vestra_leads();
            $D = 21; $days = [];
            for ($i = $D - 1; $i >= 0; $i--) $days[date('Y-m-d', strtotime("-{$i} days"))] = ['sent' => 0, 'srv' => 0, 'bounced' => 0, 'found' => 0, 'unsub' => 0, 'replied' => 0];
            $st = [];
            foreach ($leads as $l) {
              $s = (string)($l['status'] ?? 'new'); $st[$s] = ($st[$s] ?? 0) + 1;
              $c = strtotime((string)($l['last_contacted_at'] ?? '')) ?: 0; $dc = $c ? date('Y-m-d', $c) : '';
              $via = (string)($l['contact_via'] ?? '');
              if ($dc && isset($days[$dc])) { if ($via === 'mailbox') $days[$dc]['sent']++; elseif ($via === 'seller_server') $days[$dc]['srv']++; }
              $b = strtotime((string)($l['bounced_at'] ?? '')) ?: 0; if ($b && isset($days[date('Y-m-d', $b)])) $days[date('Y-m-d', $b)]['bounced']++;
              $a = strtotime((string)($l['added_at'] ?? '')) ?: 0;
              if ($a && isset($days[date('Y-m-d', $a)]) && ($l['source'] ?? '') === 'web-search') $days[date('Y-m-d', $a)]['found']++;
            }
            echo "== Gün gün (sunucu saati ".date('T').") ==\n";
            printf("  %-10s %7s %7s  %6s %6s %6s %6s  %s\n", 'gün', 'tekil', 'sayfa', 'eposta', 'satıcı', 'dönen', 'bulun.', 'kaynaklar (tekil ziyaretçi)');
            foreach ($days as $ymd => $x) {
              $v = vestra_visits_day($ymd); $src = (array)($v['src'] ?? []); arsort($src);
              $sTxt = implode(' ', array_map(fn($k, $n) => "$k:$n", array_keys(array_slice($src, 0, 5, true)), array_slice($src, 0, 5, true)));
              printf("  %-10s %7d %7d  %6d %6d %6d %6d  %s\n", $ymd, $v['uniq'], $v['hits'], $x['sent'], $x['srv'], $x['bounced'], $x['found'], $sTxt);
            }
            foreach ([['son 7 gün', 7], ['önceki 7 gün', 14]] as [$lbl, $n]) {
              $u = 0; $h = 0; $p = [];
              for ($i = $n - 1; $i >= $n - 7; $i--) { $v = vestra_visits_day(date('Y-m-d', strtotime("-{$i} days"))); $u += $v['uniq']; $h += $v['hits']; foreach ((array)$v['pages'] as $k => $c) $p[$k] = ($p[$k] ?? 0) + $c; }
              arsort($p);
              echo "\n== $lbl: tekil $u · sayfa $h · en çok açılan: ".implode(', ', array_map(fn($k, $c) => "$k $c", array_keys(array_slice($p, 0, 8, true)), array_slice($p, 0, 8, true)))."\n";
            }
            $r30 = vestra_visits_range(30);
            echo "\n== 30 gün ülke (ilk 10): ".implode(' ', array_map(fn($k, $c) => "$k:$c", array_keys(array_slice($r30['cc'], 0, 10, true)), array_slice($r30['cc'], 0, 10, true)))."\n";
            echo "== 30 gün kaynak: ".implode(' ', array_map(fn($k, $c) => "$k:$c", array_keys(array_slice($r30['src'], 0, 12, true)), array_slice($r30['src'], 0, 12, true)))."\n";
            echo "\n== Müşteri listesi durumları: ".json_encode($st)."\n";
            echo "\n== Posta kutusu ayarları ==\n";
            $au = vestra_mailbox_auto(); $w = vestra_mailbox_warmup(); $bs = vestra_mailbox_bounce_stats();
            echo "  otomatik gönderim: ".($au['auto_send'] ? 'AÇIK' : 'KAPALI')." · kampanya {$au['auto_campaign']} · parti {$au['auto_limit']} · havuz {$au['auto_pool']}\n";
            echo "  bugünkü tavan ".vestra_mailbox_cap_today()." · bugün giden ".vestra_mailbox_sent_today()." · kalan ".vestra_mailbox_left_today()."\n";
            echo "  ısınma ".($w['on'] ? 'AÇIK' : 'kapalı')." · gün {$w['day']} · sınır {$w['limit']}\n";
            echo "  geri dönme freni: %".round($bs['rate'] * 100, 1)." ({$bs['bounced']}/{$bs['sent']})".($bs['stop'] ? ' · DURDURDU' : ' · serbest')."\n";
            echo "  DKIM: ".vestra_dkim_dns_status()."\n";
            /* GitHub, port sırrı (22) yüzünden "22"yi her yerde *** yapıyor: sayılar rakam rakam basılır. */
            $sp = fn(int $n) => implode(' ', str_split((string)$n));
            if (function_exists('vestra_finder_send_targets')) {
              $all = vestra_finder_send_targets(5000, 'all'); $strict = 0;
              foreach ($all as $l) if (function_exists('vestra_mailbox_strict_receiver') && vestra_mailbox_strict_receiver((string)($l['email'] ?? ''))) $strict++;
              echo "  gönderime hazır alıcı (web havuzu): ".$sp(count(vestra_finder_send_targets(5000, 'web')))." · tüm havuz: ".$sp(count($all))." · bunlardan Outlook/Orange: ".$sp($strict)."\n";
            }
            echo "\n== Posta kutusu istekleri (son 15) ==\n";
            $runs = vestra_mailbox_runs(); usort($runs, fn($a, $b) => strcmp((string)($b['requested_at'] ?? ''), (string)($a['requested_at'] ?? '')));
            foreach (array_slice($runs, 0, 15) as $r)
              printf("  %-19s %-8s %-6s lim %-4s gönd %-4s dön %-3s hata %-3s bekl %-4s %s\n", substr((string)($r['requested_at'] ?? ''), 0, 19), (string)($r['status'] ?? ''), (string)($r['mode'] ?? ''),
                (string)($r['limit'] ?? ''), (string)($r['sent'] ?? ''), (string)($r['bounced'] ?? ''), (string)($r['failed'] ?? ''), (string)($r['deferred'] ?? ''), mb_substr((string)($r['note'] ?? ''), 0, 90));
            if (function_exists('vestra_read_json')) {
              echo "\n== Butik arama turları (son 10) ==\n";
              foreach (array_slice(vestra_read_json('finder_runs.json'), 0, 10) as $r)
                printf("  %-19s %-9s eklenen %-4s incelenen %-5s aday %-5s%s\n", substr((string)($r['requested_at'] ?? ''), 0, 19), (string)($r['status'] ?? ''), (string)($r['added_count'] ?? ''), (string)($r['analyzed'] ?? ''), (string)($r['candidates'] ?? ''), !empty($r['dry']) ? ' KURU' : '');
            }
            PHPEOF
            php ./vestra_traffic_tmp.php 2>&1 | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/***@***/g'; rm -f ./vestra_traffic_tmp.php
            echo
            echo "== cron kaydı: posta kutusu satırı var mı =="
            crontab -l 2>/dev/null | grep -c "cron_mailbox.php" | sed 's/^/  satır sayısı: /'
            echo "== cron çıktısı (vestra_sweep.log, posta satırları, son 40) =="
            grep -E "\[mailbox|seller-outbox|otomatik|finder" ~/vestra_sweep.log 2>/dev/null | tail -40 | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/***@***/g'
            echo "== günlük dosyasının son değişikliği =="; ls -la --time-style=full-iso ~/vestra_sweep.log 2>/dev/null | awk '{print "  "$6" "$7}'
            echo "== son mail() / posta hataları (error_log, son 15) =="
            grep -E "mail\(\)|sendmail|VESTRA Mail|mailbox" ~/public_html/error_log 2>/dev/null | tail -15 | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/***@***/g'
