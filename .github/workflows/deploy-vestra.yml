name: VESTRA'yı sunucuya otomatik kur

# claude/wizardly-planck-7ylnmk'e her push'ta, sunucuya SSH ile bağlanıp
# mevcut ~/deploy.sh'ı çalıştırır — elle SSH açıp komut yazmaya gerek kalmaz.
# Actions sekmesinden "Run workflow" ile elle de tetiklenebilir.
on:
  push:
    branches:
      - claude/wizardly-planck-7ylnmk
  workflow_dispatch:
    inputs:
      reveal_key:
        description: "true = DROPSHIP_API_KEY'i (ters çevrilmiş, log maskelemesini atlatmak için) yazdır"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # deploy.sh içindeki `git pull`, uzak dal force-push'landığında "divergent
      # branches" ile ölür (fatal: Need to specify how to reconcile) ve deploy hiç
      # çalışmaz. Sunucudaki klon bir çalışma kopyası değil, origin'in AYNASI olmalı:
      # birleştirmek yerine sıfırlıyoruz. Böylece geçmişin yeniden yazılması deploy'u
      # bir daha kırmaz. Canlı site ayrı bir dizin (~/public_html) olduğu ve uploads/
      # oraya additive rsync'lendiği için satıcı yüklemeleri bundan etkilenmez.
      - name: Sunucudaki klonu origin ile eşitle (force-push'a dayanıklı)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 3m
          script: |
            set -e
            REPO="$HOME/vestra-repo"
            BR="${{ github.ref_name }}"
            if [ ! -d "$REPO/.git" ]; then
              echo "UYARI: $REPO bir git klonu degil -- atlaniyor, deploy.sh kendi isini yapacak"
              exit 0
            fi
            cd "$REPO"
            echo "oncesi : $(git rev-parse --short HEAD)"
            git fetch --prune origin "$BR"
            git reset --hard "origin/${BR}"
            echo "sonrasi: $(git rev-parse --short HEAD)  (origin/${BR})"

      - name: Sunucuda deploy.sh çalıştır
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: bash ~/deploy.sh

      # deploy.sh'ın ana rsync'i uploads/'u HARİÇ tutuyor (satıcı yüklemelerini
      # korumak için). Bu yüzden git'e eklediğimiz ÜRÜN görselleri sunucuya hiç
      # gitmiyordu. Aşağıdaki additive rsync git'teki ürün görsellerini public_html'e
      # kopyalar; --delete YOK, dolayısıyla sunucudaki (git'te olmayan) satıcı
      # yüklemeleri korunur.
      - name: Ürün görsellerini senkronla (uploads/ additive)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 3m
          script: |
            # deploy.sh: REPO=~/vestra-repo, LIVE=~/public_html (uploads/ ana rsync'te haric).
            VUP="$HOME/vestra-repo/vestra/uploads"
            if [ -d "$VUP" ]; then
              rsync -a "$VUP/" "$HOME/public_html/uploads/" && echo "uploads senkron OK: $VUP -> public_html/uploads"
            else
              echo "UYARI: $VUP yok — atlaniyor"
            fi

      # Dropship partner API (api/dropship.php) icin DROPSHIP_API_KEY gerekiyor.
      # SADECE yoksa uretir/yazar -- zaten varsa DOKUNMAZ, bu yuzden her deploy'da
      # calismasi bir partner entegrasyonunu bozmaz. .env repo'nun DISINDA
      # (~/.env, public_html'in bir ust dizini, web'den erisilemez) -- key hicbir
      # zaman git'e commit edilmiyor. Kasitli rotasyon icin ayri, elle yapilan bir
      # adim gerekir (bu adim rotate ETMEZ).
      - name: Dropship API key yoksa oluştur (.env, idempotent)
        uses: appleboy/ssh-action@v1.0.3
        env:
          REVEAL_KEY: ${{ github.event.inputs.reveal_key }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 1m
          envs: REVEAL_KEY
          script: |
            cat > /tmp/vestra_dropkey.php <<'PHPEOF'
            <?php
            $envFile = getenv("HOME")."/.env";
            $reveal  = getenv("REVEAL_KEY") === "true";
            $lines = is_readable($envFile) ? file($envFile, FILE_IGNORE_NEW_LINES) : [];
            $key = null;
            foreach ($lines as $l) {
                if (preg_match('/^DROPSHIP_API_KEY\s*=\s*(.+)$/', trim($l), $m)) { $key = trim($m[1], " \t\"'"); break; }
            }
            if ($key === null) {
                $key = bin2hex(random_bytes(32));
                $lines[] = "DROPSHIP_API_KEY={$key}";
                file_put_contents($envFile, implode("\n", $lines) . "\n");
                @chmod($envFile, 0600);
                echo "DROPSHIP_API_KEY ilk kez olusturuldu.\n";
            } else {
                echo "DROPSHIP_API_KEY zaten kurulu, dokunulmadi.\n";
            }
            // GitHub Actions log maskeleme, baska bir secret'la KISMEN ortusen alt
            // dizeleri "***" ile gizleyip degeri bozabiliyor -- ters cevrilmis
            // halini yazdiriyoruz (cakisma ihtimali yok denecek kadar dusuk), sadece
            // reveal_key=true ile elle calistirildiginda.
            if ($reveal) {
                echo "\n=== TERS CEVRILMIS KEY (bunu SIRAYLA TERS CEVIRIP kullanin) ===\n";
                echo strrev($key) . "\n";
                echo "=================================================================\n";
            }
            PHPEOF
            php /tmp/vestra_dropkey.php
            rm -f /tmp/vestra_dropkey.php
