name: VESTRA'yı sunucuya otomatik kur

# claude/wizardly-planck-7ylnmk'e her push'ta, sunucuya SSH ile bağlanıp
# mevcut ~/deploy.sh'ı çalıştırır — elle SSH açıp komut yazmaya gerek kalmaz.
# Actions sekmesinden "Run workflow" ile elle de tetiklenebilir.
on:
  push:
    branches:
      - claude/wizardly-planck-7ylnmk
  workflow_dispatch:
    inputs:
      reveal_key:
        description: "true = DROPSHIP_API_KEY'i (ters çevrilmiş, log maskelemesini atlatmak için) yazdır"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # deploy.sh içindeki `git pull`, uzak dal force-push'landığında "divergent
      # branches" ile ölür (fatal: Need to specify how to reconcile) ve deploy hiç
      # çalışmaz. Sunucudaki klon bir çalışma kopyası değil, origin'in AYNASI olmalı:
      # birleştirmek yerine sıfırlıyoruz. Böylece geçmişin yeniden yazılması deploy'u
      # bir daha kırmaz. Canlı site ayrı bir dizin (~/public_html) olduğu ve uploads/
      # oraya additive rsync'lendiği için satıcı yüklemeleri bundan etkilenmez.
      - name: Sunucudaki klonu origin ile eşitle (force-push'a dayanıklı)
        id: gitsync
        # DUSSE DE IS BITMESIN: bu adim sunucunun GITHUB'A CIKABILMESINE bagli
        # ve o baglanti bu barindirmada dustu (19 Eyl 2026: `Could not resolve
        # host: github.com`, ayni dakikada google.com COZULUYORDU -- yani sunucu
        # ayakta, cozumleyici kismen bozuk). Deploy'un tamami o tek satira
        # baglandigi icin gunun butun isi durdu. Asagidaki yedek yol ayni sonucu
        # RUNNER'DAN uretiyor; bu adim basarisizsa devreye giriyor.
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 3m
          script: |
            set -e
            REPO="$HOME/vestra-repo"
            BR="${{ github.ref_name }}"
            if [ ! -d "$REPO/.git" ]; then
              echo "UYARI: $REPO bir git klonu degil -- atlaniyor, deploy.sh kendi isini yapacak"
              exit 0
            fi
            cd "$REPO"
            echo "oncesi : $(git rev-parse --short HEAD)"
            git fetch --prune origin "$BR"
            git reset --hard "origin/${BR}"
            echo "sonrasi: $(git rev-parse --short HEAD)  (origin/${BR})"

      # ---- YEDEK YOL: sunucu GitHub'a cikamiyorsa kodu RUNNER TASIR ----------
      # Sunucunun cozumleyicisi github.com'u bulamadiginda `git fetch origin`
      # duser; ama SSH CALISIYOR (baglantiyi runner kuruyor, sunucunun DNS'ine
      # ihtiyac yok). Runner'daki klondan bir GIT BUNDLE uretip scp ile
      # tasiyoruz: bundle tek dosya ve ondan `git fetch` etmek ag istemiyor.
      #
      # NEDEN rsync DEGIL: calisma agacini kopyalamak dosyalari dogru yere
      # koyar ama ~/vestra-repo'nun git durumunu ESKI commit'te birakir --
      # "sunucu hangi surumde" sorusu o andan sonra yanlis cevap verir ve bir
      # sonraki basarili deploy'un `reset --hard`i sessizce geri alir. Bundle
      # ayni git durumunu uretiyor, yani iki yol AYNI sonuca variyor.
      #
      # GERI OKUNUYOR: sunucudaki HEAD, push edilen SHA ile birebir ayni degilse
      # is KIRMIZI biter. "Tasidim" deyip eski kodu birakmak, bu depoda
      # defalarca kaydedilen "kaydettim ama kaydetmedim" hatasinin deploy hali.
      - name: Kod aktarımı — yedek yol (sunucu GitHub'a çıkamıyorsa)
        if: steps.gitsync.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # bundle SIG klonda uretilemez

      - name: Bundle'ı sunucuya taşı ve sıfırla (yedek yol)
        if: steps.gitsync.outcome == 'failure'
        env:
          SSH_KEY:  ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          BR:       ${{ github.ref_name }}
          WANT:     ${{ github.sha }}
          # drone-scp sunucunun profilinden gelen "tput: No value for $TERM"
          # stderr'ini hata sayip transferi geri aliyor; duz scp + TERM=dumb
          # bu depoda zaten kullanilan kalip (bkz. fetch-dropbox.yml).
          TERM: dumb
        run: |
          set -e
          PORT="${SSH_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSHOPT="-i $HOME/.ssh/id_deploy -p $PORT -o BatchMode=yes -o StrictHostKeyChecking=no"

          # TEK TIRNAK: cift tirnak icinde ters tirnak KOMUT CALISTIRIR (bu
          # satir oldugu gibi birakilsa runner gercekten `git fetch origin`
          # deneyecekti). Bu depoda kesme isareti tuzagi iki kez kayitli.
          echo 'NOT: sunucunun git fetch origin adimi dustu -- kod bu yoldan tasiniyor.'
          # `git bundle create <dosya> <SHA>` CALISMIYOR: bundle REF ister, ciplak
          # bir commit hicbir ref uretmiyor ve git "Refusing to create empty
          # bundle" deyip duyuyor (ilk kosuda birebir bu cikti). checkout@v4 push
          # olayinda github.sha'da detached HEAD birakiyor, yani HEAD tam olarak
          # tasimak istedigimiz commit -- ve geri okuma zaten SHA'yi dogruluyor.
          git bundle create /tmp/vestra.bundle HEAD
          git bundle verify /tmp/vestra.bundle >/dev/null
          ls -l /tmp/vestra.bundle | awk '{print "bundle: " $5 " bayt"}'
          # scp DEGIL, ssh'a BORU. Iki sebep:
          #  1) scp'de port bayragi `-P`, ssh'da `-p` -- ayni $SSHOPT'u ikisine
          #     birden vermek scp'ye portu DOSYA ADI diye okutuyor. Ilk canli
          #     kosuda birebir bu cikti: `scp: stat local "***": No such file`
          #     ve "***" maskelenmis port numarasiydi, yani hata mesaji bile
          #     sebebi gizliyordu.
          #  2) Bu depo ayni transferi zaten boyle yapiyor (fetch-dropbox.yml,
          #     tar | ssh) -- ikinci bir kalip yazmak ayni tuzagi ikinci kez
          #     kurmak olurdu.
          ssh $SSHOPT "$SSH_USER@$SSH_HOST" 'cat > /tmp/vestra.bundle' < /tmp/vestra.bundle
          ssh $SSHOPT "$SSH_USER@$SSH_HOST" 'ls -l /tmp/vestra.bundle | awk "{print \"sunucuda: \" \$5 \" bayt\"}"'

          ssh $SSHOPT "$SSH_USER@$SSH_HOST" "
            set -e
            REPO=\"\$HOME/vestra-repo\"
            if [ ! -d \"\$REPO/.git\" ]; then
              echo 'UYARI: vestra-repo bir git klonu degil -- deploy.sh kendi isini yapacak'
              rm -f /tmp/vestra.bundle
              exit 0
            fi
            cd \"\$REPO\"
            echo \"oncesi : \$(git rev-parse --short HEAD)\"
            git fetch /tmp/vestra.bundle HEAD
            git reset --hard FETCH_HEAD
            echo \"sonrasi: \$(git rev-parse --short HEAD)\"
            rm -f /tmp/vestra.bundle
            GOT=\$(git rev-parse HEAD)
            if [ \"\$GOT\" != '$WANT' ]; then
              echo \"*** GERI OKUMA TUTMADI: sunucu \$GOT, beklenen $WANT\" >&2
              exit 1
            fi
            echo 'geri okundu: sunucudaki HEAD push edilen SHA ile ayni'
          "

      - name: Sunucuda deploy.sh çalıştır
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: bash ~/deploy.sh

      # deploy.sh'ın ana rsync'i uploads/'u HARİÇ tutuyor (satıcı yüklemelerini
      # korumak için). Bu yüzden git'e eklediğimiz ÜRÜN görselleri sunucuya hiç
      # gitmiyordu. Aşağıdaki additive rsync git'teki ürün görsellerini public_html'e
      # kopyalar; --delete YOK, dolayısıyla sunucudaki (git'te olmayan) satıcı
      # yüklemeleri korunur.
      - name: Ürün görsellerini senkronla (uploads/ additive)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 3m
          script: |
            # deploy.sh: REPO=~/vestra-repo, LIVE=~/public_html (uploads/ ana rsync'te haric).
            VUP="$HOME/vestra-repo/vestra/uploads"
            if [ -d "$VUP" ]; then
              rsync -a "$VUP/" "$HOME/public_html/uploads/" && echo "uploads senkron OK: $VUP -> public_html/uploads"
            else
              echo "UYARI: $VUP yok — atlaniyor"
            fi

      # Dropship partner API (api/dropship.php) icin DROPSHIP_API_KEY gerekiyor.
      # SADECE yoksa uretir/yazar -- zaten varsa DOKUNMAZ, bu yuzden her deploy'da
      # calismasi bir partner entegrasyonunu bozmaz. .env repo'nun DISINDA
      # (~/.env, public_html'in bir ust dizini, web'den erisilemez) -- key hicbir
      # zaman git'e commit edilmiyor. Kasitli rotasyon icin ayri, elle yapilan bir
      # adim gerekir (bu adim rotate ETMEZ).
      - name: Dropship API key yoksa oluştur (.env, idempotent)
        uses: appleboy/ssh-action@v1.0.3
        env:
          REVEAL_KEY: ${{ github.event.inputs.reveal_key }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 1m
          envs: REVEAL_KEY
          script: |
            cat > /tmp/vestra_dropkey.php <<'PHPEOF'
            <?php
            $envFile = getenv("HOME")."/.env";
            $reveal  = getenv("REVEAL_KEY") === "true";
            $lines = is_readable($envFile) ? file($envFile, FILE_IGNORE_NEW_LINES) : [];
            $key = null;
            foreach ($lines as $l) {
                if (preg_match('/^DROPSHIP_API_KEY\s*=\s*(.+)$/', trim($l), $m)) { $key = trim($m[1], " \t\"'"); break; }
            }
            if ($key === null) {
                $key = bin2hex(random_bytes(32));
                $lines[] = "DROPSHIP_API_KEY={$key}";
                file_put_contents($envFile, implode("\n", $lines) . "\n");
                @chmod($envFile, 0600);
                echo "DROPSHIP_API_KEY ilk kez olusturuldu.\n";
            } else {
                echo "DROPSHIP_API_KEY zaten kurulu, dokunulmadi.\n";
            }
            // Log maskeleme uzun hex/rastgele-gorunumlu dizileri kismen "***" ile
            // gizliyor -- duz ya da ters yazdirmak fark etmedi (ikisinde de farkli
            // konumlarda maskelendi), yani tek dize halinde yazdirmak guvenilir
            // degil. Bunun yerine HER karakteri ayri ayri, aralarinda bosluk ve
            // indeksle yazdiriyoruz -- artik "uzun rastgele dize" gibi gorunmuyor,
            // maskelenecek tek bir kalip yok. Sadece reveal_key=true'da calisir.
            if ($reveal) {
                echo "\n=== KEY (indeksli tek tek karakter -- boslukla birlestirip kullanin) ===\n";
                $chars = str_split($key);
                foreach ($chars as $i => $c) { echo "{$i}={$c} "; }
                echo "\n";
                echo "uzunluk=" . strlen($key) . "  crc32=" . dechex(crc32($key)) . "\n";
                echo "=========================================================================\n";
            }
            PHPEOF
            php /tmp/vestra_dropkey.php
            rm -f /tmp/vestra_dropkey.php

      # ZAMANLAMA GERCEGI (31 Agu 2026'da ogrenildi): GitHub schedule YALNIZCA
      # varsayilan daldaki (claude/charming-franklin-1ynmuj) workflow dosyalarini
      # calistirir ve bu dalda olusturulan pool-sweep.yml kayitli workflow
      # listesine hic girmedi — dispatch 404, schedule hic atesLENMEDI. Yani
      # "her gun 06:00'da havuz iadesi + escrow serbest birakma" kagit ustunde
      # kaldi. Gunluk isler bu yuzden GitHub'a degil SUNUCU crontab'ina kurulur.
      # Bu adim idempotenttir: yalnizca kendi VESTRA-SWEEP satirlarini silip
      # yeniden yazar, operatorun/cPanel'in diger satirlarina dokunmaz.
      - name: Günlük süpürücüleri sunucu crontab'ına kur (havuz + escrow)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 2m
          script: |
            set -e
            PHPBIN="$(command -v php)"
            if [ -z "$PHPBIN" ] || ! command -v crontab >/dev/null 2>&1; then
              echo "HATA: php veya crontab bulunamadi — supuruculer ZAMANLANAMADI"; exit 1
            fi
            # crontab satirlarinda $HOME acilmadan (tek tirnak) birakilir: cron
            # komutu sh ile calistirir ve HOME'u kendisi kurar. Boylece cPanel
            # kullanici adi ne crontab'a ne bu (halka acik) loglara girer.
            ( crontab -l 2>/dev/null | grep -v 'VESTRA-SWEEP' || true
              # OTURUM TEMIZLIGI -- 16 Eyl 2026'da ogrenildi, pahaliya.
              # data/sessions'ta 229.721 oturum dosyasi birikmisti ve kullanici
              # kotasi dolmustu: PHP artik oturum dosyasi ACAMIYORDU, yani site
              # 200 donuyor ama giris, fiyat kapisi, sepet, panel calismiyordu.
              # Sebep tek satirda: bu kurulum oturumlari kendi dizinimizde
              # tutuyor (auth.php, paylasimli /tmp bizim oturumlarimizi
              # dakikalar icinde siliyordu) ve gc_maxlifetime BILEREK 90 gun --
              # yani PHP'nin kendi cop toplayicisi calissa bile hicbir seyi
              # silmezdi. Cerez tasimayan her istek (taramaci botlar) YENI bir
              # dosya aciyor: olculen hiz gunde ~7.000-9.000 dosya.
              # Silmek kimseyi cikis yaptirmaz: auth_set() her giriste 90 gunluk
              # vestra_rmb cerezi yaziyor ve auth_remember_restore() her
              # session_start()'ta oturumu geri kuruyor. Sepet de oturumda degil
              # (localStorage).
              echo '30 5 * * * find $HOME/public_html/data/sessions -maxdepth 1 -type f -name "sess_*" -mtime +3 -delete 2>/dev/null # VESTRA-SWEEP oturum-temizlik'
              # HATA GUNLUGU TAVANI. Ayni gun public_html/error_log 36 MB /
              # 186.255 satirdi ve kendi kendini besliyordu: kota dolunca her
              # istek ucer uyari yaziyor, o yazim kotayi daha da dolduruyordu.
              # vestra_sweep.log'un tavani asagida zaten vardi; asil buyuyen
              # dosyada yoktu. `cat > $L` yerinde kisaltir -- inode korunur,
              # PHP'nin acik tuttugu tanitici gecerli kalir.
              echo '35 5 * * * L=$HOME/public_html/error_log; if [ -f "$L" ] && [ "$(wc -c < "$L")" -gt 4194304 ]; then tail -c 1048576 "$L" > "$L.t" && cat "$L.t" > "$L" && rm -f "$L.t"; fi # VESTRA-SWEEP hata-gunlugu'
              echo '10 6 * * * cd $HOME/public_html && '"$PHPBIN"' cron_pool_sweep.php >> $HOME/vestra_sweep.log 2>&1 # VESTRA-SWEEP havuz'
              echo '25 6 * * * cd $HOME/public_html && '"$PHPBIN"' cron_escrow_release.php >> $HOME/vestra_sweep.log 2>&1 # VESTRA-SWEEP escrow'
              # Onay bekleyen hesaplar. Kayit oldugunda operatore HICBIR sey haber
              # vermiyordu (check-registrations.yml elle tetikleniyor), ve 1 Eylul
              # 2026'da 7 hesap birikmisti -- biri belgesini verip onay almisken
              # hala kilitliydi. Bekleyen yoksa mektup GITMEZ.
              echo '40 6 * * * cd $HOME/public_html && '"$PHPBIN"' cron_pending_accounts.php >> $HOME/vestra_sweep.log 2>&1 # VESTRA-SWEEP bekleyen-hesap'
              # Satici belge suresi (operator karari, 2 Eyl 2026): ilk ilandan
              # itibaren 3 gun; gelmezse aski + mektup. Operatore yalnizca aski
              # ya da onay bekleyen varsa yazar.
              echo '50 6 * * * cd $HOME/public_html && '"$PHPBIN"' cron_seller_docs.php >> $HOME/vestra_sweep.log 2>&1 # VESTRA-SWEEP satici-belge'
              # Odeme hatirlatma / otomatik iptal (operator karari, 2 Eyl 2026):
              # faturasi kesilmis, havale bekleyen bir siparise ilk uyari + 5 is
              # gunu; sure dolarsa otomatik iptal. Dekont yuklenmisse saat durur.
              echo '0 7 * * * cd $HOME/public_html && '"$PHPBIN"' cron_order_payment.php >> $HOME/vestra_sweep.log 2>&1 # VESTRA-SWEEP odeme-hatirlatma'
              # Acik talep (dispute) hatirlatmasi (6 Eyl 2026): SSS "2 is gunu
              # icinde inceleriz" diyor; sureyi gecen acik talep operatore yazilir.
              # Gecikmis yoksa mektup GITMEZ.
              echo '10 7 * * * cd $HOME/public_html && '"$PHPBIN"' cron_claims.php >> $HOME/vestra_sweep.log 2>&1 # VESTRA-SWEEP talep-hatirlatma'
              # Gunluk journal yazisi (operator, 7 Eyl 2026: "her gun otomatik
              # journal e paylasim yap"). HER GUN CALISIR, HER GUN YAYIMLAMAZ:
              # yazinin tamami canli ilan kaydindan turuyor ve yeni ilan yoksa
              # hicbir sey yazilmiyor -- her gun uretilen ici bos bir yazi hem
              # alan adinin arama degerini duserir (KURAL 9'un ince icerik
              # yasagi) hem de okuyucuya journal'i atlamayi ogretir (KURAL 2c).
              echo '20 7 * * * cd $HOME/public_html && '"$PHPBIN"' cron_journal.php >> $HOME/vestra_sweep.log 2>&1 # VESTRA-SWEEP journal'
            ) | crontab -
            echo "-- kurulu VESTRA-SWEEP satirlari:"
            crontab -l | grep 'VESTRA-SWEEP'
            # SAATLER UTC DEGIL. cron crontab'i SUNUCUNUN YEREL saatinde yorumlar
            # ve bu sunucu MST (-0700), yani yukaridaki "06:10" gercekte 13:10
            # UTC. 8 Eyl 2026'ya kadar CLAUDE.md alti yerde "UTC" diyordu ve
            # yanlisti. Varsayimi gorunur kilmak icin her deploy iki saati yan
            # yana basiyor: bir sonraki okuyan crontab satirindan UTC cikarmasin.
            echo "-- cron bu saatleri YEREL okur: $(date '+%Y-%m-%d %H:%M %Z (%z)')  |  UTC: $(date -u '+%H:%M')"
            # Kutuk public_html DISINDA (web'den erisilemez); sismesin diye
            # 512KB'i asarsa son 128KB kalir.
            L="$HOME/vestra_sweep.log"
            if [ -f "$L" ] && [ "$(wc -c < "$L")" -gt 524288 ]; then
              tail -c 131072 "$L" > "$L.t" && mv "$L.t" "$L"
            fi

      # KANARYA: iki supurucu de gercek sunucu ortaminda AYAGA KALKIYOR MU?
      # (kuru kosu — hicbir sey yazmaz, para/posta dokunmaz.) Cikti yalnizca
      # ref/etiket/tutar icerir, e-posta adresi basmaz — halka acik log guvenli.
      # PHP fatal olursa bu adim KIRMIZI biter; "yesil gorunen bozuk para isi"
      # tuzagi bu depoda iki kez yasandi, ucuncusu olmasin.
      - name: Süpürücü kuru koşu kanaryası (havuz + escrow)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 2m
          script: |
            set -e
            cd "$HOME/public_html"
            echo "=== havuz supurucusu (kuru) ==="
            php cron_pool_sweep.php --dry-run
            echo "=== talep hatirlatmasi (kuru) ==="
            php cron_claims.php --dry-run
            echo ""
            echo "=== escrow serbest birakma (kuru) ==="
            php cron_escrow_release.php --dry-run
            echo ""
            # Bu betik canli kosuda MEKTUP gonderiyor, kuru kosuda gondermiyor.
            # Kanaryanin isi metni degil, AYAGA KALKIYOR MU sorusunu yanitlamak:
            # fatal olursa deploy kirmizi biter ve bekleyen hesap uyarisi sessizce
            # hic calismamis olmaz.
            echo "=== bekleyen hesap uyarisi (kuru) ==="
            php cron_pending_accounts.php --dry-run
            echo ""
            # Bu betik canli kosuda HESAP ASKIYA ALIR ve mektup gonderir; kuru
            # kosuda yalnizca ne yapacagini yazar. Fatal olursa deploy kirmizi.
            echo "=== satici belge suresi (kuru) ==="
            php cron_seller_docs.php --dry-run
            echo ""
            # Bu betik canli kosuda SIPARIS IPTAL EDER ve mektup gonderir; kuru
            # kosuda yalnizca ne yapacagini yazar. Fatal olursa deploy kirmizi.
            echo "=== odeme hatirlatma / otomatik iptal (kuru) ==="
            php cron_order_payment.php --dry-run
            echo ""
            # Gunluk journal yazisi. Kuru kosu hicbir sey yayimlamaz, yalnizca o
            # gun ne cikacagini (ya da NEDEN cikmayacagini) yazar. Yazi canli
            # ilan kaydindan uretildigi icin katalog degistiginde bu adim ilk
            # kirilacak yer: fatal deploy'u kirmiziya boyar.
            echo "=== gunluk journal yazisi (kuru) ==="
            php cron_journal.php --dry
