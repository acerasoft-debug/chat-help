name: (Tanı) Son gönderilen alıcılar — firma, alan adı, ülke (salt okuma)
# 14 Eki 2026 (operatör: "RTL Zuschauerservice'e e-mail atmışsın"). Kimlere yazıldığını görmek için. Yerel kısım maskeli.
on:
  workflow_dispatch:
    inputs:
      since:
        description: "Bu tarihten (YYYY-MM-DD) itibaren"
        required: false
        default: "2026-10-14"
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          SINCE: ${{ github.event.inputs.since }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: SINCE
          command_timeout: 3m
          script: |
            cd ~/public_html
            cat > /tmp/vestra_rs.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $home = getenv("HOME");
            require $home."/public_html/inc/products.php";
            require_once $home."/public_html/inc/leads.php";
            $since = preg_match('/^\d{4}-\d{2}-\d{2}$/', (string)getenv('SINCE')) ? getenv('SINCE') : date('Y-m-d');
            $n = 0; $byC = [];
            foreach (vestra_leads() as $l) {
              $lc = (string)($l['last_contacted_at'] ?? ''); if ($lc === '' || substr($lc, 0, 10) < $since || ($l['contact_via'] ?? '') !== 'mailbox') continue;
              $e = strtolower((string)($l['email'] ?? '')); $dom = substr((string)strrchr($e, '@'), 1); $loc = strstr($e, '@', true);
              $site = preg_replace('#^https?://(www\.)?#', '', (string)($l['website'] ?? ''));
              $fu = (array)($l['followups'] ?? []); $kind = $fu && substr((string)(end($fu)['at'] ?? ''), 0, 10) >= $since ? 'takip' : 'ilk';
              $c = (string)($l['country'] ?? ''); $byC[$c] = ($byC[$c] ?? 0) + 1;
              printf("%s|%s|%s|%s|%s@%s|%s|%s|%s\n", $l['id'] ?? '', substr($lc, 0, 16), $kind, mb_substr((string)($l['company'] ?? ''), 0, 40), $loc, $dom, $site, $c, implode(',', array_slice((array)($l['premium_brands'] ?? []), 0, 3)));
              $n++;
            }
            arsort($byC); echo "\nTOPLAM $n · ulke: ".json_encode($byC, JSON_UNESCAPED_UNICODE)."\n";
            PHPEOF
            php /tmp/vestra_rs.php 2>&1; rm -f /tmp/vestra_rs.php
