name: (Teşhis) E-posta kimliği — SPF, DKIM, DMARC, MX, PTR (salt okunur)

# 16 Eki 2026, operatör: "en iyi e-mail gönderimini istiyorum, spamsız ve gerçek e-mailler". Spam klasörüne
# düşmemenin temeli: vestrasales.com'un SPF'si sunucunun çıkış IP'sini kapsıyor mu, DKIM imzası (selector
# 'vestra') DNS'teki açık anahtarla eşleşiyor mu, DMARC politikası ne, sunucu IP'sinin PTR'si var mı, IP
# bilinen kara listelerde mi. Hiçbir şey yazmaz; IP basılmaz (yalnız eşleşme/var-yok).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 3m
          script: |
            mkdir -p ~/vestra_tmp
            cat > ~/vestra_tmp/ma.php <<'PHPEOF'
            <?php
            ini_set('display_errors', '1');
            chdir(getenv('HOME').'/public_html');
            require_once 'inc/products.php'; require_once 'inc/leads.php'; require_once 'inc/notify.php'; require_once 'inc/mailbox.php';
            $dom = 'vestrasales.com';
            $txt = function (string $n): array { $r = @dns_get_record($n, DNS_TXT); return $r === false ? [] : array_map(fn($x) => (string)($x['txt'] ?? ''), $r); };
            /* Sunucunun dış IP'si: mail() Exim → GoDaddy aktarıcısı; SPF'nin kapsaması gereken, aktarıcının IP'si. */
            $ip = trim((string)@file_get_contents('https://api.ipify.org'));
            echo "sunucu dis IP: ".($ip !== '' ? 'alindi' : 'ALINAMADI')."\n";
            $spf = array_values(array_filter($txt($dom), fn($t) => stripos($t, 'v=spf1') === 0));
            echo "SPF kaydi: ".(count($spf) === 1 ? 'VAR (1)' : (count($spf) ? 'BIRDEN FAZLA ('.count($spf).') -- HATA' : 'YOK'))."\n";
            if ($spf) echo "  ".$spf[0]."\n";
            $dm = $txt('_dmarc.'.$dom); $dmarc = array_values(array_filter($dm, fn($t) => stripos($t, 'v=DMARC1') === 0));
            echo "DMARC: ".($dmarc ? $dmarc[0] : 'YOK')."\n";
            echo "DKIM (selector ".VESTRA_DKIM_SELECTOR."): ".vestra_dkim_dns_status()."\n";
            $mx = []; @getmxrr($dom, $mx); echo "MX: ".($mx ? implode(', ', $mx) : 'YOK')."\n";
            if ($ip !== '') {
              $ptr = @gethostbyaddr($ip); echo "PTR (ters DNS): ".($ptr && $ptr !== $ip ? $ptr : 'YOK')."\n";
              $rev = implode('.', array_reverse(explode('.', $ip)));
              foreach (['zen.spamhaus.org', 'bl.spamcop.net', 'b.barracudacentral.org', 'dnsbl.sorbs.net'] as $bl) {
                $hit = @gethostbyname($rev.'.'.$bl); echo "kara liste ".str_pad($bl, 24).": ".($hit !== $rev.'.'.$bl ? 'LISTEDE ('.$hit.')' : 'temiz')."\n";
              }
            }
            /* Gönderim tarafı: mail() hangi transport, gönderen adres, List-Unsubscribe */
            $cfg = vestra_mailbox_cfg();
            echo "gunluk tavan: ".vestra_mailbox_daily_cap()." · bugun gonderilen: ".vestra_mailbox_sent_today()." · isinma: ".(!empty($cfg['warmup']) ? 'acik' : 'kapali')."\n";
            $bs = vestra_mailbox_bounce_stats(); printf("geri donme (son %d gun): %d/%d = %.1f%%%s\n", VESTRA_MAILBOX_BOUNCE_DAYS, $bs['bounced'], $bs['sent'], $bs['rate'] * 100, $bs['stop'] ? ' -- FREN' : '');
            echo "DKIM anahtar cifti sunucuda: ".(vestra_dkim_keys(false) ? 'var' : 'yok')."\n";
            PHPEOF
            php ~/vestra_tmp/ma.php; rc=$?; rm -f ~/vestra_tmp/ma.php; exit $rc
