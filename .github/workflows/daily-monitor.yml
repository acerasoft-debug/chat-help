name: Daily Monitor (ChatHelp)

# Her gün 06:00 UTC + elle tetikleme
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # E-posta raporu istiyorsan (opsiyonel) nodemailer kurulur
      - name: nodemailer kur (opsiyonel mail)
        run: npm i nodemailer@6 --no-save

      - name: Sağlık kontrolü
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
        run: node scripts/health-check.mjs

      # Bir şey down ise issue aç (GitHub ayrıca repo sahibine mail atar)
      - name: Sorun varsa issue aç
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🔴 ChatHelp Monitor: Servis erişilemez (${new Date().toISOString().slice(0,10)})`;
            const body = 'Günlük sağlık kontrolü başarısız oldu. Actions loglarına bakın:\n' +
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'monitor'
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['monitor']
              });
            }
