name: Sarvesto-Verwaltung — eigenen Admin-Zugang setzen

# Elle tetiklenir: Actions → bu workflow → Run workflow.
#
# Gerekli repo secret'ları (Settings → Secrets and variables → Actions):
#   SARVESTO_ADMIN_EMAIL      Giriş e-postası (panelde kullanıcı adı)
#   SARVESTO_ADMIN_PASSWORD   En az 12 karakter
#
# E-posta ve şifre SSH oturumunun STDIN'i ile gider: sunucudaki komut dizgesi
# (ve dolayısıyla ps / /proc/<pid>/cmdline) onları hiç içermez; log'a, dosyaya
# yazılmaz; sunucuda yalnızca password_hash özeti ~/data/admin.json'a
# (chmod 600) yazılır. Giriş: https://sarvesto.com/admin/
# Alternatif (secret'sız): panele Vestra şifresiyle girip Sicherheit →
# "Eigenen Zugang anlegen".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Secret'lar var mı
        env:
          AE: ${{ secrets.SARVESTO_ADMIN_EMAIL }}
          AP: ${{ secrets.SARVESTO_ADMIN_PASSWORD }}
        run: |
          [ -n "$AE" ] || { echo "::error::SARVESTO_ADMIN_EMAIL tanımlı değil (Settings → Secrets and variables → Actions)."; exit 1; }
          [ -n "$AP" ] || { echo "::error::SARVESTO_ADMIN_PASSWORD tanımlı değil."; exit 1; }
          [ ${#AP} -ge 12 ] || { echo "::error::Şifre en az 12 karakter olmalı."; exit 1; }
          case "$AE" in *$'\n'*) echo "::error::E-posta tek satır olmalı."; exit 1;; esac
          echo "Secret'lar tanımlı."

      - name: Sunucuda hesabı yaz (stdin üzerinden)
        env:
          AE: ${{ secrets.SARVESTO_ADMIN_EMAIL }}
          AP: ${{ secrets.SARVESTO_ADMIN_PASSWORD }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USR: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT || 22 }}
        run: |
          set -e
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          # İlk satır e-posta, kalanı şifre. Uzak komut sabit: içinde sır yok.
          printf '%s\n%s' "$AE" "$AP" | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -o BatchMode=yes -p "$PORT" "$USR@$HOST" \
            'cd ~/maxsales_de && IFS= read -r AE && php tools/admin-user.php set "$AE" - && php tools/admin-user.php show'
          rm -f ~/.ssh/id_deploy
