name: SARVESTO Android uygulaması — derle, imzala, sitede yayınla

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Çalışılacak dal"
        required: true
        default: "claude/vestra-premium-retail-site-rxj4va"

permissions:
  contents: read

# sarvesto-app/ (Capacitor) → imzalı release APK → sunucuda
# ~/maxsales_de/uploads/app/SARVESTO.apk. Uygulama sayfası (sarvesto.com/app)
# dosyayı görünce "Android için indir" düğmesini kendiliğinden gösteriyor.
#
# İMZA ANAHTARI DEPODA DEĞİL (depo herkese açık). İlk çalışmada üretilir ve
# sunucuda, web kökünün dışında ~/.sarvesto-signing/ altına 0600 izinle konur;
# sonraki her derleme AYNI anahtarı oradan alır — telefondaki uygulama yeni
# sürümü güncelleme olarak kabul etsin diye. Şifre loglarda maskeli.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Runner'da Android SDK hazır kurulu (setup-android'in sdkmanager'ı
      # 10.10.2026'da hata verdi). Lisanslar kabul, eksik platformu Gradle indirir.
      - name: Android SDK (runner'daki)
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          ls "$ANDROID_HOME/build-tools" | tail -3

      - name: SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "SSHOPT=-i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=no -p ${{ secrets.DEPLOY_PORT || 22 }}" >> "$GITHUB_ENV"
          echo "SCPOPT=-i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=no -P ${{ secrets.DEPLOY_PORT || 22 }}" >> "$GITHUB_ENV"
          echo "SRV=${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" >> "$GITHUB_ENV"

      - name: İmza anahtarı (sunucudan; ilk seferde üret)
        run: |
          set -e
          K="$RUNNER_TEMP/sv"; mkdir -p "$K"; chmod 700 "$K"
          if [ "$(ssh $SSHOPT "$SRV" 'test -f ~/.sarvesto-signing/release.jks && test -f ~/.sarvesto-signing/pass && echo yes || echo no')" = "yes" ]; then
            scp $SCPOPT "$SRV:.sarvesto-signing/release.jks" "$K/release.jks"
            PASS=$(ssh $SSHOPT "$SRV" 'cat ~/.sarvesto-signing/pass')
            echo "::add-mask::$PASS"
            echo "Mevcut anahtar sunucudan alındı."
          else
            PASS=$(openssl rand -hex 24)
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$K/release.jks" -storetype PKCS12 -alias sarvesto \
              -keyalg RSA -keysize 4096 -validity 12000 -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=SARVESTO, O=acerasoft LLC, L=Dover, ST=Delaware, C=US" >/dev/null 2>&1
            ssh $SSHOPT "$SRV" 'mkdir -p ~/.sarvesto-signing && chmod 700 ~/.sarvesto-signing'
            scp $SCPOPT "$K/release.jks" "$SRV:.sarvesto-signing/release.jks"
            printf '%s' "$PASS" | ssh $SSHOPT "$SRV" 'umask 077; cat > ~/.sarvesto-signing/pass; chmod 600 ~/.sarvesto-signing/release.jks ~/.sarvesto-signing/pass'
            echo "Yeni anahtar üretildi ve sunucuya kondu (~/.sarvesto-signing, web dışı)."
          fi
          echo "SV_PASS=$PASS" >> "$GITHUB_ENV"

      - name: Capacitor Android projesi
        working-directory: sarvesto-app
        run: |
          npm install --no-audit --no-fund
          npm run setup:android
          npx capacitor-assets generate --android --iconBackgroundColor '#000000' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#000000'

      - name: Release APK
        working-directory: sarvesto-app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          set -e
          cat > key.properties <<EOF
          storeFile=$RUNNER_TEMP/sv/release.jks
          storePassword=$SV_PASS
          keyAlias=sarvesto
          keyPassword=$SV_PASS
          EOF
          sed -i 's/^ *//' key.properties
          ./gradlew assembleRelease --no-daemon -q
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::İmzalı APK çıkmadı"; ls -R app/build/outputs/apk; exit 1; }
          AS=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $AS"
          if ! "$AS" verify --print-certs "$APK" > "$RUNNER_TEMP/sig.txt" 2>&1; then
            cat "$RUNNER_TEMP/sig.txt"; echo "::error::APK imzası doğrulanamadı"; exit 1
          fi
          grep -E "certificate (DN|SHA-256)" "$RUNNER_TEMP/sig.txt" || cat "$RUNNER_TEMP/sig.txt"
          cp "$APK" "$GITHUB_WORKSPACE/SARVESTO.apk"
          rm -f key.properties
          ls -la "$GITHUB_WORKSPACE/SARVESTO.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SARVESTO-android
          path: SARVESTO.apk
          if-no-files-found: error

      - name: Sitede yayınla (uploads/app/SARVESTO.apk)
        run: |
          set -e
          ssh $SSHOPT "$SRV" 'mkdir -p ~/maxsales_de/uploads/app'
          scp $SCPOPT SARVESTO.apk "$SRV:maxsales_de/uploads/app/SARVESTO.apk.part"
          ssh $SSHOPT "$SRV" 'cd ~/maxsales_de/uploads/app && mv -f SARVESTO.apk.part SARVESTO.apk && chmod 644 SARVESTO.apk && ls -la SARVESTO.apk'
          sleep 3
          curl -sI "https://sarvesto.com/uploads/app/SARVESTO.apk" | grep -iE "^HTTP|content-type|content-length" || true
