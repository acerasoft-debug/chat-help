name: SARVESTO iOS uygulaması — derle (ve hesap varsa App Store'a yükle)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Çalışılacak dal"
        required: true
        default: "claude/vestra-premium-retail-site-rxj4va"

permissions:
  contents: read

# iPhone/iPad uygulaması (sarvesto-app/, Capacitor) GitHub'ın Mac sunucusunda
# derleniyor.
#
# HER ÇALIŞMADA
#   • Xcode projesi derlenir (proje sağlam mı kanıtı)
#   • SARVESTO-simulator.zip — Xcode Simulator'da açılır, ekran görüntüsü için
#   • SARVESTO-unsigned.ipa  — imzasız paket (kendi Apple hesabıyla imzalamak için)
#
# APPLE HESABI BAĞLANINCA (depo → Settings → Secrets → Actions):
#   APPLE_TEAM_ID       Apple Developer → Membership → Team ID (10 karakter)
#   ASC_KEY_ID          App Store Connect → Users and Access → Integrations →
#   ASC_ISSUER_ID         App Store Connect API → anahtar (rol: Admin)
#   ASC_KEY_P8          indirilen AuthKey_XXXX.p8 dosyasının İÇERİĞİ
# Xcode imza sertifikasını ve profili bu anahtarla kendisi üretir; arşiv
# imzalanır ve doğrudan App Store Connect'e (TestFlight) yüklenir. App Store
# Connect'te bir kez "SARVESTO" uygulama kaydı (paket kimliği
# com.sarvesto.app) açılmış olmalı.
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HAS_ASC: ${{ secrets.ASC_KEY_P8 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
      MARKETING_VERSION: 1.0.${{ github.run_number }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: En yeni Xcode
        run: |
          X=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Capacitor iOS projesi
        working-directory: sarvesto-app
        run: |
          npm install --no-audit --no-fund
          npm run setup:ios
          npx capacitor-assets generate --ios --iconBackgroundColor '#000000' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#000000'
          cd ios/App && pod install

      - name: Simulator derlemesi
        working-directory: sarvesto-app/ios/App
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/sim" \
            MARKETING_VERSION=$MARKETING_VERSION CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            CODE_SIGNING_ALLOWED=NO build | tail -20
          cd "$RUNNER_TEMP/sim/Build/Products/Release-iphonesimulator"
          ditto -c -k --keepParent App.app "$GITHUB_WORKSPACE/SARVESTO-simulator.zip"

      - name: İmzasız cihaz paketi (.ipa)
        working-directory: sarvesto-app/ios/App
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/dev" \
            MARKETING_VERSION=$MARKETING_VERSION CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -20
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/dev/Build/Products/Release-iphoneos/App.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/SARVESTO-unsigned.ipa" Payload)
          ls -la "$GITHUB_WORKSPACE"/SARVESTO-*

      - uses: actions/upload-artifact@v4
        with:
          name: SARVESTO-ios-${{ github.run_number }}
          path: |
            SARVESTO-simulator.zip
            SARVESTO-unsigned.ipa
          if-no-files-found: error

      - name: İmzala ve App Store Connect'e yükle (TestFlight)
        if: env.HAS_ASC == 'true'
        working-directory: sarvesto-app/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eo pipefail
          K="$RUNNER_TEMP/asc"; mkdir -p "$K"; chmod 700 "$K"
          printf '%s' "$ASC_KEY_P8" > "$K/AuthKey_$ASC_KEY_ID.p8"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$K/AuthKey_$ASC_KEY_ID.p8"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/SARVESTO.xcarchive" \
            MARKETING_VERSION=$MARKETING_VERSION CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            "${AUTH[@]}" archive | tail -20

          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          sed -i '' 's/^ *//' "$RUNNER_TEMP/export.plist"

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SARVESTO.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -20
          rm -rf "$K"
          echo "✓ Sürüm $MARKETING_VERSION ($BUILD_NUMBER) App Store Connect'e yüklendi — TestFlight'ta işlenince görünür."

      - name: Özet
        run: |
          {
            echo "### SARVESTO iOS $MARKETING_VERSION ($BUILD_NUMBER)"
            echo "- Simulator ve imzasız .ipa: bu çalışmanın Artifacts bölümünde"
            if [ "$HAS_ASC" = "true" ]; then
              echo "- İmzalı sürüm App Store Connect'e yüklendi (TestFlight)"
            else
              echo "- App Store'a yükleme için Apple hesabı sırları eklenmedi (APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
