name: (Günlük) Müşteri bul — web araması + gerçek e-posta
# Panelden tetiklenen çalışma, panelin verdiği istek no'su ile adlanır: panel kendi
# isteğinin durumunu ve linkini bu addan bulur (inc/finder.php).
run-name: ${{ github.event.inputs.request_id && format('Müşteri bul · {0}', github.event.inputs.request_id) || 'Müşteri bul (günlük)' }}
on:
  schedule:
    - cron: '20 5 * * *'      # her gün 05:20 UTC
    - cron: '20 15 * * *'     # 10 Eki 2026 (operatör: "çok az email bulunmuş"): günde ikinci tur, 15:20 UTC
  workflow_dispatch:
    inputs:
      request_id:
        description: "Panelin istek no'su (admin/satıcı panelinden tetiklenince dolu gelir; elle boş bırak)"
        required: false
        default: ""
      owner_uid:
        description: "Boş = admin listesi. Satıcı hesap id'si verilirse bulunan leadler O SATICIYA ait olur."
        required: false
        default: ""
      cities:
        description: "Şehirler (OpenStreetMap + Google Places): 'Ülke|Şehir' virgülle (boş = havuzdan sırayla 6 şehir)"
        required: false
        default: ""
      langs:
        description: "Web sorgu dilleri (de,it,fr,en,nl,es,pt,pl,el,cs,da,sv,nb,fi) — boş = hepsi, pazar ağırlıklı"
        required: false
        default: ""
      countries:
        description: "Sadece bu ülkeler (ISO2, virgülle: DE,AT,CH,IT) — boş = hepsi"
        required: false
        default: ""
      queries_per_run:
        description: "Kaç web sorgusu (marka çifti × dil)"
        required: false
        default: "40"
      extra_queries:
        description: "Kendi arama sorguların (noktalı virgülle ayır) — önce bunlar çalışır"
        required: false
        default: ""
      seed_domains:
        description: "Arama yapmadan doğrudan incelenecek site(ler) (virgül/boşluk)"
        required: false
        default: ""
      time_budget_min:
        description: "Toplam süre bütçesi (dakika)"
        required: false
        default: "55"
      send:
        description: "true = bu koşuda bulunanlara kampanyayı ZORLA gönder. Boş/false = paneldeki Gönderim modu (otomatik/manuel) karar verir."
        required: false
        default: "false"
      send_limit:
        description: "Gönderim tavanı (send=true iken)"
        required: false
        default: "40"
      dry_run:
        description: "true = sadece bul ve raporla; leads.json'a YAZMA"
        required: false
        default: "false"

permissions:
  contents: read      # durum (taranan alan adları) repoda DEĞİL sunucuda: repo public

# Aynı anda iki çalışma leads.json'ı ezmesin (bilinen yarış: oku-değiştir-yaz).
concurrency:
  group: vestra-leads-json
  cancel-in-progress: false

# GUNLUK MUSTERI BULMA HATTI (v2). OSM tabanli eski hat (daily-customers / discover-city)
# kaldirildi: 8 sehir, 27 dakika, 8 lead, 1 gonderim.
#
#   1) ARAMA    Sunucudaki arama vekili (scripts/server/vestra-search.php); anahtarlar
#               admin panelinde girilir ve SUNUCUDA kalir (repo public):
#                 - Brave Search API: premium marka CIFTLERI ("Dsquared2" "Balmain"
#                   boutique ...) 14 dilde. Iki tasarimci markasini birlikte listeleyen
#                   site tanimi geregi cok markali perakendecidir.
#                 - Google Places API (New): sehir bazli butik listesi (mevcut admin
#                   anahtari). Isletme adi + sitesi gelir.
#                 - OpenStreetMap (ANAHTARSIZ, her zaman): sehirdeki giyim dukkanlari;
#                   zincir/ayakkabi/ic camasiri etiketten elenir, kalanin sitesi taranir.
#               Bing/DDG HTML yalnizca yedek: GitHub sunucularini captcha ile
#               engelliyorlar (8 Eki test kosusu: 14 sorgunun 4'u calisti, 0 lead).
#               Panel isteklerini find-customers-queue.yml baslatir (GitHub token gerekmez).
#   2) ELEME    Pazar yeri, zincir, outlet, markanin kendi sitesi: alan adindan.
#               Ayakkabi / ic camasiri / toptanci-distributor / zincir: site iceriginden.
#               2+ premium marka sart. Sunucuda ayrica KURAL 1 (vestra_lead_is_blocked).
#   3) E-POSTA  SADECE sitede yayinlanmis adres; tahmin YOK; MX dogrulanir.
#   4) KAYIT    data/leads.json (+ owner_uid ile saticiya), data/finder_state.json,
#               data/finder_runs.json (panelin okudugu sonuc kaydi).
#
# Secrets: DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_PORT (zaten var)
#          HUNTER_API_KEY (opsiyonel)
# Gonderim: 10 Eki 2026'dan beri PROSPECT_AUTO_SEND degiskeni KULLANILMAZ. Bulunanlara gonderip
#   gondermemeyi Admin > Musteriler > 📮 > "Gonderim modu" (otomatik / manuel) belirler (sunucuda,
#   data/mailbox.json). Gonderim sunucunun kendi posta servisinden, support@vestrasales.com'dan.
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
      TERM: dumb
      DRY_RUN: ${{ github.event_name == 'push' && 'true' || github.event.inputs.dry_run || 'false' }}
      OWNER_UID: ${{ github.event.inputs.owner_uid }}
      REQ_ID: ${{ github.event.inputs.request_id || format('cron-{0}', github.run_id) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Birim testleri (ağsız)
        run: node scripts/find-boutiques.mjs --selftest

      - name: Girdileri doğrula + SSH ayarı
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          case "$OWNER_UID" in *[!A-Za-z0-9_-]*) echo "HATA: owner_uid gecersiz"; exit 1 ;; esac
          case "$REQ_ID"    in *[!A-Za-z0-9_-]*) echo "HATA: request_id gecersiz"; exit 1 ;; esac
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          {
            echo "Host vestra"
            echo "  HostName ${DEPLOY_HOST}"
            echo "  User ${DEPLOY_USER}"
            echo "  Port ${DEPLOY_PORT}"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  StrictHostKeyChecking no"
            echo "  UserKnownHostsFile /dev/null"
            echo "  LogLevel ERROR"
            echo "  ConnectTimeout 25"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      # Sunucudaki mevcut leadler (gonderilmis, bounce, cikmis dahil) tekrar eklenmesin;
      # tarama durumu ve hangi anahtarlarin tanimli oldugu (yalnizca VAR/YOK) da buradan.
      # scp DEGIL ssh'a boru: paylasimli hostta sftp olmayabilir (deploy-vestra.yml'de kayitli).
      - name: Sunucudan mevcut leadleri + durumu al, arama vekilini kur
        run: |
          set -o pipefail
          if ssh vestra 'mkdir -p ~/vestra_tmp' \
             && ssh vestra 'cat > ~/vestra_tmp/known.php' < scripts/server/vestra-known.php \
             && ssh vestra 'cat > ~/vestra_tmp/search.php' < scripts/server/vestra-search.php \
             && ssh vestra 'cd ~/public_html && php ~/vestra_tmp/known.php; rc=$?; rm -f ~/vestra_tmp/known.php; exit $rc' > known.raw \
             && grep '^{' known.raw | tail -n 1 > known.json \
             && python3 -c 'import json;d=json.load(open("known.json"));print("bilinen:",len(d["emails"]),"e-posta,",len(d["domains"]),"alan adi, toplam lead",d.get("total"),"| anahtarlar:",d.get("keys"));json.dump(d.get("state") or {},open("state.json","w"))'; then
            echo "known_ok=true" >> "$GITHUB_ENV"
          else
            # Liste alinamazsa YAZMA: tekrar korumasi olmadan eklemek ayni butige ikinci
            # mektup demek. Bulma calisir, rapor uretilir, sunucuya hicbir sey gitmez.
            echo "UYARI: sunucudan liste alinamadi -- bu calisma sunucuya YAZMAYACAK"
            echo '{"emails":[],"domains":[]}' > known.json; echo '{}' > state.json
            echo "known_ok=false" >> "$GITHUB_ENV"
          fi

      - name: Butikleri bul + gerçek e-postaları çıkar
        id: finder
        env:
          QUERIES_PER_RUN: ${{ github.event.inputs.queries_per_run || (github.event_name == 'push' && '14') || '40' }}
          CITIES: ${{ github.event.inputs.cities }}
          PLACES_PER_RUN: ${{ github.event_name == 'push' && '2' || '6' }}
          # Şehir verilmemişse OSM, OSM_TARGET yeni adaya ya da bütçenin %35'ine kadar havuzdan şehir alır.
          MAX_CITIES: ${{ github.event_name == 'push' && '2' || '40' }}
          OSM_TARGET: ${{ github.event_name == 'push' && '60' || '900' }}
          LANGS: ${{ github.event.inputs.langs }}
          COUNTRIES: ${{ github.event.inputs.countries }}
          EXTRA_QUERIES: ${{ github.event.inputs.extra_queries }}
          SEED_DOMAINS: ${{ github.event.inputs.seed_domains }}
          ENGINES: server,osm,bing,ddg
          SEARCH_CMD: ssh vestra 'cd ~/public_html && php ~/vestra_tmp/search.php'
          TIME_BUDGET_MIN: ${{ github.event.inputs.time_budget_min || (github.event_name == 'push' && '15') || '55' }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          KNOWN_FILE: known.json
          STATE_FILE: state.json
          OUT_DIR: out
        run: |
          case "$TIME_BUDGET_MIN" in ''|*[!0-9]*) TIME_BUDGET_MIN=55 ;; esac
          export TIME_BUDGET_SEC=$(( TIME_BUDGET_MIN * 60 ))
          node scripts/find-boutiques.mjs

      - name: Özet
        if: always()
        run: |
          if [ -f out/report.md ]; then cat out/report.md >> "$GITHUB_STEP_SUMMARY"; else echo "rapor uretilemedi" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Leadleri + durumu sunucuya yaz (data/leads.json, data/finder_state.json)
        if: ${{ env.DRY_RUN != 'true' && env.known_ok == 'true' && steps.finder.outcome == 'success' }}
        run: |
          set -o pipefail
          ssh vestra 'cat > ~/vestra_tmp/found.json' < out/leads.json
          ssh vestra 'cat > ~/vestra_tmp/state.json' < state.json
          ssh vestra 'cat > ~/vestra_tmp/push.php' < scripts/server/vestra-push-leads.php
          ssh vestra "cd ~/public_html && php ~/vestra_tmp/push.php ~/vestra_tmp/found.json ~/vestra_tmp/state.json '${OWNER_UID}'; rc=\$?; rm -f ~/vestra_tmp/found.json ~/vestra_tmp/state.json ~/vestra_tmp/push.php; exit \$rc" | tee push.log
          { echo ""; echo "### Sunucuya yazım"; echo '```'; tail -n 5 push.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Kampanya gönder (paneldeki Gönderim modu — otomatik / manuel)
        if: ${{ env.DRY_RUN != 'true' && env.known_ok == 'true' && env.OWNER_UID == '' && steps.finder.outcome == 'success' }}
        env:
          SEND_LIMIT: ${{ github.event.inputs.send_limit || '40' }}
          FORCE_SEND: ${{ github.event.inputs.send }}
        run: |
          set -o pipefail
          case "$SEND_LIMIT" in ''|*[!0-9]*) SEND_LIMIT=40 ;; esac
          # Kampanyalar sunucunun KENDİ posta servisinden, support@vestrasales.com'dan gider (cron_mailbox.php
          # 10 dk içinde alır; 25-55 sn ara, günlük tavan, kapalı alan adı kontrolü, DKIM). Sipariş/fatura
          # e-postaları Brevo'da kalır.
          # 10 Eki 2026 (operatör: "istersem otomatik bulunur bulunmaz gönderim, istersem manuel"): karar
          # SUNUCUDA, Admin ▸ Müşteriler ▸ 📮 ▸ Gönderim modu. 'auto' alt komutu MANUEL modda hiçbir şey
          # göndermez. Elle başlatılan GitHub koşusunda send=true yalnız o koşu için zorlar.
          ssh vestra 'cat > ~/vestra_tmp/mailbox-queue.php' < scripts/server/vestra-mailbox-queue.php
          if [ "$FORCE_SEND" = "true" ]; then
            ssh vestra "cd ~/public_html && php ~/vestra_tmp/mailbox-queue.php request send ${SEND_LIMIT} lesgarage '' web" | tee send.log || true
          else
            ssh vestra "cd ~/public_html && php ~/vestra_tmp/mailbox-queue.php auto" | tee send.log || true
          fi
          ssh vestra 'rm -f ~/vestra_tmp/mailbox-queue.php' || true
          { echo ""; echo "### Gönderim"; echo '```'; tail -n 40 send.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Panelin "Web'den müşteri bul" kartı sonucu buradan okur (data/finder_runs.json).
      # Basarisiz kosu da yazilir: panel "calisiyor" diye sonsuza dek beklemesin.
      - name: Sonucu panele yaz (data/finder_runs.json)
        if: ${{ always() && env.known_ok == 'true' && github.event_name != 'push' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -f out/summary.json ] && ssh vestra 'cat > ~/vestra_tmp/summary.json' < out/summary.json || true
          [ -f out/report.md ]    && ssh vestra 'cat > ~/vestra_tmp/report.md' < out/report.md || true
          ssh vestra 'cat > ~/vestra_tmp/report.php' < scripts/server/vestra-finder-report.php
          ssh vestra "cd ~/public_html && php ~/vestra_tmp/report.php '${REQ_ID}' ~/vestra_tmp/summary.json ~/vestra_tmp/report.md '${RUN_URL}' '${JOB_STATUS}' '${DRY_RUN}' '${OWNER_UID}'; rm -f ~/vestra_tmp/report.php ~/vestra_tmp/summary.json ~/vestra_tmp/report.md"

      - name: Sunucudaki geçici dosyaları temizle
        if: ${{ always() && env.known_ok == 'true' }}
        run: ssh vestra 'rm -f ~/vestra_tmp/search.php ~/vestra_tmp/known.php ~/vestra_tmp/found.json ~/vestra_tmp/state.json ~/vestra_tmp/push.php ~/vestra_tmp/send.php' || true
