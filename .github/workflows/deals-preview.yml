name: (Önizleme) İndirim kampanyası — operatör kutusuna örnek mektup
# 22 Eki 2026 (operatör: "indirimli Lacoste ürünlerini Angebota koyalım … kampanya estetik olsun, live fotoları ekle").
# vestra_campaign_deals() CANLI veriyle kurulur ve YALNIZ operatör kutusuna (ops_email) gider — müşteriye hiçbir şey
# gitmez, kayıt değişmez. Kütüğe konu + ürün listesi (ad, %) basılır; adres basılmaz.
on:
  workflow_dispatch:
    inputs:
      langs:
        description: "Diller, virgülle (en,de,fr,it,es,nl,pt)"
        required: false
        default: "en"
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          LANGS: ${{ github.event.inputs.langs }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: LANGS
          script: |
            T="$HOME/vestra_tmp/deals-preview-${GITHUB_RUN_ID:-x}.php"; mkdir -p "$HOME/vestra_tmp"
            cat > "$T" <<'PHPEOF'
            <?php
            ini_set('display_errors', 'stderr'); error_reporting(E_ALL & ~E_NOTICE);
            chdir(getenv('HOME').'/public_html');
            require 'inc/products.php'; require_once 'inc/notify.php'; require_once 'inc/campaign_deals.php';
            $pick = vestra_deals_pick();
            echo "uygun indirimli ilan: {$pick['count']} · en yuksek: -{$pick['max']}%\n";
            foreach ($pick['items'] as $p) printf("  %s %-14s %-40s -%d%% · canli foto %d\n", !empty($p['featured']) ? '*' : ' ', $p['label'], mb_substr($p['name'], 0, 40), $p['pct'], count($p['live'] ?? []));
            $to = (string)vestra_cfg('ops_email', 'acerasoft@gmail.com'); $rc = 0;
            foreach (array_filter(array_map('trim', explode(',', (string)getenv('LANGS')))) as $lg) {
              [$s, $b, $o] = vestra_campaign_deals('Boutique Example', $lg, $pick);
              if ($s === '') { echo "[$lg] bos mektup\n"; $rc = 1; continue; }
              $ok = vestra_send_mail($to, '[ONIZLEME '.strtoupper($lg).'] '.$s, $b, 'support@vestrasales.com', 'VESTRA', null, '', $o);
              echo "[$lg] konu: $s -> ".($ok ? 'operator kutusuna gonderildi' : 'GONDERILEMEDI')."\n"; if (!$ok) $rc = 1;
            }
            exit($rc);
            PHPEOF
            php "$T"; rc=$?; rm -f "$T"; exit $rc
