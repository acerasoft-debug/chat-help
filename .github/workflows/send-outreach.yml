name: (Lead) Kampanya e-postası gönder (gerçek — Les Garage de Paris)

# Elle tetiklenir. Listedeki UYGUN prospect'lere premium logo-duvarlı kampanyayı
# gönderir (builder: inc/notify.php · vestra_campaign_preview). Dil MÜŞTERİNİN
# ÜLKESİNE göre otomatik seçilir (Hollanda→nl, Fransa→fr, İtalya→it, Portekiz→pt,
# Çekya→cs, Polonya→pl, İspanya→es, Yunanistan→el), listede olmayan her ülke → İngilizce (en).
#
# Uygunluk kuralları (hepsi sağlanmalı):
#   • geçerli e-posta var
#   • unsubscribed DEĞİL
#   • daha önce HİÇ gönderilmemiş (last_contacted_at boş)  → aynı alıcıya asla iki kez
#   • blocklist'te DEĞİL (büyük zincir / tek-marka flagship)
# Her gönderilen lead: status=contacted + last_contacted_at damgalanır ve nota işlenir
# ("belli olması" için). Her e-postaya kişiye özel tek-tık unsubscribe linki (token) gömülür.
#
# dry_run=true (VARSAYILAN): hiçbir e-posta GÖNDERMEZ — sadece seçilecek alıcıları
# (firma / ülke / dil) listeler. Gerçekten göndermek için dry_run=false ver.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "Kaç prospect'e gönderilsin (uygun olanların ilk N'i)"
        required: false
        default: "10"
      dry_run:
        description: "Deneme (gönderme yok, sadece listele) — gerçek gönderim için 'false' yaz"
        required: false
        default: "true"
      skip_emails:
        description: "Atlanacak e-posta(lar) — virgül/boşlukla ayrılabilir (bu adreslere gönderilmez)"
        required: false
        default: ""
      premium_only:
        description: "Sadece premium marka satan leadlere gönder (true/false)"
        required: false
        default: "false"
      min_brands:
        # premium_only tek bir marka eslesmesiyle yetiniyor; bu ise TEK MARKALI bir
        # bayiyi de gecirir. Operator "sadece karisik marka satanlar" dedigi icin
        # esik ayrilabilir hale getirildi: 2 = sitesinde EN AZ IKI ayri premium marka
        # gecen magazalar (gercek multi-brand), 0/1 = eski davranis.
        # VARSAYILAN 2. Onceden 0 idi ve bu, parametreyi vermeden calistirilan bir
        # gonderimin HICBIR marka filtresi uygulamamasina yol acti: kostum dukkanlarina,
        # rozet ureticisine ve bir Shopify sablon adresine (hi@mystore.com) kampanya
        # gitti. Guvenli varsayilan, operatorun asil kuralidir -- "sadece karisik marka
        # satanlar". Eski davranis hala mumkun ama artik ACIKCA 0 yazmak gerekiyor.
        description: "Multi-brand esigi: sitesinde en az kac AYRI premium marka gecsin (2 = sadece karisik marka satanlar, VARSAYILAN)"
        required: false
        default: "2"
      only_emails:
        description: "Sadece bu e-posta(lar)a gönder (allowlist; virgül/boşlukla ayrılır). Boşsa normal seçim."
        required: false
        default: ""
      country_filter:
        description: "Sadece bu ülke(ler)deki leadlere gönder (virgülle ayrılabilir). Boşsa tüm ülkeler."
        required: false
        default: ""
      exclude_countries:
        description: "Bu ülke(ler)e GÖNDERME (virgülle ayrılabilir). Leadler listede kalır, sadece gönderim dışı tutulur."
        required: false
        default: ""
      force_lang:
        description: "Ülkeye bakmadan TÜM bu gönderimi bu dilde yolla (en/de/fr/it/es/nl/pt/cs/pl/el). Boşsa ülkeye göre otomatik."
        required: false
        default: ""
      skip_email_regex:
        description: "Bu regex'e uyan e-postaları atla (PCRE, örn. '/^mizzo@/') — garbled/scraper adresleri byte'larını bilmeden dışlamak için."
        required: false
        default: ""
      pool_mode:
        description: "true = mektuba ACIK HAVUZLAR bolumu eklenir (fiyat/min/kapora/son tarih canli veriden okunur) ve dugme /groups'a gider. Varsayilan kapali."
        required: false
        default: "false"
      name_any:
        description: "Sadece firma ADINDA bu parcalardan biri gecen leadlere gonder (virgulle ayrilir, or. 'outlet, factory store, stock'). Bos = ad filtresi yok. DIKKAT: yaklasik bir olcut -- adinda yazmayan outlet kacar."
        required: false
        default: ""
      skip_names:
        description: "Firma ADINDA bu parcalardan biri gecen leadlere GONDERME (virgulle ayrilir, or. 'h&m, zara, c&a'). Zincirleri elemek icin."
        required: false
        default: ""
      skip_categories:
        description: "Bu kategori parçalarını içeren leadlere GÖNDERME (virgülle ayrılır, ör. 'jewelry, watches, tailor'). Kategori OSM dükkân tipinden gelir: 'Retailer (jewelry)'."
        required: false
        default: ""
      followup_emails:
        description: "TAKIP KIPI: bu adres(ler)e kampanyayi DEGIL, kisa bir 'ulasti mi' takip mektubunu gonderir (virgul/bosluk ile ayrilir). Sadece daha once yazilmis, cevap vermemis leadler icin. Doluysa normal secim hic calismaz."
        required: false
        default: ""
      dns_check:
        description: "true (varsayılan) = seçim sırasında alan adının MX/A kaydına bak, posta alamayan adresi HİÇ seçme. Böylece istenen N adet gerçekten ulaşabilecek N adres olur. false = kontrolsüz."
        required: false
        default: "true"
      reset_contacted:
        description: "BAKIM: gönderim YAPMAZ. Sadece bu e-posta(lar)ın last_contacted_at damgasını temizler (virgül/boşlukla ayrılır) — ör. yanlış dilde gitmiş bir adrese kasıtlı düzeltme göndermeden önce. Doluysa bu çalıştırma SADECE bunu yapar ve çıkar."
        required: false
        default: ""
      category_any:
        description: "SADECE kategorisinde bu parcalardan biri gecen leadlere gonder (virgulle ayrilir, or. 'Amazon Seller'). skip_categories'in tersi. Bos = kategori suzgeci yok."
        required: false
        default: ""
      email_regex:
        description: "SADECE bu regex'e UYAN adreslere gonder (skip_email_regex'in tersi, PCRE). Or. '/amazon/i' = adresinde amazon gecen leadler (bir magazanin Amazon kanali adresi). Bos = adres suzgeci yok."
        required: false
        default: ""
      quota_reserve:
        description: "Gunluk kotadan islemsel posta (sifre sifirlama/siparis) icin AYRILAN pay. Varsayilan 60. Dusurmek o gece islemsel postayi riske atar -- sadece operator acikca isteyince degistir."
        required: false
        default: "60"
      to_members:
        description: "KAYITLI MUSTERI KIPI (true): Winter 26/27 duyurusunu LEAD'lere degil, KAYITLI ALICI hesaplarina gonderir (uyeye uygun mektup: 'daha once yazmistik' yok, kayit linki yok). Hesap basina bir kez (newcoll_2627_at). Doluysa lead secimi hic calismaz. dry_run ayni sekilde gecerli."
        required: false
        default: "false"
      new_collection:
        description: "YENİ KOLEKSİYON KİPİ (true): kampanyayı DAHA ÖNCE ALMIŞ leadlere Winter 26/27 duyurusunu gönderir (Gallery Dept. / Fred Perry / AMI Paris). Normal kip hiç yazılmamışlara gider; bu kip tam tersini seçer. Aynı lead bu duyuruyu iki kez almaz (last_newcollection_at). Abonelikten çıkmışlar ve blocklist yine hariç."
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Kampanyayı gönder (ya da dry-run listele)
        uses: appleboy/ssh-action@v1.0.3
        env:
          SEND_COUNT: ${{ github.event.inputs.count }}
          SEND_DRY: ${{ github.event.inputs.dry_run }}
          SEND_SKIP: ${{ github.event.inputs.skip_emails }}
          SEND_PREMIUM: ${{ github.event.inputs.premium_only }}
          SEND_MIN_BRANDS: ${{ github.event.inputs.min_brands }}
          SEND_ONLY: ${{ github.event.inputs.only_emails }}
          SEND_COUNTRY: ${{ github.event.inputs.country_filter }}
          SEND_NOT_COUNTRY: ${{ github.event.inputs.exclude_countries }}
          SEND_FORCE_LANG: ${{ github.event.inputs.force_lang }}
          SEND_SKIP_RE: ${{ github.event.inputs.skip_email_regex }}
          SEND_SKIP_CAT: ${{ github.event.inputs.skip_categories }}
          SEND_POOLS: ${{ github.event.inputs.pool_mode }}
          SEND_NAME_ANY: ${{ github.event.inputs.name_any }}
          SEND_SKIP_NAME: ${{ github.event.inputs.skip_names }}
          SEND_RESET: ${{ github.event.inputs.reset_contacted }}
          SEND_DNS: ${{ github.event.inputs.dns_check }}
          SEND_FOLLOWUP: ${{ github.event.inputs.followup_emails }}
          SEND_NEWCOLL: ${{ github.event.inputs.new_collection }}
          SEND_MEMBERS: ${{ github.event.inputs.to_members }}
          SEND_RESERVE: ${{ github.event.inputs.quota_reserve }}
          SEND_ONLY_RE: ${{ github.event.inputs.email_regex }}
          SEND_CAT_ANY: ${{ github.event.inputs.category_any }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 8m
          envs: SEND_COUNT,SEND_DRY,SEND_SKIP,SEND_PREMIUM,SEND_MIN_BRANDS,SEND_ONLY,SEND_COUNTRY,SEND_NOT_COUNTRY,SEND_FORCE_LANG,SEND_SKIP_RE,SEND_SKIP_CAT,SEND_POOLS,SEND_NAME_ANY,SEND_SKIP_NAME,SEND_RESET,SEND_DNS,SEND_FOLLOWUP,SEND_NEWCOLL,SEND_ONLY_RE,SEND_CAT_ANY,SEND_MEMBERS,SEND_RESERVE
          script: |
            cat > /tmp/vestra_send_outreach.php <<'PHPEOF'
            <?php
            @set_time_limit(0);
            $home = getenv("HOME");
            require $home."/public_html/inc/notify.php";
            require $home."/public_html/inc/products.php";
            require $home."/public_html/inc/leads.php";

            $DRY = strtolower(trim((string)getenv("SEND_DRY"))) !== 'false'; // send ONLY when explicitly false
            $COUNT = (int)(getenv("SEND_COUNT") ?: 10);
            if ($COUNT < 1) $COUNT = 1;
            // Hard cap of 50 applies to REAL sends only — it exists so one accidental run can
            // never blast the whole list. A dry-run sends nothing, and truncating it at 50 hid
            // the rest of the queue: screening decisions need the whole list, not its head.
            if (!$DRY && $COUNT > 50) $COUNT = 50;
            /* Islemsel posta payi. 60 tasarim geregi: kampanya ile sifre
               sifirlama ayni havuzdan iciyor ve kampanya hep once geliyor.
               Operator "bugun doldur" dediginde bilerek dusurulebilir --
               varsayilani degistirme. */
            $RESERVE = trim((string)getenv("SEND_RESERVE"));
            $RESERVE = ($RESERVE === '' ? 60 : max(0, (int)$RESERVE));
            $FROM = 'Les Garage de Paris';
            // Country -> campaign language. Falls back to English for anything not listed.
            $LANG_MAP = [
              'netherlands'=>'nl','the netherlands'=>'nl','nederland'=>'nl','holland'=>'nl',
              'france'=>'fr',
              'italy'=>'it','italia'=>'it',
              'portugal'=>'pt',
              'czech republic'=>'cs','czechia'=>'cs','česko'=>'cs','cesko'=>'cs',
              'poland'=>'pl','polska'=>'pl',
              'spain'=>'es','españa'=>'es','espana'=>'es',
              'greece'=>'el','ελλάδα'=>'el','ellada'=>'el',
              'germany'=>'de','deutschland'=>'de','austria'=>'de','österreich'=>'de','osterreich'=>'de',
              'russia'=>'ru','russian federation'=>'ru','россия'=>'ru',
              'japan'=>'ja','日本'=>'ja',
              'south korea'=>'ko','korea'=>'ko','republic of korea'=>'ko','대한민국'=>'ko',
              'azerbaijan'=>'az','azərbaycan'=>'az',
            ];
            // Multilingual countries: one country, several languages, so the COUNTRY alone can't
            // decide. Lead rows carry no city field (vestra_leads_add drops it) — the city survives
            // inside notes via the OSM address, so match city names there and fall back to the
            // country's majority language when the address doesn't name a known city.
            //
            // Switzerland and Luxembourg are deliberately NOT here: English is the agreed
            // language for both (widely used in business there), so they fall through to the
            // LANG_MAP miss below and get 'en'.
            $REGION_LANG = [
              'belgium' => ['default'=>'nl','match'=>[
                'fr'=>['bruxelles','brussels','brussel','liège','liege','namur','charleroi','mons','tournai','arlon','wavre','verviers'],
              ]],
            ];
            $FLAG_LABELS = ['nl'=>'NL/Flemenkce','fr'=>'FR/Fransizca','de'=>'DE/Almanca','it'=>'IT/Italyanca','pt'=>'PT/Portekizce','cs'=>'CS/Cekce','pl'=>'PL/Lehce','es'=>'ES/Ispanyolca','el'=>'EL/Yunanca','en'=>'EN/Ingilizce','ru'=>'RU/Rusca','ja'=>'JA/Japonca','ko'=>'KO/Korece','az'=>'AZ/Azerice'];
            $SKIP = [];
            foreach (preg_split('/[\s,;]+/', (string)getenv("SEND_SKIP"), -1, PREG_SPLIT_NO_EMPTY) as $s) { $SKIP[strtolower(trim($s))] = true; }
            $PREMIUM = strtolower(trim((string)getenv("SEND_PREMIUM"))) === 'true';
            $MIN_BRANDS = (int)trim((string)getenv('SEND_MIN_BRANDS'));
            $ONLY = [];
            foreach (preg_split('/[\s,;]+/', (string)getenv("SEND_ONLY"), -1, PREG_SPLIT_NO_EMPTY) as $s) { $ONLY[strtolower(trim($s))] = true; }
            $COUNTRIES = [];
            foreach (explode(',', (string)getenv("SEND_COUNTRY")) as $s) { $s = strtolower(trim($s)); if ($s !== '') $COUNTRIES[$s] = true; }
            $NOT_COUNTRIES = [];
            foreach (explode(',', (string)getenv("SEND_NOT_COUNTRY")) as $s) { $s = strtolower(trim($s)); if ($s !== '') $NOT_COUNTRIES[$s] = true; }
            $FORCE_LANG = strtolower(trim((string)getenv("SEND_FORCE_LANG")));
            if ($FORCE_LANG !== '' && !in_array($FORCE_LANG, ['en','de','fr','it','es','nl','pt','cs','pl','el','ru','ja','ko','az'], true)) {
              echo "HATA: force_lang gecersiz: {$FORCE_LANG} (izinli: en,de,fr,it,es,nl,pt,cs,pl,el,ru,ja,ko,az)\n"; exit(1);
            }
            $SKIP_RE = trim((string)getenv("SEND_SKIP_RE"));
            if ($SKIP_RE !== '' && @preg_match($SKIP_RE, '') === false) { echo "HATA: skip_email_regex gecersiz PCRE deseni: {$SKIP_RE}\n"; exit(1); }
            /* skip_email_regex'in AYNASI: o eliyor, bu sadece birakiyor. Desen bozuksa
               calistirmayi durduruyoruz -- gecersiz bir desen preg_match'te false
               dondurur ve "hicbiri uymadi" ile "desen bozuk" ayirt edilemez hale
               gelirdi; sessizce bos bir partiye donusurdu. */
            $ONLY_RE = trim((string)getenv("SEND_ONLY_RE"));
            if ($ONLY_RE !== '' && @preg_match($ONLY_RE, '') === false) { echo "HATA: email_regex gecersiz PCRE deseni: {$ONLY_RE}\n"; exit(1); }
            // Category exclusion. Discovery stores the OSM shop tag verbatim as
            // "Retailer (jewelry)" / "Retailer (watches)" / "Retailer (tailor)", so the shop's
            // actual TYPE is on the record — far more reliable than guessing trade from the
            // company name ("Trancanelli", "Bel Arte" and "Yanis 1965" are all jewellers).
            // Matched as a case-insensitive substring, so "jewelry" catches "Retailer (jewelry)".
            /* skip_categories'in aynasi: o eliyor, bu sadece birakiyor. Kategori
               OSM dukkan tipinden ya da elle eklenirken yazilandan geliyor
               ("Amazon Seller" gibi), yani belirli bir kanali hedeflemenin tek
               dogru yolu bu -- adres deseni sadece adresinde 'amazon' gecen
               birkac leadi buluyor, kategorinin tamamini degil. */
            $CAT_ANY = [];
            foreach (preg_split('/[,;]+/', (string)getenv("SEND_CAT_ANY"), -1, PREG_SPLIT_NO_EMPTY) as $c2) {
              $c2 = strtolower(trim($c2)); if ($c2 !== '') $CAT_ANY[] = $c2;
            }
            $SKIP_CAT = [];
            foreach (explode(',', (string)getenv("SEND_SKIP_CAT")) as $s) { $s = strtolower(trim($s)); if ($s !== '') $SKIP_CAT[] = $s; }
            /* Havuz bolumu SADECE acikca istendiginde ekleniyor -- varsayilan kapali,
               boylece siradan bir gonderim yanlislikla havuz reklamina donusmez. */
            $POOLS = strtolower(trim((string)getenv("SEND_POOLS"))) === 'true';
            $NAME_ANY = []; $SKIP_NAME = [];
            foreach (explode(',', (string)getenv("SEND_NAME_ANY"))  as $s) { $s = strtolower(trim($s)); if ($s !== '') $NAME_ANY[]  = $s; }
            foreach (explode(',', (string)getenv("SEND_SKIP_NAME")) as $s) { $s = strtolower(trim($s)); if ($s !== '') $SKIP_NAME[] = $s; }

            $leads = vestra_leads();

            // BAKIM MODU: sadece damga temizler, HICBIR SEY GONDERMEZ, hemen cikar. Yanlis
            // dilde gitmis bir adrese kasitli duzeltme gondermeden once last_contacted_at'i
            // sifirlamak icin -- normal gonderim mantigina hic girmez, bu yuzden bir SSH
            // collision sonrasi bu adimin kor kor tekrarlanmasi bile ikinci bir e-posta
            // GONDERMEZ (sadece damgayi tekrar temizler, zaten temizse fark etmez).
            $RESET = [];
            foreach (preg_split('/[\s,;]+/', (string)getenv("SEND_RESET"), -1, PREG_SPLIT_NO_EMPTY) as $s) {
              $s = strtolower(trim($s)); if ($s !== '') $RESET[$s] = true;
            }
            if ($RESET) {
              $touched = 0; $notFound = array_keys($RESET);
              foreach ($leads as $i => $l) {
                $e = strtolower(trim((string)($l['email'] ?? '')));
                if (!isset($RESET[$e])) continue;
                $notFound = array_diff($notFound, [$e]);
                if (($leads[$i]['last_contacted_at'] ?? '') === '') { echo "  - zaten temiz: {$e}\n"; continue; }
                $leads[$i]['last_contacted_at'] = '';
                $note = trim((string)($leads[$i]['notes'] ?? ''));
                $leads[$i]['notes'] = trim($note . ($note !== '' ? ' · ' : '') . 'reset-for-lang-correction ' . date('Y-m-d'));
                $touched++;
                echo "  + damga temizlendi: {$e}\n";
              }
              if ($touched > 0) vestra_save_leads($leads);
              foreach ($notFound as $nf) echo "  ! bulunamadi (lead listesinde yok): {$nf}\n";
              echo "\nBAKIM BITTI. temizlenen: {$touched} / istenen: " . count($RESET) . " -- gonderim YAPILMADI.\n";
              exit(0);
            }

            // Every e-mail already contacted (across ALL lead records) — so an address is never
            // emailed a second time even if it somehow appears on two lead rows.
            $contacted = [];
            foreach ($leads as $l) {
              if (($l['last_contacted_at'] ?? '') !== '') {
                $e = strtolower(trim((string)($l['email'] ?? ''))); if ($e !== '') $contacted[$e] = true;
              }
            }

            // Select eligible leads (first COUNT), de-duped by e-mail within the batch too.
            $picked = []; $seen = [];
            $DNS_CHECK = strtolower(trim((string)getenv('SEND_DNS'))) !== 'false';
            $dnsSeen = []; $dnsDead = 0;

            /* TAKIP KIPI. Kampanyanin ikinci kopyasi degil, kisa bir "ulasti mi" notu:
               ayni mektubu tekrar yollamak posta listesi gibi okunuyor, kisa bir soru
               ise insan gibi okunuyor -- ve durustcesi de bu, cunku ilkinin gorulup
               gorulmedigini bilmiyoruz.
               Normal secimi tamamen devre disi birakiyor: takip, "hic yazilmamislar"
               havuzunun tam TERSI bir kume uzerinde calisiyor. */
            $FOLLOWUP = [];
            foreach (preg_split('/[\s,;]+/', (string)getenv("SEND_FOLLOWUP"), -1, PREG_SPLIT_NO_EMPTY) as $s2) {
              $s2 = strtolower(trim($s2)); if ($s2 !== '') $FOLLOWUP[$s2] = true;
            }
            $IS_FOLLOWUP = (bool)$FOLLOWUP;
            /* YENI KOLEKSIYON KIPI. Takip kipiyle ayni mantik -- "hic yazilmamislar"
               havuzunun TERSI -- ama adres adres degil, TOPLU: kampanyayi almis herkes
               aday. Bu yuzden asagidaki ana dongude calisiyor, sadece iki kosul terse
               donuyor (yazilmis OLMALI, bu duyuruyu almamis olmali).
               Ayri damga (last_newcollection_at): last_contacted_at'e dokunmuyoruz,
               yoksa bir sonraki normal parti bu leadleri yeniden "hic yazilmamis"
               saymaz ama takip kipinin damgasiyla da karisirdi. Her duyuru kendi
               damgasini tasirsa ayni kisiye ayni duyuru iki kez gitmiyor. */
            $IS_NEWCOLL = strtolower(trim((string)getenv('SEND_NEWCOLL'))) === 'true';
            if ($IS_NEWCOLL) require_once $home."/public_html/inc/email_templates.php";

            /* ── KAYITLI MUSTERI KIPI ────────────────────────────────────────
               Duyuru once KAYITLI alicilara, sonra lead'lere gidiyor (operatorun
               sirasi). Lead mektubu uyelere YANLIS: "size daha once yazmistik"
               diye aciliyor ve kayit linkine cagiriyor. Bu dal kendi mektubunu
               (vestra_tpl_new_collection_member) kullanir ve isini bitirip cikar
               -- lead makinesiyle hicbir durumu paylasmaz.
               Damga hesabin uzerinde (newcoll_2627_at): ayni hesaba ikinci kez
               gitmez. Ayni adres leads.json'da da varsa ORADAKI kayit da
               damgalanir; yoksa lead kipi ayni kisiye bir de soguk-uslupta
               yazardi -- iki farkli agizdan ayni haber, mail-merge kazasi gibi
               okunur. */
            $IS_MEMBERS = strtolower(trim((string)getenv('SEND_MEMBERS'))) === 'true';
            if ($IS_MEMBERS) {
              require_once $home."/public_html/inc/email_templates.php";
              require_once $home."/public_html/inc/auth.php";        // auth_accounts / auth_save_accounts
              /* i18n.php BILEREK yuklenmiyor: include aninda vlang() kosuyor
                 (cerez okur/yazar) -- CLI'da gereksiz yan etki. Hesabin lang
                 alani zaten 2 harf; bilinmeyen kodu sablonun kendi 'en'
                 yedegi karsiliyor. */
              $accLang = function(array $a): string {
                $l = strtolower(substr((string)($a['lang'] ?? ''), 0, 2));
                return preg_match('/^[a-z]{2}$/', $l) ? $l : 'en';
              };
              $accts = auth_accounts();
              $cand = []; $skipped = 0;
              foreach ($accts as $i => $a) {
                if (($a['type'] ?? '') !== 'buyer') continue;                    // musteri = alici; saticilara stok duyurusu anlamsiz
                $st = (string)($a['status'] ?? '');
                if (in_array($st, ['suspended','deleted','pending_email'], true)) continue; // dogrulanmamis adrese posta atilmaz
                $em = strtolower(trim((string)($a['email'] ?? '')));
                if (!filter_var($em, FILTER_VALIDATE_EMAIL)) continue;
                if (!empty($a['newcoll_2627_at'])) continue;                     // bu duyuruyu zaten aldi
                /* KURAL 1 kayitli musteride de kontrol ediliyor ama SESSIZCE
                   elemiyor: eslesme varsa atlanir VE yazilir. Onayli bir musteri
                   yanlis yakalanirsa operator logda gorur. */
                if (vestra_lead_is_blocked(['company'=>(string)($a['company'] ?? ''), 'email'=>$em, 'website'=>(string)($a['website'] ?? '')])) {
                  echo "  - ATLANDI (KURAL: zincir/kendi markasi eslesmesi): {$em}\n"; $skipped++; continue;
                }
                $cand[] = $i;
                if (count($cand) >= $COUNT) break;
              }
              $MODE_LABEL = 'YENI KOLEKSIYON — KAYITLI MUSTERILER';
              echo $DRY ? "== DRY-RUN ({$MODE_LABEL}) — gonderim YOK ==\n" : "== GERCEK GONDERIM — {$MODE_LABEL} ==\n";
              echo "uygun secilen: ".count($cand)." / hedef: {$COUNT}".($skipped?" (kural geregi atlanan: {$skipped})":"")."\n";
              if ($DRY) {
                foreach ($cand as $i) { $a = $accts[$i];
                  echo "  • ".(($a['company'] ?? '') ?: ($a['name'] ?? '?'))." <".$a['email']."> | dil=".$accLang($a)." | durum=".($a['status'] ?? '-')."\n";
                }
                echo "DRY-RUN bitti. Gercekten gondermek icin dry_run=false ile tekrar calistir.\n";
                exit(0);
              }
              if ($cand) {
                [$mayGo, $why] = vestra_mail_bulk_allowed(count($cand), $RESERVE);
                echo "kota  : {$why}\n";
                if (!$mayGo) exit(0);
              }
              /* Dogru ad vestra_leads(): ilk surum yanlis adla (load_leads)
                 cagirdi, PHP fatal verdi ve is YESIL kaldi (asagidaki rm cikis
                 kodunu eziyordu) -- 39 uyelik "basarili" kosuda 0 mail gitti. */
              $leads2 = vestra_leads(); $idx2 = [];
              foreach ($leads2 as $j => $l2) { $e2 = strtolower(trim((string)($l2['email'] ?? ''))); if ($e2 !== '') $idx2[$e2] = $j; }
              $sent = 0; $fail = 0; $leadsTouched = false;
              foreach ($cand as $i) {
                $a = $accts[$i];
                $lang = $accLang($a);
                $who  = (string)(($a['company'] ?? '') ?: ($a['name'] ?? ''));
                [$subject, $body, $opts] = vestra_tpl_new_collection_member($lang, $who);
                /* Gonderen VESTRA: uye platformu bu adla taniyor; kampanya takma
                   adi (Les Garage de Paris) soguk listeye ait. */
                $ok = vestra_send_mail((string)$a['email'], $subject, $body, '', 'VESTRA', null, '', $opts);
                if ($ok) {
                  $sent++;
                  $accts[$i]['newcoll_2627_at'] = date('c');
                  $em = strtolower(trim((string)$a['email']));
                  if (isset($idx2[$em]) && trim((string)($leads2[$idx2[$em]]['last_newcollection_at'] ?? '')) === '') {
                    $leads2[$idx2[$em]]['last_newcollection_at'] = date('c');
                    $n2 = trim((string)($leads2[$idx2[$em]]['notes'] ?? ''));
                    $leads2[$idx2[$em]]['notes'] = trim($n2.($n2!==''?' · ':'').'winter2627-member('.$lang.') '.date('Y-m-d'));
                    $leadsTouched = true;
                  }
                  echo "  + GONDERILDI: {$who} <{$a['email']}> | dil={$lang}\n";
                } else { $fail++; echo "  x HATA      : {$a['email']}\n"; }
                flush();
              }
              if ($sent > 0) auth_save_accounts($accts);
              if ($leadsTouched) vestra_save_leads($leads2);
              echo "BITTI. gonderildi: {$sent}, hata: {$fail}. kayitli hesap: ".count($accts)."\n";
              exit(0);
            }
            if ($IS_FOLLOWUP) {
              require_once $home."/public_html/inc/email_templates.php";
              $missing = $FOLLOWUP;
              foreach ($leads as $l) {
                $email = strtolower(trim((string)($l['email'] ?? '')));
                if ($email === '' || !isset($FOLLOWUP[$email])) continue;
                unset($missing[$email]);
                if (!filter_var($email, FILTER_VALIDATE_EMAIL)) { echo "  - ATLANDI (gecersiz adres): {$email}\n"; continue; }
                if (($l['status'] ?? '') === 'unsubscribed' || !empty($l['unsubscribed'])) { echo "  - ATLANDI (abonelikten cikmis): {$email}\n"; continue; }
                /* Hic yazilmamis birine "gecen mektubumuz ulasti mi" demek, olmayan bir
                   mektuba atifta bulunmak olur. */
                if (trim((string)($l['last_contacted_at'] ?? '')) === '') { echo "  - ATLANDI (ilk mektup hic gitmemis): {$email}\n"; continue; }
                /* Ayni takibi iki kez gondermemek icin: bu alan takip gonderildiginde
                   damgalaniyor, last_contacted_at ise DOKUNULMUYOR -- ilk temasin
                   tarihi kaydin kendi tarihi ve degistirilmemeli. */
                if (trim((string)($l['last_followup_at'] ?? '')) !== '') { echo "  - ATLANDI (takip zaten gonderilmis): {$email}\n"; continue; }
                if (isset($seen[$email])) continue;
                if ($DNS_CHECK) {
                  $dom = substr(strrchr($email, '@'), 1);
                  if (!isset($dnsSeen[$dom])) $dnsSeen[$dom] = (checkdnsrr($dom, 'MX') || checkdnsrr($dom, 'A'));
                  if (!$dnsSeen[$dom]) { echo "  - ATLANDI (alan adi posta alamiyor): {$email}\n"; $dnsDead++; continue; }
                }
                $seen[$email] = true;
                $picked[] = $l;
              }
              foreach (array_keys($missing) as $m) echo "  ! LEAD LISTESINDE YOK: {$m}\n";
            }
            foreach ($IS_FOLLOWUP ? [] : $leads as $l) {
              $email = strtolower(trim((string)($l['email'] ?? '')));
              if (!filter_var($email, FILTER_VALIDATE_EMAIL)) continue;          // no / bad e-mail
              if (vestra_email_is_junk($email)) continue;                        // scraped artefact / placeholder / noreply — would hard-bounce
              if (isset($SKIP[$email])) continue;                                // explicitly excluded this run
              if ($SKIP_RE !== '' && preg_match($SKIP_RE, $email)) continue;      // regex-excluded (garbled/scraper addresses)
              if ($ONLY_RE !== '' && !preg_match($ONLY_RE, $email)) continue;     // regex-allowlist (or. sadece amazon@... kanal adresleri)
              if ($ONLY && !isset($ONLY[$email])) continue;                      // allowlist mode: only these addresses
              if (($l['status'] ?? '') === 'unsubscribed') continue;             // opted out
              if ($IS_NEWCOLL) {
                /* Tam tersi kosul: bu duyuru SADECE kampanyayi almis olanlara gider.
                   Hic yazilmamis birine "daha once yazmistik" diye baslayan bir mektup
                   yollamak, alicinin gozunde ya yalan ya karisiklik. */
                if (trim((string)($l['last_contacted_at'] ?? '')) === '') continue;
                if (trim((string)($l['last_newcollection_at'] ?? '')) !== '') continue;   // bu duyuruyu zaten aldi
                if (isset($seen[$email])) continue;                              // ayni adres iki kez secilmesin
              } else {
                if (($l['last_contacted_at'] ?? '') !== '') continue;            // already emailed once
                if (isset($contacted[$email]) || isset($seen[$email])) continue; // never the same address twice
              }
              // Big-chain / flagship safety net — skipped in allowlist mode: only_emails means the
              // operator named these exact addresses, so the name heuristic must not silently drop
              // them. It fires on substrings, and a hand-curated segment can legitimately contain a
              // blocked word (an Amazon SELLER named "Stilato amazon" is a target, not Amazon itself).
              /* Artik lead seviyesinde: ad + marka + ADRESIN ALAN ADI. Ad taramasi tek
                 basina yetmiyordu, cunku bot duvarina takilan sitede sirket adi diye
                 hata sayfasinin basligi kaydediliyor ve isim kontrolu bosa dusuyor. */
              if (!$ONLY && vestra_lead_is_blocked($l)) continue;
              if ($PREMIUM && empty($l['premium'])) continue;                    // premium-only mode: skip non-premium leads
              /* Multi-brand gate. premium_only passes a shop that mentions ONE designer
                 name, which a single-brand reseller or a label's own store also does. A
                 genuine multi-brand boutique carries several, so requiring N distinct
                 detected brands is what actually separates "stocks other people's labels"
                 from "sells its own". Off by default (0). */
              if ($MIN_BRANDS > 0 && count(array_filter((array)($l['premium_brands'] ?? []))) < $MIN_BRANDS) continue;
              if ($COUNTRIES && !isset($COUNTRIES[strtolower(trim((string)($l['country'] ?? '')))])) continue; // country filter
              if ($NOT_COUNTRIES && isset($NOT_COUNTRIES[strtolower(trim((string)($l['country'] ?? '')))])) continue; // excluded country — kept in the list, never mailed
              if ($CAT_ANY && !$ONLY) {          // sadece kategorisinde bunlardan biri gecenler
                $catL2 = strtolower((string)($l['category'] ?? ''));
                $hit2 = false;
                foreach ($CAT_ANY as $c2) { if ($catL2 !== '' && str_contains($catL2, $c2)) { $hit2 = true; break; } }
                if (!$hit2) continue;
              }
              if ($SKIP_CAT && !$ONLY) {                                       // wrong trade (jeweller/watchmaker/tailor…) — apparel campaign doesn't apply
                $catL = strtolower((string)($l['category'] ?? ''));
                $bad = false;
                foreach ($SKIP_CAT as $c) { if ($catL !== '' && str_contains($catL, $c)) { $bad = true; break; } }
                if ($bad) continue;
              }
              /* Firma ADINA bakan iki filtre. Lead verisinde "outlet mu" ya da
                 "zincir mi" diye bir alan YOK -- OSM sadece dukkan tipini veriyor
                 (Retailer (clothes) gibi). Bu yuzden ada bakiyoruz, ki kusurlu bir
                 olcut: adinda yazmayan bir outlet kacar, adinda "outlet" gecen
                 bagimsiz bir dukkan outlet sayilir. Kesin degil, yaklasik. */
              $nameL = strtolower((string)($l['company'] ?? ''));
              if ($NAME_ANY && !$ONLY) {          // sadece adinda bunlardan biri gecenler
                $hit = false;
                foreach ($NAME_ANY as $n) { if ($n !== '' && str_contains($nameL, $n)) { $hit = true; break; } }
                if (!$hit) continue;
              }
              if ($SKIP_NAME && !$ONLY) {         // bilinen zincirler
                $bad = false;
                foreach ($SKIP_NAME as $n) { if ($n !== '' && str_contains($nameL, $n)) { $bad = true; break; } }
                if ($bad) continue;
              }
              /* Alan adi posta alabiliyor mu? Bu kontrol SECIM icinde duruyor, gonderim
                 dongusunde degil: operator "100 adrese gonder" dedigi zaman istedigi sey
                 100 aday degil, ulasabilecek 100 adres. Gonderim aninda elenseydi 100
                 secilir, 85'i giderdi. MX yoksa A kaydina bakiliyor -- bazi kucuk isletme
                 alan adlari postayi A kaydi uzerinden aliyor. Alan adi basina tek sorgu. */
              if ($DNS_CHECK) {
                $dom = substr(strrchr($email, '@'), 1);
                if (!isset($dnsSeen[$dom])) $dnsSeen[$dom] = (checkdnsrr($dom, 'MX') || checkdnsrr($dom, 'A'));
                if (!$dnsSeen[$dom]) { $dnsDead++; continue; }
              }
              $seen[$email] = true;
              $picked[] = $l;
              if (count($picked) >= $COUNT) break;
            }
            if ($DNS_CHECK) echo "DNS: posta alamayan alan adi yuzunden elenen aday: {$dnsDead}\n";

            $MODE_LABEL = $IS_FOLLOWUP ? 'TAKIP MEKTUBU' : ($IS_NEWCOLL ? 'YENI KOLEKSIYON — Winter 26/27' : 'Les Garage de Paris');
            echo $DRY ? "== DRY-RUN ({$MODE_LABEL}) — gonderim YOK, sadece secim listesi ==\n"
                      : "== GERCEK GONDERIM — {$MODE_LABEL} ==\n";
            /* Kota kapisi. Kampanya ile sifre sifirlama AYNI gunluk havuzdan iciyor ve
               kampanya once geldigi icin hep o kazaniyor. Havuz bitince sirada bekleyen
               kisi -- linkini bekleyen musteri -- cevapsiz kaliyor. Bir gun ertelenen
               kampanyanin bedeli yok; ulasmayan bir sifirlama linkinin bedeli hesabin
               kendisi. */
            if (!$DRY && $picked) {
              [$mayGo, $why] = vestra_mail_bulk_allowed(count($picked), $RESERVE);
              echo "kota  : {$why}\n";
              if (!$mayGo) { echo "\nDURDURULDU. Hicbir e-posta gonderilmedi.\n"; exit(0); }
            }
            echo "uygun secilen: " . count($picked) . " / hedef: {$COUNT}\n\n";

            // id -> index, so a successful send stamps the master array (not the picked copy).
            $idx = [];
            foreach ($leads as $i => $l) { $id = (string)($l['id'] ?? ''); if ($id !== '') $idx[$id] = $i; }

            $sent = 0; $fail = 0; $langCounts = []; $catCounts = [];
            foreach ($picked as $l) {
              $company = (string)($l['company'] ?? '');
              $email   = strtolower(trim((string)($l['email'] ?? '')));
              $country = (string)($l['country'] ?? '');
              $ckey    = strtolower(trim($country));
              if ($FORCE_LANG !== '') {
                // Explicit override for a curated batch (e.g. international marketplace sellers
                // who trade in English regardless of where they're registered). Beats faking the
                // lead's country, which would corrupt the record and mislead every later run.
                $lang = $FORCE_LANG;
              } elseif (isset($REGION_LANG[$ckey])) {
                $lang = $REGION_LANG[$ckey]['default'];
                $hay  = strtolower($company.' '.(string)($l['notes'] ?? '').' '.(string)($l['website'] ?? ''));
                foreach ($REGION_LANG[$ckey]['match'] as $lg => $needles) {
                  foreach ($needles as $nd) { if (str_contains($hay, $nd)) { $lang = $lg; break 2; } }
                }
              } else {
                $lang = $LANG_MAP[$ckey] ?? 'en';
              }
              $flag    = $FLAG_LABELS[$lang] ?? 'EN/Ingilizce';
              $langCounts[$lang] = ($langCounts[$lang] ?? 0) + 1;

              if ($DRY) {
                // Category is printed on every dry-run line: it's the field that decides whether
                // this recipient is even in the right trade, so screening needs it visible.
                $cat = trim((string)($l['category'] ?? ''));
                $catCounts[$cat !== '' ? $cat : '(kategorisiz)'] = ($catCounts[$cat !== '' ? $cat : '(kategorisiz)'] ?? 0) + 1;
                echo "  • {$company} <{$email}> | ulke=" . ($country ?: '-') . " | dil={$flag} | kat=" . ($cat !== '' ? $cat : '(bos)') . "\n";
                continue;
              }

              if ($IS_FOLLOWUP) {
                list($subject, $body, $opts) = vestra_tpl_lead_followup($lang, $company);
              } elseif ($IS_NEWCOLL) {
                list($subject, $body, $opts) = vestra_tpl_new_collection($lang, $company);
              } else {
                list($subject, $body, $opts) = vestra_campaign_preview($company, $lang, '', $POOLS);
              }
              // Compliance: swap the builder's generic opt-out link for THIS lead's tokenised
              // one-click unsubscribe, so the recipient can actually opt out of their own record.
              $token = (string)($l['unsub_token'] ?? '');
              if ($token !== '') {
                $body = str_replace(
                  'https://vestrasales.com/lead-unsubscribe',
                  'https://vestrasales.com/lead-unsubscribe?token=' . rawurlencode($token),
                  $body
                );
              }

              $ok = vestra_send_mail($email, $subject, $body, '', $FROM, null, '', $opts);
              if ($ok) {
                $sent++;
                $i = $idx[(string)($l['id'] ?? '')] ?? null;
                if ($i !== null) {
                  if ($IS_FOLLOWUP) {
                    $leads[$i]['last_followup_at'] = date('c');
                    $note = trim((string)($leads[$i]['notes'] ?? ''));
                    $leads[$i]['notes'] = trim($note . ($note !== '' ? ' · ' : '') . 'followup(' . $lang . ') ' . date('Y-m-d'));
                  } elseif ($IS_NEWCOLL) {
                    /* last_contacted_at'e DOKUNMUYORUZ: o damga "kampanyayi aldi mi"
                       sorusunun cevabi ve normal secim ona bakiyor. Duyuru kendi
                       damgasini tasiyor, boylece ayni kisiye iki kez gitmiyor. */
                    $leads[$i]['last_newcollection_at'] = date('c');
                    $note = trim((string)($leads[$i]['notes'] ?? ''));
                    $leads[$i]['notes'] = trim($note . ($note !== '' ? ' · ' : '') . 'winter2627(' . $lang . ') ' . date('Y-m-d'));
                  } else {
                    if (($leads[$i]['status'] ?? 'new') === 'new') $leads[$i]['status'] = 'contacted';
                    $leads[$i]['last_contacted_at'] = date('c');
                    $leads[$i]['last_campaign'] = 'les-garage/' . $lang;
                    $note = trim((string)($leads[$i]['notes'] ?? ''));
                    $leads[$i]['notes'] = trim($note . ($note !== '' ? ' · ' : '') . 'campaign(' . $lang . ') ' . date('Y-m-d'));
                  }
                }
                echo "  + GONDERILDI: {$company} <{$email}> | dil={$flag}\n";
              } else {
                $fail++;
                echo "  x HATA (gonderilemedi): {$company} <{$email}> | dil={$flag}\n";
              }
            }

            if (!$DRY && $sent > 0) vestra_save_leads($leads);

            echo "\n----\n";
            echo "dil dagilimi (secilen): ";
            foreach ($langCounts as $lc => $cnt) echo "{$lc}={$cnt}  ";
            echo "\n";
            if ($DRY && $catCounts) {
              arsort($catCounts);
              echo "kategori dagilimi (secilen):\n";
              foreach ($catCounts as $cc => $cnt) echo "  {$cc}: {$cnt}\n";
            }
            if ($DRY) {
              echo "DRY-RUN bitti. Gercekten gondermek icin dry_run=false ile tekrar calistir.\n";
            } else {
              echo "BITTI. gonderildi: {$sent}, hata: {$fail}. toplam lead: " . count($leads) . "\n";
            }
            PHPEOF
            # Cikis kodu ONCE yakalanir: `php; rm` sirali halinde rm'nin sifiri
            # PHP fatal'ini ortuyordu -- uye kipinin ilk kosusu tam boyle "yesil"
            # bitti. inspect-products ayni tuzagi zaten boyle cozmustu.
            php /tmp/vestra_send_outreach.php; RC=$?
            rm -f /tmp/vestra_send_outreach.php
            exit $RC
