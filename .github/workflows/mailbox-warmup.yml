name: (Posta kutusu) Isınmayı aç/kapat — günlük tavan
# 14 Eki 2026 (operatör: "kendi server'dan 500 e-mail günlük"). Isınma (inc/mailbox.php VESTRA_MAILBOX_WARMUP) yeni
# gönderen adresi için günlük sayıyı kademeli artırıyordu (14 Eki = 7. gün = 300). warmup=false → bugünden itibaren tam
# tavan (500). (Girdinin adı 'on' OLAMAZ: YAML 1.1'de 'on' = true, GitHub girdiyi tanımıyor.) Geri dönme freni (son 3 günde %8) AYNEN kalır. Panelden de değiştirilebilir (Admin ▸ 📮 ▸ ayarlar).
on:
  workflow_dispatch:
    inputs:
      warmup:
        description: "true = ısınma açık (kademeli) · false = kapalı (tam tavan)"
        required: false
        default: "false"
permissions:
  contents: read
jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Ayarla
        uses: appleboy/ssh-action@v1.0.3
        env:
          WON: ${{ github.event.inputs.warmup }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: WON
          command_timeout: 2m
          script: |
            cd ~/public_html
            cat > /tmp/vestra_wu.php <<'PHPEOF'
            <?php
            $home = getenv("HOME");
            require      $home."/public_html/inc/products.php";
            require_once $home."/public_html/inc/mailbox.php";
            $on = strtolower(trim((string)getenv('WON'))) === 'true';
            $w = vestra_mailbox_warmup();
            echo "ONCE: isinma ".($w['on'] ? 'acik' : 'kapali')." · gun ".$w['day']." · bugunku tavan ".vestra_mailbox_cap_today()." · bugun gonderilen ".vestra_mailbox_sent_today()." · panel tavani ".vestra_mailbox_daily_cap()."\n";
            vestra_mailbox_warmup_set($on);
            $w = vestra_mailbox_warmup();
            $bs = vestra_mailbox_bounce_stats();
            echo "SONRA: isinma ".($w['on'] ? 'acik' : 'kapali')." · bugunku tavan ".vestra_mailbox_cap_today()." · bugun kalan ".vestra_mailbox_left_today()."\n";
            printf("geri donme freni: son %d gun %d/%d (%%%.1f) · fren %s\n", VESTRA_MAILBOX_BOUNCE_DAYS, $bs['bounced'], $bs['sent'], $bs['rate'] * 100, $bs['stop'] ? 'DEVREDE' : 'yok');
            PHPEOF
            php /tmp/vestra_wu.php 2>&1; rm -f /tmp/vestra_wu.php
