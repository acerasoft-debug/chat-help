name: Journal — Commons'tan ADI VERİLEN fotoğrafları makaleye çek
on:
  workflow_dispatch:
    inputs:
      files:
        description: "Satır satır: 'File:Commons adı.jpg => art-<slug>-cover.jpg || alt metni (isteğe bağlı, ≤140)' (hedef: art-<slug>-cover|1..9 .jpg/.png/.webp)"
        required: true
        default: ""
      width:
        description: "İndirilecek genişlik (piksel, küçük resim)"
        required: false
        default: "1800"
      dry_run:
        description: "true = indirme, sadece lisans/yazar/boyut listele"
        required: false
        default: "true"

permissions:
  contents: read

# journal-photos.yml konuya göre ARAR ve moda kelimesi şartı koyar; makaleye özel bir
# fotoğraf (ör. bir Amazon deposu) o süzgeçten geçemez. Bu iş ADI VERİLEN dosyayı alır.
# Kurallar aynı: yalnız CC0 / Public domain / CC BY / CC BY-SA (NC, ND, fair use RED),
# künyesiz görsel YAZILMAZ — credits.json'a yazar/lisans/kaynak/açıklama birlikte girer.
# Hedef ad art-<slug>-… olmak zorunda: makalenin KENDİ figürü olur, genel havuza girmez
# (vestra_journal_photo_pool art- dosyalarını atlar). credits.json OKUNUP BİRLEŞTİRİLİR,
# geçici dosya + rename ile yazılır; var olan hiçbir künye silinmez.
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Çek
        uses: appleboy/ssh-action@v1.0.3
        env:
          IN_FILES: ${{ github.event.inputs.files }}
          IN_W: ${{ github.event.inputs.width }}
          IN_DRY: ${{ github.event.inputs.dry_run }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 10m
          envs: IN_FILES,IN_W,IN_DRY
          script: |
            cat > /tmp/vestra_jpf.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $dir = getenv("HOME")."/public_html/uploads/journal";
            $dry = strtolower(trim((string)getenv("IN_DRY"))) !== 'false';
            $w   = max(600, min(3000, (int)(getenv("IN_W") ?: 1800)));
            $get = function (string $url) {
              $ch = curl_init($url);
              curl_setopt_array($ch, [CURLOPT_RETURNTRANSFER=>true, CURLOPT_FOLLOWLOCATION=>true, CURLOPT_TIMEOUT=>90, CURLOPT_CONNECTTIMEOUT=>20,
                CURLOPT_USERAGENT=>'VESTRA-Journal/1.0 (https://vestrasales.com; support@vestrasales.com)']);
              $b = curl_exec($ch); $code = (int)curl_getinfo($ch, CURLINFO_HTTP_CODE); curl_close($ch);
              return $code === 200 ? $b : null;
            };
            $clean = fn($s) => trim(preg_replace('/\s+/', ' ', html_entity_decode(strip_tags((string)$s), ENT_QUOTES, 'UTF-8')));
            $licOk = function (string $l): bool {
              $l = strtolower($l); if ($l === '') return false;
              foreach (['non-commercial','noncommercial','-nc','fair use','no derivative','-nd'] as $bad) if (strpos($l, $bad) !== false) return false;
              foreach (['cc0','public domain','cc by','cc-by','attribution'] as $ok) if (strpos($l, $ok) !== false) return true;
              return false;
            };
            $cf = $dir.'/credits.json';
            $credits = is_readable($cf) ? (json_decode((string)file_get_contents($cf), true) ?: []) : [];
            $n0 = count($credits); $saved = 0; $bad = 0;
            foreach (preg_split('/[\r\n]+/', (string)getenv("IN_FILES")) as $line) {
              $line = trim($line); if ($line === '') continue;
              if (!preg_match('/^(File:.+?)\s*=>\s*(art-[a-z0-9-]+-(?:cover|[1-9])\.(?:jpg|png|webp))(?:\s*\|\|\s*(.+))?$/', $line, $m)) { echo "HATA (bicim): $line\n"; $bad++; continue; }
              $title = $m[1]; $target = $m[2]; $altOwn = trim((string)($m[3] ?? ''));
              $raw = $get('https://commons.wikimedia.org/w/api.php?action=query&format=json&prop=imageinfo&iiprop=url|size|mime|extmetadata&iiurlwidth='.$w.'&titles='.rawurlencode($title));
              $pages = $raw ? (json_decode($raw, true)['query']['pages'] ?? []) : [];
              $p = $pages ? reset($pages) : null; $ii = $p['imageinfo'][0] ?? null;
              if (!$ii) { echo "HATA (bulunamadi): $title\n"; $bad++; continue; }
              $em = $ii['extmetadata'] ?? [];
              $lic = $clean($em['LicenseShortName']['value'] ?? '');
              $artist = $clean($em['Artist']['value'] ?? '') ?: 'Wikimedia Commons';
              if (mb_strlen($artist) > 70) $artist = mb_substr($artist, 0, 70).'…';
              /* '|| metin' = alt metni BIZ yaziyoruz: Commons aciklamasi cogu zaman yalniz yer adi
                 ("Gainesville, Florida") -- ekran okuyucuya fotografta ne oldugunu soylemiyor. */
              $desc = mb_substr($altOwn !== '' ? $altOwn : $clean($em['ImageDescription']['value'] ?? ''), 0, 140);
              $date = $clean($em['DateTimeOriginal']['value'] ?? '');
              printf("%s\n   -> %s | %dx%d | %s | lisans: %s | yazar: %s | tarih: %s\n   aciklama: %s\n", $title, $target, $ii['width'] ?? 0, $ii['height'] ?? 0, $ii['mime'] ?? '?', $lic ?: '-', $artist, $date ?: '-', $desc ?: '-');
              if (!$licOk($lic)) { echo "   RED: lisans ticari kullanima uygun degil\n"; $bad++; continue; }
              if (strpos((string)($ii['mime'] ?? ''), 'image/') !== 0 || strpos((string)$ii['mime'], 'svg') !== false) { echo "   RED: raster degil\n"; $bad++; continue; }
              if ($dry) continue;
              $src = (string)($ii['thumburl'] ?? $ii['url'] ?? '');
              $bin = $src !== '' ? $get($src) : null;
              if ($bin === null || strlen($bin) < 8000) { echo "   HATA: indirilemedi\n"; $bad++; continue; }
              file_put_contents($dir.'/'.$target, $bin);
              $credits[$target] = ['artist'=>$artist, 'license'=>$lic,
                'source'=>'https://commons.wikimedia.org/wiki/'.rawurlencode(str_replace(' ', '_', $title)), 'desc'=>$desc];
              $saved++;
              echo "   YAZILDI (".strlen($bin)." bayt)\n";
            }
            if (!$dry && $saved) {
              $tmp = $cf.'.tmp'.getmypid();
              file_put_contents($tmp, json_encode($credits, JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE));
              rename($tmp, $cf);
              $back = json_decode((string)file_get_contents($cf), true) ?: [];
              echo "credits.json: once {$n0}, sonra ".count($back)." kayit (geri okundu)\n";
            }
            echo "BITTI. yazilan: {$saved}, sorunlu: {$bad}".($dry ? "  (DRY-RUN)" : "")."\n";
            PHPEOF
            php /tmp/vestra_jpf.php; RC=$?
            rm -f /tmp/vestra_jpf.php
            exit $RC
