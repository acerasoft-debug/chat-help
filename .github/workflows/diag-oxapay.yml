name: (Teşhis) OxaPay kripto ödemeler + tedarikçi kuyruğu — salt okunur

# 14 Eki 2026. Sunucudaki order_statuses.json'daki OxaPay kayıtları (ref, durum, sandbox, track_id
# kısaltılmış), tedarikçi kuyruğu (deneme, sonraki zaman, hata) ve .env'de anahtarın VAR/YOK
# olduğu. Anahtar, e-posta ve adres BASILMAZ. Hiçbir şey yazmaz.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tek sipariş ref'i (boş = son 20 OxaPay kaydı)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          IN_REF: ${{ github.event.inputs.ref }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 3m
          envs: IN_REF
          script: |
            cd ~/public_html && php -r '
              ini_set("display_errors","1");
              require "inc/products.php"; require_once "inc/oxapay.php";
              $cfg = oxapay_cfg();
              echo "anahtar: ".($cfg["key"] !== "" ? "VAR" : "YOK")." · sandbox: ".($cfg["sandbox"] ? "true" : "false")." · lifetime ".$cfg["lifetime"]." · ".$cfg["to_currency"]." · supplier ".$cfg["supplier_mode"].(($cfg["supplier_email"] !== "") ? " (adres VAR)" : " (adres yok -> satici)")." · test adresi ".($cfg["test_email"] !== "" ? "VAR" : "YOK")." · yaptirim ".implode(",", vestra_sanctioned_countries())."\n";
              $ref = preg_replace("/[^A-Za-z0-9_-]/", "", (string)getenv("IN_REF"));
              $all = vestra_read_json("order_statuses.json"); $n = 0; $rows = [];
              foreach ($all as $r => $e) { if (($e["payment_method"] ?? "") !== "oxapay") continue; if ($ref !== "" && $r !== $ref) continue; $rows[$r] = $e; }
              uasort($rows, fn($a, $b) => strcmp((string)($b["updated_at"] ?? ""), (string)($a["updated_at"] ?? "")));
              foreach (array_slice($rows, 0, 20, true) as $r => $e) {
                echo str_pad($r, 14)." durum ".str_pad((string)($e["status"] ?? "?"), 10)." odeme ".str_pad((string)($e["payment_status"] ?? "-"), 11)
                   .(!empty($e["oxapay_sandbox"]) ? " SANDBOX" : " canli  ")." track ".substr((string)($e["oxapay_track_id"] ?? ""), 0, 6)."… son ".(string)($e["oxapay_last_status"] ?? "-")." @ ".substr((string)($e["oxapay_last_webhook_at"] ?? "-"), 0, 16)
                   ." · paid_at ".substr((string)($e["paid_at"] ?? "-"), 0, 16)." · tedarikci ".(($e["supplier_forwarded_at"] ?? "") !== "" ? "iletildi (".(string)($e["supplier_forward_via"] ?? "").")" : (string)($e["fulfillment_status"] ?? "-"))."\n";
                $n++;
              }
              echo "OxaPay kaydi: ".count($rows)." (gosterilen {$n})\n";
              $q = vestra_read_json(VESTRA_SUPPLIER_QUEUE);
              echo "tedarikci kuyrugu: ".count($q)." is\n";
              foreach (array_slice($q, -20, null, true) as $r => $j) {
                echo "  ".str_pad($r, 14)." deneme ".(int)($j["attempts"] ?? 0)." · ".(($j["done_at"] ?? "") !== "" ? "BITTI ".substr($j["done_at"], 0, 16) : ((($j["failed_at"] ?? "") !== "") ? "VAZGECILDI" : "siradaki ".date("Y-m-d H:i", (int)($j["next_at"] ?? 0))))
                   .(($j["last_error"] ?? "") !== "" ? " · hata: ".substr((string)$j["last_error"], 0, 80) : "")."\n";
              }
              $log = getenv("HOME")."/vestra_sweep.log";
              if (is_file($log)) { $t = array_filter(explode("\n", (string)shell_exec("tail -n 400 ".escapeshellarg($log))), fn($l) => str_contains($l, "[supplier")); echo "cron gunlugu [supplier] son satirlar:\n"; foreach (array_slice($t, -10) as $l) echo "  ".$l."\n"; }
            '
