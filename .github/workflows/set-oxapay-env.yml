name: (Ayar) OxaPay / tedarikçi / yaptırım ayarlarını sunucunun .env'ine yaz

# Operatör, 14 Eki 2026: OxaPay kripto ödeme (vestra/inc/oxapay.php). Ayarlar public_html'in
# ÜSTÜNDEKİ .env'de (inc/env.php okuyor) — repoda, girdide, logda HİÇBİR anahtar yok.
#
# GİZLİ DEĞERLER ŞİFRELİ ZARFLA: `env_enc` = KEY.IV.GÖVDE (seller-products.yml apply/create_buyer
# ile AYNI zarf; keygen'in public key'i, RSA-OAEP + AES-256-CBC; özel anahtar
# ~/.vestra_inbox_key.pem sunucudan hiç çıkmıyor). Gövde: {"OXAPAY_MERCHANT_API_KEY":"…",
# "OXAPAY_SANDBOX_TEST_EMAIL":"…","SUPPLIER_ORDER_EMAIL":"…","SUPPLIER_API_KEY":"…"} — yalnız
# verilen anahtarlar yazılır. Girdi herkese açık ama OKUNAMAZ; çıktı maskeli.
#
# Açık girdiler (gizli değil): sandbox, lifetime, to_currency, supplier_mode, supplier_api_url,
# sanctioned_countries. Boş = dokunma. Diğer .env satırları korunur.
#
# Doğrulama: anahtar yazıldıysa OxaPay'de 1 EUR'luk SANDBOX faturası açılır (ücretsiz, sipariş
# kaydı YOK) ve yalnız "track_id VAR/YOK" basılır. Ardından canlı webhook ucu sunucudan
# yoklanır: yanlış HMAC → 400, doğru HMAC + bilinmeyen track → 200 ok (hiçbir sipariş değişmez).
on:
  workflow_dispatch:
    inputs:
      env_enc:
        description: "Şifreli zarf KEY.IV.GÖVDE (gövde JSON: OXAPAY_MERCHANT_API_KEY, OXAPAY_SANDBOX_TEST_EMAIL, SUPPLIER_ORDER_EMAIL, SUPPLIER_API_KEY). Boş = gizli değer yazma."
        required: false
        default: ""
      sandbox:
        description: "OXAPAY_SANDBOX: true | false | boş (dokunma)"
        required: false
        default: ""
      lifetime:
        description: "OXAPAY_LIFETIME dakika (boş = dokunma; ilk kurulumda 60)"
        required: false
        default: ""
      to_currency:
        description: "OXAPAY_TO_CURRENCY (boş = dokunma; ilk kurulumda USDT)"
        required: false
        default: ""
      supplier_mode:
        description: "SUPPLIER_FORWARD_MODE: email | api | boş (dokunma)"
        required: false
        default: ""
      supplier_api_url:
        description: "SUPPLIER_API_URL (boş = dokunma; '-' = sil)"
        required: false
        default: ""
      sanctioned_countries:
        description: "SANCTIONED_COUNTRIES, ör. RU,BY,IR,KP,SY,CU (boş = dokunma; '-' = varsayılana dön)"
        required: false
        default: ""
      probe:
        description: "Canlı webhook ucunu yokla (400 / 200 ok)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  setenv:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ayarları yaz + doğrula
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_ENC: ${{ github.event.inputs.env_enc }}
          IN_SANDBOX: ${{ github.event.inputs.sandbox }}
          IN_LIFETIME: ${{ github.event.inputs.lifetime }}
          IN_TOCUR: ${{ github.event.inputs.to_currency }}
          IN_SMODE: ${{ github.event.inputs.supplier_mode }}
          IN_SURL: ${{ github.event.inputs.supplier_api_url }}
          IN_SANC: ${{ github.event.inputs.sanctioned_countries }}
          IN_PROBE: ${{ github.event.inputs.probe }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 4m
          envs: ENV_ENC,IN_SANDBOX,IN_LIFETIME,IN_TOCUR,IN_SMODE,IN_SURL,IN_SANC,IN_PROBE
          script: |
            mkdir -p ~/vestra_tmp
            cat > ~/vestra_tmp/oxaenv.php <<'PHPEOF'
            <?php
            ini_set('display_errors', '1');
            $home = getenv('HOME'); $envf = $home.'/.env';
            $mask = function (string $v): string { $v = trim($v); if ($v === '') return 'YOK'; if (str_contains($v, '@')) { $p = strpos($v, '@'); return substr($v, 0, 1).'***'.substr($v, $p); } return substr($v, 0, 3).'…('.strlen($v).')'; };
            $set = [];
            /* 1. Zarf */
            $raw = trim((string)getenv('ENV_ENC'));
            if ($raw !== '') {
              $dec = fn(string $x) => base64_decode(strtr($x, '!$%&#,;?@~', '0123456789'), true);
              $parts = explode('.', $raw);
              if (count($parts) !== 3) { fwrite(STDERR, "zarf bicimi hatali (KEY.IV.GOVDE)\n"); exit(1); }
              $priv = openssl_pkey_get_private((string)@file_get_contents($home.'/.vestra_inbox_key.pem'));
              if (!$priv) { fwrite(STDERR, "sunucuda anahtar yok -- once seller-products admin_mode=keygen\n"); exit(1); }
              if (!openssl_private_decrypt($dec($parts[0]), $aes, $priv, OPENSSL_PKCS1_OAEP_PADDING)) { fwrite(STDERR, "zarf acilamadi (yanlis public key?)\n"); exit(1); }
              $in = json_decode((string)openssl_decrypt($dec($parts[2]), 'aes-256-cbc', $aes, OPENSSL_RAW_DATA, $dec($parts[1])), true);
              if (!is_array($in)) { fwrite(STDERR, "govde cozulemedi\n"); exit(1); }
              foreach (['OXAPAY_MERCHANT_API_KEY', 'OXAPAY_SANDBOX_TEST_EMAIL', 'SUPPLIER_ORDER_EMAIL', 'SUPPLIER_API_KEY'] as $k) {
                if (array_key_exists($k, $in)) $set[$k] = trim((string)$in[$k]);
              }
            }
            /* 2. Acik girdiler */
            $sb = strtolower(trim((string)getenv('IN_SANDBOX'))); if (in_array($sb, ['true', 'false'], true)) $set['OXAPAY_SANDBOX'] = $sb;
            $lt = trim((string)getenv('IN_LIFETIME')); if ($lt !== '' && ctype_digit($lt)) $set['OXAPAY_LIFETIME'] = $lt;
            $tc = strtoupper(trim((string)getenv('IN_TOCUR'))); if (preg_match('/^[A-Z0-9]{2,10}$/', $tc)) $set['OXAPAY_TO_CURRENCY'] = $tc;
            $sm = strtolower(trim((string)getenv('IN_SMODE'))); if (in_array($sm, ['email', 'api'], true)) $set['SUPPLIER_FORWARD_MODE'] = $sm;
            $su = trim((string)getenv('IN_SURL')); if ($su === '-') $set['SUPPLIER_API_URL'] = ''; elseif (preg_match('#^https://#', $su)) $set['SUPPLIER_API_URL'] = $su;
            $sc = strtoupper(trim((string)getenv('IN_SANC'))); if ($sc === '-') $set['SANCTIONED_COUNTRIES'] = ''; elseif ($sc !== '' && preg_match('/^[A-Z]{2}([,\s]+[A-Z]{2})*$/', $sc)) $set['SANCTIONED_COUNTRIES'] = preg_replace('/[\s,]+/', ',', $sc);
            /* 3. .env guncelle: var olan satir degisir, yoksa eklenir, digerleri korunur. Ilk kurulumda varsayilanlar. */
            $lines = is_file($envf) ? file($envf, FILE_IGNORE_NEW_LINES) : [];
            $has = [];
            foreach ($lines as $l) { if (preg_match('/^\s*([A-Z0-9_]+)\s*=/', $l, $m)) $has[$m[1]] = true; }
            $defaults = ['OXAPAY_SANDBOX' => 'true', 'OXAPAY_LIFETIME' => '60', 'OXAPAY_FEE_PAID_BY_PAYER' => '1', 'OXAPAY_UNDERPAID_COVERAGE' => '1', 'OXAPAY_TO_CURRENCY' => 'USDT', 'SUPPLIER_FORWARD_MODE' => 'email', 'SUPPLIER_ORDER_EMAIL' => '', 'SUPPLIER_API_URL' => '', 'SUPPLIER_API_KEY' => '', 'SANCTIONED_COUNTRIES' => 'RU,BY,IR,KP,SY,CU', 'OXAPAY_SANDBOX_TEST_EMAIL' => ''];
            foreach ($defaults as $k => $v) if (!isset($has[$k]) && !array_key_exists($k, $set)) $set[$k] = $v;
            if (!isset($has['OXAPAY_MERCHANT_API_KEY']) && !array_key_exists('OXAPAY_MERCHANT_API_KEY', $set)) $set['OXAPAY_MERCHANT_API_KEY'] = '';
            $out = [];
            foreach ($lines as $l) {
              if (preg_match('/^\s*([A-Z0-9_]+)\s*=/', $l, $m) && array_key_exists($m[1], $set)) { $out[] = $m[1].'='.$set[$m[1]]; unset($set[$m[1]]); }
              else $out[] = $l;
            }
            if ($set) { $out[] = '# OxaPay kripto odeme + tedarikci + yaptirim (set-oxapay-env.yml)'; foreach ($set as $k => $v) $out[] = $k.'='.$v; }
            file_put_contents($envf, implode("\n", $out)."\n", LOCK_EX); @chmod($envf, 0600);
            /* 4. Geri oku ve maskeli bas */
            $env = [];
            foreach (file($envf, FILE_IGNORE_NEW_LINES) as $l) { if (preg_match('/^\s*([A-Z0-9_]+)\s*=(.*)$/', $l, $m)) $env[$m[1]] = trim($m[2], " \t\"'"); }
            foreach (['OXAPAY_MERCHANT_API_KEY', 'OXAPAY_SANDBOX', 'OXAPAY_LIFETIME', 'OXAPAY_FEE_PAID_BY_PAYER', 'OXAPAY_UNDERPAID_COVERAGE', 'OXAPAY_TO_CURRENCY', 'OXAPAY_SANDBOX_TEST_EMAIL', 'SUPPLIER_FORWARD_MODE', 'SUPPLIER_ORDER_EMAIL', 'SUPPLIER_API_URL', 'SUPPLIER_API_KEY', 'SANCTIONED_COUNTRIES'] as $k) {
              $v = (string)($env[$k] ?? '');
              $shown = in_array($k, ['OXAPAY_MERCHANT_API_KEY', 'SUPPLIER_API_KEY', 'OXAPAY_SANDBOX_TEST_EMAIL', 'SUPPLIER_ORDER_EMAIL'], true) ? $mask($v) : ($v === '' ? '(bos)' : $v);
              echo str_pad($k, 28).': '.$shown."\n";
            }
            /* 5. Dogrulama: sandbox faturasi (1 EUR, siparis kaydi YOK) */
            $key = (string)($env['OXAPAY_MERCHANT_API_KEY'] ?? '');
            if ($key !== '') {
              $ch = curl_init('https://api.oxapay.com/v1/payment/invoice');
              curl_setopt_array($ch, [CURLOPT_RETURNTRANSFER => true, CURLOPT_TIMEOUT => 25, CURLOPT_POST => true,
                CURLOPT_POSTFIELDS => json_encode(['amount' => 1, 'currency' => 'EUR', 'lifetime' => 15, 'fee_paid_by_payer' => 1, 'under_paid_coverage' => 1, 'to_currency' => 'USDT', 'order_id' => 'OXATEST-'.date('YmdHis'), 'description' => 'VESTRA key check', 'sandbox' => true]),
                CURLOPT_HTTPHEADER => ['merchant_api_key: '.$key, 'Content-Type: application/json', 'Accept: application/json']]);
              $r = curl_exec($ch); $code = (int)curl_getinfo($ch, CURLINFO_HTTP_CODE); curl_close($ch);
              $j = is_string($r) ? json_decode($r, true) : null;
              $tid = (string)($j['data']['track_id'] ?? '');
              echo "OxaPay anahtar dogrulama (sandbox 1 EUR): HTTP {$code} · track_id ".($tid !== '' ? 'VAR' : 'YOK').($tid === '' ? ' · '.substr((string)($j['error']['message'] ?? ($j['message'] ?? $r)), 0, 160) : '')."\n";
            } else echo "OxaPay anahtar: YOK -- kripto secenegi kasada CIZILMEZ\n";
            /* 6. Canli webhook yoklamasi: siparis degismez (bilinmeyen track) */
            if (strtolower((string)getenv('IN_PROBE')) === 'true') {
              $post = function (string $body, string $hmac): array {
                $ch = curl_init('https://vestrasales.com/oxapay/webhook');
                curl_setopt_array($ch, [CURLOPT_RETURNTRANSFER => true, CURLOPT_TIMEOUT => 20, CURLOPT_POST => true, CURLOPT_POSTFIELDS => $body,
                  CURLOPT_HTTPHEADER => ['Content-Type: application/json', 'HMAC: '.$hmac]]);
                $r = curl_exec($ch); $c = (int)curl_getinfo($ch, CURLINFO_HTTP_CODE); curl_close($ch);
                return [$c, trim((string)$r)];
              };
              $body = json_encode(['type' => 'invoice', 'track_id' => 'PROBE-NO-SUCH-TRACK', 'status' => 'Paid', 'order_id' => 'PROBE']);
              [$c1, $b1] = $post($body, 'deadbeef');
              echo "webhook yanlis HMAC  : HTTP {$c1} ".substr($b1, 0, 60)." (beklenen 400)\n";
              if ($key !== '') { [$c2, $b2] = $post($body, hash_hmac('sha512', $body, $key)); echo "webhook dogru HMAC   : HTTP {$c2} ".substr($b2, 0, 60)." (beklenen 200 ok; bilinmeyen track, siparis degismez)\n"; }
              $ch = curl_init('https://vestrasales.com/orders/PROBE/payment-return'); curl_setopt_array($ch, [CURLOPT_RETURNTRANSFER => true, CURLOPT_TIMEOUT => 20, CURLOPT_HEADER => true, CURLOPT_NOBODY => true]);
              curl_exec($ch); $c3 = (int)curl_getinfo($ch, CURLINFO_HTTP_CODE); $loc = (string)curl_getinfo($ch, CURLINFO_REDIRECT_URL); curl_close($ch);
              echo "payment-return (yok)  : HTTP {$c3} -> ".($loc !== '' ? parse_url($loc, PHP_URL_PATH) : '-')." (beklenen 302 /shop ya da /login)\n";
            }
            echo "crontab cron_mailbox : ".(str_contains((string)shell_exec('crontab -l 2>/dev/null'), 'cron_mailbox.php') ? 'VAR (tedarikci kuyrugu her 10 dk islenir)' : 'YOK!')."\n";
            PHPEOF
            php ~/vestra_tmp/oxaenv.php; rc=$?; rm -f ~/vestra_tmp/oxaenv.php; exit $rc
