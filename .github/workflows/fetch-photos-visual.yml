name: Fotoğrafı olmayan açılar — görsel eşleştirme (butik katalogları)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe = hangi kataloglar açık · run = eşleştir ve kolaj üret"
        required: true
        default: "probe"
      max_images:
        description: "Bu sayıda ya da daha az karesi olan ürünler"
        required: false
        default: "2"

permissions:
  contents: read

# Yer tutucu: asıl iş akışı claude/vestra-premium-retail-site-rxj4va dalında.
jobs:
  stub:
    runs-on: ubuntu-latest
    steps:
