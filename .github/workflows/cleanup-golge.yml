name: Gölge klasörleri temizle

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = sadece listele, silme"
        required: true
        default: "true"

permissions:
  contents: read

# NE SİLİNİYOR
# ------------
# ~/_golge-shop-* klasörleri. Ölçüldü:
#   · public_html DIŞINDALAR → web'den doğrudan istenemiyorlar
#   · /shop/ isteklerini Vestra'nın public_html/shop.php'si karşılıyor,
#     bu klasörler değil
#   · içerikleri depodan birebir yeniden üretilebilir (rsync hedefi)
#   · toplam ~460 MB, disk %77 dolu
#
# Yani canlı hiçbir şeyi beslemiyorlar. Yine de önce kuru liste, sonra silme.
#
# AYRICA: crontab yazdırılıyor. Her deploy'dan sonra public_html/shop
# klasörünün kenara taşınmasının sebebi büyük olasılıkla zamanlanmış bir iş;
# onu bulmadan yeni bir kurulum yapmak, bir saat sonra yine taşınmak demek.
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynağı bul ve temizle
        uses: appleboy/ssh-action@v1.0.3
        env:
          DRY: ${{ github.event.inputs.dry_run }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 8m
          envs: DRY
          script: |
            echo "===== crontab ====="
            crontab -l 2>&1 | sed 's/^/  /' || echo "  yok"
            echo
            echo "===== .cpanel/cron ====="
            ls -la "$HOME/.cpanel" 2>/dev/null | sed 's/^/  /' | head -20
            echo
            echo "===== golge veya shop gecen betikler (ev dizini, ilk seviye) ====="
            grep -rl 'golge\|_golge\|public_html/shop' "$HOME"/*.sh "$HOME"/*.php "$HOME"/scripts 2>/dev/null | head -20 || echo "  yok"
            echo
            echo "===== silinecekler ====="
            TOT=0
            for d in "$HOME"/_golge-shop-*; do
              [ -d "$d" ] || continue
              S=$(du -sm "$d" | cut -f1)
              TOT=$((TOT+S))
              echo "  ${S} MB  $d"
            done
            echo "  toplam: ${TOT} MB"
            echo
            if [ "$DRY" = "true" ]; then
              echo "kuru calisma — silinmedi."
            else
              for d in "$HOME"/_golge-shop-*; do
                [ -d "$d" ] || continue
                rm -rf "$d" && echo "  silindi: $d"
              done
              echo
              echo "===== disk sonrasi ====="
              df -h "$HOME" | tail -1 | sed 's/^/  /'
            fi
            echo
            echo "===== kalan =====" 
            ls -d "$HOME"/_golge-* 2>/dev/null | sed 's/^/  /' || echo "  temiz"
