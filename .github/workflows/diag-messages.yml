name: (Salt-okunur) Mesaj bildirimlerini teşhis et
on:
  workflow_dispatch:

permissions:
  contents: read

# Salt-okunur. "Okundu ama bildirim sönmüyor" hatasının kaynağını görmek için
# bu dalda geçici olarak KAYNAK DÖKÜMÜ yapar:
#  1) inc/messages.php tam kaynak (satır numaralı),
#  2) okundu işaretinin YAZILDIĞI yerler,
#  3) okunmamış sayacının OKUNDUĞU/rozetin çizildiği yerler.
# Hiçbir şey DEĞİŞTİRMEZ.
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Kontrol et
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          script: |
            DOC="$HOME/public_html"
            echo "===== 1) inc/messages.php (tam kaynak) ====="
            wc -l "$DOC/inc/messages.php"
            cat -n "$DOC/inc/messages.php"
            echo
            echo "===== 2) Okundu isaretini YAZAN yerler ====="
            grep -rn --include='*.php' -E "\['read'\]|\"read\"\]|mark_read|msg_read" "$DOC" 2>/dev/null | grep -v "error_log" | head -50
            echo
            echo "===== 3) Okunmamis sayacinin kullanildigi yerler ====="
            grep -rn --include='*.php' "vestra_msg_unread\|unread" "$DOC" 2>/dev/null | grep -v "error_log" | head -60
