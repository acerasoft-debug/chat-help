name: (Salt-okunur) Mesaj bildirimlerini teşhis et
on:
  workflow_dispatch:

permissions:
  contents: read

# Salt-okunur: rozet ($AUTH_USER['id']) ile okundu işareti ($_SESSION['uid'])
# aynı değeri mi kullanıyor?
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Kontrol et
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          script: |
            DOC="$HOME/public_html"
            echo "===== A) AUTH_USER nerede kuruluyor ====="
            grep -rn 'AUTH_USER *=' "$DOC" --include='*.php' | head -20
            echo
            echo "===== B) SESSION uid nerede yaziliyor ====="
            grep -rn "_SESSION\['uid'\] *=" "$DOC" --include='*.php' | head -20
            echo
            echo "===== C) auth_user() tanimi ====="
            grep -n 'function auth_user' -A 25 "$DOC/inc/auth.php" | head -45
            echo
            echo "===== D) messages.php 1-48 ====="
            sed -n '1,48p' "$DOC/inc/messages.php" | cat -n
            echo
            echo "===== E) my_threads + find_thread tanimlari ====="
            grep -n 'function vestra_msg_my_threads' -A 12 "$DOC/inc/messages.php"
            grep -n 'function vestra_msg_save_threads' -A 10 "$DOC/inc/messages.php"
