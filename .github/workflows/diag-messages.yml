name: (Salt-okunur) Mesaj bildirimlerini teşhis et
on:
  workflow_dispatch:
    inputs:
      who:
        description: "Hesap ara: şirket/ad/e-posta içinde geçen metin (ör: vipshop). Boş = arama yapma"
        required: false
        default: ""
      who2:
        description: "İkinci hesap araması — bir yazışmanın iki tarafını tek koşuda görmek için"
        required: false
        default: ""
      brand:
        description: "Bu markanın ilanlarını ve HANGİ SATICIYA ait olduğunu yaz (ör: Ralph Lauren). Boş = atla"
        required: false
        default: ""
      ships:
        description: "true = KURAL 3 denetimi: 'ships from' girilmemiş ilanlar, satıcıya göre sayım"
        required: false
        default: "false"
      threads:
        description: "true = mesaj thread dökümü (uzun). false = yalnız hesap/marka özeti"
        required: false
        default: "false"
      mailcfg:
        description: "true = mail ayarları + Brevo'nun KENDİ olay geçmişi (gönderildi ≠ ulaştı)"
        required: false
        default: "false"
      mail_for:
        description: "mailcfg ile: olay geçmişi sorulacak adres (boş = operatör test kutusu)"
        required: false
        default: ""
      mail_subject:
        description: "mailcfg ile: yalnızca konusunda bu metin geçen olaylar (ör: Ralph Lauren). Boş = hepsi"
        required: false
        default: ""
      sender:
        description: "true = gönderen alan adı doğrulaması (SPF/DKIM/DMARC) + gönderen adresler + kredi. 'Mektubu görmüyorum' denince buraya bakılır"
        required: false
        default: "false"
      orders_for:
        description: "Siparişleri göster: alıcı adı/şirket/e-posta içinde geçen metin (ör: daymond). Boş = atla"
        required: false
        default: ""
      billing_for:
        description: "Faturada görünecek satıcı künyesi + banka ADLARI (ör: garage). IBAN/hesap NUMARASI yazdırılmaz, yalnızca var/yok"
        required: false
        default: ""
      upload_probe:
        description: "true = belge yükleme sondası: PHP yükleme sınırları (.user.ini/php.ini), data/docs yazılabilir mi, error_log'daki ret sebepleri. 'Yükleyemiyorum' denince buraya bakılır"
        required: false
        default: "false"
      errlog:
        description: "true = canlı PHP hataları: error_log'daki Fatal/Warning/Notice/Deprecated satırları mesaj+dosya:satır bazında gruplanır (sayı, son görülme). Sitedeki gerçek kırıkları bulmanın en ucuz yolu"
        required: false
        default: "false"

permissions:
  contents: read

# Salt-okunur TEŞHİS. Hiçbir şey DEĞİŞTİRMEZ, mesaj/e-posta GÖNDERMEZ.
#
# Ne yapar:
#   who / who2  -> hesabı bulur: tip, onay durumu, fiyat kapısı, belgeler, Stripe
#   brand       -> o markanın ilanları + hangi satıcıya ait + fiyat kademeleri
#   threads     -> mesaj thread'leri (kim kiminle, son mesaj, okunmamış)
#   mailcfg     -> mail yolu + Brevo olayları + error_log
#
# E-POSTALAR MASKELENİR (CLAUDE.md / gizlilik): a***@example.com. Teşhis çıktısı
# GitHub Actions kütüğüne yazılıyor ve bu depo herkese açık — maskesiz bir adres
# burada bir kez göründüğünde geri alınamaz.
#
# Çıktı KUYRUKTAN okunuyor (get_job_logs ~55-78 satır gösterir): bu yüzden her
# bölüm kısa tutuldu ve ÖZET en sona basılıyor.
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Kontrol et
        uses: appleboy/ssh-action@v1.0.3
        # Girdiler ADIM env'inde, betigin ICINDE degil. Betikte bir tek ${{ }}
        # bile olsa GitHub butun script bloguni TEK BIR IFADE sayiyor ve 21000
        # karakter sinirina takiliyor -- teshis buyudukce workflow calismaz
        # hale geldi ("Exceeded max expression length"). Bu kalip depodaki
        # diger workflow'larda zaten kullaniliyor (bkz. set-product.yml).
        env:
          IN_WHO:       ${{ github.event.inputs.who }}
          IN_WHO2:      ${{ github.event.inputs.who2 }}
          IN_BRAND:     ${{ github.event.inputs.brand }}
          IN_SHIPS:     ${{ github.event.inputs.ships }}
          IN_THREADS:   ${{ github.event.inputs.threads }}
          IN_MAILCFG:   ${{ github.event.inputs.mailcfg }}
          IN_MAIL_FOR:  ${{ github.event.inputs.mail_for }}
          IN_MAIL_SUBJ: ${{ github.event.inputs.mail_subject }}
          IN_SENDER:    ${{ github.event.inputs.sender }}
          IN_ORDERS:    ${{ github.event.inputs.orders_for }}
          IN_BILLING:   ${{ github.event.inputs.billing_for }}
          IN_UPLOAD:    ${{ github.event.inputs.upload_probe }}
          IN_ERRLOG:    ${{ github.event.inputs.errlog }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: IN_WHO,IN_WHO2,IN_BRAND,IN_SHIPS,IN_THREADS,IN_MAILCFG,IN_MAIL_FOR,IN_MAIL_SUBJ,IN_SENDER,IN_ORDERS,IN_BILLING,IN_UPLOAD,IN_ERRLOG
          script: |
            cat > /tmp/diag_msg.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            register_shutdown_function(function(){
              $e = error_get_last();
              if ($e && in_array($e['type'],[E_ERROR,E_PARSE,E_CORE_ERROR,E_COMPILE_ERROR],true))
                fwrite(STDERR, "PHP OLUMCUL: {$e['message']} ({$e['file']}:{$e['line']})\n");
            });
            $home = getenv("HOME");
            $doc  = $home."/public_html";
            require $doc."/inc/auth.php";
            require $doc."/inc/notify.php";
            require $doc."/inc/messages.php";
            require $doc."/inc/products.php";

            /* Adresi maskele. Depo ve Actions kutugu herkese acik; teshis ciktisinda
               musteri adresi tam yazilmaz (CLAUDE.md). Alan adi aciktan birakiliyor,
               cunku KURAL 1 kontrolu ve gonderilebilirlik hep alan adina bakiyor. */
            function m($e) {
              $e = trim((string)$e);
              if ($e === '') return '*** EMAIL YOK ***';
              $at = strrpos($e, '@');
              if ($at === false || $at === 0) return '***';
              return substr($e,0,1).'***@'.substr($e,$at+1);
            }
            function yn($b) { return $b ? 'EVET' : 'hayir'; }

            $accounts = auth_accounts();
            $byId = [];
            foreach ($accounts as $a) $byId[(string)($a['id']??'')] = $a;

            /* Bir hesabin GONDERIM/FIYAT bakimindan durumu. Tek yerde toplandi:
               "fiyat gorebiliyor mu" sorusu uc ayri bayrakla karistiriliyordu
               (dogrulanmis e-posta / operator onayi / belge). Kapiyi acan
               auth_prices_unlocked(); belge yalnizca uyari (bkz. KURAL 2). */
            function acc_dump(array $a) {
              $id = (string)($a['id'] ?? '?');
              echo "  id=".substr($id,0,8)." | tip=".($a['type']??'?')
                 ." | sirket=\"".($a['company']??'')."\" | kisi=\"".($a['name']??'')."\"\n";
              echo "    email=".m($a['email']??'')." | ulke=".($a['country']??'-')
                 /* Hesabin alani 'vat_id' (auth.php:278, register.php). Burasi
                    'vat' okuyordu ve HER hesap icin "(yok)" basiyordu: 1 Eyl 2026'da
                    bu, VAT'i dosyada olan bir musteriye "numaraniz kayitli degildi,
                    onceki mektubumuz hataliydi" diye ozur yazdirmaya rametmisti.
                    Kontrolun yanlis yere baktigi 6. vaka. 'vat' geriye donuk yedek. */
                 ." | vat=".((($a['vat_id'] ?? '') ?: ($a['vat'] ?? '')) !== '' ? (($a['vat_id'] ?? '') ?: $a['vat']) : '(yok)')."\n";
              echo "    email_dogrulandi=".yn(!empty($a['email_verified']))
                 ." | operator_onayi=".yn(function_exists('auth_user_approved') ? auth_user_approved($a) : !empty($a['approved']))
                 ." | FIYAT KAPISI ACIK=".yn(auth_prices_unlocked($a))."\n";
              /* Ham alanlar da yazilir: kapi "status=active VEYA kyb_status=approved"
                 ile aciliyor; ikisi ayristiginda (active + pending) panel eskiden
                 "Pending" gosterip dugme cikarmiyordu (2 Eyl 2026, LESSVAT). */
              echo "    status=".($a['status'] ?? '(yok)')." | kyb_status=".($a['kyb_status'] ?? '(yok)')
                 ." | suspend_reason=".($a['suspend_reason'] ?? '-')." | kayit=".substr((string)($a['created'] ?? ''), 0, 16)."\n";
              /* auth_required_doc_types() DUZ LISTE dondurur (['trade_licence','id_document']),
                 anahtarli harita degil -- array_keys() burada 0,1 basardi. */
              $need = function_exists('auth_required_doc_types') ? auth_required_doc_types((string)($a['type']??'buyer')) : [];
              $have = [];
              foreach ((array)($a['doc_requests'] ?? []) as $d) {
                $t = (string)($d['type'] ?? '');
                $st = (string)($d['status'] ?? '');
                $f  = (string)($d['file'] ?? '');
                $have[] = $t.':'.($st !== '' ? $st : '?').($f !== '' ? '+dosya' : '');
              }
              echo "    gereken belge=".(implode(',', $need) ?: '(yok)')
                 ." | kayitli=".(implode(' ', $have) ?: '(hic)')."\n";
              echo "    stripe=".(!empty($a['stripe_account_id']) ? 'bagli' : 'YOK')."\n";
              /* Ilan sayisi: satici mi gercekten, yoksa yalnizca tipi mi satici. */
              $n = 0; $titles = [];
              foreach (vestra_listings() as $l) {
                if ((string)($l['seller_uid'] ?? '') !== $id) continue;
                $n++;
                if (count($titles) < 6) $titles[] = ($l['brand']??'?').' '.mb_substr((string)($l['name']??''),0,34);
              }
              echo "    ilan sayisi=".$n.($titles ? " -> ".implode(' / ', $titles) : '')."\n";
            }

            function find_accounts(array $accounts, string $q) {
              $q = mb_strtolower(trim($q));
              $out = [];
              if ($q === '') return $out;
              foreach ($accounts as $a) {
                $hay = mb_strtolower(($a['company']??'').' '.($a['name']??'').' '.($a['email']??''));
                if (mb_strpos($hay, $q) !== false) $out[] = $a;
              }
              return $out;
            }

            $summary = [];
            foreach (['who'=>getenv('IN_WHO'), 'who2'=>getenv('IN_WHO2')] as $k => $q) {
              $q = trim((string)$q);
              if ($q === '') continue;
              echo "===== HESAP ARAMASI: \"{$q}\" =====\n";
              $hits = find_accounts($accounts, $q);
              if (!$hits) { echo "  *** eslesen hesap YOK ***\n"; $summary[] = "{$q}: hesap yok"; }
              foreach ($hits as $a) {
                acc_dump($a);
                $summary[] = ($a['company'] ?: $a['name'] ?: '?').": tip=".($a['type']??'?')
                           .", fiyat kapisi=".(auth_prices_unlocked($a) ? 'ACIK' : 'KAPALI');
              }
              echo "\n";
            }

            $brand = trim((string)getenv('IN_BRAND'));
            if ($brand !== '') {
              echo "===== MARKA: \"{$brand}\" — ilanlar ve SAHIBI =====\n";
              $n = 0; $owners = [];
              foreach (vestra_products() as $p) {
                if (stripos((string)($p['brand'] ?? ''), $brand) === false) continue;
                $n++;
                $su = (string)($p['seller_uid'] ?? '');
                $own = $su === '' ? '(platform/demo — satici yok)'
                                  : (($byId[$su]['company'] ?? $byId[$su]['name'] ?? '(hesap bulunamadi)').' ['.substr($su,0,8).']');
                $owners[$own] = ($owners[$own] ?? 0) + 1;
                /* Renk ve gorsel de yaziliyor: birlestirilmis bir ilani
                   birlestirilmemisten ancak bunlar ayirir. Depodaki ice
                   aktarma dosyasi CANLI durumu gostermez -- uzerine duzeltme
                   uygulanmis olabilir. */
                $cols = (array)($p['colors'] ?? []);
                echo "  ".($p['id']??'?')." | ".mb_substr((string)($p['name']??''),0,40)
                   ." | ".($p['cat']??'?')." | sku=".($p['sku'] ?? '-')
                   ." | ".number_format(vestra_export_price($p),2)." EUR | MOQ ".(int)($p['moq']??0)
                   ." | durum=".($p['status'] ?? 'approved')
                   ." | renk(".count($cols)."): ".(implode(',', array_map('strval',$cols)) ?: '-')
                   ." | gorsel=".count((array)($p['images'] ?? []))
                   ." | ships=".(trim((string)($p['ships_from']??'')) !== '' ? $p['ships_from'] : 'YOK')
                   ." | ".$own."\n";
              }
              echo "  TOPLAM: {$n} urun\n";
              foreach ($owners as $o => $c) $summary[] = "{$brand}: {$c} urun -> {$o}";
              echo "\n";
            }

            /* KURAL 3 denetimi. 'ships from' artik zorunlu alan, ama ZORUNLULUK
               yalnizca YENI/duzenlenen ilanlara isliyor -- daha once girilmis
               ilanlar bos kaldi ve bunu ancak sayarak gorursun. Alici bu satiri
               gumruk ve teslim suresi icin okuyor; ozellikle AB disindan sorana
               fiyat listesi gonderirken eksikligi dogrudan bir sonraki soruya
               donusuyor. */
            if (getenv('IN_SHIPS') === 'true') {
              echo "===== KURAL 3: 'ships from' girilmemis ilanlar =====\n";
              $tot = 0; $missing = 0; $perSeller = [];
              foreach (vestra_listings() as $l) {
                $tot++;
                if (trim((string)($l['ships_from'] ?? '')) !== '') continue;
                $missing++;
                $su = (string)($l['seller_uid'] ?? '');
                $own = $su === '' ? '(platform/demo)'
                                  : (($byId[$su]['company'] ?? $byId[$su]['name'] ?? '(hesap yok)').' ['.substr($su,0,8).']');
                $perSeller[$own] = ($perSeller[$own] ?? 0) + 1;
              }
              arsort($perSeller);
              foreach ($perSeller as $o => $c) echo "  {$c} ilan  <-  {$o}\n";
              echo "  TOPLAM: {$missing} / {$tot} ilanda gonderim yeri YOK\n";
              $summary[] = "KURAL 3: {$missing}/{$tot} ilanda ships_from bos";
              echo "\n";
            }

            if (getenv('IN_THREADS') === 'true') {
              $threads = vestra_msg_threads();
              usort($threads, fn($a,$b) => strtotime($b['last_at']??'1970-01-01') <=> strtotime($a['last_at']??'1970-01-01'));
              echo "===== THREAD SAYISI: ".count($threads)." (en yeni 8) =====\n";
              foreach (array_slice($threads, 0, 8) as $t) {
                $msgs = $t['messages'] ?? [];
                $last = end($msgs);
                echo "--- ".($t['id']??'?')." | ilan=".($t['listing_id']??'-')." | son=".($t['last_at']??'')
                   ." | mesaj=".count($msgs)."\n";
                echo "    son: [".($last['from']??'?')."] \"".mb_substr((string)($last['text']??($last['meta']['kind']??'')),0,70)."\"\n";
                foreach (['alici'=>(string)($t['buyer_uid']??''), 'satici'=>(string)($t['seller_uid']??'')] as $role => $uid) {
                  if ($uid === '') { echo "    [{$role}] uid bos\n"; continue; }
                  if (defined('VESTRA_SUPPORT_UID') && $uid === VESTRA_SUPPORT_UID) { echo "    [{$role}] VESTRA Support\n"; continue; }
                  $acc = $byId[$uid] ?? null;
                  echo "    [{$role}] ".($acc ? ('"'.($acc['company'] ?: $acc['name'] ?: '(isimsiz)').'" '.m($acc['email']??'')) : '*** HESAP BULUNAMADI ***')
                     ." | okunmamis=".yn(vestra_msg_unread($t, $uid))."\n";
                }
              }
              echo "\n";
            }

            /* mail_for TEK BASINA da bu blogu acmali: Brevo olay gecmisi bu
               blogun ICINDE ve girdiyi yalnizca mail_for ile veren operatore
               HICBIR SEY basilmiyordu -- "olay yok" gibi okunan bir sessizlik,
               oysa sorgu hic yapilmamisti. Adres soruldugunda cevap verilir. */
            if (getenv('IN_MAILCFG') === 'true' || trim((string)getenv('IN_MAIL_FOR')) !== '') {
              echo "===== MAIL AYARLARI =====\n";
              $apiKey = (string)vestra_cfg('mail_api_key','');
              echo "mail_enabled=".(vestra_cfg('mail_enabled',false)?'true':'false')
                 ." | provider=".vestra_cfg('mail_api_provider','brevo')
                 ." | anahtar=".($apiKey !== '' ? 'SET' : '(bos)')
                 ." | from=".vestra_cfg('mail_from','support@vestrasales.com')."\n\n";

              /* SAGLAYICININ KENDI KAYDI. error_log yalnizca BASARISIZ gonderimi
                 yaziyor -- 2xx hicbir sey birakmiyor, yani oradaki sessizlik
                 "ulasti" demek DEGIL. Betigin "GONDERILDI" satiri da yalnizca
                 "Brevo isteği kabul etti" demek; teslim, bounce, spam ve
                 "hic ulasmadi" ancak burada ayrisiyor.
                 Adres: IN_MAIL_FOR, verilmezse operatorun test kutusu. */
              $who = trim((string)getenv('IN_MAIL_FOR'));
              if ($who === '') $who = 'acerasoft@gmail.com';
              if ($apiKey === '') { echo "  (anahtar yok -- olay gecmisi sorulamiyor)\n"; }
              else {
                echo "===== BREVO OLAY GECMISI: ".m($who)." (son 2 gun) =====\n";
                $ch = curl_init('https://api.brevo.com/v3/smtp/statistics/events?'.http_build_query([
                  'email' => $who,
                  'startDate' => gmdate('Y-m-d', strtotime('-2 days')),
                  'endDate' => gmdate('Y-m-d'),
                  'limit' => 100,
                ]));
                curl_setopt_array($ch, [CURLOPT_RETURNTRANSFER=>true, CURLOPT_TIMEOUT=>20,
                  CURLOPT_HTTPHEADER=>['api-key: '.$apiKey, 'Accept: application/json']]);
                $resp = curl_exec($ch); $code = curl_getinfo($ch, CURLINFO_HTTP_CODE); curl_close($ch);
                if ($code >= 200 && $code < 300) {
                  $events = (array)((json_decode((string)$resp, true) ?: [])['events'] ?? []);
                  /* Konu suzgeci: 100 olayin hepsini basmak kutuk kuyruguna
                     sigmiyor ve ilgilendigin mektup en usttekiler arasinda
                     kaybolyordu -- ilk denemede tam bu oldu. */
                  $subjQ = trim((string)getenv('IN_MAIL_SUBJ'));
                  if ($subjQ !== '') {
                    $events = array_values(array_filter($events,
                      fn($ev) => stripos((string)($ev['subject'] ?? ''), $subjQ) !== false));
                    echo "  (konu suzgeci: \"{$subjQ}\")\n";
                  }
                  if (!$events) {
                    echo "  (HIC OLAY YOK".($subjQ !== '' ? " -- bu konuda" : " -- Brevo'ya hic ulasmamis olabilir").")\n";
                    $summary[] = "Brevo: olay yok".($subjQ !== '' ? " ({$subjQ})" : "");
                  }
                  /* ESKIDEN YENIYE bas: Brevo yeniden eskiye donduruyor ve kutuk
                     KUYRUKTAN okundugu icin en yeni satirlar tam da kirpilan
                     yerdeydi. Simdi en yeni olay en SONDA, yani her zaman gorunur. */
                  $events = array_reverse($events);
                  $tally = [];
                  foreach ($events as $ev) {
                    $e = (string)($ev['event'] ?? '?');
                    $tally[$e] = ($tally[$e] ?? 0) + 1;
                    echo "  ".($ev['date'] ?? '?')." | ".$e." | ".mb_substr((string)($ev['subject'] ?? ''),0,52)."\n";
                  }
                  foreach ($tally as $e => $c) $summary[] = "Brevo {$e}: {$c}";
                  /* 'requests' var ama 'delivered' yoksa: Brevo istegi kabul etti,
                     posta kutusuna girmedi. Sessizce gecilecek en pahali durum. */
                  if (($tally['requests'] ?? 0) > 0 && ($tally['delivered'] ?? 0) === 0) {
                    $summary[] = "!! requests var, delivered YOK -- kabul edildi ama teslim edilmedi";
                  }
                } else {
                  echo "  HATA: Brevo events HTTP {$code}: ".mb_substr((string)$resp,0,160)."\n";
                  $summary[] = "Brevo events HTTP {$code}";
                }
              }
              echo "\n";
            }

            /* GONDEREN ALAN ADI DOGRULAMASI. "delivered" = alici sunucu KABUL
               ETTI demek; Gmail'in spam klasorune koymasi da delivered sayilir.
               Kutuya girip girmedigini belirleyen sey SPF/DKIM/DMARC. Operator
               "mektubu gormuyorum" dediginde once buraya bakilir -- teslim
               kaydina degil. Anahtar hicbir yerde YAZDIRILMIYOR. */
            if (getenv('IN_SENDER') === 'true') {
              $apiKey = (string)vestra_cfg('mail_api_key','');
              if ($apiKey === '') { echo "===== GONDEREN =====\n  (anahtar yok)\n\n"; }
              else {
                $get = function (string $path) use ($apiKey) {
                  $ch = curl_init('https://api.brevo.com/v3/'.$path);
                  curl_setopt_array($ch, [CURLOPT_RETURNTRANSFER=>true, CURLOPT_TIMEOUT=>20,
                    CURLOPT_HTTPHEADER=>['api-key: '.$apiKey, 'Accept: application/json']]);
                  $r = curl_exec($ch); $c = curl_getinfo($ch, CURLINFO_HTTP_CODE); curl_close($ch);
                  return [$c, json_decode((string)$r, true) ?: []];
                };

                echo "===== GONDEREN ALAN ADI (SPF / DKIM / DMARC) =====\n";
                [$c, $d] = $get('senders/domains');
                if ($c < 200 || $c >= 300) { echo "  HATA: HTTP {$c}\n"; $summary[] = "Brevo domains HTTP {$c}"; }
                foreach ((array)($d['domains'] ?? []) as $dom) {
                  $n  = (string)($dom['domain_name'] ?? $dom['domain'] ?? '?');
                  $au = (array)($dom['authentication'] ?? []);
                  $ok = fn($k) => !empty($au[$k]) ? 'OK' : '*** YOK ***';
                  echo "  {$n} | dogrulanmis=".(!empty($dom['verified']) ? 'EVET' : '*** HAYIR ***')
                     ." | dkim=".$ok('dkim')." | brevo_code=".$ok('brevo_code')." | dmarc=".$ok('dmarc')."\n";
                  $summary[] = "alan {$n}: dogrulanmis=".(!empty($dom['verified'])?'EVET':'HAYIR')
                             .", dkim=".(!empty($au['dkim'])?'OK':'YOK').", dmarc=".(!empty($au['dmarc'])?'OK':'YOK');
                }

                /* DNS KAYITLARININ KENDISI. Denetimin "dkim=YOK" demesi sorunu
                   gosteriyor ama cozmuyor: operatorun GoDaddy'ye yapistiracagi
                   satirlar Brevo'nun kendi cevabinda duruyor (dns_records). Bunlari
                   basmak guvenli -- DKIM ACIK anahtardir, DMARC ve dogrulama kaydi
                   zaten herkese acik DNS'te yayinlanacak. API ANAHTARI basilmaz. */
                echo "\n===== DNS'E EKLENECEK KAYITLAR (GoDaddy) =====\n";
                $printed = 0;
                foreach ((array)($d['domains'] ?? []) as $dom) {
                  $n = (string)($dom['domain_name'] ?? $dom['domain'] ?? '?');
                  $recs = (array)($dom['dns_records'] ?? []);
                  if (!$recs) { echo "  {$n}: Brevo bu alan icin kayit dondurmedi\n"; continue; }
                  echo "  --- {$n} ---\n";
                  foreach ($recs as $key => $r) {
                    if (!is_array($r)) continue;
                    $host = (string)($r['host_name'] ?? $r['hostname'] ?? '?');
                    $type = strtoupper((string)($r['type'] ?? 'TXT'));
                    $val  = (string)($r['value'] ?? '');
                    $st   = !empty($r['status']) ? 'DOGRULANDI' : 'BEKLIYOR';
                    /* Uzun DKIM degeri tek satirda okunmaz; 100 karakterde katliyoruz
                       ama BIRLESTIRILECEGI acikca yaziyoruz -- yanlis kopyalanan bir
                       DKIM sessizce calismaz, sadece mektup spam'e duser. */
                    echo "  [{$key}] durum={$st}\n";
                    echo "     Type : {$type}\n";
                    echo "     Name : {$host}\n";
                    echo "     Value: ".(strlen($val) > 100 ? "(asagidaki parcalari BOSLUKSUZ birlestir)\n            ".implode("\n            ", str_split($val, 100)) : $val)."\n";
                    $printed++;
                  }
                }
                if (!$printed) echo "  (kayit yok — alan adi Brevo'ya hic eklenmemis olabilir)\n";
                echo "\n  DMARC ayrica elle eklenir (Brevo dondurmezse):\n";
                echo "     Type : TXT\n";
                echo "     Name : _dmarc\n";
                echo "     Value: v=DMARC1; p=none; rua=mailto:support@vestrasales.com\n";
                echo "  (p=none = once izle, hicbir mektubu reddetme. DKIM oturduktan\n";
                echo "   sonra p=quarantine'e cekilir.)\n";

                echo "\n===== GONDEREN ADRESLER =====\n";
                [$c2, $d2] = $get('senders');
                foreach ((array)($d2['senders'] ?? []) as $sd) {
                  echo "  ".m((string)($sd['email'] ?? ''))." | \"".($sd['name'] ?? '')."\""
                     ." | aktif=".(!empty($sd['active']) ? 'EVET' : '*** HAYIR ***')."\n";
                }

                echo "\n===== HESAP / KREDI =====\n";
                [$c3, $d3] = $get('account');
                foreach ((array)($d3['plan'] ?? []) as $pl) {
                  echo "  ".($pl['type'] ?? '?')." | kredi=".($pl['credits'] ?? '?')
                     ." | ".($pl['creditsType'] ?? '')."\n";
                  if (isset($pl['credits'])) $summary[] = "Brevo kredi: ".$pl['credits'];
                }
                echo "\n";
              }
            }

            /* SIPARIS DOKUMU. Bir siparisin hangi kalemlerden olustugunu ve her
               kalemin hangi saticiya ait oldugunu gormeden "su urunu cikaralim mi"
               diye musteriye yazilamaz. Salt okunur. */
            $oq = trim((string)getenv('IN_ORDERS'));
            if ($oq !== '') {
              echo "===== SIPARISLER: \"{$oq}\" =====\n";
              require_once $doc."/inc/orders.php";
              $hit = 0;
              foreach (vestra_read_csv('orders.csv') as $o) {
                $hay = mb_strtolower(implode(' ', [$o['company'] ?? '', $o['name'] ?? '', $o['email'] ?? '']));
                if (mb_strpos($hay, mb_strtolower($oq)) === false) continue;
                $hit++;
                echo "--- ref=".($o['ref'] ?? '?')." | ".($o['date'] ?? $o['timestamp'] ?? '')
                   ." | ".($o['company'] ?? $o['name'] ?? '?')." ".m((string)($o['email'] ?? ''))
                   ." | durum=".($o['status'] ?? '-')."\n";
                $lines = function_exists('vestra_order_lines') ? vestra_order_lines($o) : [];
                foreach ($lines as $ln) {
                  $pid = (string)($ln['id'] ?? $ln['product_id'] ?? '');
                  $pr  = $pid !== '' ? vestra_listing_by_id($pid) : null;
                  if (!$pr) foreach (vestra_products() as $cand) if ((string)($cand['id'] ?? '') === $pid) { $pr = $cand; break; }
                  $su  = (string)($pr['seller_uid'] ?? '');
                  $own = $su === '' ? '(platform/demo)'
                       : (($byId[$su]['company'] ?? $byId[$su]['name'] ?? '(hesap yok)'));
                  echo "    · ".($ln['qty'] ?? '?')." x ".mb_substr((string)($ln['title'] ?? $ln['name'] ?? $pid),0,46)
                     . " | id=".$pid." | ".($pr ? 'ILAN VAR ('.($pr['status'] ?? 'approved').')' : '*** ILAN YOK ***')
                     . " | satici: ".$own."\n";
                }
                if (!$lines) echo "    (kalem cozulemedi, ham: ".mb_substr((string)($o['items'] ?? ''),0,160).")\n";
              }
              if (!$hit) { echo "  (bu alicida orders.csv kaydi yok)\n"; }

              /* TEKLIFLER. Operatorun sordugu sey burada: hangi teklif CEVAPSIZ
                 kalmis. offer_responses.json cevap verilmis olanlari tutuyor;
                 kaydi olmayan ya da hala 'counter' durumunda olan teklif aciktir.
                 SIRA KIMDE bilgisi kritik -- top alicidaysa nudge dogru, satici
                 tarafindaysa musteriyi bosuna sikistirmis oluruz. */
              require_once $doc."/inc/offers.php";
              /* invoice.php AYRICA yuklenmeli. offers.php onu yalnizca fonksiyon
                 GOVDESINDE require ediyor, yani cagrilmadikca yuklenmiyor ve
                 asagidaki function_exists('vestra_invoices_for_ref') FALSE
                 donuyordu -- teshis, KESILMIS bir faturaya "KESILMEDI" diyordu.
                 Daymond dosyasinda tam bu yasandi: dizinde OCF7F5 PDF+meta
                 duruyorken satir "onay kuyrugunda" yaziyordu. */
              require_once $doc."/inc/invoice.php";
              $rs = function_exists('vestra_read_json') ? (array)vestra_read_json('offer_responses.json') : [];
              echo "  --- teklifler ---\n";
              $oc = 0;
              foreach (vestra_read_csv('offers.csv') as $of) {
                $hay = mb_strtolower(implode(' ', [$of['company'] ?? '', $of['name'] ?? '', $of['email'] ?? '']));
                if (mb_strpos($hay, mb_strtolower($oq)) === false) continue;
                $oc++;
                $ref  = (string)($of['ref'] ?? '');
                $resp = $rs[$ref] ?? null;
                $st   = $resp['status'] ?? '(cevapsiz)';
                $turn = function_exists('vestra_offer_turn') ? vestra_offer_turn($resp) : '?';
                $left = function_exists('vestra_offer_counters_left') ? vestra_offer_counters_left($resp) : '?';
                /* Fiyat sutunu 'offer_unit' -- 'unit_price'/'price' diye okumak
                   her satirda '?' yazdiriyordu. ANLASILAN birim ise ayri:
                   karsi teklif verilmisse teklif edilen degil KABUL EDILEN
                   fiyat gecerli (KURAL 5), o yuzden vestra_offer_agreed_unit()
                   -- faturaya giren rakam bu. */
                $ask    = (float)($of['offer_unit'] ?? 0);
                $agreed = function_exists('vestra_offer_agreed_unit')
                        ? vestra_offer_agreed_unit($ref, $resp, $of) : 0.0;
                $qn     = (int)($of['qty'] ?? 0);
                /* FATURA KESILDI MI. 'accept' bir teklifi faturaya HAZIR yapar,
                   kesmez -- KURAL 5: belge Admin > Invoice approvals'tan cikar.
                   Operator "fatura nerede" diye sorunca bakilacak yer burasi:
                   kesilmisse numarasi, kesilmemisse kuyrukta bekliyor. */
                $invs = function_exists('vestra_invoices_for_ref') ? vestra_invoices_for_ref($ref) : [];
                $inv  = $invs ? ('KESILDI: '.implode(', ', array_map(fn($i) => (string)($i['no'] ?? '?'), $invs)))
                      : (($st === 'accept') ? '*** KESILMEDI - onay kuyrugunda ***' : 'kesilemez (uzlasma yok)');
                /* SATICI: faturayi kimin kestigini bu belirliyor. Teklif kaydinda
                   satici yok -- urunun ilanindan cozuluyor (offers.php:
                   vestra_listing_by_sku -> seller_uid). Bir siparisteki kalemler
                   FARKLI saticilara ait olabilir ve o zaman sistem tek fatura
                   kesemez; karari gorunur kilmak icin satici satirda yaziyor. */
                $lst = function_exists('vestra_listing_by_sku') ? vestra_listing_by_sku((string)($of['sku'] ?? '')) : null;
                $sid = (string)($lst['seller_uid'] ?? '');
                $snm = $sid === '' ? '(platform/demo -> VESTRA keser)'
                     : (($byId[$sid]['company'] ?? $byId[$sid]['name'] ?? '(hesap yok)'));
                echo "  ".$ref." | ".mb_substr((string)($of['product'] ?? $of['title'] ?? '?'),0,30)
                   . " | ".$qn." x ".number_format($agreed,2)." = ".number_format($qn*$agreed,2)
                   . " | ".$st." | SATICI: ".$snm." | FATURA: ".$inv."\n";
              }
              if (!$oc) echo "  (teklif yok)\n";

              /* FATURA DOSYALARININ KENDISI. vestra_invoices_for_ref yalnizca
                 .json meta dosyasina bakiyor; PDF yazilip meta yazilamamis bir
                 kesim panelde ve yukaridaki satirda "fatura yok" gorunur ama
                 NUMARA YANMIS, hatta alici mektubu almis olabilir. O durum
                 ancak dizinin kendisine bakilarak gorulur -- bu depoda "kontrol
                 yanlis yere bakiyordu" hatasi uc kez yasandi (CLAUDE.md). */
              echo "  --- data/invoices dizini ---\n";
              $invDir = $doc."/data/invoices";
              $fs = is_dir($invDir) ? (glob($invDir."/*.{pdf,json}", GLOB_BRACE) ?: []) : [];
              if (!$fs) echo "    (dosya yok)\n";
              $shown = 0;
              foreach ($fs as $f) {
                if (++$shown > 40) { echo "    ... (".(count($fs)-40)." dosya daha)\n"; break; }
                echo "    ".basename($f)."  ".number_format((int)@filesize($f))." bayt\n";
              }
              $summary[] = "{$oq}: {$hit} siparis, {$oc} teklif, ".count($fs)." fatura dosyasi";
              echo "\n";
            }

            /* FATURA KUNYESI. Faturanin ustundeki isim $sellerAcc['company'],
               IBAN'in yanindaki isim ise 'bank_holder' -- IKISI AYRI ALAN ve
               operator ikisinin FARKLI olmasini istiyor.

               NUMARALAR BASILMIYOR. IBAN / hesap / routing yalnizca "var/yok"
               ve uzunluk olarak yaziliyor. Bu depo ve Actions kutugu HERKESE
               ACIK (CLAUDE.md): bir IBAN buraya bir kez dustugunde geri
               alinamaz, ve ABD'de routing+hesap ikilisi ACH borclandirma icin
               tek basina yeterli. Degerin kendisi panelde okunur. */
            $bq = trim((string)getenv('IN_BILLING'));
            if ($bq !== '') {
              echo "===== FATURA KUNYESI: \"{$bq}\" =====\n";
              foreach (find_accounts($accounts, $bq) as $a) {
                $has = function ($v) { $v = trim((string)$v); return $v === '' ? '*** BOS ***' : 'VAR ('.strlen($v).' hane)'; };
                echo "  id=".substr((string)($a['id'] ?? ''),0,8)." | tip=".($a['type'] ?? '?')."\n";
                echo "  --- faturanin USTUNDE gorunecek (invoice.php: sellerAcc) ---\n";
                echo "    company    : \"".($a['company'] ?? '')."\"".(trim((string)($a['company'] ?? '')) === '' ? '  <- BOS ise name kullanilir' : '')."\n";
                echo "    name       : \"".($a['name'] ?? '')."\"\n";
                echo "    address    : \"".($a['address'] ?? '')."\"\n";
                echo "    country    : ".($a['country'] ?? '-')."\n";
                echo "    vat_id     : ".((trim((string)($a['vat_id'] ?? '')) !== '') ? $a['vat_id'] : '(yok)')."\n";
                echo "    reg_number : ".((trim((string)($a['reg_number'] ?? '')) !== '') ? $a['reg_number'] : '(yok)')."\n";
                echo "  --- IBAN'in YANINDA gorunecek (invoice.php: payment_rails) ---\n";
                echo "    bank_holder: \"".($a['bank_holder'] ?? '')."\"".(trim((string)($a['bank_holder'] ?? '')) === '' ? '  <- BOS' : '')."\n";
                echo "    bank_name  : \"".($a['bank_name'] ?? '')."\"\n";
                echo "    bank_bic   : ".((trim((string)($a['bank_bic'] ?? '')) !== '') ? $a['bank_bic'] : '(yok)')."\n";
                echo "    bank_iban  : ".$has($a['bank_iban'] ?? '')."   [NUMARA YAZDIRILMIYOR - panelden oku]\n";
                echo "    bank_account/routing: ".$has($a['bank_account'] ?? '')." / ".$has($a['bank_routing'] ?? '')."\n";
                echo "    stripe     : ".(!empty($a['stripe_account_id']) ? 'bagli' : 'YOK')."\n";
                $summary[] = ($a['company'] ?: $a['name'] ?: '?').": company=\"".($a['company'] ?? '')."\", bank_holder=\"".($a['bank_holder'] ?? '')."\", iban=".(trim((string)($a['bank_iban'] ?? '')) !== '' ? 'VAR' : 'YOK');
              }
              echo "\n";
            }

            /* YUKLEME SONDASI (2 Eyl 2026: bir alici belgesini iki gun yukleyemedi
               ve e-postayla gonderdi). CLI'nin ini degerleri web SAPI'ninkinden
               FARKLI olabilir -- o yuzden public_html'deki .user.ini / php.ini de
               okunuyor; web'in gercek siniri ancak oradan kestirilir.
               error_log'da iki iz aranir: PHP'nin kendi "POST Content-Length ...
               exceeds the limit" uyarisi (post_max_size asimi -- form sessizce
               bos doner) ve "[VESTRA doc]" satirlari (auth_store_doc_file'in
               yazdigi ret SEBEBI). Adres yok, uid'in ilk 8 hanesi var. */
            if (getenv('IN_UPLOAD') === 'true') {
              echo "===== YUKLEME SONDASI =====\n";
              echo "  php=".PHP_VERSION." sapi=".PHP_SAPI." ini=".(php_ini_loaded_file() ?: '(yok)')."\n";
              foreach (['upload_max_filesize','post_max_size','max_file_uploads','memory_limit','file_uploads','upload_tmp_dir'] as $k) {
                $v = (string)ini_get($k); echo "  CLI ".$k."=".($v === '' ? '(bos)' : $v)."\n";
              }
              foreach (['.user.ini','php.ini'] as $ini) {
                $p = $doc.'/'.$ini;
                if (!is_file($p)) { echo "  ".$ini.": yok\n"; continue; }
                echo "  ".$ini.": VAR (".filesize($p)." bayt)\n";
                foreach (file($p, FILE_IGNORE_NEW_LINES) ?: [] as $ln) {
                  if (preg_match('/^\s*(upload_max_filesize|post_max_size|max_file_uploads|memory_limit)\s*=/', $ln)) echo "     ".trim($ln)."\n";
                }
              }
              $tmp = (string)ini_get('upload_tmp_dir') ?: sys_get_temp_dir();
              echo "  tmp=".$tmp." yazilabilir=".yn(is_writable($tmp))."\n";
              $dd = $doc.'/data/docs';
              echo "  data/docs: var=".yn(is_dir($dd))." yazilabilir=".yn(is_dir($dd) && is_writable($dd))
                 ." perm=".(is_dir($dd) ? substr(sprintf('%o', fileperms($dd)), -4) : '-')."\n";
              $nDirs = 0; $nFiles = 0; $newest = 0;
              foreach ((is_dir($dd) ? (glob($dd.'/*', GLOB_ONLYDIR) ?: []) : []) as $ud) {
                $nDirs++;
                foreach (glob($ud.'/*') ?: [] as $f) { $nFiles++; $newest = max($newest, (int)@filemtime($f)); }
              }
              echo "  hesap dizini=".$nDirs." dosya=".$nFiles." en yeni=".($newest ? gmdate('Y-m-d H:i', $newest).'Z' : '-')."\n";
              echo "  bos disk=".round((float)@disk_free_space($doc)/1048576)." MB\n";
              $logs = array_values(array_unique(array_filter(
                [(string)ini_get('error_log'), $doc.'/error_log', $home.'/error_log', $doc.'/php_errorlog', $home.'/logs/error_log'],
                fn($p) => $p !== '' && is_file($p))));
              if (!$logs) echo "  error_log: bulunamadi (ini error_log='".ini_get('error_log')."')\n";
              foreach ($logs as $lf) {
                echo "  error_log ".$lf." (".round(filesize($lf)/1024)." KB) -- son 400 KB icinde:\n";
                $hits = ['exceeds' => [], 'doc' => []];
                $fh = fopen($lf, 'r');
                if ($fh) {
                  fseek($fh, max(0, filesize($lf) - 400000));
                  while (($ln = fgets($fh)) !== false) {
                    if (strpos($ln, 'exceeds the limit') !== false) $hits['exceeds'][] = trim($ln);
                    if (strpos($ln, '[VESTRA doc]') !== false)      $hits['doc'][] = trim($ln);
                  }
                  fclose($fh);
                }
                echo "    post_max_size asimi (PHP uyarisi): ".count($hits['exceeds'])." satir\n";
                foreach (array_slice($hits['exceeds'], -6) as $h) echo "       ".mb_substr($h, 0, 150)."\n";
                echo "    [VESTRA doc] ret kayitlari: ".count($hits['doc'])." satir\n";
                foreach (array_slice($hits['doc'], -10) as $h) echo "       ".mb_substr($h, 0, 150)."\n";
                $summary[] = "error_log: post_max asimi=".count($hits['exceeds']).", belge reddi=".count($hits['doc']);
              }
              $summary[] = "yukleme: CLI upload_max=".ini_get('upload_max_filesize').", post_max=".ini_get('post_max_size')
                         .", .user.ini=".(is_file($doc.'/.user.ini') ? 'VAR' : 'yok')
                         .", data/docs yazilabilir=".yn(is_dir($dd) && is_writable($dd)).", dosya=".$nFiles;
              echo "\n";
            }

            /* CANLI PHP HATALARI. error_log'daki "PHP Fatal/Warning/Notice/Deprecated"
               satirlari mesaj + dosya:satir bazinda gruplanir. Ayni satirin 400 kez
               tekrari tek bir kirigin belirtisi; 400 satiri okumak yerine 1 kaydi
               okumak yeter. Yollar ve adresler kisaltilir; e-posta basilmaz.
               Zaman damgasi Apache bicimi: [02-Sep-2026 13:10:00 UTC]. */
            if (getenv('IN_ERRLOG') === 'true') {
              echo "===== CANLI PHP HATALARI (error_log) =====\n";
              $logs = array_values(array_unique(array_filter(
                [(string)ini_get('error_log'), $doc.'/error_log', $home.'/error_log', $doc.'/php_errorlog'],
                fn($p) => $p !== '' && is_file($p))));
              $groups = []; $total = 0;
              foreach ($logs as $lf) {
                $fh = fopen($lf, 'r'); if (!$fh) continue;
                fseek($fh, max(0, filesize($lf) - 900000));
                while (($ln = fgets($fh)) !== false) {
                  if (!preg_match('/^\[([^\]]+)\]\s+PHP\s+(Fatal error|Warning|Notice|Deprecated|Parse error)(?:[^:]*):\s+(.*?)(?:\s+in\s+(\S+?)(?:\s+on line\s+(\d+))?)?\s*$/', trim($ln), $m)) continue;
                  $total++;
                  $file = isset($m[4]) ? preg_replace('#^.*/public_html/#', '', $m[4]) : '';
                  $msg  = preg_replace('/[a-f0-9]{16,}/', '<id>', $m[3]);              // hesap/ilan id'leri
                  $msg  = preg_replace('/\S+@\S+/', '<email>', $msg);                    // adres yazma
                  /* "headers already sent by (output started at /.../X.php:N)" gibi
                     mesajlarda asil bilgi 110. karakterden SONRA geliyor; kisa kesme
                     sebebi gizliyordu. Yol kisaltiliyor, mesaj 230 karaktere kadar. */
                  $msg  = preg_replace('#/home/[^/]+/public_html/#', '', $msg);
                  $key  = $m[2].' | '.mb_substr($msg, 0, 230).' | '.$file.(($m[5] ?? '') !== '' ? ':'.$m[5] : '');
                  if (!isset($groups[$key])) $groups[$key] = ['n'=>0, 'first'=>$m[1], 'last'=>$m[1]];
                  $groups[$key]['n']++; $groups[$key]['last'] = $m[1];
                }
                fclose($fh);
              }
              uasort($groups, fn($a, $b) => $b['n'] <=> $a['n']);
              echo "  kaynak: ".implode(', ', array_map(fn($p) => basename(dirname($p)).'/'.basename($p), $logs))." | eslesen satir: {$total} | farkli hata: ".count($groups)."\n";
              /* Gecici /tmp betikleri (workflow'lar) canli site degil: ayri sayilir, listelenmez. */
              $tmpN = 0; foreach ($groups as $k => $g) if (str_contains($k, '/tmp/')) $tmpN += $g['n'];
              echo "  (bunlarin {$tmpN} satiri /tmp/ altindaki gecici workflow betiklerinden -- listelenmiyor)\n";
              echo "  -- en sik (ilk 20) --\n";
              $i = 0;
              foreach ($groups as $k => $g) {
                if (str_contains($k, '/tmp/')) continue;
                if (++$i > 20) break;
                echo "  ".str_pad((string)$g['n'], 5, ' ', STR_PAD_LEFT)."x  ".$k."\n";
                echo "         ilk ".$g['first']." | son ".$g['last']."\n";
              }
              /* Asil is bu liste: SON 10 GUNDE gorulenler, en yeniden eskiye. Temmuz'da
                 duzeltilmis bir uyarinin 3000 tekrari, dun baslayan tek bir fatal'den
                 daha az onemli. */
              $recent = array_filter($groups, fn($g) => (strtotime(str_replace(' UTC', '', $g['last'])) ?: 0) >= time() - 10*86400);
              uasort($recent, fn($a, $b) => strcmp($b['last'], $a['last']));
              echo "  -- son 10 gunde gorulen (".count($recent).") --\n";
              $i = 0;
              foreach ($recent as $k => $g) {
                if (str_contains($k, '/tmp/')) continue;
                if (++$i > 45) { echo "  ... ".(count($recent) - 45)." daha\n"; break; }
                echo "  ".str_pad((string)$g['n'], 5, ' ', STR_PAD_LEFT)."x  ".mb_substr($k, 0, 150)."  [son ".$g['last']."]\n";
              }
              $fatal = 0; foreach ($groups as $k => $g) if (str_starts_with($k, 'Fatal') || str_starts_with($k, 'Parse')) $fatal += $g['n'];
              $summary[] = "error_log: {$total} hata satiri, ".count($groups)." farkli, FATAL={$fatal}";
              echo "\n";
            }

            echo "===== OZET =====\n";
            foreach ($summary as $s) echo "  · ".$s."\n";
            PHPEOF
            php -l /tmp/diag_msg.php
            php /tmp/diag_msg.php
            rm -f /tmp/diag_msg.php
