name: (Salt-okunur) Mesaj bildirimlerini teşhis et
on:
  workflow_dispatch:

permissions:
  contents: read

# Salt-okunur. "Okundu ama bildirim sönmüyor" hatasının kaynağı: panellerin
# hangi thread'i gösterdiği ile mark_read'in hangi thread için çağrıldığı.
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Kontrol et
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          script: |
            DOC="$HOME/public_html"
            echo "===== A) messages.php 1-94 ====="
            sed -n '1,94p' "$DOC/inc/messages.php" | cat -n
            echo
            echo "===== B) seller.php 380-430 ====="
            sed -n '380,430p' "$DOC/seller.php" | cat -n | sed 's/^ *\([0-9]*\)/[\1+379]/'
            echo
            echo "===== C) seller.php 1120-1185 ====="
            sed -n '1120,1185p' "$DOC/seller.php" | cat -n | sed 's/^ *\([0-9]*\)/[\1+1119]/'
            echo
            echo "===== D) buyer.php 140-190 ====="
            sed -n '140,190p' "$DOC/buyer.php" | cat -n | sed 's/^ *\([0-9]*\)/[\1+139]/'
            echo
            echo "===== E) buyer.php 575-620 ====="
            sed -n '575,620p' "$DOC/buyer.php" | cat -n | sed 's/^ *\([0-9]*\)/[\1+574]/'
            echo
            echo "===== F) tid degiskeni nerede belirleniyor ====="
            grep -n 'tid' "$DOC/seller.php" | head -25
            echo "--- buyer ---"
            grep -n 'tid' "$DOC/buyer.php" | head -25
            echo
            echo "===== G) inc/head.php 40-70 ====="
            sed -n '40,70p' "$DOC/inc/head.php" | cat -n | sed 's/^ *\([0-9]*\)/[\1+39]/'
            echo
            echo "===== H) MSG_UNREAD rozetinin cizildigi yerler ====="
            grep -rn 'MSG_UNREAD' "$DOC" --include='*.php' | head -20
