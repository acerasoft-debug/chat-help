name: (Salt-okunur) Mesaj bildirimlerini teşhis et
on:
  workflow_dispatch:

permissions:
  contents: read

# Salt-okunur. data/messages.json'daki her thread icin: son mesaj, okunma
# durumu (buyer/seller), karsi taraf hesabinin cozulup cozulemedigi + email'i
# var mi, ve vestra_msg_send()'in mail gonderme yolunu (mail_enabled/api/smtp)
# kontrol eder. Ayrica error_log'dan VESTRA Mail/API/SMTP satirlarini gosterir.
# Hicbir sey DEGISTIRMEZ, mesaj GONDERMEZ.
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Kontrol et
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          script: |
            cat > /tmp/diag_msg.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            register_shutdown_function(function(){
              $e = error_get_last();
              if ($e && in_array($e['type'],[E_ERROR,E_PARSE,E_CORE_ERROR,E_COMPILE_ERROR],true))
                fwrite(STDERR, "PHP OLUMCUL: {$e['message']} ({$e['file']}:{$e['line']})\n");
            });
            $home = getenv("HOME");
            $doc  = $home."/public_html";
            require $doc."/inc/auth.php";
            require $doc."/inc/notify.php";
            require $doc."/inc/messages.php";
            require $doc."/inc/products.php";

            echo "===== 'LES GARAGE' HESAP ARAMASI =====\n";
            $found = false;
            foreach (auth_accounts() as $a) {
              $hay = strtolower(($a['company']??'').' '.($a['name']??''));
              if (strpos($hay,'les garage') !== false) {
                $found = true;
                echo "  id=".($a['id']??'?')." | type=".($a['type']??'?')." | company=\"".($a['company']??'')."\" | name=\"".($a['name']??'')."\" | email=".($a['email']??'')."\n";
                echo "    stripe_account_id = ".(!empty($a['stripe_account_id'])?$a['stripe_account_id']:'*** YOK -- Connect onboarding yapilmamis ***')."\n";
              }
            }
            if (!$found) echo "  *** 'Les Garage' adinda hicbir HESAP bulunamadi (silinmis olabilir) ***\n";

            echo "\n===== dg-101202 canli listing durumu =====\n";
            $listing = vestra_listing_by_id('dg-101202');
            if ($listing) {
              echo "  seller_uid = ".($listing['seller_uid']??'(bos)')."\n";
              echo "  brand/name = ".($listing['brand']??'?')." / ".($listing['name']??'?')."\n";
              echo "  status     = ".($listing['status']??'?')."\n";
            } else {
              echo "  *** dg-101202 artik listings.json'da yok ***\n";
            }

            echo "===== MAIL AYARLARI =====\n";
            echo "mail_enabled     = ".(vestra_cfg('mail_enabled',false)?'true':'false')."\n";
            $apiKey = (string)vestra_cfg('mail_api_key','');
            echo "mail_api_provider= ".vestra_cfg('mail_api_provider','brevo')."\n";
            echo "mail_api_key     = ".($apiKey!==''?('SET, uzunluk='.strlen($apiKey)):'(bos)')."\n";
            echo "smtp_host        = ".((string)vestra_cfg('smtp_host','')!==''?vestra_cfg('smtp_host',''):'(bos)')."\n";
            echo "mail_from        = ".vestra_cfg('mail_from','support@vestrasales.com')."\n";
            $notifyList = vestra_cfg('notify',[]); if (is_string($notifyList)) $notifyList=[$notifyList];
            echo "notify (admin)   = ".implode(', ', (array)$notifyList)."\n\n";

            $accounts = auth_accounts();
            $byId = [];
            foreach ($accounts as $a) $byId[(string)($a['id']??'')] = $a;

            $threads = vestra_msg_threads();
            usort($threads, fn($a,$b) => strtotime($b['last_at']??'1970-01-01') <=> strtotime($a['last_at']??'1970-01-01'));
            echo "===== THREAD SAYISI: ".count($threads)." =====\n\n";

            foreach ($threads as $t) {
              $bUid = (string)($t['buyer_uid']??''); $sUid = (string)($t['seller_uid']??'');
              $msgs = $t['messages'] ?? [];
              $last = end($msgs);
              $lastFrom = $last ? ($last['from']??'?') : '(yok)';
              $lastText = $last ? mb_substr((string)($last['text']??($last['meta']['kind']??'')),0,60) : '';
              $lastAt   = $last['at'] ?? '';

              echo "--- thread ".($t['id']??'?')." | listing=".($t['listing_id']??'')." | son=".($t['last_at']??'')." ---\n";
              echo "  mesaj sayisi: ".count($msgs)." | son gonderen: {$lastFrom} @ {$lastAt}\n";
              echo "  son metin: \"{$lastText}\"\n";

              foreach (['buyer'=>$bUid, 'seller'=>$sUid] as $role => $uid) {
                if ($uid === '') { echo "  [{$role}] uid bos\n"; continue; }
                $label = $uid === VESTRA_SUPPORT_UID ? 'VESTRA Support' : null;
                $acc = $byId[$uid] ?? null;
                $unread = vestra_msg_unread($t, $uid);
                $readSeen = $t['read'][$uid] ?? '(hic yok)';
                if ($label !== null) {
                  echo "  [{$role}] {$uid} = VESTRA Support (sentetik) | okunmamis={$unread}\n";
                } elseif ($acc === null) {
                  echo "  [{$role}] {$uid} = *** HESAP BULUNAMADI (silinmis/gecersiz uid) *** | okunmamis={$unread} | read[uid]=".json_encode($readSeen)."\n";
                } else {
                  $em = (string)($acc['email'] ?? '');
                  $nm = $acc['company'] ?: ($acc['name'] ?: '(isimsiz)');
                  echo "  [{$role}] {$uid} = \"{$nm}\" | email=".($em!==''?$em:'*** EMAIL YOK ***')." | okunmamis={$unread} | read[uid]=".json_encode($readSeen)."\n";
                }
              }
              echo "\n";
            }

            // Ask Brevo itself what happened to this address recently -- error_log only
            // records FAILURES (a 2xx send logs nothing), so silence there is not proof
            // of success. The provider's own event log is the only way to tell "sent
            // and delivered" apart from "sent but bounced/blocked/spam-filtered" apart
            // from "never actually reached Brevo".
            if ($apiKey !== '') {
              echo "\n===== BREVO OLAY GECMISI (acerasoft@gmail.com, son 3 gun) =====\n";
              $ch = curl_init('https://api.brevo.com/v3/smtp/statistics/events?'.http_build_query([
                'email'     => 'acerasoft@gmail.com',
                'startDate' => gmdate('Y-m-d', strtotime('-3 days')),
                'endDate'   => gmdate('Y-m-d'),
                'limit'     => 50,
              ]));
              curl_setopt_array($ch, [CURLOPT_RETURNTRANSFER=>true, CURLOPT_TIMEOUT=>20,
                CURLOPT_HTTPHEADER=>['api-key: '.$apiKey, 'Accept: application/json']]);
              $resp = curl_exec($ch); $code = curl_getinfo($ch, CURLINFO_HTTP_CODE); curl_close($ch);
              if ($code >= 200 && $code < 300) {
                $d = json_decode((string)$resp, true);
                $events = $d['events'] ?? [];
                if (!$events) echo "  (hic olay yok -- Brevo'ya hic ulasmamis olabilir)\n";
                foreach ($events as $ev) {
                  echo "  ".($ev['date']??'?')." | ".($ev['event']??'?')." | konu: ".mb_substr((string)($ev['subject']??''),0,70)."\n";
                }
              } else {
                echo "  HATA: Brevo events HTTP {$code}: ".mb_substr((string)$resp,0,200)."\n";
              }
            }
            PHPEOF
            php -l /tmp/diag_msg.php
            php /tmp/diag_msg.php
            echo; echo "===== SON MAIL LOG SATIRLARI (VESTRA Mail/API/SMTP/message) ====="
            for L in ~/public_html/error_log ~/error_log ~/logs/error_log; do
              if [ -f "$L" ]; then
                echo "-- $L --"
                grep -iE 'VESTRA (Mail|API|SMTP|Message)|not emailed' "$L" | tail -60
              fi
            done
            rm -f /tmp/diag_msg.php
