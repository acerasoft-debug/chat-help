name: (Salt-okunur) Mesaj bildirimlerini teşhis et
on:
  workflow_dispatch:

permissions:
  contents: read

# Mesajlar sekmesi açıldığında kullanıcının TÜM thread'lerini okundu işaretler.
# Bugün okundu işareti yalnızca bir thread'e tek tek tıklanınca yazılıyor; sipariş/
# teklif sistem kartları (from: 'system', metni boş) kimse tıklamadığı için rozeti
# kalıcı olarak yanık bırakıyordu.
#
# Güvenlik: her dosya önce yedeklenir, sonra yamalanır, sonra `php -l` ile denetlenir;
# sözdizimi hatası çıkarsa yedekten GERİ ALINIR. Yama bir kez uygulanır (idempotent).
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      APPLY: 'false'   # kuru calisma
    steps:
      - name: Uygula
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: APPLY
          script: |
            cat > /tmp/fix_unread.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $APPLY = ($argv[1] ?? 'false') === 'true';
            $doc   = getenv("HOME")."/public_html";
            $stamp = date('YmdHis');
            echo $APPLY ? "=== MOD: CANLIYA UYGULANIYOR ===\n\n" : "=== MOD: KURU CALISMA ===\n\n";

            $FUNC = <<<'PHPFN'

            /* Mark EVERY thread of $uid read. The Messages tab lists every conversation with
               its snippet, so opening the inbox is itself "seen". Without this the nav badge
               could only be cleared by opening each thread one at a time, and system status
               cards (order/offer, from 'system', no body text) that nobody has a reason to
               open kept it lit permanently. Writes only when something actually changed, so
               an idle page view costs no file write. */
            function vestra_msg_mark_all_read(string $uid): void {
                if ($uid === '') return;
                $threads = vestra_msg_threads();
                $changed = false;
                foreach ($threads as &$t) {
                    if (($t['buyer_uid'] ?? '') !== $uid && ($t['seller_uid'] ?? '') !== $uid) continue;
                    $n = count($t['messages'] ?? []);
                    if (($t['read'][$uid] ?? null) !== $n) { $t['read'][$uid] = $n; $changed = true; }
                }
                unset($t);
                if ($changed) vestra_msg_save_threads($threads);
            }
            PHPFN;

            $ANCHOR = "// Mark an opened thread read here, before head.php computes the nav badge below";
            $INSERT = "// Opening the Messages tab counts as reading the inbox: clear every thread of this\n"
                    . "// user, not only the one named in ?thread= . Otherwise system status cards nobody\n"
                    . "// opens keep the nav badge lit forever.\n"
                    . "if ((\$_GET['tab']??'')==='messages' && \$_SERVER['REQUEST_METHOD']==='GET' && !empty(\$_SESSION['uid'])) {\n"
                    . "    vestra_msg_mark_all_read(\$_SESSION['uid']);\n"
                    . "}\n";

            $targets = [
              'inc/messages.php' => ['kind' => 'func'],
              'seller.php'       => ['kind' => 'anchor'],
              'buyer.php'        => ['kind' => 'anchor'],
            ];
            $written = [];
            $fail = false;

            foreach ($targets as $rel => $spec) {
                $path = $doc.'/'.$rel;
                if (!is_file($path)) { echo "ATLANDI (yok): {$rel}\n"; continue; }
                $src = file_get_contents($path);

                if (strpos($src, 'vestra_msg_mark_all_read') !== false) {
                    echo "ZATEN YAMALI: {$rel}\n";
                    continue;
                }

                if ($spec['kind'] === 'func') {
                    $new = rtrim($src, "\n")."\n".$FUNC."\n";
                    echo "YAMA: {$rel} — vestra_msg_mark_all_read() eklenecek (dosya sonuna)\n";
                } else {
                    $pos = strpos($src, $ANCHOR);
                    if ($pos === false) { echo "!! CAPA BULUNAMADI: {$rel} — dokunulmadi\n"; $fail = true; continue; }
                    $lineStart = strrpos(substr($src, 0, $pos), "\n");
                    $lineStart = $lineStart === false ? 0 : $lineStart + 1;
                    $new = substr($src, 0, $lineStart).$INSERT.substr($src, $lineStart);
                    echo "YAMA: {$rel} — Mesajlar sekmesinde hepsini okundu isaretleyen blok eklenecek\n";
                }

                if (!$APPLY) { echo "  (kuru calisma — yazilmadi)\n"; continue; }

                $bak = $path.'.bak-'.$stamp;
                if (!copy($path, $bak)) { echo "  !! YEDEK ALINAMADI, atlandi\n"; $fail = true; continue; }
                file_put_contents($path, $new);
                $out = []; $rc = 0;
                exec('php -l '.escapeshellarg($path).' 2>&1', $out, $rc);
                if ($rc !== 0) {
                    copy($bak, $path);
                    echo "  !! SOZDIZIMI HATASI — GERI ALINDI:\n     ".implode("\n     ", $out)."\n";
                    $fail = true;
                } else {
                    echo "  ✓ yazildi ve dogrulandi (yedek: ".basename($bak).")\n";
                    $written[] = $rel;
                }
            }

            echo "\n===== OZET =====\n";
            echo $APPLY ? ("Yamalanan dosya: ".(count($written) ? implode(', ', $written) : 'yok')."\n")
                        : "Kuru calisma tamamlandi.\n";
            if ($fail) { echo "!! En az bir dosyada sorun cikti — yukariya bak.\n"; exit(1); }
            PHPEOF
            php -l /tmp/fix_unread.php
            php /tmp/fix_unread.php "$APPLY"
            rm -f /tmp/fix_unread.php
