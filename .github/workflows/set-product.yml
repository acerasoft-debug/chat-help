name: Tek tek ürün düzelt (kategori / fiyat / beden)
on:
  workflow_dispatch:
    inputs:
      file:
        description: "Düzeltme dosyası (repo kökünden yol, örn: product-fixes/balmain.json)"
        required: true
      dry_run:
        description: "true = SADECE ne değişeceğini yaz, KAYDETME"
        required: true
        default: "true"

permissions:
  contents: read

# set-prices.yml marka+kategori ile TOPLU calisir; 35 t-shirt'un icinden 5 tanesini
# ayirip Polos'a tasiyamaz. categories.yml ise sadece bir kategoriyi bir digerine
# komple birlestirir. Aradaki bosluk buydu: TEK TEK urunu hedefleyen bir arac.
#
# Dosya formati -- JSON dizisi, her eleman:
#   {"match":"XH16B005 BB04", "expect":1, "cat":"Polos", "price":"79.90",
#    "moq":"20", "sizes":"S×1 · M×3 · ...", "name":"...", "status":"approved"}
#
# match: once id/sku TAM eslesme denenir, bulunmazsa sku/gorsel adi/urun adi
#        icinde ALT DIZE olarak aranir (model kodu genelde dosya adindadir).
#        Buyuk/kucuk harf ve bosluk/tire farki onemsizdir.
# expect: bu match'in KAC urune uymasi gerektigi (varsayilan 1). Gercek sayi
#        farkliysa is DUSER. Ayni model kodu birden fazla renkte olabiliyor --
#        sessizce 4 urunu birden degistirmek yerine sayiyi acikca yazdiriyoruz.
#
# HEPSI ya da HICBIRI: tek bir satir bile cozulemezse hicbir sey kaydedilmez.
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dosyayı ve betiği oku, kodla
        env:
          RAW_FILE: ${{ github.event.inputs.file }}
        run: |
          set -e
          case "$RAW_FILE" in
            */../*|/*|*..*) echo "HATA: gecersiz yol"; exit 1 ;;
          esac
          [ -f "$RAW_FILE" ] || { echo "HATA: dosya yok: $RAW_FILE"; exit 1; }
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert isinstance(d,list) and d, 'JSON dizi degil/bos'; print(f'duzeltme satiri: {len(d)}')" "$RAW_FILE"
          echo "P_JSON=$(base64 -w0 < "$RAW_FILE")" >> "$GITHUB_ENV"
          # Uygulayici PHP artik bu workflow'un ICINDE degil, scripts/ altinda ayri
          # bir dosya. Sebebi teknik: gomulu heredoc buyudukce script: blogu tek bir
          # GitHub ifadesi olarak 21.000 karakter sinirini asti ve workflow HIC
          # ayristirilamaz oldu -- yani dosyaya her dogrulama eklendiginde araci
          # kirma riski vardi. Ayri dosya olarak ayrica php -l ile yerelde
          # denetlenebiliyor ve diff'i okunabiliyor.
          [ -f scripts/set_product.php ] || { echo "HATA: scripts/set_product.php yok"; exit 1; }
          php -l scripts/set_product.php
          echo "P_PHP=$(base64 -w0 < scripts/set_product.php)" >> "$GITHUB_ENV"

      - name: Uygula
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 10m
          script: |
            echo "ADIM 1: baglanti tamam"
            export P_JSON='${{ env.P_JSON }}'
            export P_PHP='${{ env.P_PHP }}'
            export P_DRY='${{ github.event.inputs.dry_run }}'
            echo "ADIM 2: P_JSON uzunluk=${#P_JSON}"
            printf '%s' "$P_PHP" | base64 -d > /tmp/vestra_setproduct.php
            php -l /tmp/vestra_setproduct.php
            # Cikis kodu ONCE yakalanip sonra donduruluyor. `php ...` ardindan gelen `rm`
            # onun kodunu eziyordu: bir PHP fatal'i bu adimi YESIL birakirdi ve rapor
            # "sorun yok" gibi okunurdu.
            php /tmp/vestra_setproduct.php; RC=$?
            rm -f /tmp/vestra_setproduct.php
            exit $RC