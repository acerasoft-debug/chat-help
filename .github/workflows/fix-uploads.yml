name: (Tek seferlik) uploads dogru checkout'tan senkron + deploy.sh dok
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Senkron + dok
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 3m
          script: |
            echo "== TUM vestra/uploads checkout adaylari (public_html haric) =="
            find "$HOME" -maxdepth 7 -type d -path '*/vestra/uploads' -not -path '*/public_html/*' 2>/dev/null | while read d; do
              echo "  $d  | yeni-amiri-var: $([ -f "$d/amiri/amiri-core-polo-black.png" ] && echo EVET || echo hayir)"
            done
            echo
            echo "== yeni dosyayi iceren AKTIF checkout'u bul =="
            SRC=$(find "$HOME" -maxdepth 8 -type f -name 'amiri-core-polo-black.png' -not -path '*/public_html/*' 2>/dev/null | head -1)
            echo "SRC=$SRC"
            if [ -n "$SRC" ]; then
              UPD=$(dirname "$(dirname "$SRC")")   # .../vestra/uploads
              echo "AKTIF uploads dizini: $UPD"
              rsync -a "$UPD/" "$HOME/public_html/uploads/" && echo "SENKRON OK: $UPD -> public_html/uploads"
              # eski adsiz amiri kareleri temizle (artik referans yok)
              rm -f "$HOME/public_html/uploads/amiri/amiri-core-polo-1.png" \
                    "$HOME/public_html/uploads/amiri/amiri-core-polo-2.png" \
                    "$HOME/public_html/uploads/amiri/amiri-core-polo-3.png" \
                    "$HOME/public_html/uploads/amiri/amiri-core-polo-4.png"
            else
              echo "UYARI: yeni amiri dosyasi hicbir checkout'ta yok"
            fi
            echo
            echo "== public_html/uploads/amiri (sonuc) =="
            ls -la "$HOME/public_html/uploads/amiri/" 2>&1
            echo
            echo "== deploy.sh (TAM) =="
            cat "$HOME/deploy.sh" 2>/dev/null || echo "okunamadi"
            echo
            echo "== dogrula: amiri gorsel diskte =="
            cat > /tmp/vck.php <<'PHPEOF'
            <?php $pub=getenv("HOME")."/public_html"; require $pub."/inc/products.php";
            foreach(vestra_products() as $p){ if(strcasecmp((string)($p["brand"]??""),"Amiri")!==0) continue;
              $on=0; foreach(($p["images"]??[]) as $im){ if(is_file($pub.$im)) $on++; }
              echo "  ".$p["id"]." gorsel_diskte=$on/".count($p["images"]??[])."\n"; }
            PHPEOF
            php /tmp/vck.php; rm -f /tmp/vck.php
