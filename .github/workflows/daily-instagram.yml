name: Günlük Instagram paylaşımı (@chathelpp)

# Her gün, her dil için konu bankasından sıradaki reel'i Instagram'a otomatik atar.
# Tamamen GitHub Actions'ta çalışır — sunucu/cPanel/host cron GEREKMEZ.
# Reel'ler jsDelivr CDN'den (content.json), token GitHub Secret'ta (IG_TOKEN).
#
# ⚠️ ZAMANLAMA SADECE DEFAULT BRANCH'TEN ÇALIŞIR. Bu dosyayı default branch'e
#    (charming-franklin) getir + repo Secret'ı IG_TOKEN'ı ekle. Sonra otomatik.
#    Elle test: Actions → bu workflow → "Run workflow" (lang seçebilirsin).

on:
  schedule:
    - cron: '0 7 * * *'    # DE ~08-09 CET
    - cron: '0 11 * * *'   # FR ~12-13 CET
    - cron: '0 12 * * *'   # EN ~12-13 UK
    - cron: '0 14 * * *'   # RU ~17 MSK
    - cron: '0 15 * * *'   # TR ~18 (UTC+3)
    - cron: '0 18 * * *'   # ES ~19-20 CET
  workflow_dispatch:
    inputs:
      lang:
        description: 'Dil (de/en/fr/tr/es/ru) — boş bırakırsan hepsi'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ig-post-${{ github.event.schedule || github.event.inputs.lang || 'all' }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reel yayınla
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          SCHEDULE: ${{ github.event.schedule }}
          LANG_IN: ${{ github.event.inputs.lang }}
        run: node scripts/ig-daily-post.mjs
