name: Günlük Instagram paylaşımı (@chathelpp)

# Her gün, her dil için konu bankasından sıradaki reel'i Instagram'a otomatik atar.
# Tamamen GitHub Actions'ta çalışır — sunucu/cPanel/host cron GEREKMEZ.
# Reel'ler jsDelivr CDN'den (content.json), token GitHub Secret'ta (IG_TOKEN).
#
# ⚠️ ZAMANLAMA SADECE DEFAULT BRANCH'TEN ÇALIŞIR. Bu dosya default branch'te
#    (charming-franklin) + repo Secret'ı IG_TOKEN ekli. Sonrası otomatik.
#    Elle test: Actions → bu workflow → "Run workflow" (lang seçebilirsin).
#
# SAATLER (UTC) — hepsi Türkiye öğle saatlerine denk gelsin diye kümelendi
# (TR = UTC+3). Böylece paylaşımları canlı takip edebilirsin. GitHub cron'u
# yoğunlukta birkaç dk gecikebilir; pencere 11:00–13:00 TR olacak şekilde bırakıldı.
# NOT: Buradaki cron dizeleri poster'daki SCHED2LANG ile BİREBİR aynı olmalı.

on:
  schedule:
    - cron: '0 8 * * *'    # TR  -> 11:00 TR
    - cron: '20 8 * * *'   # DE  -> 11:20 TR
    - cron: '40 8 * * *'   # EN  -> 11:40 TR
    - cron: '0 9 * * *'    # FR  -> 12:00 TR
    - cron: '20 9 * * *'   # ES  -> 12:20 TR
    - cron: '40 9 * * *'   # RU  -> 12:40 TR
  workflow_dispatch:
    inputs:
      lang:
        description: 'Dil (de/en/fr/tr/es/ru) — boş bırakırsan hepsi'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ig-post-${{ github.event.schedule || github.event.inputs.lang || 'all' }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reel yayınla
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          SCHEDULE: ${{ github.event.schedule }}
          LANG_IN: ${{ github.event.inputs.lang }}
        run: node scripts/ig-daily-post.mjs
