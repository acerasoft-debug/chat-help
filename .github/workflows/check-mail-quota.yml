name: (Mail) Brevo kota/plan durumu
on:
  workflow_dispatch:

permissions:
  contents: read

# Salt-okunur. Brevo hesabinin plan/kredi durumunu ve bugunku gonderim
# istatistiklerini dogrudan Brevo'nun kendi API'sinden ceker (GET istekleri,
# sunucuya SSH gerekmez -- runner'in kendisi internete cikabiliyor, ayni
# set-mail-key.yml'nin son adiminda oldugu gibi). Hicbir sey degistirmez,
# hicbir e-posta gondermez, key hicbir zaman log'a yazilmaz.
jobs:
  quota:
    runs-on: ubuntu-latest
    steps:
      - name: MAIL_API_KEY secret'ı var mı kontrol et
        run: |
          if [ -z "${{ secrets.MAIL_API_KEY }}" ]; then
            echo "::error::MAIL_API_KEY secret'ı tanımlı değil."
            exit 1
          fi

      - name: Hesap / plan / kredi durumu
        env:
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
        run: |
          echo "== HESAP / PLAN =="
          curl -sS "https://api.brevo.com/v3/account" \
            -H "api-key: ${MAIL_API_KEY}" -H "Accept: application/json" \
            -w "\nHTTP_CODE:%{http_code}\n"

      - name: Bugünkü gönderim istatistiği (Brevo tarafı)
        env:
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "== BUGUN (UTC ${TODAY}) - Brevo agregat rapor =="
          curl -sS "https://api.brevo.com/v3/smtp/statistics/aggregatedReport?startDate=${TODAY}&endDate=${TODAY}" \
            -H "api-key: ${MAIL_API_KEY}" -H "Accept: application/json" \
            -w "\nHTTP_CODE:%{http_code}\n"
