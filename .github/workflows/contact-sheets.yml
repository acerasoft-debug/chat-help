name: Görsel kontak sayfaları üret (kategori doğrulaması için)
on:
  workflow_dispatch:

permissions:
  contents: write

# Sunucudaki uploads/ görsellerinden ETIKETLI kontak sayfalari (montaj) uretir ve
# repoya isler. Amac: her urunun GERCEKTEN ne oldugunu (t-shirt mi, sweatshirt mi,
# boxer mi, mayo mu) fotografa bakarak dogrulayabilmek -- kategori klasor adindan
# tahmin edildigi icin yanlis siniflanan urunler var.
#
# Orijinaller ~180MB; repoya kucuk kucultulmus kareler halinde, sayfa basina 24
# gorsel ve altlarinda dosya adi (= model kodu) ile giriyor. Boylece ~11 sayfadan
# butun katalog gozle kontrol edilebiliyor.
jobs:
  sheets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/charming-franklin-1ynmuj

      # ubuntu-latest imajinda artik ImageMagick gelmiyor (montage da magick de
      # yok -- onceki calisma tam bu yuzden "ImageMagick yok" ile dustu).
      - name: ImageMagick kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          montage --version | head -1 || magick --version | head -1

      - name: Görselleri sunucudan çek ve kontak sayfası yap
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          TERM: dumb
        run: |
          set -e
          # Klasor listesi tek yerde: yeni bir Dropbox klasoru cekildiginde
          # buraya eklenir, hem indirme hem montaj dongusu ayni listeyi kullanir.
          FOLDERS="balmain balenciaga-burberry shorts-sweats dg-jeans givenchy"
          echo "klasorler: $FOLDERS"
          PORT="${SSH_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSHOPT="-i $HOME/.ssh/id_deploy -p $PORT -o BatchMode=yes -o StrictHostKeyChecking=no"

          mkdir -p raw
          for d in $FOLDERS; do
            mkdir -p "raw/$d"
            if ! ssh $SSHOPT "$SSH_USER@$SSH_HOST" "test -d ~/public_html/uploads/$d"; then
              echo "$d: sunucuda YOK, atlaniyor"; continue
            fi
            ssh $SSHOPT "$SSH_USER@$SSH_HOST" "cd ~/public_html/uploads/$d && tar -czf - ." | tar -xzf - -C "raw/$d"
            echo "$d: $(find raw/$d -type f | wc -l) dosya"
          done

          # ImageMagick 7'de `montage` ayri bir komut olarak gelmeyebiliyor;
          # varsa onu, yoksa `magick montage` kullaniyoruz. Hatalari ARTIK
          # yutmuyoruz -- ilk denemede `|| true` yuzunden hicbir sayfa
          # uretilmedigi halde is "basarili" gorunmustu.
          if command -v montage >/dev/null 2>&1; then MG="montage"
          elif command -v magick  >/dev/null 2>&1; then MG="magick montage"
          else echo "HATA: ImageMagick yok"; exit 1; fi
          echo "montaj komutu: $MG"
          rm -rf contact-sheets && mkdir -p contact-sheets
          # Her klasor icin: kucult, dosya adiyla etiketle, 6x4=24'luk sayfalar yap.
          for d in $FOLDERS; do
            [ -d "raw/$d" ] || continue
            i=0; page=1; batch=""
            for f in $(find "raw/$d" -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) | sort); do
              batch="$batch $f"
              i=$((i+1))
              if [ $((i % 24)) -eq 0 ]; then
                $MG $batch -label '%f' -tile 6x4 -geometry 200x200+6+6 \
                  -background white -fill black -pointsize 11 \
                  "contact-sheets/${d}-$(printf '%02d' $page).jpg"
                echo "  yazildi: ${d}-$(printf '%02d' $page).jpg (24 gorsel)"
                page=$((page+1)); batch=""
              fi
            done
            if [ -n "$batch" ]; then
              $MG $batch -label '%f' -tile 6x4 -geometry 200x200+6+6 \
                -background white -fill black -pointsize 11 \
                "contact-sheets/${d}-$(printf '%02d' $page).jpg"
              echo "  yazildi: ${d}-$(printf '%02d' $page).jpg (kalan)"
            fi
          done

          N=$(find contact-sheets -type f | wc -l)
          echo; echo "uretilen sayfa: $N"
          [ "$N" -gt 0 ] || { echo "HATA: hic sayfa uretilmedi"; exit 1; }
          ls -la contact-sheets/ | tail -n +2
          echo "toplam boyut: $(du -sh contact-sheets | cut -f1)"

      - name: Repoya işle
        run: |
          set -e
          git config user.name "acerasoft-debug"
          git config user.email "acerasoft@gmail.com"
          git add contact-sheets
          if git diff --cached --quiet; then echo "degisiklik yok"; exit 0; fi
          # Mesaji dosyaya yaziyoruz: cok satirli metni dogrudan git'e vermek
          # YAML blok girintisini bozuyor.
          {
            echo "Contact sheets for visual category verification"
            echo
            echo "Categories were inferred from the source folder, not from the products"
            echo "themselves, so t-shirts were filed as sweatshirts, boxers as sweatshirts"
            echo "and swimwear miscategorised. These labelled montages make every uploaded"
            echo "image checkable against its model code."
            echo
            echo "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          } > /tmp/cs_msg.txt
          git commit -q -F /tmp/cs_msg.txt
          git push origin claude/charming-franklin-1ynmuj
