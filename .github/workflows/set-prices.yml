name: Ürün fiyatı / beden serisi ayarla
on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Marka (örn: Dolce). * = TÜM ürünler"
        required: true
        default: "Dolce"
      cat:
        description: "Kategori (tam eşleşme, örn: T-Shirts / Polos / Jeans). Boş = markanın hepsi"
        required: false
        default: "T-Shirts"
      price:
        description: "Toptan fiyat EUR (örn: 49.90). Boş = fiyata dokunma"
        required: false
        default: ""
      moq:
        description: "En az alım adedi (örn: 20). Boş = dokunma"
        required: false
        default: ""
      sizes:
        description: "Beden serisi metni (örn: 44×1 · 46×2 · 48×2 · 50×2 · 52×2 · 54×1 · 10/seri). Boş = dokunma"
        required: false
        default: ""
      dry_run:
        description: "true = SADECE ne değişeceğini yaz, KAYDETME"
        required: true
        default: "true"

permissions:
  contents: read

# listings.json içindeki CANLI ürünlerin fiyat/MOQ/beden alanlarını topluca ayarlar.
# Ürünler sunucudaki listings.json'da durur (kodda değil), bu yüzden deploy ile
# değiştirilemezler -- bu iş için ayrı bir workflow gerekiyor.
#
# dry_run=true ile başlayın: hangi ürünün nesi değişecek diye satır satır yazar,
# hiçbir şeye dokunmaz. Çıktıyı doğruladıktan sonra dry_run=false ile tekrar çalıştırın.
# Kaydetmeden önce listings.json'un zaman damgalı yedeğini alır.
jobs:
  set-prices:
    runs-on: ubuntu-latest
    steps:
      # The beden serisi value contains spaces and multibyte characters ("S×1 · M×2 ·
      # ... 10/paket"). Passed straight through the ssh action's envs, the remote
      # export line is not safely quoted, so the shell chokes on it and script_stop's
      # set -e aborts the run BEFORE php is ever reached -- which is why the first
      # attempts died with exit 255 and produced no output whatsoever.
      #
      # Pack every input into one JSON blob and base64 it here instead. What crosses
      # the wire is then plain ASCII with no spaces or shell metacharacters. Values
      # reach this step through env:, never through shell interpolation of ${{ }},
      # so a quote in an input cannot break out into the runner's shell either.
      - name: Girdileri kodla
        env:
          RAW_BRAND: ${{ github.event.inputs.brand }}
          RAW_CAT: ${{ github.event.inputs.cat }}
          RAW_PRICE: ${{ github.event.inputs.price }}
          RAW_MOQ: ${{ github.event.inputs.moq }}
          RAW_SIZES: ${{ github.event.inputs.sizes }}
          RAW_DRY: ${{ github.event.inputs.dry_run }}
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import base64, json, os
          blob = {k: os.environ.get('RAW_'+k.upper(), '')
                  for k in ['brand','cat','price','moq','sizes','dry']}
          print('P_JSON=' + base64.b64encode(
              json.dumps(blob, ensure_ascii=False).encode('utf-8')).decode('ascii'))
          PY
          echo "kodlandi: $(echo "$P_JSON" | wc -c) bayt"

      - name: Fiyatları ayarla
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 10m
          script: |
            echo "ADIM 1: baglanti tamam"
            export P_JSON='${{ env.P_JSON }}'
            echo "ADIM 2: P_JSON uzunluk=${#P_JSON}"
            cat > /tmp/vestra_setprices.php <<'PHPEOF'
            <?php
            /* The host runs with display_errors off, so a fatal dies silently with exit
               255 and no output at all -- which is unreadable in CI. Force errors to
               stdout for this one-shot script. */
            ini_set('display_errors', '1');
            ini_set('display_startup_errors', '1');
            error_reporting(E_ALL);
            set_error_handler(function($no,$str,$file,$line){
              fwrite(STDERR, "PHP HATA: {$str} ({$file}:{$line})\n"); return false;
            });
            register_shutdown_function(function(){
              $e = error_get_last();
              if ($e && in_array($e['type'], [E_ERROR,E_PARSE,E_CORE_ERROR,E_COMPILE_ERROR], true)) {
                fwrite(STDERR, "PHP OLUMCUL: {$e['message']} ({$e['file']}:{$e['line']})\n");
              }
            });

            $home = getenv("HOME");
            $inc  = $home."/public_html/inc/products.php";
            if (!is_readable($inc)) { fwrite(STDERR, "HATA: {$inc} okunamadi\n"); exit(1); }
            require $inc;

            foreach (['vestra_listings','vestra_save_listings','vestra_data_dir'] as $fn) {
              if (!function_exists($fn)) { fwrite(STDERR, "HATA: {$fn}() tanimli degil\n"); exit(1); }
            }

            /* Inputs arrive as one base64'd JSON blob -- see the encode step for why. */
            $raw = (string)getenv("P_JSON");
            if ($raw === '') { fwrite(STDERR, "HATA: P_JSON bos -- girdiler ulasmadi\n"); exit(1); }
            $dec = base64_decode($raw, true);
            if ($dec === false) { fwrite(STDERR, "HATA: P_JSON base64 cozulemedi\n"); exit(1); }
            $in = json_decode($dec, true);
            if (!is_array($in)) { fwrite(STDERR, "HATA: P_JSON gecerli JSON degil: ".substr($dec,0,120)."\n"); exit(1); }

            $brand = trim((string)($in['brand'] ?? ''));
            $cat   = trim((string)($in['cat']   ?? ''));
            $price = trim((string)($in['price'] ?? ''));
            $moq   = trim((string)($in['moq']   ?? ''));
            $sizes = trim((string)($in['sizes'] ?? ''));
            $dry   = strtolower(trim((string)($in['dry'] ?? 'true'))) !== 'false';

            echo "girdiler: marka='{$brand}' kategori='{$cat}' fiyat='{$price}' moq='{$moq}'\n";
            echo "          beden='{$sizes}'\n";
            echo "          dry_run=".($dry ? 'EVET (yazmaz)' : 'HAYIR (YAZAR)')."\n\n";

            if ($brand === '') { fwrite(STDERR, "HATA: marka bos\n"); exit(1); }
            if ($price === '' && $moq === '' && $sizes === '') {
              fwrite(STDERR, "HATA: price/moq/sizes hepsi bos -- yapacak is yok\n"); exit(1);
            }
            // Reject a malformed price outright rather than writing 0.00 over real pricing.
            if ($price !== '' && (!is_numeric($price) || (float)$price <= 0)) {
              fwrite(STDERR, "HATA: gecersiz fiyat '{$price}'\n"); exit(1);
            }
            if ($moq !== '' && (!ctype_digit($moq) || (int)$moq < 1)) {
              fwrite(STDERR, "HATA: gecersiz MOQ '{$moq}'\n"); exit(1);
            }

            $all = vestra_listings();
            if (!count($all)) { fwrite(STDERR, "HATA: listings.json bos/okunamadi\n"); exit(1); }

            $hits = 0; $changes = 0;
            foreach ($all as $i => $p) {
              $b = (string)($p['brand'] ?? '');
              $c = (string)($p['cat'] ?? '');
              // '*' targets every listing. Sweeping with a single letter instead
              // silently skips anything whose brand lacks it -- an earlier run matched
              // only 73 of 94 that way and looked complete.
              if ($brand !== '*' && stripos($b, $brand) === false) continue;
              if ($cat !== '' && strcasecmp(trim($c), $cat) !== 0) continue;
              $hits++;
              $id = (string)($p['id'] ?? '?');
              $line = [];

              if ($price !== '') {
                $new = (float)$price;
                $old = $p['list'] ?? null;
                if ((float)$old !== $new) {
                  $line[] = "list ".($old === null ? '(yok)' : $old)." -> {$new}";
                  $all[$i]['list'] = $new;
                  // tiers drive the actual order price; leaving them stale would show one
                  // price and charge another. Rewrite every tier to match.
                  if (!empty($p['tiers']) && is_array($p['tiers'])) {
                    $n = 0;
                    foreach ($p['tiers'] as $ti => $t) {
                      // A tier that is not an array would fatal on ['price'] assignment.
                      if (!is_array($t)) { $line[] = "UYARI: tier[{$ti}] dizi degil, atlandi"; continue; }
                      $all[$i]['tiers'][$ti]['price'] = $new; $n++;
                    }
                    if ($n) $line[] = "tiers({$n}) -> {$new}";
                  }
                  $changes++;
                }
              }
              if ($moq !== '') {
                $new = (int)$moq; $old = $p['moq'] ?? null;
                if ((int)$old !== $new) {
                  $line[] = "moq ".($old === null ? '(yok)' : $old)." -> {$new}";
                  $all[$i]['moq'] = $new;
                  // First tier gates the minimum. Guard the shape: tiers may be keyed
                  // other than 0, or hold non-arrays, either of which would fatal.
                  if (!empty($all[$i]['tiers']) && is_array($all[$i]['tiers'])) {
                    $k = array_key_first($all[$i]['tiers']);
                    if (is_array($all[$i]['tiers'][$k] ?? null)) $all[$i]['tiers'][$k]['min'] = $new;
                  }
                  $changes++;
                }
              }
              if ($sizes !== '') {
                $old = (string)($p['sizes'] ?? '');
                if ($old !== $sizes) {
                  $line[] = "sizes '".($old === '' ? '(yok)' : $old)."' -> '{$sizes}'";
                  $all[$i]['sizes'] = $sizes;
                  $changes++;
                }
              }

              if ($line) echo "  {$id} | {$b} | {$c}\n      ".implode("\n      ", $line)."\n";
            }

            echo "\nfiltreye uyan urun: {$hits}\n";
            echo "degisecek alan: {$changes}\n";

            if (!$hits) {
              fwrite(STDERR, "\nUYARI: hicbir urun eslesmedi -- marka/kategori yazimini kontrol edin.\n");
              fwrite(STDERR, "Mevcut kategoriler:\n");
              $cats = [];
              foreach (vestra_listings() as $p) {
                if ($brand === '*' || stripos((string)($p['brand'] ?? ''), $brand) !== false) {
                  $cats[(string)($p['cat'] ?? '?')] = true;
                }
              }
              foreach (array_keys($cats) as $k) fwrite(STDERR, "  - {$k}\n");
              exit(1);
            }

            if ($dry) { echo "\nDRY RUN -- hicbir sey kaydedilmedi. Uygulamak icin dry_run=false.\n"; exit(0); }
            if (!$changes) { echo "\nDegisiklik yok -- kaydetmeye gerek kalmadi.\n"; exit(0); }

            // Timestamped backup before any write, so a wrong filter is recoverable.
            $dir = vestra_data_dir();
            $src = $dir.'/listings.json';
            $bak = $dir.'/listings.json.bak-'.gmdate('Ymd-His');
            if (!@copy($src, $bak)) { fwrite(STDERR, "HATA: yedek alinamadi, kaydetmiyorum\n"); exit(1); }
            echo "yedek: {$bak}\n";

            vestra_save_listings($all);

            // Read back and confirm the write actually landed.
            clearstatcache();
            $check = vestra_listings();
            if (count($check) !== count($all)) {
              fwrite(STDERR, "HATA: kayittan sonra urun sayisi degisti! yedek: {$bak}\n"); exit(1);
            }
            echo "KAYDEDILDI -- {$changes} alan guncellendi, {$hits} urun tarandi.\n";
            PHPEOF
            echo "ADIM 3: dosya yazildi ($(wc -l < /tmp/vestra_setprices.php) satir)"
            php -l /tmp/vestra_setprices.php
            echo "ADIM 4: sozdizimi tamam, calistiriliyor"
            php /tmp/vestra_setprices.php; RC=$?
            echo "ADIM 5: php cikis kodu=$RC"
            rm -f /tmp/vestra_setprices.php
            exit $RC
