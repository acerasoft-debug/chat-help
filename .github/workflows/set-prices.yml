name: Ürün fiyatı / beden serisi ayarla
on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Marka (örn: Dolce). * = TÜM ürünler"
        required: true
        default: "*"
      name_contains:
        description: "Sadece ADI bu parcayi iceren urunler (buyuk/kucuk harf duyarsiz). Unisex bir kategorinin icindeki kadin alt kumesi gibi durumlar icin: cat='Hoodies & Sweatshirts' + name_contains=Women's. Bos = ad suzgeci yok."
        required: false
        default: ""
      cat:
        # Default is empty ON PURPOSE. Actions substitutes the default whenever the
        # input arrives empty, so a non-empty default silently narrows every "all
        # categories" run to that one category -- a sweep meant for the whole
        # catalogue quietly touched only T-Shirts and still reported success.
        description: "Kategori (tam eşleşme, örn: T-Shirts / Polos). Boş veya * = TÜM kategoriler"
        required: false
        default: ""
      price:
        description: "Toptan fiyat EUR (örn: 49.90). Boş = fiyata dokunma"
        required: false
        default: ""
      list_price:
        # Ayri bir girdi cunku 'price' hem list'i hem kademeleri ayni degere yaziyor --
        # bu da indirimi sifirlar (vestra_discount list ile satis farkindan hesaplar).
        # Ustu cizili "onceki fiyat" istiyorsan burayi doldur: list buraya, kademeler
        # price'a gider ve urun mode='sale' olur.
        description: "Üstü çizili ESKİ fiyat EUR (örn: 129.00) — VEYA 'keep' yazarsan ürünün ŞU ANKİ fiyatı eski fiyat olur. Doldurulursa ürün İNDİRİMLİ gösterilir. Boş = indirim yok"
        required: false
        default: ""
      discount_pct:
        # Ayri girdi, 'price' ile karistirilmaz: 'price' TUM eslesen urunlere AYNI
        # mutlak rakami yazar (farkli baslangic fiyatlarinda "15% indirim" anlamina
        # gelmez -- 120 EUR'luk urunle 60 EUR'luk urun ayni "price" ile ikisi de ayni
        # sayiya duser). Bu girdi her urunun KENDI mevcut fiyatindan yuzde hesaplar.
        description: "Her urune KENDI mevcut fiyatindan yuzde indirim uygula (ör: 15). Mevcut fiyat 'was' (üstü çizili) olarak kalır, mode=sale olur -- indirim GÖRÜNÜR. price/list_price ile birlikte kullanılamaz. Boş = dokunma"
        required: false
        default: ""
      section:
        # Bolme (vitrin bolmesi) marka da kategori de DEGIL: 'underwear' bolmesinde
        # NBB'nin ic camasiri kategorileri duruyor, 'footwear'da Pili Perez'in
        # ayakkabilari. Marka ile suzmek yanlis kume verir (bir marka iki bolmede
        # olabilir), kategori ile suzmek ise bolme basina 8 ayri kosu demekti.
        description: "Bölme: premium / footwear / underwear. Boş = bölme süzgeci yok"
        required: false
        default: ""
      markup_pct:
        # discount_pct'in AYNASI DEGIL: indirim 'list'i taban alip degistirmiyordu
        # (bu yuzden iki kez calissa da sonuc ayni kaliyordu). ZAM boyle olamaz --
        # taban bugunku fiyattir ve zam onu degistirir, yani iki kosu UST USTE biner.
        # Bu yuzden ayri bir damga (markup_at/markup_pct) var: ayni yuzde 24 saat
        # icinde ikinci kez uygulanmaz, force=true demedikce.
        description: "Her ürünün KENDİ fiyatına yüzde ZAM (ör: 20). Kademeler ve üstü çizili fiyat aynı oranda yükselir, indirim yüzdesi korunur. price/list_price/discount_pct ile birlikte kullanılamaz"
        required: false
        default: ""
      force:
        description: "true = aynı zam 24 saat içinde ikinci kez uygulanabilsin (markup_pct damgasını yok say)"
        required: false
        default: "false"
      show_prices:
        # Actions gunlugu HERKESE ACIK. NBB katalogunun kar orani kayitli
        # (maliyet x 1.5), yani satis fiyatini basmak tedarikcinin maliyetini
        # de basar; katalog fiyatlari zaten kayit kapisinin arkasinda (KURAL 19).
        description: "true = zam satırlarında GERÇEK rakamları da yaz. Actions günlüğü herkese açık; kâr oranı bilinen bir katalogda fiyatı basmak tedarikçi maliyetini ele verir"
        required: false
        default: "false"
      size_step:
        description: "Koli/parti adimi (size_step): sepet adedi bu kata yuvarlar. MOQ ile birlikte dusun -- moq=20, step=8 birakirsaniz sepet 20'yi 24'e yuvarlar. Bos = dokunma."
        required: false
        default: ""
      moq:
        description: "En az alım adedi (örn: 20). Boş = dokunma"
        required: false
        default: ""
      sizes:
        description: "Beden serisi metni (örn: 44×1 · 46×2 · 48×2 · 50×2 · 52×2 · 54×1 · 10/seri). Boş = dokunma"
        required: false
        default: ""
      allow_offers:
        # Fiyatı GİZLEMEZ. Ürün fiyatlı kalır, altına "Teklif ver" paneli açılır
        # (ürün sayfasındaki hazır panel, $p['offers'] bayrağına bağlı). Zaten
        # mode=offer olan ürünler bu bayrağı almaz -- onlarda pazarlık zaten tek yol.
        description: "Teklif alma: yes = aç, no = kapat, boş = dokunma"
        required: false
        default: ""
      dry_run:
        description: "true = SADECE ne değişeceğini yaz, KAYDETME"
        required: true
        default: "true"

permissions:
  contents: read

# listings.json içindeki CANLI ürünlerin fiyat/MOQ/beden alanlarını topluca ayarlar.
# Ürünler sunucudaki listings.json'da durur (kodda değil), bu yüzden deploy ile
# değiştirilemezler -- bu iş için ayrı bir workflow gerekiyor.
#
# dry_run=true ile başlayın: hangi ürünün nesi değişecek diye satır satır yazar,
# hiçbir şeye dokunmaz. Çıktıyı doğruladıktan sonra dry_run=false ile tekrar çalıştırın.
# Kaydetmeden önce listings.json'un zaman damgalı yedeğini alır.
jobs:
  set-prices:
    runs-on: ubuntu-latest
    steps:
      # The beden serisi value contains spaces and multibyte characters ("S×1 · M×2 ·
      # ... 10/paket"). Passed straight through the ssh action's envs, the remote
      # export line is not safely quoted, so the shell chokes on it and script_stop's
      # set -e aborts the run BEFORE php is ever reached -- which is why the first
      # attempts died with exit 255 and produced no output whatsoever.
      #
      # Pack every input into one JSON blob and base64 it here instead. What crosses
      # the wire is then plain ASCII with no spaces or shell metacharacters. Values
      # reach this step through env:, never through shell interpolation of ${{ }},
      # so a quote in an input cannot break out into the runner's shell either.
      - name: Girdileri kodla
        env:
          RAW_BRAND: ${{ github.event.inputs.brand }}
          RAW_CAT: ${{ github.event.inputs.cat }}
          RAW_NAMEQ: ${{ github.event.inputs.name_contains }}
          RAW_PRICE: ${{ github.event.inputs.price }}
          RAW_LIST_PRICE: ${{ github.event.inputs.list_price }}
          RAW_DISCOUNT_PCT: ${{ github.event.inputs.discount_pct }}
          RAW_SECTION: ${{ github.event.inputs.section }}
          RAW_MARKUP_PCT: ${{ github.event.inputs.markup_pct }}
          RAW_FORCE: ${{ github.event.inputs.force }}
          RAW_SHOW_PRICES: ${{ github.event.inputs.show_prices }}
          RAW_MOQ: ${{ github.event.inputs.moq }}
          RAW_STEP: ${{ github.event.inputs.size_step }}
          RAW_SIZES: ${{ github.event.inputs.sizes }}
          RAW_OFFERS: ${{ github.event.inputs.allow_offers }}
          RAW_DRY: ${{ github.event.inputs.dry_run }}
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import base64, json, os
          blob = {k: os.environ.get('RAW_'+k.upper(), '')
                  for k in ['brand','cat','nameq','price','list_price','discount_pct','section',
                            'markup_pct','force','show_prices','moq','step','sizes','offers','dry']}
          print('P_JSON=' + base64.b64encode(
              json.dumps(blob, ensure_ascii=False).encode('utf-8')).decode('ascii'))
          PY
          # Uygulayici PHP artik bu workflow'un ICINDE degil, scripts/ altinda ayri
          # bir dosya -- set-product.yml ile ayni sebep: gomulu heredoc yerelde
          # php -l'den gecmiyor, diff'i okunmuyor ve TEST EDILEMIYOR. Zam
          # aritmetigi canli katalogun fiyatlarini yaziyor; kum havuzunda
          # kosturulabilir olmasi sart (tests/set_prices_markup_test.php).
          [ -f scripts/set_prices.php ] || { echo "HATA: scripts/set_prices.php yok"; exit 1; }
          php -l scripts/set_prices.php
          echo "P_PHP=$(base64 -w0 < scripts/set_prices.php)" >> "$GITHUB_ENV"
          echo "kodlandi: $(echo "$P_JSON" | wc -c) bayt"

      - name: Fiyatları ayarla
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 10m
          script: |
            echo "ADIM 1: baglanti tamam"
            export P_JSON='${{ env.P_JSON }}'
            export P_PHP='${{ env.P_PHP }}'
            echo "ADIM 2: P_JSON uzunluk=${#P_JSON}"
            printf '%s' "$P_PHP" | base64 -d > /tmp/vestra_setprices.php
            echo "ADIM 3: dosya yazildi ($(wc -l < /tmp/vestra_setprices.php) satir)"
            php -l /tmp/vestra_setprices.php
            echo "ADIM 4: sozdizimi tamam, calistiriliyor"
            php /tmp/vestra_setprices.php; RC=$?
            echo "ADIM 5: php cikis kodu=$RC"
            rm -f /tmp/vestra_setprices.php
            exit $RC
