name: maxsales.de'yi ek alan olarak bağla

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Alan adı"
        required: true
        default: "maxsales.de"
      docroot:
        description: "Kök dizin (public_html altında)"
        required: true
        default: "shop"
      dry_run:
        description: "true = sadece ne yapılacağını yaz"
        required: true
        default: "true"

permissions:
  contents: read

# NE YAPIYOR
# ----------
# 1) cPanel'de ek alan (addon domain) açar, kök dizinini public_html/shop yapar.
# 2) public_html/shop/uploads -> ../uploads bağını kurar.
# 3) Sonucu doğrular.
#
# (2) NEDEN GEREKLİ
# -----------------
# Uygulama /uploads/... yollarını DOCUMENT_ROOT'a göre çözüyor (vr_doc_root).
# Bugün site vestrasales.com/shop olarak sunulduğu için DOCUMENT_ROOT
# public_html; /uploads/x.jpg dosyası public_html/uploads/x.jpg oluyor.
# maxsales.de kendi köküne (public_html/shop) oturunca DOCUMENT_ROOT değişiyor
# ve aynı yol public_html/shop/uploads/x.jpg'yi arıyor — orada bir şey yok,
# bütün fotoğraflar kırılırdı. Sembolik bağ ikisini aynı dosyalara bakar
# hâle getiriyor; vestrasales.com/shop tarafı hiç etkilenmiyor.
#
# data/ İÇİN BAĞ YOK — BİLEREK
# ----------------------------
# vr_data_dir() DOCUMENT_ROOT'a değil uygulamanın kendi dizinine bakıyor
# (VR_ROOT/../data), yani her iki alanda da public_html/data'yı buluyor.
# Üstelik yeni kökün DIŞINDA kalıyor: sipariş ve müşteri dosyaları web'den
# istenemez. Oraya bağ koymak bunu bozardı.
#
# DNS
# ---
# Bu iş DNS'i DEĞİŞTİRMEZ. maxsales.de'nin A kaydı bu sunucuyu göstermiyorsa
# ek alan açılsa bile tarayıcı buraya gelmez. Ölçüldü: alan şu an Strato'da
# (NS docks01/shades01.rzone.de, A 81.169.145.64).
jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - name: Bağla
        uses: appleboy/ssh-action@v1.0.3
        env:
          D: ${{ github.event.inputs.domain }}
          R: ${{ github.event.inputs.docroot }}
          DRY: ${{ github.event.inputs.dry_run }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: D,R,DRY
          script: |
            set -u
            SUB="$(echo "$D" | cut -d. -f1)"
            DOC="public_html/$R"
            echo "alan      : $D"
            echo "alt ad    : $SUB"
            echo "kök dizin : $DOC"
            echo "kuru mu   : $DRY"
            echo

            echo "== 1) mevcut durum =="
            uapi --output=jsonpretty DomainInfo list_domains 2>&1 | grep -E 'addon|main|"' | head -20
            echo

            if [ ! -d "$HOME/$DOC" ]; then
              echo "HATA: $HOME/$DOC yok. Önce deploy çalışmalı."
              exit 1
            fi

            echo "== 2) uploads bağı =="
            LINK="$HOME/$DOC/uploads"
            if [ -L "$LINK" ]; then
              echo "  zaten bağ: $(readlink -f "$LINK")"
            elif [ -e "$LINK" ]; then
              echo "  UYARI: $LINK var ama sembolik bağ değil — dokunulmuyor."
              ls -ld "$LINK"
            else
              if [ "$DRY" = "true" ]; then
                echo "  [kuru] ln -s ../uploads $LINK"
              else
                ln -s ../uploads "$LINK" && echo "  kuruldu -> $(readlink -f "$LINK")"
              fi
            fi
            echo

            echo "== 3) ek alan =="
            if uapi --output=jsonpretty DomainInfo list_domains 2>/dev/null | grep -q "\"$D\""; then
              echo "  $D zaten tanımlı — atlandı."
            elif [ "$DRY" = "true" ]; then
              echo "  [kuru] uapi AddonDomain addaddondomain dir=$DOC newdomain=$D subdomain=$SUB"
            else
              uapi --output=jsonpretty AddonDomain addaddondomain \
                   dir="$DOC" newdomain="$D" subdomain="$SUB" 2>&1 | head -40
            fi
            echo

            echo "== 4) sonuç =="
            uapi --output=jsonpretty DomainInfo list_domains 2>&1 | grep -E 'addon_domains|"[a-z0-9.-]+\.[a-z]+"' | head -20
            echo
            ls -ld "$HOME/$DOC" "$HOME/$DOC/uploads" 2>&1 | sed 's/^/  /'

      - name: Alan şimdi ne döndürüyor
        if: always()
        env:
          D: ${{ github.event.inputs.domain }}
        run: |
          echo "DNS:"
          dig +short A "$D" | sed 's/^/  A  /'
          echo "HTTP:"
          for u in "http://$D/" "https://$D/"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$u" 2>/dev/null || echo "000")
            echo "  $u -> $code"
          done
          echo
          echo "Not: A kaydı bu sunucuyu göstermiyorsa ek alan tek başına yetmez."
