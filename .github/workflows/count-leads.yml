name: (Salt-okunur) Lead / email sayisi
on:
  workflow_dispatch:

permissions:
  contents: read

# Salt-okunur. leads.json'daki lead sayilarini ozetler: toplam, email olan/olmayan,
# ulkeye gore, serbest-saglayici vs isletme-domaini dagilimi. Hicbir e-posta / firma
# adi / adres YAZMAZ (yalnizca sayilar + ulke kodu). Hicbir sey degistirmez.
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - name: Say
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 2m
          script: |
            cat > /tmp/vcount.php <<'PHPEOF'
            <?php
            $home=getenv("HOME"); $pub=$home."/public_html";
            require $pub."/inc/leads.php";
            $leads = function_exists("vestra_leads") ? vestra_leads() : [];
            $total=count($leads); $withEmail=0; $noEmail=0; $byCountry=[]; $free=0; $biz=0;
            $freeList=["gmail.com","googlemail.com","hotmail.com","hotmail.de","hotmail.fr","outlook.com",
                       "outlook.de","yahoo.com","yahoo.de","yahoo.fr","gmx.net","gmx.de","gmx.at","web.de",
                       "icloud.com","aol.com","live.com","t-online.de","freenet.de","mail.com"];
            foreach($leads as $l){
              $e=strtolower(trim((string)($l["email"]??"")));
              $ok=$e!=="" && filter_var($e,FILTER_VALIDATE_EMAIL);
              if($ok){ $withEmail++; $d=substr(strrchr($e,"@"),1); if(in_array($d,$freeList,true)) $free++; else $biz++; }
              else $noEmail++;
              $c=strtoupper(trim((string)($l["country"]??""))); if($c==="") $c="?";
              $byCountry[$c]=($byCountry[$c]??0)+1;
            }
            arsort($byCountry);
            echo "== LEAD / EMAIL OZETI ==\n";
            echo "TOPLAM lead      : $total\n";
            echo "EMAIL OLAN       : $withEmail\n";
            echo "EMAIL OLMAYAN    : $noEmail\n";
            echo "  - isletme domaini      : $biz\n";
            echo "  - serbest (gmail/gmx..): $free\n";
            echo "-- ulkeye gore (sayi) --\n";
            foreach($byCountry as $c=>$n){ echo "  $c : $n\n"; }
            PHPEOF
            php /tmp/vcount.php; rm -f /tmp/vcount.php
