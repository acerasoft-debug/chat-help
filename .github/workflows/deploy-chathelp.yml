name: chat-help.com yayına al (site + Token/API backend)

# NOT: DEPLOY_* secret'ları VESTRA sunucusuna çıkıyor (vestrasales.com / sarvesto.com); chat-help.com
# orada barınmıyor (dry_run keşfi: aday 0). Bu workflow chat-help.com'un KENDİ bağlantısını kullanır:
#
# Hosting tespiti (run 38892339978): chat-help.com → 160.153.0.182 = GoDaddy (secureserver.net) paylaşımlı
# cPanel barındırma; MX smtp.secureserver.net, NS domaincontrol.com. SSH: GoDaddy → Hosting → Ayarlar → SSH Erişimi: Açık.
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#     CHATHELP_HOST      sunucu adı / IP           (ör. wp123.webpack.hosteurope.de)
#     CHATHELP_USER      SSH/SFTP kullanıcı adı
#     CHATHELP_SSH_KEY   özel anahtar (PEM)   —veya—   CHATHELP_PASSWORD  (şifre ile SSH/SFTP)
#     CHATHELP_PORT      (isteğe bağlı, varsayılan 22)
#   SSH yoksa FTP/FTPS:  CHATHELP_FTP_HOST, CHATHELP_FTP_USER, CHATHELP_FTP_PASSWORD
#
# GÜVENLİ: --delete YOK; mevcut uygulama (chat/auth.php, db.php, index.php) ASLA yazılmaz; yalnız yeni
# dosyalar kopyalanır; kök index.html önce yedeklenir (index.html.bak-<ts>).
#
# 1) dry_run=true  : hosting tespiti (DNS) + docroot keşfi (chat/auth.php içeren klasör) + plan. KOPYALAMAZ.
# 2) dry_run=false : kopyalar ve https://chat-help.com/chat/api.php/v1/sectors ile doğrular.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Dosyaların alınacağı dal (site/ + chat/*.php)"
        required: true
        default: "claude/chat-help-system-video-x0nofb"
      target:
        description: "Docroot (ör. ~/public_html veya /www/htdocs/w01abc/chat-help.com). 'auto' = chat/auth.php içeren tek klasörü bul"
        required: true
        default: "auto"
      dry_run:
        description: "true = sadece keşfet + planı yaz, KOPYALAMA"
        required: true
        default: "true"
      include_tools:
        description: "true = bekleyen tek-seferlik fix scriptlerini de kopyala (open-signup, mail-api, fix-geo, fix-mail)"
        required: true
        default: "true"
      secrets_prefix:
        description: "Secret ön eki (CHATHELP → CHATHELP_HOST vb.). Vestra bağlantısını denemek için DEPLOY"
        required: true
        default: "CHATHELP"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CH_HOST: ${{ secrets[format('{0}_HOST', github.event.inputs.secrets_prefix)] }}
      CH_USER: ${{ secrets[format('{0}_USER', github.event.inputs.secrets_prefix)] }}
      CH_KEY:  ${{ secrets[format('{0}_SSH_KEY', github.event.inputs.secrets_prefix)] }}
      CH_PASS: ${{ secrets[format('{0}_PASSWORD', github.event.inputs.secrets_prefix)] }}
      CH_PORT: ${{ secrets[format('{0}_PORT', github.event.inputs.secrets_prefix)] }}
      FTP_HOST: ${{ secrets[format('{0}_FTP_HOST', github.event.inputs.secrets_prefix)] }}
      FTP_USER: ${{ secrets[format('{0}_FTP_USER', github.event.inputs.secrets_prefix)] }}
      FTP_PASS: ${{ secrets[format('{0}_FTP_PASSWORD', github.event.inputs.secrets_prefix)] }}
      TOOLS: ${{ github.event.inputs.include_tools }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Dosyaları doğrula + PHP sözdizimi
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli sshpass lftp dnsutils > /dev/null
          [ -f site/index.html ] || { echo "::error::site/index.html yok"; exit 1; }
          for f in chat/tokens-lib.php chat/api.php chat/tokens-checkout.php chat/tokens-webhook.php; do
            [ -f "$f" ] || { echo "::error::$f yok"; exit 1; }; php -l "$f"; done
          if [ "$TOOLS" = "true" ]; then
            for f in chat/open-signup.php chat/mail-api.php chat/fix-geo.php chat/fix-mail.php; do [ -f "$f" ] && php -l "$f" || echo "(yok, atlandı) $f"; done
          fi

      - name: Hosting tespiti (DNS / sunucu başlığı)
        run: |
          set +e
          echo "--- chat-help.com A kaydı ---"; IP=$(dig +short chat-help.com A | head -1); echo "${IP:-?}"
          [ -n "$IP" ] && { echo "--- ters DNS ---"; dig +short -x "$IP"; }
          echo "--- www ---"; dig +short www.chat-help.com | head -3
          echo "--- MX ---"; dig +short chat-help.com MX | head -3
          echo "--- NS ---"; dig +short chat-help.com NS | head -3
          echo "--- HTTP başlıkları ---"; curl -sSI -m 15 https://chat-help.com/ | grep -iE '^(server|x-powered-by|via|cf-ray):' || echo "(başlık yok)"
          echo "--- Vestra (karşılaştırma) ---"; dig +short vestrasales.com A | head -1

      - name: Bağlantı türü
        id: mode
        run: |
          MODE=none
          if [ -n "$CH_HOST" ] && [ -n "$CH_USER" ] && [ -n "$CH_KEY" ]; then MODE=ssh-key
          elif [ -n "$CH_HOST" ] && [ -n "$CH_USER" ] && [ -n "$CH_PASS" ]; then MODE=ssh-pass
          elif [ -n "$FTP_HOST" ] && [ -n "$FTP_USER" ] && [ -n "$FTP_PASS" ]; then MODE=ftp
          fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "BAGLANTI: $MODE  (secret ön eki: ${{ github.event.inputs.secrets_prefix }})"
          if [ "$MODE" = none ]; then
            echo "::error::chat-help.com için bağlantı secret'ları yok. Ekle: ${{ github.event.inputs.secrets_prefix }}_HOST + _USER + (_SSH_KEY veya _PASSWORD) [+ _PORT]  —ya da—  ${{ github.event.inputs.secrets_prefix }}_FTP_HOST + _FTP_USER + _FTP_PASSWORD"
            exit 1
          fi
          if [ "$MODE" != ftp ]; then
            mkdir -p ~/.ssh; P="${CH_PORT:-22}"
            if [ "$MODE" = ssh-key ]; then
              printf '%s\n' "$CH_KEY" > ~/.ssh/id_deploy; chmod 600 ~/.ssh/id_deploy
              echo "SSHCMD=ssh -i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $P" >> $GITHUB_ENV
            else
              echo "SSHCMD=sshpass -e ssh -o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=20 -p $P" >> $GITHUB_ENV
              echo "SSHPASS=$CH_PASS" >> $GITHUB_ENV
            fi
            echo "SRV=$CH_USER@$CH_HOST" >> $GITHUB_ENV
          fi

      - name: Docroot keşfi (SSH)
        if: ${{ steps.mode.outputs.mode != 'ftp' }}
        id: disc
        run: |
          set -e
          OUT=$($SSHCMD "$SRV" '
            echo "HOME=$HOME  PWD=$(pwd)  HOST=$(hostname 2>/dev/null)"
            for d in ~/public_html ~/www ~/html ~/htdocs ~/httpdocs ~/web ~/*/ ~/public_html/*/ ~/www/*/ ~/domains/*/public_html ~/*/htdocs ~/*/httpdocs "$(pwd)" "$(pwd)"/*/; do
              d="${d%/}"; [ -f "$d/chat/auth.php" ] && echo "CANDIDATE:$d"
            done
            find ~ "$(pwd)" -maxdepth 5 -path "*/chat/auth.php" -not -path "*/.*" 2>/dev/null | sed "s#/chat/auth.php\$##; s#^#CANDIDATE:#"
            echo "--- ev dizini ---"; ls -la ~ 2>/dev/null | head -40
            echo "--- cPanel domainler ---"; (uapi --output=jsonpretty DomainInfo list_domains 2>/dev/null | head -60) || echo "(uapi yok)"
          ')
          echo "$OUT"
          CANDS=$(echo "$OUT" | grep '^CANDIDATE:' | sed 's/^CANDIDATE://' | sort -u)
          N=$(echo "$CANDS" | grep -c . || true)
          echo "aday sayisi: $N"; echo "$CANDS"
          T="${{ github.event.inputs.target }}"
          if [ "$T" = "auto" ]; then
            if [ "$N" -eq 1 ]; then T="$CANDS"; else echo "::warning::auto icin tam 1 aday gerekli (bulunan: $N). target'i elle ver."; fi
          fi
          echo "dest=$T" >> $GITHUB_OUTPUT
          echo "SECILEN DOCROOT: $T"

      - name: Docroot keşfi (FTP)
        if: ${{ steps.mode.outputs.mode == 'ftp' }}
        id: discftp
        run: |
          set -e
          export LFTP_PASSWORD="$FTP_PASS"
          OUT=$(lftp -u "$FTP_USER" --env-password "$FTP_HOST" -e "set ssl:verify-certificate no; set ftp:ssl-allow yes; set net:timeout 20; set net:max-retries 2; pwd; ls; find -d 4 . ; quit" 2>&1 || true)
          echo "$OUT" | head -200
          CANDS=$(echo "$OUT" | grep -E '/chat/auth\.php$' | sed 's#/chat/auth\.php$##; s#^\./##' | sort -u)
          N=$(echo "$CANDS" | grep -c . || true)
          echo "aday sayisi: $N"; echo "$CANDS"
          T="${{ github.event.inputs.target }}"
          if [ "$T" = "auto" ]; then
            if [ "$N" -eq 1 ]; then T="$CANDS"; else echo "::warning::auto icin tam 1 aday gerekli (bulunan: $N). target'i elle ver."; fi
          fi
          echo "dest=$T" >> $GITHUB_OUTPUT
          echo "SECILEN DOCROOT: $T"

      - name: Plan
        run: |
          echo "ref        : ${{ github.event.inputs.ref }}"
          echo "baglanti   : ${{ steps.mode.outputs.mode }}"
          echo "docroot    : ${{ steps.disc.outputs.dest }}${{ steps.discftp.outputs.dest }}"
          echo "dry_run    : ${{ github.event.inputs.dry_run }}"
          echo "kopyalanacak:"
          echo "  site/index.html                 -> DOCROOT/index.html   (eski: index.html.bak-<ts>)"
          echo "  chat/tokens-lib.php, api.php, tokens-checkout.php, tokens-webhook.php -> DOCROOT/chat/"
          [ "$TOOLS" = "true" ] && echo "  + chat/open-signup.php, mail-api.php, fix-geo.php, fix-mail.php (tek-seferlik, sonra sil)"
          echo "DOKUNULMAYAN: chat/auth.php, chat/db.php, chat/index.php ve diger tum mevcut dosyalar"

      - name: Sunucuya kopyala (SSH)
        if: ${{ github.event.inputs.dry_run != 'true' && steps.mode.outputs.mode != 'ftp' }}
        run: |
          set -e
          DEST="${{ steps.disc.outputs.dest }}"
          case "$DEST" in auto|"") echo "::error::docroot belirlenemedi; target'i elle ver"; exit 1;; esac
          $SSHCMD "$SRV" "cd $DEST && ( [ -f index.html ] && cp index.html index.html.bak-\$(date +%Y%m%d-%H%M%S) || true ) && mkdir -p chat"
          rsync -az -e "$SSHCMD" site/index.html "$SRV:$DEST/index.html"
          rsync -az -e "$SSHCMD" chat/tokens-lib.php chat/api.php chat/tokens-checkout.php chat/tokens-webhook.php "$SRV:$DEST/chat/"
          if [ "$TOOLS" = "true" ]; then
            for f in chat/open-signup.php chat/mail-api.php chat/fix-geo.php chat/fix-mail.php; do [ -f "$f" ] && rsync -az -e "$SSHCMD" "$f" "$SRV:$DEST/chat/"; done
          fi
          $SSHCMD "$SRV" "cd $DEST && ls -la index.html index.php 2>/dev/null; ls chat/api.php chat/tokens-lib.php"
          echo "KOPYALAMA TAMAM -> $DEST"

      - name: Sunucuya kopyala (FTP)
        if: ${{ github.event.inputs.dry_run != 'true' && steps.mode.outputs.mode == 'ftp' }}
        run: |
          set -e
          DEST="${{ steps.discftp.outputs.dest }}"
          case "$DEST" in auto|"") echo "::error::docroot belirlenemedi; target'i elle ver"; exit 1;; esac
          export LFTP_PASSWORD="$FTP_PASS"; TS=$(date +%Y%m%d-%H%M%S)
          EXTRA=""; if [ "$TOOLS" = "true" ]; then for f in chat/open-signup.php chat/mail-api.php chat/fix-geo.php chat/fix-mail.php; do [ -f "$f" ] && EXTRA="$EXTRA put -O $DEST/chat $f;"; done; fi
          lftp -u "$FTP_USER" --env-password "$FTP_HOST" -e "set ssl:verify-certificate no; set ftp:ssl-allow yes; set net:timeout 30;
            cd $DEST; mv index.html index.html.bak-$TS || echo no-old-index; mkdir -p chat;
            put -O $DEST site/index.html;
            put -O $DEST/chat chat/tokens-lib.php; put -O $DEST/chat chat/api.php; put -O $DEST/chat chat/tokens-checkout.php; put -O $DEST/chat chat/tokens-webhook.php;
            $EXTRA
            ls $DEST/index.html; ls $DEST/chat/api.php; quit"
          echo "KOPYALAMA TAMAM (FTP) -> $DEST"

      - name: Canlı doğrulama
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set +e
          echo "--- /chat/api.php/v1/sectors ---"
          curl -sS -m 20 -o /tmp/s.json -w "HTTP %{http_code}\n" "https://chat-help.com/chat/api.php/v1/sectors"; head -c 300 /tmp/s.json; echo
          echo "--- / (yeni site?) ---"
          curl -sS -m 20 -o /tmp/i.html -w "HTTP %{http_code}\n" "https://chat-help.com/"; grep -o "KI, die" /tmp/i.html | head -1 && echo "YENI SITE CANLI ✓" || echo "kokte hala eski sayfa (index.php golgeliyor olabilir)"
