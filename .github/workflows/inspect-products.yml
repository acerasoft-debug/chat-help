name: (Salt-okunur) Ürün kataloğunu incele
on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Marka filtresi (boş = hepsi)"
        required: false
        default: "Lacoste"
      cat:
        description: "Kategori filtresi, tam eşleşme (boş = hepsi)"
        required: false
        default: ""
      name:
        description: "Ürün adında bu metni ara (alt dize, boş = hepsi) — marka/kategori bilinmeden ürün bulmak için"
        required: false
        default: ""

permissions:
  contents: read

# Salt-okunur. Katalog ürünlerini (demo + canlı listing) listeler: id, marka, ad, kategori,
# görsel sayısı/ilk görsel, varyant sayısı, demo mu canlı mı. Hiçbir şeyi DEĞİŞTİRMEZ.
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Ürünleri listele
        uses: appleboy/ssh-action@v1.0.3
        env:
          INSPECT_BRAND: ${{ github.event.inputs.brand }}
          INSPECT_CAT: ${{ github.event.inputs.cat }}
          INSPECT_NAME: ${{ github.event.inputs.name }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 3m
          envs: INSPECT_BRAND,INSPECT_CAT,INSPECT_NAME
          script: |
            cat > /tmp/vestra_inspect.php <<'PHPEOF'
            <?php
            $home = getenv("HOME");
            require $home."/public_html/inc/products.php";
            $bf = strtolower(trim((string)getenv("INSPECT_BRAND")));
            $cf = trim((string)getenv("INSPECT_CAT"));
            $nf = strtolower(trim((string)getenv("INSPECT_NAME")));
            foreach (vestra_products() as $p) {
              $brand = (string)($p['brand'] ?? '');
              if ($bf !== '' && $bf !== '*' && stripos($brand, $bf) === false) continue;
              if ($cf !== '' && strcasecmp(trim((string)($p['cat'] ?? '')), $cf) !== 0) continue;
              if ($nf !== '' && stripos((string)($p['name'] ?? ''), $nf) === false) continue;
              $imgs = [];
              if (!empty($p['images']) && is_array($p['images'])) $imgs = $p['images'];
              elseif (!empty($p['image'])) $imgs = [$p['image']];
              $demo = function_exists('vestra_is_demo_product') && vestra_is_demo_product((string)($p['id'] ?? '')) ? 'DEMO(kodda)' : 'canli-listing';
              $nv = !empty($p['variants']) && is_array($p['variants']) ? count($p['variants']) : 0;
              echo "id=".($p['id'] ?? '?')." | {$brand} | ".($p['name'] ?? '?')." | cat=".($p['cat'] ?? '?')." | mode=".($p['mode'] ?? '?')." | {$demo}\n";
              echo "   gorsel({$nv} varyant): ".(count($imgs) ? count($imgs)." adet, ilk=".$imgs[0] : "YOK")."\n";
              echo "   sku=".($p['sku'] ?? '(yok)')." | fiyat(list)=".($p['list'] ?? '?')." EUR | moq=".($p['moq'] ?? '?')." ".($p['unit'] ?? 'pc')."\n";
              echo "   sizes=".($p['sizes'] ?? '(yok)')."\n";
              if (!empty($p['tiers']) && is_array($p['tiers'])) {
                $t = [];
                foreach ($p['tiers'] as $tier) $t[] = ($tier['min'] ?? '?')."+ -> €".($tier['price'] ?? '?');
                echo "   tiers: ".implode(' | ', $t)."\n";
              }
            }
            PHPEOF
            php /tmp/vestra_inspect.php
            rm -f /tmp/vestra_inspect.php
