name: (Salt-okunur) Ürün kataloğunu incele
on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Marka filtresi — * = HEPSI. Boş bırakma: GitHub boş değeri 'verilmedi' sayıp varsayılanı uygular"
        required: false
        default: "*"
      cat:
        description: "Kategori filtresi, tam eşleşme (boş = hepsi)"
        required: false
        default: ""
      name:
        description: "Ürün adında bu metni ara (alt dize, boş = hepsi) — marka/kategori bilinmeden ürün bulmak için"
        required: false
        default: ""
      img_contains:
        description: "Görsel yolunda bu metin geçen ürünler (ör: balenciaga-burberry/) — kontak sayfası klasörüyle eşleştirmek için"
        required: false
        default: ""
      compact:
        description: "true = ürün başına TEK satır: id | cat | görsel-adı (uzun listeler kütük kuyruğuna sığsın)"
        required: false
        default: "false"
      check_images:
        description: "true = her görselin dosyası sunucuda GERÇEKTEN var mı, kontrol et"
        required: false
        default: "false"
      missing_only:
        description: "true = sadece görseli eksik/bozuk ürünleri yaz (check_images ile birlikte)"
        required: false
        default: "false"
      orphans:
        description: "true = uploads/ altında HİÇBİR ürüne bağlı olmayan görselleri listele + kök adı eşleşenleri 2. foto adayı olarak eşleştir"
        required: false
        default: "false"
      dims:
        description: "true = her ürünün görsellerinin piksel boyutunu ve dosya boyutunu yaz (kalite denetimi)"
        required: false
        default: "false"
      lang_scan:
        description: "true = ürün adı/kategori/beden/renk alanlarında TÜRKÇE metin ara (toptan liste İngilizce olmalı)"
        required: false
        default: "false"
      price_list:
        description: "true = toptan fiyat listesini sekmeyle ayrılmış olarak dök (marka, art.no, ad, kategori, beden, MOQ, toptan, perakende, kaynak)"
        required: false
        default: "false"

permissions:
  contents: read

# Salt-okunur. Katalog ürünlerini (demo + canlı listing) listeler: id, marka, ad, kategori,
# görsel sayısı/ilk görsel, varyant sayısı, demo mu canlı mı. Hiçbir şeyi DEĞİŞTİRMEZ.
#
# brand VARSAYILANI '*' (hepsi) -- eskiden 'Lacoste' idi ve bu sessiz bir tuzaktı:
# görsel denetimi brand='' ile çalıştırıldığında GitHub boş değeri "verilmedi" sayıp
# varsayılanı uyguladı, tarama 346 ürün yerine yalnız 12 Lacoste ürününe daraldı ve
# "TÜM FOTOLAR YERINDE" yazdı. Rapor doğruydu, kapsamı değildi. Denetim aracının
# varsayılanı dar olmamalı; tek marka isteyen adını yazar.
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Ürünleri listele
        uses: appleboy/ssh-action@v1.0.3
        env:
          INSPECT_BRAND: ${{ github.event.inputs.brand }}
          INSPECT_CAT: ${{ github.event.inputs.cat }}
          INSPECT_NAME: ${{ github.event.inputs.name }}
          INSPECT_IMGCHK: ${{ github.event.inputs.check_images }}
          INSPECT_IMGIN: ${{ github.event.inputs.img_contains }}
          INSPECT_COMPACT: ${{ github.event.inputs.compact }}
          INSPECT_MISSONLY: ${{ github.event.inputs.missing_only }}
          INSPECT_ORPHANS: ${{ github.event.inputs.orphans }}
          INSPECT_DIMS: ${{ github.event.inputs.dims }}
          INSPECT_LANG: ${{ github.event.inputs.lang_scan }}
          INSPECT_PLIST: ${{ github.event.inputs.price_list }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 3m
          envs: INSPECT_BRAND,INSPECT_CAT,INSPECT_NAME,INSPECT_IMGCHK,INSPECT_MISSONLY,INSPECT_IMGIN,INSPECT_COMPACT,INSPECT_ORPHANS,INSPECT_DIMS,INSPECT_LANG,INSPECT_PLIST
          script: |
            cat > /tmp/vestra_inspect.php <<'PHPEOF'
            <?php
            $home = getenv("HOME");
            $root = $home."/public_html";
            require $root."/inc/products.php";
            $bf = strtolower(trim((string)getenv("INSPECT_BRAND")));
            $cf = trim((string)getenv("INSPECT_CAT"));
            $nf = strtolower(trim((string)getenv("INSPECT_NAME")));
            $imgchk   = strtolower(trim((string)getenv("INSPECT_IMGCHK")))   === 'true';
            $missonly = strtolower(trim((string)getenv("INSPECT_MISSONLY"))) === 'true';
            /* Kontak sayfalari klasor klasor uretiliyor (ornegin uploads/balenciaga-burberry/),
               ama urunlerin markasi klasor adiyla ayni degil -- o klasorde dokuz marka var.
               Sayfayi canli satirlarla eslestirmenin tek dogru yolu GORSEL YOLU. */
            $imgin    = strtolower(trim((string)getenv("INSPECT_IMGIN")));
            /* Tek satirlik cikti: 94 urunluk bir klasor normal bicimde 376 satir eder ve
               Actions API kutugun yalnizca SONUNU verdigi icin bas taraf okunamaz olur. */
            $compact  = strtolower(trim((string)getenv("INSPECT_COMPACT"))) === 'true';
            $orphans  = strtolower(trim((string)getenv("INSPECT_ORPHANS"))) === 'true';
            $dims     = strtolower(trim((string)getenv("INSPECT_DIMS")))    === 'true';
            $langscan = strtolower(trim((string)getenv("INSPECT_LANG")))    === 'true';
            $plist    = strtolower(trim((string)getenv("INSPECT_PLIST")))   === 'true';

            /* Bir urunun gosterdigi TUM gorseller: kapak listesi, tekil 'image' ve her
               renk varyantinin kendi fotosu. Varyant fotolari da sayilmali -- katalogda
               renk secen alici tam onlari goruyor, ve /catalog xlsx'i her renk icin ayri
               satir uretirken yine onlari gomuyor. */
            $imagesOf = function(array $p): array {
              $out = [];
              if (!empty($p['images']) && is_array($p['images'])) foreach ($p['images'] as $i) $out[] = (string)$i;
              if (!empty($p['image'])) $out[] = (string)$p['image'];
              if (!empty($p['variants']) && is_array($p['variants'])) {
                foreach ($p['variants'] as $v) if (!empty($v['image'])) $out[] = (string)$v['image'];
              }
              $out = array_values(array_unique(array_filter($out, fn($s) => trim($s) !== '')));
              return $out;
            };
            /* '/uploads/..' web yolu -> diskteki dosya. Bos dosya da kayip sayilir:
               0 baytlik bir .jpg tarayicida kirik ikon olarak cikar, is_file ise true doner. */
            $probe = function(string $img) use ($root): string {
              $img = trim($img);
              if ($img === '') return 'bos';
              if (preg_match('#^https?://#i', $img)) return 'disURL';
              if ($img[0] !== '/') return 'gecersizYol';
              $f = $root.$img;
              if (!is_file($f)) return 'YOK';
              return (@filesize($f) > 0) ? 'ok' : 'BOSDOSYA';
            };

            $nProd = 0; $nImg = 0; $nBad = 0; $nProdBad = 0; $nProdNoImg = 0; $badList = [];
            foreach (vestra_products() as $p) {
              $brand = (string)($p['brand'] ?? '');
              if ($bf !== '' && $bf !== '*' && stripos($brand, $bf) === false) continue;
              if ($cf !== '' && strcasecmp(trim((string)($p['cat'] ?? '')), $cf) !== 0) continue;
              if ($nf !== '' && stripos((string)($p['name'] ?? ''), $nf) === false) continue;
              if ($imgin !== '') {
                $hit = false;
                foreach ($imagesOf($p) as $im) if (stripos($im, $imgin) !== false) { $hit = true; break; }
                if (!$hit) continue;
              }
              $nProd++;
              $imgs = [];
              if (!empty($p['images']) && is_array($p['images'])) $imgs = $p['images'];
              elseif (!empty($p['image'])) $imgs = [$p['image']];

              $bad = [];
              if ($imgchk) {
                $all = $imagesOf($p);
                $nImg += count($all);
                if (!count($all)) $nProdNoImg++;
                foreach ($all as $img) { $r = $probe($img); if ($r !== 'ok') { $bad[] = $r.'  '.$img; $nBad++; } }
                if ($bad) { $nProdBad++; $badList[] = [(string)($p['id'] ?? '?'), $brand, count($all), count($bad)]; }
                if ($missonly && !$bad) continue;
              }

              if ($compact) {
                printf("%-26s | %-22s | %s\n", (string)($p['id'] ?? '?'), (string)($p['cat'] ?? '?'),
                       count($imgs) ? basename((string)$imgs[0]) : '(gorsel yok)');
                foreach ($bad as $b2) echo "   KAYIP GORSEL: {$b2}\n";
                continue;
              }
              $demo = function_exists('vestra_is_demo_product') && vestra_is_demo_product((string)($p['id'] ?? '')) ? 'DEMO(kodda)' : 'canli-listing';
              $nv = !empty($p['variants']) && is_array($p['variants']) ? count($p['variants']) : 0;
              echo "id=".($p['id'] ?? '?')." | {$brand} | ".($p['name'] ?? '?')." | cat=".($p['cat'] ?? '?')." | mode=".($p['mode'] ?? '?')." | {$demo}\n";
              echo "   gorsel({$nv} varyant): ".(count($imgs) ? count($imgs)." adet, ilk=".$imgs[0] : "YOK")."\n";
              echo "   sku=".($p['sku'] ?? '(yok)')." | fiyat(list)=".($p['list'] ?? '?')." EUR | moq=".($p['moq'] ?? '?')." ".($p['unit'] ?? 'pc')."\n";
              echo "   sizes=".($p['sizes'] ?? '(yok)')."\n";
              if (!empty($p['tiers']) && is_array($p['tiers'])) {
                $t = [];
                foreach ($p['tiers'] as $tier) $t[] = ($tier['min'] ?? '?')."+ -> €".($tier['price'] ?? '?');
                echo "   tiers: ".implode(' | ', $t)."\n";
              }
              foreach ($bad as $b) echo "   KAYIP GORSEL: {$b}\n";
            }

            /* ── Bagsiz gorseller + 2. foto adaylari ────────────────────────────────
               Katalogda 346 urune karsilik 429 gorsel var, yani cogu urunde tek kare.
               Ikinci kareyi UYDURMAK yerine diskte zaten duran dosyalardan bulmak
               gerekiyor: bu bolum uploads/ altindaki her gorseli tarar, hicbir urune
               referans verilmemis olanlari ayirir ve kok adi eslesenleri aday olarak
               yazar.

               Eslesme kurali: dosya adinin sonundaki varyant ekini (-2, _2, -b, -back,
               -detail, -alt, -side, -flat, -model, " (1)") atinca geriye kalan kok,
               AYNI KLASORDEKI bir urun gorselinin koku ile birebir tutuyorsa aday sayilir.
               Ayni klasor sarti onemli: iki ayri markada "polo-white.jpg" bulunabiliyor ve
               klasor olmadan bunlar birbirine karisir.

               SALT OKUNUR -- hicbir sey yazmaz, sadece raporlar. */
            if ($orphans) {
              /* Urunler burada yeniden aliniyor. Ilk yazimda $all kullanilmisti; o ad bu
                 betikte gercekten var ama BASKA bir sey: goruntu denetimi dongusunun
                 icinde TEK bir urunun gorsellerini tutuyor, ve yalnizca check_images
                 acikken. Bu bolum check_images=false ile calistirilinca degisken hic
                 tanimlanmadi, PHP dongüyü sessizce bos gecti ve rapor "urune bagli: 0 /
                 olculen kare: 0" diye kendinden emin bir sifir tablosu bastı -- is yine
                 yesil dondu. Ayni adin iki anlami oldugu icin burada acik ad kullaniliyor. */
              $prods = vestra_products();
              $ref = [];                       // normalize edilmis yol => urun id
              foreach ($prods as $p2) {
                foreach ((array)($p2['images'] ?? []) as $im) {
                  $rel = '/'.ltrim(preg_replace('#^https?://[^/]+#', '', (string)$im), '/');
                  $ref[strtolower($rel)] = (string)($p2['id'] ?? '?');
                }
              }
              $stem = function(string $file): string {
                $b = strtolower(pathinfo($file, PATHINFO_FILENAME));
                $b = preg_replace('/\s*\(\d+\)$/', '', $b);
                /* Ayirici ZORUNLU. Once '[-_ ]?' yazilmisti ve bu, 'b' ile biten her adi
                   kirpiyordu: club -> clu, tab -> ta. Yanlis kirpilan bir kok baska bir
                   rengin karesiyle eslesir ve urun sayfasina yanlis giysi koyar -- 346
                   urun icinde fark edilmesi cok zor bir hata. Ayirici sart olunca
                   'polo2.jpg' gibi ayiricisiz varyantlar kaciyor; aday kaçirmak yanlis
                   aday uretmekten iyidir, cunku kaçani insan gozu bulur, yanlisi bulmaz. */
                /* p1/p2/p3 ve v1/v2 bu katalogun GERCEK duzeni -- ilk envanterde
                   balenciaga-612966-p1.jpg ve -p2.jpg gibi binlerce dosya "eslesmeyen"
                   kutusuna dustu, cunku kural bu ekleri tanimiyordu. Urunun kendisi
                   eksiz adi (balenciaga-612966.jpg) kullaniyor, ikinci karesi -p2 olarak
                   diskte zaten duruyor. */
                $b = preg_replace('/[-_ ](2|3|4|5|b|back|rueck|detail|alt|side|flat|model|zoom|close|p[1-9]|v[1-9])$/', '', $b);
                return $b;
              };
              $files = [];
              $dir = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root.'/uploads', FilesystemIterator::SKIP_DOTS));
              foreach ($dir as $f) {
                if (!$f->isFile()) continue;
                $ext = strtolower($f->getExtension());
                if (!in_array($ext, ['jpg','jpeg','png','webp','avif','gif'], true)) continue;
                if (strpos($f->getFilename(), 'sheet_') === 0) continue;   // satici line-sheet'leri urun gorseli degil
                /* .thumbs/ site'in kendi onbellegi: 3880 dosyanin neredeyse tamami oradan
                   geliyordu ve hicbiri ikinci kare adayi degil, hepsi zaten var olan bir
                   karenin kucultulmus kopyasi. Nokta ile baslayan her klasor elenir. */
                if (strpos($rel0 = str_replace('\\', '/', substr($f->getPathname(), strlen($root))), '/uploads/.') === 0) continue;
                $rel = '/uploads'.substr($f->getPathname(), strlen($root.'/uploads'));
                $files[] = str_replace('\\', '/', $rel);
              }
              sort($files);
              /* kok => ayni klasordeki referansli dosyalar */
              $byStem = [];
              foreach ($files as $rel) {
                if (!isset($ref[strtolower($rel)])) continue;
                $byStem[dirname($rel).'|'.$stem($rel)][] = $rel;
              }
              $orphanList = []; $cand = []; $nOrphan = 0;
              foreach ($files as $rel) {
                if (isset($ref[strtolower($rel)])) continue;
                $nOrphan++;
                $key = dirname($rel).'|'.$stem($rel);
                if (isset($byStem[$key])) {
                  $owner = $ref[strtolower($byStem[$key][0])] ?? '?';
                  $cand[$owner][] = $rel;
                } else {
                  $orphanList[] = $rel;
                }
              }
              echo "\n===== GORSEL ENVANTERI =====\n";
              printf("uploads/ altindaki gorsel: %d   urune bagli: %d   bagsiz: %d\n",
                     count($files), count($files) - $nOrphan, $nOrphan);
              printf("2. foto adayi bulunan urun: %d   toplam aday kare: %d\n",
                     count($cand), array_sum(array_map('count', $cand)));
              echo "\n-- 2. FOTO ADAYLARI (urun => diskte duran, kok adi eslesen kare) --\n";
              $shown = 0;
              foreach ($cand as $pid => $list) {
                if ($shown++ >= 60) { printf("  ... ve %d urun daha\n", count($cand) - 60); break; }
                printf("  %-30s %s\n", $pid, implode('  ', array_map('basename', $list)));
              }
              echo "\n-- BAGSIZ, ESLESMEYEN (ilk 40) --\n";
              foreach (array_slice($orphanList, 0, 40) as $o) echo "  {$o}\n";
              if (count($orphanList) > 40) printf("  ... ve %d dosya daha\n", count($orphanList) - 40);
            }

            /* ── Gorsel kalitesi ──────────────────────────────────────────────────────
               "Kaliteyi duzelt" demek once olcmek demek: hangi kare kucuk, hangisi
               asiri sikistirilmis. Urun sayfasindaki sahne 4:5 ve genis ekranda ~560px
               gosteriliyor, retina icin 1120px kenar gerekiyor -- 800px altindaki her
               kare orada yumusak cikar. */
            if ($dims) {
              $prods = vestra_products();
              $small = []; $tot = 0; $sum = 0;
              foreach ($prods as $p2) {
                foreach ((array)($p2['images'] ?? []) as $im) {
                  $rel = '/'.ltrim(preg_replace('#^https?://[^/]+#', '', (string)$im), '/');
                  $file = $root.$rel;
                  if (!is_file($file)) continue;
                  $inf = @getimagesize($file); if (!$inf) continue;
                  $tot++; $sum += max($inf[0], $inf[1]);
                  if (max($inf[0], $inf[1]) < 800)
                    $small[] = [(string)($p2['id'] ?? '?'), basename($rel), $inf[0], $inf[1], filesize($file)];
                }
              }
              echo "\n===== GORSEL KALITESI =====\n";
              printf("olculen kare: %d   ortalama uzun kenar: %d px\n", $tot, $tot ? (int)round($sum/$tot) : 0);
              printf("800px altinda (urun sayfasinda yumusak cikar): %d\n", count($small));
              foreach (array_slice($small, 0, 40) as $s2)
                printf("  %-28s %-34s %4dx%-4d  %d KB\n", $s2[0], substr($s2[1],0,34), $s2[2], $s2[3], (int)round($s2[4]/1024));
              if (count($small) > 40) printf("  ... ve %d kare daha\n", count($small) - 40);
            }

            /* ── Turkce metin taramasi ───────────────────────────────────────────────
               Toptan fiyat listesi yabanci alicilara gidiyor ve tamamen Ingilizce olmali.
               Urun verisi elle girildigi icin araya Turkce kelimeler karisabiliyor.

               IKI olcut birden: (1) Turkceye ozgu harfler -- c-cedilla, g-breve, noktasiz i,
               o/u-umlaut, s-cedilla; (2) bu harfleri TASIMAYAN yaygin kelimeler ("seri",
               "adet", "beden", "takim"...). Sadece harfe bakmak yetmez, cunku "seri" saf
               ASCII; sadece kelime listesine bakmak da yetmez, cunku liste asla tam olmaz.

               SALT OKUNUR. Bulduklarini yazar, hicbir seyi degistirmez -- ne yazilacagina
               insan karar verir, cunku "seri" bir yerde "series" bir yerde "set" demek. */
            if ($langscan) {
              $prods = vestra_products();
              $trChars = '/[\x{00E7}\x{00C7}\x{011F}\x{011E}\x{0131}\x{0130}\x{00F6}\x{00D6}\x{015F}\x{015E}\x{00FC}\x{00DC}]/u';
              /* Liste ilk turda 'paket'i kacirdi ve kelime 300'den fazla satirda
                 duruyordu ("10/paket"). Kelime listesiyle calisan bir tarama asla tam
                 olmaz -- bulunan her yeni ornek buraya eklenmeli, yoksa ayni bosluk
                 bir dahaki sefere de ayni yerde durur. */
              $trWords = ['seri','paket','koli','deste','cift','tane','kutu',
                          'adet','beden','renk','takim','yaka','kol','desen','baski','kumas',
                          'gomlek','pantolon','ceket','elbise','etek','canta','ayakkabi','kemer',
                          'mont','kaban','tisort','sort','mayo','erkek','kadin','cocuk','yeni',
                          'siyah','beyaz','lacivert','kirmizi','mavi','yesil','sari','gri','pembe'];
              $hits = [];
              foreach ($prods as $p2) {
                $fields = [
                  'name'   => (string)($p2['name'] ?? ''),
                  'cat'    => (string)($p2['cat'] ?? ''),
                  'sizes'  => (string)($p2['sizes'] ?? ''),
                  'desc'   => (string)($p2['desc'] ?? ''),
                  'colors' => implode(', ', array_filter((array)($p2['colors'] ?? []))),
                ];
                foreach ($fields as $fname => $val) {
                  if ($val === '') continue;
                  $why = [];
                  if (preg_match($trChars, $val)) $why[] = 'TR-harf';
                  /* Kelime sinirlariyla: "sort" kelimesi "shorts" icinde gecmesin,
                     "kol" da "colour" icinde. */
                  $plain = mb_strtolower($val);
                  foreach ($trWords as $w) {
                    if (preg_match('/(?<![a-z])'.preg_quote($w, '/').'(?![a-z])/u', $plain)) { $why[] = $w; }
                  }
                  if ($why) $hits[] = [(string)($p2['id'] ?? '?'), $fname, $val, implode(',', array_unique($why))];
                }
              }
              echo "\n===== TURKCE METIN TARAMASI =====\n";
              printf("taranan urun: %d   isaretlenen alan: %d\n", count($prods), count($hits));
              foreach (array_slice($hits, 0, 80) as $h)
                printf("  %-26s %-7s %-52s [%s]\n", $h[0], $h[1], mb_substr($h[2], 0, 52), $h[3]);
              if (count($hits) > 80) printf("  ... ve %d alan daha\n", count($hits) - 80);
              if (!$hits) echo "  Turkce metin bulunamadi.\n";
            }

            /* Ozet EN SONDA: kutuk cok uzarsa API yalnizca sonunu veriyor, bas taraf
               ulasilamaz oluyor. Karar verilecek sayi burada dursun. */
            if ($imgchk) {
              echo "\n===== GORSEL DENETIMI =====\n";
              printf("urun: %d   referans verilen gorsel: %d   kayip/bozuk: %d\n", $nProd, $nImg, $nBad);
              printf("en az bir gorseli kayip urun: %d   hic gorseli olmayan urun: %d\n", $nProdBad, $nProdNoImg);
              foreach ($badList as $b) printf("  %-26s | %-16s | %d gorselin %d'i kayip\n", $b[0], $b[1], $b[2], $b[3]);
              echo $nBad ? "SONUC: KIRIK FOTO VAR\n" : "SONUC: TUM FOTOLAR YERINDE\n";
            }

            /* ── Toptan fiyat listesi dokumu ────────────────────────────────────────
               /price-list sayfasinin TASIDIGI ayni satirlar, sekmeyle ayrilmis olarak.
               Amac sayfayi taklit etmek degil, ayni kaynaktan okunan veriyi bir kutuge
               sigacak bicimde disari vermek: 344 satirlik HTML 359 KB, bu ~35 KB.

               Perakende kurali sayfayla AYNI: urunun kendi 'rrp' alani varsa o, yoksa
               toptan x VESTRA_RETAIL_MULTIPLE ve satir "guide" diye isaretli. Carpani
               burada tekrar yazmiyoruz -- products.php'deki sabiti okuyor, yani liste
               ile sayfanin ayrilmasi mumkun degil. */
            if ($plist) {
              $mult = defined('VESTRA_RETAIL_MULTIPLE') ? (float)VESTRA_RETAIL_MULTIPLE : 3.0;
              echo "\n===== TOPTAN FIYAT LISTESI =====\n";
              echo "MARKA\tART.NO\tURUN\tKATEGORI\tBEDEN\tMOQ\tLISTE\tKADEME\tPERAKENDE\tKAYNAK\n";

              $rows = [];
              foreach (vestra_products() as $p2) {
                $bname = trim((string)($p2['brand'] ?? ''));
                $price = (float)($p2['list'] ?? $p2['price'] ?? 0);
                if ($bname === '' || $price <= 0) continue;
                /* Marka/kategori filtresine UYSUN. Ilk surum filtreyi yok sayip her
                   zaman 344 satir basiyordu: tek bir markaya bakmak isteyen kisi
                   butun katalogu aliyordu. */
                if ($brand !== '*' && stripos($bname, $brand) === false) continue;
                if ($cat !== '' && strcasecmp((string)($p2['cat'] ?? ''), $cat) !== 0) continue;
                $best = $price;
                foreach ((array)($p2['tiers'] ?? []) as $t) {
                  $tp = (float)($t['price'] ?? 0);
                  if ($tp > 0 && $tp < $best) $best = $tp;
                }
                $rrp  = (float)($p2['rrp'] ?? 0);
                $real = $rrp > 0;
                if (!$real) $rrp = $best * $mult;
                $id    = (string)($p2['id'] ?? '');
                $ident = trim((string)($p2['sku'] ?? ''));
                if ($ident === '') $ident = strtoupper(preg_replace('/^[a-z]{2,4}-/', '', $id));
                /* Liste fiyati ve kademe tabani AYRI sutunlar. Sayfa bugun kademe
                   varsa en dusugunu "from ..." diye gosteriyor; ikisini yan yana
                   gormeden hangisinin gosterildigini tartismak mumkun degil. */
                $rows[] = [$bname, $ident, (string)($p2['name'] ?? ''), (string)($p2['cat'] ?? ''),
                           (string)($p2['sizes'] ?? ''), ((string)($p2['moq'] ?? '')).' '.((string)($p2['unit'] ?? 'pc')),
                           number_format($price, 2, '.', ''),
                           $best < $price - 0.001 ? number_format($best, 2, '.', '') : '-',
                           number_format($rrp, 2, '.', ''),
                           $real ? 'RRP' : 'guide x'.number_format($mult, 0)];
              }
              usort($rows, fn($a, $b) => [strtolower($a[0]), strtolower($a[2])] <=> [strtolower($b[0]), strtolower($b[2])]);
              foreach ($rows as $r) echo implode("\t", $r)."\n";

              $realN = 0; $tierN = 0;
              foreach ($rows as $r) { if ($r[9] === 'RRP') $realN++; if ($r[7] !== '-') $tierN++; }
              printf("\nsatir: %d   gercek RRP: %d   tahmin (guide x%s): %d   kademeli fiyati olan: %d\n",
                     count($rows), $realN, number_format($mult, 0), count($rows) - $realN, $tierN);
            }
            PHPEOF
            php -l /tmp/vestra_inspect.php
            # Cikis kodu ONCE yakalanip sonra donduruluyor. `php ...` ardindan gelen `rm`
            # onun kodunu eziyordu: bir PHP fatal'i bu adimi YESIL birakirdi ve rapor
            # "sorun yok" gibi okunurdu. Bu tuzak bugun kupon isinde bir kez isledi.
            php /tmp/vestra_inspect.php; RC=$?
            rm -f /tmp/vestra_inspect.php
            exit $RC
