name: (Sipariş) "Eksik bilgi" e-postası gönder

# Kabul edilen bir teklif icin alicidan eksik bilgileri isteyen e-postayi gonderir.
# Icerik sunucudaki builder'da yasar (inc/email_templates.php ·
# vestra_tpl_order_details_needed) -- burada metin YOK, boylece test ile gercek
# gonderim BIREBIR ayni e-postayi uretir. Metni burada tutsaydim testi gecen sey
# ile aliciya gidenin ayni oldugunu garanti edemezdim.
#
# VARSAYILAN alici operatorun test kutusu. Aliciya gitmesi icin 'to' alanina
# onun adresi ACIKCA yazilmali -- yanlislikla musteriye gitmesi zor olsun.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Teklif referansı (offers.csv)"
        required: true
        default: "O39419"
      to:
        description: "Alıcı e-posta. Boş = operatörün test kutusu (acerasoft@gmail.com). Gerçek müşteriye gitmesi için adresini buraya YAZIN."
        required: false
        default: ""
      colours:
        description: "Renk dağılımı notu (ör: '10 x Black, 10 x White'). Boşsa yazılmaz."
        required: false
        default: ""
      missing:
        description: "İstenecek maddeler, virgülle: address,tax_id,incoterm,phone"
        required: false
        default: "address,tax_id,incoterm,phone"
      render_only:
        description: "true = GÖNDERME, sadece konu+gövdeyi günlüğe yaz"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: E-postayı üret ve gönder
        env:
          O_REF: ${{ github.event.inputs.ref }}
          O_TO: ${{ github.event.inputs.to }}
          O_COLOURS: ${{ github.event.inputs.colours }}
          O_MISSING: ${{ github.event.inputs.missing }}
          O_RENDER: ${{ github.event.inputs.render_only }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: O_REF,O_TO,O_COLOURS,O_MISSING,O_RENDER
          script: |
            cat > /tmp/vestra_order_details.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/notify.php";
            require_once $doc."/inc/auth.php";

            $ref = trim((string)getenv('O_REF'));
            if ($ref === '') { fwrite(STDERR, "ref yok\n"); exit(1); }

            $row = null;
            foreach (vestra_read_csv('offers.csv') as $r) if (($r['ref'] ?? '') === $ref) { $row = $r; break; }
            if (!$row) { fwrite(STDERR, "teklif bulunamadi: {$ref}\n"); exit(1); }

            /* Alici hesabi varsa ondan, yoksa teklif satirindan. Teklif her zaman bir
               is e-postasi topluyor, yani hesabi olmayan bir aliciya da yazabiliyoruz. */
            $acc = auth_find($row['email'] ?? '');
            $buyerName = trim((string)($row['company'] ?? '')) ?: trim((string)($acc['name'] ?? '')) ?: 'there';

            $missing = array_values(array_filter(array_map('trim', explode(',', (string)getenv('O_MISSING')))));
            $qty   = (int)($row['qty'] ?? 0);
            $unit  = (float)($row['offer_unit'] ?? 0);
            $total = (float)($row['offer_total'] ?? 0);

            [$subject, $body, $opts] = vestra_tpl_order_details_needed(
              $buyerName, (string)($row['product'] ?? ''), $ref, $qty, $unit, $total,
              trim((string)getenv('O_COLOURS')), $missing
            );

            $to = trim((string)getenv('O_TO'));
            if ($to === '') $to = 'acerasoft@gmail.com';   // varsayilan: operatorun test kutusu
            if (!filter_var($to, FILTER_VALIDATE_EMAIL)) { fwrite(STDERR, "gecersiz alici: {$to}\n"); exit(1); }

            echo "== KONU ==\n{$subject}\n\n== GOVDE ==\n{$body}\n\n";
            echo "alici: {$to}".($to === ($row['email'] ?? '') ? "   << GERCEK MUSTERI" : "   (test kutusu)")."\n";

            if (strtolower((string)getenv('O_RENDER')) === 'true') { echo "\nrender_only=true -- GONDERILMEDI\n"; exit(0); }

            $ok = vestra_send_mail($to, $subject, $body, 'support@vestrasales.com', 'VESTRA', null, '', $opts);
            echo $ok ? "\nGONDERILDI -> {$to}\n" : "\nGONDERILEMEDI (vestra_send_mail false dondu)\n";
            exit($ok ? 0 : 1);
            PHPEOF
            cd ~/public_html
            cp /tmp/vestra_order_details.php ./vestra_order_details_tmp.php
            php ./vestra_order_details_tmp.php
            rc=$?
            rm -f ./vestra_order_details_tmp.php /tmp/vestra_order_details.php
            exit $rc
