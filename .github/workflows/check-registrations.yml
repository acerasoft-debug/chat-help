name: Kayıt durumunu kontrol et (salt okunur)

# Elle tetiklenir. Sunucuda hiçbir şeyi DEĞİŞTİRMEZ -- sadece require_email_verify
# ayarını ve data/accounts.json içindeki hesap sayılarını/durumlarını okur.
# Gizlilik: başka müşterilerin e-posta/isim bilgileri bu (public repo'daki)
# log'a asla yazılmaz -- sadece tarih/durum/tip gibi PII içermeyen alanlar,
# ve ayrıca operatörün kendi (acerasoft@gmail.com) test hesabının detayı.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Brevo'da gerçek teslimat durumunu sorgula (GH runner'dan doğrudan, SSH gerekmez)
        env:
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
        run: |
          echo "== support@vestrasales.com icin son event'ler =="
          curl -sS "https://api.brevo.com/v3/smtp/statistics/events?limit=20&email=support%40vestrasales.com" \
            -H "api-key: ${MAIL_API_KEY}" -H "Accept: application/json" -w "\nHTTP_CODE:%{http_code}\n"
          echo ""
          echo "== genel son event'ler (son 20, herhangi bir alici) =="
          curl -sS "https://api.brevo.com/v3/smtp/statistics/events?limit=20" \
            -H "api-key: ${MAIL_API_KEY}" -H "Accept: application/json" -w "\nHTTP_CODE:%{http_code}\n"
          echo ""
          echo "== BUGUN Brevo uzerinden gonderilen TOPLAM e-posta (kampanya + islemsel) =="
          # Brevo'nun kendi sayaci: gunluk 300 limitine sayilan gercek rakam budur.
          TODAY=$(date -u +%F)
          curl -sS "https://api.brevo.com/v3/smtp/statistics/aggregatedReport?startDate=${TODAY}&endDate=${TODAY}" \
            -H "api-key: ${MAIL_API_KEY}" -H "Accept: application/json" -w "\nHTTP_CODE:%{http_code}\n"
          echo ""
          echo "== kayitli sender listesi (dogrulanmis mi degil mi) =="
          curl -sS "https://api.brevo.com/v3/senders" \
            -H "api-key: ${MAIL_API_KEY}" -H "Accept: application/json" -w "\nHTTP_CODE:%{http_code}\n"
          echo ""
          echo "== vestrasales.com domain dogrulama durumu (DNS kayitlari eklendi mi?) =="
          curl -sS "https://api.brevo.com/v3/senders/domains/vestrasales.com" \
            -H "api-key: ${MAIL_API_KEY}" -H "Accept: application/json" -w "\nHTTP_CODE:%{http_code}\n"

      - name: Sunucuda hesap durumunu oku
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            echo "== cPanel crontab (musteri bulma gunluk isi kurulu mu?) =="
            crontab -l 2>&1 || echo "(crontab bos ya da erisilemedi)"
            echo ""
            cat > /tmp/vestra_regcheck.php <<'PHPEOF'
            <?php
            $home = getenv("HOME");
            require $home."/public_html/inc/notify.php";

            echo "== require_email_verify ayari ==\n";
            $rv = vestra_cfg('require_email_verify', false);
            echo $rv ? "true (kayit, email dogrulanana kadar bekletiliyor)\n" : "false / tanimsiz (varsayilan -- kayit ANINDA calisiyor, email dogrulama beklenmiyor)\n";

            $f = $home."/public_html/data/accounts.json";
            $accs = is_readable($f) ? (json_decode(file_get_contents($f), true) ?: []) : [];
            if (!is_array($accs)) $accs = [];
            echo "\n== toplam hesap sayisi: " . count($accs) . " ==\n";

            $byStatus = [];
            $now = time();
            $recent2 = 0; $recent7 = 0;
            foreach ($accs as $a) {
              $st = $a['status'] ?? '(yok)';
              $byStatus[$st] = ($byStatus[$st] ?? 0) + 1;
              $created = strtotime($a['created'] ?? '');
              if ($created && ($now - $created) <= 2*86400) $recent2++;
              if ($created && ($now - $created) <= 7*86400) $recent7++;
            }
            echo "\nduruma gore dagilim:\n";
            foreach ($byStatus as $st => $c) echo "  {$st}: {$c}\n";
            echo "\nson 2 gunde olusturulan hesap: {$recent2}\n";
            echo "son 7 gunde olusturulan hesap: {$recent7}\n";

            $stuck = array_values(array_filter($accs, fn($a) => ($a['status'] ?? '') === 'pending_email'));
            echo "\npending_email durumunda (dogrulama linki hic tiklanmamis): " . count($stuck) . "\n";
            foreach ($stuck as $a) {
              $sentOk = array_key_exists('verify_sent_ok', $a) ? ($a['verify_sent_ok'] ? 'evet' : 'HAYIR (gonderim basarisiz olmus)') : '(hic denenmemis)';
              echo "  - olusturulma: " . ($a['created'] ?? '?') . " | tip: " . ($a['type'] ?? '?') . " | mail gonderildi mi: {$sentOk}\n";
            }

            $mine = null;
            foreach ($accs as $a) { if (strtolower($a['email'] ?? '') === 'acerasoft@gmail.com') { $mine = $a; break; } }
            echo "\n== acerasoft@gmail.com test hesabi ==\n";
            if ($mine) {
              echo "bulundu -- status: " . ($mine['status'] ?? '?') . " | tip: " . ($mine['type'] ?? '?') .
                   " | olusturulma: " . ($mine['created'] ?? '?') . " | email_verified: " . (!empty($mine['email_verified']) ? 'evet' : 'hayir') .
                   " | kyb_status: " . ($mine['kyb_status'] ?? '?') . "\n";
            } else {
              echo "boyle bir hesap yok.\n";
            }

            usort($accs, fn($x, $y) => strtotime($y['created'] ?? '') <=> strtotime($x['created'] ?? ''));
            echo "\n== son 10 hesap (sadece tarih/tip/durum -- isim/email yok) ==\n";
            foreach (array_slice($accs, 0, 10) as $a) {
              echo "  " . ($a['created'] ?? '?') . " | " . ($a['type'] ?? '?') . " | " . ($a['status'] ?? '?') . "\n";
            }

            echo "\n\n== musteri bulma (leads) durumu ==\n";
            echo "finder_key (Hunter.io/Anymailfinder) tanimli mi: " . (vestra_cfg('finder_key','')!=='' ? "EVET (".vestra_cfg('finder_provider','hunter').")" : "HAYIR -- sadece ucretsiz site-tarama fallback'i kullaniliyor") . "\n";
            $lf = $home."/public_html/data/leads.json";
            $leads = is_readable($lf) ? (json_decode(file_get_contents($lf), true) ?: []) : [];
            if (!is_array($leads)) $leads = [];
            echo "toplam lead sayisi: " . count($leads) . "\n";
            $withEmail = count(array_filter($leads, fn($l)=>($l['email']??'')!==''));
            $withWebsiteNoEmail = count(array_filter($leads, fn($l)=>($l['email']??'')==='' && ($l['website']??'')!==''));
            $noWebsiteNoEmail = count(array_filter($leads, fn($l)=>($l['email']??'')==='' && ($l['website']??'')===''));
            echo "email bulunmus: {$withEmail}\n";
            echo "website var ama email yok (bulunabilir aday): {$withWebsiteNoEmail}\n";
            echo "ne website ne email var (bulunamaz): {$noWebsiteNoEmail}\n";
            $prem = count(array_filter($leads, fn($l)=>!empty($l['premium'])));
            $premEmail = count(array_filter($leads, fn($l)=>!empty($l['premium']) && ($l['email']??'')!==''));
            echo "premium marka satan: {$prem} (bunlarin {$premEmail} tanesinde email de var -- kampanya onceligi)\n";
            $bySrc = []; $byStatusL = [];
            foreach ($leads as $l) {
              $s = $l['source'] ?? '(yok)'; $bySrc[$s] = ($bySrc[$s]??0)+1;
              $st = $l['status'] ?? '(yok)'; $byStatusL[$st] = ($byStatusL[$st]??0)+1;
            }
            echo "kaynaga gore:\n"; foreach ($bySrc as $s=>$c) echo "  {$s}: {$c}\n";
            echo "duruma gore:\n"; foreach ($byStatusL as $s=>$c) echo "  {$s}: {$c}\n";

            $cs = $home."/public_html/data/cron_status.json";
            $cron = is_readable($cs) ? (json_decode(file_get_contents($cs), true) ?: null) : null;
            echo "\nson otomasyon calismasi:\n";
            if ($cron) {
              echo "  tarih: " . ($cron['last_run'] ?? '?') . " | ulke: " . ($cron['country'] ?? '?') . " | tetikleyici: " . ($cron['trigger'] ?? '?') . "\n";
              echo "  bulunan: " . ($cron['found'] ?? 0) . " | eklenen: " . ($cron['added'] ?? 0) . " | email bulunan: " . ($cron['emails_found'] ?? 0) . "/" . ($cron['emails_checked'] ?? 0) . "\n";
              if (!empty($cron['note'])) echo "  not: " . $cron['note'] . "\n";
            } else {
              echo "  hic calismamis.\n";
            }

            echo "\n== supheli/garbled email adresleri (skip_emails icin tam byte'lar) ==\n";
            foreach ($leads as $l) {
              $e = (string)($l['email'] ?? '');
              if ($e !== '' && preg_match('/[^\x20-\x7E]|\*/', $e)) {
                echo "  company=" . json_encode($l['company'] ?? '', JSON_UNESCAPED_SLASHES) .
                     " email(json)=" . json_encode($e, JSON_UNESCAPED_SLASHES) .
                     " email(hex)=" . bin2hex($e) . "\n";
              }
            }

            echo "\n== henuz gonderilmemis leadler (ilk 40; tam sayi asagidaki OZET'te) ==\n";
            $pending = array_values(array_filter($leads, fn($l) =>
              ($l['status'] ?? '') !== 'contacted' && ($l['last_contacted_at'] ?? '') === '' && ($l['email'] ?? '') !== ''
            ));
            foreach (array_slice($pending, 0, 40) as $l) {
              echo "  * " . ($l['company'] ?? '?') . " | ulke=" . ($l['country'] ?? '-') .
                   " | category=" . (($l['category'] ?? '') !== '' ? $l['category'] : '(bos)') .
                   " | source=" . ($l['source'] ?? '?') . "\n";
            }
            if (count($pending) > 40) echo "  ... (+" . (count($pending) - 40) . " tane daha)\n";

            /* SUMMARY LAST: the pending list above can run to hundreds of lines and was pushing
               the counts out of the readable tail of the job log — the one number anyone opens
               this report for. Keep it at the very bottom. */
            $sent = 0; $notSent = 0; $unsub = 0;
            foreach ($leads as $l) {
              if (($l['status'] ?? '') === 'unsubscribed') { $unsub++; continue; }
              if (($l['last_contacted_at'] ?? '') !== '' || ($l['status'] ?? '') === 'contacted') $sent++; else $notSent++;
            }
            /* Kampanya e-postalarinin GUNE gore dagilimi. "Bugun kac gitti?" sorusunun
               cevabi tek toplam sayidan cikmiyor -- last_contacted_at damgasini gune
               gore saymak gerekiyor. */
            $byDay = [];
            foreach ($leads as $l) {
              $ts = (string)($l['last_contacted_at'] ?? '');
              if ($ts === '') continue;
              $d = substr($ts, 0, 10);
              if ($d !== '') $byDay[$d] = ($byDay[$d] ?? 0) + 1;
            }
            krsort($byDay);
            echo "\n== kampanya e-postasi gonderimi (gune gore, son 10 gun) ==\n";
            $today = date('Y-m-d');
            foreach (array_slice($byDay, 0, 10, true) as $d => $c) {
              echo "  {$d}: {$c}" . ($d === $today ? "   <-- BUGUN" : "") . "\n";
            }
            $todayCount = $byDay[$today] ?? 0;

            /* "Bunlar outlet miydi?" gibi sorulari veriyle cevaplamak icin: SON gonderilen
               batch'in (son 2 saat) kaynak/kategori dagilimi -- gonderim loglari kaynagi
               yazmiyor, bu yuzden last_contacted_at zaman damgasindan geriye dogru bakiyoruz. */
            echo "\n== SON GONDERIM (son 2 saat) -- kaynak/kategori dagilimi ==\n";
            $cutoff = time() - 2*3600;
            $recentSrc = []; $recentCat = []; $recentCount = 0;
            foreach ($leads as $l) {
              $ts = strtotime((string)($l['last_contacted_at'] ?? ''));
              if (!$ts || $ts < $cutoff) continue;
              $recentCount++;
              $s = $l['source'] ?? '(yok)'; $recentSrc[$s] = ($recentSrc[$s] ?? 0) + 1;
              $c = trim((string)($l['category'] ?? '')); $recentCat[$c !== '' ? $c : '(kategorisiz)'] = ($recentCat[$c !== '' ? $c : '(kategorisiz)'] ?? 0) + 1;
            }
            echo "son 2 saatte gonderilen: {$recentCount}\n";
            arsort($recentSrc);
            echo "kaynaga gore:\n"; foreach ($recentSrc as $s => $c) echo "  {$s}: {$c}\n";
            arsort($recentCat);
            echo "kategoriye gore:\n"; foreach ($recentCat as $c => $n) echo "  {$c}: {$n}\n";

            echo "\n\n================= OZET =================\n";
            echo "BUGUN gonderilen kampanya e-postasi: {$todayCount}\n";
            echo "TOPLAM lead                : " . count($leads) . "\n";
            echo "E-POSTA GONDERILDI (gercek): {$sent}\n";
            echo "henuz gonderilmedi         : {$notSent}\n";
            echo "abonelikten cikti          : {$unsub}\n";
            echo "========================================\n";
            PHPEOF
            php /tmp/vestra_regcheck.php
            rm -f /tmp/vestra_regcheck.php

      # SON adim olarak duruyor: Brevo cikti'si log'un okunabilir kuyrugunda kalsin.
      # Bastaki curl adimlarinin cikti'si, aradaki uzun PHP echo'sunun altinda kaliyor.
      - name: Brevo plan + kota (gunluk limit gercekten var mi?)
        env:
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
        run: |
          TODAY=$(date -u +%F)
          echo "== hesap plani (ucretsiz mi, odemeli mi -- gunluk 300 limiti buna bagli) =="
          curl -sS "https://api.brevo.com/v3/account" \
            -H "api-key: ${MAIL_API_KEY}" -H "Accept: application/json" -w "\nHTTP_CODE:%{http_code}\n"
          echo ""
          echo "== BUGUN (${TODAY}) Brevo uzerinden giden TOPLAM (kampanya + islemsel) =="
          curl -sS "https://api.brevo.com/v3/smtp/statistics/aggregatedReport?startDate=${TODAY}&endDate=${TODAY}" \
            -H "api-key: ${MAIL_API_KEY}" -H "Accept: application/json" -w "\nHTTP_CODE:%{http_code}\n"
          echo ""
          # Hard bounce = adres kalici olarak yok. Bu oran yukselince saglayici hesabi
          # askiya alir ve KAMPANYA ile birlikte siparis onayi / e-posta dogrulama da
          # kesilir. Asagidaki listeyi send-outreach'in mark_bounced girdisine verip
          # o leadleri olu isaretleyin -- bir daha denenmesinler.
          START=$(date -u -d '-7 days' +%F)
          echo "== HARD BOUNCE eden adresler (${START} .. ${TODAY}) — send-outreach > mark_bounced icin =="
          curl -sS "https://api.brevo.com/v3/smtp/statistics/events?event=hardBounces&startDate=${START}&endDate=${TODAY}&limit=500" \
            -H "api-key: ${MAIL_API_KEY}" -H "Accept: application/json" \
            | python3 -c 'import sys,json; e=json.load(sys.stdin).get("events") or []; a=sorted({(x.get("email") or "").strip().lower() for x in e if (x.get("email") or "").strip()}); print("tekil adres:",len(a)); print(", ".join(a))'

      # Gutschein sistemi CANLI kodda gercekten calisiyor mu + kayitli hangi musteriye
      # ne gidecek. Salt-okunur: kod URETMEZ, e-posta GONDERMEZ. Kendi test kodunu
      # bellekte degil gercek dosyada olusturup sonunda geri siler, cunku "deploy edilen
      # surum calisiyor mu" sorusunun cevabi ancak sunucudaki dosyalarla alinabilir.
      - name: Gutschein sistemi kendi kendini test etsin + kampanya önizlemesi (salt-okunur)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          script: |
            cd ~/public_html
            cat > /tmp/vestra_voucher_selftest.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            require_once __DIR__.'/inc/i18n.php';
            require_once __DIR__.'/inc/vouchers.php';

            $ok=0; $bad=0;
            $chk=function($label,$got,$want) use (&$ok,&$bad){
              $g=is_float($got)?number_format($got,2,'.',''):var_export($got,true);
              $w=is_float($want)?number_format($want,2,'.',''):var_export($want,true);
              if($g===$w){$ok++; echo "  ok   {$label} = {$g}\n";}
              else {$bad++; echo "  HATA {$label} = {$g} (beklenen {$w})\n";}
            };

            echo "== CANLI KOD KENDI KENDINI TEST EDIYOR ==\n";
            $TEST='VES-SELFTEST-DELETEME';
            $all=voucher_all(); $had=isset($all[$TEST]);
            voucher_create(['code'=>$TEST,'type'=>'percent','value'=>5,'email'=>'selftest@vestrasales.invalid',
                            'first_order_only'=>true,'max_uses'=>1,'expiry'=>date('Y-m-d',strtotime('+1 year')),
                            'campaign'=>'selftest']);

            $v=voucher_validate($TEST,'selftest@vestrasales.invalid',1000);
            $chk('gecerli kod kabul edildi', is_array($v), true);
            $chk('1000 uzerinden %5', is_array($v)?voucher_discount($v,1000):-1.0, 50.00);
            $chk('kucuk sepette %5 (10 EUR)', is_array($v)?voucher_discount($v,10):-1.0, 0.50);
            $chk('kurus yuvarlama (33.33 EUR)', is_array($v)?voucher_discount($v,33.33):-1.0, 1.67);

            /* Tavan kuralini YUZDE bir kuponla sinamak anlamsiz -- yuzde zaten sepeti asamaz,
               ilk surumde tam bu yuzden 0.50 cikip "hata" gibi gorundu. Kural sadece SABIT
               tutarli kuponda is yapiyor: 25 EUR'luk kupon 10 EUR'luk sepette 10 ile sinirli
               kalmali, yoksa siparis eksi bakiyeye duser. */
            $TESTF='VES-SELFTEST-FIXED-DELETEME';
            voucher_create(['code'=>$TESTF,'type'=>'fixed','value'=>25,'email'=>'',
                            'first_order_only'=>false,'max_uses'=>0,'expiry'=>date('Y-m-d',strtotime('+1 year')),
                            'campaign'=>'selftest']);
            $vf=voucher_find($TESTF);
            $chk('sabit 25 EUR indirimi', voucher_discount($vf,1000), 25.00);
            $chk('SABIT kupon sepeti asamaz', voucher_discount($vf,10), 10.00);
            $chk('baska musteriye kapali', voucher_validate($TEST,'someone@else.com',1000), 'wrong_customer');
            $chk('bilinmeyen kod', voucher_validate('YOK-YOK-YOK','selftest@vestrasales.invalid',1000), 'not_found');
            $chk('TEK KULLANIM: ilk redeem', voucher_redeem($TEST,'SELFTEST-REF','selftest@vestrasales.invalid',50.0), true);
            $chk('TEK KULLANIM: ikinci redeem reddedildi', voucher_redeem($TEST,'SELFTEST-REF2','selftest@vestrasales.invalid',50.0), false);
            $chk('kullanildiktan sonra dogrulanmiyor', voucher_validate($TEST,'selftest@vestrasales.invalid',1000), 'used');

            /* Test kodlarini birak: canli veride "selftest" diye bir kupon kalmamali. */
            $all=voucher_all(); unset($all[$TEST], $all[$TESTF]); voucher_save($all);
            $chk('test kodlari temizlendi', voucher_find($TEST)===null && voucher_find($TESTF)===null, true);

            echo "\nSONUC: {$ok} gecti, {$bad} kaldi\n\n";

            echo "== KAMPANYA ONIZLEMESI (hicbir sey uretilmez/gonderilmez) ==\n";
            $rep = voucher_welcome_run(['percent'=>5,'months'=>6,'audience'=>'buyers','limit'=>500,'dry'=>true]);
            echo "hedef musteri : {$rep['targets']}\n";
            echo "kampanya      : {$rep['campaign']}  ·  gecerlilik {$rep['expiry']}\n";
            $new=0;$retry=0;$already=0;
            foreach($rep['rows'] as $r){
              $s=(string)($r['status']??'');
              if($s==='new') $new++; elseif($s==='retry') $retry++; elseif($s==='already') $already++;
            }
            echo "yeni kod alacak: {$new}  ·  kodu var postasi gitmemis: {$retry}  ·  zaten almis: {$already}\n";
            /* Gizlilik: bu log public repoda duruyor. Musteri adresleri YAZILMAZ --
               sadece alan adi ve dil, kimin hedeflendigini gormeye yetiyor. */
            echo "\nhedefler (adres maskeli):\n";
            foreach($rep['rows'] as $r){
              $e=(string)($r['email']??''); if($e==='') continue;
              $at=strrpos($e,'@'); $dom=$at!==false?substr($e,$at+1):'?';
              printf("  %-10s %-28s dil=%s\n", (string)($r['status']??''), '***@'.$dom, (string)($r['lang']??'en'));
            }
            echo "\nHicbir kod uretilmedi, hicbir e-posta gonderilmedi.\n";
            exit($bad>0?1:0);
            PHPEOF
            cp /tmp/vestra_voucher_selftest.php ./vestra_voucher_selftest_tmp.php
            php ./vestra_voucher_selftest_tmp.php; RC=$?
            rm -f ./vestra_voucher_selftest_tmp.php /tmp/vestra_voucher_selftest.php
            exit $RC
