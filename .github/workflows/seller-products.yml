name: (Salt-okunur) Satıcının ürünlerini listele
on:
  workflow_dispatch:
    inputs:
      query:
        description: "Hesap arama metni (company/name içinde, virgülle birden fazla). BOŞ + brand doluysa marka modu."
        required: false
        default: ""
      brand:
        description: "Marka modu: bu markadaki TÜM ürünleri (hangi satıcıya ait olursa olsun) listeler"
        required: false
        default: ""
      admin_mode:
        description: "'keygen' = sunucuda şifreleme anahtarı üretir, public key'i yazar. 'apply' = payload'daki şifreli satıcı bilgilerini uygular. 'issue' = faturayı KESER (e-posta GÖNDERMEZ). 'currency' = faturanın para birimini KAYDA yazar. 'shipping' = siparişe navlun yazar (sipariş toplamı da güncellenir). 'seller' = faturayı KİMİN keseceğini kayda yazar (issue_ref=sipariş, payload='vestra'|hesap adı parçası|boş; birden fazla satıcılı sipariş böylece TEK belge olur, KURAL 5b). Üçü de numara yakmaz, belge üretmez, kimseye gitmez. 'order_draft' = SALT OKUNUR sipariş taslağı (hesap + fiyatlar + toplam; hiçbir şey yazmaz). 'order_write' = AYNI hesaplamayı yapar ve siparişi orders.csv'ye YAZAR (fatura KESMEZ, e-posta göndermez). 'dropship_on' / 'dropship_off' = tek adet dropship ÖDEMESİNİ açar/kapatır (Admin ▸ Dropship'teki anahtarın aynısı; yazma geri okunur). 'thread_seller' = konuşmayı başka satıcıya taşır (KURAL 19). 'offer_restore' = panelden SİLİNMİŞ bir teklifi kendi 'bak-del' yedeğinden geri yükler (issue_ref=teklif ref); offer_price verilirse AYNI koşuda karşı teklifi de işler ve MÜŞTERİYE MEKTUP GÖNDERİR — offer_apply=true demedikçe kuru koşu. Boş = sadece listeler."
        required: false
        default: ""
      issue_currency:
        description: "admin_mode=currency ile: fatura hangi para biriminde kesilsin (EUR|USD). Boş = seçimi KALDIR, sipariş kendi birimine döner. Panelin açılır listesiyle aynı kayıt (KURAL 5i)."
        required: false
        default: ""
      issue_shipping:
        description: "admin_mode=shipping ile: navlun. Siparişin KENDİ biriminde yazın (ör: 86.04), ya da fatura biriminde yazmak için sonuna kod ekleyin (ör: '100 USD') — kur siparişin damgasından okunur. Etiket için '|' ile ekleyin: '100 USD|Air freight'. Sipariş TOPLAMI da birlikte güncellenir."
        required: false
        default: ""
      payload:
        description: "admin_mode=apply için: sunucunun public key'i ile şifrelenmiş satıcı bilgisi (KEY.IV.GOVDE, rakamsız base64)"
        required: false
        default: ""
      issue_ref:
        description: "admin_mode=issue için: faturası kesilecek sipariş (ör: VES-CF0B4185). Numara verilir, PDF kaydedilir, MÜŞTERİYE E-POSTA GİTMEZ."
        required: false
        default: ""
      issue_redraft:
        description: "admin_mode=issue ile 'true': kesilmiş faturayı AYNI numarayla yeniden üretir. Sadece daha müşteriye gitmemiş bir belgedeki hatayı düzeltmek için."
        required: false
        default: "false"
      issue_number:
        description: "issue_redraft ile: faturanın sıra numarasını bu sayıya çeker (ör: 102 -> INV-2026-000102) ve satıcının sayacını oradan devam ettirir. Boş = numaraya dokunma."
        required: false
        default: ""
      move_to:
        description: "admin_mode=thread_seller: konusmalarin YENI saticisi — hesap uid'i ya da firma adindan bir parca (ör: tyrex)"
        required: false
        default: ""
      move_threads:
        description: "admin_mode=thread_seller: tasinacak thread id'leri (virgulle). 'ilan:<listing_id>' yazarsaniz O ILANIN tum thread'leri."
        required: false
        default: ""
      move_apply:
        description: "admin_mode=thread_seller: 'true' = KAYDET. Varsayilan kuru kosu — ne olacagini yazar, dosyaya dokunmaz."
        required: false
        default: "false"
      offer_price:
        description: "admin_mode=offer_restore: karşı teklif BİRİM fiyatı (ör: 100). Boş = yalnız kaydı geri yükle, teklif verme, MÜŞTERİYE HİÇBİR ŞEY GİTMEZ."
        required: false
        default: ""
      offer_apply:
        description: "admin_mode=offer_restore: 'true' = KAYDET (ve fiyat verildiyse karşı teklifi işleyip MÜŞTERİYE MEKTUP GÖNDER). Varsayılan kuru koşu."
        required: false
        default: "false"
      issue_pubkey:
        description: "admin_mode=issue için: kesilen PDF'in şifreleneceği RSA public key (PEM, base64). Depo herkese açık, PDF şifresiz dönmez."
        required: false
        default: ""

permissions:
  contents: read

# Salt-okunur. Iki mod:
#  - query doluysa: her hesap icin o hesabin seller_uid'sine sahip TUM urunler.
#  - brand doluysa: o markadaki TUM urunler + HANGI saticiya ait olduklari
#    (satici yoksa "demo/platform", varsa isim+id) -- toplu tasima oncesi
#    kapsami gormek icin.
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      # Satici kimligi ve banka bilgisi ICERI dogru sifreli tasinir.
      #
      # Neden: bu depo herkese acik, dolayisiyla Actions log'u ve calisma girdileri de
      # oyle ve kalici. Bir IBAN gizli bir sir degil -- her faturada zaten yaziyor -- ama
      # "su sirketin alacak hesabi bu" bilgisini herkese acik, indekslenen bir sayfada
      # birakmak fatura sahteciligi yapanlarin isini kolaylastirir. Bu yuzden sunucu bir
      # anahtar cifti uretiyor (keygen), ben bilgileri onun public key'i ile sifreliyorum,
      # log'da sadece sifreli metin duruyor.
      - name: Şifreleme anahtarı üret (keygen)
        if: ${{ github.event.inputs.admin_mode == 'keygen' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 3m
          script: |
            php -r '
              $f = getenv("HOME")."/.vestra_inbox_key.pem";
              if (!is_file($f)) {
                $k = openssl_pkey_new(["private_key_bits"=>3072,"private_key_type"=>OPENSSL_KEYTYPE_RSA]);
                openssl_pkey_export($k, $priv);
                file_put_contents($f, $priv); chmod($f, 0600);
                echo "yeni anahtar uretildi\n";
              } else { echo "anahtar zaten var, korunuyor\n"; }
              $priv = openssl_pkey_get_private((string)file_get_contents($f));
              $pub  = openssl_pkey_get_details($priv)["key"];
              echo "PUBKEY ".base64_encode($pub)."\n";
            '

      # NAVLUN (7 Eyl 2026). Panelin "🚚 Save shipping" kutusuyla AYNI yazıcı:
      # `vestra_order_set_shipping()` navlun ile sipariş TOPLAMINI birlikte
      # yazar, yazdığını geri okur ve faturası kesilmiş siparişi reddeder.
      # Numara yakmaz, belge üretmez, kimseye e-posta gitmez.
      #
      # Tutar siparişin kendi biriminde saklanır. Girdi "100 USD" gibi FATURA
      # biriminde verilirse buradaki tek bölme onu siparişin damgalı kuruyla
      # geri çevirir ve sonuç yazdırılır -- operatörün belgede göreceği rakamı
      # elle ters hesaplaması gerekmesin diye.
      - name: Sipariş taslağı / YAZIMI (order_draft = salt okunur, order_write = yazar)
        # Operator, 8 Eyl 2026: dort kalemlik bir siparis + fatura istendi
        # (secilen bedenler, dropship fiyati = toptan + %20, kargo 30 EUR).
        # KURAL 5 faturayi operator onayina bagliyor ve KURAL 5d kesimden ONCE
        # taslak gormeyi sart kosuyor; ustelik kodda ELLE siparis olusturma yolu
        # hic yok, yani once ne yazilacaginin rakamlari goruluyor.
        # Bu adim HICBIR SEY YAZMAZ: hesabi ve ilanlari okur, fiyatlari kodun
        # kendi fonksiyonundan (vestra_dropship_unit_price) turetir ve toplami
        # yazar. Rakami elle hesaplayip mektuba/faturaya koymak, bu deponun
        # tekrar tekrar kaydettigi hata.
        #   payload         : sku:beden:adet virgulle  (ornek: S74GD1399:M:1,662853TJW90:L:1)
        #   issue_shipping  : kargo EUR
        #   issue_ref       : hesabi bulmak icin AD parcasi (e-posta DEGIL -- girdi herkese acik)
        if: ${{ github.event.inputs.admin_mode == 'order_draft' || github.event.inputs.admin_mode == 'order_write' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          OD_LINES: ${{ github.event.inputs.payload }}
          OD_SHIP:  ${{ github.event.inputs.issue_shipping }}
          OD_WHO:   ${{ github.event.inputs.issue_ref }}
          OD_MODE:  ${{ github.event.inputs.admin_mode }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 4m
          envs: OD_LINES,OD_SHIP,OD_WHO,OD_MODE
          script: |
            set -e
            cat > /tmp/vestra_orddraft.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/auth.php";
            require_once $doc."/inc/money.php";
            require_once $doc."/inc/dropship.php";
            require_once $doc."/inc/orders.php";

            $mask = function (string $e): string {
                if ($e === '') return '-';
                $a = explode('@', $e, 2);
                return mb_substr($a[0], 0, 1).'***@'.($a[1] ?? '?');
            };

            /* 1. HESAP. E-posta girdiye yazilmaz (herkese acik); ad parcasiyla
               araniyor ve TEK esleme sart -- iki Negulescu varsa hangisi
               oldugunu tahmin etmek, faturayi yanlis kisiye kesmek olurdu. */
            $who = mb_strtolower(trim((string)getenv('OD_WHO')));
            $hits = [];
            if ($who !== '') {
                foreach (auth_accounts() as $a) {
                    $hay = mb_strtolower(($a['name'] ?? '').' '.($a['company'] ?? '').' '.($a['email'] ?? ''));
                    if (mb_strpos($hay, $who) !== false) $hits[] = $a;
                }
            }
            echo "== HESAP ==\n";
            if (count($hits) !== 1) {
                printf("  '%s' icin %d hesap bulundu -- tek esleme sart, DURDUM\n", $who, count($hits));
                foreach ($hits as $a) printf("    %s <%s>\n", (string)($a['company'] ?: ($a['name'] ?? '?')), $mask((string)($a['email'] ?? '')));
                exit(1);
            }
            $acc = $hits[0];
            printf("  %s <%s>\n", (string)($acc['company'] ?: ($acc['name'] ?? '?')), $mask((string)($acc['email'] ?? '')));
            printf("  tip=%s  durum=%s  kyb=%s  fiyat kapisi=%s\n",
                (string)($acc['type'] ?? '?'), (string)($acc['status'] ?? '?'), (string)($acc['kyb_status'] ?? '?'),
                auth_prices_unlocked($acc) ? 'ACIK' : 'KAPALI');
            printf("  ulke=%s  vat=%s\n", (string)($acc['country'] ?? '-'),
                trim((string)($acc['vat_id'] ?? '')) !== '' ? 'kayitli' : 'YOK');
            if (!auth_prices_unlocked($acc)) echo "  UYARI: fiyat kapisi kapali -- bu hesap sitede fiyat goremiyor\n";

            /* 2. KALEMLER. Fiyat KODUN kendi fonksiyonundan; elle hesaplanmiyor. */
            echo "\n== KALEMLER (dropship fiyati = en dusuk kademe + %".(int)round(VESTRA_DROPSHIP_MARKUP*100).") ==\n";
            $all = vestra_products();
            $bySku = [];
            foreach ($all as $p) { $sk = trim((string)($p['sku'] ?? '')); if ($sk !== '') $bySku[mb_strtolower($sk)] = $p; }

            $subtotal = 0.0; $problems = 0; $lines = [];
            foreach (array_filter(array_map('trim', explode(',', (string)getenv('OD_LINES')))) as $spec) {
                $parts = array_map('trim', explode(':', $spec));
                $sku = $parts[0] ?? ''; $size = $parts[1] ?? ''; $qty = max(1, (int)($parts[2] ?? 1));
                $p = $bySku[mb_strtolower($sku)] ?? null;
                if (!$p) { printf("  !! %-24s KATALOGDA YOK\n", $sku); $problems++; continue; }
                $unit = vestra_dropship_unit_price($p, null);   // abonelik YOK -> zamli fiyat
                if ($unit === null || $unit <= 0) { printf("  !! %-24s dropship fiyati YOK (kapali ya da kademesiz)\n", $sku); $problems++; continue; }
                /* Beden ilanda gercekten var mi VE yetiyor mu? Olmayan bedene
                   fatura kesmek, gonderilemeyecek bir sey satmak olurdu.

                   ILK SURUM YANLIS YERE BAKTI: `sizes` bir dizi degil, insan
                   icin yazilmis bir METIN ("S×1 · M×3 · L×3 · XL×2 · XXL×1 ·
                   10 pcs/pack"). in_array('M', [o metin]) her satirda false
                   dondu ve alti kalemin altisini birden "beden yok" diye
                   isaretledi -- veri degil, kontrol bozuktu. Simdi metin
                   ayristiriliyor: beden ve o bedendeki ADET birlikte okunuyor,
                   yani "M var mi" degil "M'den 1 tane var mi" sorulabiliyor. */
                $sizeRaw = is_array($p['sizes'] ?? null)
                    ? implode(' ', array_map('strval', $p['sizes']))
                    : (string)($p['sizes'] ?? '');
                $avail = [];
                if (preg_match_all('/([0-9]{2,3}|XXXL|XXL|XL|XS|S|M|L)\s*[×xX]\s*([0-9]+)/u', $sizeRaw, $mm, PREG_SET_ORDER)) {
                    foreach ($mm as $m2) $avail[mb_strtoupper($m2[1])] = (int)$m2[2];
                }
                $want = mb_strtoupper($size);
                if ($avail === []) { $sizeOk = true; $sizeNote = '(ilanda beden dokumu yok, kontrol edilemedi)'; }
                elseif (!isset($avail[$want])) { $sizeOk = false; $sizeNote = '!! beden YOK -- ilanda: '.implode(' ', array_map(fn($k,$v)=>"{$k}x{$v}", array_keys($avail), $avail)); }
                elseif ($avail[$want] < $qty) { $sizeOk = false; $sizeNote = sprintf('!! yetersiz: %s bedeninde %d var, %d isteniyor', $want, $avail[$want], $qty); }
                else { $sizeOk = true; $sizeNote = sprintf('(%s: %d adet var)', $want, $avail[$want]); }
                $lineTot = round($unit * $qty, 2);
                $subtotal += $lineTot;
                $lines[] = [$sku, $size, $qty, $unit, $lineTot];
                $baseSum = ($baseSum ?? 0.0) + round(((float)vestra_dropship_wholesale_price($p)) * $qty, 2);
                /* TAM FIYAT DOKUMU (operator: "tam fiyatlari ver"). Yalnizca
                   son rakami basmak, "bu 47,88 nereden cikti" sorusunu acik
                   birakiyor. Kademe merdiveni, taban (en dusuk kademe), zam ve
                   satir carpimi birlikte yaziliyor -- her rakam kaynagiyla. */
                $base = vestra_dropship_wholesale_price($p);
                $tiers = [];
                foreach ((array)($p['tiers'] ?? []) as $tt) {
                    $tmin = (int)($tt['min'] ?? 0); $tpr = (float)($tt['price'] ?? 0);
                    if ($tmin > 0 && $tpr > 0) $tiers[] = $tmin.'+ = '.number_format($tpr, 2);
                }
                printf("  %-24s %-4s x%-2d  %s\n", $sku, $size, $qty, $sizeNote);
                printf("      %s %s\n", (string)($p['brand'] ?? ''), (string)($p['name'] ?? ''));
                printf("      kademeler   : %s\n", $tiers ? implode('  |  ', $tiers) : '(kademe yok)');
                printf("      toptan taban: EUR %8s   (en dusuk adetli kademe)\n", number_format((float)$base, 2));
                printf("      dropship    : EUR %8s   (taban + %%%d)\n", number_format($unit, 2), (int)round(VESTRA_DROPSHIP_MARKUP * 100));
                printf("      satir       : EUR %8s   (%s x %d)\n\n", number_format($lineTot, 2), number_format($unit, 2), $qty);
                if (!$sizeOk) $problems++;
            }

            $ship = round((float)str_replace(',', '.', (string)getenv('OD_SHIP')), 2);
            $total = round($subtotal + $ship, 2);
            echo "\n== TOPLAM ==\n";
            printf("  toptan   : EUR %10s   (zamsiz taban toplami -- kiyas icin)\n", number_format((float)($baseSum ?? 0), 2));
            printf("  mal      : EUR %10s   (dropship, taban + %%%d)\n", number_format($subtotal, 2), (int)round(VESTRA_DROPSHIP_MARKUP * 100));
            printf("  zam payi : EUR %10s\n", number_format($subtotal - (float)($baseSum ?? 0), 2));
            printf("  kargo    : EUR %10s\n", number_format($ship, 2));
            printf("  TOPLAM   : EUR %10s\n", number_format($total, 2));
            $r = vestra_fx('USD');
            if ($r > 0) printf("  (~US$%s, 1 EUR = %s)\n", number_format($total * $r, 2), number_format($r, 4));
            printf("\n  kalem sayisi: %d   sorunlu: %d\n", count($lines), $problems);

            /* YAZMA, AYNI ADIMDA VE AYNI HESAPTAN. Ikinci bir adim, fiyat
               mantiginin ikinci kopyasi demek olurdu; bu depo ayrisan iki
               kopyanin bedelini KURAL 5d/5f'te zaten yazdi. Taslak ile yazim
               arasindaki TEK fark asagidaki dal. */
            $write = getenv('OD_MODE') === 'order_write';
            if (!$write) {
                echo $problems ? "  SONUC: SORUN VAR -- duzelmeden siparis YAZILMAMALI\n"
                               : "  SONUC: taslak temiz. HICBIR SEY YAZILMADI (salt okunur).\n";
                exit($problems ? 1 : 0);
            }
            if ($problems) { fwrite(STDERR, "SORUN VAR -- yazmiyorum\n"); exit(1); }

            $mkLines = [];
            foreach ($lines as $L) $mkLines[] = ['sku'=>$L[0], 'size'=>$L[1], 'qty'=>$L[2], 'unit'=>$L[3]];
            $res = vestra_order_create_manual($acc, $mkLines, $ship,
                'Dropship pricing (wholesale +'.(int)round(VESTRA_DROPSHIP_MARKUP*100).'%), single pieces, agreed with the buyer.');
            if (!empty($res['error'])) { fwrite(STDERR, "YAZILAMADI: ".$res['error']."\n"); exit(1); }
            printf("\n  SIPARIS YAZILDI: %s\n", (string)$res['ref']);
            printf("  mal %s + kargo %s = %s EUR   (kayittan geri okundu)\n",
                number_format((float)$res['goods'], 2), number_format((float)$res['shipping'], 2),
                number_format((float)$res['total'], 2));
            echo "  FATURA KESILMEDI -- numara yakmaz, musteriye hicbir sey gitmedi.\n";
            PHPEOF
            php /tmp/vestra_orddraft.php; rc=$?
            rm -f /tmp/vestra_orddraft.php
            exit $rc

      - name: Dropship ödeme anahtarı (aç / kapat)
        # Operator, 8 Eyl 2026: "Dropshippingi tekrar aci".
        # Ayni anahtar Admin ▸ Dropship'te de var; bu, ayni kaydin ikinci kapisi
        # (vestra_dropship_set_payments), yeni bir karar noktasi DEGIL.
        # Yeni GIRDI eklemiyor: mod adinin kendisi on/off tasiyor -- diag-live
        # 25 girdi sinirina dayanmis durumda ve bu dosya da ayni butceyi paylasiyor.
        if: ${{ github.event.inputs.admin_mode == 'dropship_on' || github.event.inputs.admin_mode == 'dropship_off' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          DS_MODE: ${{ github.event.inputs.admin_mode }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 2m
          envs: DS_MODE
          script: |
            set -e
            cat > /tmp/vestra_dspay.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/dropship.php";

            $want = getenv('DS_MODE') === 'dropship_on';
            printf("onceki durum : %s\n", vestra_dropship_payments_enabled() ? 'ACIK' : 'kapali');
            vestra_dropship_set_payments($want);

            /* YAZMA GERI OKUNUYOR, ve AYRI bir surecte: vestra_dropship_payments_enabled()
               surec icinde `static` onbellekli, ayni surecte sormak yazilan degeri
               degil onbellegi olcerdi -- "yazdim" diyen ama yazmamis bir satir. */
            $out = shell_exec(escapeshellcmd(PHP_BINARY ?: 'php').' -r '.escapeshellarg(
              'require getenv("HOME")."/public_html/inc/products.php";'
             .'require_once getenv("HOME")."/public_html/inc/dropship.php";'
             .'echo vestra_dropship_payments_enabled() ? "ACIK" : "kapali";'));
            $now = trim((string)$out);
            printf("simdiki durum: %s\n", $now);
            $okState = ($want && $now === 'ACIK') || (!$want && $now === 'kapali');
            echo $okState ? "SONUC: tuttu\n" : "SONUC: TUTMADI -- kayit istenen degeri almadi\n";
            exit($okState ? 0 : 1);
            PHPEOF
            php /tmp/vestra_dspay.php; rc=$?
            rm -f /tmp/vestra_dspay.php
            exit $rc

      - name: Siparişe navlun yaz (shipping) — numara yakmaz
        if: ${{ github.event.inputs.admin_mode == 'shipping' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          SHIP_REF: ${{ github.event.inputs.issue_ref }}
          SHIP_VAL: ${{ github.event.inputs.issue_shipping }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 3m
          envs: SHIP_REF,SHIP_VAL
          script: |
            set -e
            cat > /tmp/vestra_ship.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/orders.php";
            require_once $doc."/inc/auth.php";
            require_once $doc."/inc/invoice.php";
            require_once $doc."/inc/fx_orders.php";

            $ref = preg_replace('/[^A-Za-z0-9_-]/', '', (string)getenv('SHIP_REF'));
            $raw = trim((string)getenv('SHIP_VAL'));
            if ($ref === '' || $raw === '') { fwrite(STDERR, "ref ya da tutar yok\n"); exit(1); }

            [$amountPart, $label] = array_pad(explode('|', $raw, 2), 2, '');
            $amountPart = trim($amountPart); $label = trim((string)$label);

            $row = null;
            foreach (vestra_read_csv('orders.csv') as $r) if (($r['ref'] ?? '') === $ref) { $row = $r; break; }
            if (!$row) { fwrite(STDERR, "siparis bulunamadi: {$ref}\n"); exit(1); }
            $ordCur = strtoupper(trim((string)($row['currency'] ?? 'EUR'))) ?: 'EUR';

            /* "100 USD" -> siparisin biriminde karsiligi. Kur SIPARISIN damgasi
               (KURAL 5i); bugunun kuru degil, yoksa fatura ile bu rakam ayrisir. */
            $inCur = $ordCur;
            if (preg_match('/^(.*?)[\s]*([A-Za-z]{3})$/', $amountPart, $m)) {
              $inCur = strtoupper($m[2]); $amountPart = trim($m[1]);
            }
            $amount = vestra_price_input($amountPart);
            printf("siparis          : %s\n", $ref);
            printf("siparis birimi   : %s\n", $ordCur);
            if ($inCur !== $ordCur) {
              $fx = vestra_order_fx($ref);
              if (!$fx || (float)($fx['usd'] ?? 0) <= 0) {
                fwrite(STDERR, "kur damgasi YOK -- {$inCur} tutarini {$ordCur}'a cevirecek kur yok. "
                             . "Once Admin > Orders > 'Fetch missing rates'.\n"); exit(1);
              }
              if ($inCur !== 'USD') { fwrite(STDERR, "yalnizca {$ordCur} ve USD cevrilebiliyor\n"); exit(1); }
              $rate = (float)$fx['usd'];
              $want = $amount;
              $amount = round($amount / $rate, 2);
              printf("girilen          : %s %s  (kur %s)\n", number_format($want, 2), $inCur, vestra_order_fx_note($fx));
              printf("kayda yazilan    : %s %s   -> belgede %s %s\n",
                     number_format($amount, 2), $ordCur, number_format(round($amount * $rate, 2), 2), $inCur);
            }

            $r = vestra_order_set_shipping($ref, $amount, $label);
            if (isset($r['error'])) { fwrite(STDERR, "YAZILAMADI: ".$r['error']."\n"); exit(1); }
            printf("mal toplami      : %s\n", number_format($r['goods'], 2));
            printf("navlun           : %s%s\n", number_format($r['shipping'], 2), $r['label'] !== '' ? '  ('.$r['label'].')' : '');
            printf("SIPARIS TOPLAMI  : %s  (geri okundu, dogrulandi)\n", number_format($r['total'], 2));
            echo "kesim            : YAPILMADI (numara yanmadi, PDF uretilmedi, aliciya hicbir sey gitmedi)\n";
            PHPEOF
            php -l /tmp/vestra_ship.php
            php /tmp/vestra_ship.php
            rm -f /tmp/vestra_ship.php

      # FATURANIN PARA BIRIMI (KURAL 5i). Panelin acilir listesiyle AYNI kaydi
      # yaziyor -- ayri bir alan degil, `order_statuses.json[ref].invoice_currency`.
      # Yazmak KESMEK DEGIL: numara yanmaz, PDF uretilmez, aliciya hicbir sey
      # gitmez; secim yalnizca "Approve & issue"a basildiginda belgeye doner.
      #
      # Yazma GERI OKUNARAK dogrulaniyor (KURAL 5c'nin billing_saved dersi:
      # `vestra_order_set_invoice_currency` false donerse hicbir sey yazilmamistir
      # ve "USD yaptim" demek operatore olmayan bir kaydi dogru sandirir).
      #
      # Kur damgasi ve odeme kutusu da ayni koside yaziliyor: damga yoksa kesim
      # zaten DURACAK, odeme yolu yoksa belge ODEME KUTUSUZ cikacak -- ikisini de
      # secimi yapan kisi simdi gormeli, alici fatura elindeyken degil.
      - name: Faturanın para birimini kaydet (currency) — numara yakmaz
        if: ${{ github.event.inputs.admin_mode == 'currency' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          CUR_REF: ${{ github.event.inputs.issue_ref }}
          CUR_WANT: ${{ github.event.inputs.issue_currency }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 3m
          envs: CUR_REF,CUR_WANT
          script: |
            set -e
            cat > /tmp/vestra_cur.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/orders.php";
            require_once $doc."/inc/auth.php";
            require_once $doc."/inc/invoice.php";
            require_once $doc."/inc/fx_orders.php";

            $ref  = preg_replace('/[^A-Za-z0-9_-]/', '', (string)getenv('CUR_REF'));
            $want = strtoupper(trim((string)getenv('CUR_WANT')));
            if ($ref === '') { fwrite(STDERR, "ref yok\n"); exit(1); }

            $row = null;
            foreach (vestra_read_csv('orders.csv') as $r) if (($r['ref'] ?? '') === $ref) { $row = $r; break; }
            if (!$row) { fwrite(STDERR, "siparis bulunamadi: {$ref}\n"); exit(1); }
            $ordCur = strtoupper(trim((string)($row['currency'] ?? 'EUR'))) ?: 'EUR';

            /* Kesilmis fatura varsa SECIM ARTIK BIR SEY DEGISTIRMEZ: belge alicinin
               elinde ve dosya adi/numara yanmis durumda. Sessizce yazip "tamam"
               demek, degismeyecek bir seyi degistirdik sanmak olurdu. */
            $already = function_exists('vestra_invoices_for_ref') ? vestra_invoices_for_ref($ref) : [];
            if ($already) {
              fwrite(STDERR, "fatura ZATEN KESILMIS (".count($already)." belge) -- para birimi secimi artik belgeyi degistirmez.\n"
                           . "Degistirmek icin KURAL 5f: kalemi cikar/yeniden ciz, ya da faturayi iptal edip yeniden kes.\n");
              exit(1);
            }

            $before = vestra_order_invoice_currency($ref);
            $ok     = vestra_order_set_invoice_currency($ref, $want);
            $after  = vestra_order_invoice_currency($ref);
            $expect = ($want === '' || !in_array($want, vestra_invoice_currencies(), true)) ? '' : $want;

            printf("siparis          : %s\n", $ref);
            printf("siparis birimi   : %s  (KAYIT -- degismez)\n", $ordCur);
            printf("onceki secim     : %s\n", $before === '' ? '(yok -- siparis birimi)' : $before);
            printf("istenen          : %s\n", $want === '' ? '(secimi kaldir)' : $want);
            if (!$ok || $after !== $expect) {
              fwrite(STDERR, "YAZILAMADI -- kayit '".($after === '' ? '(yok)' : $after)."' olarak kaldi"
                           . ($ok ? "" : " (taninmayan birim reddedildi; izin listesi: ".implode(', ', vestra_invoice_currencies()).")")."\n");
              exit(1);
            }
            printf("KAYITLI          : %s  (geri okundu, dogrulandi)\n", $after === '' ? '(yok -- siparis birimi)' : $after);

            /* Cevrim gerekiyorsa kur damgasi SART. Yoksa kesim `['error'=>...]`
               donup duracak -- bunu simdi soylemek, Approve'a basanin kirmizi
               bant gormesinden ucuz. */
            if ($after !== '' && $after !== $ordCur) {
              $fx = vestra_order_fx($ref);
              printf("kur damgasi      : %s\n", $fx ? vestra_order_fx_note($fx) : "YOK -- KESIM DURUR (Admin > Orders > 'Fetch missing rates')");
              if (!$fx) exit(1);
            }

            /* Odeme kutusu bu birimde gercekten cikiyor mu? Degerleri yazmiyoruz
               (log herkese acik), yalnizca kutunun dolu olup olmadigini. */
            foreach (vestra_order_invoice_payloads($ref) as $p) {
              $acc = $p['seller'];
              $who = $acc ? ($acc['company'] ?: ($acc['name'] ?: $p['seller_key'])) : 'VESTRA (acerasoft LLC)';
              $cur = (string)($p['meta']['currency'] ?? $ordCur);
              if (!empty($p['currency_error'])) {
                printf("  %-26s CEVRILEMEDI: %s -- KESIM DURUR\n", mb_substr($who,0,24), $p['currency_error']);
                continue;
              }
              $rails = $acc ? vestra_payment_rails($acc, $cur) : [];
              printf("  %-26s %s odeme kutusu: %s\n", mb_substr($who,0,24), $cur,
                     $acc ? ($rails ? count($rails).' satir' : 'BOS -- bu hesapta '.$cur.' yolu yok')
                          : 'HIC CIKMAZ -- platform kesiyor, bagli banka hesabi yok');
            }
            echo "kesim            : YAPILMADI (numara yanmadi, PDF uretilmedi, aliciya hicbir sey gitmedi)\n";
            PHPEOF
            php -l /tmp/vestra_cur.php
            php /tmp/vestra_cur.php
            rm -f /tmp/vestra_cur.php

      # Faturayi KIMIN kesecegini KAYDA yazar -- panelin acilir listesiyle AYNI
      # kayit (order_statuses.json[ref].invoice_seller_uid, KURAL 5b).
      #
      # NEDEN GEREKTI (8 Eyl 2026, VES-A8A129EC): siparis birden fazla saticinin
      # ilanini tasiyorsa vestra_order_invoice_payloads() onu satici basina
      # DILIMLER ve her dilim AYRI belge olur -- operator faturayi acinca uc
      # kalem goruyor, dorduncu (baska saticinin) kalem "faturada yok" gibi
      # duruyor. Kalem eksik degil, belge iki tane. Tek dogru mudahale bu secim:
      # secim varken dilimleme YAPILMIYOR, tek belge cikiyor.
      #
      #   issue_ref : siparis ref (or: VES-A8A129EC)
      #   payload   : 'vestra' (platform kessin) | hesabin ADINDAN bir parca |
      #               bos = secimi KALDIR (ilanin saticisina geri doner).
      #               uid degil ad parcasi: uid'i ezberden yazmak yanlis tuzel
      #               kisiden belge cikarabilir; burada TEK esleme sart.
      - name: Faturayı kimin keseceğini seç (seller) — belge üretmez
        if: ${{ github.event.inputs.admin_mode == 'seller' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          SEL_REF: ${{ github.event.inputs.issue_ref }}
          SEL_WHO: ${{ github.event.inputs.payload }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 3m
          envs: SEL_REF,SEL_WHO
          script: |
            set -e
            cat > /tmp/vestra_isel.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/orders.php";
            require_once $doc."/inc/auth.php";
            require_once $doc."/inc/invoice.php";
            require_once $doc."/inc/fx_orders.php";

            $ref = preg_replace('/[^A-Za-z0-9_-]/', '', (string)getenv('SEL_REF'));
            $who = trim((string)getenv('SEL_WHO'));
            if ($ref === '') { fwrite(STDERR, "ref yok (issue_ref)\n"); exit(1); }

            $row = null;
            foreach (vestra_read_csv('orders.csv') as $r) if (($r['ref'] ?? '') === $ref) { $row = $r; break; }
            if (!$row) { fwrite(STDERR, "siparis bulunamadi: {$ref}\n"); exit(1); }

            /* Kesilmis fatura varsa secim ARTIK BIR SEY DEGISTIRMEZ: belge
               alicinin elinde, numara yanmis, dosya adi satici anahtarindan
               turuyor. Sessizce yazip "tamam" demek, degismeyecek bir seyi
               degistirdik sanmak olurdu (currency modunun ayni gerekcesi). */
            $already = vestra_invoices_for_ref($ref);
            if ($already) {
              fwrite(STDERR, "fatura ZATEN KESILMIS (".implode(', ', array_map(fn($i)=>(string)($i['no']??'?'), $already))
                           .") -- satici secimi artik belgeyi degistirmez.\nKURAL 5f: kalemi cikar/yeniden ciz, ya da iptal edip yeniden kes.\n");
              exit(1);
            }

            /* AD -> uid. 'vestra' acik bir secimdir (platform kessin). */
            $uid = '';
            if ($who !== '' && strtolower($who) !== 'vestra') {
              $hits = [];
              foreach (auth_accounts() as $a) {
                $hay = mb_strtolower(($a['company'] ?? '').' '.($a['name'] ?? ''));
                if (mb_strpos($hay, mb_strtolower($who)) !== false) $hits[] = $a;
              }
              if (count($hits) !== 1) {
                fwrite(STDERR, "ad '".$who."' ".count($hits)." hesapla esletti -- TEK esleme sart\n");
                foreach ($hits as $h) fwrite(STDERR, "   - ".($h['company'] ?: $h['name'])."\n");
                exit(1);
              }
              $uid = (string)$hits[0]['id'];
              echo "secilen hesap  : ".($hits[0]['company'] ?: $hits[0]['name'])."\n";
            } elseif (strtolower($who) === 'vestra') {
              $uid = 'vestra';
            }

            $before = vestra_order_invoice_seller_pick($ref);
            $ok     = vestra_order_set_invoice_seller($ref, $uid);
            $after  = vestra_order_invoice_seller_pick($ref);

            printf("siparis        : %s\n", $ref);
            printf("onceki secim   : %s\n", $before === '' ? '(yok -- ilanin saticisi)' : $before);
            printf("istenen        : %s\n", $uid === '' ? '(secimi kaldir)' : $uid);
            if (!$ok || $after !== $uid) {
              fwrite(STDERR, "YAZILAMADI -- kayit '".($after === '' ? '(yok)' : $after)."' olarak kaldi\n");
              exit(1);
            }
            printf("KAYITLI        : %s  (geri okundu, dogrulandi)\n", $after === '' ? '(yok -- ilanin saticisi)' : $after);

            /* Secimin gercekten TEK belge urettigini burada olcuyoruz: kodu
               okuyup "dilimlemez" demek olcum degil. */
            $ld = vestra_order_lines($row);
            $pcs = 0; foreach ($ld['lines'] as $l) $pcs += (int)($l['qty'] ?? 0);
            printf("siparis kalemi : %d satir / %d adet\n", count($ld['lines']), $pcs);
            $ps = vestra_order_invoice_payloads($ref);
            printf("yuk (dilim)    : %d  %s\n", count($ps), count($ps) === 1 ? '(TEK BELGE)' : '*** BIRDEN FAZLA BELGE ***');
            foreach ($ps as $p) {
              $goods = 0.0; foreach (($p['items'] ?? []) as $it) $goods += (float)($it['line'] ?? 0);
              $cur = (string)($p['meta']['currency'] ?? 'EUR');
              printf("   - %-26s kalem %d  mal %s  navlun %s\n",
                     mb_substr(vestra_invoice_issuer_name($p['seller'] ?? [], 'VESTRA'), 0, 26),
                     count($p['items'] ?? []),
                     number_format($goods, 2),
                     number_format((float)($p['meta']['shipping'] ?? 0), 2));
              /* BELGEYE BASILACAK SATIRLAR. "Kalem 4" demek operatorun
                 gordugu sey degil -- eksik sandigi kalemi ADIYLA gormesi
                 lazim. Kisiye ait hicbir alan yok: SKU/adet/tutar. */
              foreach (($p['items'] ?? []) as $it) {
                printf("       %-30s %-26s %2d x %8s = %9s\n",
                       mb_substr((string)($it['sku'] ?? '?'), 0, 30),
                       mb_substr((string)($it['name'] ?? ''), 0, 26),
                       (int)($it['qty'] ?? 0),
                       number_format((float)($it['unit'] ?? 0), 2),
                       number_format((float)($it['line'] ?? 0), 2));
              }
              /* Odeme kutusu: DEGERLER YAZILMAZ (log herkese acik), yalnizca
                 dolu mu. Bos cikan bir kutu, havale bekleyen bir faturada
                 alicinin nereye odeyecegini bilmemesi demek. */
              $payAcc = $p['seller'] ?: (function_exists('vestra_platform_seller') ? vestra_platform_seller() : []);
              $rails  = $payAcc ? vestra_payment_rails($payAcc, $cur) : [];
              printf("       odeme kutusu (%s): %s\n", $cur,
                     $rails ? count($rails).' satir' : 'BOS -- bu kunyede '.$cur.' yolu yok');
              $goodsAll = $goods + (float)($p['meta']['shipping'] ?? 0);
              printf("       ODENECEK: %s %s\n", $cur, number_format($goodsAll, 2));
            }
            echo "kesim          : YAPILMADI (numara yanmadi, PDF uretilmedi, aliciya hicbir sey gitmedi)\n";
            PHPEOF
            php -l /tmp/vestra_isel.php
            php /tmp/vestra_isel.php
            rm -f /tmp/vestra_isel.php

      # Faturayi KESER. Kesim ile GONDERIM burada bilerek ayri: admin.php'nin "Fatura kes"
      # dugmesi ikisini birlikte yapiyor, biz sadece ilkini istiyoruz -- belge numarasini
      # alsin, PDF kaydedilsin, ama musteriye hicbir sey gitmesin. vestra_notify_* cagrisi
      # yok; onay geldikten sonra gonderim ayri bir adim.
      #
      # Idempotent: ayni ref ikinci kez calistirilirsa kesilmis fatura oldugu gibi doner,
      # yeni numara uretilmez.
      - name: Faturayı kes (issue) — e-posta göndermez
        if: ${{ github.event.inputs.admin_mode == 'issue' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          ISSUE_REF: ${{ github.event.inputs.issue_ref }}
          ISSUE_PUBKEY: ${{ github.event.inputs.issue_pubkey }}
          ISSUE_REDRAFT: ${{ github.event.inputs.issue_redraft }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: ISSUE_REF,ISSUE_PUBKEY,ISSUE_REDRAFT,ISSUE_NUMBER
          script: |
            set -e
            cat > /tmp/vestra_issue.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/orders.php";
            require_once $doc."/inc/auth.php";
            require_once $doc."/inc/invoice.php";

            $ref = preg_replace('/[^A-Za-z0-9_-]/', '', (string)getenv('ISSUE_REF'));
            if ($ref === '') { fwrite(STDERR, "ref yok\n"); exit(1); }
            $pub = openssl_pkey_get_public((string)base64_decode(trim((string)getenv('ISSUE_PUBKEY')), true));
            if (!$pub) { fwrite(STDERR, "public key okunamadi\n"); exit(1); }

            $redraft = strtolower(trim((string)getenv('ISSUE_REDRAFT'))) === 'true';

            /* Numarayi elle kaydirma. vestra_ensure_invoice() redraft'ta meta'daki numarayi
               oldugu gibi kullaniyor, o yuzden once meta'yi, sonra sayaci yaziyoruz --
               boylece bir sonraki fatura buradan devam eder, ayni numara iki kez cikmaz.
               Sadece redraft ile birlikte calisir: kesilmis ve HENUZ GONDERILMEMIS bir
               belgenin numarasini duzeltmek icindir. */
            $forceNo = (int)trim((string)getenv('ISSUE_NUMBER'));
            if ($redraft && $forceNo > 0) {
              $year = date('Y');
              $dir  = vestra_invoice_dir();
              $safe = preg_replace('/[^A-Za-z0-9_-]/', '', $ref);
              $metas = glob($dir.'/'.$safe.'__*.json') ?: [];
              if (count($metas) !== 1) {
                fwrite(STDERR, "numara degistirme tek faturali siparis icin: ".count($metas)." meta bulundu\n"); exit(1);
              }
              $m = json_decode((string)file_get_contents($metas[0]), true) ?: [];
              $oldNo = (string)($m['no'] ?? '');
              $newNo = sprintf('INV-%s-%06d', $year, $forceNo);
              $m['no'] = $newNo;
              file_put_contents($metas[0], json_encode($m, JSON_PRETTY_PRINT), LOCK_EX);

              $seqFile = $doc.'/data/invoice_seq.json';
              $seq = json_decode((string)@file_get_contents($seqFile), true);
              if (!is_array($seq)) $seq = [];
              $k = ((string)($m['seller_key'] ?? '')).'-'.$year;
              $seq[$k] = max((int)($seq[$k] ?? 0), $forceNo);
              file_put_contents($seqFile, json_encode($seq, JSON_PRETTY_PRINT), LOCK_EX);
              echo "numara           : {$oldNo} -> {$newNo}  (sayac {$k} = {$seq[$k]}, sonraki ".($seq[$k]+1).")\n";
            }

            $before = vestra_invoices_for_ref($ref);
            $issued = vestra_issue_order_invoices($ref, $redraft);
            /* Para birimi cevrilemediyse hicbir numara yakilmadi; hata dizisi de
               "dolu" oldugu icin asagidaki count() onu 1 fatura sanardi. */
            if (isset($issued['error'])) { fwrite(STDERR, "fatura kesilmedi -- para birimi: ".$issued['error']."\n"); exit(1); }
            if (!$issued) { fwrite(STDERR, "fatura kesilemedi (siparis yok ya da satir yok)\n"); exit(1); }
            echo "onceden kesilmis : ".(count($before) ?: 'yok')."\n";
            echo "fatura sayisi    : ".count($issued)."\n";
            foreach ($issued as $iv) {
              echo "  no: ".$iv['no']."  satici: ".$iv['seller_key']."  dosya: ".(is_file($iv['path']) ? 'var' : 'YOK')
                 .(!empty($iv['redrafted']) ? "  (AYNI numarayla yeniden uretildi)" : "")."\n";
            }
            /* Faturanin uzerinde ne yazdigi tek gercek kaynak belgenin kendisi; alici blogunu
               log'a yazamayiz (herkese acik), ama ULKE alaninin duzelip duzelmedigini gormek
               gerekiyor -- bir ulke adi kisisel veri degil. */
            $ordRow = null;
            foreach (vestra_read_csv('orders.csv') as $r) if (($r['ref'] ?? '') === $ref) { $ordRow = $r; break; }
            if ($ordRow) {
              $bq = vestra_invoice_buyer($ordRow);
              echo "alici ulkesi     : ".($bq['country'] !== '' ? $bq['country'] : 'YOK')."\n";
              echo "alici adresi     : ".($bq['address'] !== '' ? mb_strlen($bq['address'])." karakter" : 'YOK')."\n";
            }
            echo "e-posta          : GONDERILMEDI (bilerek -- gonderim ayri adim)\n";

            /* Birden fazla satici olsaydi her PDF ayri donerdi; bu sipariste tek taraf var. */
            $pdf = (string)@file_get_contents($issued[0]['path']);
            if ($pdf === '') { fwrite(STDERR, "PDF okunamadi\n"); exit(1); }
            echo "bayt             : ".strlen($pdf)."\n";
            echo "sha256           : ".hash('sha256', $pdf)."\n";

            $aes = random_bytes(32); $iv2 = random_bytes(16);
            $ct  = openssl_encrypt($pdf, 'aes-256-cbc', $aes, OPENSSL_RAW_DATA, $iv2);
            if ($ct === false || !openssl_public_encrypt($aes, $ek, $pub, OPENSSL_PKCS1_OAEP_PADDING)) {
              fwrite(STDERR, "sifreleme basarisiz\n"); exit(1);
            }
            /* Rakamsiz base64 -- kisa sayisal bir secret (DEPLOY_PORT) rastgele base64
               icinde *** ile maskelenip govdeyi sessizce bozuyordu. */
            $enc = fn(string $b) => strtr(base64_encode($b), '0123456789', '!$%&#,;?@~');
            echo "KEY ".$enc($ek)."\n";
            echo "IV  ".$enc($iv2)."\n";
            echo "-----BEGIN INVOICE ENC-----\n";
            foreach (str_split($enc($ct), 200) as $ln) echo $ln."\n";
            echo "-----END INVOICE ENC-----\n";
            PHPEOF
            php /tmp/vestra_issue.php
            rm -f /tmp/vestra_issue.php

      - name: Satıcı kimliğini uygula (apply)
        if: ${{ github.event.inputs.admin_mode == 'apply' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          PAYLOAD: ${{ github.event.inputs.payload }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: PAYLOAD
          script: |
            set -e
            cat > /tmp/vestra_seller_apply.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $home = getenv("HOME"); $doc = $home."/public_html";
            require $doc."/inc/auth.php";
            require $doc."/inc/products.php";

            /* Payload: KEY.IV.GOVDE -- rakamsiz base64 (bkz. diag-live: kisa sayisal bir
               secret rastgele base64 icinde *** ile maskeleniyor ve govdeyi bozuyor). */
            $dec = fn(string $x) => base64_decode(strtr($x, '!$%&#,;?@~', '0123456789'), true);
            $parts = explode('.', trim((string)getenv('PAYLOAD')));
            if (count($parts) !== 3) { fwrite(STDERR, "payload bicimi hatali\n"); exit(1); }
            $priv = openssl_pkey_get_private((string)@file_get_contents($home."/.vestra_inbox_key.pem"));
            if (!$priv) { fwrite(STDERR, "sunucuda anahtar yok -- once admin_mode=keygen calistir\n"); exit(1); }
            if (!openssl_private_decrypt($dec($parts[0]), $aes, $priv, OPENSSL_PKCS1_OAEP_PADDING)) {
              fwrite(STDERR, "anahtar acilamadi\n"); exit(1);
            }
            $json = openssl_decrypt($dec($parts[2]), 'aes-256-cbc', $aes, OPENSSL_RAW_DATA, $dec($parts[1]));
            $in = $json === false ? null : json_decode($json, true);
            if (!is_array($in) || (empty($in['account_id']) && empty($in['account_email']))) {
              fwrite(STDERR, "govde cozulemedi (account_id ya da account_email gerekli)\n"); exit(1);
            }

            $accFile = $doc.'/data/accounts.json';
            $accounts = auth_accounts();
            $idx = null;
            /* Hesabi id ile buluyoruz; id elde yoksa e-posta ile. Alici hesaplarinin id'si
               hicbir yerde gorunmuyor, elimizde olan tek tanitici e-posta adresi. */
            if (!empty($in['account_id'])) {
              foreach ($accounts as $i => $a) if ((string)($a['id'] ?? '') === (string)$in['account_id']) { $idx = $i; break; }
            } else {
              $want = strtolower(trim((string)$in['account_email']));
              foreach ($accounts as $i => $a) if (strtolower(trim((string)($a['email'] ?? ''))) === $want) { $idx = $i; break; }
            }
            if ($idx === null) { fwrite(STDERR, "hesap bulunamadi\n"); exit(1); }
            $in['account_id'] = (string)($accounts[$idx]['id'] ?? '');

            copy($accFile, $accFile.'.bak-'.date('Ymd-His'));
            $before = $accounts[$idx]['company'] ?? '';
            /* Sadece verilen alanlar yazilir; parola/id/tip'e dokunulmaz. */
            foreach (['company','name','address','country','vat_id','reg_number',
                      'bank_name','bank_holder','bank_iban','bank_bic'] as $f) {
              if (isset($in[$f]) && $in[$f] !== '') $accounts[$idx][$f] = (string)$in[$f];
            }
            /* E-posta hem GIRIS bilgisi hem de bildirim adresi. Baska bir hesap ayni adresi
               kullaniyorsa girisi belirsiz hale getirir -- degistirmeden once bakiyoruz. */
            if (!empty($in['email'])) {
              $new = strtolower(trim((string)$in['email']));
              foreach ($accounts as $j => $a2) {
                if ($j !== $idx && strtolower(trim((string)($a2['email'] ?? ''))) === $new) {
                  fwrite(STDERR, "bu e-posta baska bir hesapta kayitli -- degistirilmedi\n"); exit(1);
                }
              }
              $oldMail = (string)($accounts[$idx]['email'] ?? '');
              $accounts[$idx]['email'] = $new;
              echo "e-posta  : {$oldMail} -> {$new}   (GIRIS adresi de bu oldu)\n";
            }
            auth_save_accounts($accounts);
            $mask = fn($v) => $v === '' ? '(bos)' : (mb_strlen($v) <= 4 ? '****' : str_repeat('*', mb_strlen($v)-4).mb_substr($v,-4));
            echo "hesap    : {$in['account_id']}\n";
            echo "sirket   : {$before} -> ".($accounts[$idx]['company'] ?? '')."\n";
            echo "VAT      : ".($accounts[$idx]['vat_id'] ?? '(bos)')."\n";
            echo "banka    : ".($accounts[$idx]['bank_name'] ?? '(bos)')." | sahip: ".($accounts[$idx]['bank_holder'] ?? '(bos)')."\n";
            echo "IBAN     : ".$mask((string)($accounts[$idx]['bank_iban'] ?? ''))."   (log'a tam yazilmaz)\n";

            /* Navlun siparis satirinda durur: tek sevkiyatin tasima bedelini saticilara
               bolmek kimsenin mutabakat yapamayacagi rakamlar uretir. Sutun yoksa basliga
               eklenir -- eski siparisler bos deger alir, hicbir sey bozulmaz. */
            if (isset($in['shipping'])) {
                $ref2 = preg_replace('/[^A-Za-z0-9_-]/', '', (string)($in['assign_ref'] ?? $in['shipping_ref'] ?? ''));
                $csv  = $doc.'/data/orders.csv';
                $rows = vestra_read_csv('orders.csv');
                $hdr  = $rows ? array_keys($rows[0]) : [];
                foreach (['shipping','shipping_label','partial_shipments'] as $col) if (!in_array($col, $hdr, true)) $hdr[] = $col;
                vestra_csv_ensure_header('orders.csv', $hdr);
                $rows = vestra_read_csv('orders.csv');
                copy($csv, $csv.'.bak-'.date('Ymd-His'));
                $hit = 0;
                foreach ($rows as $i => $r) {
                    if (($r['ref'] ?? '') !== $ref2) continue;
                    $rows[$i]['shipping'] = number_format((float)$in['shipping'], 2, '.', '');
                    $rows[$i]['shipping_label'] = (string)($in['shipping_label'] ?? '');
                    $rows[$i]['partial_shipments'] = !empty($in['partial_shipments']) ? '1' : '';
                    $hit++;
                }
                if (!$hit) { fwrite(STDERR, "navlun icin siparis bulunamadi: {$ref2}\n"); exit(1); }
                $fh = fopen($csv, 'w');
                fputcsv($fh, $hdr, ',', '"', '\\');
                foreach ($rows as $r) { $line = []; foreach ($hdr as $c) $line[] = (string)($r[$c] ?? ''); fputcsv($fh, $line, ',', '"', '\\'); }
                fclose($fh);
                echo "navlun    : {$ref2} -> ".number_format((float)$in['shipping'], 2)." EUR ("
                   .($in['shipping_label'] ?? '-').")\n";
            }

            /* Sevkiyat kunyesi: teslim sekli, mensei, ihracat sebebi ve KDV notu. Fatura
               bunlari yalnizca DOLUYSA basiyor -- tahmin edilen bir Incoterm %25 ithalat
               vergisini kimin odeyecegine karar verir, tahmin edilen bir mensei ise yanlis
               beyandir. Bos birakmak, uydurmaktan iyidir. */
            /* 'total' de burada: siparisin "alici ne oduyor" rakami. Navlun sonradan
               eklendiginde bu sutun eski haliyle kaliyor ve alicinin panelinde faturadan
               farkli bir tutar gorunuyordu. */
            $shipMeta = array_intersect_key($in, array_flip(['incoterms','origin','export_reason','vat_note','total']));
            if ($shipMeta) {
                $ref3 = preg_replace('/[^A-Za-z0-9_-]/', '', (string)($in['assign_ref'] ?? $in['shipping_ref'] ?? ''));
                $csv  = $doc.'/data/orders.csv';
                $rows = vestra_read_csv('orders.csv');
                $hdr  = $rows ? array_keys($rows[0]) : [];
                foreach (array_keys($shipMeta) as $col) if (!in_array($col, $hdr, true)) $hdr[] = $col;
                vestra_csv_ensure_header('orders.csv', $hdr);
                $rows = vestra_read_csv('orders.csv');
                copy($csv, $csv.'.bak-'.date('Ymd-His'));
                $hit = 0;
                foreach ($rows as $i => $r) {
                    if (($r['ref'] ?? '') !== $ref3) continue;
                    foreach ($shipMeta as $col => $val) $rows[$i][$col] = (string)$val;
                    $hit++;
                }
                if (!$hit) { fwrite(STDERR, "sevkiyat kunyesi icin siparis bulunamadi: {$ref3}\n"); exit(1); }
                $fh = fopen($csv, 'w');
                fputcsv($fh, $hdr, ',', '"', '\\');
                foreach ($rows as $r) { $line = []; foreach ($hdr as $c) $line[] = (string)($r[$c] ?? ''); fputcsv($fh, $line, ',', '"', '\\'); }
                fclose($fh);
                foreach ($shipMeta as $col => $val) echo "kunye     : {$col} = {$val}\n";
            }

            /* Siparisin urunlerini bu saticiya bagla. seller_uid bos kaldigi surece fatura
               VESTRA adina cikiyor ve odeme kutusu hic gorunmuyor -- fatura kimin kesecegi
               satirin sahibine bagli, ayri bir secim degil. */
            if (!empty($in['assign_ref'])) {
              $ref = preg_replace('/[^A-Za-z0-9_-]/', '', (string)$in['assign_ref']);
              $order = null;
              foreach (vestra_read_csv('orders.csv') as $r) if (($r['ref'] ?? '') === $ref) { $order = $r; break; }
              if (!$order) { fwrite(STDERR, "siparis bulunamadi: {$ref}\n"); exit(1); }
              $skus = [];
              foreach (vestra_parse_order_items((string)($order['items'] ?? '')) as $it) $skus[$it['sku']] = true;

              $lfile = $doc.'/data/listings.json';
              $listings = json_decode((string)file_get_contents($lfile), true);
              if (!is_array($listings)) { fwrite(STDERR, "listings.json bozuk\n"); exit(1); }
              copy($lfile, $lfile.'.bak-'.date('Ymd-His'));
              $moved = 0; $already = 0; $missing = $skus;
              foreach ($listings as $i => $p) {
                $sku = (string)($p['sku'] ?? '');
                if ($sku === '' || !isset($skus[$sku])) continue;
                unset($missing[$sku]);
                if ((string)($p['seller_uid'] ?? '') === (string)$in['account_id']) { $already++; continue; }
                $listings[$i]['seller_uid'] = (string)$in['account_id'];
                $moved++;
              }
              file_put_contents($lfile, json_encode($listings, JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES), LOCK_EX);
              echo "\nsiparis {$ref}: ".count($skus)." SKU | tasinan: {$moved} | zaten bagli: {$already}"
                 .($missing ? " | KATALOGDA YOK: ".count($missing) : "")."\n";
              foreach (array_keys($missing) as $m) echo "  ! bulunamadi: {$m}\n";
            }
            PHPEOF
            php -l /tmp/vestra_seller_apply.php
            php /tmp/vestra_seller_apply.php
            rm -f /tmp/vestra_seller_apply.php

      - name: Konuşmanın satıcısını taşı
        if: ${{ github.event.inputs.admin_mode == 'thread_seller' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          MV_TO: ${{ github.event.inputs.move_to }}
          MV_TH: ${{ github.event.inputs.move_threads }}
          MV_GO: ${{ github.event.inputs.move_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 3m
          envs: MV_TO,MV_TH,MV_GO
          script: |
            set -e
            cat > /tmp/vestra_mvseller.php <<'PHPEOF'
            <?php
            /* Bir konusmayi baska bir saticiya tasi.
             *
             * TEK ONEMLI TUZAK: thread'in id'si SATICIDAN TUREEN bir ozet --
             * vestra_msg_thread_id() = md5(alici|satici|ilan). Yalnizca 'seller_uid'
             * alanini degistirip id'yi oldugu gibi birakmak sessiz bir bozulma olur:
             * kayit yeni saticinin panelinde gorunur ama bir sonraki mesajda
             * vestra_msg_send() yeni id'yi hesaplar, o id'yi bulamaz ve AYNI taraflar
             * icin IKINCI bir thread acar -- konusma ikiye boluner. Bu yuzden id de
             * yeniden hesaplaniyor.
             *
             * Yazma yollari sunucudaki tek kaynaktan gecer (vestra_msg_threads /
             * vestra_msg_save_threads); dosya bicimini burada elle kurmuyoruz. */
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require_once $doc."/inc/auth.php";
            require_once $doc."/inc/products.php";
            require_once $doc."/inc/messages.php";

            $to   = trim((string)getenv('MV_TO'));
            $sel  = trim((string)getenv('MV_TH'));
            $go   = strtolower(trim((string)getenv('MV_GO'))) === 'true';
            if ($to === '' || $sel === '') { fwrite(STDERR, "move_to ve move_threads zorunlu\n"); exit(1); }

            /* Hedef hesap: once tam uid, sonra firma/ad icinde parca. Birden fazla
               hesap eslesirse DUR -- yanlis satici, yanlis panele dusen bir konusma
               ve (ilan da tasinirsa) yanlis tuzel kisiden fatura demek. */
            $accs = auth_accounts();
            $hit = [];
            foreach ($accs as $a) {
              if (($a['id'] ?? '') === $to) { $hit = [$a]; break; }
              $hay = strtolower(($a['company'] ?? '').' '.($a['name'] ?? ''));
              if (stripos($hay, strtolower($to)) !== false) $hit[] = $a;
            }
            if (count($hit) !== 1) {
              fwrite(STDERR, "hedef satici tek degil ('{$to}' -> ".count($hit)." hesap)\n");
              foreach ($hit as $a) fwrite(STDERR, "   ".($a['id']??'?')." | ".($a['company']??'')." | ".($a['name']??'')."\n");
              exit(1);
            }
            $newUid  = (string)$hit[0]['id'];
            $newName = trim(($hit[0]['company'] ?? '') ?: ($hit[0]['name'] ?? ''));
            echo "hedef satici: {$newName}  (uid {$newUid})\n\n";

            $threads = vestra_msg_threads();
            $byId = [];
            foreach ($threads as $i => $t) $byId[(string)($t['id'] ?? '')] = $i;

            /* Secim: id listesi ya da 'ilan:<listing_id>' (o ilanin TUM konusmalari).
               Ilan biciminin sebebi: bir ilan el degistirdiginde geride kalan tek bir
               konusma, artik satmadigi bir urun hakkinda eski saticiya mektup
               gondermeye devam eder. */
            $want = [];
            foreach (preg_split('/[,\s]+/', $sel) as $tok) {
              $tok = trim($tok); if ($tok === '') continue;
              if (stripos($tok, 'ilan:') === 0) {
                $lid = substr($tok, 5);
                foreach ($threads as $t) if ((string)($t['listing_id'] ?? '') === $lid) $want[] = (string)($t['id'] ?? '');
              } else $want[] = $tok;
            }
            $want = array_values(array_unique(array_filter($want)));
            if (!$want) { fwrite(STDERR, "secilen thread yok\n"); exit(1); }

            $nameOf = function (string $uid) use ($accs): string {
              foreach ($accs as $a) if (($a['id'] ?? '') === $uid) return trim(($a['company'] ?? '') ?: ($a['name'] ?? '')) ?: $uid;
              return $uid;
            };
            $plan = []; $stop = 0;
            foreach ($want as $tid) {
              if (!isset($byId[$tid])) { echo "  ATLANDI {$tid}: thread yok\n"; $stop++; continue; }
              $t = $threads[$byId[$tid]];
              $old = (string)($t['seller_uid'] ?? '');
              $buy = (string)($t['buyer_uid'] ?? '');
              $lid = (string)($t['listing_id'] ?? '');
              $msgs = (array)($t['messages'] ?? []);
              echo "  {$tid} | ilan={$lid} | alici=".$nameOf($buy)." | satici=".$nameOf($old)." | mesaj=".count($msgs)."\n";
              if ($old === $newUid) { echo "      zaten bu saticida — atlandi\n"; continue; }

              /* ESKI SATICI BU KONUSMADA YAZDIYSA TASIMA. Mesajlar 'from' ile
                 imzali; thread'i baska bir firmaya vermek, o cumleleri de ona
                 yazdirmak olur. Kim ne yazdiysa o yazmis kalir. */
              $wrote = 0;
              foreach ($msgs as $m) if ((string)($m['from'] ?? '') === $old) $wrote++;
              if ($wrote > 0) {
                echo "      DURDU: eski satici bu konusmada {$wrote} mesaj YAZMIS.\n";
                echo "      Tasimak o sozleri baska firmaya mal etmek olurdu — operator karari gerekiyor.\n";
                $stop++; continue;
              }

              $newId = vestra_msg_thread_id($buy, $newUid, $lid);
              if (isset($byId[$newId]) && $newId !== $tid) {
                echo "      DURDU: bu alici+yeni satici+ilan icin ZATEN thread var ({$newId}).\n";
                echo "      Iki gecmisi birlestirmek yeniden adlandirma degil, ayri bir karar.\n";
                $stop++; continue;
              }
              echo "      -> satici ".$nameOf($old)." => {$newName} | id {$tid} => {$newId}\n";
              $plan[] = ['i'=>$byId[$tid], 'old'=>$old, 'newId'=>$newId];
            }

            if ($stop > 0) { fwrite(STDERR, "\n{$stop} thread durdu — hicbir sey yazilmadi (hepsi ya da hicbiri).\n"); exit(1); }
            if (!$plan)    { echo "\ndegisecek thread yok.\n"; exit(0); }
            if (!$go)      { echo "\nKURU KOSU — hicbir sey kaydedilmedi. Uygulamak icin move_apply=true.\n"; exit(0); }

            $bak = $doc.'/data/messages.json.bak-'.date('Ymd-His');
            @copy($doc.'/data/messages.json', $bak);
            echo "\nyedek: {$bak}\n";
            foreach ($plan as $p) {
              $i = $p['i'];
              $threads[$i]['seller_uid'] = $newUid;
              $threads[$i]['id']         = $p['newId'];
              /* Okuma imleci ve zil damgasi UID BASINA tutuluyor. Eskisininkini yeni
                 saticiya devretmek, hic okumadigi mesajlari okunmus gostermek olurdu;
                 birakmak da olmayan bir hesabi kayitta tutar. Silinir: TYREX gercekten
                 okumadi, okunmamis gorsun. */
              foreach (['read','ping'] as $k) if (isset($threads[$i][$k][$p['old']])) unset($threads[$i][$k][$p['old']]);
            }
            vestra_msg_save_threads($threads);

            /* GERI OKU: yazma sessizce basarisiz olabilir (izin, disk) ve
               "kaydedildi" yazan bir satir tek basina kanit degil. */
            $after = vestra_msg_threads(); $ok = 0;
            foreach ($plan as $p) {
              foreach ($after as $t) {
                if ((string)($t['id'] ?? '') === $p['newId'] && (string)($t['seller_uid'] ?? '') === $newUid) { $ok++; break; }
              }
            }
            printf("KAYDEDILDI — %d/%d thread yeni saticida ve yeni id ile geri okundu.\n", $ok, count($plan));
            exit($ok === count($plan) ? 0 : 1);
            PHPEOF
            php -l /tmp/vestra_mvseller.php
            php /tmp/vestra_mvseller.php; RC=$?
            rm -f /tmp/vestra_mvseller.php
            exit $RC

      - name: Silinmiş teklifi yedekten geri yükle (+ karşı teklif)
        if: ${{ github.event.inputs.admin_mode == 'offer_restore' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          OR_REF:   ${{ github.event.inputs.issue_ref }}
          OR_PRICE: ${{ github.event.inputs.offer_price }}
          OR_GO:    ${{ github.event.inputs.offer_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: OR_REF,OR_PRICE,OR_GO
          script: |
            set -e
            cat > /tmp/vestra_offrestore.php <<'PHPEOF'
            <?php
            /* Panelden SILINMIS bir teklifi kendi yedeginden geri yukler ve
             * istenirse karsi teklifi isler.
             *
             * NEDEN VAR: Admin > Offers > Sil, teklifi offers.csv'den ve
             * offer_responses.json'dan cikarir (KURAL 5g) -- ama SILMEDEN ONCE
             * offers.csv'yi 'offers.csv.bak-del-<zaman>' olarak kopyalar. Yanlislikla
             * silinen bir teklifin satiri o yedekte DURUYOR. Geri donusun tek dogru
             * yolu odur: satiri elle yeniden yazmak, alicinin hic vermedigi bir
             * rakami/zaman damgasini uydurmak olurdu (KURAL 3'un teklif hali).
             * Yedek yoksa is DURUR -- "muhtemelen boyleydi" diye bir kayit yazilmaz.
             *
             * KARSI TEKLIF ayni fonksiyondan geciyor: vestra_offer_respond($ref,
             * 'counter', $price, null, 'VESTRA') -- admin.php:1196'nin BIREBIR aynisi.
             * Ikinci bir kesim/pazarlik yolu yazilmadi: KURAL 4'un tur sayaci, fiyat
             * tavani, token uretimi ve mektubu tek yerde kalmali.
             *
             * KURU KOSU VARSAYILAN (KURAL 18): mektup musteriye gidiyor, o yuzden
             * offer_apply=true denmedikce hicbir sey yazilmaz ve hicbir sey gonderilmez. */
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require_once $doc."/inc/products.php";
            require_once $doc."/inc/auth.php";
            require_once $doc."/inc/offers.php";
            /* invoice.php AYRICA: offers.php onu yalnizca fonksiyon GOVDESINDE
               require ediyor, yani cagrilmadikca yuklenmiyor ve
               function_exists('vestra_invoices_for_ref') FALSE donuyordu --
               teshis KESILMIS bir faturaya "KESILMEDI" diyordu (CLAUDE.md). */
            require_once $doc."/inc/invoice.php";

            $ref   = trim((string)getenv('OR_REF'));
            $pIn   = trim((string)getenv('OR_PRICE'));
            $go    = strtolower(trim((string)getenv('OR_GO'))) === 'true';
            if ($ref === '') { fwrite(STDERR, "issue_ref bos -- geri yuklenecek teklif referansi gerekli\n"); exit(1); }

            /* Gunluk herkese acik. Is bilgisi (ref, urun, adet, fiyat, firma) acik
               kalir -- aramanin amaci o; kisiye ait olan maskeli (diag-live'in
               2 Eyl 2026 dersi: bir satiri "oldugu gibi bas" yapan adim, alicinin
               adresini herkese acik gunluge yazdi). */
            $maskMail = fn(string $e) => $e === '' ? '' : preg_replace('/^(.).*(@.*)$/', '$1***$2', $e);
            $show = function (string $k, string $v) use ($maskMail): string {
              $k = strtolower($k);
              if ($v === '') return '';
              if ($k === 'email' || str_ends_with($k, '_email')) return $maskMail($v);
              if (in_array($k, ['name','contact','phone','address'], true)) return mb_substr($v,0,1).'*** ('.mb_strlen($v).' karakter)';
              if (in_array($k, ['message','note','notes'], true)) return '[maskeli, '.mb_strlen($v).' karakter]';
              return mb_substr($v, 0, 120);
            };

            echo "== TEKLIF GERI YUKLEME ==\n";
            echo "ref            : {$ref}\n";

            $live = vestra_offer_row($ref);
            $row  = $live;
            $needRestore = ($live === null);
            echo "offers.csv     : ".($live ? "ref ZATEN VAR (geri yukleme gerekmiyor)" : "ref YOK -- silinmis")."\n";

            $bakName = ''; $bakRows = 0;
            if ($needRestore) {
              /* Yedekler zaman damgali (bak-del-Ymd_His), yani ADIN tersten
                 siralanmasi = en yeniden en eskiye. En yeni yedek, en son silmenin
                 ONCESINI tutar: aranan satir orada olmali. */
              $dir  = vestra_data_dir();
              $baks = glob($dir.'/offers.csv.bak-del-*') ?: [];
              rsort($baks, SORT_STRING);
              echo "yedek dosya    : ".count($baks)." adet\n";
              foreach ($baks as $b) {
                $base = basename($b);
                $rows = vestra_read_csv($base);          /* not: bu okuyucu satirlari TERS cevirir */
                foreach ($rows as $r) {
                  if ((string)($r['ref'] ?? '') !== $ref) continue;
                  $row = $r; $bakName = $base; $bakRows = count($rows); break 2;
                }
              }
              if (!$row) {
                fwrite(STDERR, "\nHICBIR YEDEKTE YOK: {$ref}\n");
                foreach ($baks as $b) fwrite(STDERR, "   ".basename($b)."  ".count(vestra_read_csv(basename($b)))." satir\n");
                fwrite(STDERR, "Kayit uydurulmaz -- alicinin verdigi rakam ve zaman damgasi ancak kendi kaydindan gelir.\n");
                exit(1);
              }
              echo "bulundugu yedek: {$bakName}  ({$bakRows} satir)\n";
            }

            echo "satir          :\n";
            foreach ($row as $k => $v) {
              $sv = $show((string)$k, trim((string)$v));
              if ($sv !== '') printf("   %-12s %s\n", $k, $sv);
            }

            $qty  = (int)($row['qty'] ?? 0);
            $unit = (float)($row['offer_unit'] ?? 0);
            $lst  = vestra_listing_by_sku((string)($row['sku'] ?? ''));
            $refP = vestra_offer_ref_price($lst);
            echo "ilan           : ".($lst ? ((string)($lst['id'] ?? '?')." | ".trim(((string)($lst['brand'] ?? '')).' '.((string)($lst['name'] ?? '')))
                                             ." | MOQ ".(int)($lst['moq'] ?? 0)) : "SKU KATALOGDA COZULMEDI")."\n";
            echo "referans fiyat : ".($refP > 0 ? "EUR ".number_format($refP,2)."/adet (karsi teklif tavani)" : "cozulemedi -- tavan uygulanmaz")."\n";

            /* Yanit kaydi: silme onu da temizliyor. Kalmis bir kayit, silmenin
               yarim kaldigini gosterir ve karsi teklif SIRASI'ni bozar. */
            $rs = vestra_read_json('offer_responses.json');
            echo "yanit kaydi    : ".(isset($rs[$ref]) ? "VAR (durum ".((string)($rs[$ref]['status'] ?? '?'))
                                       .", sira ".vestra_offer_turn($rs[$ref]).")" : "yok")."\n";
            $invs = vestra_invoices_for_ref($ref);
            echo "fatura         : ".($invs ? "KESILMIS: ".implode(', ', array_map(fn($i)=>(string)($i['no'] ?? '?'), $invs)) : "yok")."\n";
            if ($invs) { fwrite(STDERR, "faturasi kesilmis bir teklif geri yuklenmez -- once fatura yolu (KURAL 5f)\n"); exit(1); }

            $price = 0.0; $wantCounter = false;
            if ($pIn !== '') {
              $price = (float)str_replace(',', '.', $pIn);
              $wantCounter = true;
              $pErr = vestra_offer_price_error($lst, 'seller', $price, null);
              echo "karsi teklif   : EUR ".number_format($price,2)."/adet x {$qty} = EUR ".number_format($price*$qty,2)
                 . "   (alicinin teklifi: EUR ".number_format($unit,2)."/adet = EUR ".number_format($unit*$qty,2).")\n";
              echo "KURAL 4        : ".($pErr === null ? "GECERLI" : "RED -- ".$pErr)."\n";
              if ($pErr !== null) exit(1);
            } else {
              echo "karsi teklif   : ISTENMEDI (offer_price bos) -- yalnizca kayit geri yuklenir, MUSTERIYE HICBIR SEY GITMEZ\n";
            }

            $buyerAcc = auth_find((string)($row['email'] ?? ''));
            echo "alici hesabi   : ".($buyerAcc ? ((string)($buyerAcc['company'] ?? $buyerAcc['name'] ?? '?')
                                       ." | mektup dili: ".vestra_user_lang($buyerAcc)) : "hesap yok -- mektup Ingilizce gider")."\n";

            if (!$go) {
              echo "\noffer_apply=false — HICBIR SEY YAZILMADI, HICBIR MEKTUP GITMEDI.\n";
              exit(0);
            }

            /* --- YAZMA --- */
            if ($needRestore) {
              $f = vestra_data_dir().'/offers.csv';
              if (!is_file($f)) { fwrite(STDERR, "offers.csv yok\n"); exit(1); }
              if (!@copy($f, $f.'.bak-restore-'.date('Ymd_His'))) { fwrite(STDERR, "yedek alinamadi -- yazilmadi\n"); exit(1); }
              /* Basliktan okunan SIRA ile yazilir, satirin kendi sirasiyla degil:
                 yedek eski bir semadan geliyorsa sutunlar kayardi. Eksik sutun bos
                 kalir, fazlasi atilir. */
              $fh = @fopen($f, 'r'); $head = $fh ? fgetcsv($fh, null, ',', '"', '\\') : null;
              if ($fh) fclose($fh);
              if (!$head) { fwrite(STDERR, "offers.csv basligi okunamadi\n"); exit(1); }
              $out = [];
              foreach ($head as $h) $out[] = (string)($row[$h] ?? '');
              /* EKLEME: mevcut satirlarin tek baytina dokunmaz. Dosyayi yeniden
                 yazmak, okuyucunun ters cevirmesi yuzunden butun listenin sirasini
                 degistirirdi -- geri yukleme, gorunmeyen bir yan etki tasimamali. */
              $ap = @fopen($f, 'a');
              if (!$ap) { fwrite(STDERR, "offers.csv yazilamadi\n"); exit(1); }
              fputcsv($ap, $out, ',', '"', '\\'); fclose($ap);

              /* GERI OKU: "yazildi" diyen bir satir tek basina kanit degil. */
              $back = vestra_offer_row($ref);
              if (!$back) { fwrite(STDERR, "GERI OKUMA BASARISIZ -- satir offers.csv'de gorunmuyor\n"); exit(1); }
              if ((int)($back['qty'] ?? 0) !== $qty || abs((float)($back['offer_unit'] ?? 0) - $unit) > 0.004) {
                fwrite(STDERR, "GERI OKUMA UYUSMUYOR: qty ".(int)($back['qty'] ?? 0)." unit ".(float)($back['offer_unit'] ?? 0)."\n"); exit(1);
              }
              echo "\nGERI YUKLENDI — {$ref} offers.csv'de, {$qty} x EUR ".number_format((float)$back['offer_unit'],2)." geri okundu.\n";
            }

            if (!$wantCounter) { echo "karsi teklif verilmedi (offer_price bos).\n"; exit(0); }

            /* Panelin cagirdigi fonksiyonun AYNISI (admin.php:1196):
               aktor null, gonderen etiketi 'VESTRA'. */
            $res = vestra_offer_respond($ref, 'counter', $price, null, 'VESTRA');
            if (empty($res['ok'])) { fwrite(STDERR, "KARSI TEKLIF ISLENEMEDI: ".((string)($res['error'] ?? '?'))."\n"); exit(1); }
            echo "karsi teklif islendi. mektup: ".($res['mailed'] === null ? 'GONDERILMEDI (adres yok/kapali)'
                                                   : ($res['mailed'] ? 'GONDERILDI' : '*** SAGLAYICI REDDETTI ***'))."\n";

            $rs2 = vestra_read_json('offer_responses.json');
            $now = $rs2[$ref] ?? null;
            if (!$now) { fwrite(STDERR, "GERI OKUMA: yanit kaydi yazilmamis\n"); exit(1); }
            printf("geri okundu    : durum=%s  karsi=%s  sira=%s  kalan tur=%d  token=%s\n",
              (string)($now['status'] ?? '?'), number_format((float)($now['counter_price'] ?? 0), 2),
              vestra_offer_turn($now), vestra_offer_counters_left($now),
              empty($now['accept_token']) ? 'YOK -- kabul dugmesi calismaz!' : 'uretildi');
            exit(($res['mailed'] === false) ? 1 : 0);
            PHPEOF
            php -l /tmp/vestra_offrestore.php
            php /tmp/vestra_offrestore.php; RC=$?
            rm -f /tmp/vestra_offrestore.php
            exit $RC

      - name: Listele
        if: ${{ github.event.inputs.admin_mode == '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          script: |
            export Q='${{ github.event.inputs.query }}'
            export BRAND='${{ github.event.inputs.brand }}'
            cat > /tmp/seller_products.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            register_shutdown_function(function(){
              $e = error_get_last();
              if ($e && in_array($e['type'],[E_ERROR,E_PARSE,E_CORE_ERROR,E_COMPILE_ERROR],true))
                fwrite(STDERR, "PHP OLUMCUL: {$e['message']} ({$e['file']}:{$e['line']})\n");
            });
            $home = getenv("HOME");
            $doc  = $home."/public_html";
            require $doc."/inc/auth.php";
            require $doc."/inc/products.php";

            $products = vestra_products();
            $accounts = auth_accounts();
            $byId = [];
            foreach ($accounts as $a) $byId[(string)($a['id']??'')] = $a;

            $brand = trim((string)getenv("BRAND"));
            if ($brand !== '') {
              echo "===== MARKA: '{$brand}' (hangi saticiya ait olursa olsun) =====\n";
              $hits = array_values(array_filter($products, fn($p) => stripos((string)($p['brand']??''), $brand) !== false));
              if (!$hits) { echo "  *** bu markada urun yok ***\n"; exit(0); }
              foreach ($hits as $p) {
                $su = (string)($p['seller_uid'] ?? '');
                $sLabel = $su === '' ? '(satici yok -- demo/platform)' : (($byId[$su]['company'] ?? $byId[$su]['name'] ?? '?')." (id={$su})");
                if ($su !== '' && !isset($byId[$su])) $sLabel = "*** HESAP BULUNAMADI (id={$su}) ***";
                echo "  ".($p['id']??'?')." | ".($p['name']??'?')." | cat=".($p['cat']??'?')
                   ." | sample_price=".(!empty($p['sample_price'])?$p['sample_price']:'-')
                   ." | status=".($p['status']??'approved')
                   ." | satici: {$sLabel}\n";
              }
              echo "\nTOPLAM: ".count($hits)." urun\n";
              exit(0);
            }

            $terms = array_filter(array_map('trim', explode(',', strtolower((string)getenv("Q")))));
            if (!$terms) { fwrite(STDERR, "HATA: query ve brand ikisi de bos\n"); exit(1); }

            foreach ($terms as $term) {
              echo "===== ARAMA: '{$term}' =====\n";
              $matched = [];
              foreach ($accounts as $a) {
                $hay = strtolower(($a['company']??'').' '.($a['name']??''));
                if (strpos($hay, $term) !== false) $matched[] = $a;
              }
              if (!$matched) { echo "  *** hesap bulunamadi ***\n\n"; continue; }
              foreach ($matched as $a) {
                echo "  --- ".($a['company'] ?: $a['name'])." (id=".($a['id']??'?').", email=".($a['email']?:'YOK').") ---\n";
                $mine = array_values(array_filter($products, fn($p) => ($p['seller_uid'] ?? '') === $a['id']));
                if (!$mine) { echo "      (bu hesaba bagli hicbir urun yok)\n\n"; continue; }
                foreach ($mine as $p) {
                  echo "      ".($p['id']??'?')." | ".($p['brand']??'?')." | ".($p['name']??'?')." | cat=".($p['cat']??'?')
                     ." | sku=".($p['sku']??'')." | fiyat=".($p['list']??'?')
                     ." | sample_price=".(!empty($p['sample_price'])?$p['sample_price']:'-')
                     ." | status=".($p['status']??'approved')."\n";
                }
                echo "      TOPLAM: ".count($mine)." urun\n\n";
              }
            }
            PHPEOF
            php -l /tmp/seller_products.php
            php /tmp/seller_products.php
            rm -f /tmp/seller_products.php
