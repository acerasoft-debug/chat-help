name: (Salt-okunur) Satıcının ürünlerini listele
on:
  workflow_dispatch:
    inputs:
      query:
        description: "Hesap arama metni (company/name içinde, virgülle birden fazla). BOŞ + brand doluysa marka modu."
        required: false
        default: ""
      brand:
        description: "Marka modu: bu markadaki TÜM ürünleri (hangi satıcıya ait olursa olsun) listeler"
        required: false
        default: ""
      admin_mode:
        description: "'keygen' = sunucuda şifreleme anahtarı üretir, public key'i yazar. 'apply' = payload'daki şifreli satıcı bilgilerini uygular. 'issue' = faturayı KESER (e-posta GÖNDERMEZ). 'currency' = faturanın para birimini KAYDA yazar. 'shipping' = siparişe navlun yazar (sipariş toplamı da güncellenir; issue_shipping='auto' = bölge tarifesi). 'seller' = faturayı KİMİN keseceğini kayda yazar (issue_ref=sipariş, payload='vestra'|hesap adı parçası|boş; birden fazla satıcılı sipariş böylece TEK belge olur, KURAL 5b). Üçü de numara yakmaz, belge üretmez, kimseye gitmez. 'order_draft' = SALT OKUNUR sipariş taslağı (hesap + fiyatlar + toplam; hiçbir şey yazmaz). 'order_write' = AYNI hesaplamayı yapar ve siparişi orders.csv'ye YAZAR (fatura KESMEZ, e-posta göndermez). 'order_delete' = siparişi SİLER (issue_ref=sipariş, move_apply=true; varsayılan kuru koşu, panelin Delete düğmesiyle AYNI yazıcı, yedek alır, geri okunur — FATURASI KESİLMİŞ siparişi reddeder, force yolu yalnız Admin ▸ Orders'ta). 'dropship_on' / 'dropship_off' = tek adet dropship ÖDEMESİNİ açar/kapatır (Admin ▸ Dropship'teki anahtarın aynısı; yazma geri okunur). 'thread_seller' = konuşmayı başka satıcıya taşır (KURAL 19). 'msg_del' = mesaj / engellenen deneme kaydı SİLER (move_threads='blocked:<tarih>' ya da 'msg:<thread>:<tarih>', move_apply=true ile uygular; panelin 🗑 düğmesiyle aynı fonksiyon, yedek alır). 'offer_restore' = panelden SİLİNMİŞ bir teklifi kendi 'bak-del' yedeğinden geri yükler (issue_ref=teklif ref); offer_price verilirse AYNI koşuda karşı teklifi de işler ve MÜŞTERİYE MEKTUP GÖNDERİR — offer_apply=true demedikçe kuru koşu. 'seller_activate' = ASKIDAKİ bir satıcıyı geri açar (issue_ref=hesap ID, move_apply=true; panelin Activate düğmesiyle aynı iki yazma, geri okunur). 'diskclean' = sunucunun DOLAN disk kotasını boşaltır (move_threads=spec, move_apply=true; varsayılan kuru koşu — müşteri belgesine, faturaya, dekonta ve teklif/mesaj yedeklerine DOKUNMAZ). 'ship' = siparişe taşıyıcı/servis/takip numarası yazar (issue_ref=sipariş, ship_spec=…); status=shipped verilirse 'gönderildi' mektubu MÜŞTERİYE gider. 'order_colours' = siparişin RENGİNİ düzeltir (issue_ref=sipariş, payload='SKU:Renk,Renk', move_apply=true; faturalıysa varsayılan RED — '|allow_invoiced=1' ile yazar ve AYNI numarayla yeniden çizim İSTER, KURAL 5f). 'order_add_line' = var olan bir siparişe YENİ bir SKU satırı ekler (issue_ref=sipariş, payload='SKU:ADET[:Renk=Adet,Renk=Adet]|allow_invoiced=1|unit=<fiyat>|note=<metin>', move_apply=true; renk kırılımı verilirse toplamı ADET'e eşit olmalı, ilanda kayıtlı olmayan renk yazılır ama UYARILIR; birim fiyat verilmezse katalog kademesinden, verilirse yalnız ilandan UCUZ olabilir; goods `vestra_order_lines()`'dan yeniden hesaplanır, indirim ve kargo DOKUNULMADAN kalır — ikinci bir hesap yolu yazılmadı; aynı SKU zaten sipariştaysa REDDEDİLİR, vestra_order_set_colours'a yönlendirir; faturalıysa varsayılan RED — '|allow_invoiced=1' ile yazar ve AYNI numarayla yeniden çizim İSTER, KURAL 5f). 'order_discount' = siparişe HOŞ GELDİN İNDİRİMİ işler (issue_ref=sipariş, payload='pct=5|code=<kupon>|allow_invoiced=1', move_apply=true; TUTAR yüzdeden türer, elle verilmez; indirim + toplam + payout BİRLİKTE yazılır ve geri okunur; PARASI GELMİŞ sipariş koşulsuz RED, faturalı sipariş opt-in ister ve AYNI numarayla yeniden çizim İSTER; kuru koşu vestra_welcome_auto'nun KARARINI ve bölgesel indirimi de basar — pct=0 indirimi KALDIRIR). 'create_buyer' = ELLE alıcı hesabı açar (payload=ŞİFRELİ zarf — müşterinin e-postası açık girdiye yazılmaz, çıktıda maskeli; move_apply=true ile uygular, varsayılan kuru koşu; panelin ➕ New buyer account formuyla AYNI yazıcı, müşteriye HİÇBİR ŞEY gitmez). 'lead_rename' = bir lead'in SADECE firma adını düzeltir (issue_ref=lead id ya da ALAN ADI — müşterinin adresi açık girdiye yazılmaz, çıktıda maskeli; payload=yeni ad; TAM 1 eşleşme yoksa durur; damgalara DOKUNMAZ, yani ilk mektup ikinci kez gitmez; move_apply=true ile uygular, varsayılan kuru koşu). 'preorder_ship' = kodda GÖMÜLÜ (demo) bir ürünün ön sipariş teslim tarihini yazar (issue_ref=ürün id, ör. amiri-core-polo; payload=YYYY-MM-DD, boş = KALDIR; sayfada görünecek cümleyi ÖNİZLER; moq/tiers gibi kardeş alanlara dokunmaz; move_apply=true ile uygular, varsayılan kuru koşu — CANLI LİSTELER için bu alan set-product.yml'den yazılır, orada reddedilir). 'platform_bank' = PLATFORMUN banka künyesini yazar (payload=ŞİFRELİ zarf, keygen'in public key'iyle; gövde {bank_iban, bank_eur_bic, bank_eur_name, …}; panelin 🏦 Platform billing formuyla AYNI yazıcı — mod-97 geçmezse HİÇBİR alan yazılmaz; çıktıda numara YOK; kuru koşu EUR kutusunun çıkıp çıkmayacağını BELLEKTE gösterir; move_apply=true ile yazar). 'password_setup' = elle açılan hesaba 'şifreni seç' MEKTUBU GÖNDERİR (issue_ref=hesap ID — adres açık girdiye yazılmaz, kayıttan çözülür; TAM 1 eşleşme yoksa durur; link/jeton/gövde log'a YAZILMAZ; move_apply=true ile gönderir, varsayılan kuru koşu ve kuru koşu jeton ÜRETMEZ). Boş = sadece listeler."
        required: false
        default: ""
      issue_currency:
        description: "admin_mode=currency ile: fatura hangi para biriminde kesilsin (EUR|USD). Boş = seçimi KALDIR, sipariş kendi birimine döner. Panelin açılır listesiyle aynı kayıt (KURAL 5i)."
        required: false
        default: ""
      issue_shipping:
        description: "OTOMATİK TARİFE ŞU AN PASİF (KURAL 34, 19 Eyl 2026 — Admin ▸ Orders'ta durdurulmuş durumda): 'auto' admin_mode=shipping'de REDDEDİLİR, order_draft|order_write'da navlun 0 yazar. admin_mode=shipping ile: siparişin KENDİ biriminde bir SAYISAL tutar yazın (ör: 86.04), fatura biriminde yazmak için sonuna kod ekleyin (ör: '100 USD') — kur siparişin damgasından okunur. Etiket için '|' ile ekleyin: '100 USD|Air freight'. Sipariş TOPLAMI da birlikte güncellenir. Anahtar tekrar açılırsa 'auto' = BÖLGE TARİFESİ (Avrupa/ABD; rakam tek tablodan, siparişin kendi kalemlerinden — tanınmayan ülkede iş DURUR)."
        required: false
        default: ""
      payload:
        description: "admin_mode=apply: şifreli satıcı bilgisi. admin_mode=create_buyer: şifreli hesap bilgisi (aynı KEY.IV.GÖVDE zarfı, keygen'in public key'iyle; gövde {email,name,company,vat_id,country,address,phone,lang,open_gate}). admin_mode=order_draft|order_write: kalemler. DROPSHIP (varsayılan) 'SKU:BEDEN:ADET,...'; TOPTAN 'pricing=wholesale|SKU:RENK:ADET,...' — kademe fiyatı, MOQ/paket adımı ve renk ilandan doğrulanır, beden dökümü ilanın serisinden türer. admin_mode=order_colours: 'SKU:Renk,Renk' (faturalı siparişte '|allow_invoiced=1'). Elle anlaşılan birim fiyat: 4. alan ('SKU:RENK:ADET:19.50') — katalog kademesini ezer, ilandan PAHALIysa reddedilir, gerekçe siparişin notuna yazılır. İlan edilen renk asgarisinden feragat: '|waive_min_colours=1'; ilan edilen asgari adetten feragat: '|waive_moq=1'; paket adımından feragat: '|waive_pack=1' (tam karton değil — beden dökümü yazılamaz). admin_mode=order_add_line: 'SKU:ADET[:Renk=Adet,Renk=Adet]' — var olan bir siparişe YENİ bir kalem; renk kırılımı verilirse toplamı ADET'e eşit olmalı. Ekler: '|allow_invoiced=1' (faturalı sipariş), '|unit=<fiyat>' (anlaşılan birim — yalnız ilandan ucuz olabilir), '|note=<metin>' (siparişin notuna eklenecek serbest metin)."
        required: false
        default: ""
      issue_ref:
        description: "admin_mode=issue için: faturası kesilecek sipariş (ör: VES-CF0B4185). Numara verilir, PDF kaydedilir, MÜŞTERİYE E-POSTA GİTMEZ."
        required: false
        default: ""
      issue_redraft:
        description: "admin_mode=issue ile 'true': kesilmiş faturayı AYNI numarayla yeniden üretir. Sadece daha müşteriye gitmemiş bir belgedeki hatayı düzeltmek için."
        required: false
        default: "false"
      issue_number:
        description: "issue_redraft ile: faturanın sıra numarasını bu sayıya çeker (ör: 102 -> INV-2026-000102) ve satıcının sayacını oradan devam ettirir. Boş = numaraya dokunma."
        required: false
        default: ""
      move_to:
        description: "admin_mode=thread_seller: konusmalarin YENI saticisi — hesap uid'i ya da firma adindan bir parca (ör: tyrex)"
        required: false
        default: ""
      move_threads:
        description: "admin_mode=thread_seller: tasinacak thread id'leri (virgulle). 'ilan:<listing_id>' yazarsaniz O ILANIN tum thread'leri. admin_mode=diskclean ile: ne temizlenecek — 'sessions[:gun]' (varsayilan 2), 'baks[:kac_kalsin]' (varsayilan 20), 'tmp', 'errlog[:satir]' (varsayilan 2000). Bos = hepsi."
        required: false
        default: ""
      move_apply:
        description: "admin_mode=thread_seller / seller_activate / msg_del / diskclean: 'true' = UYGULA. Varsayilan kuru kosu — ne olacagini yazar, dosyaya dokunmaz."
        required: false
        default: "false"
      ship_spec:
        description: "admin_mode=ship: gönderim bilgisi — 'tracking=<no>|carrier=ups|service=Express Saver|status=shipped'. status=shipped verilirse MÜŞTERİYE 'gönderildi' MEKTUBU GİDER. offer_apply=true demedikçe kuru koşu."
        required: false
        default: ""
      offer_price:
        description: "admin_mode=offer_restore: karşı teklif BİRİM fiyatı (ör: 100). Boş = yalnız kaydı geri yükle, teklif verme, MÜŞTERİYE HİÇBİR ŞEY GİTMEZ."
        required: false
        default: ""
      offer_apply:
        description: "admin_mode=offer_restore: 'true' = KAYDET (ve fiyat verildiyse karşı teklifi işleyip MÜŞTERİYE MEKTUP GÖNDER). Varsayılan kuru koşu."
        required: false
        default: "false"
      issue_pubkey:
        description: "admin_mode=issue için: kesilen PDF'in şifreleneceği RSA public key (PEM, base64). Depo herkese açık, PDF şifresiz dönmez."
        required: false
        default: ""

permissions:
  contents: read

# Salt-okunur. Iki mod:
#  - query doluysa: her hesap icin o hesabin seller_uid'sine sahip TUM urunler.
#  - brand doluysa: o markadaki TUM urunler + HANGI saticiya ait olduklari
#    (satici yoksa "demo/platform", varsa isim+id) -- toplu tasima oncesi
#    kapsami gormek icin.
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      # Satici kimligi ve banka bilgisi ICERI dogru sifreli tasinir.
      #
      # Neden: bu depo herkese acik, dolayisiyla Actions log'u ve calisma girdileri de
      # oyle ve kalici. Bir IBAN gizli bir sir degil -- her faturada zaten yaziyor -- ama
      # "su sirketin alacak hesabi bu" bilgisini herkese acik, indekslenen bir sayfada
      # birakmak fatura sahteciligi yapanlarin isini kolaylastirir. Bu yuzden sunucu bir
      # anahtar cifti uretiyor (keygen), ben bilgileri onun public key'i ile sifreliyorum,
      # log'da sadece sifreli metin duruyor.
      - name: Şifreleme anahtarı üret (keygen)
        if: ${{ github.event.inputs.admin_mode == 'keygen' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 3m
          script: |
            php -r '
              $f = getenv("HOME")."/.vestra_inbox_key.pem";
              if (!is_file($f)) {
                $k = openssl_pkey_new(["private_key_bits"=>3072,"private_key_type"=>OPENSSL_KEYTYPE_RSA]);
                openssl_pkey_export($k, $priv);
                file_put_contents($f, $priv); chmod($f, 0600);
                echo "yeni anahtar uretildi\n";
              } else { echo "anahtar zaten var, korunuyor\n"; }
              $priv = openssl_pkey_get_private((string)file_get_contents($f));
              $pub  = openssl_pkey_get_details($priv)["key"];
              echo "PUBKEY ".base64_encode($pub)."\n";
            '

      # ELLE ALICI HESABI AÇMA (KURAL 28). Panelin "➕ New buyer account"
      # formuyla AYNI yazıcı: `auth_create_buyer()`. İkinci bir kurucu
      # yazılmadı -- bu depoda "aynı olgu birkaç yerde yazılı" hatası
      # defalarca kayıtlı ve buradaki bedeli, panelden açılan hesapla iş
      # akışından açılanın farklı alanlar taşıması olurdu.
      #
      # MÜŞTERİNİN E-POSTASI AÇIK GİRDİYE YAZILMAZ. Bu kural bu depoda zaten
      # bir kez uygulandı (`only_emails` girdisi kaldırılıp `only_accounts`
      # yapıldı: "girdi, çalıştırma başlığında kalıcı ve herkese açık"). Orada
      # çözüm "kayıttan çözdür"dü; burada çözülecek bir kayıt HENÜZ YOK --
      # hesap daha açılmıyor. O yüzden `apply` modunun ŞİFRELİ zarfı
      # kullanılıyor: KEY.IV.GÖVDE, özel anahtar ~/.vestra_inbox_key.pem,
      # sunucudan hiç çıkmıyor. Girdi herkese açık ama okunamaz.
      #
      # ÇIKTIDA ADRES MASKELİ. Kütük de herkese açık; zarfı şifreleyip sonra
      # adresi düz basmak, kapıyı arkadan açmak olurdu.
      - name: Elle alıcı hesabı aç (create_buyer) — varsayılan KURU KOŞU
        if: ${{ github.event.inputs.admin_mode == 'create_buyer' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          PAYLOAD: ${{ github.event.inputs.payload }}
          CB_APPLY: ${{ github.event.inputs.move_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: PAYLOAD,CB_APPLY
          script: |
            set -e
            cat > /tmp/vestra_create_buyer.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $home = getenv("HOME"); $doc = $home."/public_html";
            /* require_ONCE, ikisi de: auth.php zaten security.php'yi yukluyor
               (satir 17) ve duz `require` onu IKINCI kez yukleyip
               "Cannot redeclare _vsec_dir()" ile OLDURUYOR. Yerel kum
               havuzunda cizdirilerek bulundu -- `php -l` bunu gecirir.
               Yine de ACIKCA yaziliyor: kardes bir dosyanin require'ina
               yaslanmak KURAL 15'in fatal'inin kucuk hali. */
            require_once $doc."/inc/auth.php";
            require_once $doc."/inc/security.php";

            $APPLY = strtolower(trim((string)getenv('CB_APPLY'))) === 'true';

            /* Zarf: KEY.IV.GOVDE -- rakamsiz base64. Rakamlarin degistirilme
               sebebi kayitli: kisa sayisal bir secret (DEPLOY_PORT="22")
               rastgele base64 icinde *** ile maskeleniyor ve govdeyi bozuyor. */
            $dec = fn(string $x) => base64_decode(strtr($x, '!$%&#,;?@~', '0123456789'), true);
            $parts = explode('.', trim((string)getenv('PAYLOAD')));
            if (count($parts) !== 3) { fwrite(STDERR, "payload bicimi hatali (KEY.IV.GOVDE bekleniyor)\n"); exit(1); }
            $priv = openssl_pkey_get_private((string)@file_get_contents($home."/.vestra_inbox_key.pem"));
            if (!$priv) { fwrite(STDERR, "sunucuda anahtar yok -- once admin_mode=keygen calistir\n"); exit(1); }
            if (!openssl_private_decrypt($dec($parts[0]), $aes, $priv, OPENSSL_PKCS1_OAEP_PADDING)) {
              fwrite(STDERR, "anahtar acilamadi (yanlis public key ile mi sifrelendi?)\n"); exit(1);
            }
            $json = openssl_decrypt($dec($parts[2]), 'aes-256-cbc', $aes, OPENSSL_RAW_DATA, $dec($parts[1]));
            $in = $json === false ? null : json_decode($json, true);
            if (!is_array($in) || trim((string)($in['email'] ?? '')) === '') {
              fwrite(STDERR, "govde cozulemedi (email gerekli)\n"); exit(1);
            }

            /* Adres maskesi: ilk harf + *** + alan adi. Bu kutuk herkese acik. */
            $mask = function (string $e): string {
              $p = strpos($e, '@');
              return $p === false ? '***' : substr($e, 0, 1).'***'.substr($e, $p);
            };
            $em = strtolower(trim((string)$in['email']));
            $ctry = trim((string)($in['country'] ?? ''));

            echo "e-posta  : ".$mask($em)."\n";
            echo "firma    : ".trim((string)($in['company'] ?? ''))."\n";
            echo "kisi     : ".trim((string)($in['name'] ?? ''))."\n";
            echo "ulke     : {$ctry}   dil: ".substr(trim((string)($in['lang'] ?? 'en')),0,2)."\n";
            echo "VAT      : ".(trim((string)($in['vat_id'] ?? '')) !== '' ? 'VAR' : '(yok)')."\n";
            echo "adres    : ".(trim((string)($in['address'] ?? '')) !== '' ? 'VAR' : '(yok)')."\n";
            echo "fiyat kapisi: ".(!empty($in['open_gate']) ? 'ACIK (kyb_status=approved)' : 'KAPALI (pending)')."\n";

            /* KURU KOSU on kontrolu. Yaziciyi cagiramayiz (yazar), o yuzden
               AYNI uc yuklem burada da soruluyor -- ikinci bir KURUCU degil,
               yalnizca on kontrol; yazan tek yer hala auth_create_buyer(). */
            if (!$APPLY) {
              $why = [];
              if (!filter_var($em, FILTER_VALIDATE_EMAIL)) $why[] = 'gecersiz e-posta';
              if (auth_find($em)) $why[] = 'bu adres ZATEN kayitli';
              if (vestra_country_declares_turkey($ctry)) $why[] = 'KURAL 2g: Turkiye';
              echo "\nKURU KOSU -- hicbir sey yazilmadi.\n";
              echo $why ? "ENGEL: ".implode(' | ', $why)."\n" : "engel yok; move_apply=true ile acilir.\n";
              exit($why ? 1 : 0);
            }

            $r = auth_create_buyer([
              'email' => $em, 'name' => $in['name'] ?? '', 'company' => $in['company'] ?? '',
              'vat_id' => $in['vat_id'] ?? '', 'reg_number' => $in['reg_number'] ?? '',
              'country' => $ctry, 'address' => $in['address'] ?? '', 'phone' => $in['phone'] ?? '',
              'lang' => $in['lang'] ?? 'en', 'open_gate' => !empty($in['open_gate']),
              'kyb_auto' => 'operator:workflow',
            ]);
            if (is_string($r)) { fwrite(STDERR, "\nACILMADI: {$r}\n"); exit(1); }

            /* GERI OKUMA: auth_create_buyer zaten kayittan okuyup donuyor, ama
               sonda da diskten bagimsiz olarak tekrar soruyor -- "acildi" diyen
               satir, dosyada gercekten duran kaydi gostermeli. */
            $back = auth_find($em);
            if (!$back || (string)($back['id'] ?? '') !== (string)$r['id']) {
              fwrite(STDERR, "\nYAZILDI AMA GERI OKUNAMADI\n"); exit(1);
            }
            $docs = array_map(fn($x) => (string)($x['type'] ?? ''), (array)($back['doc_requests'] ?? []));
            echo "\nACILDI\n";
            echo "hesap ID : ".$back['id']."\n";
            echo "tip/durum: ".($back['type'] ?? '')." / ".($back['status'] ?? '')."\n";
            echo "kyb      : ".($back['kyb_status'] ?? '')."  (".($back['kyb_auto'] ?: '-').")\n";
            echo "kapi     : ".(auth_prices_unlocked($back) ? 'ACIK' : 'KAPALI')."\n";
            echo "belge istegi: ".($docs ? implode(', ', $docs) : '*** YOK ***')."\n";
            echo "MUSTERIYE HICBIR SEY GONDERILMEDI (KURAL 18).\n";
            PHPEOF
            php /tmp/vestra_create_buyer.php; RC=$?
            rm -f /tmp/vestra_create_buyer.php
            exit $RC

      # PLATFORMUN BANKA KÜNYESİ (19 Eyl 2026, KURAL 5j/5r). Operatör
      # *"sana verdigim alman hesabi faturalarda cikmiyor"* dedi; ölçüm
      # `bank_iban BOŞ` gösterdi ve tek giriş yolu paneldi. Bu adım paneldeki
      # formun AYNI yazıcısını çağırıyor: `vestra_platform_seller_save()`
      # (inc/invoice.php) — ikinci bir kurucu değil; mod-97 kapısı, biçim ve
      # geri okuma tek yerde.
      #
      # BANKA NUMARASI AÇIK GİRDİYE YAZILMAZ (Güvenlik bölümü; bu depo bir kez
      # bunu çiğnedi ve KURAL 5r'nin düzeltme maddesi onu kaydediyor). O yüzden
      # `create_buyer`'ın ŞİFRELİ zarfı: KEY.IV.GÖVDE, keygen'in public
      # key'iyle; özel anahtar ~/.vestra_inbox_key.pem sunucudan hiç çıkmıyor.
      # Gövde: {bank_iban, bank_eur_bic, bank_eur_name, bank_eur_address, …}
      # — yazıcının kabul ettiği her alan.
      #
      # ÇIKTIDA NUMARA YOK: IBAN yalnız "ülke + hane sayısı + mod-97" olarak
      # basılıyor (diag-messages'ın billing_for sondasıyla aynı maske). BIC ve
      # banka adı açık — ikisi de her faturada basılan kimlik, hesap değil.
      #
      # KURU KOŞU VARSAYILAN ve kuru koşu "yazılsaydı EUR kutusu çıkar mıydı"
      # sorusunu BELLEKTE cevaplıyor: mevcut künye + zarf birleştirilip
      # `vestra_payment_rails(…,'EUR')` çağrılıyor. Yani operatör IBAN'ın
      # gerçekten kutuyu açacağını görmeden hiçbir şey yazılmıyor.
      - name: Platform banka künyesi (platform_bank) — varsayılan KURU KOŞU
        if: ${{ github.event.inputs.admin_mode == 'platform_bank' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          PAYLOAD: ${{ github.event.inputs.payload }}
          PB_APPLY: ${{ github.event.inputs.move_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: PAYLOAD,PB_APPLY
          script: |
            set -e
            cat > /tmp/vestra_platform_bank.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $home = getenv("HOME"); $doc = $home."/public_html";
            require_once $doc."/inc/products.php";
            require_once $doc."/inc/auth.php";
            require_once $doc."/inc/invoice.php";

            $APPLY = strtolower(trim((string)getenv('PB_APPLY'))) === 'true';

            /* Deploy inmemis mi? Eski bir kopya da parse edilir; fonksiyonun
               VARLIGI soruluyor (KURAL 21b'nin dersi). */
            if (!function_exists('vestra_platform_seller_save')) {
              fwrite(STDERR, "*** DEPLOY INMEMIS -- vestra_platform_seller_save() yok ***\n"); exit(1);
            }

            /* Zarf: KEY.IV.GOVDE, rakamsiz base64 (create_buyer ile ayni). */
            $dec = fn(string $x) => base64_decode(strtr($x, '!$%&#,;?@~', '0123456789'), true);
            $parts = explode('.', trim((string)getenv('PAYLOAD')));
            if (count($parts) !== 3) { fwrite(STDERR, "payload bicimi hatali (KEY.IV.GOVDE bekleniyor)\n"); exit(1); }
            $priv = openssl_pkey_get_private((string)@file_get_contents($home."/.vestra_inbox_key.pem"));
            if (!$priv) { fwrite(STDERR, "sunucuda anahtar yok -- once admin_mode=keygen calistir\n"); exit(1); }
            if (!openssl_private_decrypt($dec($parts[0]), $aes, $priv, OPENSSL_PKCS1_OAEP_PADDING)) {
              fwrite(STDERR, "anahtar acilamadi (yanlis public key ile mi sifrelendi?)\n"); exit(1);
            }
            $json = openssl_decrypt($dec($parts[2]), 'aes-256-cbc', $aes, OPENSSL_RAW_DATA, $dec($parts[1]));
            $in = $json === false ? null : json_decode($json, true);
            if (!is_array($in) || !$in) { fwrite(STDERR, "govde cozulemedi\n"); exit(1); }

            /* MASKE: numara basilmaz. IBAN -> ulke + hane + mod-97. */
            $ibanMask = function (string $v): string {
              $n = vestra_iban_normalize($v);
              return $n === '' ? '(bos)' : substr($n,0,2).', '.strlen($n).' hane, mod-97 '.(vestra_iban_valid($n) ? 'GECERLI' : '*** GECERSIZ ***');
            };
            $secret = ['bank_iban','bank_account','bank_routing'];
            echo "ZARFTAKI ALANLAR:\n";
            foreach ($in as $k => $v) {
              $v = trim((string)$v); if ($v === '') continue;
              if ($k === 'bank_iban')      echo "  bank_iban        : ".$ibanMask($v)."\n";
              elseif (in_array($k, $secret, true)) echo "  {$k}: VAR (".strlen(preg_replace('/\D/','',$v))." hane)\n";
              else echo "  ".str_pad($k,17).": ".$v."\n";
            }

            /* ONCE / SONRA -- odeme kutusu satir sayisi, cizicinin okudugu AYNI
               fonksiyondan. "Sonra" kuru kosuda BELLEKTE: yazmadan, sonucu
               gorerek. */
            $before = vestra_platform_seller();
            $merged = $before;
            foreach ($in as $k => $v) { $v = trim((string)$v); if ($v !== '') $merged[$k] = ($k === 'bank_iban') ? vestra_iban_normalize($v) : $v; }
            $cnt = fn(array $acc, string $c) => count(vestra_payment_rails($acc, $c));
            printf("\nODEME KUTUSU  EUR: %d -> %d satir   USD: %d -> %d satir\n",
                   $cnt($before,'EUR'), $cnt($merged,'EUR'), $cnt($before,'USD'), $cnt($merged,'USD'));
            if ($cnt($merged,'EUR') === 0) echo "*** UYARI: bu zarf yazilsa da EUR kutusu yine BOS kalir ***\n";

            if (!$APPLY) {
              $bad = isset($in['bank_iban']) && !vestra_iban_valid(vestra_iban_normalize((string)$in['bank_iban']));
              echo "\nKURU KOSU -- hicbir sey yazilmadi.\n";
              echo $bad ? "ENGEL: IBAN mod-97'den gecmiyor; yazici HICBIR alani kaydetmez.\n"
                        : "engel yok; move_apply=true ile yazilir.\n";
              exit($bad ? 1 : 0);
            }

            $r = vestra_platform_seller_save($in);
            if (empty($r['ok'])) { fwrite(STDERR, "\nYAZILMADI: ".($r['error'] ?? '?')."\n"); exit(1); }

            /* GERI OKUMA diskten, yazicinin donusunden degil. */
            $after = vestra_platform_seller();
            echo "\nYAZILDI: ".implode(', ', array_keys($r['saved']))."\n";
            echo "geri okuma:\n";
            echo "  bank_iban        : ".$ibanMask((string)($after['bank_iban'] ?? ''))."\n";
            echo "  bank_eur_bic     : ".((string)($after['bank_eur_bic'] ?? '') ?: '(yok)')."\n";
            echo "  bank_eur_name    : ".((string)($after['bank_eur_name'] ?? '') ?: '(yok)')."\n";
            echo "  bank_eur_address : ".(trim((string)($after['bank_eur_address'] ?? '')) !== '' ? 'VAR' : '(yok)')."\n";
            printf("  odeme kutusu     : EUR %d satir · USD %d satir\n", $cnt($after,'EUR'), $cnt($after,'USD'));
            $gap = vestra_invoice_payment_gap(null, 'EUR', false);
            echo "  EUR kesimi (KURAL 5r): ".($gap === '' ? 'GECER' : '*** DURUR -- '.$gap)."\n";
            PHPEOF
            php -d display_errors=stderr -d error_reporting=-1 /tmp/vestra_platform_bank.php; RC=$?
            rm -f /tmp/vestra_platform_bank.php
            exit $RC

      # ELLE AÇILAN HESABA "ŞİFRENİ SEÇ" MEKTUBU (17 Eyl 2026).
      #
      # `create_buyer` hesabı açıyor ama şifre RASTGELE ve hiçbir yere
      # yazılmıyor, yani müşterinin giriş yapmasının bir yolu yok. Bu adım o
      # boşluğu kapatıyor.
      #
      # ÖLÇÜT HESAP ID'Sİ, ADRES DEĞİL. `diag-live.yml`'deki mevcut
      # `reset_probe` bu işi yapabiliyor ama girdisi bir E-POSTA — yani
      # müşterinin adresi koşu başlığında kalıcı ve herkese açık. Bu depo o
      # hatayı `only_emails` → `only_accounts` ile bir kez düzeltti; aynı
      # deseni burada tekrarlıyoruz. ID opak: kimin olduğunu ele vermiyor.
      # Ad parçası da kabul ediliyor ama EŞLEŞME TAM 1 DEĞİLSE İŞ DURUR —
      # sıfırda kimseye gitmez, birden fazlada YANLIŞ müşteriye giderdi ve
      # gönderilmiş bir mektup geri alınamaz.
      #
      # JETON ÜRETİCİSİ TEK: `auth_reset_begin()` — forgot.php'nin çağırdığının
      # aynısı. İkinci bir jeton yolu, ikinci bir ömür ve ikinci bir güvenlik
      # kuralı demekti.
      #
      # LİNK VE JETON BASILMIYOR. Jeton tek başına hesabı açar ve bu kütük
      # herkese açık. Adres de maskeli. GÖVDE de basılmıyor: hitapta
      # müşterinin adı var.
      #
      # KURU KOŞU JETON ÜRETMEZ. `auth_reset_begin()` kayda yazıyor ve varsa
      # ÖNCEKİ jetonu geçersiz kılıyor — bir önizlemenin müşterinin elindeki
      # canlı linki öldürmesi kabul edilemez. Kuru koşu metni sahte bir linkle
      # kuruyor; bu aynı zamanda şablonun sunucuya İNDİĞİNİ de ölçüyor
      # ("deploy inmemiş" ile "özellik çalışmıyor" aynı görünür).
      - name: Hesaba "şifreni seç" mektubu — varsayılan KURU KOŞU
        if: ${{ github.event.inputs.admin_mode == 'password_setup' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          PS_WHO:   ${{ github.event.inputs.issue_ref }}
          PS_APPLY: ${{ github.event.inputs.move_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 4m
          envs: PS_WHO,PS_APPLY
          script: |
            set -e
            cat > /tmp/vestra_pwsetup.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $home = getenv("HOME"); $doc = $home."/public_html";
            require_once $doc."/inc/products.php";
            require_once $doc."/inc/auth.php";
            require_once $doc."/inc/notify.php";
            require_once $doc."/inc/i18n.php";

            $who   = mb_strtolower(trim((string)getenv("PS_WHO")));
            $apply = strtolower(trim((string)getenv("PS_APPLY"))) === 'true';
            if ($who === '') { fwrite(STDERR, "HATA: issue_ref bos -- hesap ID'si (ya da ad parcasi) verin\n"); exit(1); }

            $mask = fn(string $e) => preg_replace('/^(.).*(@.*)$/', '$1***$2', $e);

            /* ID TAM esitlik once: bir kisinin SOYADI kalici, herkese acik bir
               girdiye yazilmasin diye. Bu depoda 'francisco' aramasi BASKA bir
               hesabi (C&F Multimarcas) yalniz e-postasindan yakalamisti. */
            $hits = [];
            foreach (auth_accounts() as $a) if (mb_strtolower((string)($a['id'] ?? '')) === $who) { $hits = [$a]; break; }
            if (!$hits) foreach (auth_accounts() as $a) {
              $hay = mb_strtolower((string)($a['company'] ?? '').' '.(string)($a['name'] ?? ''));
              if ($who !== '' && str_contains($hay, $who)) $hits[] = $a;
            }
            if (count($hits) !== 1) {
              fwrite(STDERR, "HATA: TAM 1 hesap eslesmedi (".count($hits)." bulundu) -- gonderilmedi.\n");
              foreach (array_slice($hits, 0, 8) as $a)
                fwrite(STDERR, "  aday: ".(string)($a['id'] ?? '')."  ".(string)($a['company'] ?: $a['name'] ?: '?')."  ".$mask((string)($a['email'] ?? ''))."\n");
              exit(1);
            }
            $acc  = $hits[0];
            $mail = trim((string)($acc['email'] ?? ''));
            $lang = vestra_user_lang($acc);          /* HESABIN KAYITLI DILI: bu mektup
                                                        operatorun isteginden doguyor,
                                                        musterinin kendi isteginden degil --
                                                        vlang() burada yanlis sinyal
                                                        (vestra_reset_text'in kendi notu). */
            $open   = auth_prices_unlocked($acc);
            $docSt  = auth_trade_doc_status($acc);
            $askDoc = ($docSt === 'requested');      /* 'uploaded' olana "yukleyin" demek
                                                        yaptigi isi tekrar yaptirmaktir. */

            printf("hesap    : %s\n", (string)($acc['id'] ?? ''));
            printf("firma    : %s\n", (string)($acc['company'] ?: $acc['name'] ?: '?'));
            printf("adres    : %s\n", $mask($mail));
            printf("tip/durum: %s / %s\n", (string)($acc['type'] ?? '?'), (string)($acc['status'] ?? '?'));
            printf("dil      : %s   ulke: %s\n", $lang, (string)($acc['country'] ?? '-'));
            printf("kapi     : %s\n", $open ? 'ACIK (mektup "hemen siparis verebilirsiniz" der)' : 'KAPALI (mektup "ekibimiz onaylayacak" der)');
            printf("trade_licence: %s -> belge cumlesi %s\n", $docSt ?: '(satir yok)', $askDoc ? 'YAZILIR' : 'yazilmaz');
            printf("posta    : mail_enabled=%s  from=%s\n",
                   vestra_cfg('mail_enabled', false) ? 'acik' : '*** KAPALI ***',
                   (string)vestra_cfg('mail_from', '(bos)'));

            if (!function_exists('vestra_account_ready_text')) {
              fwrite(STDERR, "\nHATA: vestra_account_ready_text sunucuda YOK -- deploy inmemis.\n"); exit(1);
            }
            $name = ($acc['name'] ?: ($acc['company'] ?: 'there'));

            if (!$apply) {
              /* Sahte link: jeton URETILMIYOR (uretmek musterinin elindeki canli
                 linki gecersiz kilardi ve kayda yazardi). */
              [$s, $b, $o] = vestra_account_ready_text($lang, $name, 'https://vestrasales.com/reset?token=KURU-KOSU', $open, $askDoc);
              printf("\nkonu     : %s\n", $s);
              printf("dugme    : %s\n", (string)($o['button']['label'] ?? '?'));
              printf("govde    : %d karakter (GOVDE BASILMIYOR: hitapta musterinin adi var)\n", mb_strlen($b));
              echo "\nKURU KOSU -- jeton uretilmedi, MEKTUP GONDERILMEDI (move_apply=true ile gonderilir).\n";
              exit(0);
            }

            $a2 = auth_reset_begin($mail);
            if (!$a2 || empty($a2['reset_token'])) { fwrite(STDERR, "\nHATA: jeton uretilemedi\n"); exit(1); }
            $link = 'https://vestrasales.com/reset?token='.$a2['reset_token'];
            [$s, $b, $o] = vestra_account_ready_text($lang, $name, $link, $open, $askDoc);
            $ok = vestra_send_mail($mail, $s, $b, '', '', null, '', $o);
            printf("\nkonu     : %s\n", $s);
            printf("jeton    : uretildi, son gecerlilik %s (LINK YAZILMADI: jeton tek basina hesabi acar)\n",
                   (string)(auth_find($mail)['reset_expires'] ?? '?'));
            printf("gonderim : %s\n", $ok ? "GONDERILDI -- posta saglayicisi kabul etti" : "*** GONDERILEMEDI ***");
            if (!$ok) { fwrite(STDERR, "vestra_send_mail FALSE dondu\n"); exit(1); }
            echo "NOT: 'kabul etti' posta kutusunda demek DEGIL (bu deponun kendi uyarisi).\n";
            PHPEOF
            php -l /tmp/vestra_pwsetup.php
            php /tmp/vestra_pwsetup.php; RC=$?
            rm -f /tmp/vestra_pwsetup.php
            exit $RC

      # SİPARİŞİN RENGİNİ DÜZELT (17 Eyl 2026). Renk siparişin notlarında duruyor
      # ve oraya yazan tek yol kasaydı — yani sipariş yazıldıktan sonra rengi
      # düzeltmenin hiçbir yolu yoktu (navlun ve teslimat adresi aynı boşluğu
      # daha önce kapattı). Tek yazıcı `vestra_order_set_colours()`.
      #
      # FATURALI siparişte varsayılan RED. Opt-in (`|allow_invoiced=1`) ile
      # yazar ve "AYNI numarayla yeniden çiz" diye UYARIR — KURAL 5f. Bu adım
      # belgeyi kendisi çizmiyor: yeniden çizim `admin_mode=issue` +
      # `issue_redraft=true`, yani kesim yolu TEK yerde kalıyor.
      - name: Siparişin rengini düzelt (order_colours) — varsayılan KURU KOŞU
        if: ${{ github.event.inputs.admin_mode == 'order_colours' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          OC_REF:   ${{ github.event.inputs.issue_ref }}
          OC_SPEC:  ${{ github.event.inputs.payload }}
          OC_APPLY: ${{ github.event.inputs.move_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: OC_REF,OC_SPEC,OC_APPLY
          script: |
            set -e
            cat > /tmp/vestra_order_colours.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require_once $doc."/inc/products.php";
            require_once $doc."/inc/orders.php";
            require_once $doc."/inc/invoice.php";

            $ref  = trim((string)getenv('OC_REF'));
            $spec = trim((string)getenv('OC_SPEC'));
            $APPLY = strtolower(trim((string)getenv('OC_APPLY'))) === 'true';
            if ($ref === '' || $spec === '') { fwrite(STDERR, "issue_ref ve payload gerekli ('SKU:Renk,Renk')\n"); exit(1); }

            $allowInv = (bool)preg_match('/(^|\|)\s*allow_invoiced\s*=\s*1\s*(\||$)/i', $spec);
            $spec = trim((string)preg_replace('/\|?\s*allow_invoiced\s*=\s*1\s*/i', '', $spec), " |");
            $pos = strpos($spec, ':');
            if ($pos === false) { fwrite(STDERR, "bicim: SKU:Renk,Renk\n"); exit(1); }
            $sku = trim(substr($spec, 0, $pos));
            $cols = array_values(array_filter(array_map('trim', explode(',', substr($spec, $pos + 1))), fn($x) => $x !== ''));

            $row = null; foreach (vestra_read_csv('orders.csv') as $r) if (($r['ref'] ?? '') === $ref) { $row = $r; break; }
            if (!$row) { fwrite(STDERR, "siparis bulunamadi: {$ref}\n"); exit(1); }
            $inv = vestra_invoices_for_ref($ref);

            echo "siparis      : {$ref}\n";
            echo "firma        : ".(string)($row['company'] ?? '-')."\n";
            echo "SKU          : {$sku}\n";
            foreach (vestra_order_lines($row)['lines'] as $l) {
              if ((string)$l['sku'] !== $sku) continue;
              echo "urun         : ".(string)($l['brand'] ?? '')." ".(string)($l['name'] ?? '')."\n";
              echo "mevcut renk  : ".(($l['colors'] ?? []) ? implode(', ', $l['colors']) : '(yok)')."\n";
              echo "adet         : ".(int)$l['qty']."\n";
              $p = vestra_product_by_sku($sku);
              echo "ilanin renkleri: ".($p && !empty($p['colors']) ? implode(' / ', (array)$p['colors']) : '(kayitli degil)')."\n";
            }
            echo "istenen renk : ".implode(', ', $cols)."\n";
            echo "kesilmis fatura: ".(count($inv) ?: 'yok')."\n";
            foreach ($inv as $iv) echo "   - ".(string)($iv['no'] ?? '?')."\n";

            if (!$APPLY) {
              echo "\nKURU KOSU -- hicbir sey yazilmadi.\n";
              if ($inv && !$allowInv) echo "ENGEL: fatura kesilmis. Yazmak icin spec'e |allow_invoiced=1 ekleyin,\n"
                                         ."       SONRA admin_mode=issue + issue_redraft=true ile AYNI numarayla yeniden cizin (KURAL 5f).\n";
              else echo "engel yok; move_apply=true ile uygulanir.\n";
              exit(0);
            }

            $r = vestra_order_set_colours($ref, $sku, $cols, $allowInv);
            if (!empty($r['error'])) { fwrite(STDERR, "\nYAZILMADI: ".$r['error']."\n"); exit(1); }
            echo "\nYAZILDI\n";
            echo "onceki       : ".(($r['before'] ?? []) ? implode(', ', $r['before']) : '(yok)')."\n";
            echo "yeni         : ".implode(', ', $r['colours'])."\n";
            echo "FATURANIN gordugu: ".implode(', ', (array)$r['on_invoice'])."   (geri okundu)\n";
            if (!empty($r['not_listed'])) {
              echo "*** UYARI: bu renk(ler) ILANDA KAYITLI DEGIL: ".implode(', ', $r['not_listed'])."\n";
              echo "    Belge satilan mali yaziyor; ilan gercekten bu renkleri satiyorsa ilan da guncellenmeli.\n";
            }
            if (!empty($r['must_redraft'])) {
              echo "*** YAPILACAK: fatura KESILMIS -- admin_mode=issue + issue_redraft=true ile AYNI numarayla\n";
              echo "    yeniden cizin, yoksa kayit ile belge AYRISIR (KURAL 5f).\n";
            }
            PHPEOF
            php /tmp/vestra_order_colours.php; RC=$?
            rm -f /tmp/vestra_order_colours.php
            exit $RC

      # SİPARİŞE YENİ BİR SATIR EKLE (order_add_line, 22 Eyl 2026 — operatör:
      # "Black x 20, White x10, Navy 20, Grey 10 … bu siparisi bu siparise
      # ekle VES-1A68FCD1"). `order_colours` yalnızca ZATEN var olan bir
      # kalemin renk notunu düzeltiyor; `order_write` HER ZAMAN yeni/ayrı bir
      # sipariş yazıyor. İkisinin arasında "var olan bir siparişe sonradan
      # yeni bir kalem ekleme" hiç yoktu — yazıcı `vestra_order_add_line()`.
      #   issue_ref : sipariş ref'i
      #   payload   : "SKU:ADET:Renk=Adet,Renk=Adet|allow_invoiced=1|unit=39.90|note=..."
      #               renk kırılımı OPSİYONEL (verilmezse renksiz tek satır);
      #               verilirse toplamı ADET'e eşit olmak ZORUNDA. `unit`
      #               verilmezse fiyat KATALOGDAN (vestra_unit_price) —
      #               verilirse yalnız ilandan UCUZ olabilir. Faturalıysa
      #               varsayılan RED; `allow_invoiced=1` ile yazar ve AYNI
      #               numarayla yeniden çizim İSTER (KURAL 5f).
      #   move_apply: varsayılan KURU KOŞU.
      - name: Siparişe yeni satır ekle (order_add_line) — varsayılan KURU KOŞU
        if: ${{ github.event.inputs.admin_mode == 'order_add_line' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          OAL_REF:   ${{ github.event.inputs.issue_ref }}
          OAL_SPEC:  ${{ github.event.inputs.payload }}
          OAL_APPLY: ${{ github.event.inputs.move_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: OAL_REF,OAL_SPEC,OAL_APPLY
          script: |
            set -e
            cat > /tmp/vestra_order_add_line.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require_once $doc."/inc/products.php";
            require_once $doc."/inc/orders.php";
            require_once $doc."/inc/invoice.php";

            $ref  = trim((string)getenv('OAL_REF'));
            $spec = trim((string)getenv('OAL_SPEC'));
            $APPLY = strtolower(trim((string)getenv('OAL_APPLY'))) === 'true';
            if ($ref === '' || $spec === '') { fwrite(STDERR, "issue_ref ve payload gerekli ('SKU:ADET:Renk=Adet,...')\n"); exit(1); }

            $allowInv = (bool)preg_match('/(^|\|)\s*allow_invoiced\s*=\s*1\s*(\||$)/i', $spec);
            $spec = trim((string)preg_replace('/\|?\s*allow_invoiced\s*=\s*1\s*/i', '', $spec), " |");
            $unitOv = null;
            if (preg_match('/(^|\|)\s*unit\s*=\s*([\d.,]+)\s*(\||$)/i', $spec, $um)) {
              $unitOv = (float)vestra_price_input($um[2]);
              $spec = trim((string)preg_replace('/(^|\|)\s*unit\s*=\s*[\d.,]+\s*/i', '$1', $spec), " |");
            }
            $noteExtra = '';
            if (preg_match('/(^|\|)\s*note\s*=\s*(.+?)\s*(\||$)/i', $spec, $nm)) {
              $noteExtra = trim($nm[2]);
              $spec = trim((string)preg_replace('/(^|\|)\s*note\s*=\s*.+?\s*(\||$)/i', '$1', $spec), " |");
            }

            $parts = explode(':', $spec, 3);
            if (count($parts) < 2) { fwrite(STDERR, "bicim: SKU:ADET[:Renk=Adet,Renk=Adet]\n"); exit(1); }
            $sku = trim($parts[0]);
            $qty = (int)trim($parts[1]);
            $colours = [];
            if (isset($parts[2]) && trim($parts[2]) !== '') {
              foreach (explode(',', $parts[2]) as $seg) {
                $seg = trim($seg);
                if ($seg === '' || strpos($seg, '=') === false) continue;
                [$cn, $cq] = array_map('trim', explode('=', $seg, 2));
                if ($cn !== '') $colours[$cn] = (int)$cq;
              }
            }

            $row = null; foreach (vestra_read_csv('orders.csv') as $r) if (($r['ref'] ?? '') === $ref) { $row = $r; break; }
            if (!$row) { fwrite(STDERR, "siparis bulunamadi: {$ref}\n"); exit(1); }
            $p = vestra_product_by_sku($sku);
            $inv = vestra_invoices_for_ref($ref);

            echo "siparis      : {$ref}\n";
            echo "firma        : ".(string)($row['company'] ?? '-')."\n";
            echo "mevcut kalemler:\n";
            foreach (vestra_order_lines($row)['lines'] as $l) {
              printf("  - %-16s x%-4d %s %s  renk: %s\n", (string)$l['sku'], (int)$l['qty'],
                (string)($l['brand'] ?? ''), (string)($l['name'] ?? ''),
                ($l['colors'] ?? []) ? implode(', ', $l['colors']) : '(yok)');
            }
            echo "eklenecek SKU: {$sku}\n";
            if (!$p) { fwrite(STDERR, "SKU katalogda yok: {$sku}\n"); exit(1); }
            echo "urun         : ".(string)($p['brand'] ?? '')." ".(string)($p['name'] ?? '')."\n";
            echo "ilanin renkleri: ".(!empty($p['colors']) ? implode(' / ', (array)$p['colors']) : '(kayitli degil)')."\n";
            $listUnit = round((float)vestra_unit_price($p, $qty, true), 2);
            echo "ilan kademesi (bu adette): EUR ".number_format($listUnit, 2)."\n";
            if ($unitOv !== null) echo "anlasilan birim: EUR ".number_format($unitOv, 2)."\n";
            echo "adet         : {$qty}\n";
            if ($colours) {
              echo "renk kirilimi:\n";
              foreach ($colours as $cn => $cq) echo "  {$cn} x {$cq}\n";
              echo "kirilim toplami: ".array_sum($colours)." (adetle ".(array_sum($colours) === $qty ? 'uyusuyor' : 'UYUSMUYOR').")\n";
            }
            $pre = function_exists('vestra_preorder_note') ? vestra_preorder_note($p) : '';
            if ($pre !== '') echo "on-siparis notu: {$pre}\n";
            echo "kesilmis fatura: ".(count($inv) ?: 'yok')."\n";
            foreach ($inv as $iv) echo "   - ".(string)($iv['no'] ?? '?')." (".(string)($iv['currency'] ?? '')." ".number_format((float)($iv['total'] ?? 0), 2).")\n";

            if (!$APPLY) {
              echo "\nKURU KOSU -- hicbir sey yazilmadi.\n";
              if ($inv && !$allowInv) echo "ENGEL: fatura kesilmis. Yazmak icin spec'e |allow_invoiced=1 ekleyin,\n"
                                         ."       SONRA admin_mode=issue + issue_redraft=true ile AYNI numarayla yeniden cizin (KURAL 5f).\n";
              else echo "engel yok; move_apply=true ile uygulanir.\n";
              exit(0);
            }

            $r = vestra_order_add_line($ref, $sku, $qty, $colours, $unitOv, $noteExtra, $allowInv);
            if (!empty($r['error'])) { fwrite(STDERR, "\nYAZILMADI: ".$r['error']."\n"); exit(1); }
            echo "\nYAZILDI\n";
            echo "birim        : EUR ".number_format($r['unit'], 2)."\n";
            echo "satir toplami: EUR ".number_format($r['line_total'], 2)."\n";
            echo "goods (TUM kalemler): EUR ".number_format($r['goods'], 2)."\n";
            echo "indirim (dokunulmadi): EUR ".number_format($r['discount'], 2)."\n";
            echo "kargo (dokunulmadi)  : EUR ".number_format($r['shipping'], 2)."\n";
            echo "YENI subtotal: EUR ".number_format($r['subtotal'], 2)."\n";
            echo "YENI payout  : EUR ".number_format($r['payout'], 2)."\n";
            echo "YENI total   : EUR ".number_format($r['total'], 2)."   (geri okundu)\n";
            if (!empty($r['not_listed'])) {
              echo "*** UYARI: bu renk(ler) ILANDA KAYITLI DEGIL: ".implode(', ', $r['not_listed'])."\n";
            }
            if (!empty($r['must_redraft'])) {
              echo "*** YAPILACAK: fatura KESILMIS -- admin_mode=issue + issue_redraft=true ile AYNI numarayla\n";
              echo "    yeniden cizin, yoksa kayit ile belge AYRISIR (KURAL 5f).\n";
            }
            PHPEOF
            php /tmp/vestra_order_add_line.php; RC=$?
            rm -f /tmp/vestra_order_add_line.php
            exit $RC

      # HOŞ GELDİN İNDİRİMİ (19 Eyl 2026). Yazıcı `vestra_order_set_discount()`:
      # indirim + sipariş toplamını BİRLİKTE yazar, yazdığını geri okur, parası
      # gelmiş siparişi koşulsuz, faturası kesilmişi opt-in olmadan reddeder.
      # Numara yakmaz, belge üretmez, MÜŞTERİYE HİÇBİR ŞEY GİTMEZ.
      #
      # Kuru koşu KARARI da yazıyor (vestra_welcome_auto): bölgesel indirim
      # yüzdesi, kaç siparişi var, ve gerekçe. "0" tek başına "hak etmiyor" ile
      # "hesap okunamadı"yı ayırmıyor.
      - name: Siparişe hoş geldin indirimi (order_discount) — varsayılan KURU KOŞU
        if: ${{ github.event.inputs.admin_mode == 'order_discount' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          ODC_REF:   ${{ github.event.inputs.issue_ref }}
          ODC_SPEC:  ${{ github.event.inputs.payload }}
          ODC_APPLY: ${{ github.event.inputs.move_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: ODC_REF,ODC_SPEC,ODC_APPLY
          script: |
            set -e
            cat > /tmp/vestra_order_disc.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require_once $doc."/inc/products.php";
            require_once $doc."/inc/orders.php";
            require_once $doc."/inc/invoice.php";
            require_once $doc."/inc/auth.php";
            require_once $doc."/inc/vouchers.php";

            $ref   = trim((string)getenv('ODC_REF'));
            $spec  = trim((string)getenv('ODC_SPEC'));
            $APPLY = strtolower(trim((string)getenv('ODC_APPLY'))) === 'true';
            if ($ref === '') { fwrite(STDERR, "issue_ref gerekli\n"); exit(1); }

            /* spec: pct=5 | code=<kupon kodu> | allow_invoiced=1
               pct verilmezse VESTRA_WELCOME_PCT -- rakam iki yerde yazili olmasin. */
            $kv = [];
            foreach (preg_split('/\|/', $spec) as $part) {
              $part = trim($part); if ($part === '') continue;
              $p = strpos($part, '='); if ($p === false) continue;
              $kv[strtolower(trim(substr($part, 0, $p)))] = trim(substr($part, $p + 1));
            }
            $pct      = isset($kv['pct']) && $kv['pct'] !== '' ? (float)str_replace(',', '.', $kv['pct'])
                                                              : (float)VESTRA_WELCOME_PCT;
            $code     = (string)($kv['code'] ?? '');
            $allowInv = ((string)($kv['allow_invoiced'] ?? '')) === '1';

            $row = null; foreach (vestra_read_csv('orders.csv') as $r) if (($r['ref'] ?? '') === $ref) { $row = $r; break; }
            if (!$row) { fwrite(STDERR, "siparis bulunamadi: {$ref}\n"); exit(1); }

            $goods = 0.0;
            foreach (vestra_order_lines($row)['lines'] as $l) $goods += (float)($l['line'] ?? 0);
            $goods = round($goods, 2);
            $email = strtolower(trim((string)($row['email'] ?? '')));
            $acc = null; foreach (auth_accounts() as $a) {
              if (strtolower(trim((string)($a['email'] ?? ''))) === $email) { $acc = $a; break; }
            }
            /* HESAP yoksa siparis satirinin ulkesi: bolgesel indirimi fiyata
               uygulayan yol hesaba bakiyor, ama hesapsiz bir siparis de olabilir
               ve o zaman elimizdeki tek olgu satirin kendi ulkesi. Ikisi de
               basiliyor ki hangisinin okundugu gorunur olsun. */
            $who = $acc ?: ['country' => (string)($row['country'] ?? '')];
            $auto = vestra_welcome_auto($email, $who, false, $ref);

            $stAll = vestra_read_json('order_statuses.json');
            $paid  = vestra_order_payment_settled($ref, $stAll[$ref] ?? []);
            $invs  = vestra_invoices_for_ref($ref);

            /* E-POSTA MASKELI: bu kutuk herkese acik. Is bilgisi (ref, firma,
               tutar, durum) acik kalir -- olcumun amaci o. */
            echo "siparis      : {$ref}\n";
            echo "firma        : ".(string)($row['company'] ?? '-')."\n";
            echo "e-posta      : ".preg_replace('/^(.).*(@.*)$/', '$1***$2', $email)."\n";
            echo "ulke (satir) : ".(string)($row['country'] ?? '-')."\n";
            echo "hesap        : ".($acc ? 'VAR (ulke: '.(string)($acc['country'] ?? '-').')' : 'YOK -- satirin ulkesi okunuyor')."\n";
            echo "mal toplami  : ".number_format($goods, 2)."\n";
            echo "navlun       : ".number_format((float)($row['shipping'] ?? 0), 2)."\n";
            echo "mevcut indirim: ".number_format((float)($row['discount'] ?? 0), 2)
                 ." (kod: ".((trim((string)($row['voucher_code'] ?? '')) !== '') ? (string)$row['voucher_code'] : '-').")\n";
            echo "mevcut toplam: ".number_format((float)($row['total'] ?? 0), 2)."\n";
            echo "-- karar (vestra_welcome_auto) --\n";
            echo "bolgesel indirim: ".number_format($auto['region_pct'], 2)."%"
                 .($auto['region_pct'] > 0 ? "   *** HARIC: bu musteri zaten indirimli ***" : "")."\n";
            echo "baska siparisi  : ".(int)$auto['orders']." (bu siparis HARIC)\n";
            echo "gerekce         : ".(string)$auto['why']."\n";
            echo "otomatik yuzde  : ".number_format($auto['pct'], 2)."%\n";
            echo "-- yazilacak --\n";
            echo "istenen yuzde: ".number_format($pct, 2)."%\n";
            echo "indirim      : ".number_format(voucher_discount(['type'=>'percent','value'=>$pct], $goods), 2)."\n";
            echo "kod          : ".($code !== '' ? voucher_norm($code) : vestra_welcome_auto_code())
                 ." ".(($code !== '' && voucher_find(voucher_norm($code))) ? '(GERCEK kupon -- yazmadan sonra damgalanir)' : '(etiket)')."\n";
            echo "odendi mi    : ".(!empty($paid['settled']) ? '*** EVET ('.(string)$paid['via'].') ***' : 'hayir')."\n";
            echo "kesilmis fatura: ".(count($invs) ?: 'yok')."\n";
            foreach ($invs as $iv) echo "   - ".(string)($iv['no'] ?? '?')."\n";

            /* KARAR ILE ISTEK AYRISIYORSA YAZ: operatorun elle verdigi bir yuzde
               otomatigi EZEBILIR (bu uc siparis tam olarak oyle isleniyor), ama
               ezdigi SESSIZ kalmamali -- ozellikle bolgesel indirim yuzunden
               haric tutulmus bir musteriye elle %5 yazmak, ayni satisa iki
               indirim vermek olur. */
            if ($pct > 0 && $auto['pct'] <= 0) {
              echo "\n*** DIKKAT: otomatik karar '".(string)$auto['why']."' diyor, yani bu siparis\n";
              echo "    kendiliginden indirim ALMAZDI. Elle {$pct}% yaziyorsunuz.\n";
              if ($auto['why'] === 'region')
                echo "    SEBEP: musteri zaten %".number_format($auto['region_pct'], 2)." bolgesel indirim aliyor --\n"
                   . "    ustune yazmak AYNI SATISA IKI INDIRIM demek (operatorun harici tam bu).\n";
            }

            if (!$APPLY) {
              echo "\nKURU KOSU -- hicbir sey yazilmadi.\n";
              if (!empty($paid['settled'])) echo "ENGEL: parasi gelmis siparis -- yazilamaz (iade ayri bir karar).\n";
              elseif ($invs && !$allowInv) echo "ENGEL: fatura kesilmis. Yazmak icin spec'e |allow_invoiced=1 ekleyin,\n"
                                              ."       SONRA admin_mode=issue + issue_redraft=true ile AYNI numarayla yeniden cizin (KURAL 5f).\n";
              else echo "engel yok; move_apply=true ile uygulanir.\n";
              exit(0);
            }

            $r = vestra_order_set_discount($ref, $pct, $code, $allowInv);
            if (!empty($r['error'])) { fwrite(STDERR, "\nYAZILMADI: ".$r['error']."\n"); exit(1); }
            echo "\nYAZILDI (geri okundu)\n";
            echo "onceki indirim: ".number_format((float)$r['before'], 2)."\n";
            echo "yeni indirim  : ".number_format((float)$r['discount'], 2)."  (".number_format((float)$r['pct'], 2)."% x ".number_format((float)$r['goods'], 2).")\n";
            echo "kod           : ".(string)$r['code'].(!empty($r['redeemed']) ? '  (kupon DAMGALANDI)' : '')."\n";
            echo "yeni toplam   : ".number_format((float)$r['total'], 2)
                 ."  (= mal ".number_format((float)$r['goods'], 2)
                 ." - indirim ".number_format((float)$r['discount'], 2)
                 ." + navlun ".number_format((float)$r['shipping'], 2)
                 .((float)$r['fee'] > 0 ? " + ucret ".number_format((float)$r['fee'], 2) : "").")\n";
            echo "satici payout : ".number_format((float)$r['payout'], 2)."\n";
            if (!empty($r['must_redraft'])) {
              echo "*** YAPILACAK: fatura KESILMIS (".implode(', ', (array)$r['invoiced']).") -- admin_mode=issue +\n";
              echo "    issue_redraft=true ile AYNI numarayla yeniden cizin, yoksa kayit ile belge AYRISIR (KURAL 5f).\n";
            }
            PHPEOF
            php /tmp/vestra_order_disc.php; RC=$?
            rm -f /tmp/vestra_order_disc.php
            exit $RC

      # NAVLUN (7 Eyl 2026). Panelin "🚚 Save shipping" kutusuyla AYNI yazıcı:
      # `vestra_order_set_shipping()` navlun ile sipariş TOPLAMINI birlikte
      # yazar, yazdığını geri okur ve faturası kesilmiş siparişi reddeder.
      # Numara yakmaz, belge üretmez, kimseye e-posta gitmez.
      #
      # Tutar siparişin kendi biriminde saklanır. Girdi "100 USD" gibi FATURA
      # biriminde verilirse buradaki tek bölme onu siparişin damgalı kuruyla
      # geri çevirir ve sonuç yazdırılır -- operatörün belgede göreceği rakamı
      # elle ters hesaplaması gerekmesin diye.
      - name: Sipariş taslağı / YAZIMI (order_draft = salt okunur, order_write = yazar)
        # Operator, 8 Eyl 2026: dort kalemlik bir siparis + fatura istendi
        # (secilen bedenler, dropship fiyati = toptan + %20, kargo 30 EUR).
        # KURAL 5 faturayi operator onayina bagliyor ve KURAL 5d kesimden ONCE
        # taslak gormeyi sart kosuyor; ustelik kodda ELLE siparis olusturma yolu
        # hic yok, yani once ne yazilacaginin rakamlari goruluyor.
        # Bu adim HICBIR SEY YAZMAZ: hesabi ve ilanlari okur, fiyatlari kodun
        # kendi fonksiyonundan (vestra_dropship_unit_price) turetir ve toplami
        # yazar. Rakami elle hesaplayip mektuba/faturaya koymak, bu deponun
        # tekrar tekrar kaydettigi hata.
        #   payload         : sku:beden:adet virgulle  (ornek: S74GD1399:M:1,662853TJW90:L:1)
        #   issue_shipping  : kargo EUR
        #   issue_ref       : hesabi bulmak icin AD parcasi (e-posta DEGIL -- girdi herkese acik)
        if: ${{ github.event.inputs.admin_mode == 'order_draft' || github.event.inputs.admin_mode == 'order_write' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          OD_LINES: ${{ github.event.inputs.payload }}
          OD_SHIP:  ${{ github.event.inputs.issue_shipping }}
          OD_WHO:   ${{ github.event.inputs.issue_ref }}
          OD_MODE:  ${{ github.event.inputs.admin_mode }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 4m
          envs: OD_LINES,OD_SHIP,OD_WHO,OD_MODE
          script: |
            set -e
            cat > /tmp/vestra_orddraft.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/auth.php";
            require_once $doc."/inc/money.php";
            require_once $doc."/inc/dropship.php";
            require_once $doc."/inc/orders.php";

            $mask = function (string $e): string {
                if ($e === '') return '-';
                $a = explode('@', $e, 2);
                return mb_substr($a[0], 0, 1).'***@'.($a[1] ?? '?');
            };

            /* 1. HESAP. E-posta girdiye yazilmaz (herkese acik); ad parcasiyla
               araniyor ve TEK esleme sart -- iki Negulescu varsa hangisi
               oldugunu tahmin etmek, faturayi yanlis kisiye kesmek olurdu. */
            $who = mb_strtolower(trim((string)getenv('OD_WHO')));
            $hits = [];
            if ($who !== '') {
                /* HESAP ID'si TAM eslesirse o kazanir. Iki sebep:
                   (1) ad/firma parcasi belirsiz olabiliyor -- bu depoda
                   "francisco" aramasi BASKA bir hesabi (C&F Multimarcas) yalniz
                   E-POSTASINDAN yakaladi ve fatura yanlis tuzel kisiye
                   kesilebilirdi; (2) tek ayirt edici parca cogu zaman KISININ
                   SOYADI olur ve bu girdi calistirma basliginda KALICI ve
                   HERKESE ACIK -- bu depoda musterinin soyadini girdiye
                   yazmama karari zaten kayitli. Hesap ID'si opak ve
                   `seller_activate` onu zaten girdi olarak aliyor. */
                foreach (auth_accounts() as $a) {
                    if (mb_strtolower((string)($a['id'] ?? '')) === $who) { $hits = [$a]; break; }
                }
                if (!$hits) foreach (auth_accounts() as $a) {
                    $hay = mb_strtolower(($a['name'] ?? '').' '.($a['company'] ?? '').' '.($a['email'] ?? ''));
                    if (mb_strpos($hay, $who) !== false) $hits[] = $a;
                }
            }
            echo "== HESAP ==\n";
            if (count($hits) !== 1) {
                printf("  '%s' icin %d hesap bulundu -- tek esleme sart, DURDUM\n", $who, count($hits));
                foreach ($hits as $a) printf("    %s <%s>\n", (string)($a['company'] ?: ($a['name'] ?? '?')), $mask((string)($a['email'] ?? '')));
                exit(1);
            }
            $acc = $hits[0];
            printf("  %s <%s>\n", (string)($acc['company'] ?: ($acc['name'] ?? '?')), $mask((string)($acc['email'] ?? '')));
            printf("  tip=%s  durum=%s  kyb=%s  fiyat kapisi=%s\n",
                (string)($acc['type'] ?? '?'), (string)($acc['status'] ?? '?'), (string)($acc['kyb_status'] ?? '?'),
                auth_prices_unlocked($acc) ? 'ACIK' : 'KAPALI');
            printf("  ulke=%s  vat=%s\n", (string)($acc['country'] ?? '-'),
                trim((string)($acc['vat_id'] ?? '')) !== '' ? 'kayitli' : 'YOK');
            if (!auth_prices_unlocked($acc)) echo "  UYARI: fiyat kapisi kapali -- bu hesap sitede fiyat goremiyor\n";

            /* KIP: dropship (varsayilan) ya da TOPTAN. Ikisi ayri satis ve ayri
               fiyat: dropship TEK PARCA satiyor ve tabana zam biniyor, toptan
               ise TAM KARTON satiyor ve alicinin gordugu kademe fiyati
               gecerli. Bu adim toptan kipini bilmiyordu, yani telefonda/
               e-postada anlasilan bir LOT siparisini kayda gecirmenin tek yolu
               yanlis fiyattan gecirmekti.
               payload: "pricing=wholesale|M3600:Black:50,M7535:Bordeaux:50"
               Toptan kipte ikinci alan BEDEN degil RENK -- tam kartonda beden
               dagilimi ilanin kendi serisinden turuyor, secilen sey renk. */
            $spec0 = (string)getenv('OD_LINES');
            $wholesale = false; $waiveMinCol = false; $waiveMoq = false; $waivePack = false;
            if (preg_match('/^\s*pricing\s*=\s*wholesale\s*(\|.*)?$/is', $spec0, $mm0) ||
                preg_match('/^\s*pricing\s*=\s*wholesale\s*\|/i', $spec0)) {
                $wholesale = true;
                $tail = (string)preg_replace('/^\s*pricing\s*=\s*wholesale\s*\|?/i', '', $spec0);
                /* Ilan edilen renk asgarisinden FERAGAT bilincli bir eylem olmak
                   zorunda: sessizce atlanan bir kural, ilanin yalan soyledigi
                   bir siparis uretir. `force=1` deseninin aynisi. */
                if (preg_match('/(^|\|)\s*waive_min_colours\s*=\s*1\s*(\||$)/i', $tail)) {
                    $waiveMinCol = true;
                    $tail = (string)preg_replace('/(^|\|)\s*waive_min_colours\s*=\s*1\s*/i', '$1', $tail);
                }
                /* ILAN EDILEN ASGARI ADETTEN feragat -- kardesinin aynisi ve ayni
                   sebeple AYRI bir anahtar: numune/tek karton satisi gercek bir
                   is ama ilan "en az 50" diyor, yani sepet o siparisi REDDEDER.
                   Tek bayrakla birlestirilmedi: renk asgarisinden feragat etmek
                   ile ilan edilen asgari adedin ALTINA inmek iki ayri taviz ve
                   birini isteyen otekini istemeyebilir.
                   PAKET ADIMI BU FERAGATA GIRMIYOR, bilerek: o fiziksel bir
                   kisit (karton 10'luk) ve sepet adedi adimin katina YUVARLIYOR
                   -- yani 15 adet yazan bir fatura, kasada 20 adet demek olurdu
                   (KURAL 4b). Asgariyi asagi cekmek ilan edilen bir kurali
                   gevsetir; adimi kirmak belgeyi yalanlar. */
                if (preg_match('/(^|\|)\s*waive_moq\s*=\s*1\s*(\||$)/i', $tail)) {
                    $waiveMoq = true;
                    $tail = (string)preg_replace('/(^|\|)\s*waive_moq\s*=\s*1\s*/i', '$1', $tail);
                }
                /* PAKET ADIMI FERAGATI -- ve yukaridaki yorumun bir kismini GERI
                   ALIYOR, o yuzden gerekce burada:
                   Adim kontrolu SEPET icin yazildi ve orada hakli: sepet adedi
                   adimin katina YUVARLIYOR, yani 23 yazan bir ilan kasada 24
                   demek olurdu -- belge yalan soylerdi. Ama ELLE kurulan bir
                   siparis sepetten hic gecmiyor: operator 23 yaziyor, fatura 23
                   diyor, alici 23'un parasini oduyor. Yuvarlayan bir taraf yok,
                   dolayisiyla yalan soyleyen bir taraf da yok.
                   Geriye TEK gercek sonuc kaliyor ve o gizlenmiyor: beden dokumu
                   YAZILAMIYOR (23, ilanin 8'lik serisine bolunmuyor) ve satir
                   bunu kendi notunda soyluyor. Operator bu sonucu GORDUKTEN
                   sonra 23'te israr etti. */
                if (preg_match('/(^|\|)\s*waive_pack\s*=\s*1\s*(\||$)/i', $tail)) {
                    $waivePack = true;
                    $tail = (string)preg_replace('/(^|\|)\s*waive_pack\s*=\s*1\s*/i', '$1', $tail);
                }
                $spec0 = trim($tail, " |");
            }

            /* 2. KALEMLER. Fiyat KODUN kendi fonksiyonundan; elle hesaplanmiyor. */
            echo "\n== KALEMLER (".($wholesale
                ? "TOPTAN: kademe fiyati, sepetin kendi vestra_unit_price'i"
                : "dropship fiyati = en dusuk kademe + %".(int)round(VESTRA_DROPSHIP_MARKUP*100)).") ==\n";
            if ($wholesale && $waiveMinCol) echo "  (!) ilan edilen RENK ASGARISINDEN feragat edildi -- operator karari\n";
            if ($wholesale && $waiveMoq)    echo "  (!) ilan edilen ASGARI ADETTEN feragat edildi -- operator karari\n";
            if ($wholesale && $waivePack)   echo "  (!) PAKET ADIMINDAN feragat edildi -- tam karton degil, beden dokumu yazilamaz\n";
            $all = vestra_products();
            $bySku = [];
            foreach ($all as $p) { $sk = trim((string)($p['sku'] ?? '')); if ($sk !== '') $bySku[mb_strtolower($sk)] = $p; }

            $subtotal = 0.0; $problems = 0; $lines = []; $anyAgreed = false;
            foreach (array_filter(array_map('trim', explode(',', $spec0))) as $spec) {
                $parts = array_map('trim', explode(':', $spec));
                $sku = $parts[0] ?? ''; $size = $parts[1] ?? ''; $qty = max(1, (int)($parts[2] ?? 1));
                /* 4. alan: ELLE ANLASILAN birim fiyat. Toptan kipte katalogun
                   kademesini EZER -- ve bu, kipin geri kalan felsefesiyle
                   celismiyor: fiyati KODDAN okumak, kimsenin elle bir rakam
                   UYDURMAMASI icindi; operatorun musteriyle anlastigi bir
                   rakam ise uydurma degil, KAYIT. Yazilmadan once katalogla
                   karsilastiriliyor (asagida) -- sessizce gecen bir override,
                   ilanin gosterdigi fiyattan baska bir fatura kesmenin en
                   kolay yolu olurdu.
                   `vestra_price_input()`: ham `(float)` virgullu ondalikta
                   sessizce para kaybettiriyor ("19,50" -> 19.00). */
                $agreed = isset($parts[3]) && trim((string)$parts[3]) !== ''
                        ? round((float)vestra_price_input((string)$parts[3]), 2) : null;
                $p = $bySku[mb_strtolower($sku)] ?? null;
                if (!$p) { printf("  !! %-24s KATALOGDA YOK\n", $sku); $problems++; continue; }
                /* DROPSHIP kipinde anlasilan fiyat KABUL EDILMIYOR: orada birim
                   aliciNIN hesabindan turuyor (abonelik var mi) ve elle bir
                   rakam koymak o kapiyi sessizce atlatirdi. Sessizce yok
                   saymak daha kotu -- operator yazdigi rakamin islendigini
                   sanirdi. */
                if ($agreed !== null && !$wholesale) {
                    printf("  !! %-24s anlasilan fiyat yalniz TOPTAN kipte gecerli\n", $sku); $problems++; continue;
                }
                if ($wholesale) {
                    /* TOPTAN DALI. Fiyat, adet ve renk uc AYRI kontrol; ucu de
                       sepetin uyguladigi kuraldan okunuyor, elle hesaplanmiyor. */
                    $colour = $size; $size = '';
                    /* RAW: bolgesel indirim ZIYARETCININ bolgesinden turuyor ve
                       bu betik CLI'da kosuyor -- yani burada uygulanmasi
                       "hangi bolge" sorusunu cevapsiz birakirdi. Fark varsa
                       asagida ayrica yaziliyor, gizlenmiyor. */
                    $listUnit = round((float)vestra_unit_price($p, $qty, true), 2);
                    if ($listUnit <= 0) { printf("  !! %-24s kademe fiyati YOK\n", $sku); $problems++; continue; }
                    $unit = $agreed !== null ? $agreed : $listUnit;
                    if ($agreed !== null && $agreed <= 0) { printf("  !! %-24s anlasilan fiyat gecersiz\n", $sku); $problems++; continue; }
                    if ($agreed !== null) $anyAgreed = true;
                    $moq  = max(1, (int)($p['moq'] ?? 1));
                    $step = max(1, (int)($p['size_step'] ?? 1));
                    $msgs = [];
                    /* YON ONEMLI, ve iki yon AYNI SEY DEGIL:
                       - anlasilan < katalog  = operatorun verdigi iskonto. Onun
                         karari; kayda gerekce olarak giriyor.
                       - anlasilan > katalog  = alicinin SAYFADA gordugunden
                         PAHALI bir fatura. Bu bir karar degil, bir kusur:
                         `price_audit`'in "alici aleyhine" dedigi sinif, ve
                         musteri farki faturayi eline alinca goruyor. DURUYOR. */
                    if ($agreed !== null) {
                        $msgs[] = $agreed > $listUnit + 0.005
                            ? sprintf('!! anlasilan %s, ilan kademesi %s -- ILANDAN PAHALI, alici aleyhine',
                                      number_format($agreed, 2), number_format($listUnit, 2))
                            : sprintf('(anlasilan) birim %s, ilan kademesi %s -- operator karari',
                                      number_format($agreed, 2), number_format($listUnit, 2));
                    }
                    /* MOQ ve paket adimi: sepet adedi adimin KATINA yuvarliyor,
                       yani katalog disinda yazilan bir adet kasada baska bir
                       adet demek olurdu (KURAL 4b). */
                    if ($qty < $moq)        { $msgs[] = sprintf('%s adet %d, ilan edilen MOQ %d',
                                                                $waiveMoq ? '(feragat)' : '!!', $qty, $moq); }
                    if ($qty % $step !== 0) { $msgs[] = sprintf('%s adet %d, paket adimi %d katı DEGIL%s',
                                                                $waivePack ? '(feragat)' : '!!', $qty, $step,
                                                                $waivePack ? ' -- beden dokumu YAZILAMAZ' : ''); }
                    /* Renk ilanda GERCEKTEN var mi? Olmayan bir rengi satmak,
                       gonderilemeyecek bir sey satmaktir (KURAL 3). Esleme TAM,
                       alt dize degil -- bu depoda mango/zara dersi. */
                    $cols = array_values(array_filter(array_map('trim', array_map('strval', (array)($p['colors'] ?? []))), fn($c) => $c !== ''));
                    $want = array_values(array_filter(array_map('trim', explode(';', $colour))));
                    $lc   = array_map('mb_strtolower', $cols);
                    foreach ($want as $w) {
                        if (!in_array(mb_strtolower($w), $lc, true)) {
                            $msgs[] = "!! renk '{$w}' ILANDA YOK -- ilanda: ".($cols ? implode(' / ', $cols) : '(renk yok)');
                        }
                    }
                    $minCol = (int)($p['min_colors'] ?? 0);
                    if ($minCol > 0 && count($want) < $minCol) {
                        /* SAYAC TEK YERDE: asagidaki dongü zaten '!!' ile
                           baslayan her satiri sayiyor. Burada ayrica artirmak
                           ayni kusuru IKI kez saydiriyordu ("sorunlu: 4",
                           oysa iki kalem iki sorun) -- davranis ayni kalirdi
                           ama rapor yanlis rakam basar, ve bu depoda yanlis
                           rakam basan bir sonda defalarca bedel odetti. */
                        $msgs[] = sprintf('%s ilan "en az %d renk" diyor, sipariste %d renk var',
                                          $waiveMinCol ? '(feragat)' : '!!', $minCol, count($want));
                    }
                    /* BEDEN DAGILIMI UYDURULMUYOR: ilanin kendi serisi x karton
                       sayisi. Seri okunamazsa satir hic yazilmiyor -- tahmin
                       edilmis bir beden dokumu faturaya girerdi. */
                    $sizeRaw = is_array($p['sizes'] ?? null) ? implode(' ', array_map('strval', $p['sizes'])) : (string)($p['sizes'] ?? '');
                    $run = [];
                    if (preg_match_all('/([0-9]{2,3}|XXXL|XXL|XL|XS|S|M|L)\s*[×xX]\s*([0-9]+)/u', $sizeRaw, $rm, PREG_SET_ORDER)) {
                        foreach ($rm as $r1) $run[mb_strtoupper($r1[1])] = (int)$r1[2];
                    }
                    $perPack = array_sum($run);
                    $sizeOut = [];
                    if ($perPack > 0 && $qty % $perPack === 0) {
                        $packs = intdiv($qty, $perPack);
                        foreach ($run as $sName => $sQty) $sizeOut[] = $sName.'×'.($sQty * $packs);
                    } elseif ($perPack > 0) {
                        $msgs[] = sprintf('(beden dokumu yazilmadi: adet %d, seri toplami %d katı degil)', $qty, $perPack);
                    }
                    $size = implode(', ', $sizeOut);
                    foreach ($msgs as $mg) { if (str_starts_with($mg, '!!')) $problems++; }
                    $tierTxt = [];
                    foreach ((array)($p['tiers'] ?? []) as $tt) {
                        $tmin = (int)($tt['min'] ?? 0); $tpr = (float)($tt['price'] ?? 0);
                        if ($tmin > 0 && $tpr > 0) $tierTxt[] = $tmin.'+ = '.number_format($tpr, 2);
                    }
                    $lineTot = round($unit * $qty, 2);
                    $subtotal += $lineTot;
                    $lines[] = [$sku, $size, $qty, $unit, $lineTot, implode(', ', $want)];
                    printf("  %-16s %-28s x%-4d\n", $sku, $colour, $qty);
                    printf("      %s %s\n", (string)($p['brand'] ?? ''), (string)($p['name'] ?? ''));
                    printf("      kademeler   : %s\n", $tierTxt ? implode('  |  ', $tierTxt) : '(kademe yok)');
                    printf("      MOQ/adim    : %d / %d   (ilanin kendi degerleri)\n", $moq, $step);
                    printf("      renk        : %s   (ilanda %d renk, asgari %s)\n",
                           implode(', ', $want), count($cols), $minCol > 0 ? (string)$minCol : 'yok');
                    printf("      beden       : %s\n", $size !== '' ? $size.'  ('.($perPack>0?intdiv($qty,$perPack):0).' x '.$perPack.'\'lik seri)' : '(yazilmadi)');
                    printf("      birim       : EUR %8s   (%s)\n", number_format($unit, 2),
                           $agreed !== null ? 'ANLASILAN fiyat -- katalog kademesi degil' : sprintf('kademe, %d adette', $qty));
                    $withRegion = round((float)vestra_unit_price($p, $qty), 2);
                    if ($agreed === null && abs($withRegion - $listUnit) > 0.005) printf("      (bolgesel indirimli hali EUR %s -- bu siparise UYGULANMADI)\n", number_format($withRegion, 2));
                    printf("      satir       : EUR %8s   (%s x %d)\n", number_format($lineTot, 2), number_format($unit, 2), $qty);
                    foreach ($msgs as $mg) printf("      %s\n", $mg);
                    echo "\n";
                    $baseSum = ($baseSum ?? 0.0) + $lineTot;
                    continue;
                }
                $unit = vestra_dropship_unit_price($p, null);   // abonelik YOK -> zamli fiyat
                if ($unit === null || $unit <= 0) { printf("  !! %-24s dropship fiyati YOK (kapali ya da kademesiz)\n", $sku); $problems++; continue; }
                /* Beden ilanda gercekten var mi VE yetiyor mu? Olmayan bedene
                   fatura kesmek, gonderilemeyecek bir sey satmak olurdu.

                   ILK SURUM YANLIS YERE BAKTI: `sizes` bir dizi degil, insan
                   icin yazilmis bir METIN ("S×1 · M×3 · L×3 · XL×2 · XXL×1 ·
                   10 pcs/pack"). in_array('M', [o metin]) her satirda false
                   dondu ve alti kalemin altisini birden "beden yok" diye
                   isaretledi -- veri degil, kontrol bozuktu. Simdi metin
                   ayristiriliyor: beden ve o bedendeki ADET birlikte okunuyor,
                   yani "M var mi" degil "M'den 1 tane var mi" sorulabiliyor. */
                $sizeRaw = is_array($p['sizes'] ?? null)
                    ? implode(' ', array_map('strval', $p['sizes']))
                    : (string)($p['sizes'] ?? '');
                $avail = [];
                if (preg_match_all('/([0-9]{2,3}|XXXL|XXL|XL|XS|S|M|L)\s*[×xX]\s*([0-9]+)/u', $sizeRaw, $mm, PREG_SET_ORDER)) {
                    foreach ($mm as $m2) $avail[mb_strtoupper($m2[1])] = (int)$m2[2];
                }
                $want = mb_strtoupper($size);
                if ($avail === []) { $sizeOk = true; $sizeNote = '(ilanda beden dokumu yok, kontrol edilemedi)'; }
                elseif (!isset($avail[$want])) { $sizeOk = false; $sizeNote = '!! beden YOK -- ilanda: '.implode(' ', array_map(fn($k,$v)=>"{$k}x{$v}", array_keys($avail), $avail)); }
                elseif ($avail[$want] < $qty) { $sizeOk = false; $sizeNote = sprintf('!! yetersiz: %s bedeninde %d var, %d isteniyor', $want, $avail[$want], $qty); }
                else { $sizeOk = true; $sizeNote = sprintf('(%s: %d adet var)', $want, $avail[$want]); }
                $lineTot = round($unit * $qty, 2);
                $subtotal += $lineTot;
                $lines[] = [$sku, $size, $qty, $unit, $lineTot];
                $baseSum = ($baseSum ?? 0.0) + round(((float)vestra_dropship_wholesale_price($p)) * $qty, 2);
                /* TAM FIYAT DOKUMU (operator: "tam fiyatlari ver"). Yalnizca
                   son rakami basmak, "bu 47,88 nereden cikti" sorusunu acik
                   birakiyor. Kademe merdiveni, taban (en dusuk kademe), zam ve
                   satir carpimi birlikte yaziliyor -- her rakam kaynagiyla. */
                $base = vestra_dropship_wholesale_price($p);
                $tiers = [];
                foreach ((array)($p['tiers'] ?? []) as $tt) {
                    $tmin = (int)($tt['min'] ?? 0); $tpr = (float)($tt['price'] ?? 0);
                    if ($tmin > 0 && $tpr > 0) $tiers[] = $tmin.'+ = '.number_format($tpr, 2);
                }
                printf("  %-24s %-4s x%-2d  %s\n", $sku, $size, $qty, $sizeNote);
                printf("      %s %s\n", (string)($p['brand'] ?? ''), (string)($p['name'] ?? ''));
                printf("      kademeler   : %s\n", $tiers ? implode('  |  ', $tiers) : '(kademe yok)');
                printf("      toptan taban: EUR %8s   (en dusuk adetli kademe)\n", number_format((float)$base, 2));
                printf("      dropship    : EUR %8s   (taban + %%%d)\n", number_format($unit, 2), (int)round(VESTRA_DROPSHIP_MARKUP * 100));
                printf("      satir       : EUR %8s   (%s x %d)\n\n", number_format($lineTot, 2), number_format($unit, 2), $qty);
                if (!$sizeOk) $problems++;
            }

            /* NAVLUN: bos ya da 'auto' -> BOLGE TARIFESI (hesabin ulkesinden,
               siparisin kendi kalemlerinden; TEK tablo). Acikca 0 yazilirsa 0
               kalir -- "navlun yok" ile "navlunu sen hesapla" iki ayri talimat.
               Ulke taninmiyorsa tarife null doner ve navlun 0 olur; uydurma bir
               rakam hicbir zaman kayda girmiyor (KURAL 3).
               KURAL 34 (19 Eyl 2026): tarife su an PASIF -- vestra_shipping_auto_schedule()
               anahtar kapaliyken null donuyor, taninmayan ulkeyle AYNI cevap. */
            $shipRaw = trim((string)getenv('OD_SHIP'));
            $shipAuto = ($shipRaw === '' || strtolower($shipRaw) === 'auto');
            if ($shipAuto) {
                $sch = vestra_shipping_auto_schedule(
                    array_map(fn($L) => ['sku' => $L[0], 'qty' => $L[2]], $lines),
                    (string)($acc['country'] ?? ''));
                $ship = $sch ? (float)$sch['amount'] : 0.0;
                if ($sch) printf("\n  navlun tarifesi : %s  %d ad. -> EUR %s\n",
                    strtoupper((string)$sch['region']), (int)$sch['qty'], number_format($ship, 2));
                elseif (!vestra_shipping_auto_enabled())
                           printf("\n  navlun tarifesi : PASIF (Admin > Orders'ta durduruldu) -- navlun 0, elle yazin\n");
                else       printf("\n  navlun tarifesi : YOK -- ulke '%s' Avrupa/ABD degil, navlun 0 (elle yazin)\n",
                    trim((string)($acc['country'] ?? '')) ?: '(bos)');
            } else {
                $ship = round((float)str_replace(',', '.', $shipRaw), 2);
            }
            $total = round($subtotal + $ship, 2);
            echo "\n== TOPLAM ==\n";
            if (!$wholesale) {
                printf("  toptan   : EUR %10s   (zamsiz taban toplami -- kiyas icin)\n", number_format((float)($baseSum ?? 0), 2));
                printf("  mal      : EUR %10s   (dropship, taban + %%%d)\n", number_format($subtotal, 2), (int)round(VESTRA_DROPSHIP_MARKUP * 100));
                printf("  zam payi : EUR %10s\n", number_format($subtotal - (float)($baseSum ?? 0), 2));
            } else {
                /* Etiket, fiyatin GERCEKTEN nereden geldigini yazmali: anlasilan
                   bir birimle kurulmus bir toplama "kademe fiyatlari" demek,
                   notun kendisinde duzeltilen yalanin ozet satirindaki hali. */
                printf("  mal      : EUR %10s   (%s)\n", number_format($subtotal, 2),
                       $anyAgreed ? 'ANLASILAN birim fiyat(lar)' : 'toptan kademe fiyatlari');
            }
            printf("  kargo    : EUR %10s\n", number_format($ship, 2));
            printf("  TOPLAM   : EUR %10s\n", number_format($total, 2));
            $r = vestra_fx('USD');
            if ($r > 0) printf("  (~US$%s, 1 EUR = %s)\n", number_format($total * $r, 2), number_format($r, 4));
            printf("\n  kalem sayisi: %d   sorunlu: %d\n", count($lines), $problems);

            /* YAZMA, AYNI ADIMDA VE AYNI HESAPTAN. Ikinci bir adim, fiyat
               mantiginin ikinci kopyasi demek olurdu; bu depo ayrisan iki
               kopyanin bedelini KURAL 5d/5f'te zaten yazdi. Taslak ile yazim
               arasindaki TEK fark asagidaki dal. */
            $write = getenv('OD_MODE') === 'order_write';
            if (!$write) {
                echo $problems ? "  SONUC: SORUN VAR -- duzelmeden siparis YAZILMAMALI\n"
                               : "  SONUC: taslak temiz. HICBIR SEY YAZILMADI (salt okunur).\n";
                exit($problems ? 1 : 0);
            }
            if ($problems) { fwrite(STDERR, "SORUN VAR -- yazmiyorum\n"); exit(1); }

            $mkLines = [];
            foreach ($lines as $L) $mkLines[] = ['sku'=>$L[0], 'size'=>$L[1], 'qty'=>$L[2], 'unit'=>$L[3], 'colour'=>$L[5] ?? ''];
            /* NOT, SATISIN NE OLDUGUNU SOYLER. Toptan bir lot siparisine
               "dropship, single pieces" yazmak, kaydi okuyan herkese yanlis
               satisi anlatirdi -- ve o not siparis sayfasinda, panelde ve
               faturanin toplama listesinde oldugu gibi basiliyor.
               Renk asgarisinden feragat edildiyse GEREKCE de kayitta durur:
               aylar sonra "bu lot neden tek renk" sorusunun cevabi, ilanin
               bugun hala "en az N renk" diyen metni degil, bu satir olur. */
            /* NOT, FIYATIN NEREDEN GELDIGINI DE SOYLEMEK ZORUNDA. Anlasilan bir
               birimle kesilen satisa "wholesale tier pricing" yazmak, kaydi
               okuyan herkese YANLIS bir sey anlatirdi: kademeyi acip "bu fiyat
               nereden cikti" diye bakan kisi hicbir kademede o rakami bulamaz.
               `desc` ile `sizes`'in celistigi hatanin aynisi. */
            $note = $wholesale
                ? ($anyAgreed
                    ? 'Unit price agreed with the buyer, outside the listed tiers. Full cartons.'
                    : 'Wholesale tier pricing, full cartons, agreed with the buyer.')
                  .($waiveMinCol ? ' Single-colour lots agreed as an exception to the listed colour minimum.' : '')
                  .($waiveMoq ? ' Quantity below the listed minimum order, agreed as an exception.' : '')
                  .($waivePack ? ' Quantity is not a whole number of cartons, agreed as an exception; no size breakdown.' : '')
                : 'Dropship pricing (wholesale +'.(int)round(VESTRA_DROPSHIP_MARKUP*100).'%), single pieces, agreed with the buyer.';
            /* Taslakta gosterilen navlunun AYNISI yaziliyor (auto cozumlendi):
               null gecirip fonksiyona yeniden hesaplatmak, iki yerde iki farkli
               rakam uretebilecek ikinci bir hesap yolu olurdu. */
            $res = vestra_order_create_manual($acc, $mkLines, $ship, $note);
            if (!empty($res['error'])) { fwrite(STDERR, "YAZILAMADI: ".$res['error']."\n"); exit(1); }
            printf("\n  SIPARIS YAZILDI: %s\n", (string)$res['ref']);
            printf("  mal %s + kargo %s = %s EUR   (kayittan geri okundu)\n",
                number_format((float)$res['goods'], 2), number_format((float)$res['shipping'], 2),
                number_format((float)$res['total'], 2));
            echo "  FATURA KESILMEDI -- numara yakmaz, musteriye hicbir sey gitmedi.\n";
            PHPEOF
            php /tmp/vestra_orddraft.php; rc=$?
            rm -f /tmp/vestra_orddraft.php
            exit $rc

      - name: Siparişi sil (order_delete) — varsayılan KURU KOŞU
        # Bu adim, order_write'in eksik olan yarisi: siparisi bu is akisindan
        # YAZABILIYORDUM ama GERI ALAMIYORDUM, yani her yanlis adet operatorun
        # panele girmesini gerektiriyordu. Panelin `order_delete` eylemiyle AYNI
        # yazici (`vestra_order_delete`) cagriliyor -- ikinci bir silme mantigi
        # yazilmadi; ikinci bir uygulama yedek almayi ya da orders.csv'nin
        # eskiden-yeniye saklandigini kacirirdi.
        #
        # MUHAFAZA BURAYA AYRICA YAZILDI, ve sebebi yapisal: `vestra_order_delete()`
        # kesilmis faturaya BAKMIYOR -- o kontrol admin.php'de duruyor. Yani
        # fonksiyonu dogrudan cagiran bir ikinci kapi, KURAL 5g'nin korudugu seyi
        # kilitsiz birakirdi (bu depoda "dugmeyi gizlemek kapi degildir"in tersi:
        # kapi var, kilit baska dosyada).
        #
        # `force` BILEREK YOK. CLAUDE.md `force=1` yolunu (numarasi yanmis belgeyi
        # arsivleyerek silme) TEK yerde -- Orders sekmesinde -- tutuyor; ikinci bir
        # ulasim noktasi tam da o kurali gevsetirdi. Faturali bir ref burada
        # KOSULSUZ reddediliyor ve nereye gidilecegi yaziliyor.
        if: ${{ github.event.inputs.admin_mode == 'order_delete' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          ODL_REF:   ${{ github.event.inputs.issue_ref }}
          ODL_APPLY: ${{ github.event.inputs.move_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 3m
          envs: ODL_REF,ODL_APPLY
          script: |
            set -e
            cat > /tmp/vestra_orddel.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/orders.php";
            require_once $doc."/inc/invoice.php";

            $ref   = preg_replace('/[^A-Za-z0-9_-]/', '', (string)getenv('ODL_REF'));
            $apply = strtolower(trim((string)getenv('ODL_APPLY'))) === 'true';
            if ($ref === '') { fwrite(STDERR, "ref yok (issue_ref)\n"); exit(1); }

            $row = null;
            foreach (vestra_read_csv('orders.csv') as $r) if (($r['ref'] ?? '') === $ref) { $row = $r; break; }
            if (!$row) { fwrite(STDERR, "siparis bulunamadi: {$ref}\n"); exit(1); }

            /* NE SILINIYOR. Ref/firma/tutar/durum acik, KISIYE AIT OLAN MASKELI:
               siparis satiri alicinin adini, e-postasini, telefonunu ve teslimat
               adresini tasiyor ve bu kutuk herkese acik -- `find_ref` bir kez
               maskesiz basti (KURAL: teshis adimi "satiri oldugu gibi bas"
               yapamaz). */
            $st = (array)(vestra_read_json('order_statuses.json')[$ref] ?? []);
            printf("silinecek      : %s\n", $ref);
            printf("firma          : %s\n", (string)($row['company'] ?? '(yok)'));
            /* Sutun adlari orders.csv'nin KENDI basligindan: `goods`/`currency`
               diye alanlar YOK (mal toplami `subtotal`, kayit EUR tabanli ve
               fatura para birimi ayri bir operator secimi -- KURAL 5i). Olmayan
               bir anahtari `?? ''` ile sormak sessizce bos basar: bu depoda
               `$a['vat']` (dogrusu `vat_id`) tam boyle her hesap icin "(yok)"
               yazdi ve neredeyse bir ozur mektubu yazdiriyordu. */
            printf("tutar          : EUR %s   (mal %s + kargo %s)\n",
                (string)($row['total'] ?? '?'), (string)($row['subtotal'] ?? '?'),
                (string)($row['shipping'] ?? '0'));
            printf("durum          : %s\n", (string)($st['status'] ?? 'pending'));
            if (trim((string)($st['invoice_currency'] ?? '')) !== '')
                printf("fatura birimi  : %s   (operator secimi)\n", (string)$st['invoice_currency']);
            printf("kalem          : %d\n", count(vestra_order_lines($row)));

            $inv = vestra_invoices_for_ref($ref);
            if ($inv) {
              fwrite(STDERR, "\n*** FATURA KESILMIS (".implode(', ', array_map(fn($i)=>(string)($i['no'] ?? '?'), $inv))
                           .") -- BU YOLDAN SILINMEZ.\n"
                           ."Numara yanmis ve belgenin kopyasi alicinin elinde. Tek kalem yanlissa\n"
                           ."KURAL 5f (ayni numarayla yeniden ciz); belgeyi gercekten kaldirmak\n"
                           ."gerekiyorsa Admin > Orders'daki ret bandi (force=1) -- o yol BILEREK\n"
                           ."tek yerde.\n");
              exit(1);
            }
            echo "fatura         : yok (numara yanmamis)\n";

            if (!$apply) { echo "\nKURU KOSU -- hicbir sey silinmedi (move_apply=true ile uygulanir).\n"; exit(0); }

            /* Yedek `vestra_order_delete()` icinde aliniyor (orders.csv.bak-del-<zaman>);
               ikinci bir kopya almak, geri donuste hangisinin dogru oldugunu
               sorduracak ikinci bir dosya birakirdi. */
            $n = vestra_order_delete($ref);
            if ($n < 0)   { fwrite(STDERR, "SILINEMEDI (yazma hatasi)\n"); exit(1); }
            if ($n === 0) { fwrite(STDERR, "satir bulunamadi -- silinmedi\n"); exit(1); }

            /* GERI OKUMA: `rename()` sessizce dusebilir (izin, dolu disk -- bu
               depoda ayni ay kota kesintisi yasandi) ve "silindi" derken satir
               yerinde durmamali. */
            $still = false;
            foreach (vestra_read_csv('orders.csv') as $r) if (($r['ref'] ?? '') === $ref) { $still = true; break; }
            printf("\nSILINDI        : %d satir\n", $n);
            printf("geri okuma     : %s\n", $still ? '*** HALA DURUYOR ***' : 'kayitta yok (dogrulandi)');
            exit($still ? 1 : 0);
            PHPEOF
            php /tmp/vestra_orddel.php; rc=$?
            rm -f /tmp/vestra_orddel.php
            exit $rc

      - name: Lookbook PDF (yalnız marka + ad + foto)
        # Operator, 12 Eyl 2026: "bunlari katalogtan bul ve fotolari ile birlikte
        # pdf yap sadece isim marka ve foto".
        # Bu adim BELGEYI OLCUYOR, teslim etmiyor: operator ayni belgeyi
        # /lookbook.php?ids=... adresinden (admin oturumu) kendi aliyor. Buradaki
        # is, linki vermeden ONCE dort urunun de gercekten cozuldugunu ve
        # fotograflarin gercekten GOMULDUGUNU gormek -- bu depoda "dosya uretildi,
        # boyut makul, imza dogru, ama icinde HIC fotograf yok" bir kez yasandi
        # ve yillarca fark edilmedi.
        # Yeni GIRDI yok: mevcut 'payload' alani kullaniliyor (dosyanin kendi
        # girdi butcesi notu).
        if: ${{ github.event.inputs.admin_mode == 'lookbook' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          LB_IDS: ${{ github.event.inputs.payload }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 3m
          envs: LB_IDS
          script: |
            set -e
            cd ~/public_html
            # /tmp'e yaziliyor, public_html'e DEGIL: belgeyi bir adrese koymak onu
            # linki bilen herkese acardi ve bunu kimse istemedi.
            LOOKBOOK_OUT=/tmp/vestra-lookbook.pdf php lookbook.php ids="$LB_IDS"; RC=$?
            # Cikis kodu ONCE yakalanip sonra donduruluyor: bu dosyada `php ...`
            # ardindan gelen bir komut cikis kodunu bir kez ezmisti ve PHP OLUMCUL
            # yazan bir kosu "success" gorunmustu.
            rm -f /tmp/vestra-lookbook.pdf
            exit $RC
      - name: Disk kotasını boşalt (varsayılan KURU KOŞU)
        # 16 Eyl 2026: sunucu her istekte "Disk quota exceeded" veriyordu ve PHP
        # OTURUM dosyasi acilamiyordu -- site 200 donuyor ama hic kimse giris
        # yapamiyor. Sebep bir tek yerde: data/sessions'ta 229.721 oturum dosyasi
        # birikmis (PHP'nin kendi cop toplayicisi bu barindirmada kapali) ve
        # listings.json.bak-* 148 adet / 54 MB.
        #
        # SILINMEYENLER, bilerek: data/docs (musteri belgeleri), data/invoices,
        # data/receipts, data/offer_backups, data/message_backups. Bu depo bir
        # yedegin katalogu kurtardigini (11 Eyl fiyat geri almasi) ve bir teklifin
        # yalniz yedekten geri geldigini (KURAL 5g) kaydediyor -- yedek silmek
        # geri donusun tek yolunu silmektir. Bu yuzden her ailenin EN YENI N
        # tanesi duruyor ve N cömert.
        #
        # DOSYA ADI HIC BASILMIYOR: oturum dosyasinin adi oturum kimligidir, yani
        # kimlik dogrulama jetonu; bu kutuk herkese acik. Yalniz ADET ve MB.
        # Yeni GIRDI yok (girdi butcesi): spec 'move_threads', uygulama 'move_apply'.
        if: ${{ github.event.inputs.admin_mode == 'diskclean' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          DC_SPEC:  ${{ github.event.inputs.move_threads }}
          DC_APPLY: ${{ github.event.inputs.move_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 25m
          envs: DC_SPEC,DC_APPLY
          script: |
            D="$HOME/public_html/data"
            APPLY=0; [ "$DC_APPLY" = "true" ] && APPLY=1
            SPEC="${DC_SPEC:-sessions,baks,tmp,errlog}"
            [ "$APPLY" = "1" ] && echo "*** UYGULAMA -- dosyalar SILINECEK ***" || echo "kuru kosu -- hicbir sey silinmiyor (move_apply=true ile uygulanir)"
            echo "spec: $SPEC"
            has() { echo ",$SPEC," | grep -q ",$1[,:]" || echo ",$SPEC," | grep -q ",$1,"; }
            arg() { echo "$SPEC" | tr ',' '\n' | grep "^$1:" | head -1 | cut -d: -f2; }
            # Kotayi ONCE ve SONRA basiyoruz: "temizledim" cumlesinin kaniti,
            # silinen dosya sayisi degil, kotanin gercekten dusmus olmasidir.
            echo; echo "== KOTA (once) =="; quota -s 2>/dev/null | tail -3 || echo "  quota yok"

            if has sessions; then
              days=$(arg sessions); days=${days:-2}
              n=$(find "$D/sessions" -maxdepth 1 -type f -name 'sess_*' -mtime "+$days" 2>/dev/null | wc -l | tr -d ' ')
              tot=$(find "$D/sessions" -maxdepth 1 -type f -name 'sess_*' 2>/dev/null | wc -l | tr -d ' ')
              echo; echo "== oturum dosyalari =="
              echo "  toplam ${tot} | ${days} gunden eski ${n}  (kalacak: $((tot - n)))"
              if [ "$APPLY" = "1" ]; then
                find "$D/sessions" -maxdepth 1 -type f -name 'sess_*' -mtime "+$days" -delete 2>/dev/null
                echo "  silindikten sonra: $(find "$D/sessions" -maxdepth 1 -type f -name 'sess_*' 2>/dev/null | wc -l | tr -d ' ') adet"
              fi
            fi

            if has baks; then
              keep=$(arg baks); keep=${keep:-20}
              echo; echo "== yedekler (en yeni ${keep} tanesi KALIR) =="
              for pat in 'listings.json.bak-*' 'offers.csv.bak-*' 'orders.csv.bak-*' 'accounts.json.bak-*' 'leads.json.bak-*'; do
                # Sirayi ZAMAN DAMGASI veriyor, ls'in alfabetik sirasi degil: ad
                # YYYYMMDD-HHMMSS tasiyor ama bir gun tasimazsa mtime dogruyu soyler.
                # Liste DEGISKENDE tutuluyor, gecici dosyada degil: kota dolu
                # oldugunda /tmp'e yazamiyoruz ve kuru kosu "0 yedek" diye
                # yalan soylerdi -- yani tam olcmesi gereken anda kor kalirdi.
                list=$(find "$D" -maxdepth 1 -name "$pat" -printf '%T@ %s %p\n' 2>/dev/null | sort -rn)
                [ -z "$list" ] && continue
                tot=$(printf '%s\n' "$list" | wc -l | tr -d ' ')
                old=$((tot - keep)); [ "$old" -lt 0 ] && old=0
                mb=$(printf '%s\n' "$list" | tail -n "+$((keep + 1))" | awk '{s+=$2} END{printf "%.0f", s/1048576}')
                printf '  %-22s toplam %4s | silinecek %4s | ~%s MB\n' "${pat%-\*}" "$tot" "$old" "${mb:-0}"
                if [ "$APPLY" = "1" ] && [ "$old" -gt 0 ]; then
                  printf '%s\n' "$list" | tail -n "+$((keep + 1))" | cut -d' ' -f3- | while IFS= read -r f; do rm -f "$f"; done
                fi
              done
            fi

            if has tmp; then
              # YALNIZ bizim yazdigimiz kalintilar ve YALNIZ bizim sahipligimizde:
              # /tmp paylasimli olabilir, baskasinin dosyasina dokunmak yok.
              echo; echo "== /tmp kalintilari (is akisi betikleri) =="
              n=0
              for pat in 'vestra_*.php' 'vestra_*.json' 'vestra-*.pdf' 'seller_products.php' 'set_product*.php' 'diag_*.php' '.vdc_*'; do
                c=$(find /tmp -maxdepth 1 -user "$(id -un)" -name "$pat" -mtime +0 2>/dev/null | wc -l | tr -d ' ')
                n=$((n + c))
                [ "$APPLY" = "1" ] && find /tmp -maxdepth 1 -user "$(id -un)" -name "$pat" -mtime +0 -delete 2>/dev/null
              done
              echo "  bir gunden eski: ${n} dosya"
            fi

            if has errlog; then
              lines=$(arg errlog); lines=${lines:-2000}
              echo; echo "== hata gunlukleri (son ${lines} satir KALIR) =="
              for f in "$HOME/public_html/error_log" "$HOME/error_log" "$HOME/vestra_sweep.log"; do
                [ -f "$f" ] || continue
                sz=$(du -m "$f" 2>/dev/null | cut -f1); ln=$(wc -l < "$f" 2>/dev/null | tr -d ' ')
                printf '  %-28s %5s MB  %8s satir\n' "${f#$HOME/}" "$sz" "$ln"
                if [ "$APPLY" = "1" ] && [ "$ln" -gt "$lines" ]; then
                  # `cat > $f` dosyayi YERINDE kisaltir: inode korunur, PHP'nin
                  # acik tuttugu tanitici gecerli kalir. mv etseydik yazmalar
                  # silinmis bir inode'a giderdi ve gunluk sessizce olurdu.
                  tail -n "$lines" "$f" > "$f.keep" 2>/dev/null && cat "$f.keep" > "$f" && rm -f "$f.keep"
                fi
              done
            fi

            echo; echo "== KOTA (sonra) =="; quota -s 2>/dev/null | tail -3 || echo "  quota yok"
            echo "== ev dizini =="; du -xsh "$HOME" 2>/dev/null
            # "Bir daha dolmayacak" iddiasinin kaniti deploy'un kendi echo'su
            # degil, SUNUCUNUN crontab'i. Bu iki satir yoksa temizlik tek
            # seferlik bir elle mudahaledir ve birikme yarin kaldigi yerden
            # devam eder.
            echo "== gunluk tavan kurulu mu =="
            crontab -l 2>/dev/null | grep -E 'VESTRA-SWEEP (oturum-temizlik|hata-gunlugu)' \
              | sed 's/^/  /' || echo "  *** KURULU DEGIL -- birikme geri gelir"
            # Asil olcu: sunucu yeniden YAZABILIYOR mu? Kotanin sayisi degil,
            # oturumun acilabilmesi. Bu satir "site geri geldi mi" sorusunu
            # dogrudan cevapliyor.
            echo "== yazma sinamasi =="
            for d in "$D" "$D/sessions" /tmp; do
              if (: > "$d/.vestra_wtest") 2>/dev/null; then rm -f "$d/.vestra_wtest"; echo "  yazilabilir : ${d#$HOME/}"
              else echo "  *** YAZILAMIYOR : ${d#$HOME/}"; fi
            done
      - name: Dropship ödeme anahtarı (aç / kapat)
        # Operator, 8 Eyl 2026: "Dropshippingi tekrar aci".
        # Ayni anahtar Admin ▸ Dropship'te de var; bu, ayni kaydin ikinci kapisi
        # (vestra_dropship_set_payments), yeni bir karar noktasi DEGIL.
        # Yeni GIRDI eklemiyor: mod adinin kendisi on/off tasiyor -- diag-live
        # 25 girdi sinirina dayanmis durumda ve bu dosya da ayni butceyi paylasiyor.
        if: ${{ github.event.inputs.admin_mode == 'dropship_on' || github.event.inputs.admin_mode == 'dropship_off' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          DS_MODE: ${{ github.event.inputs.admin_mode }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 2m
          envs: DS_MODE
          script: |
            set -e
            cat > /tmp/vestra_dspay.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/dropship.php";

            $want = getenv('DS_MODE') === 'dropship_on';
            printf("onceki durum : %s\n", vestra_dropship_payments_enabled() ? 'ACIK' : 'kapali');
            vestra_dropship_set_payments($want);

            /* YAZMA GERI OKUNUYOR, ve AYRI bir surecte: vestra_dropship_payments_enabled()
               surec icinde `static` onbellekli, ayni surecte sormak yazilan degeri
               degil onbellegi olcerdi -- "yazdim" diyen ama yazmamis bir satir. */
            $out = shell_exec(escapeshellcmd(PHP_BINARY ?: 'php').' -r '.escapeshellarg(
              'require getenv("HOME")."/public_html/inc/products.php";'
             .'require_once getenv("HOME")."/public_html/inc/dropship.php";'
             .'echo vestra_dropship_payments_enabled() ? "ACIK" : "kapali";'));
            $now = trim((string)$out);
            printf("simdiki durum: %s\n", $now);
            $okState = ($want && $now === 'ACIK') || (!$want && $now === 'kapali');
            echo $okState ? "SONUC: tuttu\n" : "SONUC: TUTMADI -- kayit istenen degeri almadi\n";
            exit($okState ? 0 : 1);
            PHPEOF
            php /tmp/vestra_dspay.php; rc=$?
            rm -f /tmp/vestra_dspay.php
            exit $rc

      - name: Siparişe navlun yaz (shipping) — numara yakmaz
        if: ${{ github.event.inputs.admin_mode == 'shipping' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          SHIP_REF: ${{ github.event.inputs.issue_ref }}
          SHIP_VAL: ${{ github.event.inputs.issue_shipping }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 3m
          envs: SHIP_REF,SHIP_VAL
          script: |
            set -e
            cat > /tmp/vestra_ship.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/orders.php";
            require_once $doc."/inc/auth.php";
            require_once $doc."/inc/invoice.php";
            require_once $doc."/inc/fx_orders.php";

            $ref = preg_replace('/[^A-Za-z0-9_-]/', '', (string)getenv('SHIP_REF'));
            $raw = trim((string)getenv('SHIP_VAL'));
            if ($ref === '' || $raw === '') { fwrite(STDERR, "ref ya da tutar yok\n"); exit(1); }

            /* Ucuncu parca: `allow_invoiced=1`. FATURASI KESILMIS siparis
               varsayilan olarak REDDEDILIYOR; opt-in ACIK olmak zorunda
               (`force=1` deseninin aynisi) ve yazdiktan sonra belge AYNI
               numarayla yeniden cizilmeli (KURAL 5f). */
            [$amountPart, $label, $flags] = array_pad(explode('|', $raw, 3), 3, '');
            $amountPart = trim($amountPart); $label = trim((string)$label);
            $allowInv = (bool)preg_match('/\ballow_invoiced\s*=\s*1\b/i', (string)$flags);

            $row = null;
            foreach (vestra_read_csv('orders.csv') as $r) if (($r['ref'] ?? '') === $ref) { $row = $r; break; }
            if (!$row) { fwrite(STDERR, "siparis bulunamadi: {$ref}\n"); exit(1); }
            $ordCur = strtoupper(trim((string)($row['currency'] ?? 'EUR'))) ?: 'EUR';

            /* `auto` = BOLGE TARIFESI (operator, 19 Eyl 2026). Rakam TEK tablodan
               (vestra_shipping_tariffs) ve siparisin KENDI kalemlerinden; panelin
               "Apply tariff" dugmesiyle AYNI hesap, AYNI yazici. Ulke taninmiyorsa
               is DURUYOR -- 0 yazip "tamam" demek, olmayan bir kural uygulanmis
               gibi gosterirdi; uydurma bir rakam ise KURAL 3'un yasakladigi sey.
               KURAL 34 (19 Eyl 2026, "simdilik otomatik yapma pasif olsun"):
               tarife su an PASIF. `auto` bu yuzden ARTIK DA REDDEDILIYOR --
               sessizce 0 yazmak "otomatik hesapladim" izlenimi verirdi, oysa
               anahtar kapaliyken hesaplanan hicbir sey yok. Sayisal bir tutar
               (ornek: "42.50") her zaman gecerli -- bu, operatorun "ben
               hesaplarim" dedigi yol. */
            if (strtolower($amountPart) === 'auto') {
              if (!vestra_shipping_auto_enabled()) {
                fwrite(STDERR, "otomatik navlun su an PASIF (Admin > Orders'ta durduruldu) -- 'auto' kabul edilmiyor, sayisal bir tutar yazin\n");
                exit(1);
              }
              $sch = vestra_order_shipping_schedule($row);
              if (!$sch) {
                fwrite(STDERR, "tarife YOK: ulke '".trim((string)($row['country'] ?? ''))."' Avrupa ya da ABD olarak taninmiyor -- navlunu elle yaz\n");
                exit(1);
              }
              $amountPart = number_format((float)$sch['amount'], 2, '.', '');
              if ($label === '') $label = (string)$sch['label'];
              printf("tarife           : %s  %d ad. -> %s %s\n", strtoupper((string)$sch['region']), (int)$sch['qty'], $ordCur, $amountPart);
              foreach ($sch['bulk'] as $b) printf("  toptan satir   : %s  %d ad. -> %s\n", $b['sku'], $b['qty'], number_format($b['amount'], 2));
              if ($sch['pooled_qty'] > 0) printf("  havuz          : %d ad. -> %s\n", $sch['pooled_qty'], number_format($sch['pooled'], 2));
            }

            /* "100 USD" -> siparisin biriminde karsiligi. Kur SIPARISIN damgasi
               (KURAL 5i); bugunun kuru degil, yoksa fatura ile bu rakam ayrisir. */
            $inCur = $ordCur;
            if (preg_match('/^(.*?)[\s]*([A-Za-z]{3})$/', $amountPart, $m)) {
              $inCur = strtoupper($m[2]); $amountPart = trim($m[1]);
            }
            $amount = vestra_price_input($amountPart);
            printf("siparis          : %s\n", $ref);
            printf("siparis birimi   : %s\n", $ordCur);
            if ($inCur !== $ordCur) {
              $fx = vestra_order_fx($ref);
              if (!$fx || (float)($fx['usd'] ?? 0) <= 0) {
                fwrite(STDERR, "kur damgasi YOK -- {$inCur} tutarini {$ordCur}'a cevirecek kur yok. "
                             . "Once Admin > Orders > 'Fetch missing rates'.\n"); exit(1);
              }
              if ($inCur !== 'USD') { fwrite(STDERR, "yalnizca {$ordCur} ve USD cevrilebiliyor\n"); exit(1); }
              $rate = (float)$fx['usd'];
              $want = $amount;
              $amount = round($amount / $rate, 2);
              printf("girilen          : %s %s  (kur %s)\n", number_format($want, 2), $inCur, vestra_order_fx_note($fx));
              printf("kayda yazilan    : %s %s   -> belgede %s %s\n",
                     number_format($amount, 2), $ordCur, number_format(round($amount * $rate, 2), 2), $inCur);
            }

            /* Fatura durumu YAZMADAN ONCE basiliyor: "neden reddedildi" sorusu
               ancak burada cevaplanir, ret satirinda degil. */
            $inv = vestra_invoices_for_ref($ref);
            printf("kesilmis fatura  : %s\n", $inv
              ? implode(', ', array_map(fn($i) => (string)($i['no'] ?? '?').' ('.number_format((float)($i['total'] ?? 0), 2).' '.(string)($i['currency'] ?? '').')', $inv))
                .($allowInv ? '  [allow_invoiced=1 -- yazilacak]' : '  [opt-in YOK -- reddedilecek]')
              : 'yok');

            $r = vestra_order_set_shipping($ref, $amount, $label, $allowInv);
            if (isset($r['error'])) { fwrite(STDERR, "YAZILAMADI: ".$r['error']."\n"); exit(1); }
            printf("mal toplami      : %s\n", number_format($r['goods'], 2));
            printf("indirim          : %s  (dokunulmadi)\n", number_format((float)($r['discount'] ?? 0), 2));
            if ((float)($r['fee'] ?? 0) > 0) printf("ucret            : %s  (kayittan okundu, KORUNDU)\n", number_format((float)$r['fee'], 2));
            printf("navlun           : %s%s\n", number_format($r['shipping'], 2), $r['label'] !== '' ? '  ('.$r['label'].')' : '');
            printf("SIPARIS TOPLAMI  : %s  (geri okundu, dogrulandi)\n", number_format($r['total'], 2));
            echo "kesim            : YAPILMADI (numara yanmadi, PDF uretilmedi, aliciya hicbir sey gitmedi)\n";
            if (!empty($r['must_redraft'])) {
              printf("*** BELGE ESKI TUTARI TASIYOR: %s -- ayni numarayla YENIDEN CIZ (KURAL 5f):\n"
                   . "    admin_mode=issue + issue_redraft=true\n", implode(', ', (array)($r['invoiced'] ?? [])));
            }
            PHPEOF
            php -l /tmp/vestra_ship.php
            php /tmp/vestra_ship.php
            rm -f /tmp/vestra_ship.php

      # FATURANIN PARA BIRIMI (KURAL 5i). Panelin acilir listesiyle AYNI kaydi
      # yaziyor -- ayri bir alan degil, `order_statuses.json[ref].invoice_currency`.
      # Yazmak KESMEK DEGIL: numara yanmaz, PDF uretilmez, aliciya hicbir sey
      # gitmez; secim yalnizca "Approve & issue"a basildiginda belgeye doner.
      #
      # Yazma GERI OKUNARAK dogrulaniyor (KURAL 5c'nin billing_saved dersi:
      # `vestra_order_set_invoice_currency` false donerse hicbir sey yazilmamistir
      # ve "USD yaptim" demek operatore olmayan bir kaydi dogru sandirir).
      #
      # Kur damgasi ve odeme kutusu da ayni koside yaziliyor: damga yoksa kesim
      # zaten DURACAK, odeme yolu yoksa belge ODEME KUTUSUZ cikacak -- ikisini de
      # secimi yapan kisi simdi gormeli, alici fatura elindeyken degil.
      - name: Faturanın para birimini kaydet (currency) — numara yakmaz
        if: ${{ github.event.inputs.admin_mode == 'currency' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          CUR_REF: ${{ github.event.inputs.issue_ref }}
          CUR_WANT: ${{ github.event.inputs.issue_currency }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 3m
          envs: CUR_REF,CUR_WANT
          script: |
            set -e
            cat > /tmp/vestra_cur.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/orders.php";
            require_once $doc."/inc/auth.php";
            require_once $doc."/inc/invoice.php";
            require_once $doc."/inc/fx_orders.php";

            $ref  = preg_replace('/[^A-Za-z0-9_-]/', '', (string)getenv('CUR_REF'));
            $want = strtoupper(trim((string)getenv('CUR_WANT')));
            if ($ref === '') { fwrite(STDERR, "ref yok\n"); exit(1); }

            $row = null;
            foreach (vestra_read_csv('orders.csv') as $r) if (($r['ref'] ?? '') === $ref) { $row = $r; break; }
            if (!$row) { fwrite(STDERR, "siparis bulunamadi: {$ref}\n"); exit(1); }
            $ordCur = strtoupper(trim((string)($row['currency'] ?? 'EUR'))) ?: 'EUR';

            /* Kesilmis fatura varsa SECIM ARTIK BIR SEY DEGISTIRMEZ: belge alicinin
               elinde ve dosya adi/numara yanmis durumda. Sessizce yazip "tamam"
               demek, degismeyecek bir seyi degistirdik sanmak olurdu. */
            $already = function_exists('vestra_invoices_for_ref') ? vestra_invoices_for_ref($ref) : [];
            if ($already) {
              fwrite(STDERR, "fatura ZATEN KESILMIS (".count($already)." belge) -- para birimi secimi artik belgeyi degistirmez.\n"
                           . "Degistirmek icin KURAL 5f: kalemi cikar/yeniden ciz, ya da faturayi iptal edip yeniden kes.\n");
              exit(1);
            }

            $before = vestra_order_invoice_currency($ref);
            $ok     = vestra_order_set_invoice_currency($ref, $want);
            $after  = vestra_order_invoice_currency($ref);
            $expect = ($want === '' || !in_array($want, vestra_invoice_currencies(), true)) ? '' : $want;

            printf("siparis          : %s\n", $ref);
            printf("siparis birimi   : %s  (KAYIT -- degismez)\n", $ordCur);
            printf("onceki secim     : %s\n", $before === '' ? '(yok -- siparis birimi)' : $before);
            printf("istenen          : %s\n", $want === '' ? '(secimi kaldir)' : $want);
            if (!$ok || $after !== $expect) {
              fwrite(STDERR, "YAZILAMADI -- kayit '".($after === '' ? '(yok)' : $after)."' olarak kaldi"
                           . ($ok ? "" : " (taninmayan birim reddedildi; izin listesi: ".implode(', ', vestra_invoice_currencies()).")")."\n");
              exit(1);
            }
            printf("KAYITLI          : %s  (geri okundu, dogrulandi)\n", $after === '' ? '(yok -- siparis birimi)' : $after);

            /* Cevrim gerekiyorsa kur damgasi SART. Yoksa kesim `['error'=>...]`
               donup duracak -- bunu simdi soylemek, Approve'a basanin kirmizi
               bant gormesinden ucuz. */
            if ($after !== '' && $after !== $ordCur) {
              $fx = vestra_order_fx($ref);
              printf("kur damgasi      : %s\n", $fx ? vestra_order_fx_note($fx) : "YOK -- KESIM DURUR (Admin > Orders > 'Fetch missing rates')");
              if (!$fx) exit(1);
            }

            /* Odeme kutusu bu birimde gercekten cikiyor mu? Degerleri yazmiyoruz
               (log herkese acik), yalnizca kutunun dolu olup olmadigini. */
            foreach (vestra_order_invoice_payloads($ref) as $p) {
              $acc = $p['seller'];
              $who = $acc ? ($acc['company'] ?: ($acc['name'] ?: $p['seller_key'])) : 'VESTRA (acerasoft LLC)';
              $cur = (string)($p['meta']['currency'] ?? $ordCur);
              if (!empty($p['currency_error'])) {
                printf("  %-26s CEVRILEMEDI: %s -- KESIM DURUR\n", mb_substr($who,0,24), $p['currency_error']);
                continue;
              }
              $rails = $acc ? vestra_payment_rails($acc, $cur) : [];
              printf("  %-26s %s odeme kutusu: %s\n", mb_substr($who,0,24), $cur,
                     $acc ? ($rails ? count($rails).' satir' : 'BOS -- bu hesapta '.$cur.' yolu yok')
                          : 'HIC CIKMAZ -- platform kesiyor, bagli banka hesabi yok');
            }
            echo "kesim            : YAPILMADI (numara yanmadi, PDF uretilmedi, aliciya hicbir sey gitmedi)\n";
            PHPEOF
            php -l /tmp/vestra_cur.php
            php /tmp/vestra_cur.php
            rm -f /tmp/vestra_cur.php

      # Faturayi KIMIN kesecegini KAYDA yazar -- panelin acilir listesiyle AYNI
      # kayit (order_statuses.json[ref].invoice_seller_uid, KURAL 5b).
      #
      # NEDEN GEREKTI (8 Eyl 2026, VES-A8A129EC): siparis birden fazla saticinin
      # ilanini tasiyorsa vestra_order_invoice_payloads() onu satici basina
      # DILIMLER ve her dilim AYRI belge olur -- operator faturayi acinca uc
      # kalem goruyor, dorduncu (baska saticinin) kalem "faturada yok" gibi
      # duruyor. Kalem eksik degil, belge iki tane. Tek dogru mudahale bu secim:
      # secim varken dilimleme YAPILMIYOR, tek belge cikiyor.
      #
      #   issue_ref : siparis ref (or: VES-A8A129EC)
      #   payload   : 'vestra' (platform kessin) | hesabin ADINDAN bir parca |
      #               bos = secimi KALDIR (ilanin saticisina geri doner).
      #               uid degil ad parcasi: uid'i ezberden yazmak yanlis tuzel
      #               kisiden belge cikarabilir; burada TEK esleme sart.
      - name: Faturayı kimin keseceğini seç (seller) — belge üretmez
        if: ${{ github.event.inputs.admin_mode == 'seller' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          SEL_REF: ${{ github.event.inputs.issue_ref }}
          SEL_WHO: ${{ github.event.inputs.payload }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 3m
          envs: SEL_REF,SEL_WHO
          script: |
            set -e
            cat > /tmp/vestra_isel.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/orders.php";
            require_once $doc."/inc/auth.php";
            require_once $doc."/inc/invoice.php";
            require_once $doc."/inc/fx_orders.php";

            $ref = preg_replace('/[^A-Za-z0-9_-]/', '', (string)getenv('SEL_REF'));
            $who = trim((string)getenv('SEL_WHO'));
            if ($ref === '') { fwrite(STDERR, "ref yok (issue_ref)\n"); exit(1); }

            $row = null;
            foreach (vestra_read_csv('orders.csv') as $r) if (($r['ref'] ?? '') === $ref) { $row = $r; break; }
            if (!$row) { fwrite(STDERR, "siparis bulunamadi: {$ref}\n"); exit(1); }

            /* Kesilmis fatura varsa secim ARTIK BIR SEY DEGISTIRMEZ: belge
               alicinin elinde, numara yanmis, dosya adi satici anahtarindan
               turuyor. Sessizce yazip "tamam" demek, degismeyecek bir seyi
               degistirdik sanmak olurdu (currency modunun ayni gerekcesi). */
            $already = vestra_invoices_for_ref($ref);
            if ($already) {
              fwrite(STDERR, "fatura ZATEN KESILMIS (".implode(', ', array_map(fn($i)=>(string)($i['no']??'?'), $already))
                           .") -- satici secimi artik belgeyi degistirmez.\nKURAL 5f: kalemi cikar/yeniden ciz, ya da iptal edip yeniden kes.\n");
              exit(1);
            }

            /* AD -> uid. 'vestra' acik bir secimdir (platform kessin). */
            $uid = '';
            if ($who !== '' && strtolower($who) !== 'vestra') {
              $hits = [];
              foreach (auth_accounts() as $a) {
                $hay = mb_strtolower(($a['company'] ?? '').' '.($a['name'] ?? ''));
                if (mb_strpos($hay, mb_strtolower($who)) !== false) $hits[] = $a;
              }
              if (count($hits) !== 1) {
                fwrite(STDERR, "ad '".$who."' ".count($hits)." hesapla esletti -- TEK esleme sart\n");
                foreach ($hits as $h) fwrite(STDERR, "   - ".($h['company'] ?: $h['name'])."\n");
                exit(1);
              }
              $uid = (string)$hits[0]['id'];
              echo "secilen hesap  : ".($hits[0]['company'] ?: $hits[0]['name'])."\n";
            } elseif (strtolower($who) === 'vestra') {
              $uid = 'vestra';
            }

            $before = vestra_order_invoice_seller_pick($ref);
            $ok     = vestra_order_set_invoice_seller($ref, $uid);
            $after  = vestra_order_invoice_seller_pick($ref);

            printf("siparis        : %s\n", $ref);
            printf("onceki secim   : %s\n", $before === '' ? '(yok -- ilanin saticisi)' : $before);
            printf("istenen        : %s\n", $uid === '' ? '(secimi kaldir)' : $uid);
            if (!$ok || $after !== $uid) {
              fwrite(STDERR, "YAZILAMADI -- kayit '".($after === '' ? '(yok)' : $after)."' olarak kaldi\n");
              exit(1);
            }
            printf("KAYITLI        : %s  (geri okundu, dogrulandi)\n", $after === '' ? '(yok -- ilanin saticisi)' : $after);

            /* Secimin gercekten TEK belge urettigini burada olcuyoruz: kodu
               okuyup "dilimlemez" demek olcum degil. */
            $ld = vestra_order_lines($row);
            $pcs = 0; foreach ($ld['lines'] as $l) $pcs += (int)($l['qty'] ?? 0);
            printf("siparis kalemi : %d satir / %d adet\n", count($ld['lines']), $pcs);
            $ps = vestra_order_invoice_payloads($ref);
            printf("yuk (dilim)    : %d  %s\n", count($ps), count($ps) === 1 ? '(TEK BELGE)' : '*** BIRDEN FAZLA BELGE ***');
            foreach ($ps as $p) {
              $goods = 0.0; foreach (($p['items'] ?? []) as $it) $goods += (float)($it['line'] ?? 0);
              $cur = (string)($p['meta']['currency'] ?? 'EUR');
              printf("   - %-26s kalem %d  mal %s  navlun %s\n",
                     mb_substr(vestra_invoice_issuer_name($p['seller'] ?? [], 'VESTRA'), 0, 26),
                     count($p['items'] ?? []),
                     number_format($goods, 2),
                     number_format((float)($p['meta']['shipping'] ?? 0), 2));
              /* BELGEYE BASILACAK SATIRLAR. "Kalem 4" demek operatorun
                 gordugu sey degil -- eksik sandigi kalemi ADIYLA gormesi
                 lazim. Kisiye ait hicbir alan yok: SKU/adet/tutar. */
              foreach (($p['items'] ?? []) as $it) {
                printf("       %-30s %-26s %2d x %8s = %9s\n",
                       mb_substr((string)($it['sku'] ?? '?'), 0, 30),
                       mb_substr((string)($it['name'] ?? ''), 0, 26),
                       (int)($it['qty'] ?? 0),
                       number_format((float)($it['unit'] ?? 0), 2),
                       number_format((float)($it['line'] ?? 0), 2));
              }
              /* Odeme kutusu: DEGERLER YAZILMAZ (log herkese acik), yalnizca
                 dolu mu. Bos cikan bir kutu, havale bekleyen bir faturada
                 alicinin nereye odeyecegini bilmemesi demek. */
              $payAcc = $p['seller'] ?: (function_exists('vestra_platform_seller') ? vestra_platform_seller() : []);
              $rails  = $payAcc ? vestra_payment_rails($payAcc, $cur) : [];
              printf("       odeme kutusu (%s): %s\n", $cur,
                     $rails ? count($rails).' satir' : 'BOS -- bu kunyede '.$cur.' yolu yok');
              $goodsAll = $goods + (float)($p['meta']['shipping'] ?? 0);
              printf("       ODENECEK: %s %s\n", $cur, number_format($goodsAll, 2));
            }
            echo "kesim          : YAPILMADI (numara yanmadi, PDF uretilmedi, aliciya hicbir sey gitmedi)\n";
            PHPEOF
            php -l /tmp/vestra_isel.php
            php /tmp/vestra_isel.php
            rm -f /tmp/vestra_isel.php

      # Faturayi KESER. Kesim ile GONDERIM burada bilerek ayri: admin.php'nin "Fatura kes"
      # dugmesi ikisini birlikte yapiyor, biz sadece ilkini istiyoruz -- belge numarasini
      # alsin, PDF kaydedilsin, ama musteriye hicbir sey gitmesin. vestra_notify_* cagrisi
      # yok; onay geldikten sonra gonderim ayri bir adim.
      #
      # Idempotent: ayni ref ikinci kez calistirilirsa kesilmis fatura oldugu gibi doner,
      # yeni numara uretilmez.
      - name: Faturayı kes (issue) — e-posta göndermez
        if: ${{ github.event.inputs.admin_mode == 'issue' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          ISSUE_REF: ${{ github.event.inputs.issue_ref }}
          ISSUE_PUBKEY: ${{ github.event.inputs.issue_pubkey }}
          ISSUE_REDRAFT: ${{ github.event.inputs.issue_redraft }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: ISSUE_REF,ISSUE_PUBKEY,ISSUE_REDRAFT,ISSUE_NUMBER
          script: |
            set -e
            cat > /tmp/vestra_issue.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/orders.php";
            require_once $doc."/inc/auth.php";
            require_once $doc."/inc/invoice.php";

            $ref = preg_replace('/[^A-Za-z0-9_-]/', '', (string)getenv('ISSUE_REF'));
            if ($ref === '') { fwrite(STDERR, "ref yok\n"); exit(1); }
            $pub = openssl_pkey_get_public((string)base64_decode(trim((string)getenv('ISSUE_PUBKEY')), true));
            if (!$pub) { fwrite(STDERR, "public key okunamadi\n"); exit(1); }

            $redraft = strtolower(trim((string)getenv('ISSUE_REDRAFT'))) === 'true';

            /* Numarayi elle kaydirma. vestra_ensure_invoice() redraft'ta meta'daki numarayi
               oldugu gibi kullaniyor, o yuzden once meta'yi, sonra sayaci yaziyoruz --
               boylece bir sonraki fatura buradan devam eder, ayni numara iki kez cikmaz.
               Sadece redraft ile birlikte calisir: kesilmis ve HENUZ GONDERILMEMIS bir
               belgenin numarasini duzeltmek icindir. */
            $forceNo = (int)trim((string)getenv('ISSUE_NUMBER'));
            if ($redraft && $forceNo > 0) {
              $year = date('Y');
              $dir  = vestra_invoice_dir();
              $safe = preg_replace('/[^A-Za-z0-9_-]/', '', $ref);
              $metas = glob($dir.'/'.$safe.'__*.json') ?: [];
              if (count($metas) !== 1) {
                fwrite(STDERR, "numara degistirme tek faturali siparis icin: ".count($metas)." meta bulundu\n"); exit(1);
              }
              $m = json_decode((string)file_get_contents($metas[0]), true) ?: [];
              $oldNo = (string)($m['no'] ?? '');
              $newNo = sprintf('INV-%s-%06d', $year, $forceNo);
              $m['no'] = $newNo;
              file_put_contents($metas[0], json_encode($m, JSON_PRETTY_PRINT), LOCK_EX);

              $seqFile = $doc.'/data/invoice_seq.json';
              $seq = json_decode((string)@file_get_contents($seqFile), true);
              if (!is_array($seq)) $seq = [];
              $k = ((string)($m['seller_key'] ?? '')).'-'.$year;
              $seq[$k] = max((int)($seq[$k] ?? 0), $forceNo);
              file_put_contents($seqFile, json_encode($seq, JSON_PRETTY_PRINT), LOCK_EX);
              echo "numara           : {$oldNo} -> {$newNo}  (sayac {$k} = {$seq[$k]}, sonraki ".($seq[$k]+1).")\n";
            }

            $before = vestra_invoices_for_ref($ref);
            $issued = vestra_issue_order_invoices($ref, $redraft);
            /* Para birimi cevrilemediyse hicbir numara yakilmadi; hata dizisi de
               "dolu" oldugu icin asagidaki count() onu 1 fatura sanardi. */
            if (isset($issued['error'])) { fwrite(STDERR, "fatura kesilmedi -- para birimi: ".$issued['error']."\n"); exit(1); }
            if (!$issued) { fwrite(STDERR, "fatura kesilemedi (siparis yok ya da satir yok)\n"); exit(1); }
            echo "onceden kesilmis : ".(count($before) ?: 'yok')."\n";
            echo "fatura sayisi    : ".count($issued)."\n";
            foreach ($issued as $iv) {
              echo "  no: ".$iv['no']."  satici: ".$iv['seller_key']."  dosya: ".(is_file($iv['path']) ? 'var' : 'YOK')
                 .(!empty($iv['redrafted']) ? "  (AYNI numarayla yeniden uretildi)" : "")."\n";
            }
            /* Faturanin uzerinde ne yazdigi tek gercek kaynak belgenin kendisi; alici blogunu
               log'a yazamayiz (herkese acik), ama ULKE alaninin duzelip duzelmedigini gormek
               gerekiyor -- bir ulke adi kisisel veri degil. */
            $ordRow = null;
            foreach (vestra_read_csv('orders.csv') as $r) if (($r['ref'] ?? '') === $ref) { $ordRow = $r; break; }
            if ($ordRow) {
              $bq = vestra_invoice_buyer($ordRow);
              echo "alici ulkesi     : ".($bq['country'] !== '' ? $bq['country'] : 'YOK')."\n";
              echo "alici adresi     : ".($bq['address'] !== '' ? mb_strlen($bq['address'])." karakter" : 'YOK')."\n";
            }
            echo "e-posta          : GONDERILMEDI (bilerek -- gonderim ayri adim)\n";

            /* Birden fazla satici olsaydi her PDF ayri donerdi; bu sipariste tek taraf var. */
            $pdf = (string)@file_get_contents($issued[0]['path']);
            if ($pdf === '') { fwrite(STDERR, "PDF okunamadi\n"); exit(1); }
            echo "bayt             : ".strlen($pdf)."\n";
            echo "sha256           : ".hash('sha256', $pdf)."\n";

            /* BELGENIN KENDISI OLCULUYOR, yazma mesaji DEGIL. "Navlun eklendi"
               diyen bir kosu, navlunu BELGEYE bastigini soylemiyor -- bu depoda
               fotografsiz bir PDF yillarca "uretildi, boyut makul" diye gecti.
               inc/pdf.php akislari SIKISTIRMIYOR, yani ham baytta metin aranabilir;
               sikistirma bir gun eklenirse bunu ayrica soyluyoruz ki "yok" diye
               yanlis bir kirmizi degil, sebebi yazan bir satir cikssin.
               Tutar zaten bu kutuge basiliyor (siparis toplami); yeni bir sey
               acilmiyor -- kisiye ait hicbir alan yazilmiyor. */
            $flate = str_contains($pdf, '/FlateDecode');
            if ($flate) {
              echo "belge denetimi   : akislar sikistirilmis -- ham baytta metin aranamiyor\n";
            } else {
              $shipLbl = trim((string)($ordRow['shipping_label'] ?? '')) ?: 'Shipping';
              $shipAmt = round((float)($ordRow['shipping'] ?? 0), 2);
              $discAmt = round((float)($ordRow['discount'] ?? 0), 2);
              $totAmt  = round((float)($ordRow['total'] ?? 0), 2);
              $has = fn(float $v) => str_contains($pdf, number_format($v, 2));
              printf("belgede navlun   : %s  (%s %s)\n",
                     $shipAmt > 0 ? ($has($shipAmt) && str_contains($pdf, $shipLbl) ? 'VAR' : '*** YOK ***') : '- (navlun 0)',
                     $shipLbl, number_format($shipAmt, 2));
              if ($discAmt > 0) printf("belgede indirim  : %s  (%s)\n", $has($discAmt) ? 'VAR' : '*** YOK ***', number_format($discAmt, 2));
              printf("belgede toplam   : %s  (%s)\n", $has($totAmt) ? 'VAR' : '*** YOK ***', number_format($totAmt, 2));

              /* ODEME KUTUSU BELGEDE MI (19 Eyl 2026). KURAL 5r kesim ANINDA
                 kutunun cikacagini garanti ediyor -- ama DAHA ONCE kesilmis bir
                 belge o kunye tamamlanmadan cizilmis olabilir ve o belgede alici
                 parayi nereye gonderecegini GOREMIYOR. Bunu yalnizca belgenin
                 KENDISINE bakarak anlariz: kayittaki kunyenin bugun dolu olmasi,
                 dun cizilmis bir PDF hakkinda hicbir sey soylemiyor.
                 DEGER BASILMIYOR: IBAN/hesap numarasi degil, yalnizca satirin
                 VARLIGI -- kutuk herkese acik (Guvenlik bolumu). Ulke adi bir
                 hesap kimligi degil, o yuzden adiyla yaziliyor: eksikse operator
                 neyin eksik oldugunu gorebilmeli. */
              $payLbl = str_contains($pdf, 'IBAN:') ? 'IBAN:'
                      : (str_contains($pdf, 'Account number:') ? 'Account number:' : '');
              printf("belgede odeme kutusu: %s\n",
                     $payLbl !== '' ? 'VAR ('.$payLbl.' satiri)'
                                    : '*** YOK -- alici nereye odeyecegini goremez ***');
              printf("belgede banka adresi: %s%s\n",
                     str_contains($pdf, 'Bank address') ? 'VAR' : '*** YOK ***',
                     str_contains($pdf, 'Germany') ? '  (ulke: Germany)' : '');
            }

            $aes = random_bytes(32); $iv2 = random_bytes(16);
            $ct  = openssl_encrypt($pdf, 'aes-256-cbc', $aes, OPENSSL_RAW_DATA, $iv2);
            if ($ct === false || !openssl_public_encrypt($aes, $ek, $pub, OPENSSL_PKCS1_OAEP_PADDING)) {
              fwrite(STDERR, "sifreleme basarisiz\n"); exit(1);
            }
            /* Rakamsiz base64 -- kisa sayisal bir secret (DEPLOY_PORT) rastgele base64
               icinde *** ile maskelenip govdeyi sessizce bozuyordu. */
            $enc = fn(string $b) => strtr(base64_encode($b), '0123456789', '!$%&#,;?@~');
            echo "KEY ".$enc($ek)."\n";
            echo "IV  ".$enc($iv2)."\n";
            echo "-----BEGIN INVOICE ENC-----\n";
            foreach (str_split($enc($ct), 200) as $ln) echo $ln."\n";
            echo "-----END INVOICE ENC-----\n";
            PHPEOF
            php /tmp/vestra_issue.php
            rm -f /tmp/vestra_issue.php

      - name: Satıcı kimliğini uygula (apply)
        if: ${{ github.event.inputs.admin_mode == 'apply' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          PAYLOAD: ${{ github.event.inputs.payload }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: PAYLOAD
          script: |
            set -e
            cat > /tmp/vestra_seller_apply.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $home = getenv("HOME"); $doc = $home."/public_html";
            require $doc."/inc/auth.php";
            require $doc."/inc/products.php";

            /* Payload: KEY.IV.GOVDE -- rakamsiz base64 (bkz. diag-live: kisa sayisal bir
               secret rastgele base64 icinde *** ile maskeleniyor ve govdeyi bozuyor). */
            $dec = fn(string $x) => base64_decode(strtr($x, '!$%&#,;?@~', '0123456789'), true);
            $parts = explode('.', trim((string)getenv('PAYLOAD')));
            if (count($parts) !== 3) { fwrite(STDERR, "payload bicimi hatali\n"); exit(1); }
            $priv = openssl_pkey_get_private((string)@file_get_contents($home."/.vestra_inbox_key.pem"));
            if (!$priv) { fwrite(STDERR, "sunucuda anahtar yok -- once admin_mode=keygen calistir\n"); exit(1); }
            if (!openssl_private_decrypt($dec($parts[0]), $aes, $priv, OPENSSL_PKCS1_OAEP_PADDING)) {
              fwrite(STDERR, "anahtar acilamadi\n"); exit(1);
            }
            $json = openssl_decrypt($dec($parts[2]), 'aes-256-cbc', $aes, OPENSSL_RAW_DATA, $dec($parts[1]));
            $in = $json === false ? null : json_decode($json, true);
            if (!is_array($in) || (empty($in['account_id']) && empty($in['account_email']))) {
              fwrite(STDERR, "govde cozulemedi (account_id ya da account_email gerekli)\n"); exit(1);
            }

            $accFile = $doc.'/data/accounts.json';
            $accounts = auth_accounts();
            $idx = null;
            /* Hesabi id ile buluyoruz; id elde yoksa e-posta ile. Alici hesaplarinin id'si
               hicbir yerde gorunmuyor, elimizde olan tek tanitici e-posta adresi. */
            if (!empty($in['account_id'])) {
              foreach ($accounts as $i => $a) if ((string)($a['id'] ?? '') === (string)$in['account_id']) { $idx = $i; break; }
            } else {
              $want = strtolower(trim((string)$in['account_email']));
              foreach ($accounts as $i => $a) if (strtolower(trim((string)($a['email'] ?? ''))) === $want) { $idx = $i; break; }
            }
            if ($idx === null) { fwrite(STDERR, "hesap bulunamadi\n"); exit(1); }
            $in['account_id'] = (string)($accounts[$idx]['id'] ?? '');

            copy($accFile, $accFile.'.bak-'.date('Ymd-His'));
            $before = $accounts[$idx]['company'] ?? '';
            /* Sadece verilen alanlar yazilir; parola/id/tip'e dokunulmaz. */
            foreach (['company','name','address','country','vat_id','reg_number',
                      'bank_name','bank_holder','bank_iban','bank_bic'] as $f) {
              if (isset($in[$f]) && $in[$f] !== '') $accounts[$idx][$f] = (string)$in[$f];
            }
            /* E-posta hem GIRIS bilgisi hem de bildirim adresi. Baska bir hesap ayni adresi
               kullaniyorsa girisi belirsiz hale getirir -- degistirmeden once bakiyoruz. */
            if (!empty($in['email'])) {
              $new = strtolower(trim((string)$in['email']));
              foreach ($accounts as $j => $a2) {
                if ($j !== $idx && strtolower(trim((string)($a2['email'] ?? ''))) === $new) {
                  fwrite(STDERR, "bu e-posta baska bir hesapta kayitli -- degistirilmedi\n"); exit(1);
                }
              }
              $oldMail = (string)($accounts[$idx]['email'] ?? '');
              $accounts[$idx]['email'] = $new;
              echo "e-posta  : {$oldMail} -> {$new}   (GIRIS adresi de bu oldu)\n";
            }
            auth_save_accounts($accounts);
            $mask = fn($v) => $v === '' ? '(bos)' : (mb_strlen($v) <= 4 ? '****' : str_repeat('*', mb_strlen($v)-4).mb_substr($v,-4));
            echo "hesap    : {$in['account_id']}\n";
            echo "sirket   : {$before} -> ".($accounts[$idx]['company'] ?? '')."\n";
            echo "VAT      : ".($accounts[$idx]['vat_id'] ?? '(bos)')."\n";
            echo "banka    : ".($accounts[$idx]['bank_name'] ?? '(bos)')." | sahip: ".($accounts[$idx]['bank_holder'] ?? '(bos)')."\n";
            echo "IBAN     : ".$mask((string)($accounts[$idx]['bank_iban'] ?? ''))."   (log'a tam yazilmaz)\n";

            /* Navlun siparis satirinda durur: tek sevkiyatin tasima bedelini saticilara
               bolmek kimsenin mutabakat yapamayacagi rakamlar uretir. Sutun yoksa basliga
               eklenir -- eski siparisler bos deger alir, hicbir sey bozulmaz. */
            if (isset($in['shipping'])) {
                $ref2 = preg_replace('/[^A-Za-z0-9_-]/', '', (string)($in['assign_ref'] ?? $in['shipping_ref'] ?? ''));
                $csv  = $doc.'/data/orders.csv';
                $rows = vestra_read_csv('orders.csv');
                $hdr  = $rows ? array_keys($rows[0]) : [];
                foreach (['shipping','shipping_label','partial_shipments'] as $col) if (!in_array($col, $hdr, true)) $hdr[] = $col;
                vestra_csv_ensure_header('orders.csv', $hdr);
                $rows = vestra_read_csv('orders.csv');
                copy($csv, $csv.'.bak-'.date('Ymd-His'));
                $hit = 0;
                foreach ($rows as $i => $r) {
                    if (($r['ref'] ?? '') !== $ref2) continue;
                    $rows[$i]['shipping'] = number_format((float)$in['shipping'], 2, '.', '');
                    $rows[$i]['shipping_label'] = (string)($in['shipping_label'] ?? '');
                    $rows[$i]['partial_shipments'] = !empty($in['partial_shipments']) ? '1' : '';
                    $hit++;
                }
                if (!$hit) { fwrite(STDERR, "navlun icin siparis bulunamadi: {$ref2}\n"); exit(1); }
                $fh = fopen($csv, 'w');
                fputcsv($fh, $hdr, ',', '"', '\\');
                foreach ($rows as $r) { $line = []; foreach ($hdr as $c) $line[] = (string)($r[$c] ?? ''); fputcsv($fh, $line, ',', '"', '\\'); }
                fclose($fh);
                echo "navlun    : {$ref2} -> ".number_format((float)$in['shipping'], 2)." EUR ("
                   .($in['shipping_label'] ?? '-').")\n";
            }

            /* Sevkiyat kunyesi: teslim sekli, mensei, ihracat sebebi ve KDV notu. Fatura
               bunlari yalnizca DOLUYSA basiyor -- tahmin edilen bir Incoterm %25 ithalat
               vergisini kimin odeyecegine karar verir, tahmin edilen bir mensei ise yanlis
               beyandir. Bos birakmak, uydurmaktan iyidir. */
            /* 'total' de burada: siparisin "alici ne oduyor" rakami. Navlun sonradan
               eklendiginde bu sutun eski haliyle kaliyor ve alicinin panelinde faturadan
               farkli bir tutar gorunuyordu. */
            $shipMeta = array_intersect_key($in, array_flip(['incoterms','origin','export_reason','vat_note','total']));
            if ($shipMeta) {
                $ref3 = preg_replace('/[^A-Za-z0-9_-]/', '', (string)($in['assign_ref'] ?? $in['shipping_ref'] ?? ''));
                $csv  = $doc.'/data/orders.csv';
                $rows = vestra_read_csv('orders.csv');
                $hdr  = $rows ? array_keys($rows[0]) : [];
                foreach (array_keys($shipMeta) as $col) if (!in_array($col, $hdr, true)) $hdr[] = $col;
                vestra_csv_ensure_header('orders.csv', $hdr);
                $rows = vestra_read_csv('orders.csv');
                copy($csv, $csv.'.bak-'.date('Ymd-His'));
                $hit = 0;
                foreach ($rows as $i => $r) {
                    if (($r['ref'] ?? '') !== $ref3) continue;
                    foreach ($shipMeta as $col => $val) $rows[$i][$col] = (string)$val;
                    $hit++;
                }
                if (!$hit) { fwrite(STDERR, "sevkiyat kunyesi icin siparis bulunamadi: {$ref3}\n"); exit(1); }
                $fh = fopen($csv, 'w');
                fputcsv($fh, $hdr, ',', '"', '\\');
                foreach ($rows as $r) { $line = []; foreach ($hdr as $c) $line[] = (string)($r[$c] ?? ''); fputcsv($fh, $line, ',', '"', '\\'); }
                fclose($fh);
                foreach ($shipMeta as $col => $val) echo "kunye     : {$col} = {$val}\n";
            }

            /* Siparisin urunlerini bu saticiya bagla. seller_uid bos kaldigi surece fatura
               VESTRA adina cikiyor ve odeme kutusu hic gorunmuyor -- fatura kimin kesecegi
               satirin sahibine bagli, ayri bir secim degil. */
            if (!empty($in['assign_ref'])) {
              $ref = preg_replace('/[^A-Za-z0-9_-]/', '', (string)$in['assign_ref']);
              $order = null;
              foreach (vestra_read_csv('orders.csv') as $r) if (($r['ref'] ?? '') === $ref) { $order = $r; break; }
              if (!$order) { fwrite(STDERR, "siparis bulunamadi: {$ref}\n"); exit(1); }
              $skus = [];
              foreach (vestra_parse_order_items((string)($order['items'] ?? '')) as $it) $skus[$it['sku']] = true;

              $lfile = $doc.'/data/listings.json';
              $listings = json_decode((string)file_get_contents($lfile), true);
              if (!is_array($listings)) { fwrite(STDERR, "listings.json bozuk\n"); exit(1); }
              copy($lfile, $lfile.'.bak-'.date('Ymd-His'));
              $moved = 0; $already = 0; $missing = $skus;
              foreach ($listings as $i => $p) {
                $sku = (string)($p['sku'] ?? '');
                if ($sku === '' || !isset($skus[$sku])) continue;
                unset($missing[$sku]);
                if ((string)($p['seller_uid'] ?? '') === (string)$in['account_id']) { $already++; continue; }
                $listings[$i]['seller_uid'] = (string)$in['account_id'];
                $moved++;
              }
              file_put_contents($lfile, json_encode($listings, JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES), LOCK_EX);
              echo "\nsiparis {$ref}: ".count($skus)." SKU | tasinan: {$moved} | zaten bagli: {$already}"
                 .($missing ? " | KATALOGDA YOK: ".count($missing) : "")."\n";
              foreach (array_keys($missing) as $m) echo "  ! bulunamadi: {$m}\n";
            }
            PHPEOF
            php -l /tmp/vestra_seller_apply.php
            php /tmp/vestra_seller_apply.php
            rm -f /tmp/vestra_seller_apply.php

      - name: Satıcı askısını kaldır (panelin Activate düğmesiyle aynı yazma)
        if: ${{ github.event.inputs.admin_mode == 'seller_activate' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          SA_UID: ${{ github.event.inputs.issue_ref }}
          SA_GO:  ${{ github.event.inputs.move_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 3m
          envs: SA_UID,SA_GO
          script: |
            set -e
            cat > /tmp/vestra_sactivate.php <<'PHPEOF'
            <?php
            /* Askidaki bir saticiyi geri acar. Panelin 'Activate' dugmesiyle
               AYNI iki yazma (admin.php: activate_account):
                   status='active', suspend_reason=''
               ve belge askisindan cikiyorsa TAZE pencere. Ikinci bir "acma"
               mantigi YAZILMADI -- bu depoda kapinin ikinci kopyasi alti kez
               yanlis yere bakti.

               MUAFIYETIN YETMEDIGI YER TAM BURASI: auth_seller_doc_grace()
               muafiyeti 'suspended' dalindan ONCE soruyor, yani muaf bir satici
               bir daha askiya ALINMAZ ama zaten askidaysa kendiliginden
               ACILMAZ. Ilanlari katalogdan cekili kalir.

               Kuru kosu varsayilan (KURAL 18'in yazma tarafi). Yazma GERI
               OKUNUYOR: auth_update() void donuyor, "kaydettim" demek olcum
               degil (KURAL 5c'nin billing_saved dersi). */
            $home = getenv("HOME");
            require $home."/public_html/inc/auth.php";
            require $home."/public_html/inc/products.php";
            $uid = trim((string)getenv("SA_UID"));
            $go  = strtolower(trim((string)getenv("SA_GO"))) === 'true';
            if ($uid === '') { fwrite(STDERR, "HATA: issue_ref bos -- hesap ID'si verin\n"); exit(1); }

            $acc = null;
            foreach (auth_accounts() as $a) if ((string)($a['id'] ?? '') === $uid) { $acc = $a; break; }
            if (!$acc) { fwrite(STDERR, "HATA: hesap bulunamadi: {$uid}\n"); exit(1); }
            if (($acc['type'] ?? '') !== 'seller') { fwrite(STDERR, "HATA: bu hesap satici degil ({$acc['type']})\n"); exit(1); }

            /* Ilan sayimi HAM listeden: vestra_products() yalniz approved
               dondurur ve askidaki saticinin ilanlarini zaten eler, yani
               "kac ilan geri gelecek" sorusunu yapisi geregi cevaplayamaz. */
            $mine = 0; $live = 0;
            foreach (vestra_listings() as $p) {
              if ((string)($p['seller_uid'] ?? '') !== $uid) continue;
              $mine++;
              if ((string)($p['status'] ?? '') === 'approved') $live++;
            }
            $g = auth_seller_doc_grace($acc, array_fill(0, $mine, []), time());
            printf("hesap    : %s  (%s)\n", $uid, (string)($acc['company'] ?? '?'));
            printf("durum    : %s   sebep: %s\n", (string)($acc['status'] ?? '?'), (string)($acc['suspend_reason'] ?? '-'));
            printf("muaf mi  : %s\n", auth_doc_grace_exempt($acc) ? 'EVET' : 'hayir');
            printf("asama    : %s   eksik belge: %s\n", (string)$g['phase'], $g['missing'] ? implode(', ', $g['missing']) : '(yok)');
            printf("ilan     : %d kayitli, %d approved (aski kalkinca katalogda gorunur)\n", $mine, $live);
            printf("kip      : %s\n\n", $go ? "UYGULA" : "KURU KOSU (hicbir sey yazilmaz)");

            if (($acc['status'] ?? '') !== 'suspended') { echo "ZATEN ACIK -- yapilacak bir sey yok.\n"; exit(0); }
            if (!$go) { echo "Uygulamak icin move_apply=true.\n"; exit(0); }

            $wasDocs = auth_suspended_for_docs($acc);
            auth_update($uid, ['status'=>'active', 'suspend_reason'=>'']);
            if ($wasDocs) auth_seller_doc_grace_start($uid, true);

            $back = null;
            foreach (auth_accounts() as $a) if ((string)($a['id'] ?? '') === $uid) { $back = $a; break; }
            $okSt = $back && (string)($back['status'] ?? '') === 'active';
            $okRs = $back && (string)($back['suspend_reason'] ?? '') === '';
            printf("geri okuma: durum=%s  sebep=%s\n", (string)($back['status'] ?? '?'), (string)($back['suspend_reason'] ?? '(bos)') ?: '(bos)');
            if (!$okSt || !$okRs) { fwrite(STDERR, "HATA: yazma tutmadi\n"); exit(1); }
            echo "ACILDI -- {$live} approved ilan yeniden katalogda.\n";
            PHPEOF
            php -l /tmp/vestra_sactivate.php
            php /tmp/vestra_sactivate.php; RC=$?
            rm -f /tmp/vestra_sactivate.php
            exit $RC

      - name: Lead'in firma adını düzelt (panelin yeni ✎ eylemiyle aynı yazma)
        if: ${{ github.event.inputs.admin_mode == 'lead_rename' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          LR_SEL:  ${{ github.event.inputs.issue_ref }}
          LR_NAME: ${{ github.event.inputs.payload }}
          LR_GO:   ${{ github.event.inputs.move_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 3m
          envs: LR_SEL,LR_NAME,LR_GO
          script: |
            set -e
            cat > /tmp/vestra_lead_rename.php <<'PHPEOF'
            <?php
            /* Bir lead'in SADECE firma adini duzeltir. Panelin yeni 'rename_lead'
               eylemiyle AYNI yazma: id ile bul, yalniz `company` alanini yaz,
               damgalara (last_contacted_at / last_newcollection_at) ve duruma
               DOKUNMA. Ikinci bir yazici yazilmadi.

               NEDEN GEREKTI: tarayici sayfanin kendini ne diye adlandirdigini
               aliyor ve bazi sayfalar kendine "Home" diyor. factoryoutlet.gr
               kayitta "Apxikh" (Yunanca "Anasayfa") duruyor ve kampanya mektubu
               "Hello <firma>," diye aciliyor. Bugune kadarki tek iki yol vardi:
               ya oyle gonder, ya sil-yeniden ekle -- ve silmek damgalari
               dusurdugu icin ILK mektup ikinci kez giderdi. Bu kayit bu depoda
               DORT kez elle atlandi; CLAUDE.md dogru cozumun tam olarak bu
               oldugunu zaten yaziyordu.

               GIRDI: `issue_ref` lead id'si YA DA alan adi. Musterinin e-posta
               ADRESI girdiye YAZILMAZ -- kosu basligi kalici ve herkese acik
               (diag-live/leads_status'ta bir kez duzeltilen hatanin aynisi);
               alan adi dukkânin zaten acik web sitesi. Cikti da maskeli.

               TAM 1 eslesme yoksa is DURUR: sifirda yanlis bir sey yazilmaz,
               birden fazlada YANLIS dukkânin adi degisirdi. */
            $home = getenv("HOME");
            /* products.php ACIKCA yukleniyor: leads.php'nin kendi yorumu
               "Assumes the caller has already required inc/products.php (for
               vestra_read_json/vestra_write_json)" diyor. Ilk yazimda yalniz
               leads.php require edildi ve kosu `vestra_read_json()` tanimsiz
               diye 255 ile dustu -- KURAL 15'in bir vakasi daha (kardes bir
               dosyanin require'ina yaslanma). */
            require $home."/public_html/inc/products.php";
            require $home."/public_html/inc/leads.php";
            $sel  = strtolower(trim((string)getenv("LR_SEL")));
            $name = trim((string)getenv("LR_NAME"));
            $go   = strtolower(trim((string)getenv("LR_GO"))) === 'true';
            if ($sel === '')  { fwrite(STDERR, "HATA: issue_ref bos -- lead id'si ya da alan adi verin\n"); exit(1); }
            if ($name === '') { fwrite(STDERR, "HATA: payload bos -- yeni firma adi verin\n"); exit(1); }
            $name = mb_substr($name, 0, 120);

            $mask = function (string $e): string {
              $at = strpos($e, '@'); if ($at === false || $at < 1) return '***';
              return substr($e, 0, 1) . '***' . substr($e, $at);
            };

            $leads = vestra_leads();
            $hits = [];
            foreach ($leads as $i => $l) {
              $id = strtolower((string)($l['id'] ?? ''));
              $em = strtolower((string)($l['email'] ?? ''));
              $dom = ($p = strrpos($em, '@')) !== false ? substr($em, $p + 1) : '';
              /* id TAM esitlik, alan adi TAM esitlik -- alt dize degil.
                 Bu depoda gevsek eslesme mango/zara dersini bir kez verdi. */
              if ($id === $sel || ($dom !== '' && $dom === $sel)) $hits[] = $i;
            }
            if (count($hits) !== 1) {
              fwrite(STDERR, "HATA: TAM 1 eslesme gerekiyor, bulunan: " . count($hits) . "\n");
              foreach (array_slice($hits, 0, 10) as $i) {
                fwrite(STDERR, sprintf("  aday: %s | %s | %s\n",
                  (string)($leads[$i]['id'] ?? '?'),
                  (string)($leads[$i]['company'] ?? '?'),
                  $mask((string)($leads[$i]['email'] ?? ''))));
              }
              exit(1);
            }
            $i = $hits[0]; $l = $leads[$i];
            printf("lead     : %s\n", (string)($l['id'] ?? '?'));
            printf("adres    : %s\n", $mask((string)($l['email'] ?? '')));
            printf("ESKI ad  : %s\n", (string)($l['company'] ?? '(bos)'));
            printf("YENI ad  : %s\n", $name);
            printf("durum    : %s | ilk mektup: %s | ikinci mektup: %s\n",
              (string)($l['status'] ?? '?'),
              ((string)($l['last_contacted_at'] ?? '') ?: '(yok)'),
              ((string)($l['last_newcollection_at'] ?? '') ?: '(yok)'));
            printf("kip      : %s\n\n", $go ? "UYGULA" : "KURU KOSU (hicbir sey yazilmaz)");
            if ((string)($l['company'] ?? '') === $name) { echo "ZATEN BU AD -- yapilacak bir sey yok.\n"; exit(0); }
            if (!$go) { echo "Uygulamak icin move_apply=true.\n"; exit(0); }

            $stamp1 = (string)($l['last_contacted_at'] ?? '');
            $stamp2 = (string)($l['last_newcollection_at'] ?? '');
            $leads[$i]['company'] = $name;
            vestra_save_leads($leads);

            /* Geri okuma: vestra_save_leads() void donuyor, "kaydettim" demek
               olcum degil (KURAL 5c'nin billing_saved dersi). Damgalarin
               yerinde durdugu da ayrica dogrulanir -- bu yazmanin var olma
               sebebi zaten damgalari kaybetmeden ad duzeltmek. */
            $back = null;
            foreach (vestra_leads() as $l2) if ((string)($l2['id'] ?? '') === (string)($l['id'] ?? '')) { $back = $l2; break; }
            if (!$back) { fwrite(STDERR, "HATA: kayit geri okunamadi\n"); exit(1); }
            $okName = (string)($back['company'] ?? '') === $name;
            $okS1 = (string)($back['last_contacted_at'] ?? '') === $stamp1;
            $okS2 = (string)($back['last_newcollection_at'] ?? '') === $stamp2;
            printf("geri okuma: ad=%s | ilk mektup damgasi=%s | ikinci mektup damgasi=%s\n",
              (string)($back['company'] ?? '?'), $okS1 ? 'KORUNDU' : '*** DEGISTI ***', $okS2 ? 'KORUNDU' : '*** DEGISTI ***');
            if (!$okName || !$okS1 || !$okS2) { fwrite(STDERR, "HATA: yazma tutmadi\n"); exit(1); }
            echo "YAZILDI.\n";
            PHPEOF
            php -l /tmp/vestra_lead_rename.php
            # display_errors=stderr ACIKCA veriliyor: ilk canli kosu 255 ile
            # dustu ve kutukte TEK BIR SATIR yoktu -- sunucunun CLI ini'si
            # hatalari yutuyor, yani "fatal'i ciktinin tamaminda ara" bile
            # ise yaramiyordu. Sessiz bir fatal, yanlis bir teshisten pahali.
            php -d display_errors=stderr -d error_reporting=-1 /tmp/vestra_lead_rename.php; RC=$?
            rm -f /tmp/vestra_lead_rename.php
            exit $RC

      - name: Ön sipariş teslim tarihini düzelt (preorder_ship) — demo ürünler
        # amiri-core-polo gibi kodda gomulu urunlerin fiyat/MOQ/tiers duzeltmesi
        # zaten data/product_overrides.json uzerinden gidiyor (admin.php'nin
        # Prices editoru, vestra_apply_price_overrides()). `preorder_ship` o
        # katmanin bilmedigi tek alandi: set_product.php'nin $ALLOWED listesinde
        # zaten var ama o betik yalniz listings.json satirlarini eslestiriyor --
        # demo urunun orada HIC satiri yok, yani ayni yoldan yazmaya calismak
        # "0 urune uydu" ile sessizce hicbir sey degistirmeden dururdu. Ayri,
        # kucuk bir yol: ayni override katmanina, ayni yedek/geri-okuma
        # disipliniyle yazar. Canli listeler (listings.json) icin bu alan zaten
        # set-product.yml'den yazilabiliyor -- burasi yalniz demo urunler icin.
        if: ${{ github.event.inputs.admin_mode == 'preorder_ship' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          PS_ID:   ${{ github.event.inputs.issue_ref }}
          PS_DATE: ${{ github.event.inputs.payload }}
          PS_GO:   ${{ github.event.inputs.move_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 3m
          envs: PS_ID,PS_DATE,PS_GO
          script: |
            set -e
            cat > /tmp/vestra_preorder_ship.php <<'PHPEOF'
            <?php
            $home = getenv("HOME");
            require $home."/public_html/inc/products.php";

            $id   = trim((string)getenv("PS_ID"));
            $date = trim((string)getenv("PS_DATE"));
            $go   = strtolower(trim((string)getenv("PS_GO"))) === 'true';
            if ($id === '') { fwrite(STDERR, "HATA: issue_ref bos -- urun id'si verin (ör: amiri-core-polo)\n"); exit(1); }

            /* Yalniz DEMO urunler -- canli listings.json satirlari icin bu alan
               zaten set-product.yml'den yaziliyor. Yanlis yola yonlendirilmis
               bir id burada sessizce "yok" demek yerine acikca reddediliyor. */
            if (!vestra_is_demo_product($id)) {
              fwrite(STDERR, "HATA: '{$id}' bir demo urun degil -- preorder_ship'i "
                ."set-product.yml (scripts/set_product.php, listings.json satiri) uzerinden yazin.\n");
              exit(1);
            }

            /* Bos = KALDIR (issue_currency'nin ayni deseni: bos = secimi kaldir).
               Doluysa YYYY-MM-DD VE gercek bir takvim tarihi olmali -- bozuk bir
               tarih vestra_preorder_ship_phrase()'de sessizce susar, yani
               operator "15 Ekim yazdim" sanir, sayfada hicbir sey gorunmez. */
            if ($date !== '') {
              if (!preg_match('/^(\d{4})-(\d{2})-(\d{2})$/', $date, $mm) || !checkdate((int)$mm[2], (int)$mm[3], (int)$mm[1])) {
                fwrite(STDERR, "HATA: payload YYYY-MM-DD ve gecerli bir tarih olmali (ör: 2026-10-15), verilen: '{$date}'\n");
                exit(1);
              }
            }

            $ov  = vestra_product_overrides();
            $cur = (string)($ov[$id]['preorder_ship'] ?? '');
            printf("urun         : %s\n", $id);
            printf("mevcut deger : %s\n", $cur !== '' ? $cur : '(yok)');
            printf("yeni deger   : %s\n", $date !== '' ? $date : '(KALDIRILACAK)');

            /* Onizleme: sayfada GERCEKTEN ne yazacagi -- vestra_preorder_note()'un
               kendisinden, elle kurulmus bir cumle degil. */
            $preview = vestra_preorder_note(['preorder_ship' => $date]);
            printf("gorunecek not: %s\n", $preview !== '' ? $preview : '(bos -- tarih gecmis ya da alan bos, hic satir basilmaz)');

            if ($cur === $date) { echo "\nZATEN BU DEGER -- yapilacak bir sey yok.\n"; exit(0); }
            if (!$go) { echo "\nKURU KOSU -- hicbir sey yazilmadi. Uygulamak icin move_apply=true.\n"; exit(0); }

            $ovFile = vestra_data_dir().'/product_overrides.json';
            @copy($ovFile, $ovFile.'.bak-'.date('Ymd-His'));

            $e = (array)($ov[$id] ?? []);
            if ($date !== '') $e['preorder_ship'] = $date; else unset($e['preorder_ship']);
            if ($e) $ov[$id] = $e; else unset($ov[$id]);
            vestra_save_product_overrides($ov);

            /* Geri okuma: vestra_save_product_overrides() void donuyor,
               "yazdim" demek olcum degil (KURAL 5c'nin billing_saved dersi).
               Ayrica moq/tiers gibi KARDES alanlarin yerinde durdugu da
               dogrulaniyor -- bu yazmanin var olma sebebi tam olarak onlari
               ezmemek. */
            $back = vestra_product_overrides();
            $gotDate = (string)($back[$id]['preorder_ship'] ?? '');
            $okDate  = $gotDate === $date;
            /* '==' bilerek, '===' degil: json_encode 39.0 gibi tam sayili bir
               float'i JSON_PRESERVE_ZERO_FRACTION olmadan "39" yazar, yani
               diskten geri okunan deger int'e doner -- ayni fiyat, farkli PHP
               tipi. '===' bunu sahte bir "DEGISTI" olarak raporlardi (KURAL
               5c'nin billing_saved dersiyle ayni sinif: olcum aracinin kendi
               gurultusu). '==' tip zorlamasiyla ve sira farkina bakmadan
               karsilastirir, gercek bir kayip/degisimi yine yakalar. */
            $okMoq   = ($e['moq']   ?? null) == ($back[$id]['moq']   ?? null);
            $okTiers = ($e['tiers'] ?? null) == ($back[$id]['tiers'] ?? null);
            printf("\ngeri okuma   : preorder_ship=%s | moq/tiers=%s\n",
              $okDate ? 'YAZILDI' : '*** TUTMADI ***', ($okMoq && $okTiers) ? 'KORUNDU' : '*** DEGISTI ***');
            if (!$okDate || !$okMoq || !$okTiers) { fwrite(STDERR, "HATA: yazma tutmadi\n"); exit(1); }
            echo "YAZILDI.\n";
            PHPEOF
            php -l /tmp/vestra_preorder_ship.php
            php -d display_errors=stderr -d error_reporting=-1 /tmp/vestra_preorder_ship.php; RC=$?
            rm -f /tmp/vestra_preorder_ship.php
            exit $RC

      - name: Mesaj / engellenen kayıt sil
        if: ${{ github.event.inputs.admin_mode == 'msg_del' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          MD_SEL: ${{ github.event.inputs.move_threads }}
          MD_GO:  ${{ github.event.inputs.move_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 3m
          envs: MD_SEL,MD_GO
          script: |
            set -e
            cat > /tmp/vestra_msgdel.php <<'PHPEOF'
            <?php
            /* Panelin 🗑 dugmesiyle AYNI fonksiyonlari cagirir (KURAL 23) --
               ikinci bir silme yolu yazmak, iki yolun ayrisip birinin yedek
               almamasi demekti (KURAL 5f'nin iki kesim yolu dersi).

               ICERIK BASILMAZ. Engellenen metin tam da e-posta/telefon/IBAN
               tasidigi icin engellenmis; Actions gunlugu herkese acik. Satiri
               tanimaya tarih + tur + taraflar yetiyor, metnin kendisi degil. */
            $home = getenv("HOME");
            require $home."/public_html/inc/products.php";
            require $home."/public_html/inc/messages.php";
            $sel = trim((string)getenv("MD_SEL"));
            $go  = strtolower(trim((string)getenv("MD_GO"))) === 'true';
            if ($sel === '') { fwrite(STDERR, "HATA: move_threads bos -- 'blocked:<tarih>' ya da 'msg:<thread>:<tarih>'\n"); exit(1); }
            echo "kip: ".($go ? "UYGULA (siler)" : "KURU KOSU (silmez)")."\n\n";
            $done = 0; $miss = 0;
            foreach (array_filter(array_map('trim', explode(',', $sel))) as $one) {
              if (str_starts_with($one, 'blocked:')) {
                $pref = substr($one, 8);
                $hits = [];
                foreach (vestra_msg_blocked_log() as $e) {
                  if (is_array($e) && str_starts_with((string)($e['at'] ?? ''), $pref)) $hits[] = $e;
                }
                if (!$hits) { echo "  YOK: blocked {$pref}\n"; $miss++; continue; }
                foreach ($hits as $e) {
                  $k = vestra_msg_blocked_key($e);
                  echo "  ".substr((string)$e['at'],0,16)." | ".strtoupper((string)($e['flag']??''))
                     . " | ".substr((string)($e['buyer_uid']??''),0,6)."..↔".substr((string)($e['seller_uid']??''),0,6).".."
                     . " | metin ".mb_strlen((string)($e['text']??''))." karakter | anahtar {$k}";
                  if (!$go) { echo "  (kuru kosu)\n"; continue; }
                  $r = vestra_msg_blocked_delete($k);
                  echo !empty($r['ok']) ? "  -> SILINDI (yedek alindi)\n" : "  -> OLMADI: ".($r['error']??'?')."\n";
                  if (!empty($r['ok'])) $done++;
                }
              } elseif (str_starts_with($one, 'msg:')) {
                [$_, $tid, $pref] = array_pad(explode(':', $one, 3), 3, '');
                $found = false;
                foreach (vestra_msg_threads() as $t) {
                  if (($t['id'] ?? '') !== $tid) continue;
                  foreach ((array)($t['messages'] ?? []) as $m) {
                    if (!is_array($m) || !str_starts_with((string)($m['at'] ?? ''), $pref)) continue;
                    $found = true; $k = vestra_msg_key($m);
                    echo "  ".substr((string)$m['at'],0,16)." | thread ".substr($tid,0,10)
                       . ".. | metin ".mb_strlen((string)($m['text']??''))." karakter | anahtar {$k}";
                    if (!$go) { echo "  (kuru kosu)\n"; continue; }
                    $r = vestra_msg_delete($tid, $k);
                    echo !empty($r['ok']) ? "  -> SILINDI".(!empty($r['thread_gone'])?" (konusma da kapandi)":"")."\n"
                                          : "  -> OLMADI: ".($r['error']??'?')."\n";
                    if (!empty($r['ok'])) $done++;
                  }
                }
                if (!$found) { echo "  YOK: {$one}\n"; $miss++; }
              } else { echo "  ATLANDI (bicim): {$one}\n"; $miss++; }
            }
            echo "\nsilinen: {$done} | bulunamayan secici: {$miss}\n";
            echo "kalan engellenen kayit: ".count(vestra_msg_blocked_log())."\n";
            if (!$go) echo "KURU KOSU -- hicbir sey silinmedi. move_apply=true ile uygulayin.\n";
            PHPEOF
            php -l /tmp/vestra_msgdel.php
            php /tmp/vestra_msgdel.php; RC=$?
            rm -f /tmp/vestra_msgdel.php
            exit $RC

      - name: Konuşmanın satıcısını taşı
        if: ${{ github.event.inputs.admin_mode == 'thread_seller' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          MV_TO: ${{ github.event.inputs.move_to }}
          MV_TH: ${{ github.event.inputs.move_threads }}
          MV_GO: ${{ github.event.inputs.move_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 3m
          envs: MV_TO,MV_TH,MV_GO
          script: |
            set -e
            cat > /tmp/vestra_mvseller.php <<'PHPEOF'
            <?php
            /* Bir konusmayi baska bir saticiya tasi.
             *
             * TEK ONEMLI TUZAK: thread'in id'si SATICIDAN TUREEN bir ozet --
             * vestra_msg_thread_id() = md5(alici|satici|ilan). Yalnizca 'seller_uid'
             * alanini degistirip id'yi oldugu gibi birakmak sessiz bir bozulma olur:
             * kayit yeni saticinin panelinde gorunur ama bir sonraki mesajda
             * vestra_msg_send() yeni id'yi hesaplar, o id'yi bulamaz ve AYNI taraflar
             * icin IKINCI bir thread acar -- konusma ikiye boluner. Bu yuzden id de
             * yeniden hesaplaniyor.
             *
             * Yazma yollari sunucudaki tek kaynaktan gecer (vestra_msg_threads /
             * vestra_msg_save_threads); dosya bicimini burada elle kurmuyoruz. */
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require_once $doc."/inc/auth.php";
            require_once $doc."/inc/products.php";
            require_once $doc."/inc/messages.php";

            $to   = trim((string)getenv('MV_TO'));
            $sel  = trim((string)getenv('MV_TH'));
            $go   = strtolower(trim((string)getenv('MV_GO'))) === 'true';
            if ($to === '' || $sel === '') { fwrite(STDERR, "move_to ve move_threads zorunlu\n"); exit(1); }

            /* Hedef hesap: once tam uid, sonra firma/ad icinde parca. Birden fazla
               hesap eslesirse DUR -- yanlis satici, yanlis panele dusen bir konusma
               ve (ilan da tasinirsa) yanlis tuzel kisiden fatura demek. */
            $accs = auth_accounts();
            $hit = [];
            foreach ($accs as $a) {
              if (($a['id'] ?? '') === $to) { $hit = [$a]; break; }
              $hay = strtolower(($a['company'] ?? '').' '.($a['name'] ?? ''));
              if (stripos($hay, strtolower($to)) !== false) $hit[] = $a;
            }
            if (count($hit) !== 1) {
              fwrite(STDERR, "hedef satici tek degil ('{$to}' -> ".count($hit)." hesap)\n");
              foreach ($hit as $a) fwrite(STDERR, "   ".($a['id']??'?')." | ".($a['company']??'')." | ".($a['name']??'')."\n");
              exit(1);
            }
            $newUid  = (string)$hit[0]['id'];
            $newName = trim(($hit[0]['company'] ?? '') ?: ($hit[0]['name'] ?? ''));
            echo "hedef satici: {$newName}  (uid {$newUid})\n\n";

            $threads = vestra_msg_threads();
            $byId = [];
            foreach ($threads as $i => $t) $byId[(string)($t['id'] ?? '')] = $i;

            /* Secim: id listesi ya da 'ilan:<listing_id>' (o ilanin TUM konusmalari).
               Ilan biciminin sebebi: bir ilan el degistirdiginde geride kalan tek bir
               konusma, artik satmadigi bir urun hakkinda eski saticiya mektup
               gondermeye devam eder. */
            $want = [];
            foreach (preg_split('/[,\s]+/', $sel) as $tok) {
              $tok = trim($tok); if ($tok === '') continue;
              if (stripos($tok, 'ilan:') === 0) {
                $lid = substr($tok, 5);
                foreach ($threads as $t) if ((string)($t['listing_id'] ?? '') === $lid) $want[] = (string)($t['id'] ?? '');
              } else $want[] = $tok;
            }
            $want = array_values(array_unique(array_filter($want)));
            if (!$want) { fwrite(STDERR, "secilen thread yok\n"); exit(1); }

            $nameOf = function (string $uid) use ($accs): string {
              foreach ($accs as $a) if (($a['id'] ?? '') === $uid) return trim(($a['company'] ?? '') ?: ($a['name'] ?? '')) ?: $uid;
              return $uid;
            };
            $plan = []; $stop = 0;
            foreach ($want as $tid) {
              if (!isset($byId[$tid])) { echo "  ATLANDI {$tid}: thread yok\n"; $stop++; continue; }
              $t = $threads[$byId[$tid]];
              $old = (string)($t['seller_uid'] ?? '');
              $buy = (string)($t['buyer_uid'] ?? '');
              $lid = (string)($t['listing_id'] ?? '');
              $msgs = (array)($t['messages'] ?? []);
              echo "  {$tid} | ilan={$lid} | alici=".$nameOf($buy)." | satici=".$nameOf($old)." | mesaj=".count($msgs)."\n";
              if ($old === $newUid) { echo "      zaten bu saticida — atlandi\n"; continue; }

              /* ESKI SATICI BU KONUSMADA YAZDIYSA TASIMA. Mesajlar 'from' ile
                 imzali; thread'i baska bir firmaya vermek, o cumleleri de ona
                 yazdirmak olur. Kim ne yazdiysa o yazmis kalir. */
              $wrote = 0;
              foreach ($msgs as $m) if ((string)($m['from'] ?? '') === $old) $wrote++;
              if ($wrote > 0) {
                echo "      DURDU: eski satici bu konusmada {$wrote} mesaj YAZMIS.\n";
                echo "      Tasimak o sozleri baska firmaya mal etmek olurdu — operator karari gerekiyor.\n";
                $stop++; continue;
              }

              $newId = vestra_msg_thread_id($buy, $newUid, $lid);
              if (isset($byId[$newId]) && $newId !== $tid) {
                echo "      DURDU: bu alici+yeni satici+ilan icin ZATEN thread var ({$newId}).\n";
                echo "      Iki gecmisi birlestirmek yeniden adlandirma degil, ayri bir karar.\n";
                $stop++; continue;
              }
              echo "      -> satici ".$nameOf($old)." => {$newName} | id {$tid} => {$newId}\n";
              $plan[] = ['i'=>$byId[$tid], 'old'=>$old, 'newId'=>$newId];
            }

            if ($stop > 0) { fwrite(STDERR, "\n{$stop} thread durdu — hicbir sey yazilmadi (hepsi ya da hicbiri).\n"); exit(1); }
            if (!$plan)    { echo "\ndegisecek thread yok.\n"; exit(0); }
            if (!$go)      { echo "\nKURU KOSU — hicbir sey kaydedilmedi. Uygulamak icin move_apply=true.\n"; exit(0); }

            $bak = $doc.'/data/messages.json.bak-'.date('Ymd-His');
            @copy($doc.'/data/messages.json', $bak);
            echo "\nyedek: {$bak}\n";
            foreach ($plan as $p) {
              $i = $p['i'];
              $threads[$i]['seller_uid'] = $newUid;
              $threads[$i]['id']         = $p['newId'];
              /* Okuma imleci ve zil damgasi UID BASINA tutuluyor. Eskisininkini yeni
                 saticiya devretmek, hic okumadigi mesajlari okunmus gostermek olurdu;
                 birakmak da olmayan bir hesabi kayitta tutar. Silinir: TYREX gercekten
                 okumadi, okunmamis gorsun. */
              foreach (['read','ping'] as $k) if (isset($threads[$i][$k][$p['old']])) unset($threads[$i][$k][$p['old']]);
            }
            vestra_msg_save_threads($threads);

            /* GERI OKU: yazma sessizce basarisiz olabilir (izin, disk) ve
               "kaydedildi" yazan bir satir tek basina kanit degil. */
            $after = vestra_msg_threads(); $ok = 0;
            foreach ($plan as $p) {
              foreach ($after as $t) {
                if ((string)($t['id'] ?? '') === $p['newId'] && (string)($t['seller_uid'] ?? '') === $newUid) { $ok++; break; }
              }
            }
            printf("KAYDEDILDI — %d/%d thread yeni saticida ve yeni id ile geri okundu.\n", $ok, count($plan));
            exit($ok === count($plan) ? 0 : 1);
            PHPEOF
            php -l /tmp/vestra_mvseller.php
            php /tmp/vestra_mvseller.php; RC=$?
            rm -f /tmp/vestra_mvseller.php
            exit $RC

      - name: Siparişe taşıyıcı / servis / takip numarası yaz (ship)
        if: ${{ github.event.inputs.admin_mode == 'ship' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          SH_REF:  ${{ github.event.inputs.issue_ref }}
          SH_SPEC: ${{ github.event.inputs.ship_spec }}
          SH_GO:   ${{ github.event.inputs.offer_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: SH_REF,SH_SPEC,SH_GO
          script: |
            set -e
            cat > /tmp/vestra_shipment.php <<'PHPEOF'
            <?php
            /* Siparise tasiyici + servis + takip numarasi yazar; istenirse durumu
             * 'shipped' yapar ve ALICIYA mektup gonderir.
             *
             * Panelde bu kutular var; bu yol panel disindan ayni kaydi yazmak icin
             * (KURAL 5b/5i'deki admin_mode desenlerinin aynisi). Yazma TEK
             * fonksiyondan: vestra_order_set_shipment() -- ikinci bir yazici,
             * panelle er gec ayrisir.
             *
             * MEKTUP: gonderim yolu vestra_tpl_order_shipped() ile ayni sablonu
             * kullanir (admin.php ve seller.php de oyle). Kuru kosu VARSAYILAN
             * (KURAL 18): mektup musteriye gidiyor. */
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require_once $doc."/inc/products.php";
            require_once $doc."/inc/auth.php";
            require_once $doc."/inc/orders.php";
            require_once $doc."/inc/email_templates.php";
            require_once $doc."/inc/notify.php";

            $ref  = trim((string)getenv('SH_REF'));
            $spec = (string)getenv('SH_SPEC');
            $go   = strtolower(trim((string)getenv('SH_GO'))) === 'true';
            if ($ref === '') { fwrite(STDERR, "issue_ref bos -- siparis referansi gerekli\n"); exit(1); }

            $F = [];
            foreach (explode('|', $spec) as $part) {
              $part = trim($part); if ($part === '') continue;
              $kv = explode('=', $part, 2);
              if (count($kv) === 2) $F[strtolower(trim($kv[0]))] = trim($kv[1]);
            }
            $E = fn(string $k) => (string)($F[$k] ?? '');

            /* Siparis GERCEKTEN var mi. orders.csv'de olmayan bir ref'e durum
               yazmak, hicbir yerde gorunmeyen bir kayit birakir. */
            $oRow = null;
            foreach (vestra_read_csv('orders.csv') as $r) if ((string)($r['ref'] ?? '') === $ref) { $oRow = $r; break; }
            if (!$oRow) { fwrite(STDERR, "siparis bulunamadi: {$ref}\n"); exit(1); }

            $mask = fn(string $e) => $e === '' ? '' : preg_replace('/^(.).*(@.*)$/', '$1***$2', $e);
            $all  = vestra_read_json('order_statuses.json');
            $cur  = (array)($all[$ref] ?? []);
            $prevStatus = (string)($cur['status'] ?? 'pending');
            $before = vestra_order_shipment($cur);

            echo "== GONDERIM BILGISI ==\n";
            echo "siparis   : {$ref} | ".(string)($oRow['company'] ?? '')." | ".$mask((string)($oRow['email'] ?? ''))."\n";
            echo "durum     : {$prevStatus}\n";
            echo "onceki    : tasiyici=".($before['carrier_name'] ?: '-')." servis=".($before['service'] ?: '-')
               . " takip=".($before['tracking'] ?: '-')."\n";

            /* Yazilmayan alan KORUNUR: null gecince vestra_order_set_shipment
               dokunmuyor. Bos dizge ise SILER -- ikisi ayri niyet. */
            $trk = array_key_exists('tracking', $F) ? $E('tracking') : null;
            $car = array_key_exists('carrier',  $F) ? $E('carrier')  : null;
            $svc = array_key_exists('service',  $F) ? $E('service')  : null;
            $wantStatus = strtolower($E('status'));
            if ($wantStatus !== '' && !in_array($wantStatus, vestra_order_settable_statuses(), true)) {
              fwrite(STDERR, "gecersiz durum: {$wantStatus} (gecerli: ".implode(', ', vestra_order_settable_statuses()).")\n"); exit(1);
            }

            /* ONIZLEME: yazmadan once cozulen tasiyici ve BAGLANTIYI goster.
               "Numarayi yazdim" demek yetmez -- alicinin tiklayacagi sey bu. */
            $preview = vestra_order_shipment(array_merge($cur, array_filter([
              'tracking'     => $trk,
              'ship_carrier' => $car,
              'ship_service' => $svc,
            ], fn($v) => $v !== null)));
            echo "yeni      : tasiyici=".($preview['carrier_name'] ?: '-')." servis=".($preview['service'] ?: '-')
               . " takip=".($preview['tracking'] ?: '-')."\n";
            echo "baglanti  : ".($preview['url'] !== '' ? $preview['url'] : '*** YOK -- tasiyici cozulmedi, alici duz metin gorur ***')."\n";
            echo "durum     : ".($wantStatus !== '' ? "{$prevStatus} -> {$wantStatus}" : "degismiyor")."\n";

            $buyerAcc = auth_find((string)($oRow['email'] ?? ''));
            $willMail = $wantStatus === 'shipped'
                     && ($prevStatus !== 'shipped' || ($preview['tracking'] !== '' && $preview['tracking'] !== $before['tracking']));
            echo "mektup    : ".($willMail ? 'GIDECEK (aliciya)' : 'gitmeyecek')."\n";
            if ($willMail) {
              [$mS, $mB] = vestra_tpl_order_shipped((string)($oRow['name'] ?: ($oRow['company'] ?: 'there')),
                              $ref, $preview['tracking'], (bool)$buyerAcc, $preview);
              echo "--- mektup onizlemesi ---\nKonu: {$mS}\n{$mB}\n--- son ---\n";
            }

            if (!$go) { echo "\noffer_apply=false — HICBIR SEY YAZILMADI, HICBIR MEKTUP GITMEDI.\n"; exit(0); }

            $res = vestra_order_set_shipment($ref, $trk, $car, $svc);
            if (empty($res['ok'])) { fwrite(STDERR, "YAZILAMADI: ".((string)($res['error'] ?? '?'))."\n"); exit(1); }
            $after = $res['shipment'];
            echo "\nKAYDEDILDI (geri okundu): tasiyici=".($after['carrier_name'] ?: '-')
               . " servis=".($after['service'] ?: '-')." takip=".($after['tracking'] ?: '-')."\n";
            echo "baglanti  : ".($after['url'] !== '' ? $after['url'] : 'YOK')."\n";

            if ($wantStatus !== '') {
              $all2 = vestra_read_json('order_statuses.json');
              $all2[$ref] = array_merge((array)($all2[$ref] ?? []), ['status' => $wantStatus, 'updated_at' => date('c')]);
              if ($wantStatus === 'shipped' && empty($all2[$ref]['shipped_at'])) $all2[$ref]['shipped_at'] = date('c');
              $all2[$ref]['history'][] = vestra_order_history_entry($wantStatus, 'admin',
                  $after['tracking'] !== '' ? trim(($after['carrier_name'] !== '' ? $after['carrier_name'].' ' : '').$after['tracking']) : '');
              vestra_write_json('order_statuses.json', $all2);
              $back = vestra_read_json('order_statuses.json');
              $now  = (string)($back[$ref]['status'] ?? '');
              if ($now !== $wantStatus) { fwrite(STDERR, "GERI OKUMA: durum '{$now}', beklenen '{$wantStatus}'\n"); exit(1); }
              echo "durum     : {$now} (geri okundu)\n";
            }

            if ($willMail && !empty($oRow['email'])) {
              [$mS, $mB, $mO] = vestra_tpl_order_shipped((string)($oRow['name'] ?: ($oRow['company'] ?: 'there')),
                                  $ref, $after['tracking'], (bool)$buyerAcc, $after);
              $sent = vestra_send_mail((string)$oRow['email'], $mS, $mB, '', '', null, '', $mO);
              echo "mektup    : ".($sent ? 'GONDERILDI' : '*** SAGLAYICI REDDETTI ***')."\n";
              if ($buyerAcc) {
                require_once $doc."/inc/push.php";
                vestra_push_send((string)$buyerAcc['id'], 'VESTRA — order shipped 🚚',
                  'Order '.$ref.($after['tracking'] !== '' ? ' · '.trim($after['carrier_name'].' '.$after['tracking']) : '').' is on its way.',
                  '/buyer?tab=orders');
              }
              if (!$sent) exit(1);
            }
            PHPEOF
            php -l /tmp/vestra_shipment.php
            php /tmp/vestra_shipment.php; RC=$?
            rm -f /tmp/vestra_shipment.php
            exit $RC

      - name: Silinmiş teklifi yedekten geri yükle (+ karşı teklif)
        if: ${{ github.event.inputs.admin_mode == 'offer_restore' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          OR_REF:   ${{ github.event.inputs.issue_ref }}
          OR_PRICE: ${{ github.event.inputs.offer_price }}
          OR_GO:    ${{ github.event.inputs.offer_apply }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: OR_REF,OR_PRICE,OR_GO
          script: |
            set -e
            cat > /tmp/vestra_offrestore.php <<'PHPEOF'
            <?php
            /* Panelden SILINMIS bir teklifi kendi yedeginden geri yukler ve
             * istenirse karsi teklifi isler.
             *
             * NEDEN VAR: Admin > Offers > Sil, teklifi offers.csv'den ve
             * offer_responses.json'dan cikarir (KURAL 5g) -- ama SILMEDEN ONCE
             * offers.csv'yi 'offers.csv.bak-del-<zaman>' olarak kopyalar. Yanlislikla
             * silinen bir teklifin satiri o yedekte DURUYOR. Geri donusun tek dogru
             * yolu odur: satiri elle yeniden yazmak, alicinin hic vermedigi bir
             * rakami/zaman damgasini uydurmak olurdu (KURAL 3'un teklif hali).
             * Yedek yoksa is DURUR -- "muhtemelen boyleydi" diye bir kayit yazilmaz.
             *
             * KARSI TEKLIF ayni fonksiyondan geciyor: vestra_offer_respond($ref,
             * 'counter', $price, null, 'VESTRA') -- admin.php:1196'nin BIREBIR aynisi.
             * Ikinci bir kesim/pazarlik yolu yazilmadi: KURAL 4'un tur sayaci, fiyat
             * tavani, token uretimi ve mektubu tek yerde kalmali.
             *
             * KURU KOSU VARSAYILAN (KURAL 18): mektup musteriye gidiyor, o yuzden
             * offer_apply=true denmedikce hicbir sey yazilmaz ve hicbir sey gonderilmez. */
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require_once $doc."/inc/products.php";
            require_once $doc."/inc/auth.php";
            require_once $doc."/inc/offers.php";
            /* invoice.php AYRICA: offers.php onu yalnizca fonksiyon GOVDESINDE
               require ediyor, yani cagrilmadikca yuklenmiyor ve
               function_exists('vestra_invoices_for_ref') FALSE donuyordu --
               teshis KESILMIS bir faturaya "KESILMEDI" diyordu (CLAUDE.md). */
            require_once $doc."/inc/invoice.php";

            $ref   = trim((string)getenv('OR_REF'));
            $pIn   = trim((string)getenv('OR_PRICE'));
            $go    = strtolower(trim((string)getenv('OR_GO'))) === 'true';
            if ($ref === '') { fwrite(STDERR, "issue_ref bos -- geri yuklenecek teklif referansi gerekli\n"); exit(1); }

            /* Gunluk herkese acik. Is bilgisi (ref, urun, adet, fiyat, firma) acik
               kalir -- aramanin amaci o; kisiye ait olan maskeli (diag-live'in
               2 Eyl 2026 dersi: bir satiri "oldugu gibi bas" yapan adim, alicinin
               adresini herkese acik gunluge yazdi). */
            $maskMail = fn(string $e) => $e === '' ? '' : preg_replace('/^(.).*(@.*)$/', '$1***$2', $e);
            $show = function (string $k, string $v) use ($maskMail): string {
              $k = strtolower($k);
              if ($v === '') return '';
              if ($k === 'email' || str_ends_with($k, '_email')) return $maskMail($v);
              if (in_array($k, ['name','contact','phone','address'], true)) return mb_substr($v,0,1).'*** ('.mb_strlen($v).' karakter)';
              if (in_array($k, ['message','note','notes'], true)) return '[maskeli, '.mb_strlen($v).' karakter]';
              return mb_substr($v, 0, 120);
            };

            echo "== TEKLIF GERI YUKLEME ==\n";
            echo "ref            : {$ref}\n";

            $live = vestra_offer_row($ref);
            $row  = $live;
            $needRestore = ($live === null);
            echo "offers.csv     : ".($live ? "ref ZATEN VAR (geri yukleme gerekmiyor)" : "ref YOK -- silinmis")."\n";

            $bakName = ''; $bakRows = 0;
            if ($needRestore) {
              /* Yedekler zaman damgali (bak-del-Ymd_His), yani ADIN tersten
                 siralanmasi = en yeniden en eskiye. En yeni yedek, en son silmenin
                 ONCESINI tutar: aranan satir orada olmali. */
              $dir  = vestra_data_dir();
              $baks = glob($dir.'/offers.csv.bak-del-*') ?: [];
              rsort($baks, SORT_STRING);
              echo "yedek dosya    : ".count($baks)." adet\n";
              foreach ($baks as $b) {
                $base = basename($b);
                $rows = vestra_read_csv($base);          /* not: bu okuyucu satirlari TERS cevirir */
                foreach ($rows as $r) {
                  if ((string)($r['ref'] ?? '') !== $ref) continue;
                  $row = $r; $bakName = $base; $bakRows = count($rows); break 2;
                }
              }
              if (!$row) {
                fwrite(STDERR, "\nHICBIR YEDEKTE YOK: {$ref}\n");
                foreach ($baks as $b) fwrite(STDERR, "   ".basename($b)."  ".count(vestra_read_csv(basename($b)))." satir\n");
                fwrite(STDERR, "Kayit uydurulmaz -- alicinin verdigi rakam ve zaman damgasi ancak kendi kaydindan gelir.\n");
                exit(1);
              }
              echo "bulundugu yedek: {$bakName}  ({$bakRows} satir)\n";
            }

            echo "satir          :\n";
            foreach ($row as $k => $v) {
              $sv = $show((string)$k, trim((string)$v));
              if ($sv !== '') printf("   %-12s %s\n", $k, $sv);
            }

            $qty  = (int)($row['qty'] ?? 0);
            $unit = (float)($row['offer_unit'] ?? 0);
            $lst  = vestra_listing_by_sku((string)($row['sku'] ?? ''));
            $refP = vestra_offer_ref_price($lst);
            echo "ilan           : ".($lst ? ((string)($lst['id'] ?? '?')." | ".trim(((string)($lst['brand'] ?? '')).' '.((string)($lst['name'] ?? '')))
                                             ." | MOQ ".(int)($lst['moq'] ?? 0)) : "SKU KATALOGDA COZULMEDI")."\n";
            echo "referans fiyat : ".($refP > 0 ? "EUR ".number_format($refP,2)."/adet (karsi teklif tavani)" : "cozulemedi -- tavan uygulanmaz")."\n";

            /* Yanit kaydi: silme onu da temizliyor. Kalmis bir kayit, silmenin
               yarim kaldigini gosterir ve karsi teklif SIRASI'ni bozar. */
            $rs = vestra_read_json('offer_responses.json');
            echo "yanit kaydi    : ".(isset($rs[$ref]) ? "VAR (durum ".((string)($rs[$ref]['status'] ?? '?'))
                                       .", sira ".vestra_offer_turn($rs[$ref]).")" : "yok")."\n";
            $invs = vestra_invoices_for_ref($ref);
            echo "fatura         : ".($invs ? "KESILMIS: ".implode(', ', array_map(fn($i)=>(string)($i['no'] ?? '?'), $invs)) : "yok")."\n";
            if ($invs) { fwrite(STDERR, "faturasi kesilmis bir teklif geri yuklenmez -- once fatura yolu (KURAL 5f)\n"); exit(1); }

            $price = 0.0; $wantCounter = false;
            if ($pIn !== '') {
              $price = (float)str_replace(',', '.', $pIn);
              $wantCounter = true;
              $pErr = vestra_offer_price_error($lst, 'seller', $price, null);
              echo "karsi teklif   : EUR ".number_format($price,2)."/adet x {$qty} = EUR ".number_format($price*$qty,2)
                 . "   (alicinin teklifi: EUR ".number_format($unit,2)."/adet = EUR ".number_format($unit*$qty,2).")\n";
              echo "KURAL 4        : ".($pErr === null ? "GECERLI" : "RED -- ".$pErr)."\n";
              if ($pErr !== null) exit(1);
            } else {
              echo "karsi teklif   : ISTENMEDI (offer_price bos) -- yalnizca kayit geri yuklenir, MUSTERIYE HICBIR SEY GITMEZ\n";
            }

            $buyerAcc = auth_find((string)($row['email'] ?? ''));
            echo "alici hesabi   : ".($buyerAcc ? ((string)($buyerAcc['company'] ?? $buyerAcc['name'] ?? '?')
                                       ." | mektup dili: ".vestra_user_lang($buyerAcc)) : "hesap yok -- mektup Ingilizce gider")."\n";

            if (!$go) {
              echo "\noffer_apply=false — HICBIR SEY YAZILMADI, HICBIR MEKTUP GITMEDI.\n";
              exit(0);
            }

            /* --- YAZMA --- */
            if ($needRestore) {
              $f = vestra_data_dir().'/offers.csv';
              if (!is_file($f)) { fwrite(STDERR, "offers.csv yok\n"); exit(1); }
              if (!@copy($f, $f.'.bak-restore-'.date('Ymd_His'))) { fwrite(STDERR, "yedek alinamadi -- yazilmadi\n"); exit(1); }
              /* Basliktan okunan SIRA ile yazilir, satirin kendi sirasiyla degil:
                 yedek eski bir semadan geliyorsa sutunlar kayardi. Eksik sutun bos
                 kalir, fazlasi atilir. */
              $fh = @fopen($f, 'r'); $head = $fh ? fgetcsv($fh, null, ',', '"', '\\') : null;
              if ($fh) fclose($fh);
              if (!$head) { fwrite(STDERR, "offers.csv basligi okunamadi\n"); exit(1); }
              $out = [];
              foreach ($head as $h) $out[] = (string)($row[$h] ?? '');
              /* EKLEME: mevcut satirlarin tek baytina dokunmaz. Dosyayi yeniden
                 yazmak, okuyucunun ters cevirmesi yuzunden butun listenin sirasini
                 degistirirdi -- geri yukleme, gorunmeyen bir yan etki tasimamali. */
              $ap = @fopen($f, 'a');
              if (!$ap) { fwrite(STDERR, "offers.csv yazilamadi\n"); exit(1); }
              fputcsv($ap, $out, ',', '"', '\\'); fclose($ap);

              /* GERI OKU: "yazildi" diyen bir satir tek basina kanit degil. */
              $back = vestra_offer_row($ref);
              if (!$back) { fwrite(STDERR, "GERI OKUMA BASARISIZ -- satir offers.csv'de gorunmuyor\n"); exit(1); }
              if ((int)($back['qty'] ?? 0) !== $qty || abs((float)($back['offer_unit'] ?? 0) - $unit) > 0.004) {
                fwrite(STDERR, "GERI OKUMA UYUSMUYOR: qty ".(int)($back['qty'] ?? 0)." unit ".(float)($back['offer_unit'] ?? 0)."\n"); exit(1);
              }
              echo "\nGERI YUKLENDI — {$ref} offers.csv'de, {$qty} x EUR ".number_format((float)$back['offer_unit'],2)." geri okundu.\n";
            }

            if (!$wantCounter) { echo "karsi teklif verilmedi (offer_price bos).\n"; exit(0); }

            /* Panelin cagirdigi fonksiyonun AYNISI (admin.php:1196):
               aktor null, gonderen etiketi 'VESTRA'. */
            $res = vestra_offer_respond($ref, 'counter', $price, null, 'VESTRA');
            if (empty($res['ok'])) { fwrite(STDERR, "KARSI TEKLIF ISLENEMEDI: ".((string)($res['error'] ?? '?'))."\n"); exit(1); }
            echo "karsi teklif islendi. mektup: ".($res['mailed'] === null ? 'GONDERILMEDI (adres yok/kapali)'
                                                   : ($res['mailed'] ? 'GONDERILDI' : '*** SAGLAYICI REDDETTI ***'))."\n";

            $rs2 = vestra_read_json('offer_responses.json');
            $now = $rs2[$ref] ?? null;
            if (!$now) { fwrite(STDERR, "GERI OKUMA: yanit kaydi yazilmamis\n"); exit(1); }
            printf("geri okundu    : durum=%s  karsi=%s  sira=%s  kalan tur=%d  token=%s\n",
              (string)($now['status'] ?? '?'), number_format((float)($now['counter_price'] ?? 0), 2),
              vestra_offer_turn($now), vestra_offer_counters_left($now),
              empty($now['accept_token']) ? 'YOK -- kabul dugmesi calismaz!' : 'uretildi');
            exit(($res['mailed'] === false) ? 1 : 0);
            PHPEOF
            php -l /tmp/vestra_offrestore.php
            php /tmp/vestra_offrestore.php; RC=$?
            rm -f /tmp/vestra_offrestore.php
            exit $RC

      - name: Listele
        if: ${{ github.event.inputs.admin_mode == '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          script: |
            export Q='${{ github.event.inputs.query }}'
            export BRAND='${{ github.event.inputs.brand }}'
            cat > /tmp/seller_products.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            register_shutdown_function(function(){
              $e = error_get_last();
              if ($e && in_array($e['type'],[E_ERROR,E_PARSE,E_CORE_ERROR,E_COMPILE_ERROR],true))
                fwrite(STDERR, "PHP OLUMCUL: {$e['message']} ({$e['file']}:{$e['line']})\n");
            });
            $home = getenv("HOME");
            $doc  = $home."/public_html";
            require $doc."/inc/auth.php";
            require $doc."/inc/products.php";

            $products = vestra_products();
            $accounts = auth_accounts();
            $byId = [];
            foreach ($accounts as $a) $byId[(string)($a['id']??'')] = $a;

            $brand = trim((string)getenv("BRAND"));
            if ($brand !== '') {
              echo "===== MARKA: '{$brand}' (hangi saticiya ait olursa olsun) =====\n";
              $hits = array_values(array_filter($products, fn($p) => stripos((string)($p['brand']??''), $brand) !== false));
              if (!$hits) { echo "  *** bu markada urun yok ***\n"; exit(0); }
              foreach ($hits as $p) {
                $su = (string)($p['seller_uid'] ?? '');
                $sLabel = $su === '' ? '(satici yok -- demo/platform)' : (($byId[$su]['company'] ?? $byId[$su]['name'] ?? '?')." (id={$su})");
                if ($su !== '' && !isset($byId[$su])) $sLabel = "*** HESAP BULUNAMADI (id={$su}) ***";
                /* FIYAT da yaziliyor: marka kipi bunu basmiyordu ve "bu markanin
                   fiyatlarini su tabana cek" gibi bir is her seferinde once
                   ayri bir okuma gerektiriyordu. Kademe merdiveni de basiliyor
                   -- vitrindeki rakam en dusuk kademe (vestra_from_price), yani
                   yalniz 'list' okuyan bir gozlem yaniltir. */
                $tiers = [];
                foreach ((array)($p['tiers'] ?? []) as $tr) {
                  $tiers[] = (int)($tr['min'] ?? 0).'@'.number_format((float)($tr['price'] ?? 0), 2, '.', '');
                }
                echo "  ".($p['id']??'?')." | ".($p['name']??'?')." | cat=".($p['cat']??'?')
                   ." | mode=".($p['mode'] ?? 'sale')
                   ." | list=".(isset($p['list']) ? number_format((float)$p['list'], 2, '.', '') : '-')
                   ." | price=".(isset($p['price']) ? number_format((float)$p['price'], 2, '.', '') : '-')
                   ." | from=".number_format((float)vestra_from_price($p), 2, '.', '')
                   ." | moq=".($p['moq'] ?? '-')
                   ." | paket=".(isset($p['size_step']) ? (int)$p['size_step'].'li' : '-')
                   ." | beden=".(trim((string)($p['sizes'] ?? '')) !== '' ? trim((string)$p['sizes']) : '-')
                   ." | kademe=".($tiers ? implode(' ', $tiers) : '-')
                   /* RENKLER de yaziliyor: "diger renkleri de ekle" isi
                      MEVCUT listeyi bilmeden yapilamaz -- set_product'in
                      colors alani listeyi DEGISTIRIR, eklemez, ve 10 Eyl
                      2026'da kuru kosu tam da bunu yakaladi (6 -> 5). */
                   ." | renk=".(($__c = array_values(array_filter((array)($p['colors'] ?? []), 'is_string'))) ? implode('/', $__c) : '-')
                   /* "Renkler ilanda var" ile "alici renk SECEBILIYOR" ayri iki
                      sey; sayim bunu soylemedigi surece ilkine bakip ikincisi
                      sanilir -- 10 Eyl 2026'da tam bu oldu.
                      Satir, sayfanin sordugu AYNI fonksiyondan okuyor
                      (vestra_colors_selectable). Onceki hali "min_colors bossa
                      secici YOK" diyordu ve bu, ayni gun renk secimi bolme
                      opt-in'i ile acilinca YANLIS cevap vermeye basladi: kutu
                      cizilirken sonda "YOK" derdi. Kendi kopyasini tasiyan bir
                      teshis, kaynak degisince sessizce yalan soyler. */
                   ." | renk_secici=".(vestra_is_colorqty_listing($p)
                        ? 'adet/renk (min '.(int)$p['min_colors'].')'
                        : (vestra_colors_selectable($p)
                            ? 'VAR'.((int)($p['min_colors'] ?? 0) > 0
                                 ? ' (min '.(int)$p['min_colors'].')'
                                 : ' (min yok — bolme opt-in)')
                            : 'YOK'))
                   ." | sample_price=".(!empty($p['sample_price'])?$p['sample_price']:'-')
                   ." | status=".($p['status']??'approved')
                   ." | satici: {$sLabel}\n";
              }
              echo "\nTOPLAM: ".count($hits)." urun\n";
              exit(0);
            }

            $terms = array_filter(array_map('trim', explode(',', strtolower((string)getenv("Q")))));
            if (!$terms) { fwrite(STDERR, "HATA: query ve brand ikisi de bos\n"); exit(1); }

            foreach ($terms as $term) {
              echo "===== ARAMA: '{$term}' =====\n";
              $matched = [];
              foreach ($accounts as $a) {
                $hay = strtolower(($a['company']??'').' '.($a['name']??''));
                if (strpos($hay, $term) !== false) $matched[] = $a;
              }
              if (!$matched) { echo "  *** hesap bulunamadi ***\n\n"; continue; }
              foreach ($matched as $a) {
                echo "  --- ".($a['company'] ?: $a['name'])." (id=".($a['id']??'?').", email=".($a['email']?:'YOK').") ---\n";
                $mine = array_values(array_filter($products, fn($p) => ($p['seller_uid'] ?? '') === $a['id']));
                if (!$mine) { echo "      (bu hesaba bagli hicbir urun yok)\n\n"; continue; }
                foreach ($mine as $p) {
                  echo "      ".($p['id']??'?')." | ".($p['brand']??'?')." | ".($p['name']??'?')." | cat=".($p['cat']??'?')
                     ." | sku=".($p['sku']??'')." | fiyat=".($p['list']??'?')
                     ." | sample_price=".(!empty($p['sample_price'])?$p['sample_price']:'-')
                     ." | status=".($p['status']??'approved')."\n";
                }
                echo "      TOPLAM: ".count($mine)." urun\n\n";
              }
            }
            PHPEOF
            php -l /tmp/seller_products.php
            # Cikis kodu ONCE yakalanip sonra donduruluyor -- ardindan gelen `rm`
            # onunkini eziyordu, yani PHP OLUMCUL hatasi veren bir sonda isi
            # YESIL birakiyordu (10 Eyl 2026: liste hic basilmadi, kosu "success"
            # dedi). set-product.yml ayni tuzagi zaten kaydetmisti.
            php /tmp/seller_products.php; RC=$?
            rm -f /tmp/seller_products.php
            exit $RC
