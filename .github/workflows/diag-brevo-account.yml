name: (Salt-okunur) Brevo hesabı — kalan hak, kişi listeleri, kampanyalar
# 13 Eki 2026 (operatör: "Brevo'dan 260 kampanya gönder"). SALT-OKUNUR: Brevo'ya yalnız GET atar, hiçbir şey
# göndermez, oluşturmaz, değiştirmez. API anahtarı sunucudaki data/email_settings.json'da; EKRANA YAZILMAZ.
# Basar: plan ve kalan krediler, gönderici adresleri (maskeli), kişi listeleri ve kişi sayıları,
# son 10 e-posta kampanyası (durum, tarih, alıcı/teslim/açılma), son 7 günün işlem e-postası özeti.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Oku
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 4m
          script: |
            set -u
            cat > /tmp/brevo_acct.php <<'PHPEOF'
            <?php
            $cfg = json_decode((string)@file_get_contents(getenv('HOME').'/public_html/data/email_settings.json'), true) ?: [];
            $key = (string)($cfg['mail_api_key'] ?? $cfg['api_key'] ?? '');
            if ($key === '') { $c = @include getenv('HOME').'/public_html/inc/config.php'; $key = is_array($c) ? (string)($c['mail_api_key'] ?? '') : ''; }
            if ($key === '') { echo "Brevo API anahtari yok.\n"; exit(0); }
            $get = function (string $path) use ($key): array {
              $ch = curl_init('https://api.brevo.com/v3'.$path);
              curl_setopt_array($ch, [CURLOPT_RETURNTRANSFER => true, CURLOPT_TIMEOUT => 30, CURLOPT_HTTPHEADER => ['accept: application/json', 'api-key: '.$key]]);
              $raw = (string)curl_exec($ch); $code = (int)curl_getinfo($ch, CURLINFO_HTTP_CODE); curl_close($ch);
              return [$code, json_decode($raw, true) ?: []];
            };
            $mask = fn($e) => preg_replace('/^(.).*@/', '$1***@', (string)$e);
            $sp = fn($n) => implode(' ', str_split((string)(int)$n));   // GitHub "22"yi maskeliyor
            [$c, $a] = $get('/account');
            echo "== Hesap (HTTP $c) ==\n";
            foreach ((array)($a['plan'] ?? []) as $p) echo "  plan: ".($p['type'] ?? '?')." · kredi türü ".($p['creditsType'] ?? '?')." · kalan kredi ".$sp($p['credits'] ?? 0).(isset($p['endDate']) ? ' · bitiş '.$p['endDate'] : '')."\n";
            [$c, $s] = $get('/senders');
            echo "== Göndericiler (HTTP $c) ==\n";
            foreach ((array)($s['senders'] ?? []) as $x) echo "  ".$mask($x['email'] ?? '')." · ".($x['name'] ?? '')." · ".(!empty($x['active']) ? 'aktif' : 'PASİF')."\n";
            [$c, $l] = $get('/contacts/lists?limit=50&offset=0');
            echo "== Kişi listeleri (HTTP $c) · toplam liste ".$sp($l['count'] ?? 0)." ==\n";
            foreach ((array)($l['lists'] ?? []) as $x) echo "  #".($x['id'] ?? '?')." ".mb_substr((string)($x['name'] ?? ''), 0, 50)." · kişi ".$sp($x['totalSubscribers'] ?? $x['uniqueSubscribers'] ?? 0)." · engelli ".$sp($x['totalBlacklisted'] ?? 0)."\n";
            [$c, $ct] = $get('/contacts?limit=1&offset=0');
            echo "== Toplam kişi (HTTP $c): ".$sp($ct['count'] ?? 0)." ==\n";
            [$c, $cp] = $get('/emailCampaigns?limit=10&offset=0&sort=desc');
            echo "== Son e-posta kampanyaları (HTTP $c) · toplam ".$sp($cp['count'] ?? 0)." ==\n";
            foreach ((array)($cp['campaigns'] ?? []) as $x) {
              $g = (array)($x['statistics']['globalStats'] ?? []);
              echo "  #".($x['id'] ?? '?')." ".mb_substr((string)($x['name'] ?? ''), 0, 45)." · ".($x['status'] ?? '?')." · ".substr((string)($x['sentDate'] ?? $x['scheduledAt'] ?? $x['createdAt'] ?? ''), 0, 16)
                 ." · alıcı ".$sp($g['sent'] ?? 0)." teslim ".$sp($g['delivered'] ?? 0)." açılma ".$sp($g['uniqueViews'] ?? 0)." tık ".$sp($g['uniqueClicks'] ?? 0)." dönen ".$sp(($g['hardBounces'] ?? 0) + ($g['softBounces'] ?? 0))." çıkan ".$sp($g['unsubscriptions'] ?? 0)."\n";
            }
            $from = gmdate('Y-m-d', time() - 6 * 86400); $to = gmdate('Y-m-d');
            [$c, $r] = $get("/smtp/statistics/aggregatedReport?startDate=$from&endDate=$to");
            echo "== İşlem e-postaları son 7 gün (HTTP $c): istek ".$sp($r['requests'] ?? 0)." · teslim ".$sp($r['delivered'] ?? 0)." · dönen ".$sp(($r['hardBounces'] ?? 0) + ($r['softBounces'] ?? 0))." · engellenen ".$sp($r['blocked'] ?? 0)." · açılma ".$sp($r['uniqueOpens'] ?? 0)."\n";
            [$c, $r] = $get('/smtp/statistics/aggregatedReport?days=1');
            echo "== İşlem e-postaları bugün (HTTP $c): istek ".$sp($r['requests'] ?? 0)." · teslim ".$sp($r['delivered'] ?? 0)."\n";
            PHPEOF
            php /tmp/brevo_acct.php 2>&1 | sed -E 's/[A-Za-z0-9._%+-]{2,}@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/***@***/g'; rm -f /tmp/brevo_acct.php
