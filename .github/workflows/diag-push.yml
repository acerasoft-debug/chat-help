name: (Salt-okunur) Sarvesto bildirim teşhisi
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Sitenin sunucudaki klasörü (deploy-retail hedefi)"
        required: false
        default: "~/maxsales_de"

permissions:
  contents: read

# SALT OKUNUR (12 Eki 2026). Uygulamadaki "Als Erste erfahren → Aktivieren"
# düğmesi "Das hat nicht geklappt" diyordu. Hangi adımın düştüğünü ölçer:
# VAPID anahtarı, kayıtlı abonelik sayısı (uç adresin yalnız SERVİS ADI basılır),
# oturum dosyalarının nerede tutulduğu ve ne zaman silindiği, hız sınırı ve
# hata kaydında api/push.php satırları. Hiçbir şey yazmaz, kimseye göndermez.
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Bildirim yolu
        uses: appleboy/ssh-action@v1.0.3
        env:
          T: ${{ github.event.inputs.target }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 3m
          envs: T
          script: |
            D="${T/#\~/$HOME}"
            [ -d "$D" ] || { echo "klasor yok: $D"; exit 1; }
            cat > /tmp/sv_pushdiag.php <<'PHPEOF'
            <?php
            $d = $argv[1];
            require $d . '/inc/push.php';
            echo "veri klasoru   : ", basename(vr_data_dir()), " (", is_writable(vr_data_dir()) ? 'yazilabilir' : 'YAZILAMAZ', ")\n";
            $vf = vr_data_dir() . '/' . VR_PUSH_VAPID;
            echo "VAPID dosyasi  : ", is_file($vf) ? 'VAR' : 'yok (ilk istekte uretilir)', "\n";
            try { $k = vr_push_public_key(); echo "VAPID acik anah: ", strlen(vr_b64u_dec($k)) === 65 ? 'gecerli (65 bayt)' : 'GECERSIZ', "\n"; }
            catch (Throwable $e) { echo "VAPID HATA     : ", $e->getMessage(), "\n"; }
            $subs = vr_push_subs();
            echo "abonelik       : ", count($subs), "\n";
            foreach ($subs as $s) {
              $h = parse_url((string)($s['endpoint'] ?? ''), PHP_URL_HOST);
              echo "   - ", preg_replace('/^[^.]+\./', '*.', (string)$h), " | dil ", $s['lang'] ?? '?', " | ilk ", substr((string)($s['created'] ?? ''), 0, 16), " | son ", substr((string)($s['seen'] ?? ''), 0, 16), "\n";
            }
            echo "openssl EC     : ", in_array('prime256v1', openssl_get_curve_names() ?: [], true) ? 'var' : 'YOK', "\n";
            echo "curl           : ", function_exists('curl_init') ? 'var' : 'YOK', "\n";
            echo "oturum klasoru : ", ini_get('session.save_path') ?: '(bos -> sistem gecici klasoru)', "\n";
            echo "oturum omru    : gc_maxlifetime=", ini_get('session.gc_maxlifetime'), " sn, gc_probability=", ini_get('session.gc_probability'), "/", ini_get('session.gc_divisor'), "\n";
            echo "oturum adi     : ", (string)vr_config('session_name'), "\n";
            $rl = vr_store_read('retail-ratelimit.json', []);
            $n = 0; foreach ((array)$rl as $k => $v) if (str_starts_with((string)$k, 'push-')) $n++;
            echo "hiz siniri     : push kovasi ", $n, " IP\n";
            $fails = vr_store_read('push-failures.json', []);
            echo "basarisiz deneme: ", count((array)$fails), " (son 10)\n";
            foreach (array_slice((array)$fails, -10) as $f) echo "   - ", $f['at'] ?? '', " | ", $f['browser'] ?? '', " | asama ", $f['stage'] ?? '', " | ", $f['err'] ?? '', ($f['host'] ?? '') !== '' ? " | servis " . $f['host'] : '', "\n";
            PHPEOF
            php /tmp/sv_pushdiag.php "$D"; rm -f /tmp/sv_pushdiag.php
            echo "== hata kaydi: push / CSRF satirlari (son 15) =="
            for f in "$D/error_log" "$D/api/error_log" "$HOME/logs/error_log"; do
              [ -f "$f" ] && { echo "-- $(basename $(dirname $f))/$(basename $f)"; grep -iE "push|csrf|vapid" "$f" | tail -15 | cut -c1-220; }
            done
            echo "== erisim kaydi: api/push.php yanit kodlari (son 2 gun) =="
            for f in $(ls -t $HOME/access-logs/* 2>/dev/null | head -3); do
              grep "api/push.php" "$f" 2>/dev/null | awk '{print $4, $6, $7, $9}' | tail -20
            done
            echo "bitti"
