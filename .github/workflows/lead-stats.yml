name: (Lead) Gönderim istatistiği (güne göre)
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Kaç günlük döküm gösterilsin"
        required: false
        default: "14"

permissions:
  contents: read

# Salt-okunur. last_contacted_at alanini gune gore gruplayip kac email
# gonderildigini yazar.
#
# Neden: "bugun kac email gonderildi" sorusunun cevabi oturum notlarindan degil,
# leads.json'dan gelmeli. Oturum boyunca tutulan toplam sayac, birden fazla gune
# yayilan kampanyalari ayirt etmiyor ve sadece bu oturumda yapilan gonderimleri
# sayiyor -- zamanlanmis islerin gonderdiklerini kacirir.
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: İstatistikleri çıkar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 4m
          envs: DAYS
          script: |
            cd ~/public_html
            # Cok satirli `php -r` cPanel'in ea_php_cli sarmalayicisini kiriyor
            # ("Unsuccessful stat on filename containing newline"): betigi gecici
            # bir dosyaya yazip calistiriyoruz -- diger is akislarinin yaptigi gibi.
            cat > /tmp/vestra_lead_stats.php <<'PHPEOF'
            <?php
            // Hatalar gorunur olsun: display_errors kapaliyken olumcul hata SESSIZ
            // gecer, is "basarili" biter ve cikti bos kalir. Ilk denemede tam boyle
            // oldu -- bos ciktiyi "hic gonderim yok" diye okumak cok kolaydi.
            ini_set('display_errors', '1'); error_reporting(E_ALL);
            $days = (int)(getenv('DAYS') ?: 14);
            // leads.php kendi basligi ile soyluyor: cagiran taraf products.php'yi
            // ONCE yuklemis olmali (vestra_read_json/vestra_write_json oradan gelir).
            require_once __DIR__.'/inc/products.php';
            require_once __DIR__.'/inc/leads.php';
            $leads = vestra_leads();
            $byDay = []; $everSent = 0;
            foreach ($leads as $l) {
              $t = trim((string)($l['last_contacted_at'] ?? ''));
              if ($t === '') continue;
              $everSent++;
              $d = date('Y-m-d', strtotime($t));
              $byDay[$d] = ($byDay[$d] ?? 0) + 1;
            }
            krsort($byDay);
            $today = date('Y-m-d');
            echo "toplam lead      : ".count($leads)."\n";
            echo "hic email gideni : ".$everSent."\n";
            echo "BUGUN ($today)   : ".($byDay[$today] ?? 0)."\n\n";
            echo "gune gore dokum (en yeni ustte):\n";
            $n = 0;
            foreach ($byDay as $d => $c) {
              if ($n++ >= $days) break;
              printf("  %s  %4d  %s%s\n", $d, $c, str_repeat('#', min(60, $c)),
                     $d === $today ? '   <= BUGUN' : '');
            }
            PHPEOF
            # __DIR__ /tmp'yi gosterecegi icin betigi public_html icinden calistiriyoruz.
            cp /tmp/vestra_lead_stats.php ./vestra_lead_stats_tmp.php
            php ./vestra_lead_stats_tmp.php
            rm -f ./vestra_lead_stats_tmp.php /tmp/vestra_lead_stats.php
        env:
          DAYS: ${{ github.event.inputs.days }}
