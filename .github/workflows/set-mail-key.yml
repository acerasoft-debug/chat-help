name: Sunucuda email API key'ini güncelle

# Elle tetiklenir (Actions sekmesi -> bu workflow -> Run workflow). secrets.MAIL_API_KEY
# gerekir -- repo Settings -> Secrets and variables -> Actions -> New repository secret
# ile eklenmeden çalışmaz (fail-fast kontrolü aşağıda). Key hiçbir zaman log'a yazılmaz,
# hiçbir dosyaya commit edilmez -- sadece sunucudaki data/email_settings.json'a yazılır.
#
# Not: vestrasales.com artık Brevo'da domain olarak doğrulandı (DKIM/DMARC DNS
# kayıtları Host Europe KIS panelinden eklendi, Brevo'nun /authenticate uç noktası
# "Domain has been authenticated successfully" döndü, verified:true). Bu yüzden
# mail_from artık support@vestrasales.com -- ilk kurulumda (Brevo'da hiçbir domain
# doğrulanmamışken) tek doğrulanmış sender acerasoft@gmail.com olduğu için oraya
# sabitlenmişti, o geçici çözümdü.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Ne yapılsın — mail_key | platform_bank (VESTRA'nın banka bilgileri) | customer_billing (bir müşterinin fatura adresi)"
        required: false
        default: "mail_key"
      cust_uid:
        description: "customer_billing: hesap id (ör. e38d3b085a4de4da)"
        required: false
        default: ""
      cust_address:
        description: "customer_billing: tam adres — sokak, şehir, eyalet, ZIP"
        required: false
        default: ""
      cust_country:
        description: "customer_billing: ülke (ör. US). Boşsa değişmez."
        required: false
        default: ""
      cust_phone:
        description: "customer_billing: telefon. Boşsa değişmez."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  update-mail-key:
    # Kosul once "!= 'platform_bank'" idi ve YANLISTI: task=customer_billing de bu
    # kosulu sagliyor, dolayisiyla musteri adresi guncellenirken e-posta ayarlari da
    # yeniden uygulanip bir test e-postasi gonderiliyordu. Bir gorev, kendisiyle
    # ilgisiz baska bir gorevi tetiklememeli. Disláma listesi yerine ACIK esitlik:
    # yeni bir task eklendiginde bu is kendiliginden dahil olmaz.
    if: github.event.inputs.task == 'mail_key' || github.event.inputs.task == ''
    runs-on: ubuntu-latest
    steps:
      - name: MAIL_API_KEY secret'ı var mı kontrol et
        run: |
          if [ -z "${{ secrets.MAIL_API_KEY }}" ]; then
            echo "::error::MAIL_API_KEY secret'ı tanımlı değil. Settings -> Secrets and variables -> Actions -> New repository secret ile ekleyin, sonra bu workflow'u tekrar çalıştırın."
            exit 1
          fi
          echo "MAIL_API_KEY tanımlı, devam ediliyor."

      - name: Sunucuda dogrulanmis domain sender'ina gec + gercek test gonder
        uses: appleboy/ssh-action@v1.0.3
        env:
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: MAIL_API_KEY
          script: |
            cat > /tmp/vestra_mailcheck.php <<'PHPEOF'
            <?php
            $key = getenv("MAIL_API_KEY");
            $from = "support@vestrasales.com";
            $to   = "acerasoft@gmail.com";

            echo "== email_settings.json guncelle (dogrulanmis domain sender'ina gecis) ==\n";
            $f = getenv("HOME")."/public_html/data/email_settings.json";
            $cur = is_readable($f) ? (json_decode(file_get_contents($f), true) ?: []) : [];
            if (!is_array($cur)) $cur = [];
            $cur["mail_enabled"] = true;
            $cur["mail_api_provider"] = "brevo";
            $cur["mail_api_key"] = $key;
            $cur["mail_from"] = $from;
            $cur["smtp_from"] = $from;
            $cur["smtp_name"] = "VESTRA";
            file_put_contents($f, json_encode($cur, JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES));
            @chmod($f, 0600);
            echo "mail_enabled: true\n";
            echo "mail_from: " . $cur["mail_from"] . " (Brevo'da dogrulanmis sender)\n";
            echo "smtp_name (gorunen isim): " . $cur["smtp_name"] . "\n";

            echo "\n== gercek uygulama testi (vestra_send_mail uzerinden, aliciya: {$to}) ==\n";
            $errFile = "/tmp/vestra_api_apptest_err.log";
            @unlink($errFile);
            ini_set("error_log", $errFile);
            $home = getenv("HOME");
            require $home."/public_html/inc/notify.php";
            $ok = vestra_send_mail($to, "VESTRA - otomatik email testi (dogrulanmis sender)", "Bu otomatik bir test mesajidir. Bu mail size ulastiysa gonderim calisiyor demektir.\n\n-- VESTRA");
            echo $ok ? "TEST GONDERIMI: BASARILI (Brevo kabul etti)\n" : "TEST GONDERIMI: BASARISIZ\n";
            $errContent = is_readable($errFile) ? trim((string)file_get_contents($errFile)) : "";
            echo "hata detayi: " . ($errContent !== "" ? $errContent : "(yok)") . "\n";
            @unlink($errFile);
            PHPEOF
            php /tmp/vestra_mailcheck.php
            rm -f /tmp/vestra_mailcheck.php

      - name: 3sn bekle, sonra Brevo'nun gerçek teslimat event'ini kontrol et
        env:
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
        run: |
          sleep 3
          echo "== acerasoft@gmail.com icin son event'ler (delivered mi, error mi?) =="
          curl -sS "https://api.brevo.com/v3/smtp/statistics/events?limit=5&email=acerasoft%40gmail.com" \
            -H "api-key: ${MAIL_API_KEY}" -H "Accept: application/json" -w "\nHTTP_CODE:%{http_code}\n"

  # ─────────────────────────────────────────────────────────────────────────────
  # VESTRA'nin KENDI fatura/banka bilgilerini sunucuya yaz.
  #
  # Neden secret uzerinden: bu depo herkese ACIK. Degeri koda gomsem depoda,
  # workflow girdisi yapsam Actions arayuzunde, script icine yazsam log'da
  # gorunurdu (ssh-action calistirdigi betigi log'a basiyor). ABD'de routing +
  # hesap numarasi ikilisi ACH borclandirma icin yeterli; kalici ve indekslenen
  # bir yere yazmak, hesabi acik birakmakla ayni sey.
  #
  # Secret degerleri GitHub tarafindan log'da maskelenir. Ayni yol bu depoda
  # MAIL_API_KEY icin zaten kullaniliyor (yukaridaki is).
  #
  # Secret adi : PLATFORM_BANK_JSON
  # Secret degeri: tek satir JSON, ornegin
  #   {"bank_holder":"acerasoft LLC","bank_name":"...","bank_routing":"...",
  #    "bank_account":"...","bank_acct_type":"Checking","bank_address":"..."}
  #
  # Sunucudaki dosya: data/platform_seller.json (web'e kapali, .gitignore'da, 0600)
  # Bos gelen alan mevcut degeri SILMEZ -- kismi guncelleme guvenli.
  update-platform-bank:
    if: github.event.inputs.task == 'platform_bank'
    runs-on: ubuntu-latest
    steps:
      - name: PLATFORM_BANK_JSON secret'ı var mı kontrol et
        run: |
          if [ -z "${{ secrets.PLATFORM_BANK_JSON }}" ]; then
            echo "::error::PLATFORM_BANK_JSON secret'ı tanımlı değil. Settings -> Secrets and variables -> Actions -> New repository secret ile ekleyin (tek satır JSON), sonra bu workflow'u task=platform_bank ile tekrar çalıştırın."
            exit 1
          fi
          echo "PLATFORM_BANK_JSON tanımlı, devam ediliyor."

      - name: Sunucuya yaz (data/platform_seller.json)
        uses: appleboy/ssh-action@v1.0.3
        env:
          PLATFORM_BANK_JSON: ${{ secrets.PLATFORM_BANK_JSON }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: PLATFORM_BANK_JSON
          script: |
            cat > /tmp/vestra_platwrite.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";

            $raw = (string)getenv('PLATFORM_BANK_JSON');
            $in  = json_decode($raw, true);
            if (!is_array($in)) { fwrite(STDERR, "PLATFORM_BANK_JSON gecerli JSON degil\n"); exit(1); }

            $allow = ['company','address','country','email','website',
                      'bank_name','bank_holder','bank_iban','bank_bic',
                      'bank_routing','bank_account','bank_acct_type','bank_address',
                      'vat_id','reg_number'];
            $f = vestra_data_dir().'/platform_seller.json';
            $cur = is_readable($f) ? json_decode((string)file_get_contents($f), true) : [];
            if (!is_array($cur)) $cur = [];

            $set = [];
            foreach ($allow as $k) {
              $v = trim((string)($in[$k] ?? ''));
              if ($v !== '') { $cur[$k] = $v; $set[] = $k; }
            }
            /* Bilinmeyen anahtar sessizce yutulmasin: yanlis yazilmis bir alan adi
               ("routing" vs "bank_routing") kaydedilmis sanilir, oysa dusmustur. */
            foreach (array_keys($in) as $k) {
              if (!in_array($k, $allow, true)) echo "  UYARI: bilinmeyen alan atlandi -> {$k}\n";
            }
            if (!$set) { fwrite(STDERR, "yazilacak alan yok\n"); exit(1); }

            file_put_contents($f, json_encode($cur, JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES));
            @chmod($f, 0600);

            /* DEGERLER YAZDIRILMIYOR -- yalnizca hangi alanlarin set edildigi. */
            echo "  yazildi: ".count($set)." alan -> ".implode(', ', $set)."\n";
            $payable = trim((string)($cur['bank_iban'] ?? '')) !== '' || trim((string)($cur['bank_account'] ?? '')) !== '';
            echo $payable ? "  SONUC: odeme kutusu artik basilabilir\n"
                          : "  SONUC: hesap numarasi hala YOK -- odeme kutusu bos cikar\n";
            PHPEOF
            cd ~/public_html
            cp /tmp/vestra_platwrite.php ./vestra_platwrite_tmp.php
            php ./vestra_platwrite_tmp.php
            rc=$?
            rm -f ./vestra_platwrite_tmp.php /tmp/vestra_platwrite.php
            exit $rc

  # ─────────────────────────────────────────────────────────────────────────────
  # Bir musterinin FATURA ADRESINI yaz. Panelde bunun formu var (Users -> Edit
  # billing details); bu is akisi ayni isi operator adina yapiyor.
  #
  # Neden bu bilgi girdi olarak gecirilebiliyor da banka bilgileri gecirilemiyor:
  # burada yazilan sey bir ISLETME ADRESI -- zaten faturanin uzerinde, gumruk
  # beyaninda ve kargo etiketinde gorunuyor, gizli bir veri degil. Banka
  # routing+hesap ikilisi ise ABD'de ACH borclandirmaya yetiyor; o, acik bir
  # log'a yazilamaz ve secret uzerinden gider (yukaridaki update-platform-bank).
  #
  # EIN bilerek BURADA YOK: zaten girilmis durumda ve gereksiz yere log'a
  # dusurmenin anlami yok. Bos gelen alan mevcut degeri SILMEZ.
  update-customer-billing:
    if: github.event.inputs.task == 'customer_billing'
    runs-on: ubuntu-latest
    steps:
      - name: Müşteri fatura adresini güncelle
        uses: appleboy/ssh-action@v1.0.3
        env:
          C_UID: ${{ github.event.inputs.cust_uid }}
          C_ADDRESS: ${{ github.event.inputs.cust_address }}
          C_COUNTRY: ${{ github.event.inputs.cust_country }}
          C_PHONE: ${{ github.event.inputs.cust_phone }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: C_UID,C_ADDRESS,C_COUNTRY,C_PHONE
          script: |
            cat > /tmp/vestra_custbill.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $doc = getenv("HOME")."/public_html";
            require $doc."/inc/products.php";
            require_once $doc."/inc/auth.php";

            $uid = preg_replace('/[^a-f0-9]/', '', (string)getenv('C_UID'));
            if ($uid === '') { fwrite(STDERR, "cust_uid yok\n"); exit(1); }

            $acc = null;
            foreach (auth_accounts() as $a) { if (($a['id'] ?? '') === $uid) { $acc = $a; break; } }
            if (!$acc) { fwrite(STDERR, "hesap bulunamadi: {$uid}\n"); exit(1); }

            $upd = [];
            foreach (['address'=>'C_ADDRESS','country'=>'C_COUNTRY','phone'=>'C_PHONE'] as $field => $env) {
              $v = trim((string)getenv($env));
              if ($v !== '') $upd[$field] = $v;   // bos alan mevcut degeri silmez
            }
            if (!$upd) { fwrite(STDERR, "yazilacak alan yok\n"); exit(1); }

            echo "hesap : ".($acc['company'] ?: $acc['name'] ?: $acc['email'])."\n";
            foreach ($upd as $k => $v) {
              printf("  %-8s %s  ->  %s\n", $k, trim((string)($acc[$k] ?? '')) ?: '(bos)', $v);
            }
            auth_update($uid, $upd);

            /* Yazdiktan sonra GERI OKU. auth_update() sessizce basarisiz olursa
               (dosya kilidi, izin) is "basarili" biter ve degisiklik yapildi
               sanilir -- bu projede bugun birkac kez ayni desen cikti. */
            $after = null;
            foreach (auth_accounts() as $a) { if (($a['id'] ?? '') === $uid) { $after = $a; break; } }
            $ok = true;
            foreach ($upd as $k => $v) {
              if (trim((string)($after[$k] ?? '')) !== $v) { $ok = false; echo "  !! {$k} yazilamadi\n"; }
            }
            echo $ok ? "SONUC: kayit dogrulandi\n" : "SONUC: EN AZ BIR ALAN YAZILAMADI\n";
            exit($ok ? 0 : 1);
            PHPEOF
            cd ~/public_html
            cp /tmp/vestra_custbill.php ./vestra_custbill_tmp.php
            php ./vestra_custbill_tmp.php
            rc=$?
            rm -f ./vestra_custbill_tmp.php /tmp/vestra_custbill.php
            exit $rc
