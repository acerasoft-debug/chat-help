name: Sunucuda email API key'ini güncelle

# Elle tetiklenir (Actions sekmesi -> bu workflow -> Run workflow). secrets.MAIL_API_KEY
# gerekir -- repo Settings -> Secrets and variables -> Actions -> New repository secret
# ile eklenmeden çalışmaz (fail-fast kontrolü aşağıda). Key hiçbir zaman log'a yazılmaz,
# hiçbir dosyaya commit edilmez -- sadece sunucudaki data/email_settings.json'a yazılır.
#
# Not: secrets.MAIL_API_KEY şu an Brevo'nun SMTP key'ini (xsmtpsib-...) tutuyor -- bu bir
# REST API key değil (o api.brevo.com'u 401 ile reddediyordu), bu yüzden bu workflow
# doğrudan authenticated SMTP (smtp-relay.brevo.com:587) kullanıyor.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-mail-key:
    runs-on: ubuntu-latest
    steps:
      - name: MAIL_API_KEY secret'ı var mı kontrol et
        run: |
          if [ -z "${{ secrets.MAIL_API_KEY }}" ]; then
            echo "::error::MAIL_API_KEY secret'ı tanımlı değil. Settings -> Secrets and variables -> Actions -> New repository secret ile ekleyin, sonra bu workflow'u tekrar çalıştırın."
            exit 1
          fi
          echo "MAIL_API_KEY tanımlı, devam ediliyor."

      - name: Brevo SMTP'yi ham protokolle doğrula + sunucuda güncelle + gerçek test gönder
        uses: appleboy/ssh-action@v1.0.3
        env:
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: MAIL_API_KEY
          script: |
            cat > /tmp/vestra_mailcheck.php <<'PHPEOF'
            <?php
            $host = "smtp-relay.brevo.com";
            $port = 587;
            $user = "b2bf45001@smtp-brevo.com";
            $pass = getenv("MAIL_API_KEY");
            $from = "support@vestrasales.com";

            echo "== 1) RAW SMTP diagnostik: {$host}:{$port} ==\n";
            $fp = @fsockopen($host, $port, $errno, $errstr, 15);
            if (!$fp) {
              echo "BAGLANTI BASARISIZ: {$errstr} ({$errno})\n";
              echo "-> sunucu bu portu disariya kapatiyor olabilir.\n";
            } else {
              stream_set_timeout($fp, 15);
              $read = function() use ($fp) {
                $data=''; while(($line=fgets($fp,515))!==false){ $data.=$line; if(isset($line[3])&&$line[3]===' ') break; } return $data;
              };
              $cmd = function($c, $label) use ($fp,$read){
                if ($c !== null) fwrite($fp, $c."\r\n");
                $r = $read();
                echo "{$label}: " . trim($r) . "\n";
                return $r;
              };
              $cmd(null, "GREETING");
              $cmd("EHLO vestrasales.com", "EHLO#1");
              $r = $cmd("STARTTLS", "STARTTLS");
              if (strpos($r,'220')===false) {
                echo "-> STARTTLS reddedildi, durduruluyor\n";
              } elseif (!@stream_socket_enable_crypto($fp, true, STREAM_CRYPTO_METHOD_TLS_CLIENT)) {
                echo "-> TLS handshake BASARISIZ\n";
              } else {
                echo "TLS: OK\n";
                $cmd("EHLO vestrasales.com", "EHLO#2");
                $cmd("AUTH LOGIN", "AUTH LOGIN");
                $cmd(base64_encode($user), "USER ({$user})");
                $r = $cmd(base64_encode($pass), "PASS (" . strlen($pass) . " karakter key)");
                if (strpos($r,'235')===false) {
                  echo "-> AUTH BASARISIZ (kullanici adi/sifre reddedildi)\n";
                } else {
                  echo "AUTH: OK\n";
                  $cmd("MAIL FROM:<{$from}>", "MAIL FROM");
                  $r = $cmd("RCPT TO:<{$from}>", "RCPT TO");
                  if (strpos($r,'250')===false) {
                    echo "-> RCPT TO reddedildi (gonderen/alici adresiyle ilgili olabilir)\n";
                  } else {
                    $cmd("DATA", "DATA");
                    $msg = "From: VESTRA <{$from}>\r\nTo: <{$from}>\r\nSubject: VESTRA raw SMTP testi\r\n\r\nRaw SMTP diagnostik testi basarili.\r\n.";
                    $r = $cmd($msg, "SEND");
                    echo (strpos($r,'250')!==false) ? "-> RAW SMTP GONDERIMI BASARILI\n" : "-> RAW SMTP GONDERIMI BASARISIZ\n";
                  }
                }
              }
              $cmd("QUIT", "QUIT");
              fclose($fp);
            }

            echo "\n== 2) email_settings.json guncelle (SMTP moduna gecis) ==\n";
            $f = getenv("HOME")."/public_html/data/email_settings.json";
            $cur = is_readable($f) ? (json_decode(file_get_contents($f), true) ?: []) : [];
            if (!is_array($cur)) $cur = [];
            $cur["mail_enabled"] = true;
            $cur["mail_api_key"] = "";
            $cur["mail_api_provider"] = "";
            $cur["smtp_host"] = $host;
            $cur["smtp_port"] = $port;
            $cur["smtp_user"] = $user;
            $cur["smtp_pass"] = $pass;
            if (empty($cur["mail_from"])) $cur["mail_from"] = $from;
            $cur["smtp_from"] = $cur["mail_from"];
            if (empty($cur["smtp_name"])) $cur["smtp_name"] = "VESTRA";
            file_put_contents($f, json_encode($cur, JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES));
            @chmod($f, 0600);
            echo "smtp_host: {$cur['smtp_host']}:{$cur['smtp_port']}\n";
            echo "smtp_user: {$cur['smtp_user']}\n";
            echo "smtp_pass: " . (strlen($cur['smtp_pass'])>0 ? "ayarlandi (" . strlen($cur['smtp_pass']) . " karakter)" : "BOS") . "\n";
            echo "mail_api_key: temizlendi (bos, artik SMTP yolu kullanilacak)\n";

            echo "\n== 3) gercek uygulama testi (vestra_send_mail uzerinden) ==\n";
            $errFile = "/tmp/vestra_smtp_apptest_err.log";
            @unlink($errFile);
            ini_set("error_log", $errFile);
            $home = getenv("HOME");
            require $home."/public_html/inc/notify.php";
            $ok = vestra_send_mail($cur["mail_from"], "VESTRA - uygulama SMTP testi", "Bu, vestra_send_mail() uzerinden gonderilen otomatik bir test mesajidir. Bu mail size ulastiysa gonderim calisiyor demektir.\n\n-- VESTRA");
            echo $ok ? "UYGULAMA TESTI: BASARILI\n" : "UYGULAMA TESTI: BASARISIZ\n";
            $errContent = is_readable($errFile) ? trim((string)file_get_contents($errFile)) : "";
            echo "hata detayi: " . ($errContent !== "" ? $errContent : "(yok)") . "\n";
            @unlink($errFile);
            PHPEOF
            php /tmp/vestra_mailcheck.php
            rm -f /tmp/vestra_mailcheck.php
