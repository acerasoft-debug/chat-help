name: (Talepler) Toplu teklif — katalog fiyatından indirimli
# 14 Eki 2026 (operatör: "Offene Anfragen — bunların hepsine katalog fiyatlarının %10'undan teklif ver" →
# "hatta %15 teklif ver"). Her satır bir talebe bir ürün: REF|ÜRÜN_ID[|adet metni][|not]. Fiyat = ürünün katalog
# "from" fiyatı × (100 − pct) / 100. request-offer.php'nin AYNI yolu: request_offers.csv satırı, alıcıya e-posta,
# alıcı hesabıysa bildirim + mesaj kartı, operatöre özet. Satıcı: seller_uid hesabı (varsayılan GARAGE LE PARIS).
# dry_run=true hiçbir şey yazmaz/göndermez. Aynı satıcının aynı talebe BUGÜN verdiği teklif varsa tekrar verilmez.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Satırlar ; ile: REF|ÜRÜN_ID|adet metni|not"
        required: true
      pct:
        description: "Katalog fiyatından indirim yüzdesi"
        required: false
        default: "15"
      seller_uid:
        description: "Teklifi veren satıcı hesabı id"
        required: false
        default: "7ab30f26afedd840"
      dry_run:
        description: "true = yalnız göster"
        required: false
        default: "true"
permissions:
  contents: read
jobs:
  offers:
    runs-on: ubuntu-latest
    steps:
      - name: Teklifler
        uses: appleboy/ssh-action@v1.0.3
        env:
          SPEC: ${{ github.event.inputs.spec }}
          PCT: ${{ github.event.inputs.pct }}
          SELLER: ${{ github.event.inputs.seller_uid }}
          DRY: ${{ github.event.inputs.dry_run }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: SPEC,PCT,SELLER,DRY
          command_timeout: 6m
          script: |
            cd ~/public_html
            cat > /tmp/vestra_rqo.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $home = getenv("HOME");
            require      $home."/public_html/inc/products.php";
            require_once $home."/public_html/inc/auth.php";
            require_once $home."/public_html/inc/notify.php";
            $dry = strtolower(trim((string)getenv('DRY'))) !== 'false';
            $pct = max(1, min(50, (int)(getenv('PCT') ?: 15)));
            $mask = static function (string $e): string { $e = strtolower(trim($e)); [$u, $d] = array_pad(explode('@', $e, 2), 2, ''); return $u === '' ? '-' : substr($u, 0, 1).'***@'.$d; };
            $seller = null; foreach ((array)auth_accounts() as $a) if (($a['id'] ?? '') === trim((string)getenv('SELLER'))) $seller = $a;
            if (!$seller || ($seller['type'] ?? '') !== 'seller' || !filter_var((string)($seller['email'] ?? ''), FILTER_VALIDATE_EMAIL)) { fwrite(STDERR, "satici hesabi gecersiz\n"); exit(1); }
            $company = trim((string)($seller['company'] ?? '')) ?: 'VESTRA seller';
            echo ($dry ? "KURU KOSU" : "GERCEK")." · satici ".$company." (".$seller['id'].") · indirim %".$pct."\n";
            $reqs = []; foreach (vestra_read_csv('requests.csv') as $r) $reqs[(string)($r['ref'] ?? '')] = $r;
            $existing = vestra_read_csv('request_offers.csv'); $today = date('Y-m-d');
            $one = fn($s) => trim(preg_replace('/\s+/', ' ', str_replace(["\r", "\n"], ' ', (string)$s)));
            $n = 0;
            foreach (array_filter(array_map('trim', explode(';', (string)getenv('SPEC')))) as $line) {
              [$ref, $pid, $qtyTxt, $note] = array_pad(array_map('trim', explode('|', $line)), 4, '');
              $req = $reqs[$ref] ?? null; $p = $pid !== '' ? vestra_find($pid) : null;
              if (!$req) { echo "\n#$ref: TALEP YOK — atlandi\n"; continue; }
              if (!$p) { echo "\n#$ref: urun $pid katalogda yok — atlandi\n"; continue; }
              $dup = false; foreach ($existing as $o) if (($o['request_ref'] ?? '') === $ref && strtolower((string)($o['seller_email'] ?? '')) === strtolower((string)$seller['email']) && str_starts_with((string)($o['timestamp'] ?? ''), $today)) $dup = true;
              if ($dup) { echo "\n#$ref: bu satici bugun zaten teklif vermis — atlandi\n"; continue; }
              $cat = (float)vestra_from_price($p); if ($cat <= 0) { echo "\n#$ref: urunun katalog fiyati yok — atlandi\n"; continue; }
              $price = round($cat * (100 - $pct) / 100, 2);
              $moq = (int)($p['moq'] ?? 0); $unit = (string)($p['unit'] ?? 'pc');
              $pname = trim((string)($p['brand'] ?? '').' '.vestra_product_name($p));
              $url = 'https://vestrasales.com/product?id='.rawurlencode((string)$p['id']);
              $qty = $qtyTxt !== '' ? $qtyTxt : ($moq > 0 ? $moq.' '.$unit.' (MOQ)' : '');
              $delivery = function_exists('vestra_ships_from_label') ? ('Ships from '.vestra_ships_from_label($p).' · invoice with full EU trail') : 'Invoice with full EU trail';
              $msg = $pname.' — catalogue price €'.number_format($cat, 2, '.', '').'/'.$unit.', offered at €'.number_format($price, 2, '.', '').'/'.$unit.' (−'.$pct.'%). MOQ '.$moq.' '.$unit.'. '.$url.($note !== '' ? ' · '.$note : '');
              $title = (string)($req['title'] ?? $ref); $buyerEmail = (string)($req['email'] ?? ''); $buyerAcc = $buyerEmail ? auth_find($buyerEmail) : null;
              printf("\n#%s · %s · alici %s (%s)\n   urun %s · katalog €%.2f → teklif €%.2f/%s · adet: %s\n   not: %s\n", $ref, $title, $mask($buyerEmail), $buyerAcc ? ($buyerAcc['type'] ?? '?').' hesabi' : 'hesap yok', $pname, $cat, $price, $unit, $qty, $msg);
              if ($dry) { $n++; continue; }
              $oref = 'RO'.strtoupper(substr(md5($seller['email'].$ref.microtime(false)), 0, 6));
              $fh = @fopen(vestra_data_dir().'/request_offers.csv', 'a');
              if (!$fh) { echo "   ! yazilamadi\n"; continue; }
              fputcsv($fh, [date('c'), $oref, $ref, $one($company), $one((string)$seller['email']), $price, $one($qty), $one($delivery), $one($msg)], ',', '"', '\\'); fclose($fh);
              if ($buyerAcc && ($buyerAcc['type'] ?? '') === 'buyer') {
                require_once $home."/public_html/inc/push.php";
                try { vestra_push_notify($buyerAcc, 'request_offer', ['title' => $title, 'price' => $price, 'qty_text' => $qty, 'request' => $ref]); } catch (\Throwable $e) {}
                require_once $home."/public_html/inc/messages.php";
                vestra_msg_post_system((string)$buyerAcc['id'], (string)$seller['id'], $ref, ['kind' => 'request_offer', 'ref' => $oref, 'request_ref' => $ref, 'product' => $title, 'qty' => $qty, 'unit_price' => $price], (string)$seller['id']);
              }
              $sent = false;
              if (filter_var($buyerEmail, FILTER_VALIDATE_EMAIL)) {
                $sent = (bool)vestra_send_mail($buyerEmail, "VESTRA — you received an offer on your request #{$ref}",
                  "Hello,\n\nA verified seller has made an offer on your sourcing request:\n\n".
                  "Your request: {$title}\nSeller company: {$company}\nProduct: {$pname}\n".
                  "Price offered: €".number_format($price, 2, '.', '')."/{$unit} (catalogue €".number_format($cat, 2, '.', '').", −{$pct}%)\n".
                  "Quantity: {$qty}\nDelivery: {$delivery}\n\nProduct page: {$url}\nRef: {$oref}\n\n".
                  "View and respond on VESTRA:\nhttps://vestrasales.com/buyer?tab=requests\n\n— VESTRA · vestrasales.com");
              }
              echo "   + ".$oref." yazildi · alici e-postasi: ".($sent ? 'gonderildi' : 'GONDERILEMEDI/yok')."\n";
              $n++;
            }
            if (!$dry && $n) vestra_notify("Bulk request offers: {$n} (−{$pct}%)", "Operator-requested offers on open sourcing requests were sent as {$company}. See admin ▸ requests.");
            echo "\nBITTI · ".($dry ? 'gonderilecek' : 'gonderildi').": {$n}\n";
            PHPEOF
            php /tmp/vestra_rqo.php 2>&1; rc=$?; rm -f /tmp/vestra_rqo.php; exit $rc
