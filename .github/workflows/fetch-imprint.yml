name: Künye bilgilerini sunucudan oku (Acerasoft)

on:
  workflow_dispatch:

# MAXSALES'in Impressum sayfası boş: data/retail-settings.json içindeki
# company.* alanları doldurulmadığı için selftest FAIL veriyor ve §5 TMG /
# §5 DDG gereği sayfa eksik. Aynı bilgiler ChatHelp tarafında (chat-help.com)
# zaten yayında. Bu iş sunucudaki chat uygulamasında künye metnini arıyor ve
# BULDUĞUNU LOGA BASIYOR — hiçbir şeyi değiştirmiyor, yalnızca okuyor.
#
# Neden runner: bu ortamın ağ politikası chat-help.com'a çıkışı kapatıyor
# (gateway CONNECT'e 403 veriyor), sunucuya SSH ise yalnızca runner'dan var.
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Sunucudan künye metnini oku
        env:
          SSH_KEY:  ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -e
          PORT="${SSH_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSHOPT="-i $HOME/.ssh/id_deploy -p $PORT -o BatchMode=yes -o StrictHostKeyChecking=no"

          ssh $SSHOPT "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo "###### 0) Sunucuda ne var ######"
          echo "-- ev dizini:"; ls -1 ~ | head -30
          echo "-- public_html:"; ls -1 ~/public_html 2>/dev/null | head -40
          echo "-- domain klasörleri:"; ls -d ~/*/public_html ~/domains/*/public_html ~/*/htdocs 2>/dev/null | head -20

          echo
          echo "###### 1) Künye geçen dosyalar (tüm ev dizini) ######"
          grep -rliE "impressum|anbieterkennzeichnung|imprint" ~ \
            --include=*.php --include=*.html --include=*.js --include=*.json 2>/dev/null | head -30

          echo
          echo "###### 2) Acerasoft geçen satırlar ######"
          grep -rniE "acerasoft" ~ --include=*.php --include=*.html --include=*.js --include=*.json 2>/dev/null \
            | grep -viE "acerasoft@gmail|acerasoft\+|acerasoft-debug" | head -40

          echo
          echo "###### 3) Sicil / temsil / vergi kalıpları ######"
          grep -rnoiE "(HRB|HRA|USt-?IdNr\.?|Steuernummer|Registergericht|vertreten durch|Geschäftsführ[a-zä]*|Sitz der Gesellschaft)[^<\"']{0,90}" ~ \
            --include=*.php --include=*.html --include=*.json 2>/dev/null | head -30

          echo
          echo "###### 4) Adres kalıpları ######"
          grep -rnoiE "[A-ZÄÖÜ][a-zäöüß]+(str(aße|asse)|weg|platz|allee)\.? ?[0-9]{1,4}[a-z]?" ~ \
            --include=*.php --include=*.html --include=*.json 2>/dev/null | head -20
          grep -rnoE "\b[0-9]{5} [A-ZÄÖÜ][a-zäöüß]+" ~ \
            --include=*.php --include=*.html --include=*.json 2>/dev/null | head -20

          echo
          echo "###### 5) Künye sayfasının tam metni ######"
          for F in $(grep -rliE "impressum|anbieterkennzeichnung" ~ --include=*.php --include=*.html 2>/dev/null | head -3); do
            echo "--- dosya: $F"
            grep -niE -A6 -B6 "impressum|anbieterkennzeichnung" "$F" | head -80
          done
          REMOTE
