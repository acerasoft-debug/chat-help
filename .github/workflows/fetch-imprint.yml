name: Künye bilgilerini sunucudan oku (Acerasoft)

on:
  workflow_dispatch:

# MAXSALES'in Impressum sayfası boş: data/retail-settings.json içindeki
# company.* alanları doldurulmadığı için selftest FAIL veriyor ve §5 TMG /
# §5 DDG gereği sayfa eksik. Aynı bilgiler ChatHelp tarafında (chat-help.com)
# zaten yayında. Bu iş sunucudaki chat uygulamasında künye metnini arıyor ve
# BULDUĞUNU LOGA BASIYOR — hiçbir şeyi değiştirmiyor, yalnızca okuyor.
#
# Neden runner: bu ortamın ağ politikası chat-help.com'a çıkışı kapatıyor
# (gateway CONNECT'e 403 veriyor), sunucuya SSH ise yalnızca runner'dan var.
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Sunucudan künye metnini oku
        env:
          SSH_KEY:  ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -e
          PORT="${SSH_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSHOPT="-i $HOME/.ssh/id_deploy -p $PORT -o BatchMode=yes -o StrictHostKeyChecking=no"

          ssh $SSHOPT "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -u
          # Künye VESTRA'nın hukuk metinlerinde bulundu: inc/legal/de.php
          # içindeki 'imprint' bloğu. Tamamını okuyoruz — MAXSALES'in
          # data/retail-settings.json alanları buradan doldurulacak.
          for F in ~/public_html/inc/legal/de.php ~/repo/vestra/inc/legal/de.php ~/CANLI_KLASOR/inc/legal/de.php; do
            [ -f "$F" ] || continue
            echo "###### $F ######"
            sed -n '1,90p' "$F"
            echo
            break
          done

          echo
          echo "###### İletişim / e-posta ayarları ######"
          grep -rnoiE "(support|info|kontakt|hello)@[a-z0-9.-]+" ~/public_html/inc ~/public_html/*.php 2>/dev/null | head -10
          REMOTE
