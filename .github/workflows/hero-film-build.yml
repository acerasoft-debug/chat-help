name: (Görsel) Ana sayfa filmi — temas sayfası / yeniden kurgu
on:
  workflow_dispatch:
    inputs:
      picks:
        description: "Satır satır canlı görsel yolu: /uploads/...jpg[|#rrggbb] (renk boşsa fotoğraftan örneklenir)"
        required: true
        default: ""
      mode:
        description: "sheet = yalnız temas sayfası | film = hero.mp4/webm/poster kur"
        required: false
        default: "sheet"
      frames:
        description: "Kare sayısı (24 fps; 720 = 30 sn)"
        required: false
        default: "720"

permissions:
  contents: write

# SİTEYE YAZMAZ. Seçilen ürün fotoğraflarını canlı siteden (vestrasales.com) indirir;
# 'sheet' kipinde numaralı bir temas sayfası, 'film' kipinde deploy dalındaki
# tools/hero-film/build.sh ile filmi kurar. Çıktılar bu dala diag/hero/ altına işlenir;
# filmi yayına almak ayrı bir adımdır (dosyalar vestra/assets/hero/'ya konup deploy edilir).
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: claude/wizardly-planck-7ylnmk
          path: site
          sparse-checkout: |
            tools/hero-film
          sparse-checkout-cone-mode: false
      - name: Araçlar
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          pip install -q pillow
          if [ "$MODE" = "film" ]; then
            sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null
            mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright@1.56.1
            npx playwright install --with-deps chromium > /dev/null
          fi
      - name: Fotoğrafları indir + renk örnekle
        env:
          PICKS: ${{ github.event.inputs.picks }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          mkdir -p site/vestra/uploads diag/hero
          python3 - <<'PY'
          import os, re, json, subprocess, statistics
          from PIL import Image
          lines = [l.strip() for l in os.environ['PICKS'].splitlines() if l.strip()]
          out = []
          for l in lines:
              path, _, col = l.partition('|')
              path = path.strip(); col = col.strip()
              if not re.fullmatch(r'/uploads/[A-Za-z0-9._/-]+', path) or '..' in path:
                  raise SystemExit('gecersiz yol: ' + path)
              dst = 'site/vestra' + path
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              r = subprocess.run(['curl', '-sS', '-f', '-A', 'Mozilla/5.0 VESTRA-hero-build', '-o', dst, 'https://vestrasales.com' + path])
              if r.returncode != 0 or os.path.getsize(dst) < 5000:
                  if os.environ.get('MODE') == 'film': raise SystemExit('indirilemedi: ' + path)
                  print('  ATLANDI (indirilemedi): ' + path); continue
              im = Image.open(dst).convert('RGB'); w, h = im.size
              if not col:
                  c = im.crop((int(w*.3), int(h*.3), int(w*.7), int(h*.7))).resize((60, 60))
                  px = [p for p in list(c.getdata()) if 60 < sum(p) < 690]
                  if px:
                      col = '#%02x%02x%02x' % tuple(int(statistics.median([p[i] for p in px])) for i in range(3))
                  else:
                      col = '#8c8c96'
              out.append([path[len('/uploads/'):], col, w, h])
              print(f'{len(out):2d}. {path}  {w}x{h}  {col}')
          json.dump([[p, c] for p, c, _, _ in out], open('/tmp/picks.json', 'w'))
          # temas sayfasi: numarali, 4 sutun
          T = 300; cols = 4; rows = (len(out) + cols - 1) // cols
          sheet = Image.new('RGB', (cols*T, rows*(T+34)), 'white')
          from PIL import ImageDraw
          d = ImageDraw.Draw(sheet)
          for i, (p, c, w, h) in enumerate(out):
              im = Image.open('site/vestra/uploads/' + p).convert('RGB'); im.thumbnail((T-10, T-10))
              x, y = (i % cols) * T, (i // cols) * (T + 34)
              sheet.paste(im, (x + (T - im.width)//2, y + (T - im.height)//2))
              d.rectangle([x+6, y+T+6, x+28, y+T+28], fill=c)
              d.text((x+34, y+T+10), f'{i+1}. {os.path.basename(p)[:34]}', fill='black')
          sheet.save('diag/hero/sheet.jpg', quality=85)
          PY
      - name: Filmi kur
        if: github.event.inputs.mode == 'film'
        env:
          FR: ${{ github.event.inputs.frames }}
        run: |
          export NODE_PATH=/tmp/pw/node_modules
          export HERO_PICKS="$(cat /tmp/picks.json)"
          sed -i "s/^FRAMES=720 /FRAMES=${FR:-720} /" site/tools/hero-film/build.sh
          bash site/tools/hero-film/build.sh
          mkdir -p diag/hero/out diag/hero/frames
          cp site/vestra/assets/hero/hero.mp4 site/vestra/assets/hero/hero.webm site/vestra/assets/hero/hero-poster.jpg diag/hero/out/
          ffmpeg -nostdin -v error -i diag/hero/out/hero.mp4 -vf fps=1/3,scale=800:-1 diag/hero/frames/f%02d.jpg
          cp /tmp/picks.json diag/hero/out/picks.json
          ls -la diag/hero/out
      - name: Dala işle
        if: always()
        run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add -f diag/hero 2>/dev/null; true
          git diff --cached --quiet && exit 0
          git commit -q -m "Teşhis: ana sayfa filmi (${{ github.event.inputs.mode }})"
          for i in 1 2 3 4; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i*3)); done
