name: VESTRA — Alıcı sorularına otomatik yanıt (Les Garage)
on:
  schedule:
    - cron: '23 * * * *'   # saat başı (yalnızca default branch'te çalışır)
  workflow_dispatch:
    inputs:
      apply:
        description: "true = gerçekten gönder, false = sadece ne yapılacağını göster (kuru çalışma)"
        type: choice
        options: ['false', 'true']
        default: 'false'

permissions:
  contents: read

# Les Garage satıcı hesabına gelen, son mesajı ALICIDAN olan ve yanıtsız kalmış
# thread'leri tarar. Soru güvenli bir SSS kategorisine kesin olarak uyuyorsa
# (orijinallik / fatura / kargo / ödeme) hazır şablonla yanıtlar; uymuyorsa
# DOKUNMAZ ve "insan yanıtı bekliyor" listesinde raporlar.
#
# Güvenlik ağları:
#   - Yalnızca Les Garage'ın satıcı olduğu thread'ler (VESTRA Support hariç).
#   - Yalnızca son 7 gün içinde mesaj almış thread'ler (eski konulara yazmaz).
#   - Koşu başına en fazla 10 yanıt.
#   - Göndermeden önce data/messages.json yedeği alınır.
#   - vestra_msg_send() imzası çalışma anında doğrulanır; imza güvenle
#     eşleştirilemezse HİÇBİR ŞEY gönderilmez, imza rapora dökülür.
#   - Bir thread'e yanıt verilince son mesaj satıcıdan olur; sonraki koşular
#     o thread'i doğal olarak atlar (çift yanıt yok).
jobs:
  reply:
    runs-on: ubuntu-latest
    env:
      APPLY: ${{ github.event_name == 'schedule' && 'true' || inputs.apply }}
      SELLER_NAME: Les Garage
    steps:
      - name: Yanıtla
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          envs: APPLY,SELLER_NAME
          script: |
            cat > /tmp/auto_reply.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            $APPLY  = ($argv[1] ?? 'false') === 'true';
            $SELLER = $argv[2] ?? 'Les Garage';
            $LOOKBACK_DAYS = 7;
            $MAX_REPLIES   = 10;

            $home = getenv("HOME");
            $doc  = $home."/public_html";
            require $doc."/inc/auth.php";
            require $doc."/inc/notify.php";
            require $doc."/inc/messages.php";

            echo $APPLY ? "=== MOD: GERÇEK GÖNDERİM ===\n\n" : "=== MOD: KURU ÇALIŞMA (hiçbir şey gönderilmez) ===\n\n";

            // ── Les Garage satıcı hesabını çöz ──
            $sellerUid = null;
            foreach (auth_accounts() as $a) {
              $label = trim((string)($a['company'] ?? ''));
              if ($label === '') $label = trim((string)($a['name'] ?? ''));
              if (strcasecmp($label, $SELLER) === 0) { $sellerUid = (string)($a['id'] ?? ''); break; }
            }
            if ($sellerUid === null || $sellerUid === '') {
              fwrite(STDERR, "HATA: '{$SELLER}' adlı hesap bulunamadı. Mevcut hesaplar:\n");
              foreach (auth_accounts() as $a)
                fwrite(STDERR, "  - ".(($a['company'] ?? '') ?: ($a['name'] ?? '(isimsiz)'))." (id=".($a['id'] ?? '?').")\n");
              exit(1);
            }
            echo "Satıcı: {$SELLER} (uid={$sellerUid})\n\n";

            // ── SSS kategorileri: kural → hazır yanıt ──
            $SIGN = "\n\n— ".$SELLER;
            $RULES = [
              'authenticity' => '/\b(authentic|original|genuine|fake|counterfeit|legit|echt|orijinal|f[äa]lschung|sahte)/iu',
              'invoice'      => '/\b(invoice|receipt|rechnung|fatura|documentation|belge)/iu',
              'shipping'     => '/\b(ship|shipping|deliver|delivery|versand|liefer|kargo|teslim|arriv|dispatch)/iu',
              'payment'      => '/\b(payment|paypal|bank transfer|iban|zahlung|[öo]deme)/iu',
            ];
            $TEMPLATES = [
              'authenticity' => "Thank you for asking - it's exactly the right question. Every item we list is 100% original: we source exclusively from EEA distribution stock, and each batch comes with a complete invoice trail, which we can share for your order on request. The EU sales invoice you receive with your order is also fully sufficient for resale. And you don't have to take our word for it - once you receive the items, you're welcome to have them authenticated anywhere you like, from any independent authentication service to a brand boutique of your choice.",
              'invoice'      => "Yes - every batch comes with a complete EEA invoice trail, and the EU sales invoice you receive with your order is fully sufficient for resale. We share the relevant documentation together with your order; if you'd like to see it beforehand, just tell us which listing you're interested in.",
              'shipping'     => "We ship from EEA stock with tracked courier delivery. The exact transit time depends on your destination - tell us your country and we'll confirm the timeline for this listing right away.",
              'payment'      => "Payment options are shown at checkout for each listing. If you need a specific method or a pro-forma invoice first, tell us and we'll confirm what's possible for your order.",
            ];

            function classify(string $text, array $rules): ?string {
              foreach ($rules as $cat => $re) if (preg_match($re, $text)) return $cat;
              return null;
            }

            // ── vestra_msg_send imzasını güvenle eşle ──
            if (!function_exists('vestra_msg_send')) {
              fwrite(STDERR, "HATA: vestra_msg_send() tanımlı değil.\n"); exit(1);
            }
            $ref = new ReflectionFunction('vestra_msg_send');
            $sig = []; $mapped = []; $ok = true;
            foreach ($ref->getParameters() as $p) {
              $n = $p->getName(); $sig[] = '$'.$n.($p->isOptional() ? '?' : '');
              if (preg_match('/thread|^tid$|^t$/i', $n))            $mapped[$n] = 'THREAD';
              elseif (preg_match('/from|sender|uid|author/i', $n))  $mapped[$n] = 'FROM';
              elseif (preg_match('/text|body|message|msg|content/i', $n)) $mapped[$n] = 'TEXT';
              elseif ($p->isOptional())                             $mapped[$n] = 'SKIP';
              else $ok = false;
            }
            echo "vestra_msg_send imzası: (".implode(', ', $sig).")\n";
            if (!$ok || !in_array('THREAD', $mapped, true) || !in_array('FROM', $mapped, true) || !in_array('TEXT', $mapped, true)) {
              fwrite(STDERR, "İmza güvenle eşleştirilemedi — HİÇBİR ŞEY GÖNDERİLMEDİ. Yukarıdaki imzaya göre script güncellenmeli.\n");
              exit($APPLY ? 1 : 0);
            }

            function send_reply(array $t, string $fromUid, string $text, array $mapped): void {
              $args = [];
              foreach ($mapped as $n => $role) {
                if ($role === 'THREAD') $args[] = preg_match('/id/i', $n) ? (string)($t['id'] ?? '') : $t;
                elseif ($role === 'FROM') $args[] = $fromUid;
                elseif ($role === 'TEXT') $args[] = $text;
                else break; // opsiyonellerin varsayılanları kullanılsın
              }
              vestra_msg_send(...$args);
            }

            // ── thread'leri tara ──
            $threads = vestra_msg_threads();
            $cutoff = time() - $LOOKBACK_DAYS * 86400;
            $sent = 0; $needsHuman = []; $backedUp = false;

            foreach ($threads as $t) {
              if ((string)($t['seller_uid'] ?? '') !== $sellerUid) continue;
              if (defined('VESTRA_SUPPORT_UID') && (string)($t['buyer_uid'] ?? '') === VESTRA_SUPPORT_UID) continue;
              $msgs = $t['messages'] ?? [];
              $last = end($msgs);
              if (!$last || ($last['from'] ?? '') !== 'buyer') continue;           // yanıtsız alıcı mesajı değil
              if (strtotime($t['last_at'] ?? '1970-01-01') < $cutoff) continue;    // eski konu, dokunma
              $text = trim((string)($last['text'] ?? ''));
              if ($text === '') continue;

              $tid = $t['id'] ?? '?'; $lst = $t['listing_id'] ?? '?';
              $cat = classify($text, $RULES);
              $excerpt = mb_substr($text, 0, 80);

              if ($cat === null) {
                $needsHuman[] = "thread {$tid} (listing {$lst}): \"{$excerpt}\"";
                continue;
              }
              if ($sent >= $MAX_REPLIES) { $needsHuman[] = "thread {$tid}: limit doldu, sonraki koşuda"; continue; }

              $reply = $TEMPLATES[$cat].$SIGN;
              echo "→ thread {$tid} | listing {$lst} | kategori: {$cat}\n";
              echo "  soru: \"{$excerpt}\"\n";

              if ($APPLY) {
                if (!$backedUp) {
                  $src = $doc."/data/messages.json";
                  if (is_file($src)) { copy($src, $src.".bak-".date('YmdHi')); echo "  (yedek alındı: messages.json.bak-".date('YmdHi').")\n"; }
                  $backedUp = true;
                }
                try {
                  send_reply($t, $sellerUid, $reply, $mapped);
                  echo "  ✓ gönderildi\n";
                  $sent++;
                } catch (Throwable $e) {
                  fwrite(STDERR, "  ✗ gönderilemedi: ".$e->getMessage()."\n");
                }
              } else {
                echo "  (kuru çalışma — gönderilecek yanıt: ".mb_substr($reply, 0, 70)."…)\n";
                $sent++;
              }
              echo "\n";
            }

            echo "===== ÖZET =====\n";
            echo ($APPLY ? "Gönderilen" : "Gönderilecek")." yanıt: {$sent}\n";
            if ($needsHuman) {
              echo "İnsan yanıtı bekleyen ".count($needsHuman)." mesaj:\n";
              foreach ($needsHuman as $n) echo "  • {$n}\n";
            } else {
              echo "İnsan yanıtı bekleyen mesaj yok.\n";
            }
            PHPEOF
            php -l /tmp/auto_reply.php
            php /tmp/auto_reply.php "$APPLY" "$SELLER_NAME"
            rm -f /tmp/auto_reply.php
