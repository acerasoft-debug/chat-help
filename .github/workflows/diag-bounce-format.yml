name: (Salt-okunur) Teslim hatası bildirimlerinin biçimi ve sebebi
# 11 Eki 2026 (operatör: "neden böyle hata e-mailleri geliyor" — Titan webmail'de "Message Delivery Failure").
# Geri dönme tarayıcısı (mailbox-send.yml bounces) 59 mektupta 1 bildirime benzeyen buldu ama adres çıkaramadı.
# SALT-OKUNUR: support@ kutusunu readonly açar, hiçbir mektubu taşımaz/silmez; adresler maskeli basılır.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Kaç günlük"
        required: false
        default: "7"

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Oku
        env:
          MAILBOX_PASS: ${{ secrets.MAILBOX_PASS }}
          DAYS: ${{ github.event.inputs.days || '7' }}
          HOSTS: imap.secureserver.net imap.titan.email
        run: python3 scripts/ci/diag_bounce_format.py
