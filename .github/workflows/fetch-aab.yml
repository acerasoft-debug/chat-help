name: Fetch unsigned AAB into repo (temporary helper)

# GECICI: release'deki imzasiz .aab'yi repoya kopyalar ki sandbox terminali
# raw.githubusercontent uzerinden indirebilsin (release asset depolama hostu
# sandbox'in cikis politikasinda engelli). Imzalama bitince dosya + bu workflow
# silinecek.

on:
  push:
    paths: [".github/workflows/fetch-aab.yml"]
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release asset and commit into repo
        run: |
          curl -sL -o ChatHelp-unsigned.aab "https://github.com/acerasoft-debug/chat-help/releases/download/android-latest/ChatHelp-unsigned.aab"
          ls -la ChatHelp-unsigned.aab
          sha256sum ChatHelp-unsigned.aab
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ChatHelp-unsigned.aab
          git commit -m "Add unsigned AAB for terminal signing (temporary, will be removed)"
          git push
