name: (Tanı) VESTRA uygulaması kurulabilir mi — canlı, gerçek Chrome
# 14 Eki 2026 (operatör: "Vestra App indirilebiliyor mu kontrol et"). Salt okuma.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Dosyalar (manifest, service worker, simgeler, APK)
        run: |
          B=https://vestrasales.com; UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36"
          for p in "/manifest?lang=en" "/manifest?lang=de" "/manifest?lang=ar" "/manifest?app=admin" /sw.js /icon-192.png /icon-512.png /icon-192-maskable.png /icon-512-maskable.png /apple-touch-icon.png /app/vestra.apk; do
            out=$(curl -s -A "$UA" -o /tmp/f -w '%{http_code} %{content_type} %{size_download}' --max-time 30 "$B$p")
            extra=""; case "$p" in *.png) extra=$(file -b /tmp/f | cut -c1-40);; /manifest*) extra=$(python3 -c "import json;d=json.load(open('/tmp/f'));print('JSON ok ·',d.get('name'),'·',d.get('display'),'·',len(d.get('icons',[])),'ikon')" 2>&1 | tail -1);; esac
            printf '%-24s %s  %s\n' "$p" "$out" "$extra"
          done
      - name: Chrome kurulabilirlik denetimi
        run: |
          cd scripts/ci && npm i --silent --no-save playwright-core@1.48.2 >/dev/null 2>&1
          node pwa_check.mjs
