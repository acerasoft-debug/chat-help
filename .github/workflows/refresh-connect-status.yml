name: Stripe Connect durumunu kontrol et + önbelleği tazele
on:
  workflow_dispatch:
    inputs:
      query:
        description: "Hesap arama metni (company/name içinde, büyük/küçük harf önemsiz). '*' = stripe_account_id'si olan TÜM hesaplar"
        required: true
        default: "les garage"
      fix_schedule:
        description: "true = odeme semasi 'manual' OLMAYAN hesabi Stripe'ta manual'e cevir (escrow'un on kosulu). Varsayilan false: sadece raporla."
        required: false
        default: "false"
      set_invoice_name:
        description: "Eslesen TEK hesabin fatura unvanini (invoice_name) bu degere yaz. Bos = dokunma. YALNIZCA AD ALANLARI: banka/hesap numarasi buradan GECMEZ (depo ve loglar herkese acik)."
        required: false
        default: ""
      set_bank_holder:
        description: "Eslesen TEK hesabin IBAN yanindaki ismini (bank_holder) bu degere yaz. Bos = dokunma."
        required: false
        default: ""

permissions:
  contents: read

# Eslesen HER seller icin stripe_connect_status()'u CANLI cagirir (Stripe'a
# gercek bir API istegi) ve escrow_seller_ready($seller, true) ile ayni
# mantigi kullanarak escrow_ready onbellek bayragini tazeler -- webhook
# account.updated ile TAM AYNI kural (charges_enabled). Boylece sample-checkout
# ve wholesale escrow, bir sonraki istekte gecerli durumu hemen gorur; bir
# sonraki Stripe webhook'unu beklemeye gerek kalmaz.
# TEK yazma: sadece escrow_ready alani, SADECE deger gercekten degistiyse.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Kontrol et
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          script: |
            echo "ADIM 1: baglanti tamam"
            export Q='${{ github.event.inputs.query }}'
            export FIXSCHED='${{ github.event.inputs.fix_schedule }}'
            export SET_INVNAME='${{ github.event.inputs.set_invoice_name }}'
            export SET_HOLDER='${{ github.event.inputs.set_bank_holder }}'
            cat > /tmp/refresh_connect.php <<'PHPEOF'
            <?php
            ini_set('display_errors','1'); error_reporting(E_ALL);
            register_shutdown_function(function(){
              $e = error_get_last();
              if ($e && in_array($e['type'],[E_ERROR,E_PARSE,E_CORE_ERROR,E_COMPILE_ERROR],true))
                fwrite(STDERR, "PHP OLUMCUL: {$e['message']} ({$e['file']}:{$e['line']})\n");
            });
            $home = getenv("HOME");
            $doc  = $home."/public_html";
            require $doc."/inc/auth.php";
            require $doc."/inc/stripe.php";
            require $doc."/inc/escrow.php";

            $q = strtolower(trim((string)getenv("Q")));
            if ($q === '') { fwrite(STDERR, "HATA: arama metni bos\n"); exit(1); }

            /* FATURA/BANKA ADI DUZELTMESI (yalniz AD alanlari; numaralar bu
               yoldan asla gecmez -- depo ve Actions kutugu herkese acik).
               Yazma yalnizca sorgu TAM BIR hesapla eslesirse yapilir: gevsek
               bir sorguyla iki hesabin unvanini birden degistirmek olmaz.
               Yazilan deger GERI OKUNARAK dogrulanir (auth_update void doner;
               'kaydettim ama kaydolmamis' bu depoda daha once yasandi). */
            $setInv = trim((string)getenv('SET_INVNAME'));
            $setHold = trim((string)getenv('SET_HOLDER'));
            if ($setInv !== '' || $setHold !== '') {
              $hits = [];
              foreach (auth_accounts() as $a) {
                $hay = strtolower(($a['company']??'').' '.($a['name']??''));
                if ($q !== '*' && strpos($hay, $q) !== false) $hits[] = $a;
              }
              if (count($hits) !== 1) {
                fwrite(STDERR, "HATA: ad duzeltmesi icin sorgu TEK hesapla eslesmeli; '{$q}' ".count($hits)." hesapla eslesti. Hicbir sey yazilmadi.\n");
                exit(1);
              }
              $upd = [];
              if ($setInv  !== '') $upd['invoice_name'] = $setInv;
              if ($setHold !== '') $upd['bank_holder']  = $setHold;
              auth_update($hits[0]['id'], $upd);
              $back = null;
              foreach (auth_accounts() as $a) { if (($a['id']??'')===$hits[0]['id']) { $back = $a; break; } }
              foreach ($upd as $k => $v) {
                $gotV = trim((string)($back[$k] ?? ''));
                echo "AD DUZELTME: {$k} = \"{$gotV}\" ".($gotV === $v ? '(dogrulandi)' : '*** YAZILAMADI ***')."\n";
                if ($gotV !== $v) exit(1);
              }
              echo "\n";
            }

            $found = false;
            foreach (auth_accounts() as $a) {
              $hay = strtolower(($a['company']??'').' '.($a['name']??''));
              if ($q === '*') { if (empty($a['stripe_account_id'])) continue; }
              elseif (strpos($hay, $q) === false) continue;
              $found = true;
              echo "===== ".($a['company'] ?: $a['name'])." (id=".($a['id']??'?').") =====\n";
              echo "  email          = ".(($a['email']??'')!==''?$a['email']:'*** YOK ***')."\n";
              echo "  stripe_account_id = ".(!empty($a['stripe_account_id'])?$a['stripe_account_id']:'*** YOK ***')."\n";
              echo "  escrow_ready (onceki onbellek) = ".(!empty($a['escrow_ready'])?'true':'false')."\n";

              if (empty($a['stripe_account_id'])) {
                echo "  -> Connect hesabi hic olusturulmamis, canli kontrol atlaniyor.\n\n";
                continue;
              }

              $st = stripe_connect_status($a);
              echo "  --- CANLI Stripe durumu ---\n";
              echo "  charges_enabled   = ".(!empty($st['charges_enabled'])?'true':'false')."\n";
              echo "  payouts_enabled   = ".(!empty($st['payouts_enabled'])?'true':'false')."\n";
              echo "  details_submitted = ".(!empty($st['details_submitted'])?'true':'false')."\n";
              if (isset($st['error'])) echo "  HATA: ".$st['error']."\n";

              /* ODEME SEMASI — escrow'un gercek on kosulu. Stripe'in varsayilani
                 OTOMATIKtir: sema manual degilse Stripe her tahsilattan ~2 is gunu
                 sonra parayi saticiya KENDILIGINDEN oder ve alici onayi devre disi
                 kalir. escrow_ready bayragi bunu HIC kontrol etmiyor (yalnizca
                 charges_enabled) -- o yuzden burada canli okunup aciakca yaziliyor. */
              try {
                $acct = stripe_api('GET', '/v1/accounts/' . $a['stripe_account_id']);
                $ival = (string)($acct->settings->payouts->schedule->interval ?? '(okunamadi)');
                $ok   = ($ival === 'manual');
                echo "  payout schedule   = {$ival}".($ok?" (escrow icin DOGRU)":"  *** OTOMATIK: Stripe ~2 gun sonra kendisi oder — ESCROW DEVRE DISI ***")."\n";
                if (!$ok && strtolower(trim((string)getenv('FIXSCHED'))) === 'true') {
                  stripe_api('POST', '/v1/accounts/' . $a['stripe_account_id'],
                             ['settings' => ['payouts' => ['schedule' => ['interval' => 'manual']]]]);
                  $acct2 = stripe_api('GET', '/v1/accounts/' . $a['stripe_account_id']);
                  $ival2 = (string)($acct2->settings->payouts->schedule->interval ?? '?');
                  echo "  -> DUZELTILDI: schedule {$ival} -> {$ival2}\n";
                }
              } catch (\Throwable $e) {
                echo "  payout schedule   = OKUNAMADI: ".$e->getMessage()."\n";
              }

              // Ayni kural: webhook'un account.updated'da ve escrow_seller_ready($s,true)'nun
              // kullandigi TEK KISTAS -- charges_enabled. payouts_enabled/details_submitted
              // sadece bilgi amacli yukarida gosterildi.
              $readyNow = escrow_seller_ready($a, true); // CANLI kontrol + onbellegi TAZELER (degistiyse)
              echo "  -> escrow_ready (tazelendi) = ".($readyNow?'true':'false')."\n";
              echo "  -> Sample/escrow siparisleri artik ".($readyNow?"BU SATICIYA dogrudan gidecek.":"hala VESTRA platform hesabindan gececek.")."\n\n";
            }
            if (!$found) echo "*** '{$q}' ile eslesen hesap yok ***\n";
            PHPEOF
            php -l /tmp/refresh_connect.php
            php /tmp/refresh_connect.php
            rm -f /tmp/refresh_connect.php
