name: Zayıf fotoğraflı ürünlere internetten aday (çok parçalı)

on:
  workflow_dispatch:
    inputs:
      min_score:
        description: "diag/photoq/audit.json'da en az bu zayıflık puanı"
        required: true
        default: "30"
      shards:
        description: "Parça sayısı"
        required: true
        default: "40"
      only:
        description: "Yalnız bu ürün id'leri (virgülle, boş = puana göre hepsi)"
        required: false
        default: ""

permissions:
  contents: read

# Yer tutucu: asıl iş akışı claude/vestra-premium-retail-site-rxj4va dalında.
jobs:
  stub:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Bu iş akışını çalışma dalından başlatın."
