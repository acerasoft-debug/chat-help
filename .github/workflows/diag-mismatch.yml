name: (Salt-okunur) Ürüne ait olmayan kare avı

on:
  workflow_dispatch:

permissions:
  contents: write

# Bir ürünün kareleri renklerine göre birden çok kümeye ayrılıyorsa listeler
# (tools/audit-photo-mismatch.php): başka rengin ya da başka parçanın karesi.
# Araç sunucuda geçici bir klasörden (~/.sarvesto-audit) çalışır ve silinir;
# siteye ve data/ klasörüne hiçbir şey yazılmaz. Rapor ve kolajlar
# diag/mismatch/ altına dala işlenir.
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: PHP + GD
        run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli php-gd > /dev/null
      - name: Sunucuda denetle
        run: |
          set -e
          mkdir -p ~/.ssh diag/mismatch
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy; chmod 600 ~/.ssh/id_deploy
          SSHOPT="-i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -p ${{ secrets.DEPLOY_PORT || 22 }}"
          SRV="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          tar -cf - -C retail/tools audit-photo-mismatch.php | ssh $SSHOPT "$SRV" "rm -rf ~/.sarvesto-audit && mkdir -p ~/.sarvesto-audit && tar -xf - -C ~/.sarvesto-audit"
          ssh $SSHOPT "$SRV" "php -d memory_limit=1536M ~/.sarvesto-audit/audit-photo-mismatch.php --root=\$HOME/maxsales_de; rm -rf ~/.sarvesto-audit" > diag/mismatch/audit.json
          php -r '$a=json_decode(file_get_contents("diag/mismatch/audit.json"),true); echo $a["count"]," ürün\n";
            foreach($a["products"] as $p) foreach($p["rows"] as $r) echo $r["img"],"\n";' \
            | grep -E '^/uploads/[A-Za-z0-9._/-]+$' | sed 's#^/##' | sort -u > list.txt
          mkdir -p srv && ssh $SSHOPT "$SRV" "cd ~/maxsales_de && tar -cf - -T - 2>/dev/null" < list.txt | tar -xf - -C srv || true
      - name: Kolajlar
        run: |
          php -r '
          $a = json_decode(file_get_contents("diag/mismatch/audit.json"), true);
          $cw = 120; $ch = 150; $maxc = 10;
          foreach (array_chunk($a["products"], 10) as $pi => $chunk) {
            $s = imagecreatetruecolor(230 + $maxc * ($cw + 4), count($chunk) * ($ch + 30) + 6);
            imagefill($s, 0, 0, imagecolorallocate($s, 255, 255, 255)); $ink = imagecolorallocate($s, 0, 0, 0); $g = imagecolorallocate($s, 110, 110, 110); $red = imagecolorallocate($s, 200, 0, 0);
            foreach ($chunk as $ri => $p) {
              $y = 4 + $ri * ($ch + 30);
              imagestring($s, 3, 4, $y, substr($p["id"], 0, 30), $ink);
              imagestring($s, 2, 4, $y + 16, substr($p["name"], 0, 34), $g);
              imagestring($s, 2, 4, $y + 30, substr("renk: " . implode(",", $p["colours"]), 0, 34), $g);
              foreach (array_slice($p["rows"], 0, $maxc) as $i => $r) {
                $x = 230 + $i * ($cw + 4);
                $im = @imagecreatefromstring((string)@file_get_contents("srv" . $r["img"]));
                if ($im) { $sc = min($cw / imagesx($im), $ch / imagesy($im)); imagecopyresampled($s, $im, $x, $y, 0, 0, (int)(imagesx($im) * $sc), (int)(imagesy($im) * $sc), imagesx($im), imagesy($im)); }
                if ($r["c"]) { [$cr, $cg, $cb] = sscanf($r["c"], "#%02x%02x%02x"); imagefilledrectangle($s, $x, $y + $ch + 2, $x + 14, $y + $ch + 14, imagecolorallocate($s, $cr, $cg, $cb)); }
                $lab = ($i + 1) . " k" . ($r["k"] === null ? "-" : $r["k"]) . ($r["img"] === $p["card"] ? " KART" : "");
                imagestring($s, 2, $x + 18, $y + $ch + 1, $lab, $r["img"] === $p["card"] ? $red : $ink);
                imagestring($s, 1, $x, $y + $ch + 16, substr(basename($r["img"]), 0, 24), $g);
              }
            }
            imagejpeg($s, sprintf("diag/mismatch/m-%02d.jpg", $pi + 1), 80);
          }'
          ls diag/mismatch | head -30
      - name: Dala işle
        run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add -f diag/mismatch
          git diff --cached --quiet && exit 0
          git commit -q -m "Teşhis: ürüne ait olmayan kare avı (rapor + kolajlar)"
          for i in 1 2 3 4; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i*3)); done
