name: Stimmen prüfen (Piper – Lizenz, Tonhöhe, Browser-Test)

# Vorübergehend: prüft Stimmen und die Browser-Sprachausgabe (chat/voice) auf einem Runner (Hugging Face erreichbar).
# Läuft nur bei Änderungen an tools/voice-check/, chat/voice/ oder dieser Datei; berührt den Server nicht.
on:
  push:
    branches: [claude/chat-help-system-video-x0nofb]
    paths: [tools/voice-check/**, chat/voice/**, .github/workflows/voice-check.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -q piper-tts==1.8.0 praat-parselmouth==0.4.7
      - name: Alle Stimmen der Zielsprachen
        run: python tools/voice-check/list.py
      - name: Browser-Stimmen vorbereiten
        run: tools/voice-check/browser-setup.sh
      - name: Browser-Test (Chromium)
        run: |
          (cd /tmp/site && python -m http.server 8099 >/tmp/http.log 2>&1 &)
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -q playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cp $GITHUB_WORKSPACE/tools/voice-check/browser.mjs /tmp/pw/ && node /tmp/pw/browser.mjs $GITHUB_WORKSPACE/out
          python - <<'P'
          import glob, statistics, parselmouth
          for f in sorted(glob.glob('out/browser_*.wav')):
              s = parselmouth.Sound(f); v = [x for x in s.to_pitch(0.01, 60, 420).selected_array['frequency'] if x > 0]
              print('%-40s f0=%3d Hz  %.1f/%.1f s' % (f, statistics.median(v) if v else 0, s.duration, len(v) * .01))
          P
          tail -5 /tmp/http.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-samples
          path: out
          retention-days: 7
