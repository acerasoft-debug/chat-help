<style>
/* ChatHelp Studio — Panel „Einrichtung“ (Onboarding-Assistent). Nutzt die Studio-Tokens (--ink, --gold …). Alles unter #onb. */
#onb{max-width:760px;margin:0 auto}
#onb .onb-switch{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
#onb .onb-switch button{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:7px 12px;font:600 12.5px var(--sans);color:var(--ink2);cursor:pointer}
#onb .onb-switch button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#onb .onb-switch button .st{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--gold2);vertical-align:middle}
#onb .onb-switch button .st.done{background:var(--ok)}
#onb .onb-card{background:var(--sur);border:1px solid var(--line);border-radius:26px;box-shadow:var(--sh2);overflow:hidden;position:relative}
#onb .onb-head{display:flex;align-items:center;gap:16px;padding:22px 26px 0}
#onb .onb-ring{position:relative;width:58px;height:58px;flex:0 0 auto}
#onb .onb-ring svg{transform:rotate(-90deg);display:block}
#onb .onb-ring circle{fill:none;stroke-width:5}
#onb .onb-ring .bg{stroke:var(--sur2)}
#onb .onb-ring .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.2,.7,.2,1)}
#onb .onb-ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 13px var(--sans);color:var(--ink)}
#onb .onb-meta{flex:1;min-width:0}
#onb .onb-meta .k{font:600 11px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--gold)}
#onb .onb-meta .n{color:var(--mute);font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#onb .onb-saved{font-size:12px;color:var(--ok);opacity:0;transition:opacity .25s;white-space:nowrap}
#onb .onb-saved.on{opacity:1}
#onb .onb-body{padding:18px 26px 6px;min-height:260px}
#onb .onb-body.anim{animation:onbIn .32s cubic-bezier(.2,.7,.2,1)}
#onb .onb-body.back{animation:onbBack .32s cubic-bezier(.2,.7,.2,1)}
@keyframes onbIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes onbBack{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#onb .onb-body.anim,#onb .onb-body.back{animation:none}}
#onb h2.q{font:600 clamp(24px,3.6vw,31px)/1.18 var(--serif);letter-spacing:-.015em;margin:0}
#onb p.sub{color:var(--ink2);margin:10px 0 0;font-size:15px;max-width:60ch}
#onb .onb-in{margin-top:20px}
#onb .onb-in input[type=text],#onb .onb-in input[type=tel],#onb .onb-in input[type=url],#onb .onb-in input[type=email],#onb .onb-in input[type=password],#onb .onb-in select,#onb .onb-in textarea{width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--line2);background:#fff;color:var(--ink);font:inherit;outline:0}
#onb .onb-in .big{font-size:19px;padding:15px 17px}
#onb .onb-in textarea{min-height:130px;resize:vertical}
#onb .onb-in input:focus,#onb .onb-in select:focus,#onb .onb-in textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(184,134,43,.13)}
#onb .onb-in input[type=time]{padding:9px 8px;border-radius:11px;border:1px solid var(--line2);font:600 14px var(--sans);color:var(--ink);background:#fff;min-width:0;width:100%}
#onb .opts{display:grid;gap:10px}
#onb .opts.two{grid-template-columns:1fr 1fr}
#onb .opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font:inherit;color:var(--ink);transition:border-color .15s,box-shadow .15s,background .15s}
#onb .opt:hover{border-color:#cfd3df}
#onb .opt .bx{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);flex:0 0 auto;margin-top:1px;display:grid;place-items:center;transition:.15s}
#onb .opt.multi .bx{border-radius:7px}
#onb .opt b{display:block;font-size:15.5px}
#onb .opt span.d{display:block;color:var(--mute);font-size:13px;margin-top:2px}
#onb .opt.on{border-color:var(--gold);background:#fffaf0;box-shadow:0 0 0 3px rgba(184,134,43,.10)}
#onb .opt.on .bx{border-color:var(--gold);background:var(--gold);color:#fff}
#onb .opt.on .bx::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
#onb .chipset{display:flex;flex-wrap:wrap;gap:8px}
#onb .chipset .c{border:1.5px solid var(--line2);background:#fff;border-radius:999px;padding:9px 14px;font:600 13.5px var(--sans);color:var(--ink2);cursor:pointer;transition:.15s}
#onb .chipset .c:hover{border-color:var(--gold2)}
#onb .chipset .c.on{background:var(--ink);border-color:var(--ink);color:#fff}
#onb .chipset .c.add{border-style:dashed;color:var(--gold);background:transparent}
#onb .free{display:flex;gap:8px;margin-top:12px}
#onb .free input{flex:1}
#onb .lbl{font:600 12.5px var(--sans);color:var(--mute);margin:16px 0 8px;display:block}
/* Öffnungszeiten */
#onb .hours{display:grid;gap:8px}
#onb .hrow{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
#onb .hrow:last-child{border-bottom:0}
#onb .hday{border:1.5px solid var(--line2);background:#fff;border-radius:12px;padding:9px 0;font:700 14px var(--sans);color:var(--mute);cursor:pointer;width:56px}
#onb .hday.on{background:var(--ink);border-color:var(--ink);color:#fff}
#onb .hr{display:flex;flex-direction:column;gap:6px;min-width:0}
#onb .hiv{display:grid;grid-template-columns:minmax(0,1fr) 12px minmax(0,1fr) 34px;gap:6px;align-items:center;max-width:420px}
#onb .hiv i{font-style:normal;color:var(--mute);text-align:center}
#onb .hx{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--mute);cursor:pointer;font-size:16px;line-height:1}
#onb .hclosed{color:var(--mute2);font-size:14px;padding:9px 0}
#onb .hadd{background:transparent;border:0;color:var(--gold);font:600 12.5px var(--sans);cursor:pointer;padding:2px 0;text-align:left}
/* Wiederholbare Zeilen */
#onb .rows{display:grid;gap:10px}
#onb .rw{position:relative;border:1px solid var(--line);border-radius:16px;padding:12px 46px 12px 12px;background:var(--sur2)}
#onb .rw .g{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
#onb .rw .g .f{min-width:0;grid-column:span 1}
#onb .rw .g .f.w2{grid-column:span 2}#onb .rw .g .f.w3{grid-column:span 3}#onb .rw .g .f.w4{grid-column:span 4}#onb .rw .g .f.w5{grid-column:1/-1}
#onb .rw .g label{display:block;font:600 11px var(--sans);color:var(--mute);margin:0 0 4px;letter-spacing:.02em}
#onb .rw .g input,#onb .rw .g textarea{padding:10px 11px;border-radius:11px;font-size:14.5px}
#onb .rw .g textarea{min-height:64px}
#onb .rw .del{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--mute);cursor:pointer;font-size:16px}
#onb .rw .del:hover{color:var(--rose);border-color:#f7c6d5}
#onb .suf{position:relative}
#onb .suf input{padding-right:40px !important}
#onb .suf em{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--mute);font-size:13px;pointer-events:none}
#onb .addrow{margin-top:10px;width:100%;border:1.5px dashed var(--line2);background:transparent;border-radius:14px;padding:12px;font:600 14px var(--sans);color:var(--ink2);cursor:pointer}
#onb .addrow:hover{border-color:var(--gold);color:var(--gold)}
#onb .presets{margin-top:12px}
/* Felder */
#onb .fields{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
#onb .fields .f.full{grid-column:1/-1}
#onb .fields label{display:block;font:600 12.5px var(--sans);color:var(--mute);margin:12px 0 6px}
/* Website-Import */
#onb .imp{display:flex;gap:8px}
#onb .imp input{flex:1}
#onb .impst{margin-top:12px;border-radius:14px;padding:12px 14px;font-size:14px;display:none}
#onb .impst.on{display:block}
#onb .impst.run{background:var(--indigol);color:#3730a3}
#onb .impst.ok{background:var(--okl);color:#15703f}
#onb .impst.err{background:var(--rosel);color:#9f2448}
#onb .bar{height:4px;border-radius:9px;background:rgba(79,70,229,.15);overflow:hidden;margin-top:8px}
#onb .bar i{display:block;height:4px;width:35%;background:var(--indigo);border-radius:9px;animation:onbBar 1.2s ease-in-out infinite}
@keyframes onbBar{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
/* Fuß */
#onb .onb-err{margin:0 26px;color:#9f2448;background:var(--rosel);border-radius:12px;padding:10px 12px;font-size:13.5px;display:none}
#onb .onb-err.on{display:block}
#onb .onb-foot{display:flex;align-items:center;gap:10px;padding:18px 26px 22px}
#onb .onb-foot .sp{flex:1}
#onb .onb-foot .btn{padding:13px 20px;border-radius:14px;font-size:15px}
#onb .onb-foot .btn.p{min-width:150px}
#onb .onb-foot .skip{background:transparent;border:0;color:var(--mute);font:600 14px var(--sans);cursor:pointer;padding:10px 6px}
#onb .onb-foot .skip:hover{color:var(--ink)}
#onb .kbd{color:var(--mute2);font-size:12px;text-align:center;margin:12px 0 0}
#onb .kbd kbd{font:600 11px var(--sans);border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:#fff;color:var(--ink2)}
/* Intro + Fertig */
#onb .hero{padding:30px 26px 6px}
#onb .hero .ic{width:64px;height:64px;border-radius:22px;background:linear-gradient(135deg,#f3dfa6,#c9972f);display:grid;place-items:center;color:#1a1407;box-shadow:0 10px 30px rgba(184,134,43,.28)}
#onb .hero h2{font:600 clamp(28px,4.4vw,38px)/1.1 var(--serif);margin:18px 0 0;letter-spacing:-.02em}
#onb .hero p{color:var(--ink2);font-size:16px;margin:12px 0 0;max-width:58ch}
#onb .ilist{margin:20px 0 0;padding:0;list-style:none;display:grid;gap:10px}
#onb .ilist li{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;color:var(--ink2)}
#onb .ilist li i{width:28px;height:28px;border-radius:10px;background:var(--goldl);color:var(--gold);display:grid;place-items:center;font-style:normal;font-weight:800;flex:0 0 auto;font-size:13px}
#onb .note{margin-top:18px;padding:12px 14px;border-radius:14px;background:var(--okl);color:#15703f;font-size:13.5px}
#onb .checks{display:grid;gap:10px;padding:8px 26px 4px}
#onb .ck{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff}
#onb .ck .m{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;font:700 13px var(--sans)}
#onb .ck.done .m{background:var(--okl);color:var(--ok)}
#onb .ck.todo .m{background:var(--goldl);color:var(--gold)}
#onb .ck.info .m{background:var(--indigol);color:var(--indigo)}
#onb .ck b{display:block;font-size:15px}
#onb .ck .t{flex:1;min-width:0}
#onb .ck .t p{margin:3px 0 0;color:var(--ink2);font-size:13.5px;overflow-wrap:anywhere}
#onb .ck .t ol{margin:8px 0 0;padding-left:18px;color:var(--ink2);font-size:13px;line-height:1.6;overflow-wrap:anywhere}
#onb .ck .pill2{font:600 11px var(--sans);border-radius:999px;padding:3px 8px;margin-left:6px;vertical-align:middle}
#onb .ck.done .pill2{background:var(--okl);color:var(--ok)}
#onb .ck.todo .pill2{background:var(--goldl);color:var(--gold)}
#onb .ck .snip{margin-top:8px}
#onb .cklink{display:inline-block;margin-top:6px;font:600 13px var(--sans);color:var(--gold)}
#onb .btn:focus-visible,#onb .opt:focus-visible,#onb .c:focus-visible,#onb .hday:focus-visible,#onb .act:focus-visible,#onb .skip:focus-visible{outline:3px solid rgba(184,134,43,.45);outline-offset:2px}
#onb .acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:16px 26px 6px}
#onb .act{display:flex;align-items:center;gap:10px;padding:14px;border-radius:16px;border:1px solid var(--line2);background:#fff;color:var(--ink);font:600 14px var(--sans);cursor:pointer;text-decoration:none;text-align:left;transition:.15s}
#onb .act:hover{border-color:var(--gold);box-shadow:var(--sh1)}
#onb .act.p{background:var(--ink);color:#fff;border-color:var(--ink)}
#onb .act svg{flex:0 0 auto}
#onb .onb-empty{padding:34px 26px;text-align:center}
@media (max-width:640px){
  #onb .onb-head{padding:16px 18px 0;gap:12px}
  #onb .onb-ring{width:48px;height:48px}
  #onb .onb-ring svg{width:48px;height:48px}
  #onb .onb-body{padding:14px 18px 4px;min-height:0}
  #onb .hero{padding:24px 18px 4px}
  #onb .checks,#onb .acts{padding-left:18px;padding-right:18px}
  #onb .acts{grid-template-columns:1fr 1fr}
  #onb .onb-err{margin:0 18px}
  #onb .onb-foot{position:sticky;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));gap:8px}
  #onb .onb-foot .btn{padding:13px 14px}
  #onb .onb-foot .btn.p{min-width:0;flex:1}
  #onb .opts.two{grid-template-columns:1fr}
  #onb .fields{grid-template-columns:1fr}
  #onb .rw .g{grid-template-columns:1fr 1fr}
  #onb .rw .g .f.w2,#onb .rw .g .f.w3,#onb .rw .g .f.w4{grid-column:1/-1}
  #onb .imp{flex-direction:column}
  #onb .kbd{display:none}
  #onb .hide-s{display:none}
  #onb .hrow{grid-template-columns:48px 1fr;gap:8px}
  #onb .hday{width:48px;font-size:13px}
  #onb .hiv{grid-template-columns:minmax(0,1fr) 10px minmax(0,1fr) 30px;gap:4px}
  #onb .hx{width:30px;height:30px}
  #onb .onb-in input[type=time]{padding:9px 4px;font-size:13.5px;text-align:center}
  #onb .onb-in input[type=time]::-webkit-calendar-picker-indicator{display:none}
  #onb .donefoot .btn{flex:1 1 0;min-width:0;white-space:normal;padding:12px 10px;font-size:13.5px}
  #onb .donefoot .sp{display:none}
}
</style>
<div id="onb">
  <div class="onb-switch hidden" id="onbSwitch" role="tablist" aria-label="Einrichtungen" data-i18n-attr="aria-label:onb.einrichtungen"></div>
  <div class="onb-card" id="onbCard"><div class="onb-empty mute" data-i18n="onb.einrichtung_wird_geladen">Einrichtung wird geladen …</div></div>
  <p class="kbd" id="onbKbd" data-i18n-html="onb.enter_weiter_shift_tab"><kbd>Enter</kbd> weiter · <kbd>Shift</kbd> + <kbd>Tab</kbd> zurück · jede Antwort wird sofort gespeichert</p>
</div>
