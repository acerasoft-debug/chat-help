<style>
#adRoot{min-width:0;--c-one:#4f46e5}
#adRoot button:focus-visible,#adRoot a:focus-visible,#adRoot input:focus-visible,#adRoot select:focus-visible,#adRoot textarea:focus-visible{outline:3px solid rgba(184,134,43,.55);outline-offset:2px}
#adRoot .ad-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
#adRoot .ad-head h2{font-size:28px;margin-top:8px}#adRoot .ad-head p{margin:6px 0 0;color:var(--ink2)}
#adRoot .ad-nav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line)}
#adRoot .ad-nav button{min-height:44px;padding:8px 14px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--ink2);font:600 14px var(--sans);cursor:pointer;margin-bottom:-1px}
#adRoot .ad-nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
#adRoot .ad-seg{display:inline-flex;background:var(--sur2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
#adRoot .ad-seg button{min-height:36px;padding:5px 12px;border:0;border-radius:999px;background:transparent;color:var(--ink2);font:600 13px var(--sans);cursor:pointer}
#adRoot .ad-seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,18,34,.12)}
#adRoot .ad-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
#adRoot .ad-kpi{background:var(--sur);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh1);min-width:0}
#adRoot .ad-kpi .l{font:600 12px var(--sans);color:var(--ink2)}#adRoot .ad-kpi .v{font:700 24px/1.15 var(--sans);margin:6px 0 2px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
#adRoot .ad-kpi .s{font-size:11.5px;color:var(--mute);line-height:1.35}
#adRoot .ad-delta{display:inline-block;font:700 11px var(--sans);padding:1px 6px;border-radius:999px;background:var(--sur2);color:var(--ink2);margin-left:4px}
#adRoot .ad-delta.up{background:var(--okl);color:#11703f}#adRoot .ad-delta.down{background:var(--rosel);color:#a8204f}
#adRoot .ad-row{display:grid;gap:12px;margin-top:12px}
#adRoot .ad-r2{grid-template-columns:minmax(0,1fr) 320px}#adRoot .ad-r3{grid-template-columns:repeat(3,minmax(0,1fr))}
#adRoot .card{margin:0;min-width:0}
#adRoot .ad-ch{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}#adRoot .ad-ch h3{font-size:17px}
#adRoot .ad-tabs{display:flex;gap:4px;flex-wrap:wrap}
#adRoot .ad-tabs button{min-height:32px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink2);font:600 12px var(--sans);cursor:pointer}
#adRoot .ad-tabs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
#adRoot .ad-plot{position:relative}#adRoot .ad-plot svg{display:block;width:100%;height:auto;overflow:visible}
#adRoot .ad-plot .ax{font:11px var(--sans);fill:var(--mute)}#adRoot .ad-plot .gl{stroke:var(--line)}
#adRoot .ad-plot .band.on{fill:rgba(15,18,34,.04)}
#adRoot .ad-tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;padding:7px 10px;font-size:12px;transform:translate(-50%,-100%);white-space:nowrap;box-shadow:var(--sh2)}
#adRoot .ad-list{list-style:none;margin:0;padding:0}
#adRoot .ad-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
#adRoot .ad-list li:last-child{border-bottom:0}#adRoot .ad-list b{font-variant-numeric:tabular-nums}
#adRoot .ad-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:middle}
#adRoot .ad-bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:5px}#adRoot .ad-bar>div{height:7px;border-radius:99px;background:var(--c-one)}
#adRoot table.ad-t{width:100%;border-collapse:collapse;font-size:13px}
#adRoot table.ad-t th{font:600 11.5px var(--sans);color:var(--mute);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
#adRoot table.ad-t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
#adRoot table.ad-t td.n,#adRoot table.ad-t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#adRoot tr.ad-acc{cursor:pointer}#adRoot tr.ad-acc:hover td{background:var(--sur2)}
#adRoot .ad-pill{display:inline-block;padding:1px 7px;border-radius:999px;font:600 11px var(--sans);background:var(--sur2);color:var(--ink2);margin:1px 2px 1px 0;white-space:nowrap}
#adRoot .ad-pill.ok{background:var(--okl);color:#11703f}#adRoot .ad-pill.gold{background:var(--goldl);color:#7a5714}#adRoot .ad-pill.rose{background:var(--rosel);color:#a8204f}#adRoot .ad-pill.indigo{background:var(--indigol);color:var(--indigo)}
#adRoot .ad-fbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
#adRoot .ad-fbar input{flex:1 1 220px;min-height:44px;border-radius:12px;border:1px solid var(--line2);padding:0 12px;min-width:0}
#adRoot .ad-fbar select{min-height:44px;border-radius:12px;border:1px solid var(--line2);padding:0 10px;background:#fff}
#adRoot .ad-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
#adRoot .ad-chips button{min-height:36px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink2);font:600 12.5px var(--sans);cursor:pointer}
#adRoot .ad-chips button span{color:var(--mute);margin-left:4px}
#adRoot .ad-chips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}#adRoot .ad-chips button[aria-pressed="true"] span{color:rgba(255,255,255,.7)}
#adRoot .ad-empty{padding:22px 8px;text-align:center;color:var(--mute);font-size:13.5px}
#adRoot .ad-skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--sur2),#fff,var(--sur2));background-size:200% 100%;animation:adSh 1.2s infinite;margin:6px 0}
@keyframes adSh{to{background-position:-200% 0}}
#adDrawer{position:fixed;inset:0;z-index:60;display:flex;justify-content:flex-end}#adDrawer[hidden]{display:none}
#adDrawer .bk{position:absolute;inset:0;background:rgba(15,18,34,.38)}
#adDrawer .pn{position:relative;width:min(760px,100%);height:100%;background:var(--bg);overflow:auto;padding:18px 18px 30px;box-shadow:var(--sh2)}
#adDrawer .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}#adDrawer .hd h3{font-size:21px;overflow-wrap:anywhere}
#adDrawer .x{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px}
#adDrawer .sec{background:var(--sur);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
#adDrawer .sec h4{margin:0 0 8px;font:600 14px var(--sans)}
#adDrawer .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#adDrawer label{display:block;font-size:12.5px;color:var(--ink2)}
#adDrawer input,#adDrawer select,#adDrawer textarea{display:block;width:100%;min-height:44px;margin-top:4px;border-radius:10px;border:1px solid var(--line2);padding:8px 10px;font:inherit;background:#fff}
#adDrawer textarea{min-height:80px}
#adDrawer .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}#adDrawer .btns .btn{min-height:44px}
#adDrawer .kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
#adDrawer .kv div{background:var(--sur2);border-radius:12px;padding:10px}#adDrawer .kv b{display:block;font:700 18px/1.2 var(--sans);font-variant-numeric:tabular-nums}#adDrawer .kv span{font-size:11.5px;color:var(--mute)}
@media (max-width:1200px){#adRoot .ad-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}#adRoot .ad-r2{grid-template-columns:minmax(0,1fr)}#adRoot .ad-r3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){#adRoot .ad-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}#adRoot .ad-r3{grid-template-columns:minmax(0,1fr)}#adDrawer .grid2,#adDrawer .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  #adRoot table.ad-t .hm{display:none}}
@media (prefers-reduced-motion:reduce){#adRoot .ad-skel{animation:none}}
</style>
<div id="adRoot">
  <div class="ad-head"><div><span class="tag rose" id="adTag">Nur für dich sichtbar</span><h2 id="adTitle">Betreiber-Bereich</h2><p id="adSub"></p></div>
    <div class="ad-seg" role="group" id="adDays"><button type="button" data-d="7">7</button><button type="button" data-d="30" aria-pressed="true">30</button><button type="button" data-d="90">90</button></div></div>
  <div class="ad-nav" role="tablist" id="adNav">
    <button type="button" role="tab" data-s="ov" aria-selected="true" id="adNavOv"></button><button type="button" role="tab" data-s="acc" aria-selected="false" id="adNavAcc"></button>
    <button type="button" role="tab" data-s="log" aria-selected="false" id="adNavLog"></button><button type="button" role="tab" data-s="set" aria-selected="false" id="adNavSet"></button>
  </div>
  <div id="adOv"><div class="ad-kpis" id="adKpis"><div class="ad-kpi"><div class="ad-skel"></div><div class="ad-skel" style="width:60%;height:24px"></div></div></div>
    <div class="ad-row ad-r2"><section class="card"><div class="ad-ch"><h3 id="adChT"></h3><div class="ad-tabs" id="adMetric" role="group"></div></div><div class="ad-plot" id="adChart"></div></section>
      <section class="card"><div class="ad-ch"><h3 id="adHealthT"></h3></div><div id="adHealth"></div></section></div>
    <div class="ad-row ad-r3"><section class="card"><div class="ad-ch"><h3 id="adRevT"></h3></div><div id="adRev"></div></section>
      <section class="card"><div class="ad-ch"><h3 id="adCostT"></h3></div><div id="adCost"></div></section>
      <section class="card"><div class="ad-ch"><h3 id="adUseT"></h3></div><div id="adUse"></div></section></div>
  </div>
  <div id="adAcc" hidden><section class="card">
    <div class="ad-fbar"><input type="search" id="adQ" autocomplete="off"><select id="adSort"></select></div>
    <div class="ad-chips" id="adFilters" role="group"></div>
    <div style="overflow:auto"><table class="ad-t" id="adAccT"></table></div>
    <div style="display:flex;justify-content:center;margin-top:10px"><button class="btn s" type="button" id="adMore" hidden style="min-height:44px"></button></div></section></div>
  <div id="adLog" hidden><section class="card"><div style="overflow:auto"><table class="ad-t" id="adLogT"></table></div></section></div>
  <div id="adSet" hidden></div>
  <div id="adDrawer" hidden><div class="bk" data-close="1"></div><div class="pn" role="dialog" aria-modal="true" aria-labelledby="adDetT" id="adDet"></div></div>
</div>
