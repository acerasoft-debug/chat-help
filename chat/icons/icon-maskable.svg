<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- ChatHelp Business – maskierbares Symbol (purpose "maskable"): vollflächig, Glyphe in der Safe-Zone (Kreis 80 %). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232a52"/><stop offset="0.55" stop-color="#141831"/><stop offset="1" stop-color="#0b0d1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/><stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4a84a" stop-opacity="0.18"/><stop offset="1" stop-color="#d4a84a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="4" y1="3.5" x2="20" y2="20.5">
      <stop offset="0" stop-color="#F6E3AE"/><stop offset="0.5" stop-color="#D4A84A"/><stop offset="1" stop-color="#A9781C"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="165" fill="url(#halo)"/>
  <g transform="translate(256 256) scale(9.6) translate(-12 -12)">
