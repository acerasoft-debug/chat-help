<svg width="520" height="160" viewBox="0 0 520 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3D88A"/>
      <stop offset="0.45" stop-color="#D4A84A"/>
      <stop offset="1" stop-color="#B8862F"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E2A6"/>
      <stop offset="1" stop-color="#D4A84A"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background tile (anthracite) -->
  <rect width="520" height="160" rx="0" fill="#1b1b1e"/>

  <!-- Emblem: rounded square with chat bubble + paragraph mark -->
  <g filter="url(#soft)">
    <rect x="20" y="30" width="100" height="100" rx="26" fill="#222226" stroke="url(#gold)" stroke-width="2.5"/>
    <!-- chat bubble outline -->
    <path d="M44 56 h52 a10 10 0 0 1 10 10 v26 a10 10 0 0 1 -10 10 h-30 l-16 14 v-14 h-6 a10 10 0 0 1 -10 -10 v-26 a10 10 0 0 1 10 -10 z"
          fill="none" stroke="url(#gold)" stroke-width="3"/>
    <!-- paragraph § mark inside -->
    <text x="70" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700"
          fill="url(#goldText)" text-anchor="middle">&#167;</text>
  </g>

  <!-- Wordmark -->
  <text x="146" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#F4F4F8">Chat</text>
  <text x="262" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="url(#goldText)">Help</text>
  <!-- tagline -->
  <text x="148" y="116" font-family="'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="3" fill="#8e8e9c">RECHT · EINFACH · DIGITAL</text>
</svg>
