<svg width="520" height="160" viewBox="0 0 520 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g2gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3D88A"/>
      <stop offset="0.5" stop-color="#D4A84A"/>
      <stop offset="1" stop-color="#B0801F"/>
    </linearGradient>
    <linearGradient id="g2txt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E2A6"/>
      <stop offset="1" stop-color="#D4A84A"/>
    </linearGradient>
  </defs>

  <rect width="520" height="160" fill="#1b1b1e"/>

  <!-- Circular monogram CH -->
  <circle cx="78" cy="80" r="52" fill="#222226" stroke="url(#g2gold)" stroke-width="3"/>
  <circle cx="78" cy="80" r="44" fill="none" stroke="url(#g2gold)" stroke-width="0.8" opacity="0.4"/>
  <!-- C and H interlocked -->
  <text x="78" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700"
        fill="url(#g2txt)" text-anchor="middle">CH</text>

  <!-- Wordmark stacked -->
  <text x="150" y="76" font-family="'Segoe UI', Arial, sans-serif" font-size="44" font-weight="800" fill="#F4F4F8" letter-spacing="-1">Chat<tspan fill="url(#g2txt)">Help</tspan></text>
  <text x="152" y="106" font-family="'Segoe UI', Arial, sans-serif" font-size="14" letter-spacing="4" fill="#8e8e9c">JURISTISCHE DOKUMENTE · KI</text>
</svg>
