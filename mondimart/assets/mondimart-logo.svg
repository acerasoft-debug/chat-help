<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" fill="none" role="img" aria-label="Mondimart — Supermarché du Monde">
  <title>Mondimart</title>

  <!-- Globe mark — subtle fill + meridians -->
  <circle cx="40" cy="40" r="28" fill="rgba(26,60,26,0.06)" stroke="#C8A84B" stroke-width="1.8"/>
  <ellipse cx="40" cy="40" rx="14" ry="28" stroke="#C8A84B" stroke-width="1.2" fill="none"/>
  <line x1="12" y1="40" x2="68" y2="40" stroke="#C8A84B" stroke-width="1.3"/>
  <line x1="16" y1="28" x2="64" y2="28" stroke="#C8A84B" stroke-width="0.85"/>
  <line x1="16" y1="52" x2="64" y2="52" stroke="#C8A84B" stroke-width="0.85"/>

  <!-- Single <text> with tspan — seamless two-color wordmark -->
  <text x="80" y="51"
    font-family="'Fraunces','Playfair Display',Georgia,serif"
    font-size="35" letter-spacing="-0.8">
    <tspan font-weight="500" fill="#1A3C1A">Mondi</tspan><tspan font-weight="400" font-style="italic" fill="#C8A84B">mart</tspan>
  </text>

  <!-- Thin gold rule under wordmark -->
  <line x1="80" y1="57" x2="268" y2="57" stroke="#C8A84B" stroke-width="0.7" opacity="0.45"/>

  <!-- Tagline -->
  <text x="80" y="71"
    font-family="'Manrope','Helvetica Neue',Arial,sans-serif"
    font-size="7.8" font-weight="700" fill="#1A3C1A" opacity="0.38" letter-spacing="3.5">SUPERMARCHÉ DU MONDE</text>
</svg>
