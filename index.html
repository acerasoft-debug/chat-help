<!DOCTYPE html>
<!--
  chat-help.com  →  chat-help.com/chat/  yönlendirmesi
  Web köküne (html/index.html) yüklenir. Dosyalar /chat/ altında olduğu için.
-->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- Anında yönlendir -->
<meta http-equiv="refresh" content="0; url=/chat/">
<title>ChatHelp — Weiterleitung…</title>
<link rel="canonical" href="https://chat-help.com/chat/">
<script>
  // JS ile de yönlendir (en hızlısı, geçmişe kayıt bırakmaz)
  location.replace('/chat/');
</script>
<style>
  html,body{height:100%;margin:0;background:#07070e;color:#d4a84a;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px}
  .logo{font-size:26px;font-weight:800;letter-spacing:-.5px}
  .logo span{color:#fff}
  .sp{width:30px;height:30px;border:3px solid rgba(212,168,74,.25);
    border-top-color:#d4a84a;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  a{color:#d4a84a}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><span>Chat</span>Help</div>
  <div class="sp"></div>
  <noscript><p><a href="/chat/">Weiter zu ChatHelp →</a></p></noscript>
</div>
</body>
</html>
