<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>SARVESTO — offline</title>

<style>
  html,body{margin:0;height:100%}
  body{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:32px;box-sizing:border-box;
    background:#fff;color:#0a0a0a;text-align:center;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .w{max-width:340px}
  .mark{color:#0a0a0a;font-family:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;font-size:26px;letter-spacing:.34em;padding-left:.34em;margin:0 0 34px}
  h1{font-family:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;font-weight:400;font-size:28px;margin:0 0 12px}
  p{color:#6b6b6b;font-size:14px;line-height:1.6;margin:0 0 6px}
  a{display:inline-block;margin-top:28px;padding:15px 34px;background:#000;color:#fff;text-decoration:none;
    font-size:11px;letter-spacing:.22em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="w">
    <p class="mark">SARVESTO.</p>
    <h1>You are offline</h1>
    <p>Check your connection — the collection is one tap away.</p>
    <p lang="de">Keine Verbindung. Bitte prüfen Sie Ihr Netz.</p>
    <a href="https://sarvesto.com/?source=app">Try again</a>
  </div>
<script>
  // Bağlantı gelince mağazaya dön
  function go(){ location.href = 'https://sarvesto.com/?source=app'; }
  window.addEventListener('online', go);
  setInterval(function(){ if (navigator.onLine) go(); }, 5000);
</script>
</body>
</html>
