    <path d="M520 430h56M576 430h56M632 430h56"/>
    <circle cx="520" cy="430" r="14"/><circle cx="632" cy="430" r="14"/><circle cx="744" cy="430" r="14"/>
    <path d="M688 430h42"/>
    <!-- stok istifi -->
    <rect x="880" y="386" width="184" height="40" rx="6"/>
    <rect x="880" y="434" width="184" height="40" rx="6"/>
    <rect x="880" y="482" width="184" height="40" rx="6"/>
  </g>
  <g fill="#f0c9a0" opacity=".2">
    <rect x="712" y="234" width="104" height="52" rx="6"/>
    <rect x="712" y="298" width="66" height="9" rx="4"/>
    <rect x="898" y="398" width="70" height="16" rx="5"/>
    <rect x="898" y="446" width="70" height="16" rx="5"/>
