    <!-- marka: tescil muhru (ic ice halka + kurdele) -->
    <circle cx="546" cy="240" r="46"/>
    <circle cx="546" cy="240" r="28"/>
    <path d="M524 282l-14 46 36-18 36 18-14-46"/>
    <!-- ilan kartlari -->
    <rect x="672" y="196" width="132" height="112" rx="10"/>
    <rect x="700" y="216" width="132" height="112" rx="10"/>
