<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
  <title>A single small contract sheet on one side of a divide, and a cluster of brand, listing, supplier and stock blocks on the other</title>
  <desc>The account is a contract. What a buyer pays for is everything standing around it.</desc>
  <rect width="1200" height="675" fill="#3a2016"/>
  <g stroke="#7a4026" stroke-width="1"><path d="M0 168h1200M0 337h1200M0 506h1200"/></g>
  <!-- SOL: sozlesme sayfasi = hesap -->
  <g fill="none" stroke="#f0c9a0" stroke-width="3">
    <path d="M112 214h158l46 46v202H112z"/>
    <path d="M270 214v46h46"/>
  </g>
  <g fill="#f0c9a0" opacity=".24">
    <rect x="140" y="296" width="132" height="10" rx="5"/>
    <rect x="140" y="324" width="108" height="10" rx="5"/>
    <rect x="140" y="352" width="132" height="10" rx="5"/>
    <rect x="140" y="380" width="86" height="10" rx="5"/>
  </g>
  <!-- Ayirici -->
  <path d="M394 176v324" stroke="#f0c9a0" stroke-width="2" stroke-dasharray="10 12" opacity=".5"/>
