  <!-- 3 baska perakendeciye toptan: kamyon -->
  <g fill="none" stroke="#7fc9a6" stroke-width="3"><rect x="836" y="288" width="56" height="40" rx="3"/><path d="M892 302h20l14 14v12h-34z"/><circle cx="854" cy="336" r="8" fill="#0e2620"/><circle cx="910" cy="336" r="8" fill="#0e2620"/></g>
