  <g fill="none" stroke="#7fc9a6" stroke-width="3"><rect x="844" y="388" width="72" height="52" rx="4"/></g><path d="M880 428c-22 -12 -24 -28 -12 -32c6 -2 10 2 12 6c2 -4 6 -8 12 -6c12 4 10 20 -12 32z" fill="#7fc9a6" opacity=".6"/>
