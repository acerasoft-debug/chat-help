<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
  <title>Cartons with five arrows fanning out to a tag, a shop, a truck, a heart box and a loop, and one faint path to a struck-out flame</title>
  <desc>Where unsold stock goes now: markdown, outlet, wholesale to other retailers, donation or remanufacture; destruction only through a documented exception.</desc>
  <rect width="1200" height="675" fill="#0e2620"/>
  <g stroke="#1b4a3a" stroke-width="1"><path d="M0 168h1200M0 337h1200M0 506h1200"/></g>
  <!-- Kaynak: satilmamis sezon stogu -->
  <g fill="none" stroke="#7fc9a6" stroke-width="3"><rect x="110" y="356" width="130" height="60" rx="6"/><rect x="110" y="290" width="130" height="60" rx="6"/><rect x="140" y="224" width="130" height="60" rx="6"/></g>
  <g fill="#7fc9a6" opacity=".25"><rect x="128" y="378" width="50" height="10" rx="5"/><rect x="128" y="312" width="50" height="10" rx="5"/><rect x="158" y="246" width="50" height="10" rx="5"/></g>
  <!-- Bes acik yol -->
  <g fill="none" stroke="#7fc9a6" stroke-width="3" opacity=".8"><path d="M270 330C490 330 620 118 790 118"/><path d="M270 330C490 330 620 216 790 216"/><path d="M270 330C490 330 620 314 790 314"/><path d="M270 330C490 330 620 412 790 412"/><path d="M270 330C490 330 620 510 790 510"/></g>
  <path d="M806.0 118.0L788.0 126.0L788.0 110.0z" fill="#7fc9a6" opacity=".8"/>
  <path d="M806.0 216.0L788.0 224.0L788.0 208.0z" fill="#7fc9a6" opacity=".8"/>
  <path d="M806.0 314.0L788.0 322.0L788.0 306.0z" fill="#7fc9a6" opacity=".8"/>
  <path d="M806.0 412.0L788.0 420.0L788.0 404.0z" fill="#7fc9a6" opacity=".8"/>
  <path d="M806.0 510.0L788.0 518.0L788.0 502.0z" fill="#7fc9a6" opacity=".8"/>
  <!-- 1 indirimle satis: etiket + asagi ok -->
  <g fill="none" stroke="#7fc9a6" stroke-width="3"><path d="M846 98h46l24 20l-24 20h-46z"/><circle cx="888" cy="118" r="4"/></g><path d="M942 100v30" stroke="#7fc9a6" stroke-width="3"/><path d="M942.0 140.0L935.0 128.0L949.0 128.0z" fill="#7fc9a6" opacity=".8"/>
