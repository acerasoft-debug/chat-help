<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
  <title>A grid of stock cells feeding through a single channel that fans out to two display surfaces</title>
  <desc>The catalogue feeds everything downstream — shopping tags, the shop tab and every dynamic ad.</desc>
  <rect width="1200" height="675" fill="#3a2016"/>
  <g stroke="#7a4026" stroke-width="1"><path d="M0 168h1200M0 337h1200M0 506h1200"/></g>
  <!-- SOL: stok izgarasi (katalog) -->
  <g fill="#f0c9a0" opacity=".26">
    <rect x="96" y="176" width="82" height="96" rx="6"/><rect x="192" y="176" width="82" height="96" rx="6"/>
    <rect x="96" y="288" width="82" height="96" rx="6"/><rect x="192" y="288" width="82" height="96" rx="6"/>
    <rect x="96" y="400" width="82" height="96" rx="6"/><rect x="192" y="400" width="82" height="96" rx="6"/>
  </g>
  <g fill="none" stroke="#f0c9a0" stroke-width="2" opacity=".85">
    <rect x="96" y="176" width="178" height="320" rx="10"/>
  </g>
  <!-- ORTA: tek kanalda birlesen besleme -->
  <g fill="none" stroke="#f0c9a0" stroke-width="3">
    <path d="M274 224c110 0 110 112 176 112"/>
    <path d="M274 336h176"/>
    <path d="M274 448c110 0 110-112 176-112"/>
  </g>
  <rect x="450" y="318" width="196" height="36" rx="18" fill="none" stroke="#f0c9a0" stroke-width="3"/>
  <g fill="#f0c9a0"><circle cx="498" cy="336" r="5"/><circle cx="548" cy="336" r="5"/><circle cx="598" cy="336" r="5"/></g>
  <!-- SAG: ayni beslemeden cikan iki yuzey -->
  <g fill="none" stroke="#f0c9a0" stroke-width="3">
    <path d="M646 336c96 0 96-116 168-116"/>
    <path d="M646 336c96 0 96 116 168 116"/>
    <rect x="814" y="150" width="156" height="140" rx="12"/>
    <rect x="814" y="384" width="156" height="140" rx="12"/>
  </g>
  <g fill="#f0c9a0" opacity=".22">
    <rect x="836" y="172" width="112" height="60" rx="6"/><rect x="836" y="244" width="72" height="9" rx="4"/>
    <rect x="836" y="406" width="112" height="60" rx="6"/><rect x="836" y="478" width="72" height="9" rx="4"/>
  </g>
</svg>
