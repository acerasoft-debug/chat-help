<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VESTRA — offline</title>
<!-- Everything here is inline on purpose: this page is shown precisely when the
     network is gone, so it cannot depend on the stylesheet or the web fonts. -->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 32px;
    background: #0e0e11; color: #f4f1ec;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
  }
  .wrap { max-width: 380px; }
  .mark { font-size: 26px; letter-spacing: 5px; font-weight: 700; margin: 0 0 28px; }
  .mark b { color: #c9a86a; font-weight: 700; }
  .ring {
    width: 60px; height: 60px; margin: 0 auto 22px; border-radius: 50%;
    border: 1px solid rgba(201,168,106,.35); display: grid; place-items: center;
  }
  h1 { font-size: 19px; margin: 0 0 10px; font-weight: 600; }
  p { color: #9d9aa3; font-size: 14.5px; line-height: 1.6; margin: 0 0 26px; }
  button {
    font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;
    background: #c9a86a; color: #14140f; border: 0; border-radius: 999px; padding: 13px 30px;
  }
  button:active { opacity: .85; }
  .note { margin-top: 22px; font-size: 12.5px; color: #6f6d76; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="mark">VES<b>T</b>RA</p>
    <div class="ring" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#c9a86a" stroke-width="1.6" stroke-linecap="round">
        <path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5.5 5.5 0 0 1 7 0"/>
        <circle cx="12" cy="19.5" r=".9" fill="#c9a86a" stroke="none"/><path d="M3 3l18 18"/>
      </svg>
    </div>
    <h1 id="t">You are offline</h1>
    <p id="b">VESTRA needs a connection for live prices, orders and messages, so there is nothing safe to show from memory.</p>
    <button type="button" id="r" onclick="location.reload()">Try again</button>
    <p class="note" id="n">Reconnect and this page will pick up where you left off.</p>
  </div>
  <script>
    /* The site speaks nine languages; its offline page spoke only English. This
       page is served by the service worker precisely when the server cannot be
       reached, so it cannot ask PHP for the language: it reads the same vlang
       cookie the site set, then the device language. English stays in the HTML
       above, so a blocked script still shows a finished page. */
    (function () {
      var L = {
        de: ['Sie sind offline', 'VESTRA braucht eine Verbindung für Live-Preise, Bestellungen und Nachrichten — aus dem Speicher lässt sich nichts verlässlich anzeigen.', 'Erneut versuchen', 'Sobald Sie wieder online sind, geht es hier weiter.'],
        fr: ['Vous êtes hors ligne', 'VESTRA a besoin d’une connexion pour les prix en direct, les commandes et les messages : rien ne peut être affiché de façon fiable depuis la mémoire.', 'Réessayer', 'Reconnectez-vous et cette page reprendra là où vous en étiez.'],
        it: ['Sei offline', 'VESTRA ha bisogno di una connessione per prezzi in tempo reale, ordini e messaggi: dalla memoria non c’è nulla di affidabile da mostrare.', 'Riprova', 'Riconnettiti e questa pagina riprenderà da dove eri rimasto.'],
        es: ['Estás sin conexión', 'VESTRA necesita conexión para los precios en directo, los pedidos y los mensajes: no hay nada fiable que mostrar desde la memoria.', 'Reintentar', 'Vuelve a conectarte y esta página continuará donde lo dejaste.'],
        pt: ['Está offline', 'A VESTRA precisa de ligação para preços em tempo real, encomendas e mensagens — não há nada fiável para mostrar a partir da memória.', 'Tentar novamente', 'Volte a ligar-se e esta página continua onde ficou.'],
        ru: ['Нет подключения', 'Для актуальных цен, заказов и сообщений VESTRA нужна сеть — показывать сохранённые данные было бы ненадёжно.', 'Повторить', 'Как только связь появится, страница продолжит с того же места.'],
        ar: ['أنت غير متصل', 'تحتاج VESTRA إلى اتصال لعرض الأسعار المباشرة والطلبيات والرسائل، ولا يوجد ما يمكن عرضه بشكل موثوق من الذاكرة.', 'إعادة المحاولة', 'أعد الاتصال وستتابع هذه الصفحة من حيث توقفت.'],
        ja: ['オフラインです', 'VESTRAの最新価格・注文・メッセージの表示にはインターネット接続が必要です。保存データからは正確な情報を表示できません。', '再試行', '接続が回復すると、このページは中断したところから再開します。']
      };
      var m = /(?:^|;\s*)vlang=([a-z]{2})/.exec(document.cookie || '');
      var l = (m && m[1]) || String(navigator.language || 'en').slice(0, 2).toLowerCase();
      var t = L[l];
      if (!t) return;
      document.documentElement.lang = l;
      if (l === 'ar') document.documentElement.dir = 'rtl';
      document.getElementById('t').textContent = t[0];
      document.getElementById('b').textContent = t[1];
      document.getElementById('r').textContent = t[2];
      document.getElementById('n').textContent = t[3];
      document.title = 'VESTRA — ' + t[0];
    })();
    // Reload by itself the moment the device is back online.
    addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
