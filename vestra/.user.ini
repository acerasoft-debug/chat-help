; VESTRA — PHP yukleme sinirlari (2 Eyl 2026).
;
; Belge yuklemesi (buyer/seller ?tab=kyc) uygulama tarafinda 10 MB ile sinirli
; (auth_doc_max_bytes); urun fotografi 5 MB, line sheet 8 MB. Sunucunun kendi
; php.ini degeri bunlardan KUCUKSE (cPanel varsayilani cogu zaman 2M/8M) telefon
; fotografi daha PHP'ye ulasmadan duser: upload_max_filesize asiminda
; UPLOAD_ERR_INI_SIZE, post_max_size asiminda ise $_POST tumden bos -- handler
; hic calismaz, sayfa sessizce yeniden yuklenir. Bir alici bu yuzden belgesini
; iki gun yukleyemedi.
;
; .user.ini PHP-FPM / LSAPI altinda dizin bazinda okunur (5 dk onbellek);
; degerler php.ini'yi yalnizca BU dizin icin ezer. Uygulama sinirlarini
; asmiyor: 10 MB'lik tavan kodda duruyor, burasi sadece PHP'nin ondan once
; kesmemesini sagliyor.
upload_max_filesize = 16M
post_max_size = 20M
max_file_uploads = 20
