; VESTRA — PHP yukleme sinirlari (2 Eyl 2026).
;
; Belge yuklemesi (buyer/seller ?tab=kyc) uygulama tarafinda 10 MB ile sinirli
; (auth_doc_max_bytes); urun fotografi 5 MB x 6, line sheet 8 MB -- yani tek bir
; urun formu 38 MB'a kadar govde tasiyabilir. upload_max_filesize asiminda PHP
; UPLOAD_ERR_INI_SIZE verir; post_max_size asiminda ise $_POST tumden bos
; kalir -- handler hic calismaz, sayfa sessizce yeniden yuklenir.
;
; SUNUCUNUN KENDI DEGERI (diag-messages upload_probe, 2 Eyl 2026):
; /opt/alt/php83/etc/php.ini -> upload_max_filesize=32M, post_max_size=32M.
; Bu dosya o degerlerin ALTINA INMEMELI: ilk surumu 16M/20M yaziyordu ve
; sunucunun 32M'sini asagi cekiyordu -- alti fotografli bir urun formu artik
; gecmezdi. Burada yalnizca post_max_size, urun formunun tamamini alacak
; kadar yukseltiliyor; upload_max_filesize sunucuyla ayni kaliyor.
;
; .user.ini PHP-FPM / LSAPI altinda dizin bazinda okunur (5 dk onbellek).
upload_max_filesize = 32M
post_max_size = 48M
max_file_uploads = 20
