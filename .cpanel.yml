---
# cPanel "Git Version Control" dağıtım tarifi.
# KULLANICIADI yerine kendi cPanel kullanıcı adınızı yazın
# (cPanel ana sayfasında sağ üstte görünür).
deployment:
  tasks:
    - export DEPLOYPATH=/home/KULLANICIADI/public_html
    - /bin/cp -R yeminli-tercume/index.html $DEPLOYPATH/
    - /bin/cp -R yeminli-tercume/404.html $DEPLOYPATH/
    - /bin/cp -R yeminli-tercume/robots.txt $DEPLOYPATH/
    - /bin/cp -R yeminli-tercume/assets $DEPLOYPATH/
    - /bin/cp -R yeminli-tercume/sirket-kurulumu $DEPLOYPATH/
